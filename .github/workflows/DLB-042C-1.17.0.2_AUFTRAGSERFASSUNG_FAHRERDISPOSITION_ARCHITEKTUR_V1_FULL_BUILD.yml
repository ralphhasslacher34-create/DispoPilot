        DLB042C_PATCH
        python3 - <<'PY_PATCH_042C'
        from pathlib import Path
        import base64, json, subprocess
        root=Path('spfx-build/src/webparts')
        files=[p for p in root.rglob('*') if p.is_file() and p.suffix in {'.js','.ts','.tsx'}]
        hits=[]
        for p in files:
            s=p.read_text(encoding='utf-8')
            if '__DISPOLUX_041J' in s and "version:'1.16.0.42'" in s and '__DISPOLUX_041I' in s:
                hits.append((p,s))
        if len(hits)!=1: raise SystemExit(f'042C: 041J-Runtime {len(hits)}x statt genau 1x gefunden.')
        runtime,s=hits[0]
        if '__DISPOLUX_042A' in s or '__DISPOLUX_042B' in s:
            raise SystemExit('042C: 42A/42B duerfen nicht Bestandteil der Basis sein.')
        patch=base64.b64decode(Path('/tmp/dlb042c_patch.b64').read_text()).decode('utf-8')
        Path('/tmp/dlb042c_patch.js').write_text(patch,encoding='utf-8',newline='\n')
        subprocess.run(['node','--check','/tmp/dlb042c_patch.js'],check=True)
        marker='/* DP13_PATCH_END */'
        if s.count(marker)!=1: raise SystemExit(f'042C: DP13-Endmarker {s.count(marker)}x statt 1x.')
        s=s.replace(marker,patch+'\n\n'+marker,1)
        runtime.write_text(s,encoding='utf-8',newline='\n')
        if runtime.suffix=='.js': subprocess.run(['node','--check',str(runtime)],check=True)
        pkg=Path('spfx-build/config/package-solution.json')
        data=json.loads(pkg.read_text(encoding='utf-8'))
        old=data.get('solution',{}).get('version')
        if old!='1.3.6.136': raise SystemExit(f'042C: erwartete 041J-SPFx-Version 1.3.6.136, gefunden {old!r}.')
        data['solution']['version']='1.3.6.139'
        pkg.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
        print('042C PATCH OK:',runtime)
        PY_PATCH_042C
    - name: Validate DLB-042C source before build
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY_VALIDATE_042C'
        from pathlib import Path
        import json, subprocess
        root=Path('spfx-build/src/webparts')
        files=[p for p in root.rglob('*') if p.is_file() and p.suffix in {'.js','.ts','.tsx'}]
        hits=[];combined=[]
        for p in files:
            s=p.read_text(encoding='utf-8');combined.append(s)
            if '__DISPOLUX_042C' in s:hits.append((p,s))
        if len(hits)!=1: raise SystemExit(f'042C VALIDIERUNG: Patch {len(hits)}x statt genau 1x gefunden.')
        runtime,s=hits[0];alltext='\n'.join(combined)
        base=['__DISPOLUX_041J',"version:'1.16.0.42'",'__DISPOLUX_041I','dp41NetLive','dp41PlanDocs','DispoLux_Auftragsdokumente','netWeightKg','btRecord','plannedBinMaterials','actualBinMaterials','actualExistingBinMaterials','DispoLux:036D:offlineOutbox:v1','Systemstandort','GPS-Standort']
        missing=[x for x in base if x not in alltext]
        if missing: raise SystemExit('042C VALIDIERUNG Basis fehlt: '+', '.join(missing))
        req=['__DISPOLUX_042C',"version:'1.17.0.2'","base:'DLB-041J-1.16.0.42'",'dp42cSide','Auftragserfassung','Dispositionsliste','Dispositionsgrafik','Containerdienst','Transporte','Schüttgut','Fahrauftrag','Wer will wo was?','undisponiert','data-drop-driver','draggable="true"','Stamm-LKW','plannedMinutes','Bestehende Detailfunktionen','In Arbeit','Unterbrochen','dp42cOpenIntake']
        missing=[x for x in req if x not in s]
        if missing: raise SystemExit('042C VALIDIERUNG Architektur fehlt: '+', '.join(missing))
        bad=[x for x in ['__DISPOLUX_042A','__DISPOLUX_042B'] if x in s]
        if bad: raise SystemExit('042C VALIDIERUNG enthaelt verbotene Zwischenbuilds: '+', '.join(bad))
        pkg=json.loads(Path('spfx-build/config/package-solution.json').read_text(encoding='utf-8'))
        if pkg.get('solution',{}).get('version')!='1.3.6.139': raise SystemExit('042C VALIDIERUNG: SPFx-Version ist nicht 1.3.6.139.')
        if runtime.suffix=='.js': subprocess.run(['node','--check',str(runtime)],check=True)
        print('042C QUELLVALIDIERUNG OK')
        PY_VALIDATE_042C
    - name: Build and package DLB-042C
      shell: bash
      run: |
        set -euo pipefail
        rm -rf spfx-build/release spfx-build/temp/deploy spfx-build/sharepoint/solution
        (cd spfx-build && npx heft build --production)
        (cd spfx-build && npx heft package-solution --production)
        rm -rf artifact/UPLOAD_TO_SITEASSETS artifact/UPLOAD_TO_APP_CATALOG
        mkdir -p artifact/UPLOAD_TO_SITEASSETS artifact/UPLOAD_TO_APP_CATALOG
        PKG=$(find spfx-build/sharepoint/solution -maxdepth 1 -type f -name '*.sppkg' | head -n1)
        test -n "$PKG"
        cp "$PKG" artifact/UPLOAD_TO_APP_CATALOG/DispoPilot_Online_V1.3_SPFX_FINAL.sppkg
        if [ -d spfx-build/release/assets ]; then cp -a spfx-build/release/assets/. artifact/UPLOAD_TO_SITEASSETS/
        elif [ -d spfx-build/temp/deploy ]; then cp -a spfx-build/temp/deploy/. artifact/UPLOAD_TO_SITEASSETS/
        else echo '042C: Keine SPFx Asset-Ausgabe gefunden.' >&2; exit 1; fi
    - name: Validate emitted DLB-042C package
      shell: bash
      run: |
        set -euo pipefail
        COUNT=0
        while IFS= read -r -d '' JS; do test -s "$JS"; node --check "$JS"; COUNT=$((COUNT+1)); done < <(find artifact/UPLOAD_TO_SITEASSETS -maxdepth 1 -type f -name '*.js' -print0)
        test "$COUNT" -gt 0
        test -s artifact/UPLOAD_TO_APP_CATALOG/DispoPilot_Online_V1.3_SPFX_FINAL.sppkg
        python3 - <<'PY_FINAL_042C'
        from pathlib import Path
        js=list(Path('artifact/UPLOAD_TO_SITEASSETS').glob('*.js'));hits=[]
        for p in js:
            s=p.read_text(encoding='utf-8')
            if '__DISPOLUX_042C' in s and '1.17.0.2' in s:hits.append((p,s))
        if len(hits)!=1: raise SystemExit(f'042C FINAL: Produktionsbundle {len(hits)}x statt genau 1x.')
        p,s=hits[0]
        required=['__DISPOLUX_041J','1.16.0.42','__DISPOLUX_042C','1.17.0.2','Auftragserfassung','Dispositionsliste','Dispositionsgrafik','data-drop-driver','Stamm-LKW','dp41NetLive','dp41PlanDocs','DispoLux_Auftragsdokumente','netWeightKg','btRecord','plannedBinMaterials','actualBinMaterials','actualExistingBinMaterials','DispoLux:036D:offlineOutbox:v1']
        missing=[x for x in required if x not in s]
        if missing: raise SystemExit('042C FINAL fehlt: '+', '.join(missing))
        bad=[x for x in ['__DISPOLUX_042A','__DISPOLUX_042B'] if x in s]
        if bad: raise SystemExit('042C FINAL enthaelt verbotene Zwischenbuilds: '+', '.join(bad))
        print('042C PAKETVALIDIERUNG OK:',p.name)
        PY_FINAL_042C
        cat > artifact/REIHENFOLGE.txt <<'TXT'
        DLB-042C-1.17.0.2 · AUFTRAGSERFASSUNG + FAHRERDISPOSITION ARCHITEKTUR V1 · SPFx 1.3.6.139

        Verbindliche Basis:
        - direkt DLB-041J / Produkt 1.16.0.42 / SPFx 1.3.6.136
        - DLB-042A und DLB-042B sind ausdruecklich NICHT Bestandteil der Basis
        - alle vorhandenen 041J-Funktionen bleiben technisch bestehen

        Architektur 42C:
        1. Alte Planungsliste bleibt Ebene 1 des Moduls Auftragserfassung und Planung.
        2. Linke Navigation: Uebersicht, Auftragserfassung, Dispositionsliste, Dispositionsgrafik.
        3. Auftragserfassung startet mit Auftragsart-Auswahl; nicht lizenzierte Module sichtbar, aber gesperrt.
        4. Containerdienst erfasst nur wer/wo/was; Fahrer/LKW/Reihenfolge werden erst disponiert.
        5. Dispositionsliste und Dispositionsgrafik zeigen dieselben Auftraege.
        6. Grafik disponiert Fahrer, nicht LKW. Undisponierte Auftraege stehen oben.
        7. Drag & Drop ordnet Fahrer, Reihenfolge und geplanten Start zu.
        8. Auftragstyp wird zusaetzlich zum Status ueber ein Symbol kenntlich gemacht.
        9. In Arbeit blinkt; Unterbrochen bleibt als Dauerfarbe sichtbar.
        10. Vollbild-Detailansicht fuer die Disposition mit Fahrer, LKW, Reihenfolge, Dauer, Mulde, Material und Entsorger/Abladestelle.
