emExit('042H VALIDIERUNG enthaelt verbotene Zwischenbuilds: '+', '.join(bad))\npkg=json.loads(Path('spfx-build/config/package-solution.json').read_text(encoding='utf-8'))\nif pkg.get('solution',{}).get('version')!='1.3.6.144': raise SystemExit('042H VALIDIERUNG: SPFx-Version ist nicht 1.3.6.144.')\nif runtime.suffix=='.js': subprocess.run(['node','--check',str(runtime)],check=True)\nprint('042H QUELLVALIDIERUNG OK')\nPY_VALIDATE_042H\n"
