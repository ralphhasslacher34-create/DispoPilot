lich NICHT Bestandteil der Basis\n- alle vorhandenen 041J-Funktionen bleiben technisch bestehen\n\nArchitektur 42C:\n1. Alte Planungsliste bleibt Ebene 1 des Moduls Auftragserfassung und Planung.\n2. Linke Navigation: Uebersicht, Auftragserfassung, Dispositionsliste, Dispositionsgrafik.\n3. Auftragserfassung startet mit Auftragsart-Auswahl; nicht lizenzierte Module sichtbar, aber gesperrt.\n4. Containerdienst erfasst nur wer/wo/was; Fahrer/LKW/Reihenfolge werden erst disponiert.\n5. Dispositionsliste und Dispositionsgrafik zeigen dieselben Auftraege.\n6. Grafik disponiert Fahrer, nicht LKW. Undisponierte Auftraege stehen oben.\n7. Drag & Drop ordnet Fahrer, Reihenfolge und geplanten Start zu.\n8. Auftragstyp wird zusaetzlich zum Status ueber ein Symbol kenntlich gemacht.\n9. In Arbeit blinkt; Unterbrochen bleibt als Dauerfarbe sichtbar.\n10. Vollbild-Detailansicht fuer die Disposition mit Fahrer, LKW, Reihenfolge, Dauer, Mulde, Material und Entsorger/Abladestelle.\n11. Stamm-LKW wird bei Fahrerwahl vorgeschlagen, bleibt aenderbar.\n12. Erfahrungswert fuer geplante Dauer: aus vergleichbaren Altauftraegen, sonst 60 Minuten.\n13. Bestehende Detailfunktionen bleiben erreichbar fuer Abschluss, Zeit, Wiegen, Material, Dokumente, GPS, Offline und Rapport.\n\nPflicht-Praxistest:\nA. Hauptmenue -> Planung: bekannte Kopfzeile und alte Listenansicht muessen unveraendert erreichbar sein.\nB. Neuer Auftrag: zuerst Auftragsart-Auswahl; kein Fahrer/LKW/Reihenfolge-Feld in der Auftragserfassung.\nC. Containerdienst Auftrag anlegen und speichern; danach als undisponiert in Liste und Grafik sichtbar.\nD. Grafik: Auftrag per Drag & Drop einem Fahrer zuordnen; Stamm-LKW-Vorschlag, Reihenfolge und geplanter Start pruefen.\nE. Klick auf Auftrag -> Detailansicht; speichern -> zur vorherigen Liste/Grafik zurueck.\nF. Status In Arbeit muss blinken; Unterbrochen darf nicht blinken.\nG. Alte Funktionen regressionspruefen: Datum vor/zurueck, Bearbeiten, Start/Pause/Weiter/Ausgefuehrt, Nicht ausgefuehrt, Mulden, Material, Wiegen, Dokumente, GPS, Rapport, Offline-Outbox, Archiv.\n\nDLB-042N Zusatztests:\nH. Materialauswahl Containerdienst muss aus dem bestehenden aktuellen Mulden-Materialkatalog kommen; state.materials darf nicht als Quelle dienen.\nI. Offene Formulare in Auftragserfassung UND Disposition dürfen durch Auto-Sync/Refresh keine Eingaben verlieren.\nJ. Dispositionsgrafik: freie Lücken müssen erhalten bleiben; nur echte Kollisionen verschieben Folgeaufträge.\nK. Kunden-Zeitfenster ist vom gesamten Fahrerblock getrennt; Warnung nur bei unplausibler Lage des Fensters.\nL. Auftragserfassung zeigt Tagesauslastung: gebucht, disponiert, fachfremd gebunden, Restkapazität und Warnstufe.\nM. Haupttätigkeit ist jeweils das erste Tätigkeitsfeld eines Fahrers; weitere Tätigkeiten sind flexible Ersatzqualifikationen.\nN. Hauptmenue zeigt dauerhaft „Auftragserfassung und Disposition“ sowie „Fahrauftrag“.\nO. In Arbeit = gelb blinkend; Unterbrochen = gelb dauerhaft.\nP. Administration: fester Notfall-Recovery-Button raus; Recovery nur für Admin mit auswählbarem Sicherungsstand / Backupdatei und Sicherheitsabfrage.\nQ. Daueränderung verschiebt Folgeaufträge nur bei Kollision; Kunden-Zeitfenster haben Vorrang und lösen bei Konflikt eine Abfrage aus.\nR. Materialliste ausschließlich aus AVV-Materialkatalog via dpR1MaterialOptions.\nS. Kapazität verwendet vorhandene Soll-Arbeitszeit aus Mitarbeiterstamm.\nT. Mitarbeiterstamm: Tätigkeitsfelder; erste Tätigkeit = Haupttätigkeit.\nU. Mehrmuldenbedarf gleicher/verschiedener Art in Auftragserfassung; Disposition kann in mehrere Fahraufträge aufteilen.\nV. parentCustomerOrderId erhält den gemeinsamen Ursprung bei Aufteilung.\nTXT\n"
