me,s=hits[0]\nif 'DP_DLB_042N_1_17_0_13_HARDENING_BEGIN' in s:\n    raise SystemExit('042N: Patch bereits vorhanden.')\n\n# 039B-Festbutton direkt an seiner echten Quelle deaktivieren.\nold_ui=\"\"\"if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>setTimeout(dp39InstallUi,1000),{once:true});\n            else setTimeout(dp39InstallUi,1000);\n            setTimeout(dp39InstallUi,4000);\"\"\"\nnew_ui=\"\"\"/* DLB-042N: fester Notfall-Recovery-Button dauerhaft deaktiviert.\n               Recovery erfolgt ausschließlich über Administration -> Datensicherung & Wiederherstellung. */\n            try{document.getElementById('dp39RecoveryControl')?.remove();}catch(_){}\"\"\"\nif s.count(old_ui)!=1:\n    raise SystemExit(f'042N: 039B-UI-Startblock {s.count(old_ui)}x statt genau 1x gefunden.')\ns=s.replace(old_ui,new_ui,1)\n\n# Materialliste der 42-Erfassung direkt auf denselben 040C/41-Stamm setzen.\nstart=s.find('  function materialList(){', s.find('DP_DLB_042H_1_17_0_7'))\nend=s.find('\\n  function containerTypes()',start)\nif start<0 or end<=start:\n    raise SystemExit('042N: 42H-materialList nicht eindeutig gefunden.')\nold_material=s[start:end]\nif 'dpR1MaterialOptions' not in old_material:\n    raise SystemExit('042N: erwartete 42H-Materialfunktion weicht ab.')\nnew_material=r\"\"\"  function materialList(){\n    const out=[],seen=new Set(),add=(value,label)=>{\n      value=t(value);label=t(label||value);if(!value)return;\n      const key=value.toLocaleLowerCase('de');if(seen.has(key))return;seen.add(key);out.push({value,label})\n    };\n    try{\n      if(typeof dp40cMasterMaterialRows==='function'){\n        (dp40cMasterMaterialRows('')||[]).forEach(x=>add(x?.value,x?.label||x?.value));\n        return out;\n      }\n      if(typeof dpR1MaterialOptions==='function'){\n        const taskEl=typeof $==='function'?$('oTask'):document.getElementById('oTask');\n        const before=taskEl?taskEl.value:null;\n        let html='';\n        try{\n          if(taskEl&&t(taskEl.value)==='Stellen')taskEl.value='Abholen';\n          html=String(dpR1MaterialOptions('')||'');\n        }finally{if(taskEl&&before!==null)taskEl.value=before}\n        const probe=document.createElement('select');probe.innerHTML=html;\n        Array.from(probe.options||[]).forEach(opt=>{\n          const v=t(opt.value),lab=t(opt.textContent||opt.label||v);\n          if(v&&v.toLocaleLowerCase('de')!=='leer')add(v,lab)\n        });\n      }\n    }catch(e){console.warn('42J Materialstamm',e)}\n    return out;\n  }\"\"\"\ns=s[:start]+new_material+s[end:]\n\ns=s.replace(\n    \"materialList().map(x=>`<option ${t(x)===t(r.material)?'selected':''}>${eh(x)}</option>`).join('')\",\n    \"materialList().map(x=>`<option value=\\\"${eh(x.value)}\\\" ${t(x.value)===t(r.material)?'selected':''}>${eh(x.label)}</option>`).join('')\"\n)\ns=s.replace(\n    \"materialList().map(x=>`<option>${eh(x)}</option>`).join('')\",\n    \"materialList().map(x=>`<option value=\\\"${eh(x.value)}\\\">${eh(x.label)}</option>`).join('')\"\n)\n\n# 42J-Hardening einfügen.\npatch=base64.b64decode(Path('/tmp/dlb042n_patch.b64').read_text()).decode('utf-8')\nPath('/tmp/dlb042n_patch.js').write_text(patch,encoding='utf-8',newline='\\n')\nsubprocess.run(['node','--check','/tmp/dlb042n_patch.js'],check=True)\nmarker='/* DP13_PATCH_END */'\nif s.count(marker)!=1:\n    raise SystemExit(f'042N: DP13-Endmarker {s.count(marker)}x statt genau 1x.')\ns=s.replace(marker,patch+'\\n\\n'+marker,1)\nruntime.write_text(s,encoding='utf-8',newline='\\n')\nif runtime.suffix=='.js': subprocess.run(['node','--check',str(runtime)],check=True)\n\n# Direktprüfung exakt der gerade geschriebenen Datei.\nwritten=runtime.read_text(encoding='utf-8')\nchecks={\n    'BEGIN':written.count('DP_DLB_042N_1_17_0_13_HARDENING_BEGIN')==1,\n    'END':written.count('DP_DLB_042N_1_17_0_13_HARDENING_END')==1,\n    'RUNTIME':'__DISPOLUX_042N' in written,\n    'VERSION':\"version:'1.17.0.13'\" in written,\n    'MENU':'Auftragserfassung und Disposition' in written and 'Fahrauftrag' in written,\n    'RECOVERY':'dp42iMountRecovery' in written and 'dp42iListBackups' in written,\n    'KOLLISION':'dp42iResolveCollision' in written,\n    'FAHRER':'dp42iMountDriverActivities' in written,\n    'DATUM':'dp42iApplySelectedDate' in written,\n    'MATERIAL':\"typeof dp40cMasterMaterialRows==='function'\" in written,\n}\nbad=[k for k,v in checks.items() if not v]\nif bad: raise SystemExit('042N DIREKTPRÜFUNG fehlgeschlagen: '+', '.join(bad))\n\npkg=Path('spfx-build/config/package-solution.json')\ndata=json.loads(pkg.read_text(encoding='utf-8'))\nold=data.get('solution',{}).get('version')\nif old!='1.3.6.144':\n    raise SystemExit(f'042N: erwartete 42H-SPFx-Version 1.3.6.144, gefunden {old!r}.')\ndata['solution']['version']='1.3.6.150'\npkg.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\\n',encoding='utf-8')\nprint('042N PATCH + DIREKTPRÜFUNG OK:',runtime)\nPY_PATCH_042N\n"
    - name: Validate DLB-042N source before build
