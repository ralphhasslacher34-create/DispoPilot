ngify(before)!==JSON.stringify(after)){\n        dp41ApplyManualTimeEdits(o,before,after);dp41EnsureTime(o);o.workTimeCorrections.push({at:dp41NowIso(),by:dp41Text(state?.user?.name||''),before,after,effectiveSegments:dp41Clone(o.workSegments),pauseAdjustmentMinutes:Number(o.workPauseAdjustmentMinutes||0),source:'Zusatzdaten'});if(o.workTimeCorrections.length>100)o.workTimeCorrections=o.workTimeCorrections.slice(-100);\n      }\n      dp41StoreTimes(o,{syncLegacy:false});\"\"\"\nif src.count(old_corr)!=1: raise SystemExit(f'041J: Zeitkorrekturblock {src.count(old_corr)}x statt 1x.')\nsrc=src.replace(old_corr,new_corr,1)\n\nif src.count(\"if(!await dp41PrepareCompletion(o))return;\")!=1: raise SystemExit('041J: Finish-Vorbereitung nicht eindeutig.')\nsrc=src.replace(\"if(!await dp41PrepareCompletion(o))return;\",\"if(!await dp41PrepareCompletion(o,'finish'))return;\",1)\n\nold_root=\"body.querySelector('.dp41BRoot')?.remove();const root=document.createElement('div');root.className='dp41BRoot';\"\nif src.count(old_root)!=1: raise SystemExit('041J: dp41BRoot-Anker nicht eindeutig.')\nsrc=src.replace(old_root,old_root+\"root.dataset.orderId=String(o.id);\",1)\nold_hide=\"body.querySelectorAll(':scope>.card:not(.dp41Card)').forEach(x=>{if(!x.closest('.dp41BRoot'))x.style.display='none';});\"\nif src.count(old_hide)!=1: raise SystemExit('041J: Detail-Kartenfilter nicht eindeutig.')\nsrc=src.replace(old_hide,old_hide+\"dp41StartLiveTime(o.id);\",1)\n\nexternal=base64.b64decode(Path('/tmp/dlb041j_external.b64').read_text()).decode('utf-8')\nPath('/tmp/dlb041j_external.js').write_text(external,encoding='utf-8',newline='\\n')\nsubprocess.run(['node','--check','/tmp/dlb041j_external.js'],check=True)\nend_marker='/* DP13_PATCH_END */'\nif src.count(end_marker)!=1: raise SystemExit(f'041J: DP13-Endmarker {src.count(end_marker)}x statt 1x.')\nsrc=src.replace(end_marker,external+'\\n\\n'+end_marker,1)\n\nruntime.write_text(src,encoding='utf-8',newline='\\n')\nif runtime.suffix=='.