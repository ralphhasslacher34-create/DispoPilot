      - name: Apply G3 independent auto refresh and status colors
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("dispopilot-online-efd-base.html")
          text = path.read_text(encoding="utf-8")

          marker = "/* DP13_PATCH_BEGIN */"
          if text.count(marker) != 1:
              raise SystemExit(
                  f"G3 abgebrochen: DP13-Marker {text.count(marker)}x gefunden statt 1x."
              )

          patch = r"""
          /* DP_G3_AUTOREFRESH_BEGIN */
          const DP_G3_REFRESH_MS=60000;
          const DP_G3_RETRY_MS=10000;
          let dpG3Running=false;
          let dpG3Timer=null;
          let dpG3LastSuccess=0;
          let dpG3Cycle=0;

          function dpG3ModalOpen(){
            return !!document.querySelector('.modal.show');
          }

          function dpG3Status(msg){
            const el=$('storageStatus');
            if(el)el.textContent=msg;
          }

          function dpG3RenderVisibleScreen(){
            const active=document.querySelector('.screen.active');
            const id=active?.id||'home';

            try{
              refreshCustomerSelects();
              renderMaterialsDatalist();
            }catch(_){}

            if(id==='planning')renderPlanning();
            else if(id==='orders')renderOrders();
            else if(id==='customers')renderCustomers();
            else if(id==='sites')renderSites();
            else if(id==='time')renderTime();
            else if(id==='bins')renderBins();
            else if(id==='history')renderHistory();
            else if(id==='settings')renderSettings();

            if(typeof dp13CheckNotices==='function'){
              setTimeout(dp13CheckNotices,50);
            }
          }

          async function dpG3FetchFreshState(){
            // SPStore.load() verwendet dieselbe funktionierende REST-Logik wie
            // der normale Programmstart. Für GET wird der Browsercache umgangen.
            const originalRequest=SPStore.request.bind(SPStore);

            SPStore.request=async function(url,opts={}){
              const method=String(opts.method||'GET').toUpperCase();
              if(method==='GET'){
                const headers={
                  ...(opts.headers||{}),
                  'Cache-Control':'no-cache, no-store, max-age=0',
                  'Pragma':'no-cache',
                  'Expires':'0'
                };
                return originalRequest(url,{
                  ...opts,
                  headers,
                  cache:'no-store'
                });
              }
              return originalRequest(url,opts);
            };

            try{
              return await SPStore.load();
            }finally{
              SPStore.request=originalRequest;
            }
          }

          async function dpG3Poll(){
            if(dpG3Running)return;

            // Niemals ein geöffnetes Formular/Detail während der Arbeit ersetzen.
            if(dpG3ModalOpen()){
              dpG3Status('Zentrale Datenbank · Auto-Sync pausiert (Formular offen)');
              return;
            }

            if(!state){
              dpG3Status('Zentrale Datenbank · Auto-Sync wartet auf Programmstart');
              return;
            }

            dpG3Running=true;
            dpG3Cycle++;

            try{
              dpG3Status('Zentrale Datenbank · Auto-Sync prüft …');

              const sessionUser=clone(state.user||{});
              const oldSignature=JSON.stringify({
                orders:state.orders||[],
                notices:state.dispoNotices||[],
                bins:state.bins||[]
              });

              const loaded=await dpG3FetchFreshState();
              const fresh=migrateState(loaded.state||clone(SEED));
              fresh.user=sessionUser;

              const newSignature=JSON.stringify({
                orders:fresh.orders||[],
                notices:fresh.dispoNotices||[],
                bins:fresh.bins||[]
              });

              state=fresh;

              // D-Reparatur: Auch zentral geladene Daten werden normalisiert.
              // So können doppelte Fahrfolgen (z. B. 1,2,3,3,4) nicht
              // dauerhaft aus DP_Data wieder in die Planung zurückkommen.
              const dpSequenceRepaired=dpDNormalizeAllGroups();
              if(dpSequenceRepaired){
                await persist();
              }

              dpG3LastSuccess=Date.now();
              dpG3RenderVisibleScreen();

              const changed=oldSignature!==newSignature;
              dpG3Status(
                'Zentrale Datenbank · Auto-Sync '
                +new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})
                +(changed?' · Änderung übernommen':' · aktuell')
              );
            }catch(e){
              console.error('DispoPilot G3 Auto-Sync:',e);
              dpG3Status(
                '⚠ Auto-Sync Fehler · '
                +new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})
              );
            }finally{
              dpG3Running=false;
            }
          }

          function dpG3Schedule(){
            if(dpG3Timer)return;

            // Unabhängig von DOMContentLoaded/load und damit auch robust,
            // wenn der nachgelagerte Benutzer-/Rollenpatch die Startsequenz ändert.
            const waitUntilReady=()=>{
              if(typeof state!=='undefined'&&state){
                dpG3Status('Zentrale Datenbank · Auto-Sync aktiv');
                setTimeout(dpG3Poll,3000);
                dpG3Timer=setInterval(dpG3Poll,DP_G3_REFRESH_MS);
              }else{
                setTimeout(waitUntilReady,DP_G3_RETRY_MS);
              }
            };
            setTimeout(waitUntilReady,1000);
          }

          // Zusätzlich bei Rückkehr/Fokus sofort prüfen, wenn kein Formular offen ist.
          window.addEventListener('focus',()=>{
            if(!dpG3ModalOpen()&&Date.now()-dpG3LastSuccess>30000)setTimeout(dpG3Poll,300);
          });

          document.addEventListener('visibilitychange',()=>{
            if(document.visibilityState==='visible'&&!dpG3ModalOpen()&&Date.now()-dpG3LastSuccess>30000){
              setTimeout(dpG3Poll,300);
            }
          });

          // Status-Farblogik:
          // Geplant grün, In Arbeit gelb, Ausgeführt grau, alles andere rot.
          if(!document.getElementById('dpStatusColorLogic')){
            const st=document.createElement('style');
            st.id='dpStatusColorLogic';
            st.textContent='.status.dpPlanned{background:#dcfce7;color:#166534}.status.dpWorkYellow{background:#fef3c7;color:#92400e}.status.dpDoneGray{background:#e5e7eb;color:#374151}.status.dpAttention{background:#fee2e2;color:#991b1b}';
            document.head.appendChild(st);
          }

          orderCard=function(o){
            const c=customer(o.customerId),s=site(o.siteId);
            const cls=o.status==='Geplant'?'dpPlanned':
              o.status==='In Arbeit'?'dpWorkYellow':
              o.status==='Ausgeführt'?'dpDoneGray':'dpAttention';
            const undisposed=!o.driver||!o.vehicle||!o.seq;
            const seqLabel=o.seq||'–',
              driverLabel=o.driver||'Fahrer offen',
              vehicleLabel=o.vehicle||'Fahrzeug offen',
              mat=o.material?` · ${esc(o.material)}`:'';

            return `<div class="card" onclick="openDetail(${o.id})" style="cursor:pointer"><div class="row"><div class="orderNo">${seqLabel}</div><div class="grow"><strong>${esc(c?.name||'')}</strong><div>${esc(s?.name||'')}</div><div class="small">${esc(o.task)} · ${esc(o.bin1||'')}${mat} · ${esc(vehicleLabel)} · ${esc(driverLabel)}</div>${undisposed?'<div class="small" style="color:#b45309;font-weight:700;margin-top:4px">noch nicht disponiert</div>':''}</div><span class="status ${cls}">${esc(o.status)}</span></div></div>`;
          };

          // Sofort beim Auswerten des Skripts scharf schalten.
          // Die Funktion wartet selbständig, bis state geladen ist.
          dpG3Schedule();
          /* DP_G3_AUTOREFRESH_END */
          """

          text = text.replace(marker, patch + "\n" + marker, 1)
          path.write_text(text, encoding="utf-8", newline="\n")
          print("G3 Auto-Sync und Statusfarben wurden eingefügt.")
          PY

          grep -q "DP_G3_AUTOREFRESH_BEGIN" dispopilot-online-efd-base.html
          grep -q "DP_G3_REFRESH_MS=60000" dispopilot-online-efd-base.html
          grep -q "dpG3Schedule();" dispopilot-online-efd-base.html
          grep -q "Auto-Sync prüft" dispopilot-online-efd-base.html
          grep -q "Änderung übernommen" dispopilot-online-efd-base.html
          grep -q "cache:'no-store'" dispopilot-online-efd-base.html
          grep -q "dpStatusColorLogic" dispopilot-online-efd-base.html

      - name: Apply A5 selectable bin type for Leeren and Abholen
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("dispopilot-online-efd-base.html")
          text = path.read_text(encoding="utf-8")

          marker = "/* DP13_PATCH_BEGIN */"
          if text.count(marker) != 1:
              raise SystemExit(f"A4 abgebrochen: DP13-Marker {text.count(marker)}x gefunden statt 1x.")

          patch = r"""
          /* DP_A5_LEEREN_ABHOLEN_MULDENTYP_BEGIN */

          dpABRenderBinFields=function(order=null,forceOrder=false){
            const host=$('dpABBinNumberFields');
            if(!host)return;

            if($('oBin1')?.parentElement)$('oBin1').parentElement.classList.add('hidden');
            if($('bin2Field'))$('bin2Field').classList.add('hidden');
            if($('bin3Field'))$('bin3Field').classList.add('hidden');
            if($('standingBinField'))$('standingBinField').classList.add('hidden');
            if($('newBinField'))$('newBinField').classList.add('hidden');

            const n=Math.max(1,Math.min(10,Number($('oCount')?.value||1)));
            const planned=dpA2OrderNumbers(order);
            const oldPlanned=dpA2OldNumbers(order);
            const types=dpA2Types(order);
            const currentNums={},currentOld={},currentTypes={};

            for(let i=1;i<=10;i++){
              if($('oBinNumber'+i))currentNums[i]=$('oBinNumber'+i).value;
              if($('oSwapOld'+i))currentOld[i]=$('oSwapOld'+i).value;
              if($('oBinType'+i))currentTypes[i]=$('oBinType'+i).value;
            }

            let html='<div class="section" style="margin-top:4px">Mulden</div><div style="display:grid;gap:8px">';

            for(let i=1;i<=n;i++){
              const num=forceOrder?(planned[i-1]||''):(currentNums[i]??planned[i-1]??'');
              const savedType=forceOrder?(types[i-1]||''):(currentTypes[i]??types[i-1]??'');
              const typ=savedType||binByNumber(num)?.type||'';
              const old=forceOrder?(oldPlanned[i-1]||''):(currentOld[i]??oldPlanned[i-1]??'');

              html+='<div style="display:grid;grid-template-columns:minmax(64px,.55fr) minmax(120px,1fr) minmax(120px,1fr)'+(dpA2IsSwap()?' minmax(140px,1.1fr)':'')+';gap:8px;align-items:end;padding:9px;border:1px solid #e5e7eb;border-radius:10px;background:#f9fafb">';
              html+='<div><strong>Mulde '+i+'</strong></div>';

              if(dpA2ExistingOnly()){
                html+='<div><label>Nummer</label><select id="oBinNumber'+i+'" onchange="dpA5ExistingChanged('+i+')">'+dpA2ExistingOptions(num)+'</select></div>';

                if(['Leeren','Abholen'].includes(dpA2Task())){
                  html+='<div><label>Typ</label><select id="oBinType'+i+'">'+dpA2TypeOptions(typ)+'</select></div>';
                }else{
                  html+='<div><label>Typ</label><div id="oExistingType'+i+'" style="min-height:42px;padding:10px;border:1px solid #d6dbe1;border-radius:9px;background:#fff">'+esc(dpA2AutoType(num))+'</div></div>';
                }
              }else{
                html+='<div><label>Nummer</label><input id="oBinNumber'+i+'" inputmode="numeric" value="'+esc(num)+'" placeholder="Muldennummer"></div>';
                html+='<div><label>Typ</label><select id="oBinType'+i+'">'+dpA2TypeOptions(typ||$('oBin1')?.value||'')+'</select></div>';
              }

              if(dpA2IsSwap()){
                html+='<div><label>Abgeholte Nr.</label><select id="oSwapOld'+i+'" onchange="dpA2SyncType('+i+',true)">'+dpA2ExistingOptions(old)+'</select><div class="small" style="margin-top:4px">Typ: <span id="oSwapOldType'+i+'">'+esc(dpA2AutoType(old))+'</span></div></div>';
              }

              html+='</div>';
            }

            html+='</div>';
            host.innerHTML=html;
          };

          function dpA5ExistingChanged(i){
            const num=String($('oBinNumber'+i)?.value||'').trim();

            if(['Leeren','Abholen'].includes(dpA2Task())){
              const sel=$('oBinType'+i);
              const stockType=binByNumber(num)?.type||'';
              if(sel&&stockType&&Array.from(sel.options).some(o=>o.value===stockType)){
                sel.value=stockType;
              }
            }else{
              dpA2SyncType(i);
            }
          }

          dpABCollectTypes=function(){
            const nums=dpABCollectNumbers();
            const out=[];

            for(let i=1;i<=nums.length;i++){
              if(['Leeren','Abholen'].includes(dpA2Task())){
                out.push($('oBinType'+i)?.value||binByNumber(nums[i-1])?.type||'');
              }else if(dpA2ExistingOnly()){
                out.push(binByNumber(nums[i-1])?.type||'');
              }else{
                out.push($('oBinType'+i)?.value||'');
              }
            }

            return out;
          };

          /* DP_A5_LEEREN_ABHOLEN_MULDENTYP_END */
          """

          text = text.replace(marker, patch + "\n" + marker, 1)
          path.write_text(text, encoding="utf-8", newline="\n")
          print("A5 Typauswahl bei Leeren und Abholen wurde eingefügt.")
          PY

          grep -q "DP_A5_LEEREN_ABHOLEN_MULDENTYP_BEGIN" dispopilot-online-efd-base.html
          grep -q "dpA5ExistingChanged" dispopilot-online-efd-base.html

