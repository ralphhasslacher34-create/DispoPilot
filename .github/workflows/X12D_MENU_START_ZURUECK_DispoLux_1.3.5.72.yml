          marker="/* DP_X9C_MULDENTYP_DOPPELTE_MULDE_END */"
          if t.count(marker)!=1:
              raise SystemExit(f"X9D abgebrochen: X9C-Endmarker {t.count(marker)}x statt 1x vorhanden.")

          patch=r'''
          /* DP_X9D_NEUER_AUFTRAG_AUFTRAEGE_BEGIN */
          // Aufträge besitzt seit W1 eine eigene Datumsnavigation. Beim Anlegen aus
          // dieser Ansicht wird deshalb genau der dort sichtbare Tag vorgegeben,
          // ohne die Planung auf dieses Datum umzuschalten.
          function dpX9dNewOrderFromOrders(){
            const planningDate=selectedDate;
