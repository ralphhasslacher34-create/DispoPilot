      - name: Build production bundle
        working-directory: spfx-build
        run: npx heft build --production

      - name: Package SharePoint solution
        working-directory: spfx-build
        run: npx heft package-solution --production

      - name: Collect SiteAssets and package
        run: |
          set -e
          rm -rf artifact
          mkdir -p artifact/UPLOAD_TO_SITEASSETS
          mkdir -p artifact/UPLOAD_TO_APP_CATALOG

          PKG=$(find spfx-build/sharepoint/solution -maxdepth 1 -type f -name '*.sppkg' | head -n 1)
          test -n "$PKG"
          cp "$PKG" artifact/UPLOAD_TO_APP_CATALOG/DispoPilot_Online_V1.3_SPFX_FINAL.sppkg

          if [ -d "spfx-build/release/assets" ]; then
            cp -a spfx-build/release/assets/. artifact/UPLOAD_TO_SITEASSETS/
          elif [ -d "spfx-build/temp/deploy" ]; then
            cp -a spfx-build/temp/deploy/. artifact/UPLOAD_TO_SITEASSETS/
          else
            echo "Keine SPFx Asset-Ausgabe gefunden."
            exit 1
          fi

          test "$(find artifact/UPLOAD_TO_SITEASSETS -type f | wc -l)" -gt 0

          cat > artifact/REIHENFOLGE.txt <<'TXT'
          DispoLux V1.3 - X12D Menü-Start + Zurück - Paketrevision 1.3.5.72

          INSTALLATION:
          1. Inhalt aus UPLOAD_TO_SITEASSETS nach SharePoint SiteAssets hochladen.
          2. DispoPilot_Online_V1.3_SPFX_FINAL.sppkg aus UPLOAD_TO_APP_CATALOG ersetzen und bereitstellen.
          3. DispoLux neu laden und die drei Rollen gegenprüfen.

          X12D:
          - Administrator, Disposition und Fahrer starten nach Anmeldung/Rollenwechsel im jeweiligen Hauptmenü.
          - Disposition springt NICHT mehr automatisch in Planung.
          - Gesperrte Direktaufrufe führen zurück ins Hauptmenü statt in ein Ersatzmodul.
          - Fahrer und Disposition erhalten außerhalb des Hauptmenüs links in der grünen Kopfzeile nur den Zurück-Pfeil „←“.
          - Kein separater „Menü“-Button mehr.
          - Administrator behält seine vorhandene Zurück-Navigation unverändert.
          - Rollenrechte und X12C-Funktionsumfang bleiben erhalten.

          KURZTEST:
          1. Admin anmelden -> Hauptmenü -> Modul öffnen -> vorhandener Zurück-Pfeil funktioniert.
          2. Disposition anmelden -> Hauptmenü sichtbar, KEIN automatischer Sprung in Planung.
          3. Disposition -> Planung öffnen -> „←“ links in grüner Kopfzeile -> Hauptmenü.
          4. Fahrer anmelden -> Hauptmenü sichtbar.
          5. Fahrer -> Auftrag/Mulden/Arbeitszeit öffnen -> „←“ links -> Hauptmenü.
          6. Im Hauptmenü darf kein zusätzlicher Zurück-Pfeil eingeblendet sein.
          7. Rollenwechsel -> immer zunächst Hauptmenü; nur erlaubte Kacheln sichtbar.
          TXT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: X12D-MENU-START-ZURUECK-DISPOLUX-1.3.5.72
          path: artifact/
          if-no-files-found: error
