          grep -R 'DP_X7_RESERVIERUNG_LEEREN_STABIL_FIX_BEGIN' spfx-build/src/webparts
          grep -R 'dpX6CaptureOrderDraft' spfx-build/src/webparts
          grep -R 'Leeren und danach verwenden' spfx-build/src/webparts
