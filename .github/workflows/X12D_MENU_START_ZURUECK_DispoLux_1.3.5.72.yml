      - name: Apply final F2 notification flow and H3 mobile scrolling fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path("dispopilot-online-efd.html")
          t=p.read_text(encoding="utf-8")

          # ------------------------------------------------------------
          # F2: Meldungsablauf wieder sauber zweistufig.
          #
          # Soll:
          # 1. Auftrag ansehen
          # 2. Auftrag schließen
          # 3. Meldung ausdrücklich bestätigen
          # 4. Meldung verschwindet, Auftrag öffnet NICHT erneut.
          #
          # Der frühere F-Patch quittierte die Meldung bereits beim
          # Schließen des Auftrags. Das kollidiert mit dem eigentlichen
          # Zwei-Stufen-Dialog.
          # ------------------------------------------------------------
          old_f="""const baseCloseM=closeM;
          closeM=function(id){
            baseCloseM(id);
            if(id==='detailModal'&&dp13ReturnNoticeId){
              const noticeId=dp13ReturnNoticeId;
              dp13ReturnNoticeId=null;
              const n=dp13NoticeList().find(x=>x.id===noticeId);
              if(n&&!n.acknowledgedAt){
                n.acknowledgedAt=nowIso();
                persist().then(()=>setTimeout(dp13CheckNotices,40));
              }else{
                setTimeout(dp13CheckNotices,40);
              }
            }
          };"""

          new_f="""const baseCloseM=closeM;
          closeM=function(id){
            baseCloseM(id);
            if(id==='detailModal'&&dp13ReturnNoticeId){
              // Stufe 1 ist beendet: Auftrag wurde angesehen.
              // NICHT hier quittieren. Der Fahrer bestätigt die Meldung
              // anschließend bewusst im Meldungsfenster.
              dp13ReturnNoticeId=null;
              setTimeout(dp13CheckNotices,40);
            }
          };"""

          if t.count(old_f)!=1:
              raise SystemExit(
                  f"F2 abgebrochen: bisheriger F-Block {t.count(old_f)}x gefunden statt 1x."
              )
          t=t.replace(old_f,new_f,1)

          marker="/* DP13_PATCH_BEGIN */"
          if t.count(marker)!=1:
              raise SystemExit(
                  f"H2 abgebrochen: DP13-Marker {t.count(marker)}x gefunden statt 1x."
              )

          patch=r"""
          /* DP_F2_H3_BUGFIX_BEGIN */

          // ------------------------------------------------------------
          // H3: Auf kleinen Bildschirmen darf es nur EINEN vertikalen
          // Scrollbereich geben. Bisher scrollten Modal UND innere Box
          // teilweise gegeneinander. In SharePoint/Browser konnte dadurch
          // oben oder unten ein Teil unerreichbar bleiben.
          // ------------------------------------------------------------
          if(!document.getElementById('dpH3ScrollFixStyle')){
            const st=document.createElement('style');
            st.id='dpH3ScrollFixStyle';
            st.textContent=`
              @media(max-width:760px){
                .modal.show{
                  position:fixed !important;
                  inset:0 !important;
                  width:auto !important;
                  height:auto !important;
                  max-height:none !important;
                  overflow-x:hidden !important;
                  overflow-y:auto !important;
                  -webkit-overflow-scrolling:touch;
                  overscroll-behavior:contain;
                  align-items:flex-start !important;
                  justify-content:center !important;
                  padding:
                    max(10px,env(safe-area-inset-top))
                    8px
                    max(28px,env(safe-area-inset-bottom)) !important;
                  box-sizing:border-box !important;
                }

                .modal.show > .box{
                  width:100% !important;
                  height:auto !important;
                  min-height:0 !important;
                  max-height:none !important;
                  overflow:visible !important;
                  margin:0 auto !important;
                  border-radius:10px !important;
                  box-sizing:border-box !important;
                  padding:12px !important;
                }

                /* H hatte bei Auftrag/Detail/Status 100dvh gesetzt.
                   H2 hebt diese feste Höhe bewusst wieder auf. */
                #orderModal .box,
                #detailModal .box,
                #statusModal .box,
                #siteModal .box,
                #customerModal .box,
                #dpKAddressModal .box{
                  height:auto !important;
                  min-height:0 !important;
                  max-height:none !important;
                  overflow:visible !important;
                }

                /* Kopfzeilen bleiben erreichbar, ohne aus dem sichtbaren
                   Bereich hinaus zu rutschen. */
                #orderModal .box > .row:first-child,
                #detailModal .box > .row:first-child,
                #statusModal .box > .row:first-child,
                #siteModal .box > .row:first-child,
                #customerModal .box > .row:first-child,
                #dpKAddressModal .box > .row:first-child{
                  position:sticky !important;
                  top:-1px !important;
                  z-index:20 !important;
                  background:#fff !important;
                  margin:0 -4px 10px !important;
                  padding:8px 4px 10px !important;
                }

                /* Sicherer unterer Abstand für letzte Buttons/Felder. */
                .modal.show{
                  scroll-padding-bottom:140px !important;
                }

                .modal.show > .box::after{
                  content:"";
                  display:block;
                  height:140px;
                  min-height:140px;
                  flex:0 0 140px;
                  pointer-events:none;
                }
              }
            `;
            document.head.appendChild(st);
          }

          /* DP_F2_H3_BUGFIX_END */
          """

          t=t.replace(marker,patch+"\n"+marker,1)

          p.write_text(t,encoding="utf-8",newline="\n")
          print("F2 Meldungsablauf und H3 Scroll-Fix eingefügt.")
          PY

          grep -q "DP_F2_H3_BUGFIX_BEGIN" dispopilot-online-efd.html
          grep -q "dpH3ScrollFixStyle" dispopilot-online-efd.html
          grep -q "height:140px" dispopilot-online-efd.html
          grep -q "scroll-padding-bottom:140px" dispopilot-online-efd.html
          grep -q "Stufe 1 ist beendet" dispopilot-online-efd.html

          # Beim Schließen des Auftrags darf F2 nicht mehr automatisch quittieren.
          if grep -A14 -B2 "Stufe 1 ist beendet" dispopilot-online-efd.html | grep -q "acknowledgedAt=nowIso"; then
            echo "Fehler: Meldung wird beim Schließen des Auftrags weiterhin automatisch quittiert."
            exit 1
          fi


      - name: Apply L2 central mail queue and native PDF
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path("dispopilot-online-efd.html")
          t=p.read_text(encoding="utf-8")
          marker="/* DP13_PATCH_BEGIN */"
          if t.count(marker)!=1:
              raise SystemExit(f"L2 abgebrochen: DP13-Marker {t.count(marker)}x gefunden statt 1x.")

          patch=r"""
          /* DP_L2_ZENTRALER_STUNDENZETTELVERSAND_BEGIN */
          // L2 / Praxispunkt P:
          // Gastfahrer senden NICHT aus einem eigenen Exchange-Postfach.
          // DispoPilot erzeugt selbst eine echte PDF-Datei im A4-Querformat
          // und legt einen Versandauftrag in DP_Data (DP_Typ=mailQueue) an.
          // Ein zentraler Power-Automate-Flow versendet diese Warteschlange
          // anschließend über das lizenzierte Microsoft-365-Büropostfach.

          let dpL2QueueCounter=0;

          function dpL2QueueRequest(payload){
            return new Promise((resolve,reject)=>{
              const requestId='dp-queue-'+Date.now()+'-'+(++dpL2QueueCounter);
              let done=false;
              const finish=(ok,value)=>{
                if(done)return;
                done=true;
                clearTimeout(timer);
                window.removeEventListener('message',onMessage);
                ok?resolve(value):reject(value instanceof Error?value:new Error(String(value||'Unbekannter Warteschlangenfehler')));
              };
              const onMessage=(event)=>{
                const d=event.data;
                if(!d||d.type!=='DISPOPILOT_MAILQUEUE_RESULT'||d.requestId!==requestId)return;
                if(d.ok)finish(true,d);
                else finish(false,new Error(d.error||'Versandauftrag konnte nicht gespeichert werden.'));
              };
              window.addEventListener('message',onMessage);
              const timer=setTimeout(()=>finish(false,new Error('Zeitüberschreitung beim Speichern des Versandauftrags.')),30000);
              try{
                window.parent.postMessage({
                  type:'DISPOPILOT_MAILQUEUE_CREATE',
                  requestId,
                  payload
                },'*');
              }catch(e){finish(false,e);}
            });
          }

          function dpL2Ascii(s){
            return String(s==null?'':s)
              .replace(/Ä/g,'Ae').replace(/Ö/g,'Oe').replace(/Ü/g,'Ue')
              .replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue')
              .replace(/ß/g,'ss').replace(/€/g,'EUR')
              .replace(/[–—]/g,'-').replace(/[„“”]/g,'"').replace(/[’‘]/g,"'")
              .replace(/[^\x20-\x7E]/g,' ')
              .replace(/\s+/g,' ').trim();
          }

          function dpL2PdfEsc(s){
            return dpL2Ascii(s).replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)');
          }

          function dpL2Wrap(text,width,fontSize){
            const clean=dpL2Ascii(text);
            if(!clean)return [''];
            const max=Math.max(4,Math.floor(width/(fontSize*0.52)));
            const words=clean.split(/\s+/);
            const lines=[];
            let line='';
            for(const word0 of words){
              let word=word0;
              if(word.length>max){
                if(line){lines.push(line);line='';}
                while(word.length>max){lines.push(word.slice(0,max));word=word.slice(max);}
                if(word)line=word;
                continue;
              }
              const next=line?line+' '+word:word;
              if(next.length>max){if(line)lines.push(line);line=word;}else line=next;
            }
            if(line)lines.push(line);
            return lines.length?lines:[''];
          }

          function dpL2ExtractTimesheet(){
            const root=$('previewPaper');
            if(!root)throw new Error('Stundenzettel-Vorschau wurde nicht gefunden.');
            const table=root.querySelector('table');
            if(!table)throw new Error('Stundenzettel-Tabelle wurde nicht gefunden.');
            const rows=[...table.rows].map(r=>[...r.cells].map(c=>String(c.innerText||c.textContent||'').trim()));
            const text=String(root.innerText||root.textContent||'');
            const employer=(text.match(/Arbeitgeber:\s*([^\n\r]+)/i)||[])[1]||'LoraCon GmbH';
            const employee=(text.match(/Arbeitnehmer:\s*([^\n\r]+)/i)||[])[1]||state.user.name||'';
            const month=(text.match(/Monat\s*\/\s*Jahr\s*:?\s*([^\n\r]+)/i)||[])[1]||'';
            return {rows,employer:employer.trim(),employee:employee.trim(),month:month.trim()};
          }

          function dpL2PdfBytes(parts){
            let total=0;
            const arrays=parts.map(s=>{
              const a=new Uint8Array(s.length);
              for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i)&255;
              total+=a.length;return a;
            });
            const out=new Uint8Array(total);let pos=0;
            arrays.forEach(a=>{out.set(a,pos);pos+=a.length;});
            return out;
          }

          function dpL2BuildTimesheetPdf(){
            const data=dpL2ExtractTimesheet();
            const W=842,H=595,margin=34;
            const colW=[92,74,74,102,126,306];
            const fontBody=7.1,fontHead=6.8,fontProject=6.2;
            const pages=[];
            let cmds=[], y=36;
            const py=t=>H-t;
            const line=(x1,y1,x2,y2)=>cmds.push(`0.45 w ${x1.toFixed(1)} ${py(y1).toFixed(1)} m ${x2.toFixed(1)} ${py(y2).toFixed(1)} l S`);
            const text=(x,yt,s,fs=8,bold=false)=>cmds.push(`BT /F${bold?2:1} ${fs.toFixed(1)} Tf ${x.toFixed(1)} ${py(yt).toFixed(1)} Td (${dpL2PdfEsc(s)}) Tj ET`);
            const textLines=(x,yt,lines,fs,leading,bold=false,maxLines=99)=>{
              lines.slice(0,maxLines).forEach((s,i)=>text(x,yt+i*leading,s,fs,bold));
            };
            const drawTableHeader=()=>{
              const headers=(data.rows[0]||['Kalender Tag','Beginn Arbeitszeit','Ende Arbeitszeit','Summe Ruhepause Stunden, Minuten','Dauer abzueglich Pausen Arbeitzzeit nach Tarif','Baustelle / Projektnummer']).slice(0,6);
              const h=42;let x=margin;
              line(margin,y,W-margin,y);line(margin,y+h,W-margin,y+h);
              headers.forEach((htext,i)=>{
                line(x,y,x,y+h);
                const ls=dpL2Wrap(htext,colW[i]-8,fontHead);
                textLines(x+4,y+12,ls,fontHead,7.2,true,4);
                x+=colW[i];
              });
              line(W-margin,y,W-margin,y+h);y+=h;
            };
            const newPage=(first)=>{
              if(cmds.length)pages.push(cmds.join('\n'));
              cmds=[];y=34;
              if(first){
                text(margin,y+7,'LoraCon GmbH',9,true);
                text(margin,y+19,'Lothar Rapp Container + Transporte',7,false);
                text(margin,y+29,'Hinter der Ziegelhuette 7',7,false);
                text(margin,y+39,'71665 Vaihingen/Enz - Horrheim',7,false);
                text(W-margin-116,y+12,'LoraCon',22,true);
                text(W-margin-116,y+25,'Container + Transporte',7,false);
                line(margin,y+48,W-margin,y+48);
                y+=68;
                text(margin,y,'Arbeitnehmerbezogene Erfassung der taeglichen Arbeitszeit',13,true);
                y+=20;
                text(margin,y,'Arbeitgeber:',8,true); text(margin+95,y,data.employer,8,false);
                text(margin+390,y,'Monat/Jahr:',8,true); text(margin+465,y,data.month,8,false);
                y+=14;
                text(margin,y,'Arbeitnehmer:',8,true); text(margin+95,y,data.employee,8,false);
                y+=18;
              }else{
                text(margin,y,'Stundenzettel - Fortsetzung',11,true); y+=18;
              }
              drawTableHeader();
            };
            newPage(true);

            const bodyRows=(data.rows||[]).slice(1);
            for(const row0 of bodyRows){
              const row=row0.slice(0,6); while(row.length<6)row.push('');
              const wrapped=row.map((v,i)=>dpL2Wrap(v,colW[i]-8,i===5?fontProject:fontBody));
              const lineCounts=wrapped.map((ls,i)=>Math.min(ls.length,i===5?9:5));
              let rh=Math.max(24,8+Math.max(...lineCounts)*7.3);
              rh=Math.min(rh,78);
              if(y+rh>H-46){newPage(false);}
              let x=margin;
              line(margin,y,W-margin,y);line(margin,y+rh,W-margin,y+rh);
              for(let i=0;i<6;i++){
                line(x,y,x,y+rh);
                const fs=i===5?fontProject:fontBody;
                const max=i===5?9:5;
                textLines(x+4,y+11,wrapped[i],fs,7.3,i===0,max);
                x+=colW[i];
              }
              line(W-margin,y,W-margin,y+rh);y+=rh;
            }
            text(margin,H-24,'Elektronisch aus DispoPilot erstellt: '+new Date().toLocaleString('de-DE'),6.5,false);
            pages.push(cmds.join('\n'));

            const objects=[];
            const add=o=>{objects.push(o);return objects.length;};
            const catalog=add('');
            const pagesObj=add('');
            const font1=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>');
            const font2=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold >>');
            const pageRefs=[];
            pages.forEach(stream=>{
              const pageRef=add('');
              const contentRef=add(`<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`);
              pageRefs.push(pageRef);
              objects[pageRef-1]=`<< /Type /Page /Parent ${pagesObj} 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /Font << /F1 ${font1} 0 R /F2 ${font2} 0 R >> >> /Contents ${contentRef} 0 R >>`;
            });
            objects[catalog-1]=`<< /Type /Catalog /Pages ${pagesObj} 0 R >>`;
            objects[pagesObj-1]=`<< /Type /Pages /Count ${pageRefs.length} /Kids [${pageRefs.map(r=>r+' 0 R').join(' ')}] >>`;

            let pdf='%PDF-1.4\n%\xE2\xE3\xCF\xD3\n';
            const offsets=[0];
            objects.forEach((obj,i)=>{offsets.push(pdf.length);pdf+=`${i+1} 0 obj\n${obj}\nendobj\n`;});
            const xref=pdf.length;
            pdf+=`xref\n0 ${objects.length+1}\n0000000000 65535 f \n`;
            for(let i=1;i<offsets.length;i++)pdf+=String(offsets[i]).padStart(10,'0')+' 00000 n \n';
            pdf+=`trailer\n<< /Size ${objects.length+1} /Root ${catalog} 0 R >>\nstartxref\n${xref}\n%%EOF\n`;
            return new Blob([dpL2PdfBytes([pdf])],{type:'application/pdf'});
          }

          function dpL2Filename(){
            const kw=isoWeekNumber(selectedWeekMonday);
            const who=dpL2Ascii(state.user.name||'Fahrer').replace(/[^A-Za-z0-9_-]+/g,'_');
            return `Stundenzettel_${who}_KW${kw}.pdf`;
          }

          function dpL2DownloadPdf(){
            try{
              const blob=dpL2BuildTimesheetPdf();
              const url=URL.createObjectURL(blob);
              const a=document.createElement('a');
              a.href=url;a.download=dpL2Filename();
              document.body.appendChild(a);a.click();a.remove();
              setTimeout(()=>URL.revokeObjectURL(url),5000);
            }catch(e){
              console.error('DispoPilot PDF',e);
              alert('PDF konnte nicht erstellt werden.\n\n'+String(e&&e.message?e.message:e));
            }
          }

          async function dpL2BlobBase64(blob){
            const bytes=new Uint8Array(await blob.arrayBuffer());
            let binary='';
            const chunk=0x8000;
            for(let i=0;i<bytes.length;i+=chunk){binary+=String.fromCharCode(...bytes.subarray(i,i+chunk));}
            return btoa(binary);
          }

          function dpL2Recipient(){
            const idx=+$('tsRecipient').value;
            return (state.settings.timesheetRecipients||[])[idx]||{};
          }

          async function dpL2SendTimesheet(){
            const r=dpL2Recipient();
            if(!r.mail||!String(r.mail).includes('@')){
              alert('Für den ausgewählten Stundenzettel-Empfänger ist keine gültige E-Mail-Adresse hinterlegt.');return;
            }
            const btn=$('previewSendBtn');const oldText=btn?btn.textContent:'';
            if(btn){btn.disabled=true;btn.textContent='Wird übergeben …';}
            try{
              const kw=isoWeekNumber(selectedWeekMonday);
              const blob=dpL2BuildTimesheetPdf();
              const attachmentBase64=await dpL2BlobBase64(blob);
              const recipient=String(r.mail).trim();
              const subject=`Stundenzettel ${state.user.name} – KW ${kw}`;
              const payload={
                schema:2,
                status:'Pending',
                kind:'Stundenzettel',
                createdAt:nowIso(),
                createdBy:state.user.name,
                week:selectedWeekMonday,
                period:`KW ${kw}`,
                to:[recipient],
                subject,
                bodyHtml:`<p>Guten Tag,</p><p>anbei der Stundenzettel von <strong>${String(state.user.name||'')}</strong> für KW ${kw}.</p><p>Diese E-Mail wurde automatisch durch DispoPilot zum Versand bereitgestellt.</p>`,
                attachmentName:dpL2Filename(),
                attachmentContentType:'application/pdf',
                attachmentBase64
              };
              const result=await dpL2QueueRequest(payload);
              if(!Array.isArray(state.documents))state.documents=[];
              state.documents.unshift({
                id:uid(),type:'Stundenzettel',date:nowIso(),week:selectedWeekMonday,period:`KW ${kw}`,
                driver:state.user.name,recipient,recipients:[recipient],recipientName:r.name||'',
                status:'Versand beauftragt',transport:'Microsoft 365 / Power Automate',queueItemId:result&&result.itemId||null
              });
              await persist();
              closeM('previewModal');renderHistory();
              alert('Stundenzettel wurde als PDF zum zentralen Microsoft-365-Versand übergeben.');
            }catch(e){
              console.error('DispoPilot L2 Versand',e);
              alert('Stundenzettel konnte nicht zum Versand übergeben werden.\n\n'+String(e&&e.message?e.message:e));
            }finally{if(btn){btn.disabled=false;btn.textContent=oldText||'Stundenzettel senden';}}
          }

          const dpL2BasePreviewTimesheet=previewTimesheet;
          previewTimesheet=function(){
            closeM('timesheetModal');
            $('previewTitle').textContent='Stundenzettel – Vorschau';
            $('previewPaper').innerHTML=timesheetPaper();
            $('previewSendBtn').textContent='Stundenzettel senden';
            $('previewSendBtn').onclick=dpL2SendTimesheet;
            const printBtn=document.querySelector('#previewModal .btn.secondary');
            if(printBtn){
              printBtn.textContent='PDF herunterladen';
              printBtn.onclick=dpL2DownloadPdf;
            }
            openM('previewModal');
          };

          /* DP_L2_ZENTRALER_STUNDENZETTELVERSAND_END */
          """

          t=t.replace(marker,patch+"\n"+marker,1)
          p.write_text(t,encoding="utf-8",newline="\n")
          print("L2: zentrale Versandwarteschlange und native PDF-Erzeugung eingefügt.")
          PY

          grep -q "DP_L2_ZENTRALER_STUNDENZETTELVERSAND_BEGIN" dispopilot-online-efd.html
          grep -q "DISPOPILOT_MAILQUEUE_CREATE" dispopilot-online-efd.html
          grep -q "DP_Typ=mailQueue" dispopilot-online-efd.html
          grep -q "PDF herunterladen" dispopilot-online-efd.html
          grep -q "Versand beauftragt" dispopilot-online-efd.html

      - name: Apply L4 LoraCon PDF layout fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path("dispopilot-online-efd.html")
          t=p.read_text(encoding="utf-8")
          marker="/* DP13_PATCH_BEGIN */"
          if t.count(marker)!=1:
              raise SystemExit(f"L4 abgebrochen: DP13-Marker {t.count(marker)}x gefunden statt 1x.")

          patch=r"""
          /* DP_L4_LORACON_PDF_LAYOUT_BEGIN */
          // L4: eigener, fester Druckaufbau nach der LoraCon-Excelvorlage.
          // Wichtig: NICHT mehr jede HTML-Tabellenzeile blind in die PDF übernehmen.
          // Zusätzliche Auftrags-/Detailzeilen der Bildschirmansicht werden ignoriert;
          // Kunde/Tätigkeit/Baustelle bleiben ausschließlich in der breiten letzten Spalte.

          function dpL4CleanText(value,preserveBreaks=false){
            let s=String(value==null?'':value)
              .replace(/\r/g,'')
              .replace(/[–—]/g,'-')
              .replace(/[„“”]/g,'"')
              .replace(/[’‘]/g,"'")
              .replace(/€/g,'EUR')
              .replace(/[^\x09\x0A\x20-\x7E\xA0-\xFF]/g,' ');
            if(preserveBreaks){
              s=s.split('\n').map(x=>x.replace(/[ \t]+/g,' ').trim()).filter(Boolean).join('\n');
            }else{
              s=s.replace(/\s+/g,' ').trim();
            }
            return s;
          }

          function dpL4PdfEsc(s){
            return dpL4CleanText(s,true).replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)');
          }

          function dpL4WrapParagraph(text,width,fontSize){
            const clean=dpL4CleanText(text,false);
            if(!clean)return [''];
            const max=Math.max(4,Math.floor(width/(fontSize*0.50)));
            const words=clean.split(/\s+/);
            const lines=[];
            let line='';
            for(const word0 of words){
              let word=word0;
              if(word.length>max){
                if(line){lines.push(line);line='';}
                while(word.length>max){lines.push(word.slice(0,max));word=word.slice(max);}
                if(word)line=word;
                continue;
              }
              const next=line?line+' '+word:word;
              if(next.length>max){if(line)lines.push(line);line=word;}else line=next;
            }
            if(line)lines.push(line);
            return lines.length?lines:[''];
          }

          function dpL4WrapText(text,width,fontSize){
            const src=dpL4CleanText(text,true);
            if(!src)return [''];
            const out=[];
            src.split('\n').forEach(part=>{
              const ls=dpL4WrapParagraph(part,width,fontSize);
              ls.forEach(x=>out.push(x));
            });
            return out.length?out:[''];
          }

          function dpL4GermanMonth(d){
            return ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'][d.getMonth()];
          }

          function dpL4WeekMonthLabel(){
            try{
              const start=new Date(String(selectedWeekMonday)+'T12:00:00');
              if(Number.isNaN(start.getTime()))return '';
              const end=new Date(start); end.setDate(end.getDate()+6);
              if(start.getFullYear()===end.getFullYear()&&start.getMonth()===end.getMonth()){
                return dpL4GermanMonth(start)+' '+start.getFullYear();
              }
              if(start.getFullYear()===end.getFullYear()){
                return dpL4GermanMonth(start)+' / '+dpL4GermanMonth(end)+' '+start.getFullYear();
              }
              return dpL4GermanMonth(start)+' '+start.getFullYear()+' / '+dpL4GermanMonth(end)+' '+end.getFullYear();
            }catch(_){return '';}
          }

          function dpL4DateKey(d){
            const dd=String(d.getDate()).padStart(2,'0');
            const mm=String(d.getMonth()+1).padStart(2,'0');
            return dd+'.'+mm+'.'+d.getFullYear();
          }

          function dpL4Weekday(d){
            return ['So','Mo','Di','Mi','Do','Fr','Sa'][d.getDay()];
          }

          function dpL4ExtractTimesheet(){
            const root=$('previewPaper');
            if(!root)throw new Error('Stundenzettel-Vorschau wurde nicht gefunden.');
            const table=root.querySelector('table');
            if(!table)throw new Error('Stundenzettel-Tabelle wurde nicht gefunden.');

            const rawRows=[];
            let example=null;
            for(const tr of [...table.rows]){
              const cells=[...tr.cells];
              // L2-Fehlerquelle: Detailzeilen haben weniger als 6 Zellen.
              // Diese dürfen niemals in Spalte "Kalendertag" landen.
              if(cells.length<6)continue;
              const vals=cells.map(c=>dpL4CleanText(c.innerText||c.textContent||'',true));
              const first=vals[0]||'';
              if(/Kalender\s*Tag/i.test(first))continue;
              const row=[vals[0]||'',vals[1]||'',vals[2]||'',vals[3]||'',vals[4]||'',vals.slice(5).join('\n')||''];
              if(/^Beispiel/i.test(first)){example=row;continue;}
              if(/Wochensumme/i.test(first))continue;
              if(/\b(?:Mo|Di|Mi|Do|Fr|Sa|So)\b/i.test(first)||/\d{2}\.\d{2}\.\d{4}/.test(first))rawRows.push(row);
            }

            const start=new Date(String(selectedWeekMonday)+'T12:00:00');
            const days=[];
            if(!Number.isNaN(start.getTime())){
              for(let i=0;i<7;i++){
                const d=new Date(start);d.setDate(d.getDate()+i);
                const key=dpL4DateKey(d);
                let found=rawRows.find(r=>(r[0]||'').includes(key));
                if(!found)found=rawRows[i];
                if(found){
                  const copy=found.slice(0,6);
                  // Datum vereinheitlichen, damit leere Tage ebenfalls sauber aussehen.
                  copy[0]=dpL4Weekday(d)+'\n'+key;
                  days.push(copy);
                }else{
                  days.push([dpL4Weekday(d)+'\n'+key,'','','','','']);
                }
              }
            }else{
              rawRows.slice(0,7).forEach(r=>days.push(r));
            }

            const text=String(root.innerText||root.textContent||'');
            const employer=(text.match(/Arbeitgeber:\s*([^\n\r]+)/i)||[])[1]||'LoraCon GmbH';
            const employee=(text.match(/Arbeitnehmer:\s*([^\n\r]+)/i)||[])[1]||state.user.name||'';
            return {
              employer:dpL4CleanText(employer,false),
              employee:dpL4CleanText(employee,false),
              month:dpL4WeekMonthLabel(),
              example:example||['Beispiel:','','','','','Stuttgart'],
              days
            };
          }

          function dpL4BuildTimesheetPdf(){
            const data=dpL4ExtractTimesheet();
            const W=842,H=595;
            const left=36,right=36;
            const tableW=W-left-right;
            // Proportionen aus der hochgeladenen LoraCon.xlsx:
            // A+B | C | D | E | F | G+H
            const colW=[54,75,75,91,136,339];
            const headerH=43,exampleH=24;
            const bodyTop=153;
            const footerTop=550;
            const maxBodyH=footerTop-bodyTop-headerH-exampleH;

            function chooseProjectFont(rows){
              for(const fs of [6.6,6.4,6.2,6.0,5.8,5.6,5.4]){
                const leading=fs+1.0;
                let total=0;
                for(const r of rows){
                  const n=Math.max(1,dpL4WrapText(r[5],colW[5]-8,fs).length);
                  total+=Math.max(43,8+n*leading);
                }
                if(total<=maxBodyH)return fs;
              }
              return 5.2;
            }

            const projectFs=chooseProjectFont(data.days);
            const projectLeading=projectFs+1.0;
            const rowHeights=data.days.map(r=>{
              const n=Math.max(1,dpL4WrapText(r[5],colW[5]-8,projectFs).length);
              return Math.max(43,8+n*projectLeading);
            });
            const bodyTotal=rowHeights.reduce((a,b)=>a+b,0);
            const scale=bodyTotal>maxBodyH?maxBodyH/bodyTotal:1;
            const finalHeights=rowHeights.map(h=>Math.max(39,h*scale));

            const pages=[];
            let cmds=[];
            const py=y=>H-y;
            const setBlack=()=>cmds.push('0 0 0 rg 0 0 0 RG');
            const setGreen=()=>cmds.push('0.10 0.42 0.24 rg 0.10 0.42 0.24 RG');
            const line=(x1,y1,x2,y2,w=0.45)=>cmds.push(`${w.toFixed(2)} w ${x1.toFixed(1)} ${py(y1).toFixed(1)} m ${x2.toFixed(1)} ${py(y2).toFixed(1)} l S`);
            const text=(x,y,s,fs=8,bold=false)=>cmds.push(`BT /F${bold?2:1} ${fs.toFixed(1)} Tf ${x.toFixed(1)} ${py(y).toFixed(1)} Td (${dpL4PdfEsc(s)}) Tj ET`);
            const textLines=(x,y,lines,fs,leading,bold=false,maxLines=99)=>{
              const use=lines.slice(0,maxLines);
              if(lines.length>maxLines&&use.length){use[use.length-1]=use[use.length-1].replace(/\s+$/,'')+' ...';}
              use.forEach((s,i)=>text(x,y+i*leading,s,fs,bold));
            };
            const centerLines=(x,y,w,lines,fs,leading,bold=false)=>{
              lines.forEach((s,i)=>{
                const est=dpL4CleanText(s,false).length*fs*0.48;
                text(x+Math.max(3,(w-est)/2),y+i*leading,s,fs,bold);
              });
            };

            // Kopf analog zur Firmenvorlage
            setBlack();
            text(left,38,'LoraCon GmbH',7.5,true);
            text(left,49,'Lothar Rapp Container + Transporte',6.3,false);
            text(left,59,'Hinter der Ziegelhütte 7',6.3,false);
            text(left,69,'71665 Vaihingen/Enz - Horrheim',6.3,false);
            text(W-right-135,42,'Lora',20,true);
            setGreen();text(W-right-88,42,'Con',20,true);
            setBlack();text(W-right-135,55,'Container + Transporte',5.8,false);
            setGreen();line(left,78,W-right,78,2.0);setBlack();

            text(left,99,'Arbeitnehmerbezogene Erfassung der täglichen Arbeitszeit',11.5,true);
            text(left,118,'Arbeitgeber:',7.5,true);text(left+92,118,data.employer,7.5,false);
            text(left+410,118,'Monat/Jahr:',7.5,true);text(left+480,118,data.month,7.5,false);
            text(left,135,'Arbeitnehmer:',7.5,true);text(left+92,135,data.employee,7.5,false);
            line(left+88,121,left+400,121,0.35);line(left+88,138,left+400,138,0.35);

            let y=bodyTop;
            const headers=[
              ['Kalender','Tag'],
              ['Beginn','Arbeitszeit'],
              ['Ende','Arbeitszeit'],
              ['Summe Ruhepause','Stunden, Minuten'],
              ['Dauer (minus Pausenzeiten)','Stunden, Minuten','Arbeitszeit nach Tarif'],
              ['Baustelle / Projektnummer']
            ];
            setBlack();line(left,y,left+tableW,y,0.55);line(left,y+headerH,left+tableW,y+headerH,0.55);
            let x=left;
            headers.forEach((h,i)=>{
              line(x,y,x,y+headerH,0.45);
              const fs=i===4?5.4:6.0;
              const lead=6.5;
              centerLines(x,y+13,colW[i],h,fs,lead,true);
              x+=colW[i];
            });
            line(left+tableW,y,left+tableW,y+headerH,0.45);
            y+=headerH;

            // Beispielzeile gehört zur Originalvorlage
            line(left,y,left+tableW,y,0.45);line(left,y+exampleH,left+tableW,y+exampleH,0.45);
            x=left;
            for(let i=0;i<6;i++){
              line(x,y,x,y+exampleH,0.45);
              const val=i===0?'Beispiel:':(i===5?(data.example[5]||'Stuttgart'):'');
              if(val)text(x+4,y+15,val,6.3,i===0);
              x+=colW[i];
            }
            line(left+tableW,y,left+tableW,y+exampleH,0.45);
            y+=exampleH;

            data.days.forEach((r,idx)=>{
              const rh=finalHeights[idx];
              line(left,y,left+tableW,y,0.45);line(left,y+rh,left+tableW,y+rh,0.45);
              x=left;
              for(let i=0;i<6;i++){
                line(x,y,x,y+rh,0.45);
                const raw=r[i]||'';
                if(i===0){
                  const ls=dpL4WrapText(raw,colW[i]-6,7.0);
                  const lead=8.2;
                  centerLines(x,y+15,colW[i],ls.slice(0,3),7.0,lead,true);
                }else if(i===5){
                  const ls=dpL4WrapText(raw,colW[i]-8,projectFs);
                  const max=Math.max(1,Math.floor((rh-8)/projectLeading));
                  textLines(x+4,y+10,ls,projectFs,projectLeading,false,max);
                }else{
                  const fs=7.0;
                  const ls=dpL4WrapText(raw,colW[i]-7,fs);
                  const lead=8.0;
                  centerLines(x,y+Math.max(14,(rh-(Math.min(ls.length,3)-1)*lead)/2),colW[i],ls.slice(0,3),fs,lead,false);
                }
                x+=colW[i];
              }
              line(left+tableW,y,left+tableW,y+rh,0.45);
              y+=rh;
            });

            // Hinweise der Excelvorlage + Erstellvermerk
            const note1='Bei einer Arbeitszeit bis 6 Stunden ist eine Ruhepause von 30 Minuten und bis 9 Stunden ist eine Ruhepause von 45 Minuten einzuhalten!';
            const note2='Die Pausen können in mehreren Teilen zu je mind. 15 Minuten genommen werden!';
            text(left,565,note1,5.5,false);
            text(left,574,note2,5.5,false);
            text(W-right-235,586,'Elektronisch aus DispoPilot erstellt: '+new Date().toLocaleString('de-DE'),5.3,false);
            pages.push(cmds.join('\n'));

            const objects=[];
            const add=o=>{objects.push(o);return objects.length;};
            const catalog=add('');
            const pagesObj=add('');
            const font1=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
            const font2=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
            const pageRefs=[];
            pages.forEach(stream=>{
              const pageRef=add('');
              const contentRef=add(`<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`);
              pageRefs.push(pageRef);
              objects[pageRef-1]=`<< /Type /Page /Parent ${pagesObj} 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /Font << /F1 ${font1} 0 R /F2 ${font2} 0 R >> >> /Contents ${contentRef} 0 R >>`;
            });
            objects[catalog-1]=`<< /Type /Catalog /Pages ${pagesObj} 0 R >>`;
            objects[pagesObj-1]=`<< /Type /Pages /Count ${pageRefs.length} /Kids [${pageRefs.map(r=>r+' 0 R').join(' ')}] >>`;

            let pdf='%PDF-1.4\n%\xE2\xE3\xCF\xD3\n';
            const offsets=[0];
            objects.forEach((obj,i)=>{offsets.push(pdf.length);pdf+=`${i+1} 0 obj\n${obj}\nendobj\n`;});
            const xref=pdf.length;
            pdf+=`xref\n0 ${objects.length+1}\n0000000000 65535 f \n`;
            for(let i=1;i<offsets.length;i++)pdf+=String(offsets[i]).padStart(10,'0')+' 00000 n \n';
            pdf+=`trailer\n<< /Size ${objects.length+1} /Root ${catalog} 0 R >>\nstartxref\n${xref}\n%%EOF\n`;
            return new Blob([dpL2PdfBytes([pdf])],{type:'application/pdf'});
          }

          // L2 Download und L2 Versand verwenden beide denselben Funktionsnamen.
          // Durch diese Überschreibung erhalten daher Download UND Mailanhang das L4-Layout.
          dpL2BuildTimesheetPdf=dpL4BuildTimesheetPdf;

          /* DP_L4_LORACON_PDF_LAYOUT_END */
          """

          t=t.replace(marker,patch+"\n"+marker,1)
          p.write_text(t,encoding="utf-8",newline="\n")
          print("L4: LoraCon-PDF-Layout eingefügt.")
          PY

          grep -q "DP_L4_LORACON_PDF_LAYOUT_BEGIN" dispopilot-online-efd.html
          grep -q "cells.length<6" dispopilot-online-efd.html
          grep -q "Ziegelhütte" dispopilot-online-efd.html
          grep -q "Baustelle / Projektnummer" dispopilot-online-efd.html
          grep -q "dpL2BuildTimesheetPdf=dpL4BuildTimesheetPdf" dispopilot-online-efd.html

      - name: Apply L5 unified completed-order data and hide legacy abbreviations
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path("dispopilot-online-efd.html")
          t=p.read_text(encoding="utf-8")
          marker="/* DP13_PATCH_BEGIN */"
          if t.count(marker)!=1:
              raise SystemExit(f"L5 abgebrochen: DP13-Marker {t.count(marker)}x gefunden statt 1x.")

          patch=r"""
          /* DP_L5_EINHEITLICHE_AUFTRAEGE_OHNE_KUERZEL_BEGIN */
          // L5: Vorschau und PDF beziehen die letzte Spalte aus EINER gemeinsamen Quelle.
          // Sichtbar sind nur tatsächlich ausgeführte Aufträge des Fahrers.
          // Pro Auftrag: Kunde / Baustelle / Tätigkeit. Keine Excel-Kürzel, keine Mulden-/Materialdetails.

          function dpL5OrderKey(o){
            return String(o?.id||[o?.date,o?.customerId,o?.siteId,o?.task,o?.seq].join('|'));
          }

          function dpL5CompletedOrdersForDate(date){
            const seen=new Set();
            const all=[...(state.orders||[]),...(state.archiveOrders||[])];
            return all
              .filter(o=>o&&o.date===date&&(!o.driver||o.driver===state.user.name)&&o.status==='Ausgeführt')
              .filter(o=>{
                const k=dpL5OrderKey(o);
                if(seen.has(k))return false;
                seen.add(k);
                return true;
              })
              .sort((a,b)=>(Number(a.seq)||999)-(Number(b.seq)||999)||Number(a.id||0)-Number(b.id||0));
          }

          function dpL5OrderText(o){
            const c=customer(o?.customerId),s=site(o?.siteId);
            return [c?.name||'',s?.name||'',o?.task||'']
              .map(v=>String(v||'').replace(/\s+/g,' ').trim())
              .filter(Boolean)
              .join(' / ');
          }

          // Die bestehende Vorschau benutzt timesheetOrderText / timesheetOrderGroups.
          // Beide werden auf dieselbe neue Datenquelle gelegt.
          timesheetOrderText=function(o){return dpL5OrderText(o)};
          timesheetOrderGroups=function(date){
            const texts=dpL5CompletedOrdersForDate(date).map(dpL5OrderText).filter(Boolean);
            if(!texts.length)return ['','',''];
            const per=Math.max(1,Math.ceil(texts.length/3));
            return [0,1,2].map(i=>texts.slice(i*per,(i+1)*per).join('\n'));
          };

          // Zeilenumbrüche der einzelnen Aufträge in der Vorschau sichtbar machen.
          (function(){
            const st=document.createElement('style');
            st.id='dpL5TimesheetStyle';
            st.textContent='.tsProject{white-space:pre-line!important}';
            document.head.appendChild(st);
          })();

          // PDF: Zeiten + Aufträge werden direkt aus state gelesen.
          // Damit kann die PDF nicht mehr andere Auftragszeilen als die Vorschau erwischen.
          function dpL5ExtractTimesheet(){
            ensureWeekEntries();
            const start=new Date(String(selectedWeekMonday)+'T12:00:00');
            if(Number.isNaN(start.getTime()))throw new Error('Ungültige Kalenderwoche.');
            const days=[];
            for(let i=0;i<7;i++){
              const d=new Date(start);d.setDate(d.getDate()+i);
              const iso=plusDays(selectedWeekMonday,i);
              const e=(state.timeEntries||[]).find(x=>x.date===iso&&x.driver===state.user.name)||{};
              const mins=calcMinutes(e.start||'',e.end||'',e.pause||'');
              const orders=dpL5CompletedOrdersForDate(iso).map(dpL5OrderText).filter(Boolean).join('\n');
              days.push([
                dpL4Weekday(d)+'\n'+dpL4DateKey(d),
                e.start||'',
                e.end||'',
                e.pause||'',
                mins?fmtMinutes(mins):'',
                orders
              ]);
            }
            return {
              employer:'LoraCon GmbH',
              employee:dpL4CleanText(state.user.name||'',false),
              month:dpL4WeekMonthLabel(),
              example:['Beispiel:','','','','','Stuttgart'],
              days
            };
          }
          dpL4ExtractTimesheet=dpL5ExtractTimesheet;

          // Excel-Kürzel bleiben für alte Datensätze intern erhalten, werden aber nicht mehr angezeigt.
          function dpL5HideLegacyCodeFields(){
            ['cCode','sCode'].forEach(id=>{
              const el=$(id);
              const wrap=el&&el.closest?el.closest('div'):null;
              if(wrap)wrap.classList.add('hidden');
            });
          }

          renderCustomers=function(){
            const q=($('customerSearch').value||'').toLocaleLowerCase('de');
            const list=(state.customers||[]).slice()
              .sort((a,b)=>a.name.localeCompare(b.name,'de'))
              .filter(c=>String(c.name||'').toLocaleLowerCase('de').includes(q));
            $('customerList').innerHTML=list.map(c=>
              `<div class="card" onclick="openCustomer(${c.id})" style="cursor:pointer"><div class="row"><div class="grow"><strong>${esc(c.name)}</strong><div class="small">${c.mail?esc(c.mail):'keine Rapport-E-Mail'}</div></div><span class="badge">${(state.sites||[]).filter(s=>(s.customerId??s.cid)===c.id).length} Baustellen</span></div></div>`
            ).join('');
          };

          renderSites=function(){
            const cid=+$('siteFilter').value||0;
            const list=(state.sites||[]).slice()
              .sort((a,b)=>a.name.localeCompare(b.name,'de'))
              .filter(s=>!cid||(s.customerId??s.cid)===cid);
            $('siteList').innerHTML=list.map(s=>{
              const addr=[s.street,s.zip,s.city].filter(Boolean).join(', ');
              return `<div class="card" onclick="openSite(${s.id})" style="cursor:pointer"><strong>${esc(s.name)}</strong><div class="small">${esc(customer(s.customerId??s.cid)?.name||'')}</div>${addr?`<div class="small">${esc(addr)}</div>`:''}</div>`;
            }).join('');
          };

          dpL5HideLegacyCodeFields();
          /* DP_L5_EINHEITLICHE_AUFTRAEGE_OHNE_KUERZEL_END */
          """

          t=t.replace(marker,patch+"\n"+marker,1)
          p.write_text(t,encoding="utf-8",newline="\n")
          print("L5: einheitliche ausgeführte Aufträge und sichtbare Kürzel entfernt.")
          PY

          grep -q "DP_L5_EINHEITLICHE_AUFTRAEGE_OHNE_KUERZEL_BEGIN" dispopilot-online-efd.html
          grep -q "o.status==='Ausgeführt'" dispopilot-online-efd.html
          grep -q "return \[c?.name||'',s?.name||'',o?.task||''\]" dispopilot-online-efd.html
          grep -q "dpL4ExtractTimesheet=dpL5ExtractTimesheet" dispopilot-online-efd.html
          grep -q "dpL5HideLegacyCodeFields" dispopilot-online-efd.html

      - name: Apply F3 simplified popup acknowledgement and change type
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path("dispopilot-online-efd.html")
          t=p.read_text(encoding="utf-8")
          marker="/* DP13_PATCH_END */"
          if t.count(marker)!=1:
              raise SystemExit(f"F3 abgebrochen: DP13-Endmarker {t.count(marker)}x gefunden statt 1x.")

          patch=r"""
          /* DP_F3_POPUP_LOGIK_BEGIN */
          // F3: Ein Klick zum Ansehen, Quittierung automatisch beim Schließen.
          // Zusätzlich erhält jede Meldung eine verständliche Änderungsart.

          let dpF3LastChangeInfo=null;
          let dpF3HooksInstalled=false;

          function dpF3ChangedKeys(a,b){
            const keys=['date','driver','vehicle','seq','customerId','siteId','task','count','bin1','bin2','bin3','material','drop','billing','note','existingBinNumber','newBinNumber'];
            return keys.filter(k=>JSON.stringify(a?.[k]??'')!==JSON.stringify(b?.[k]??''));
          }

          function dpF3ClassifyOrderChange(a,b){
            const keys=dpF3ChangedKeys(a,b);
            if(keys.length===1&&keys[0]==='seq'){
              return {kind:'Reihenfolge geändert',message:'Die Disposition hat die Fahrreihenfolge dieses Auftrags geändert.'};
            }
            if(keys.length===1&&keys[0]==='date'){
              return {kind:'Termin geändert',message:'Die Disposition hat den Ausführungstag dieses Auftrags geändert.'};
            }
            if(keys.length===1&&keys[0]==='vehicle'){
              return {kind:'Fahrzeug geändert',message:'Die Disposition hat das Fahrzeug dieses Auftrags geändert.'};
            }
            return {kind:'Auftrag geändert',message:'Die Disposition hat Angaben in diesem Auftrag geändert.'};
          }

          // Die vorhandene DP13-Änderungserkennung bleibt maßgeblich. F3 merkt
          // sich nur, welche Art von Änderung unmittelbar vor der Meldung vorlag.
          const dpF3BaseChanged=dp13Changed;
          dp13Changed=function(a,b){
            const changed=dpF3BaseChanged(a,b);
            dpF3LastChangeInfo=changed?dpF3ClassifyOrderChange(a,b):null;
            return changed;
          };

          const dpF3BaseAddNotice=dp13AddNotice;
          dp13AddNotice=function(driver,orderId,kind,message){
            if(kind==='Auftrag geändert'&&dpF3LastChangeInfo){
              kind=dpF3LastChangeInfo.kind;
              message=dpF3LastChangeInfo.message;
            }
            const r=dpF3BaseAddNotice(driver,orderId,kind,message);
            dpF3LastChangeInfo=null;
            return r;
          };

          function dpF3SimplifyNoticeUi(){
            dp13EnsureUi();
            const ack=document.getElementById('dp13AckBtn');
            if(ack)ack.remove();
            const buttons=document.querySelector('#dp13Notice .dp13Buttons');
            if(buttons)buttons.style.gridTemplateColumns='1fr';
            const open=document.getElementById('dp13OpenBtn');
            if(open)open.textContent='Auftrag ansehen';
          }

          // F3 ersetzt die zweistufige Anzeige vollständig. Es gibt keinen
          // zweiten Bestätigen-Button mehr. Art, Auftrag und Zeitpunkt bleiben sichtbar.
          dp13CheckNotices=function(){
            if(!state)return;
            dpF3SimplifyNoticeUi();
            const list=dp13PendingNotices(),modal=document.getElementById('dp13Notice');
            if(!list.length){
              dp13ActiveNoticeId=null;
              modal.classList.remove('show');
              return;
            }
            const n=list[0],o=orderById(n.orderId);
            dp13ActiveNoticeId=n.id;
            document.getElementById('dp13Counter').textContent=list.length>1?'Offene Dispo-Meldungen: '+list.length:'Neue Dispo-Meldung';
            document.getElementById('dp13NoticeKind').textContent=n.kind||'Auftrag geändert';
            document.getElementById('dp13NoticeMeta').textContent=dp13OrderLabel(o)+(n.createdAt?' · '+new Date(n.createdAt).toLocaleString('de-DE'):'');
            const message=n.message||'Die Disposition hat diesen Auftrag geändert.';
            document.getElementById('dp13NoticeText').textContent=(n.openedAt?'Bereits geöffnet – noch nicht abgeschlossen. ':'')+message+' Auftrag ansehen; beim Schließen gilt diese Meldung automatisch als gelesen.';
            modal.classList.add('show');
          };

          // Auftrag ansehen schließt das Popup sofort. Falls der Auftrag inzwischen
          // nicht mehr im laufenden Bestand ist, darf die Meldung nicht festhängen.
          dp13OpenNoticeOrder=async function(){
            const n=dp13NoticeList().find(x=>x.id===dp13ActiveNoticeId);
            if(!n)return;
            if(!n.openedAt){n.openedAt=nowIso();await persist()}
            document.getElementById('dp13Notice').classList.remove('show');
            dp13ReturnNoticeId=n.id;
            const o=orderById(n.orderId);
            if(o){
              openDetail(o.id);
              return;
            }
            n.acknowledgedAt=nowIso();
            dp13ReturnNoticeId=null;
            await persist();
            alert('Der betroffene Auftrag ist nicht mehr im laufenden Bestand. Die Meldung wurde als gelesen markiert.');
            dp13ActiveNoticeId=null;
            setTimeout(dp13CheckNotices,40);
          };

          function dpF3InstallHooks(){
            if(dpF3HooksInstalled)return;
            dpF3HooksInstalled=true;

            // F2 zeigte nach dem Schließen des angesehenen Auftrags das Popup erneut.
            // F3 quittiert genau diese Meldung stattdessen automatisch.
            const dpF3BaseCloseM=closeM;
            closeM=function(id){
              if(id==='detailModal'&&dp13ReturnNoticeId){
                const noticeId=dp13ReturnNoticeId;
                dp13ReturnNoticeId=null;
                const r=dpF3BaseCloseM(id);
                const n=dp13NoticeList().find(x=>x.id===noticeId);
                if(n&&!n.acknowledgedAt)n.acknowledgedAt=nowIso();
                dp13ActiveNoticeId=null;
                Promise.resolve(persist()).finally(()=>setTimeout(dp13CheckNotices,40));
                return r;
              }
              return dpF3BaseCloseM(id);
            };

            // Direkte Reihenfolgeänderung über die ↑/↓-Funktion der Planung.
            // Nur der aktiv verschobene Auftrag erzeugt eine Meldung; dadurch
            // entstehen bei einem einfachen Tausch nicht unnötig zwei Popups.
            const dpF3BaseMoveOrder=moveOrder;
            moveOrder=async function(id,dir){
              const isDispo=typeof dp13IsDisposition==='function'&&dp13IsDisposition();
              const before=orderById(id)?JSON.parse(JSON.stringify(orderById(id))):null;
              const result=await dpF3BaseMoveOrder.apply(this,arguments);
              const after=orderById(id);
              if(isDispo&&before&&after&&Number(before.seq)!==Number(after.seq)&&after.driver){
                dpF3BaseAddNotice(
                  after.driver,
                  after.id,
                  'Reihenfolge geändert',
                  'Die Disposition hat die Fahrreihenfolge dieses Auftrags von '+String(before.seq||'?')+' auf '+String(after.seq||'?')+' geändert.'
                );
                await persist();
                if(typeof dp13CheckNotices==='function')setTimeout(dp13CheckNotices,40);
              }
              return result;
            };

            // Statusänderung durch Disposition als eigene Meldungsart kennzeichnen.
            const dpF3BaseConfirmStatus=confirmStatus;
            confirmStatus=async function(){
              const isDispo=typeof dp13IsDisposition==='function'&&dp13IsDisposition();
              const id=currentOrderId;
              const before=orderById(id)?JSON.parse(JSON.stringify(orderById(id))):null;
              const known=new Set(dp13NoticeList().map(n=>n.id));
              const result=await dpF3BaseConfirmStatus.apply(this,arguments);
              const after=orderById(id)||((state.archiveOrders||[]).find(o=>o.id===id));
              if(isDispo&&before&&after&&before.status!==after.status&&after.driver){
                const msg='Die Disposition hat den Status von „'+String(before.status||'')+'“ auf „'+String(after.status||'')+'“ geändert.';
                const added=dp13NoticeList().filter(n=>!known.has(n.id)&&n.orderId===id&&n.driver===after.driver);
                if(added.length){
                  const n=added[added.length-1];
                  n.kind='Status geändert';
                  n.message=msg;
                }else{
                  dpF3BaseAddNotice(after.driver,id,'Status geändert',msg);
                }
                await persist();
              }
              return result;
            };
          }

          const dpF3BaseInit=dp13Init;
          dp13Init=async function(){
            await dpF3BaseInit.apply(this,arguments);
            dpF3SimplifyNoticeUi();
            dpF3InstallHooks();
          };

          /* DP_F3_POPUP_LOGIK_END */
          """

          t=t.replace(marker,patch+"\n"+marker,1)
          p.write_text(t,encoding="utf-8",newline="\n")
          print("F3: vereinfachte Popup-Quittierung und Änderungsarten eingefügt.")
          PY

          grep -q "DP_F3_POPUP_LOGIK_BEGIN" dispopilot-online-efd.html
          grep -q "Reihenfolge geändert" dispopilot-online-efd.html
          grep -q "Neuer Auftrag" dispopilot-online-efd.html
          grep -q "Status geändert" dispopilot-online-efd.html
          grep -q "const dpF3BaseMoveOrder=moveOrder" dispopilot-online-efd.html
          grep -q "beim Schließen gilt diese Meldung automatisch als gelesen" dispopilot-online-efd.html
          grep -q "if(ack)ack.remove()" dispopilot-online-efd.html
          grep -q "n.acknowledgedAt=nowIso()" dispopilot-online-efd.html

      - name: Apply F4 immediate edit modal flow
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path("dispopilot-online-efd.html")
          t=p.read_text(encoding="utf-8")
          marker="/* DP13_PATCH_END */"
          if t.count(marker)!=1:
              raise SystemExit(f"F4 abgebrochen: DP13-Endmarker {t.count(marker)}x gefunden statt 1x.")

          patch=r"""
          /* DP_F4_EDIT_MODAL_FLOW_BEGIN */
          // F4: "Auftrag bearbeiten" aus der Detailansicht muss sofort sichtbar sein.
          // Die Detailansicht wird automatisch geschlossen, sobald die Bearbeitungsmaske geöffnet ist.

          let dpF4DeferNoticesUntilEditorCloses=false;

          // Falls der Auftrag aus einem F3-Popup geöffnet wurde, wird die zugehörige
          // Meldung beim Wechsel in Bearbeiten quittiert. Eine eventuell nächste
          // Meldung wartet jedoch, bis die Bearbeitungsmaske wieder geschlossen ist.
          const dpF4BaseCheckNotices=dp13CheckNotices;
          dp13CheckNotices=function(){
            const editor=document.getElementById('orderModal');
            if(dpF4DeferNoticesUntilEditorCloses&&editor?.classList.contains('show'))return;
            dpF4DeferNoticesUntilEditorCloses=false;
            return dpF4BaseCheckNotices.apply(this,arguments);
          };

          const dpF4BaseEditOrder=editOrder;
          editOrder=function(id=null){
            const detail=document.getElementById('detailModal');
            const detailWasOpen=!!detail?.classList.contains('show');
            const openedFromNotice=detailWasOpen&&!!dp13ReturnNoticeId;

            // Erst die vorhandene Bearbeitungslogik ausführen, damit alle Daten
            // wie bisher vollständig geladen werden.
            const result=dpF4BaseEditOrder.apply(this,arguments);

            // Danach das Detailfenster automatisch wegnehmen. Damit liegt die
            // Bearbeitungsmaske nicht mehr unsichtbar dahinter.
            if(detailWasOpen){
              if(openedFromNotice)dpF4DeferNoticesUntilEditorCloses=true;
              closeM('detailModal');
            }
            return result;
          };

          // Wurde während der Bearbeitung eine weitere Fahrer-Meldung zurückgestellt,
          // darf sie unmittelbar nach dem Schließen/Speichern des Editors erscheinen.
          const dpF4BaseCloseM=closeM;
          closeM=function(id){
            const result=dpF4BaseCloseM.apply(this,arguments);
            if(id==='orderModal'&&dpF4DeferNoticesUntilEditorCloses){
              dpF4DeferNoticesUntilEditorCloses=false;
              setTimeout(()=>dp13CheckNotices(),40);
            }
            return result;
          };
          /* DP_F4_EDIT_MODAL_FLOW_END */
          """

          t=t.replace(marker,patch+"\n"+marker,1)
          p.write_text(t,encoding="utf-8",newline="\n")
          print("F4: Auftragsdetail wird beim Bearbeiten automatisch geschlossen.")
          PY

          grep -q "DP_F4_EDIT_MODAL_FLOW_BEGIN" dispopilot-online-efd.html
          grep -q "const dpF4BaseEditOrder=editOrder" dispopilot-online-efd.html
          grep -q "if(detailWasOpen)" dispopilot-online-efd.html
          grep -q "closeM('detailModal')" dispopilot-online-efd.html
          grep -q "dpF4DeferNoticesUntilEditorCloses" dispopilot-online-efd.html

      - name: Apply Q1 copy order in planning only
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path("dispopilot-online-efd.html")
          t=p.read_text(encoding="utf-8")
          marker="/* DP13_PATCH_END */"
          if t.count(marker)!=1:
              raise SystemExit(f"Q1 abgebrochen: DP13-Endmarker {t.count(marker)}x gefunden statt 1x.")

          patch=r"""
          /* DP_Q1_AUFTRAG_KOPIEREN_PLANUNG_BEGIN */
          // Q1: Kopierfunktion ausschließlich in der Planungs-/Dispositionsansicht.
          // Der kopierte Datensatz ist ein neuer, eigenständiger Auftrag.

          let dpQ1CopyBusy=false;

          function dpQ1PlanningCopy(o){
            const now=nowIso();
            const driver=String(o?.driver||'');
            const date=String(o?.date||selectedDate||'');

            // Die Kopie kommt beim gleichen Fahrer zunächst ans Ende des Tages.
            let seq='';
            if(driver&&date){
              const seqs=(state.orders||[])
                .filter(x=>x.date===date&&x.driver===driver&&x.seq)
                .map(x=>Number(x.seq)||0)
                .filter(Boolean);
              seq=seqs.length?Math.max(...seqs)+1:1;
            }

            const count=Math.max(1,Math.min(10,Number(o?.count||1)));
            const binTypes=Array.isArray(o?.binTypes)
              ?o.binTypes.slice(0,count)
              :[o?.bin1||'',o?.bin2||'',o?.bin3||''].slice(0,count);

            return {
              id:uid(),
              date,
              driver,
              vehicle:o?.vehicle||'',
              seq,
              customerId:o?.customerId,
              siteId:o?.siteId,
              task:o?.task||'Stellen',
              count,
              bin1:binTypes[0]||o?.bin1||'',
              bin2:count>1?(binTypes[1]||o?.bin2||''):'',
              bin3:count>2?(binTypes[2]||o?.bin3||''):'',
              binTypes,
              material:o?.material||'',
              drop:o?.drop||'',
              billing:o?.billing||'Pauschale',
              note:o?.note||'',

              // Neue Fahrt = keine alte Muldennummer/Ausführung übernehmen.
              // Die tatsächliche Mulde wird wie besprochen bei der Ausführung bestätigt.
              binNumbers:'',
              existingBinNumber:'',
              existingBinNumbers:[],
              newBinNumber:'',
              newBinNumbers:[],
              actualBinNumbers:[],
              actualExistingBinNumbers:[],
              actualConfirmedAt:'',
              actualConfirmedBy:'',

              // Keine Status-, Rapport- oder Fehlversuchsdaten der Vorlage übernehmen.
              status:'Geplant',
              reason:'',
              reasonExtra:'',
              start:'',
              end:'',
              pause:'',
              lsNo:'',
              nonExecutionHistory:[],
              createdAt:now,
              updatedAt:now
            };
          }

          function dpQ1Toast(text){
            let el=document.getElementById('dpQ1Toast');
            if(!el){
              el=document.createElement('div');
              el.id='dpQ1Toast';
              el.style.cssText='position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:120;background:#166534;color:white;padding:10px 14px;border-radius:10px;font-weight:750;box-shadow:0 3px 14px #0004;max-width:90vw;text-align:center';
              document.body.appendChild(el);
            }
            el.textContent=text;
            el.style.display='block';
            clearTimeout(dpQ1Toast.timer);
            dpQ1Toast.timer=setTimeout(()=>{el.style.display='none'},1500);
          }

          async function dpQ1CopyOrder(id){
            if(dpQ1CopyBusy)return;
            const source=orderById(id);
            if(!source)return alert('Der zu kopierende Auftrag wurde nicht gefunden.');

            dpQ1CopyBusy=true;
            try{
              const copy=dpQ1PlanningCopy(source);
              state.orders.push(copy);

              // Bestehende D-Fahrfolgelogik bleibt maßgeblich.
              if(copy.driver&&copy.date&&typeof dpDNormalizeGroup==='function'){
                dpDNormalizeGroup(copy.date,copy.driver);
              }

              // Ein kopierter, fest zugeordneter Auftrag ist für den Fahrer ein neuer Auftrag.
              if(copy.driver&&typeof dp13IsDisposition==='function'&&dp13IsDisposition()&&typeof dpF3BaseAddNotice==='function'){
                dpF3BaseAddNotice(
                  copy.driver,
                  copy.id,
                  'Neuer Auftrag',
                  'Die Disposition hat einen neuen Auftrag durch Kopieren eingeplant.'
                );
              }

              await persist();
              renderPlanning();
              if(typeof renderOrders==='function')renderOrders();
              dpQ1Toast('Auftrag kopiert · Fahrfolge '+String(copy.seq||'offen'));
            }catch(e){
              console.error('DispoPilot Q1 Auftrag kopieren:',e);
              alert('Der Auftrag konnte nicht kopiert werden.');
            }finally{
              dpQ1CopyBusy=false;
            }
          }

          // Nur die Planung erhält den Kopierbutton. Fahrer-/Auftragsansicht bleibt unverändert.
          renderPlanning=function(){
            updatePlanningWeekHeader();
            weekToolbar('weekToolbar','selectPlanningDate');
            driverToolbar();
            let list=state.orders
              .filter(o=>o.date===selectedDate&&(selectedDriver==='all'||(selectedDriver==='__open__'?(!o.driver||!o.vehicle||!o.seq):o.driver===selectedDriver)))
              .sort((a,b)=>(a.driver||'ZZZ').localeCompare(b.driver||'ZZZ','de')||((a.seq||999)-(b.seq||999)));

            if(!list.length){
              $('planList').innerHTML='<div class="card small">Für diesen Tag sind keine Aufträge vorhanden.</div>';
              return;
            }

            const groups={};
            list.forEach(o=>{
              const key=o.driver||'Noch nicht disponiert';
              (groups[key]??=[]).push(o);
            });

            $('planList').innerHTML=Object.entries(groups).map(([d,os])=>
              `<div class="section">${esc(d)}</div>`+
              os.map(o=>`<div class="row">
                <div class="grow">${orderCard(o)}</div>
                <div class="row" style="gap:5px;justify-content:flex-end">
                  ${o.driver&&o.seq?`<button class="btn secondary" type="button" title="eine Position nach oben" onclick="event.stopPropagation();moveOrder(${o.id},-1)">↑</button>
                  <button class="btn secondary" type="button" title="eine Position nach unten" onclick="event.stopPropagation();moveOrder(${o.id},1)">↓</button>`:''}
                  <button class="btn secondary" type="button" title="Auftrag als neuen geplanten Auftrag kopieren" onclick="event.stopPropagation();dpQ1CopyOrder(${o.id})">⧉ Kopieren</button>
                </div>
              </div>`).join('')
            ).join('');
          };
          /* DP_Q1_AUFTRAG_KOPIEREN_PLANUNG_END */
          """

          t=t.replace(marker,patch+"\n"+marker,1)
          p.write_text(t,encoding="utf-8",newline="\n")
          print("Q1: Auftrag kopieren nur in der Planung eingefügt.")
          PY

          grep -q "DP_Q1_AUFTRAG_KOPIEREN_PLANUNG_BEGIN" dispopilot-online-efd.html
          grep -q "async function dpQ1CopyOrder" dispopilot-online-efd.html
          grep -q "⧉ Kopieren" dispopilot-online-efd.html
          grep -q "status:'Geplant'" dispopilot-online-efd.html
          grep -q "actualBinNumbers:\[\]" dispopilot-online-efd.html
          grep -q "Die Disposition hat einen neuen Auftrag durch Kopieren eingeplant" dispopilot-online-efd.html

      - name: Apply Q2 delete planned orders in planning only
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path("dispopilot-online-efd.html")
          t=p.read_text(encoding="utf-8")
          marker="/* DP13_PATCH_END */"
          if t.count(marker)!=1:
              raise SystemExit(f"Q2 abgebrochen: DP13-Endmarker {t.count(marker)}x gefunden statt 1x.")

          patch=r"""
          /* DP_Q2_AUFTRAG_LOESCHEN_PLANUNG_BEGIN */
          // Q2: Löschen ausschließlich in Planung/Disposition und nur für
          // unberührte Aufträge mit Status Geplant. Intern bleibt ein Audit-Snapshot.

          let dpQ2DeleteBusy=false;

          function dpQ2CanDeleteOrder(o){
            if(!o||String(o.status||'Geplant')!=='Geplant')return false;
            if(o.actualConfirmedAt||o.actualConfirmedBy)return false;
            if((o.actualBinNumbers||[]).length||(o.actualExistingBinNumbers||[]).length)return false;
            if(String(o.start||'')||String(o.end||'')||String(o.lsNo||''))return false;
            if(Array.isArray(o.nonExecutionHistory)&&o.nonExecutionHistory.length)return false;
            return true;
          }

          function dpQ2DeleteLabel(o){
            const c=typeof customer==='function'?customer(o.customerId):null;
            const s=typeof site==='function'?site(o.siteId):null;
            return [c?.name||'',s?.name||'',o?.task||''].filter(Boolean).join(' / ')||'Auftrag';
          }

          async function dpQ2DeleteOrder(id){
            if(dpQ2DeleteBusy)return;
            const o=orderById(id);
            if(!o)return alert('Der Auftrag wurde nicht gefunden.');
            if(!dpQ2CanDeleteOrder(o)){
              return alert('Dieser Auftrag kann nicht mehr gelöscht werden. Löschen ist nur bei einem noch nicht ausgeführten Auftrag mit Status „Geplant“ ohne Ausführungs- oder Historiedaten möglich.');
            }

            const label=dpQ2DeleteLabel(o);
            if(!confirm('Auftrag wirklich löschen?\n\n'+label+'\n\nDer Auftrag verschwindet aus der Planung.'))return;

            dpQ2DeleteBusy=true;
            try{
              const oldDate=o.date;
              const oldDriver=o.driver;
              const deletedAt=nowIso();
              const deletedBy=state?.user?.name||state?.user?.email||'';

              // Audit-Snapshot: nicht in der normalen Historie sichtbar, aber technisch erhalten.
              state.archiveOrders=state.archiveOrders||[];
              const audit=clone(o);
              audit.deletedInPlanning=true;
              audit.deletedAt=deletedAt;
              audit.deletedBy=deletedBy;
              audit.archiveSource='In Planung gelöscht';
              audit.statusAtDeletion=o.status||'Geplant';
              state.archiveOrders.push(audit);

              // Ein bereits zugeordneter Fahrer soll wissen, dass der geplante Auftrag entfällt.
              if(o.driver&&typeof dp13AddNotice==='function'){
                dp13AddNotice(
                  o.driver,
                  o.id,
                  'Auftrag gelöscht',
                  'Die Disposition hat den geplanten Auftrag „'+label+'“ gelöscht.'
                );
              }

              state.orders=state.orders.filter(x=>x.id!==id);

              if(oldDate&&oldDriver&&typeof dpDNormalizeGroup==='function'){
                dpDNormalizeGroup(oldDate,oldDriver);
              }

              await persist();
              renderPlanning();
              if(typeof renderOrders==='function')renderOrders();
              if(typeof dpQ1Toast==='function')dpQ1Toast('Auftrag gelöscht');
            }catch(e){
              console.error('DispoPilot Q2 Auftrag löschen:',e);
              alert('Der Auftrag konnte nicht gelöscht werden.');
            }finally{
              dpQ2DeleteBusy=false;
            }
          }

          // Gelöschte Planungsaufträge bleiben als Audit-Datensatz erhalten,
          // werden aber in der normalen Historienansicht nicht angezeigt.
          if(typeof renderHistory==='function'){
            const dpQ2BaseRenderHistory=renderHistory;
            renderHistory=function(){
              const all=state.archiveOrders||[];
              state.archiveOrders=all.filter(o=>!o.deletedInPlanning);
              try{
                return dpQ2BaseRenderHistory.apply(this,arguments);
              }finally{
                state.archiveOrders=all;
              }
            };
          }

          // Für „Auftrag gelöscht“ gibt es nichts mehr zu öffnen: eine einfache
          // Quittierung reicht und verhindert einen irreführenden Öffnen-Dialog.
          if(typeof dp13CheckNotices==='function'){
            const dpQ2BaseCheckNotices=dp13CheckNotices;
            dp13CheckNotices=function(){
              const r=dpQ2BaseCheckNotices.apply(this,arguments);
              const n=dp13NoticeList().find(x=>x.id===dp13ActiveNoticeId);
              if(n&&n.kind==='Auftrag gelöscht'){
                const open=document.getElementById('dp13OpenBtn');
                if(open)open.textContent='Meldung schließen';
                const txt=document.getElementById('dp13NoticeText');
                if(txt)txt.textContent=(n.message||'Die Disposition hat einen geplanten Auftrag gelöscht.')+' Diese Meldung kann direkt geschlossen werden.';
              }
              return r;
            };
          }

          if(typeof dp13OpenNoticeOrder==='function'){
            const dpQ2BaseOpenNoticeOrder=dp13OpenNoticeOrder;
            dp13OpenNoticeOrder=async function(){
              const n=dp13NoticeList().find(x=>x.id===dp13ActiveNoticeId);
              if(n&&n.kind==='Auftrag gelöscht'){
                if(!n.openedAt)n.openedAt=nowIso();
                n.acknowledgedAt=nowIso();
                dp13ActiveNoticeId=null;
                dp13ReturnNoticeId=null;
                const modal=document.getElementById('dp13Notice');
                if(modal)modal.classList.remove('show');
                await persist();
                setTimeout(dp13CheckNotices,40);
                return;
              }
              return dpQ2BaseOpenNoticeOrder.apply(this,arguments);
            };
          }

          // Q1 hatte renderPlanning bereits für Kopieren erweitert. Q2 ergänzt
          // dort den Löschbutton ausschließlich für zulässige geplante Aufträge.
          renderPlanning=function(){
            updatePlanningWeekHeader();
            weekToolbar('weekToolbar','selectPlanningDate');
            driverToolbar();
            let list=state.orders
              .filter(o=>o.date===selectedDate&&(selectedDriver==='all'||(selectedDriver==='__open__'?(!o.driver||!o.vehicle||!o.seq):o.driver===selectedDriver)))
              .sort((a,b)=>(a.driver||'ZZZ').localeCompare(b.driver||'ZZZ','de')||((a.seq||999)-(b.seq||999)));

            if(!list.length){
              $('planList').innerHTML='<div class="card small">Für diesen Tag sind keine Aufträge vorhanden.</div>';
              return;
            }

            const groups={};
            list.forEach(o=>{
              const key=o.driver||'Noch nicht disponiert';
              (groups[key]??=[]).push(o);
            });

            $('planList').innerHTML=Object.entries(groups).map(([d,os])=>
              `<div class="section">${esc(d)}</div>`+
              os.map(o=>`<div class="row">
                <div class="grow">${orderCard(o)}</div>
                <div class="row" style="gap:5px;justify-content:flex-end;flex-wrap:wrap">
                  ${o.driver&&o.seq?`<button class="btn secondary" type="button" title="eine Position nach oben" onclick="event.stopPropagation();moveOrder(${o.id},-1)">↑</button>
                  <button class="btn secondary" type="button" title="eine Position nach unten" onclick="event.stopPropagation();moveOrder(${o.id},1)">↓</button>`:''}
                  <button class="btn secondary" type="button" title="Auftrag als neuen geplanten Auftrag kopieren" onclick="event.stopPropagation();dpQ1CopyOrder(${o.id})">⧉ Kopieren</button>
                  ${dpQ2CanDeleteOrder(o)?`<button class="btn secondary" style="border-color:#b91c1c;color:#b91c1c" type="button" title="geplanten Auftrag löschen" onclick="event.stopPropagation();dpQ2DeleteOrder(${o.id})">Löschen</button>`:''}
                </div>
              </div>`).join('')
            ).join('');
          };
          /* DP_Q2_AUFTRAG_LOESCHEN_PLANUNG_END */
          """

          t=t.replace(marker,patch+"\n"+marker,1)
          p.write_text(t,encoding="utf-8",newline="\n")
          print("Q2: Löschen geplanter Aufträge nur in der Planung eingefügt.")
          PY

          grep -q "DP_Q2_AUFTRAG_LOESCHEN_PLANUNG_BEGIN" dispopilot-online-efd.html
          grep -q "async function dpQ2DeleteOrder" dispopilot-online-efd.html
          grep -q "deletedInPlanning=true" dispopilot-online-efd.html
          grep -q "Auftrag gelöscht" dispopilot-online-efd.html
          grep -q "Meldung schließen" dispopilot-online-efd.html
          grep -q "dpQ2CanDeleteOrder(o)" dispopilot-online-efd.html
          grep -q "geplanten Auftrag löschen" dispopilot-online-efd.html

      - name: Apply R1 Direktverladung Material and Transportorte
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path("dispopilot-online-efd.html")
          t=p.read_text(encoding="utf-8")
          marker="/* DP13_PATCH_END */"
          if t.count(marker)!=1:
              raise SystemExit(f"R1 abgebrochen: DP13-Endmarker {t.count(marker)}x gefunden statt 1x.")

          patch=r"""
          /* DP_R1_DIREKTVERLADUNG_MATERIAL_TRANSPORTORTE_BEGIN */
          // R1: eine neue Auftragsart "Direktverladung" sowie robuste,
          // touch-taugliche Auswahllisten für Material und Transportorte.
          // Transportorte sind bewusst neutral: derselbe Ort kann im Auftrag
          // Ladeort oder Abladeort sein. Adress-/GPS-Felder sind im Datenmodell
          // bereits vorbereitet, werden in R1 aber noch nicht zwingend gepflegt.

          function dpR1EnsureState(){
            if(!state)return;
            if(!Array.isArray(state.materials))state.materials=[];
            if(!Array.isArray(state.transportLocations))state.transportLocations=[];

            const normalized=[];
            const seen=new Set();
            const add=(raw)=>{
              if(!raw)return;
              const o=(typeof raw==='string')?{name:raw}:raw;
              const name=String(o.name||'').trim();
              if(!name)return;
              const key=name.toLocaleLowerCase('de');
              if(seen.has(key))return;
              seen.add(key);
              normalized.push({
                id:String(o.id||('loc-'+uid())),
                name,
                active:o.active!==false,
                street:String(o.street||''),
                zip:String(o.zip||''),
                city:String(o.city||''),
                phone:String(o.phone||''),
                mapsUrl:String(o.mapsUrl||''),
                lat:o.lat==null?'':o.lat,
                lon:o.lon==null?'':o.lon
              });
            };
            state.transportLocations.forEach(add);

            // Bestehende alte Abladeorte und bereits gespeicherte Aufträge
            // automatisch in die neue gemeinsame Ortsliste übernehmen.
            const oldOptions=document.querySelectorAll('#dropOptions option');
            oldOptions.forEach(x=>add(x.value||x.textContent||''));
            (state.orders||[]).forEach(o=>{
              if(o.drop&&!o.unloadAtSite)add(o.drop);
              if(o.loadLocationName&&!o.loadAtSite)add(o.loadLocationName);
              if(o.unloadLocationName&&!o.unloadAtSite)add(o.unloadLocationName);
            });
            state.transportLocations=normalized;
          }

          function dpR1ActiveLocations(){
            dpR1EnsureState();
            return (state.transportLocations||[])
              .filter(x=>x.active!==false)
              .slice()
              .sort((a,b)=>a.name.localeCompare(b.name,'de'));
          }

          function dpR1FindLocation(id){
            dpR1EnsureState();
            return (state.transportLocations||[]).find(x=>String(x.id)===String(id));
          }

          function dpR1FindLocationByName(name){
            const key=String(name||'').trim().toLocaleLowerCase('de');
            if(!key)return null;
            dpR1EnsureState();
            return (state.transportLocations||[]).find(x=>x.name.toLocaleLowerCase('de')===key)||null;
          }

          function dpR1SiteLabel(){
            const s=site(+$('oSite')?.value);
            return s?.name||'Baustelle';
          }

          function dpR1LocationOptions(selected=''){
            const cur=String(selected||'');
            return '<option value="">— Ort wählen —</option>'
              +dpR1ActiveLocations().map(x=>
                '<option value="'+esc(x.id)+'" '+(String(x.id)===cur?'selected':'')+'>'+esc(x.name)+'</option>'
              ).join('');
          }

          function dpR1MaterialOptions(selected=''){
            dpR1EnsureState();
            const list=(state.materials||[]).slice().sort((a,b)=>String(a).localeCompare(String(b),'de'));
            const cur=String(selected||'');
            let html='<option value="">— Material wählen —</option>';
            html+=list.map(x=>'<option value="'+esc(x)+'" '+(String(x)===cur?'selected':'')+'>'+esc(x)+'</option>').join('');
            if(cur&&!list.some(x=>String(x)===cur))html+='<option value="'+esc(cur)+'" selected>'+esc(cur)+'</option>';
            return html;
          }

          async function dpR1AddMaterial(targetId='dpR1MaterialSelect'){
            const name=String(prompt('Neues Material / neuer Inhalt:')||'').trim();
            if(!name)return;
            dpR1EnsureState();
            if(!state.materials.some(x=>String(x).toLocaleLowerCase('de')===name.toLocaleLowerCase('de'))){
              state.materials.push(name);
              await persist();
            }
            dpR1RefreshSelectors();
            const sel=$(targetId);
            if(sel)sel.value=name;
            if($('oMaterial'))$('oMaterial').value=name;
            if(typeof renderSettings==='function')renderSettings();
          }

          async function dpR1AddLocation(targetId){
            const name=String(prompt('Neuer Transportort:')||'').trim();
            if(!name)return;
            dpR1EnsureState();
            let loc=dpR1FindLocationByName(name);
            if(!loc){
              loc={id:'loc-'+uid(),name,active:true,street:'',zip:'',city:'',phone:'',mapsUrl:'',lat:'',lon:''};
              state.transportLocations.push(loc);
              await persist();
            }else if(loc.active===false){
              loc.active=true;
              await persist();
            }
            dpR1RefreshSelectors();
            const sel=$(targetId);
            if(sel)sel.value=loc.id;
            dpR1SyncLegacyFields();
            if(typeof renderSettings==='function')renderSettings();
          }

          function dpR1InstallTaskOption(){
            const el=$('oTask');
            if(!el)return;
            if(!Array.from(el.options).some(o=>o.value==='Direktverladung')){
              const opt=document.createElement('option');
              opt.value='Direktverladung';
              opt.textContent='Direktverladung';
              // vor den administrativen Tätigkeiten einordnen
              const before=Array.from(el.options).find(o=>['Werkstatt','Aufräumen','Sonstiges'].includes(o.value));
              before?el.insertBefore(opt,before):el.appendChild(opt);
            }
          }

          function dpR1InstallOrderUi(){
            dpR1InstallTaskOption();
            const materialField=$('materialField');
            const dropField=$('dropField');
            if(!materialField||!dropField)return;

            if(!$('dpR1MaterialRow')){
              const old=$('oMaterial');
              if(old)old.style.display='none';
              const remember=$('rememberMaterial')?.closest('.switchline');
              if(remember)remember.style.display='none';
              const row=document.createElement('div');
              row.id='dpR1MaterialRow';
              row.className='row';
              row.innerHTML='<select class="grow" id="dpR1MaterialSelect" onchange="dpR1SyncLegacyFields()"></select>'
                +'<button class="btn secondary" type="button" onclick="dpR1AddMaterial()">＋ Neu</button>';
              materialField.appendChild(row);
            }

            if(!$('dpR1DropRow')){
              const old=$('oDrop');
              if(old)old.style.display='none';
              const row=document.createElement('div');
              row.id='dpR1DropRow';
              row.className='row';
              row.innerHTML='<select class="grow" id="dpR1DropSelect" onchange="dpR1SyncLegacyFields()"></select>'
                +'<button class="btn secondary" type="button" onclick="dpR1AddLocation(\'dpR1DropSelect\')">＋ Neu</button>';
              dropField.appendChild(row);
              const label=dropField.querySelector('label');
              if(label)label.textContent='Abladeort';
            }

            if(!$('dpR1DirectFields')){
              const wrap=document.createElement('div');
              wrap.id='dpR1DirectFields';
              wrap.className='hidden';
              wrap.style.gridColumn='1/-1';
              wrap.innerHTML=
                '<div class="section" style="margin:2px 0 8px">Direktverladung</div>'
                +'<div class="form">'
                +'<div><label>Ladeort</label>'
                +'<label class="switchline" style="margin:0 0 7px"><input id="dpR1LoadAtSite" type="checkbox" onchange="dpR1DirectToggle()"><span>Baustelle als Ladeort</span></label>'
                +'<div class="row" id="dpR1LoadLocationRow"><select class="grow" id="dpR1LoadLocation"></select><button class="btn secondary" type="button" onclick="dpR1AddLocation(\'dpR1LoadLocation\')">＋ Neu</button></div>'
                +'<div class="small" id="dpR1LoadSiteHint"></div></div>'
                +'<div><label>Abladeort</label>'
                +'<label class="switchline" style="margin:0 0 7px"><input id="dpR1UnloadAtSite" type="checkbox" onchange="dpR1DirectToggle()"><span>Baustelle als Abladeort</span></label>'
                +'<div class="row" id="dpR1UnloadLocationRow"><select class="grow" id="dpR1UnloadLocation"></select><button class="btn secondary" type="button" onclick="dpR1AddLocation(\'dpR1UnloadLocation\')">＋ Neu</button></div>'
                +'<div class="small" id="dpR1UnloadSiteHint"></div></div>'
                +'</div>';
              dropField.after(wrap);
            }
          }

          function dpR1RefreshSelectors(){
            dpR1EnsureState();
            dpR1InstallOrderUi();

            const m=$('dpR1MaterialSelect');
            if(m){
              const cur=m.value||$('oMaterial')?.value||'';
              m.innerHTML=dpR1MaterialOptions(cur);
              m.value=cur;
            }
            ['dpR1DropSelect','dpR1LoadLocation','dpR1UnloadLocation'].forEach(id=>{
              const el=$(id);
              if(!el)return;
              const cur=el.value||'';
              el.innerHTML=dpR1LocationOptions(cur);
              if(cur&&Array.from(el.options).some(o=>o.value===cur))el.value=cur;
            });
          }

          function dpR1DirectToggle(){
            const siteName=dpR1SiteLabel();
            const loadAt=!!$('dpR1LoadAtSite')?.checked;
            const unloadAt=!!$('dpR1UnloadAtSite')?.checked;
            $('dpR1LoadLocationRow')?.classList.toggle('hidden',loadAt);
            $('dpR1UnloadLocationRow')?.classList.toggle('hidden',unloadAt);
            if($('dpR1LoadSiteHint'))$('dpR1LoadSiteHint').textContent=loadAt?'Ladeort: '+siteName:'';
            if($('dpR1UnloadSiteHint'))$('dpR1UnloadSiteHint').textContent=unloadAt?'Abladeort: '+siteName:'';
            dpR1SyncLegacyFields();
          }

          function dpR1SyncLegacyFields(){
            const mat=$('dpR1MaterialSelect')?.value||'';
            if($('oMaterial'))$('oMaterial').value=mat;

            if($('oTask')?.value==='Direktverladung'){
              const unloadAt=!!$('dpR1UnloadAtSite')?.checked;
              const unload=dpR1FindLocation($('dpR1UnloadLocation')?.value||'');
              if($('oDrop'))$('oDrop').value=unloadAt?dpR1SiteLabel():(unload?.name||'');
            }else{
              const loc=dpR1FindLocation($('dpR1DropSelect')?.value||'');
              if($('oDrop'))$('oDrop').value=loc?.name||'';
            }
          }

          function dpR1ApplyTaskUi(){
            dpR1InstallOrderUi();
            dpR1RefreshSelectors();
            const direct=$('oTask')?.value==='Direktverladung';
            $('dpR1DirectFields')?.classList.toggle('hidden',!direct);
            // Bei Direktverladung wird die Materialauswahl gezeigt, der normale
            // Abladeort-Block durch die zwei expliziten Ortsfelder ersetzt.
            if(direct){
              $('materialField')?.classList.remove('hidden');
              $('dropField')?.classList.add('hidden');
              $('standingBinField')?.classList.add('hidden');
              $('newBinField')?.classList.add('hidden');
            }
            dpR1DirectToggle();
          }

          function dpR1LoadOrderIntoUi(o){
            dpR1InstallOrderUi();
            dpR1RefreshSelectors();
            if($('dpR1MaterialSelect')){
              $('dpR1MaterialSelect').innerHTML=dpR1MaterialOptions(o?.material||'');
              $('dpR1MaterialSelect').value=o?.material||'';
            }

            const legacyDrop=String(o?.drop||'');
            const legacyLoc=dpR1FindLocation(o?.dropLocationId)||dpR1FindLocationByName(legacyDrop);
            if($('dpR1DropSelect')){
              $('dpR1DropSelect').innerHTML=dpR1LocationOptions(legacyLoc?.id||'');
              $('dpR1DropSelect').value=legacyLoc?.id||'';
            }

            if(o?.task==='Direktverladung'){
              const loadAt=o.loadAtSite===true;
              const unloadAt=o.unloadAtSite===true;
              if($('dpR1LoadAtSite'))$('dpR1LoadAtSite').checked=loadAt;
              if($('dpR1UnloadAtSite'))$('dpR1UnloadAtSite').checked=unloadAt;
              const loadLoc=dpR1FindLocation(o.loadLocationId)||dpR1FindLocationByName(o.loadLocationName||'');
              const unloadLoc=dpR1FindLocation(o.unloadLocationId)||dpR1FindLocationByName(o.unloadLocationName||legacyDrop);
              if($('dpR1LoadLocation')){
                $('dpR1LoadLocation').innerHTML=dpR1LocationOptions(loadLoc?.id||'');
                $('dpR1LoadLocation').value=loadLoc?.id||'';
              }
              if($('dpR1UnloadLocation')){
                $('dpR1UnloadLocation').innerHTML=dpR1LocationOptions(unloadLoc?.id||'');
                $('dpR1UnloadLocation').value=unloadLoc?.id||'';
              }
            }else{
              if($('dpR1LoadAtSite'))$('dpR1LoadAtSite').checked=false;
              if($('dpR1UnloadAtSite'))$('dpR1UnloadAtSite').checked=false;
              if($('dpR1LoadLocation'))$('dpR1LoadLocation').value='';
              if($('dpR1UnloadLocation'))$('dpR1UnloadLocation').value='';
            }
            dpR1ApplyTaskUi();
            dpR1SyncLegacyFields();
          }

          // Die vorhandene taskChanged-Logik bleibt für alle bisherigen
          // Auftragsarten maßgeblich; R1 ergänzt nur Direktverladung und neue Listen.
          const dpR1BaseTaskChanged=taskChanged;
          taskChanged=function(){
            const r=dpR1BaseTaskChanged.apply(this,arguments);
            dpR1ApplyTaskUi();
            return r;
          };

          const dpR1BaseEditOrder=editOrder;
          editOrder=function(id=null){
            dpR1InstallOrderUi();
            dpR1InstallTaskOption();
            const r=dpR1BaseEditOrder.apply(this,arguments);
            const o=id?orderById(id):null;
            dpR1LoadOrderIntoUi(o||{task:'Stellen',material:'',drop:''});
            return r;
          };

          const dpR1BaseSaveOrder=saveOrder;
          saveOrder=async function(){
            dpR1EnsureState();
            dpR1SyncLegacyFields();
            const direct=$('oTask')?.value==='Direktverladung';
            const editId=editingOrderId;
            const beforeIds=new Set((state.orders||[]).map(o=>o.id));

            let rdata=null;
            if(direct){
              const material=String($('dpR1MaterialSelect')?.value||'').trim();
              const loadAt=!!$('dpR1LoadAtSite')?.checked;
              const unloadAt=!!$('dpR1UnloadAtSite')?.checked;
              const loadLoc=loadAt?null:dpR1FindLocation($('dpR1LoadLocation')?.value||'');
              const unloadLoc=unloadAt?null:dpR1FindLocation($('dpR1UnloadLocation')?.value||'');
              if(!material)return alert('Bitte Material auswählen oder neu anlegen.');
              if(!loadAt&&!loadLoc)return alert('Bitte Ladeort auswählen oder „Baustelle als Ladeort“ aktivieren.');
              if(!unloadAt&&!unloadLoc)return alert('Bitte Abladeort auswählen oder „Baustelle als Abladeort“ aktivieren.');
              if(loadAt&&unloadAt)return alert('Bei Direktverladung können Ladeort und Abladeort nicht beide dieselbe Baustelle sein.');
              rdata={
                loadAtSite:loadAt,
                unloadAtSite:unloadAt,
                loadLocationId:loadLoc?.id||'',
                loadLocationName:loadAt?dpR1SiteLabel():(loadLoc?.name||''),
                unloadLocationId:unloadLoc?.id||'',
                unloadLocationName:unloadAt?dpR1SiteLabel():(unloadLoc?.name||''),
                dropLocationId:unloadLoc?.id||''
              };
            }else{
              const dropLoc=dpR1FindLocation($('dpR1DropSelect')?.value||'');
              rdata={
                loadAtSite:false,unloadAtSite:false,
                loadLocationId:'',loadLocationName:'',
                unloadLocationId:'',unloadLocationName:'',
                dropLocationId:dropLoc?.id||''
              };
            }

            const result=await dpR1BaseSaveOrder.apply(this,arguments);
            const saved=editId?orderById(editId):(state.orders||[]).find(o=>!beforeIds.has(o.id));
            if(saved&&rdata){
              Object.assign(saved,rdata,{updatedAt:nowIso()});
              await persist();
              renderAll();
            }
            return result;
          };

          // Fahrer muss bei Direktverladung die tatsächlich verwendeten Mulden
          // ebenso bestätigen können. Der Bestand wird dadurch nicht automatisch
          // an Kunde/Entsorger verschoben: nach Direktverladung bleibt die Mulde
          // technisch beim Fahrzeug / bisherigen Bestand, bis ein eigener
          // Standortsvorgang das ändert.
          if(typeof dpA3BinTask==='function'){
            const dpR1BaseA3BinTask=dpA3BinTask;
            dpA3BinTask=function(o){return !!o&&(o.task==='Direktverladung'||dpR1BaseA3BinTask(o));};
          }

          // Kopierte Direktverladungen übernehmen ihre Planungsdaten ebenfalls,
          // bleiben aber neue eigenständige Aufträge ohne Ausführungsdaten.
          if(typeof dpQ1PlanningCopy==='function'){
            const dpR1BaseQ1PlanningCopy=dpQ1PlanningCopy;
            dpQ1PlanningCopy=function(o){
              const c=dpR1BaseQ1PlanningCopy(o);
              c.loadAtSite=!!o?.loadAtSite;
              c.unloadAtSite=!!o?.unloadAtSite;
              c.loadLocationId=o?.loadLocationId||'';
              c.loadLocationName=o?.loadLocationName||'';
              c.unloadLocationId=o?.unloadLocationId||'';
              c.unloadLocationName=o?.unloadLocationName||'';
              c.dropLocationId=o?.dropLocationId||'';
              return c;
            };
          }

          // Direktverladung in der Detailansicht eindeutig mit Richtung zeigen.
          const dpR1BaseOpenDetail=openDetail;
          openDetail=function(id){
            const r=dpR1BaseOpenDetail.apply(this,arguments);
            const o=orderById(id);
            if(o?.task==='Direktverladung'){
              const body=$('detailBody');
              if(body&&!$('dpR1DetailRoute')){
                const card=document.createElement('div');
                card.id='dpR1DetailRoute';
                card.className='card';
                const load=o.loadAtSite?(site(o.siteId)?.name||'Baustelle'):(o.loadLocationName||dpR1FindLocation(o.loadLocationId)?.name||'Ladeort offen');
                const unload=o.unloadAtSite?(site(o.siteId)?.name||'Baustelle'):(o.unloadLocationName||dpR1FindLocation(o.unloadLocationId)?.name||o.drop||'Abladeort offen');
                card.innerHTML='<strong>Direktverladung</strong>'
                  +'<div style="margin-top:6px"><strong>Ladeort:</strong> '+esc(load)+'</div>'
                  +'<div><strong>Material:</strong> '+esc(o.material||'')+'</div>'
                  +'<div><strong>Abladeort:</strong> '+esc(unload)+'</div>';
                body.prepend(card);
              }
            }
            return r;
          };

          // ------------------------------------------------------------
          // Stammdaten: Transportorte. Materialien bleiben in der bereits
          // vorhandenen Materialliste und werden zusätzlich direkt im Auftrag
          // über „+ Neu“ ergänzt.
          // ------------------------------------------------------------
          function dpR1InstallSettings(){
            const screen=$('settings');
            if(!screen)return;
            const materialCard=$('materialList')?.closest('.card');
            if(materialCard){
              const h=materialCard.querySelector('h3');
              if(h)h.textContent='Materialien';
              const small=materialCard.querySelector('.small');
              if(small)small.textContent='Zentrale Materialliste für Aufträge. Neue Materialien können auch direkt im Auftrag ergänzt werden.';
            }
            if($('dpR1TransportCard'))return;
            const card=document.createElement('div');
            card.id='dpR1TransportCard';
            card.className='card';
            card.innerHTML='<h3>Transportorte</h3>'
              +'<div class="small" style="margin-bottom:8px">Gemeinsame Liste für Lade- und Abladeorte. Ein Ort kann je nach Auftrag beide Rollen haben. Adresse/GPS sind für eine spätere Erweiterung vorbereitet.</div>'
              +'<div id="dpR1TransportList"></div>'
              +'<div class="row" style="margin-top:10px"><input class="grow" id="dpR1NewLocation" placeholder="Neuen Transportort hinzufügen"><button class="btn secondary" type="button" onclick="dpR1AddLocationFromSettings()">Hinzufügen</button></div>';
            if(materialCard)materialCard.after(card); else screen.appendChild(card);
          }

          function dpR1RenderSettings(){
            dpR1EnsureState();
            dpR1InstallSettings();
            const host=$('dpR1TransportList');
            if(!host)return;
            host.innerHTML=(state.transportLocations||[])
              .slice().sort((a,b)=>a.name.localeCompare(b.name,'de'))
              .map(x=>'<div class="row" style="margin:7px 0">'
                +'<div class="grow"><input value="'+esc(x.name)+'" onchange="dpR1RenameLocation(\''+esc(x.id)+'\',this.value)"></div>'
                +'<label class="switchline" style="margin:0"><input type="checkbox" '+(x.active!==false?'checked':'')+' onchange="dpR1ToggleLocation(\''+esc(x.id)+'\',this.checked)"><span>aktiv</span></label>'
                +'</div>').join('');
          }

          async function dpR1AddLocationFromSettings(){
            const el=$('dpR1NewLocation');
            const name=String(el?.value||'').trim();
            if(!name)return;
            let loc=dpR1FindLocationByName(name);
            if(!loc){
              loc={id:'loc-'+uid(),name,active:true,street:'',zip:'',city:'',phone:'',mapsUrl:'',lat:'',lon:''};
              state.transportLocations.push(loc);
            }else loc.active=true;
            if(el)el.value='';
            await persist();
            dpR1RenderSettings();
            dpR1RefreshSelectors();
          }

          async function dpR1RenameLocation(id,value){
            const loc=dpR1FindLocation(id);
            const name=String(value||'').trim();
            if(!loc||!name)return dpR1RenderSettings();
            loc.name=name;
            // Anzeigenamen in alten Aufträgen aktualisieren, IDs bleiben maßgeblich.
            (state.orders||[]).forEach(o=>{
              if(String(o.loadLocationId||'')===String(id))o.loadLocationName=name;
              if(String(o.unloadLocationId||'')===String(id))o.unloadLocationName=name;
              if(String(o.dropLocationId||'')===String(id))o.drop=name;
            });
            await persist();
            dpR1RenderSettings();
            dpR1RefreshSelectors();
          }

          async function dpR1ToggleLocation(id,on){
            const loc=dpR1FindLocation(id);
            if(!loc)return;
            loc.active=!!on;
            await persist();
            dpR1RenderSettings();
            dpR1RefreshSelectors();
          }

          const dpR1BaseRenderSettings=renderSettings;
          renderSettings=function(){
            dpR1EnsureState();
            const r=dpR1BaseRenderSettings.apply(this,arguments);
            dpR1RenderSettings();
            return r;
          };

          // Initiale Installation. State wird nach loadState erneut über die
          // Wrapper normalisiert und vollständig gerendert.
          dpR1InstallTaskOption();
          dpR1InstallOrderUi();
          dpR1InstallSettings();

          /* DP_R1_DIREKTVERLADUNG_MATERIAL_TRANSPORTORTE_END */
          """

          t=t.replace(marker,patch+"\n"+marker,1)
          p.write_text(t,encoding="utf-8",newline="\n")
          print("R1: Direktverladung, Materialauswahl und gemeinsame Transportorte eingefügt.")
          PY

          grep -q "DP_R1_DIREKTVERLADUNG_MATERIAL_TRANSPORTORTE_BEGIN" dispopilot-online-efd.html
          grep -q "Direktverladung" dispopilot-online-efd.html
          grep -q "Baustelle als Ladeort" dispopilot-online-efd.html
          grep -q "Baustelle als Abladeort" dispopilot-online-efd.html
          grep -q "Transportorte" dispopilot-online-efd.html
          grep -q "dpR1AddMaterial" dispopilot-online-efd.html
          grep -q "dpR1AddLocation" dispopilot-online-efd.html
          grep -q "transportLocations" dispopilot-online-efd.html
          grep -q "loadLocationId" dispopilot-online-efd.html
          grep -q "unloadLocationId" dispopilot-online-efd.html

      - name: Apply S2 Rapport Kunde nicht vor Ort
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path("dispopilot-online-efd.html")
          t=p.read_text(encoding="utf-8")
          marker="/* DP13_PATCH_END */"
          if t.count(marker)!=1:
              raise SystemExit(f"S2 abgebrochen: DP13-Endmarker {t.count(marker)}x gefunden statt 1x.")

          patch=r"""
          /* DP_S1_RAPPORT_KUNDE_NICHT_VOR_ORT_BEGIN */
          // S1: Kundenname und Kundenunterschrift sind nicht mehr zwingend,
          // wenn der Fahrer ausdrücklich "Kunde nicht vor Ort" wählt.
          // In diesem Fall wird KEINE Unterschrift vorgetäuscht. Stattdessen
          // dokumentiert der Rapport eindeutig Fahrer, Datum und Uhrzeit.

          function dpS1EnsureReportUi(){
            const modal=$('reportModal');
            const summary=$('reportSummary');
            if(!modal||!summary)return;
            if(!$('dpS1CustomerAbsentWrap')){
              const wrap=document.createElement('div');
              wrap.id='dpS1CustomerAbsentWrap';
              wrap.className='card';
              wrap.style.marginTop='10px';
              wrap.style.marginBottom='12px';
              wrap.innerHTML='<label class="switchline" style="margin:0">'
                +'<input id="dpS1CustomerAbsent" type="checkbox" onchange="dpS1SetCustomerAbsent()">'
                +'<span><strong>Kunde nicht vor Ort</strong></span>'
                +'</label>'
                +'<div class="small" style="margin-top:6px">Wenn aktiviert, sind Kundenname und Unterschrift nicht erforderlich. Der Rapport wird durch den Fahrer mit automatischem Datum und Uhrzeit abgeschlossen.</div>';
              summary.after(wrap);
            }
          }

          function dpS1SetCustomerAbsent(on){
            dpS1EnsureReportUi();
            // SharePoint/SPFx-Handler akzeptiert keine Ausdrücke wie this.checked
            // als Inline-Argument. Ohne Argument lesen wir den Zustand direkt aus
            // der Checkbox. Dadurch funktioniert der Klick auch im Gast-/Fahrerfenster.
            if(typeof on==='undefined'){
              const source=$('dpS1CustomerAbsent');
              on=!!source?.checked;
            }
            const absent=!!on;
            const cb=$('dpS1CustomerAbsent');
            if(cb&&cb.checked!==absent)cb.checked=absent;
            const name=$('signName');
            const sig=$('signature');
            if(absent){
              if(name)name.value='';
              if(typeof clearSignature==='function'){
                try{clearSignature();}catch(_){ }
              }
            }
            if(name){
              name.disabled=absent;
              name.placeholder=absent?'Nicht erforderlich – Kunde nicht vor Ort':'';
              name.style.opacity=absent?'.55':'';
            }
            if(sig){
              sig.style.pointerEvents=absent?'none':'';
              sig.style.opacity=absent?'.35':'';
            }
            const modal=$('reportModal');
            if(modal){
              const clearBtn=Array.from(modal.querySelectorAll('button')).find(b=>String(b.textContent||'').trim()==='Unterschrift löschen');
              if(clearBtn){clearBtn.disabled=absent;clearBtn.style.opacity=absent?'.45':'';}
            }
          }

          function dpS1FormatStamp(iso){
            try{
              return new Date(iso).toLocaleString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
            }catch(_){return String(iso||'');}
          }

          const dpS1BaseOpenReport=openReport;
          openReport=function(){
            const r=dpS1BaseOpenReport.apply(this,arguments);
            setTimeout(()=>{
              dpS1EnsureReportUi();
              const o=orderById(currentOrderId);
              const prev=o?.rapportCompletion||{};
              // Bei einem bereits als "Kunde nicht vor Ort" abgeschlossenen Rapport
              // wird dieser Zustand wieder angezeigt. Normale Signaturen werden aus
              // Datenschutz-/Größengründen nicht dauerhaft im Auftrag gespeichert.
              dpS1SetCustomerAbsent(!!prev.customerNotPresent);
              if(!prev.customerNotPresent&&$('signName'))$('signName').value=prev.signer||'';
            },120);
            return r;
          };

          const dpS1BaseReportPaper=reportPaper;
          reportPaper=function(o,signer,sig){
            const info=o?.rapportCompletion||{};
            const absent=!!info.customerNotPresent;
            const finalSigner=absent?'Kunde nicht vor Ort':signer;
            const finalSig=absent?'':sig;
            let html=dpS1BaseReportPaper(o,finalSigner,finalSig);
            const at=info.completedAt||'';
            const by=info.completedBy||o?.driver||'';
            const stamp=dpS1FormatStamp(at);
            const note=absent
              ?'<div style="margin:14px 0 4px;padding:9px 11px;border:2px solid #991b1b;border-radius:7px;font-size:9.5pt"><strong>Kunde nicht vor Ort.</strong> Keine Kundenunterschrift erfasst. Rapport durch Fahrer <strong>'+esc(by)+'</strong> am <strong>'+esc(stamp)+'</strong> abgeschlossen.</div>'
              :'<div style="margin:10px 0 4px;font-size:8.5pt"><strong>Rapport abgeschlossen:</strong> '+esc(stamp)+' · '+esc(by)+'</div>';
            if(html.includes('<div class="signatureRow">'))html=html.replace('<div class="signatureRow">',note+'<div class="signatureRow">');
            else html+=note;
            if(absent){
              html=html.replace('<div>Auftraggeber / Unterschrift</div>','<div>Kunde nicht vor Ort</div>');
            }
            return html;
          };

          previewReport=async function(){
            dpS1EnsureReportUi();
            const absent=!!$('dpS1CustomerAbsent')?.checked;
            const signer=String($('signName')?.value||'').trim();

            if(!absent){
              if(!signer)return alert('Bitte Name des Auftraggebers eingeben oder „Kunde nicht vor Ort“ auswählen.');
              if(!hasSignature)return alert('Bitte Kundenunterschrift erfassen oder „Kunde nicht vor Ort“ auswählen.');
              if(!signatureData)signatureData=$('signature').toDataURL('image/png');
            }else{
              signatureData='';
              hasSignature=false;
            }

            const o=orderById(currentOrderId);
            if(!o)return alert('Auftrag wurde nicht gefunden.');
            const completedAt=nowIso();
            const completedBy=state?.user?.name||o.driver||'';
            o.rapportCompletion={
              customerNotPresent:absent,
              signer:absent?'':signer,
              signed:!absent,
              completedAt,
              completedBy
            };
            o.rapportCompletedAt=completedAt;
            o.rapportCompletedBy=completedBy;
            o.updatedAt=completedAt;
            await persist();

            closeM('reportModal');
            $('previewTitle').textContent='Rapport / Lieferschein – Vorschau';
            $('previewPaper').innerHTML=reportPaper(o,signer,absent?'':signatureData);
            $('previewSendBtn').textContent='Versand simulieren';
            $('previewSendBtn').onclick=()=>sendReportSim(o,signer);
            openM('previewModal');
          };

          // Versand bleibt bis zum gemeinsamen zentralen E-Mail-Punkt simuliert,
          // protokolliert S2 aber bereits eindeutig für den späteren Mailweg.
          sendReportSim=async function(o,signer){
            const c=customer(o.customerId);
            const info=o.rapportCompletion||{};
            if(!Array.isArray(state.documents))state.documents=[];
            state.documents.unshift({
              id:uid(),
              type:'Rapport',
              date:nowIso(),
              orderId:o.id,
              recipient:[c?.mail,state.settings.officeMail].filter(Boolean).join(' + '),
              signer:info.customerNotPresent?'':(signer||info.signer||''),
              customerNotPresent:!!info.customerNotPresent,
              completedAt:info.completedAt||'',
              completedBy:info.completedBy||o.driver||'',
              status:'Versand simuliert'
            });
            await persist();
            const who=info.customerNotPresent?'Kunde nicht vor Ort':'Kundenunterschrift erfasst';
            alert('Simulation: Rapport ('+who+') an '+([c?.mail||'keine Kundenadresse',state.settings.officeMail||'keine Büroadresse'].join(' + '))+'.');
            closeM('previewModal');
            renderHistory();
          };

          // Ein bereits abgeschlossener Rapport macht einen Auftrag fachlich "berührt"
          // und damit nicht mehr über Q2 aus der Planung löschbar.
          if(typeof dpQ2CanDeleteOrder==='function'){
            const dpS1BaseCanDelete=dpQ2CanDeleteOrder;
            dpQ2CanDeleteOrder=function(o){
              if(o&&(o.rapportCompletion||o.rapportCompletedAt))return false;
              return dpS1BaseCanDelete(o);
            };
          }

          dpS1EnsureReportUi();
          /* DP_S1_RAPPORT_KUNDE_NICHT_VOR_ORT_END */
          """

          t=t.replace(marker,patch+"\n"+marker,1)
          p.write_text(t,encoding="utf-8",newline="\n")
          print("S1: Rapportabschluss ohne zwingende Kundenunterschrift eingefügt.")
          PY

          grep -q "DP_S1_RAPPORT_KUNDE_NICHT_VOR_ORT_BEGIN" dispopilot-online-efd.html
          grep -q "Kunde nicht vor Ort" dispopilot-online-efd.html
          grep -q 'onchange="dpS1SetCustomerAbsent()"' dispopilot-online-efd.html
          ! grep -q 'dpS1SetCustomerAbsent(this.checked)' dispopilot-online-efd.html
          grep -q "rapportCompletion" dispopilot-online-efd.html
          grep -q "rapportCompletedAt" dispopilot-online-efd.html
          grep -q "Keine Kundenunterschrift erfasst" dispopilot-online-efd.html
          grep -q "dpS1SetCustomerAbsent" dispopilot-online-efd.html

      - name: Apply U2 robust customer context and searchable dropdown
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path("dispopilot-online-efd.html")
          t=p.read_text(encoding="utf-8")
          marker="/* DP13_PATCH_BEGIN */"
          if t.count(marker)!=1:
              raise SystemExit(f"U2 abgebrochen: DP13-Marker {t.count(marker)}x gefunden statt 1x.")

          patch=r"""
          /* DP_U2_KUNDENKONTEXT_SUCHDROPDOWN_BEGIN */
          // U2a – Kundenkontext bei „Neue Baustelle“ robust erhalten.
          // Ursache des alten Fehlers: openSite() ruft refreshCustomerSelects() auf.
          // Dadurch konnte oCustomer auf den ersten Listeneintrag zurückspringen,
          // bevor sCustomer gesetzt wurde. U2 merkt deshalb den Kunden VOR diesem
          // Refresh und stellt ihn danach explizit wieder her.
          let dpU2ActiveCustomerId=null;

          function dpU2HasOption(selectEl,value){
            if(!selectEl||value===null||value===undefined||String(value)==='')return false;
            const wanted=String(value);
            return Array.from(selectEl.options||[]).some(o=>String(o.value)===wanted);
          }

          function dpU2ModalIsOpen(id){
            const el=$(id);
            if(!el)return false;
            if(el.classList?.contains('show'))return true;
            if(el.getAttribute('aria-hidden')==='false')return true;
            try{
              const cs=getComputedStyle(el);
              return cs.display!=='none'&&cs.visibility!=='hidden'&&(el.offsetWidth>0||el.offsetHeight>0);
            }catch(_){return false;}
          }

          function dpU2ActiveInside(id){
            const a=document.activeElement;
            return !!(a&&typeof a.closest==='function'&&a.closest('#'+id));
          }

          if(typeof openCustomer==='function'){
            const dpU2BaseOpenCustomer=openCustomer;
            openCustomer=function(id){
              if(id!==null&&id!==undefined&&String(id)!=='')dpU2ActiveCustomerId=Number(id)||id;
              return dpU2BaseOpenCustomer.apply(this,arguments);
            };
          }

          const dpU2BaseOpenSite=openSite;
          openSite=function(id=null,fromOrder=false){
            const oSel=$('oCustomer');
            const orderCustomerBefore=oSel?String(oSel.value||''):'';

            const orderContext=!id&&(
              !!fromOrder ||
              dpU2ModalIsOpen('orderModal') ||
              dpU2ActiveInside('orderModal')
            );
            const customerContext=!id&&(
              dpU2ModalIsOpen('customerModal') ||
              dpU2ActiveInside('customerModal')
            );

            let wantedCustomer='';
            if(orderContext&&orderCustomerBefore){
              wantedCustomer=orderCustomerBefore;
              // Wichtig für saveSite(): Nach Speichern muss in den Auftrag zurückgekehrt werden.
              fromOrder=true;
            }else if(customerContext&&dpU2ActiveCustomerId!==null){
              wantedCustomer=String(dpU2ActiveCustomerId);
            }else if(!id&&fromOrder&&orderCustomerBefore){
              wantedCustomer=orderCustomerBefore;
            }

            // Base-Logik darf weiterhin alle bisherigen Felder/Adressen vorbereiten.
            const result=dpU2BaseOpenSite.call(this,id,fromOrder);

            // refreshCustomerSelects() innerhalb der Base-Logik darf die Auswahl im
            // Auftrag NICHT als Seiteneffekt verändern – auch nicht bei Abbrechen.
            if(oSel&&orderCustomerBefore&&dpU2HasOption(oSel,orderCustomerBefore)){
              oSel.value=orderCustomerBefore;
            }

            if(!id&&wantedCustomer&&$('sCustomer')&&dpU2HasOption($('sCustomer'),wantedCustomer)){
              $('sCustomer').value=wantedCustomer;
              if(typeof dpK1SiteCustomerChanged==='function')dpK1SiteCustomerChanged();
              if(typeof dpK1SameBillingChanged==='function')dpK1SameBillingChanged();
            }

            // Sichtbare Kundenauswahl im Auftrag nach dem Restaurieren synchronisieren.
            if(typeof dpU2SyncOrderCustomerCombo==='function')setTimeout(dpU2SyncOrderCustomerCombo,0);
            return result;
          };

          // Beim Schließen des Kundenfensters darf kein alter Kundenkontext später
          // versehentlich für eine neue Baustelle verwendet werden.
          const dpU2BaseCloseM=closeM;
          closeM=function(id){
            const result=dpU2BaseCloseM.apply(this,arguments);
            if(id==='customerModal')dpU2ActiveCustomerId=null;
            if(id==='siteModal'&&typeof dpU2SyncOrderCustomerCombo==='function')setTimeout(dpU2SyncOrderCustomerCombo,0);
            return result;
          };

          // U2b – echte suchbare Kundenauswahl statt separates Suchfeld.
          // Das originale Select bleibt als technische Datenquelle erhalten, ist aber
          // unsichtbar. Das sichtbare Feld ist gleichzeitig Auswahl UND Suche.
          function dpU2Norm(value){
            return String(value||'')
              .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
              .toLocaleLowerCase('de')
              .trim();
          }

          function dpU2OrderCustomerName(){
            const sel=$('oCustomer');
            if(!sel)return '';
            const opt=sel.options?.[sel.selectedIndex];
            return String(opt?.textContent||'').trim();
          }

          function dpU2CloseOrderCustomerDropdown(){
            const list=$('dpU2CustomerDropdownList');
            if(list)list.classList.add('hidden');
          }

          function dpU2SyncOrderCustomerCombo(){
            const input=$('dpU2CustomerDropdownInput');
            if(!input)return;
            input.value=dpU2OrderCustomerName();
            input.dataset.selectedValue=String($('oCustomer')?.value||'');
          }

          function dpU2RenderOrderCustomerDropdown(showAll=false){
            const input=$('dpU2CustomerDropdownInput');
            const list=$('dpU2CustomerDropdownList');
            if(!input||!list)return;

            let q=dpU2Norm(input.value);
            const selectedName=dpU2Norm(dpU2OrderCustomerName());
            // Beim normalen Öffnen soll trotz angezeigtem Kundennamen die gesamte
            // alphabetische Liste sichtbar sein. Erst beim Tippen wird gefiltert.
            if(showAll||q===selectedName)q='';

            const all=(state.customers||[]).slice()
              .sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'de'));
            let filtered=all;
            if(q){
              filtered=all.filter(c=>dpU2Norm(c.name).startsWith(q));
              if(!filtered.length)filtered=all.filter(c=>dpU2Norm(c.name).includes(q));
            }

            list.innerHTML='';
            if(!filtered.length){
              const empty=document.createElement('div');
              empty.className='small';
              empty.style.padding='10px';
              empty.textContent='Kein passender Kunde gefunden.';
              list.appendChild(empty);
            }else{
              filtered.slice(0,60).forEach(c=>{
                const row=document.createElement('button');
                row.type='button';
                row.className='dpU2CustomerOption';
                row.textContent=c.name||'';
                row.addEventListener('pointerdown',ev=>ev.preventDefault());
                row.addEventListener('click',()=>{
                  const sel=$('oCustomer');
                  if(!sel)return;
                  sel.value=String(c.id);
                  sel.dispatchEvent(new Event('change',{bubbles:true}));
                  input.value=String(c.name||'');
                  input.dataset.selectedValue=String(c.id);
                  dpU2CloseOrderCustomerDropdown();
                });
                list.appendChild(row);
              });
            }
            list.classList.remove('hidden');
          }

          function dpU2InstallOrderCustomerDropdown(){
            const sel=$('oCustomer');
            if(!sel)return;

            let wrap=$('dpU2CustomerDropdown');
            if(!wrap){
              wrap=document.createElement('div');
              wrap.id='dpU2CustomerDropdown';
              wrap.className='dpU2CustomerDropdown';

              const input=document.createElement('input');
              input.id='dpU2CustomerDropdownInput';
              input.type='search';
              input.autocomplete='off';
              input.placeholder='Kunde suchen oder auswählen';
              input.setAttribute('aria-label','Kunde suchen oder auswählen');

              const toggle=document.createElement('button');
              toggle.id='dpU2CustomerDropdownToggle';
              toggle.type='button';
              toggle.className='dpU2CustomerDropdownToggle';
              toggle.textContent='▾';
              toggle.setAttribute('aria-label','Kundenliste öffnen');

              const list=document.createElement('div');
              list.id='dpU2CustomerDropdownList';
              list.className='dpU2CustomerDropdownList hidden';

              const field=document.createElement('div');
              field.className='dpU2CustomerDropdownField';
              field.appendChild(input);
              field.appendChild(toggle);
              wrap.appendChild(field);
              wrap.appendChild(list);
              sel.parentElement.insertBefore(wrap,sel);

              input.addEventListener('focus',()=>{
                dpU2SyncOrderCustomerCombo();
                input.select();
                dpU2RenderOrderCustomerDropdown(true);
              });
              input.addEventListener('input',()=>dpU2RenderOrderCustomerDropdown(false));
              input.addEventListener('keydown',ev=>{
                if(ev.key==='Escape'){
                  dpU2SyncOrderCustomerCombo();
                  dpU2CloseOrderCustomerDropdown();
                  input.blur();
                }else if(ev.key==='Enter'){
                  const first=$('dpU2CustomerDropdownList')?.querySelector('.dpU2CustomerOption');
                  if(first){ev.preventDefault();first.click();}
                }
              });
              toggle.addEventListener('click',()=>{
                dpU2SyncOrderCustomerCombo();
                input.focus();
                dpU2RenderOrderCustomerDropdown(true);
              });

              sel.addEventListener('change',()=>setTimeout(dpU2SyncOrderCustomerCombo,0));
            }

            sel.style.display='none';
            dpU2SyncOrderCustomerCombo();
          }

          if(!$('dpU2CustomerDropdownStyle')){
            const style=document.createElement('style');
            style.id='dpU2CustomerDropdownStyle';
            style.textContent=`
              .dpU2CustomerDropdown{position:relative;width:100%;}
              .dpU2CustomerDropdownField{display:grid;grid-template-columns:minmax(0,1fr) 44px;width:100%;}
              .dpU2CustomerDropdownField input{width:100%;min-width:0;margin:0;border-top-right-radius:0;border-bottom-right-radius:0;}
              .dpU2CustomerDropdownToggle{border:1px solid #c9d0d8;border-left:0;background:#f7f8fa;border-radius:0 8px 8px 0;font-size:20px;line-height:1;min-height:42px;}
              .dpU2CustomerDropdownList{position:absolute;left:0;right:0;top:calc(100% + 3px);z-index:10020;max-height:min(52vh,360px);overflow:auto;background:#fff;border:1px solid #c9d0d8;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.18);padding:5px;}
              .dpU2CustomerOption{display:block;width:100%;text-align:left;border:0;background:#fff;border-radius:6px;padding:10px 9px;font:inherit;}
              .dpU2CustomerOption:active,.dpU2CustomerOption:hover{background:#eef3f8;}
              @media(max-width:700px){.dpU2CustomerDropdownList{max-height:48vh}.dpU2CustomerOption{padding:12px 10px;}}
            `;
            document.head.appendChild(style);
          }

          dpU2InstallOrderCustomerDropdown();

          // refreshCustomerSelects baut die native Kundenliste neu auf. Danach wird
          // nur die sichtbare Such-Dropdown-Anzeige synchronisiert – die alphabetische
          // Sortierung der bestehenden Liste bleibt vollständig erhalten.
          if(typeof refreshCustomerSelects==='function'){
            const dpU2BaseRefreshCustomerSelects=refreshCustomerSelects;
            refreshCustomerSelects=function(){
              const selected=String($('oCustomer')?.value||'');
              const result=dpU2BaseRefreshCustomerSelects.apply(this,arguments);
              if(selected&&$('oCustomer')&&dpU2HasOption($('oCustomer'),selected))$('oCustomer').value=selected;
              setTimeout(()=>{dpU2InstallOrderCustomerDropdown();dpU2SyncOrderCustomerCombo();},0);
              return result;
            };
          }

          // Beim Öffnen/Bearbeiten eines Auftrags wird der vom Bestand geladene Kunde
          // unmittelbar im sichtbaren Such-Dropdown angezeigt.
          if(typeof editOrder==='function'){
            const dpU2BaseEditOrder=editOrder;
            editOrder=function(){
              const result=dpU2BaseEditOrder.apply(this,arguments);
              setTimeout(dpU2SyncOrderCustomerCombo,0);
              return result;
            };
          }

          const dpU2OrderModal=$('orderModal');
          if(dpU2OrderModal&&!window.dpU2OrderModalObserver){
            const obs=new MutationObserver(()=>{
              if(dpU2ModalIsOpen('orderModal'))setTimeout(()=>{dpU2InstallOrderCustomerDropdown();dpU2SyncOrderCustomerCombo();},0);
            });
            obs.observe(dpU2OrderModal,{attributes:true,attributeFilter:['class','style','aria-hidden']});
            window.dpU2OrderModalObserver=obs;
          }

          document.addEventListener('pointerdown',ev=>{
            const wrap=$('dpU2CustomerDropdown');
            if(!wrap||wrap.contains(ev.target))return;
            const input=$('dpU2CustomerDropdownInput');
            if(input&&document.activeElement===input)dpU2SyncOrderCustomerCombo();
            dpU2CloseOrderCustomerDropdown();
          },true);
          /* DP_U2_KUNDENKONTEXT_SUCHDROPDOWN_END */
          """

          t=t.replace(marker,patch+"\n"+marker,1)
          p.write_text(t,encoding="utf-8",newline="\n")
          print("U2: Kundenkontext robust gesichert und Such-Dropdown eingebaut.")
          PY

          grep -q "DP_U2_KUNDENKONTEXT_SUCHDROPDOWN_BEGIN" dispopilot-online-efd.html
          grep -q "orderCustomerBefore" dispopilot-online-efd.html
          grep -q "Kunde suchen oder auswählen" dispopilot-online-efd.html
          grep -q "dpU2CustomerDropdownList" dispopilot-online-efd.html
          grep -q "startsWith(q)" dispopilot-online-efd.html
          grep -q "if(selected&&\$('oCustomer')" dispopilot-online-efd.html

      - name: Apply V1 isolated test mode and Abwesend 8h
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path("dispopilot-online-efd.html")
          t=p.read_text(encoding="utf-8")
          marker="/* DP13_PATCH_BEGIN */"
          if t.count(marker)!=1:
              raise SystemExit(f"V1 abgebrochen: DP13-Marker {t.count(marker)}x gefunden statt 1x.")

          # Arbeitszeit: Die vorhandene Urlaub-Sonderlogik wird auf Abwesend erweitert,
          # ohne den sichtbaren Begriff Urlaub umzubenennen. Mehrere typische
          # Vergleichsformen werden robust erweitert; zusätzlich gibt es einen
          # zentralen Entry-Minuten-Helfer für Stundenzettel/PDF.
          replacements=0
          patterns=[
            (re.compile(r"(?P<x>[A-Za-z_$][A-Za-z0-9_.$\[\]()?]*)\s*===\s*(['\"])Urlaub\2"),
             lambda m:f"({m.group('x')}==='Urlaub'||{m.group('x')}==='Abwesend')"),
            (re.compile(r"(['\"])Urlaub\1\s*===\s*(?P<x>[A-Za-z_$][A-Za-z0-9_.$\[\]()?]*)"),
             lambda m:f"({m.group('x')}==='Urlaub'||{m.group('x')}==='Abwesend')"),
          ]
          for rx, repl in patterns:
              t,n=rx.subn(repl,t)
              replacements+=n

          patch=r"""
          /* DP_V1_TESTBETRIEB_ABWESEND_BEGIN */
          const DP_V1_TEST_FLAG='dpDispoTestModeV1';
          const DP_V1_PROD_LIST='DP_Data';
          const DP_V1_TEST_LIST='DP_Data_TEST';
          const DP_V1_SNAPSHOT_LIST='DP_Data_SNAPSHOT';
          let dpV1TestBridgeCounter=0;

          function dpV1StorageGet(key){
            try{return window.localStorage?window.localStorage.getItem(key):null}catch(_){return null}
          }
          function dpV1StorageSet(key,value){
            try{if(window.localStorage)window.localStorage.setItem(key,value)}catch(_){}
          }
          function dpV1StorageRemove(key){
            try{if(window.localStorage)window.localStorage.removeItem(key)}catch(_){}
          }
          function dpV1TestActive(){return dpV1StorageGet(DP_V1_TEST_FLAG)==='1'}

          function dpV1EntryKind(e){
            if(!e||typeof e!=='object')return '';
            const preferred=['type','kind','activity','taetigkeit','tätigkeit','status','absence','reason','category'];
            for(const k of preferred){
              if(typeof e[k]==='string'&&e[k].trim())return e[k].trim();
            }
            for(const v of Object.values(e)){
              if(typeof v==='string'&&(v.trim()==='Urlaub'||v.trim()==='Abwesend'))return v.trim();
            }
            return '';
          }
          function dpV1IsEightHourDay(e){
            const k=dpV1EntryKind(e).toLocaleLowerCase('de');
            return k==='urlaub'||k==='abwesend';
          }
          function dpV1CalcEntryMinutes(e){
            if(dpV1IsEightHourDay(e))return 480;
            return calcMinutes(e?.start||'',e?.end||'',e?.pause||'');
          }

          // L5-PDF/Stundenzettel: Urlaub UND Abwesend ergeben fest 8:00 h.
          if(typeof dpL4ExtractTimesheet==='function'){
            const dpV1BaseExtractTimesheet=dpL4ExtractTimesheet;
            dpL4ExtractTimesheet=function(){
              const data=dpV1BaseExtractTimesheet();
              try{
                ensureWeekEntries();
                (data.days||[]).forEach((row,i)=>{
                  const iso=plusDays(selectedWeekMonday,i);
                  const e=(state.timeEntries||[]).find(x=>x.date===iso&&x.driver===state.user.name)||{};
                  if(dpV1IsEightHourDay(e))row[4]='8:00';
                });
              }catch(_){}
              return data;
            };
          }

          // Zentraler Datenzugriff: Im Testbetrieb werden sämtliche normalen
          // DP_Data-REST-Aufrufe transparent auf DP_Data_TEST umgeleitet.
          if(typeof SPStore!=='undefined'&&SPStore.request&&!window.__DP_V1_STORE_ROUTED){
            window.__DP_V1_STORE_ROUTED=true;
            const dpV1RawRequest=SPStore.request.bind(SPStore);
            SPStore.request=async function(url,opts={}){
              let routed=String(url||'');
              if(dpV1TestActive()){
                routed=routed.replace(/DP_Data(?!_TEST|_SNAPSHOT)/g,DP_V1_TEST_LIST);
              }
              return dpV1RawRequest(routed,opts);
            };
          }

          function dpV1TestControl(action,onProgress){
            return new Promise((resolve,reject)=>{
              const requestId='dp-test-'+Date.now()+'-'+(++dpV1TestBridgeCounter);
              let done=false;
              const finish=(ok,val)=>{
                if(done)return;done=true;clearTimeout(timer);window.removeEventListener('message',onMsg);
                ok?resolve(val):reject(val instanceof Error?val:new Error(String(val||'Testbetrieb-Fehler')));
              };
              const onMsg=(event)=>{
                const d=event.data;
                if(!d||d.requestId!==requestId)return;
                if(d.type==='DISPOPILOT_TEST_CONTROL_PROGRESS'){
                  try{if(typeof onProgress==='function')onProgress(d)}catch(_){}
                  return;
                }
                if(d.type!=='DISPOPILOT_TEST_CONTROL_RESULT')return;
                d.ok?finish(true,d):finish(false,new Error(d.error||'Testbetrieb konnte nicht vorbereitet werden.'));
              };
              window.addEventListener('message',onMsg);
              const timer=setTimeout(()=>finish(false,new Error('Zeitüberschreitung beim Testbetrieb.')),900000);
              try{window.parent.postMessage({type:'DISPOPILOT_TEST_CONTROL',requestId,action},'*')}catch(e){finish(false,e)}
            });
          }

          async function dpV1ReloadCurrentMode(){
            const sessionUser=clone(state?.user||{});
            const loaded=await SPStore.load();
            const fresh=migrateState(loaded.state||clone(SEED));
            fresh.user=sessionUser;
            state=fresh;
            if(typeof dpDNormalizeAllGroups==='function')dpDNormalizeAllGroups();
            renderAll();
            dpV1InstallTestUi();
            if(typeof dp13CheckNotices==='function')setTimeout(dp13CheckNotices,60);
          }

          async function dpV1StartTest(){
            try{
              const status=await dpV1TestControl('status');
              if(!status?.ready)throw new Error('Der Testbestand ist noch nicht vollständig vorbereitet. Bitte als Admin zuerst „Snapshot + Testdaten vorbereiten“ ausführen.');
              dpV1StorageSet(DP_V1_TEST_FLAG,'1');
              await dpV1ReloadCurrentMode();
              dpV1Toast('Testbetrieb aktiv – Produktivdaten bleiben unverändert.');
            }catch(e){
              dpV1StorageRemove(DP_V1_TEST_FLAG);
              try{await dpV1ReloadCurrentMode()}catch(_){}
              alert('Testbetrieb konnte nicht gestartet werden.\n\n'+(e?.message||e));
            }
          }
          async function dpV1StopTest(){
            dpV1StorageRemove(DP_V1_TEST_FLAG);
            await dpV1ReloadCurrentMode();
            dpV1Toast('Echtbetrieb aktiv – ursprünglicher Produktivbestand geladen.');
          }
          async function dpV1PrepareTest(){
            if(!confirm('Snapshot des AKTUELLEN Echtbestands erstellen und Testdaten daraus neu aufbauen?\n\nProduktivdaten werden dabei nicht verändert.'))return;
            const b=$('dpV1PrepareBtn');const oldLabel=b?.textContent||'';const prog=$('dpV1ProgressText');
            if(b){b.disabled=true;b.textContent='Vorbereitung läuft …';}
            if(prog)prog.textContent='Verbindung zur Testdatenverwaltung …';
            try{
              const r=await dpV1TestControl('prepare',(p)=>{
                const stage=String(p.stage||'Vorbereitung');
                const cur=Number(p.current||0), total=Number(p.total||0);
                const msg=total>0?stage+' '+cur+'/'+total:stage+' …';
                if(b)b.textContent=msg;
                if(prog)prog.textContent=msg;
              });
              dpV1StorageSet(DP_V1_TEST_FLAG,'1');
              await dpV1ReloadCurrentMode();
              if(prog)prog.textContent='Vorbereitung abgeschlossen: Snapshot '+(r.snapshotCount||0)+' / Testbestand '+(r.testCount||0)+' Datensätze.';
              alert('Testbetrieb vorbereitet.\n\nSnapshot: '+(r.snapshotCount||0)+' Datensätze\nTestbestand: '+(r.testCount||0)+' Datensätze\n\nTESTBETRIEB ist jetzt aktiv.');
            }catch(e){if(prog)prog.textContent='Vorbereitung fehlgeschlagen.';alert('Vorbereitung fehlgeschlagen:\n'+(e?.message||e))}
            finally{if(b){b.disabled=false;b.textContent=oldLabel||'Snapshot + Testdaten vorbereiten';}}
          }
          async function dpV1ResetTest(){
            if(!confirm('Alle bisherigen Fantasiedaten im Testbestand verwerfen und den gespeicherten Snapshot erneut einspielen?'))return;
            try{
              const r=await dpV1TestControl('reset');
              dpV1StorageSet(DP_V1_TEST_FLAG,'1');
              await dpV1ReloadCurrentMode();
              alert('Testdaten wurden auf den Snapshot zurückgesetzt ('+(r.testCount||0)+' Datensätze).');
            }catch(e){alert('Zurücksetzen fehlgeschlagen:\n'+(e?.message||e))}
          }

          function dpV1Toast(text){
            let el=$('dpV1Toast');
            if(!el){el=document.createElement('div');el.id='dpV1Toast';document.body.appendChild(el)}
            el.textContent=text;el.style.display='block';clearTimeout(dpV1Toast.timer);
            dpV1Toast.timer=setTimeout(()=>el.style.display='none',2600);
          }

          function dpV1CurrentTestEmail(){
            return String(state?.dpTestConfig?.testEmail||'').trim();
          }
          async function dpV1SaveTestEmail(){
            if(!dpV1TestActive())return alert('Test-E-Mail-Adresse wird nur im Testbetrieb gespeichert.');
            const v=String($('dpV1TestEmail')?.value||'').trim();
            if(v&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v))return alert('Bitte eine gültige Test-E-Mail-Adresse eingeben.');
            state.dpTestConfig=state.dpTestConfig||{};
            state.dpTestConfig.testEmail=v;
            await persist();
            dpV1Toast(v?'Test-E-Mail gespeichert.':'Test-E-Mail gelöscht.');
          }

          // Im Testbetrieb darf niemals versehentlich an echte Kundenadressen
          // gesendet werden. Die Queue erhält ausschließlich die Testadresse.
          if(typeof dpL2QueueRequest==='function'){
            const dpV1BaseQueueRequest=dpL2QueueRequest;
            dpL2QueueRequest=function(payload){
              if(!dpV1TestActive())return dpV1BaseQueueRequest(payload);
              const testEmail=dpV1CurrentTestEmail();
              if(!testEmail||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(testEmail)){
                return Promise.reject(new Error('TESTBETRIEB: Bitte zuerst in Einstellungen eine Test-E-Mail-Adresse speichern.'));
              }
              const originalTo=Array.isArray(payload?.to)?payload.to.slice():[];
              const safePayload={...(payload||{}),to:[testEmail],testMode:true,testEmail,originalTo};
              return dpV1BaseQueueRequest(safePayload);
            };
          }

          function dpV1InstallTestUi(){
            // Deutlicher globaler Modus-Hinweis.
            let banner=$('dpV1TestBanner');
            if(dpV1TestActive()){
              if(!banner){
                banner=document.createElement('div');banner.id='dpV1TestBanner';
                banner.innerHTML='<strong>🧪 TESTBETRIEB – KEINE ECHTDATEN</strong><button type="button" onclick="dpV1StopTest()">Echtbetrieb</button>';
                document.body.prepend(banner);
              }
              banner.style.display='flex';
            }else if(banner){banner.style.display='none'}

            // Kleiner Startknopf ist bewusst auf jedem Gerät sichtbar, damit
            // auch Fahrer-Gastkonten in die vorbereitete Testumgebung wechseln können.
            let quick=$('dpV1QuickTest');
            if(!quick){
              quick=document.createElement('button');quick.id='dpV1QuickTest';quick.type='button';
              quick.textContent='🧪 Testbetrieb starten';quick.title='Aktion: auf diesem Gerät in den Testbetrieb wechseln';quick.onclick=dpV1StartTest;document.body.appendChild(quick);
            }
            quick.style.display=dpV1TestActive()?'none':'block';

            const settings=$('settings');
            if(settings&&!$('dpV1TestCard')){
              const card=document.createElement('div');card.id='dpV1TestCard';card.className='card';
              card.innerHTML=`<h3 style="margin-top:0">Testbetrieb</h3>
                <div class="small">Snapshot des Echtbestands → getrennte Fantasiedaten. Beim Beenden wird sofort wieder der unveränderte Echtbestand geladen.</div>
                <div style="margin-top:10px"><strong>Aktueller Modus:</strong> <span id="dpV1ModeText"></span></div>
                <div class="row" style="margin-top:10px;gap:8px;flex-wrap:wrap">
                  <button id="dpV1PrepareBtn" class="btn secondary" type="button" onclick="dpV1PrepareTest()">Snapshot + Testdaten vorbereiten</button>
                  <button class="btn secondary" type="button" onclick="dpV1StartTest()">Testbetrieb starten</button>
                  <button class="btn secondary" type="button" onclick="dpV1ResetTest()">Testdaten zurücksetzen</button>
                  <button class="btn secondary" type="button" onclick="dpV1StopTest()">Echtbetrieb laden</button>
                </div>
                <div id="dpV1ProgressText" class="small" style="margin-top:8px;font-weight:700">Bereit.</div>
                <div style="margin-top:12px"><label>Test-E-Mail (alle Testmails nur hierhin)</label>
                  <div class="row" style="gap:8px"><input id="dpV1TestEmail" type="email" placeholder="z. B. eigene Testadresse"><button class="btn secondary" type="button" onclick="dpV1SaveTestEmail()">Speichern</button></div>
                </div>
                <div class="small" style="margin-top:8px">Hinweis: Benutzer-/Rollen-Zuordnungen in DP_Users bleiben unverändert; operative Daten laufen im Testbetrieb ausschließlich über DP_Data_TEST.</div>`;
              settings.appendChild(card);
            }
            if($('dpV1ModeText'))$('dpV1ModeText').textContent=dpV1TestActive()?'TESTBETRIEB':'Echtbetrieb';
            if($('dpV1TestEmail'))$('dpV1TestEmail').value=dpV1CurrentTestEmail();
          }

          if(!$('dpV1TestStyle')){
            const st=document.createElement('style');st.id='dpV1TestStyle';st.textContent=`
              #dpV1TestBanner{position:sticky;top:0;z-index:20000;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 12px;background:#8b1e1e;color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.25)}
              #dpV1TestBanner button{border:0;border-radius:7px;padding:7px 10px;font-weight:700}
              #dpV1QuickTest{position:fixed;right:12px;bottom:12px;z-index:16000;border:1px solid #8b1e1e;border-radius:18px;padding:8px 12px;background:#fff;font-weight:700;box-shadow:0 2px 9px rgba(0,0,0,.16)}
              #dpV1Toast{display:none;position:fixed;left:50%;bottom:64px;transform:translateX(-50%);z-index:21000;background:#222;color:#fff;border-radius:8px;padding:10px 14px;max-width:88vw;text-align:center}\n              #dpV1ProgressText{padding:7px 9px;border-radius:7px;background:#f3f4f6}
              #dpV1TestCard input{min-width:220px;flex:1}
            `;document.head.appendChild(st);
          }

          if(typeof renderSettings==='function'){
            const dpV1BaseRenderSettings=renderSettings;
            renderSettings=function(){const r=dpV1BaseRenderSettings.apply(this,arguments);setTimeout(dpV1InstallTestUi,0);return r};
          }
          setTimeout(dpV1InstallTestUi,0);
          /* DP_V1_TESTBETRIEB_ABWESEND_END */
          """

          t=t.replace(marker,patch+"\n"+marker,1)

          # Direkte Minutenberechnungen mit Entry e auf die 8h-Sonderlogik umstellen.
          # Diese Ersetzungen treffen die bekannten Zeit-/Summen-/PDF-Pfade.
          minute_patterns=[
            (r"calcMinutes\(\s*e\.start\s*\|\|\s*''\s*,\s*e\.end\s*\|\|\s*''\s*,\s*e\.pause\s*\|\|\s*''\s*\)","dpV1CalcEntryMinutes(e)"),
            (r"calcMinutes\(\s*e\.start\s*,\s*e\.end\s*,\s*e\.pause\s*\)","dpV1CalcEntryMinutes(e)"),
          ]
          minute_replacements=0
          for rx,repl in minute_patterns:
              t,n=re.subn(rx,repl,t)
              minute_replacements+=n

          p.write_text(t,encoding="utf-8",newline="\n")
          print(f"V1 Testbetrieb eingefügt. Urlaub-Vergleiche erweitert: {replacements}; Minutenpfade: {minute_replacements}")
          PY

          grep -q "DP_V1_TESTBETRIEB_ABWESEND_BEGIN" dispopilot-online-efd.html
          grep -q "DP_Data_TEST" dispopilot-online-efd.html
          grep -q "DP_Data_SNAPSHOT" dispopilot-online-efd.html
          grep -q "TESTBETRIEB – KEINE ECHTDATEN" dispopilot-online-efd.html
          grep -q "dpV1CalcEntryMinutes" dispopilot-online-efd.html
          grep -q "Abwesend" dispopilot-online-efd.html
          grep -q "Test-E-Mail" dispopilot-online-efd.html

      - name: Apply W1 independent date navigation in orders
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path("dispopilot-online-efd.html")
          t=p.read_text(encoding="utf-8")
          marker="/* DP13_PATCH_END */"
          if t.count(marker)!=1:
              raise SystemExit(f"W1 abgebrochen: DP13-Endmarker {t.count(marker)}x gefunden statt 1x.")
          if "DP_W1_AUFTRAEGE_DATUMSNAVIGATION_BEGIN" in t:
              raise SystemExit("W1 abgebrochen: Patch ist bereits vorhanden.")

          patch=r"""
          /* DP_W1_AUFTRAEGE_DATUMSNAVIGATION_BEGIN */
          function dpW1TodayIso(){
            const d=new Date();
            return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
          }

          function dpW1AddDays(iso,days){
            const parts=String(iso||dpW1TodayIso()).split('-').map(Number);
            const d=new Date(parts[0],Math.max(0,(parts[1]||1)-1),parts[2]||1,12,0,0,0);
            d.setDate(d.getDate()+Number(days||0));
            return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
          }

          let dpW1OrdersDate=dpW1TodayIso();

          function dpW1OrdersDateLabel(iso){
            try{
              const p=String(iso).split('-').map(Number);
              const d=new Date(p[0],Math.max(0,(p[1]||1)-1),p[2]||1,12,0,0,0);
              return d.toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'});
            }catch(e){
              return String(iso||'');
            }
          }

          function dpW1FindOrdersHost(){
            const preferred=['orderList','ordersList','ordersContainer','orderCards','orders'];
            for(const id of preferred){
              const el=document.getElementById(id);
              if(el)return el;
            }
            try{
              const src=String(dpW1BaseRenderOrders||'');
              const ids=[];
              const rx=/\$\(\s*['"]([^'"]+)['"]\s*\)\s*\.innerHTML/g;
              let m;
              while((m=rx.exec(src))!==null)ids.push(m[1]);
              const ordered=[
                ...ids.filter(id=>/order/i.test(id)&&/list|card|container/i.test(id)),
                ...ids.filter(id=>/order/i.test(id)),
                ...ids
              ];
              for(const id of ordered){
                const el=document.getElementById(id);
                if(el)return el;
              }
            }catch(e){}
            const all=[...document.querySelectorAll('[id]')];
            return all.find(el=>/order/i.test(el.id)&&/list|card|container/i.test(el.id))||null;
          }

          function dpW1EnsureOrdersDateBar(){
            const host=dpW1FindOrdersHost();
            if(!host||!host.parentNode)return;

            let bar=document.getElementById('dpW1OrdersDateBar');
            if(!bar){
              bar=document.createElement('div');
              bar.id='dpW1OrdersDateBar';
              bar.style.cssText='display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin:8px 0 12px;padding:8px;border:1px solid #d1d5db;border-radius:10px;background:#fff';
              bar.innerHTML=`
                <button class="btn secondary" type="button" style="min-width:46px;font-size:22px;padding:6px 12px" title="einen Tag zurück" onclick="dpW1ShiftOrdersDate(-1)">‹</button>
                <div style="display:flex;flex-direction:column;align-items:center;gap:2px">
                  <span class="small" style="font-weight:700">Aufträge für</span>
                  <input id="dpW1OrdersDateInput" type="date" style="width:168px;text-align:center;font-weight:750" onchange="dpW1SetOrdersDate(this.value)">
                  <span id="dpW1OrdersDateText" class="small"></span>
                </div>
                <button class="btn secondary" type="button" style="min-width:46px;font-size:22px;padding:6px 12px" title="einen Tag vor" onclick="dpW1ShiftOrdersDate(1)">›</button>
                <button class="btn secondary" type="button" onclick="dpW1SetOrdersToday()">Heute</button>`;
              host.parentNode.insertBefore(bar,host);
            }

            const input=document.getElementById('dpW1OrdersDateInput');
            if(input&&input.value!==dpW1OrdersDate)input.value=dpW1OrdersDate;
            const txt=document.getElementById('dpW1OrdersDateText');
            if(txt)txt.textContent=dpW1OrdersDateLabel(dpW1OrdersDate);
          }

          function dpW1SetOrdersDate(value){
            if(!/^\d{4}-\d{2}-\d{2}$/.test(String(value||'')))return;
            dpW1OrdersDate=String(value);
            renderOrders();
          }

          function dpW1ShiftOrdersDate(days){
            dpW1OrdersDate=dpW1AddDays(dpW1OrdersDate,days);
            renderOrders();
          }

          function dpW1SetOrdersToday(){
            dpW1OrdersDate=dpW1TodayIso();
            renderOrders();
          }

          const dpW1BaseRenderOrders=renderOrders;
          renderOrders=function(){
            const planningDate=selectedDate;
            selectedDate=dpW1OrdersDate;
            try{
              return dpW1BaseRenderOrders.apply(this,arguments);
            }finally{
              selectedDate=planningDate;
              setTimeout(dpW1EnsureOrdersDateBar,0);
            }
          };

          setTimeout(()=>{
            try{
              if(typeof renderOrders==='function')renderOrders();
            }catch(e){
              console.warn('W1 Auftrags-Datumsnavigation konnte initial nicht rendern:',e);
            }
          },0);
          /* DP_W1_AUFTRAEGE_DATUMSNAVIGATION_END */
          """

          t=t.replace(marker,patch+"\n"+marker,1)
          p.write_text(t,encoding="utf-8",newline="\n")
          print("W1: Eigenständige Datumsnavigation im Modul Aufträge eingefügt.")
          PY

          grep -q "DP_W1_AUFTRAEGE_DATUMSNAVIGATION_BEGIN" dispopilot-online-efd.html
          grep -q "let dpW1OrdersDate=dpW1TodayIso()" dispopilot-online-efd.html
          grep -q "dpW1ShiftOrdersDate" dispopilot-online-efd.html
          grep -q "dpW1SetOrdersToday" dispopilot-online-efd.html
          grep -q "const dpW1BaseRenderOrders=renderOrders" dispopilot-online-efd.html

      - name: Apply W2 popup only for real current date
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path("dispopilot-online-efd.html")
          t=p.read_text(encoding="utf-8")
          marker="/* DP13_PATCH_END */"
          if t.count(marker)!=1:
              raise SystemExit(f"W2 abgebrochen: DP13-Endmarker {t.count(marker)}x gefunden statt 1x.")
          if "DP_W2_POPUP_NUR_HEUTE_BEGIN" in t:
              raise SystemExit("W2 abgebrochen: Patch ist bereits vorhanden.")

          patch=r"""
          /* DP_W2_POPUP_NUR_HEUTE_BEGIN */
          // W2: Fahrer-Popups richten sich ausschließlich nach dem realen
          // Kalendertag des Geräts/Browsers. Das in Planung oder Aufträge
          // ausgewählte Anzeigedatum darf die Meldelogik niemals beeinflussen.

          function dpW2LocalIsoDate(value){
            const d=value instanceof Date?value:new Date(value||Date.now());
            if(Number.isNaN(d.getTime()))return '';
            return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
          }

          function dpW2TodayIso(){
            return dpW2LocalIsoDate(new Date());
          }

          function dpW2NoticeOrderDate(n){
            if(!n)return '';
            const live=typeof orderById==='function'?orderById(n.orderId):null;
            if(live&&live.date)return String(live.date);

            // Q2 kann einen geplanten Auftrag löschen. Für die Löschmeldung liegt
            // der Audit-Snapshot weiterhin im Archiv und liefert das Auftragsdatum.
            const archived=(state?.archiveOrders||[]).find(o=>o&&o.id===n.orderId);
            return archived?.date?String(archived.date):'';
          }

          function dpW2NoticeBelongsToToday(n){
            const today=dpW2TodayIso();
            const orderDate=dpW2NoticeOrderDate(n);
            const noticeDate=dpW2LocalIsoDate(n?.createdAt||'');

            // Beides muss heute sein:
            // 1) Auftrag selbst ist ein heutiger Auftrag.
            // 2) Die Änderung wurde auch heute erzeugt.
            // Dadurch erscheint eine am Vortag erzeugte Meldung für einen damals
            // zukünftigen Auftrag nicht erst am späteren Ausführungstag.
            return orderDate===today&&noticeDate===today;
          }

          const dpW2BasePendingNotices=dp13PendingNotices;
          dp13PendingNotices=function(){
            const pending=dpW2BasePendingNotices.apply(this,arguments)||[];
            const visible=[];
            let changed=false;

            pending.forEach(n=>{
              if(dpW2NoticeBelongsToToday(n)){
                visible.push(n);
                return;
              }

              // Zukünftige/vergangene Einzelmeldungen werden bewusst verworfen.
              // Sie dürfen auch am späteren Auftragsdatum nicht nachträglich aufpoppen.
              if(n&&!n.acknowledgedAt){
                n.acknowledgedAt=nowIso();
                n.suppressedAt=n.acknowledgedAt;
                n.suppressedReason='Kein Popup: Auftrag/Änderung nicht am aktuellen Kalendertag';
                changed=true;
              }
            });

            if(changed){
              Promise.resolve(persist()).catch(e=>console.warn('W2 unterdrückte Meldungen konnten nicht gespeichert werden:',e));
            }
            return visible;
          };

          // Nach Init einmal prüfen, damit bereits vorhandene zukünftige Meldungen
          // direkt bereinigt werden, ohne dass ein Anzeigedatum relevant wäre.
          const dpW2BaseInit=dp13Init;
          dp13Init=async function(){
            const r=await dpW2BaseInit.apply(this,arguments);
            try{dp13PendingNotices()}catch(e){console.warn('W2 Initialprüfung:',e)}
            return r;
          };
          /* DP_W2_POPUP_NUR_HEUTE_END */
          """

          t=t.replace(marker,patch+"\n"+marker,1)
          p.write_text(t,encoding="utf-8",newline="\n")
          print("W2: Popup-Logik auf reales heutiges Datum begrenzt.")
          PY

          grep -q "DP_W2_POPUP_NUR_HEUTE_BEGIN" dispopilot-online-efd.html
          grep -q "const dpW2BasePendingNotices=dp13PendingNotices" dispopilot-online-efd.html
          grep -q "orderDate===today&&noticeDate===today" dispopilot-online-efd.html
          grep -q "Kein Popup: Auftrag/Änderung nicht am aktuellen Kalendertag" dispopilot-online-efd.html

      - name: Apply X1 Mulden UVV reservation and availability
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path("dispopilot-online-efd.html")
          t=p.read_text(encoding="utf-8")
          marker="/* DP13_PATCH_END */"
          if t.count(marker)!=1:
              raise SystemExit(f"X1 abgebrochen: DP13-Endmarker {t.count(marker)}x gefunden statt 1x.")
          if "DP_X1_MULDEN_UVV_RESERVIERUNG_BEGIN" in t:
              raise SystemExit("X1 abgebrochen: Patch ist bereits vorhanden.")

          patch=r"""
          /* DP_X1_MULDEN_UVV_RESERVIERUNG_BEGIN */
          // X1 bündelt:
          // - UVV nur MM/JJJJ, nächste UVV automatisch +12 Monate
          // - dauerhafte/saisonale Reservierung einer Mulde für Kunde/Baustelle/Zweck
          // - Lager-Verfügbarkeitsübersicht
          // - echte Muldenauswahl beim Auftrag "Stellen"
          // Reserviert bedeutet NICHT generell gesperrt: bei passendem Kunden/
          // passender Baustelle wird die Mulde bevorzugt angeboten. Mulden mit
          // dokumentiertem Inhalt sind dagegen nie direkt verfügbar.

          function dpX1BinNumber(b){
            return String(b?.number??b?.binNumber??b?.no??'').trim();
          }

          function dpX1BinMaterial(b){
            return String(b?.material??b?.content??'').trim();
          }

          function dpX1MonthFromAny(v){
            const s=String(v||'').trim();
            if(!s)return '';
            let m=s.match(/^(0[1-9]|1[0-2])\/(\d{4})$/);
            if(m)return m[1]+'/'+m[2];
            m=s.match(/^(\d{4})-(0[1-9]|1[0-2])/);
            if(m)return m[2]+'/'+m[1];
            const d=new Date(s);
            if(!Number.isNaN(d.getTime())){
              return String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();
            }
            return '';
          }

          function dpX1UvvNext(v){
            const m=String(v||'').match(/^(0[1-9]|1[0-2])\/(\d{4})$/);
            return m?m[1]+'/'+(Number(m[2])+1):'';
          }

          function dpX1UvvLast(b){
            return dpX1MonthFromAny(
              b?.uvvLastMonth||b?.lastUvv||b?.uvvLast||b?.uvvDate||b?.uvv||b?.inspectionDate||''
            );
          }

          function dpX1EnsureBinData(b){
            if(!b)return;
            if(b.uvvLastMonth==null)b.uvvLastMonth=dpX1UvvLast(b);
            b.uvvLastMonth=dpX1MonthFromAny(b.uvvLastMonth);
            b.uvvNextMonth=dpX1UvvNext(b.uvvLastMonth);
            if(b.reserved==null)b.reserved=false;
            if(b.reservationCustomerId==null)b.reservationCustomerId=null;
            if(b.reservationSiteId==null)b.reservationSiteId=null;
            if(b.reservationPurpose==null)b.reservationPurpose='';
            if(b.reservationFrom==null)b.reservationFrom='';
            if(b.reservationUntil==null)b.reservationUntil='';
          }

          function dpX1EnsureAllBins(){
            (state.bins||[]).forEach(dpX1EnsureBinData);
          }

          function dpX1OrderDate(){
            return String($('oDate')?.value||new Date().toISOString().slice(0,10));
          }

          function dpX1MonthKey(dateValue){
            const s=String(dateValue||'');
            const m=s.match(/^(\d{4})-(0[1-9]|1[0-2])/);
            if(m)return m[1]+'-'+m[2];
            const d=new Date(dateValue||Date.now());
            if(Number.isNaN(d.getTime()))return '';
            return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
          }

          function dpX1ReservationActive(b,dateValue){
            dpX1EnsureBinData(b);
            if(!b?.reserved)return false;
            const month=dpX1MonthKey(dateValue);
            if(b.reservationFrom && month && month<String(b.reservationFrom))return false;
            if(b.reservationUntil && month && month>String(b.reservationUntil))return false;
            return true;
          }

          function dpX1ReservationMatches(b,customerId,siteId,dateValue,material=''){
            if(!dpX1ReservationActive(b,dateValue))return false;
            const rc=String(b.reservationCustomerId||'');
            const rs=String(b.reservationSiteId||'');
            const oc=String(customerId||'');
            const os=String(siteId||'');
            if(rc && rc!==oc)return false;
            if(rs && rs!==os)return false;
            if(rc||rs)return true;
            const purpose=String(b.reservationPurpose||'').trim().toLocaleLowerCase('de');
            const mat=String(material||'').trim().toLocaleLowerCase('de');
            if(purpose&&mat&&(purpose.includes(mat)||mat.includes(purpose)))return true;
            return false;
          }

          function dpX1ReservationLabel(b){
            dpX1EnsureBinData(b);
            const bits=[];
            const c=b.reservationCustomerId?customer(b.reservationCustomerId):null;
            const s=b.reservationSiteId?site(b.reservationSiteId):null;
            if(c?.name)bits.push(c.name);
            if(s?.name)bits.push(s.name);
            if(b.reservationPurpose)bits.push(String(b.reservationPurpose));
            if(b.reservationFrom||b.reservationUntil){
              const fmt=x=>{
                const m=String(x||'').match(/^(\d{4})-(\d{2})$/);
                return m?m[2]+'/'+m[1]:String(x||'');
              };
              bits.push((b.reservationFrom?fmt(b.reservationFrom):'offen')+' bis '+(b.reservationUntil?fmt(b.reservationUntil):'offen'));
            }else if(b.reserved){
              bits.push('dauerhaft');
            }
            return bits.join(' · ')||'Reservierung';
          }

          function dpX1PlannedElsewhere(number,excludeId=null){
            const n=String(number||'').trim();
            if(!n)return null;
            return (state.orders||[]).find(o=>{
              if(excludeId!=null && String(o.id)===String(excludeId))return false;
              if(['Ausgeführt','Nicht ausgeführt','Storniert'].includes(o.status))return false;
              const nums=parsedBinNumbers(o.binNumbers||'').map(String);
              return nums.includes(n);
            })||null;
          }

          function dpX1Availability(b,ctx={}){
            dpX1EnsureBinData(b);
            const no=dpX1BinNumber(b);
            if(String(b.status||'')!=='Auf Lager'){
              return {kind:'unavailable',reason:'nicht auf Lager'};
            }
            const material=dpX1BinMaterial(b);
            if(material){
              return {kind:'unavailable',reason:'Inhalt vorhanden: '+material};
            }
            const planned=dpX1PlannedElsewhere(no,ctx.excludeOrderId);
            if(planned){
              const c=customer(planned.customerId),s=site(planned.siteId);
              return {kind:'unavailable',reason:'bereits geplant'+(c?.name?' für '+c.name:'')+(s?.name?' / '+s.name:'')};
            }
            if(dpX1ReservationActive(b,ctx.date)){
              if(dpX1ReservationMatches(b,ctx.customerId,ctx.siteId,ctx.date,ctx.material)){
                return {kind:'preferred',reason:'passend reserviert: '+dpX1ReservationLabel(b)};
              }
              return {kind:'unavailable',reason:'reserviert für '+dpX1ReservationLabel(b)};
            }
            return {kind:'free',reason:'frei verfügbar'};
          }

          // ------------------------------------------------------------
          // UVV + Reservierung im Mulden-Stammdatenfenster
          // ------------------------------------------------------------
          function dpX1HideLegacyUvv(){
            const status=$('bStatus');
            if(!status)return;
            let root=status.parentElement;
            for(let i=0;i<5&&root?.parentElement;i++){
              root=root.parentElement;
              if(root.querySelectorAll('label').length>=4)break;
            }
            (root?.querySelectorAll('label')||[]).forEach(label=>{
              if(label.closest('#dpX1BinExtra'))return;
              if(/uvv/i.test(String(label.textContent||''))){
                const wrap=label.closest('div');
                if(wrap)wrap.style.display='none';
              }
            });
          }

          function dpX1InstallBinFields(){
            const status=$('bStatus');
            if(!status)return;
            dpX1HideLegacyUvv();
            if($('dpX1BinExtra'))return;
            const box=document.createElement('div');
            box.id='dpX1BinExtra';
            box.style.gridColumn='1/-1';
            box.innerHTML=
              '<div class="section" style="margin-top:10px">UVV</div>'+
              '<div class="miniGrid">'+
                '<div><label>Letzte UVV (MM/JJJJ)</label><input id="dpX1UvvLast" inputmode="numeric" maxlength="7" placeholder="MM/JJJJ" oninput="dpX1UvvChanged()"></div>'+
                '<div><label>Nächste UVV</label><input id="dpX1UvvNext" readonly placeholder="automatisch +12 Monate"></div>'+
              '</div>'+
              '<div class="section" style="margin-top:12px">Reservierung</div>'+
              '<label class="switchline" style="margin-bottom:8px"><input id="dpX1Reserved" type="checkbox" onchange="dpX1ReservationUiChanged()"><span><strong>Mulde reserviert</strong></span></label>'+
              '<div id="dpX1ReservationFields" class="miniGrid hidden">'+
                '<div><label>Reserviert für Kunde</label><select id="dpX1ResCustomer" onchange="dpX1ReservationCustomerChanged()"></select></div>'+
                '<div><label>Baustelle (optional)</label><select id="dpX1ResSite"></select></div>'+
                '<div><label>Zweck / Hinweis</label><input id="dpX1ResPurpose" placeholder="z. B. Kläranlage, Äpfel, Traubentrester"></div>'+
                '<div><label>Von (optional)</label><input id="dpX1ResFrom" type="month"></div>'+
                '<div><label>Bis (optional)</label><input id="dpX1ResUntil" type="month"></div>'+
              '</div>'+
              '<div class="small" style="margin-top:6px">Ohne Zeitraum gilt die Reservierung dauerhaft. Passende Reservierungen werden in der Planung bevorzugt angeboten.</div>';
            const anchor=$('bWarehouseWrap')||status.parentElement;
            anchor.after(box);
          }

          function dpX1UvvChanged(){
            const el=$('dpX1UvvLast');
            if(!el)return;
            let s=String(el.value||'').replace(/[^0-9]/g,'').slice(0,6);
            if(s.length>2)s=s.slice(0,2)+'/'+s.slice(2);
            el.value=s;
            $('dpX1UvvNext').value=dpX1UvvNext(s);
          }

          function dpX1FillReservationCustomers(selected=''){
            const el=$('dpX1ResCustomer');
            if(!el)return;
            const cur=String(selected||'');
            const list=(state.customers||[]).slice().sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'de'));
            el.innerHTML='<option value="">— kein bestimmter Kunde —</option>'+list.map(c=>
              '<option value="'+esc(c.id)+'" '+(String(c.id)===cur?'selected':'')+'>'+esc(c.name||'')+'</option>'
            ).join('');
            if(cur)el.value=cur;
          }

          function dpX1FillReservationSites(selected=''){
            const el=$('dpX1ResSite');
            if(!el)return;
            const cid=String($('dpX1ResCustomer')?.value||'');
            const cur=String(selected||'');
            const list=(state.sites||[]).filter(s=>!cid||String(s.customerId??s.cid)===cid)
              .slice().sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'de'));
            el.innerHTML='<option value="">— keine bestimmte Baustelle —</option>'+list.map(s=>
              '<option value="'+esc(s.id)+'" '+(String(s.id)===cur?'selected':'')+'>'+esc(s.name||'')+'</option>'
            ).join('');
            if(cur && Array.from(el.options).some(o=>o.value===cur))el.value=cur;
          }

          function dpX1ReservationCustomerChanged(){
            dpX1FillReservationSites('');
          }

          function dpX1ReservationUiChanged(){
            const on=!!$('dpX1Reserved')?.checked;
            $('dpX1ReservationFields')?.classList.toggle('hidden',!on);
          }

          function dpX1LoadBinFields(b){
            dpX1InstallBinFields();
            if(!b){
              $('dpX1UvvLast').value='';
              $('dpX1UvvNext').value='';
              $('dpX1Reserved').checked=false;
              dpX1FillReservationCustomers('');
              dpX1FillReservationSites('');
              $('dpX1ResPurpose').value='';
              $('dpX1ResFrom').value='';
              $('dpX1ResUntil').value='';
              dpX1ReservationUiChanged();
              return;
            }
            dpX1EnsureBinData(b);
            $('dpX1UvvLast').value=b.uvvLastMonth||'';
            $('dpX1UvvNext').value=b.uvvNextMonth||'';
            $('dpX1Reserved').checked=!!b.reserved;
            dpX1FillReservationCustomers(b.reservationCustomerId||'');
            dpX1FillReservationSites(b.reservationSiteId||'');
            $('dpX1ResPurpose').value=b.reservationPurpose||'';
            $('dpX1ResFrom').value=b.reservationFrom||'';
            $('dpX1ResUntil').value=b.reservationUntil||'';
            dpX1ReservationUiChanged();
          }

          const dpX1BaseOpenBin=openBin;
          openBin=function(id=null){
            // X2: Die bestehende Mulden-Detailansicht hat Vorrang.
            // Zusatzfelder dürfen das Öffnen niemals blockieren.
            const r=dpX1BaseOpenBin.apply(this,arguments);
            const wantedId=id;
            setTimeout(()=>{
              try{
                dpX1EnsureAllBins();
                const b=wantedId?(state.bins||[]).find(x=>String(x.id)===String(wantedId)):null;
                dpX1LoadBinFields(b);
              }catch(e){
                console.warn('X2 Mulden-Zusatzfelder konnten nicht geladen werden:',e);
              }
            },0);
            return r;
          };

          const dpX1BaseSaveBin=saveBin;
          saveBin=async function(){
            dpX1InstallBinFields();
            const uvv=String($('dpX1UvvLast')?.value||'').trim();
            if(uvv&&!/^(0[1-9]|1[0-2])\/\d{4}$/.test(uvv)){
              return alert('UVV bitte nur als MM/JJJJ eingeben, z. B. 09/2026.');
            }
            const from=String($('dpX1ResFrom')?.value||'');
            const until=String($('dpX1ResUntil')?.value||'');
            if(from&&until&&from>until)return alert('Reservierung: „Von“ darf nicht nach „Bis“ liegen.');

            const editId=editingBinId;
            const before=new Set((state.bins||[]).map(x=>String(x.id)));
            const payload={
              uvvLastMonth:uvv,
              uvvNextMonth:dpX1UvvNext(uvv),
              reserved:!!$('dpX1Reserved')?.checked,
              reservationCustomerId:$('dpX1ResCustomer')?.value||null,
              reservationSiteId:$('dpX1ResSite')?.value||null,
              reservationPurpose:String($('dpX1ResPurpose')?.value||'').trim(),
              reservationFrom:from,
              reservationUntil:until
            };

            const r=await dpX1BaseSaveBin.apply(this,arguments);
            let b=editId?(state.bins||[]).find(x=>String(x.id)===String(editId)):null;
            if(!b)b=(state.bins||[]).find(x=>!before.has(String(x.id)))||null;
            if(b){
              Object.assign(b,payload);
              dpX1EnsureBinData(b);
              await persist();
              renderBins();
            }
            return r;
          };

          // ------------------------------------------------------------
          // Bestandsübersicht im Modul Mulden
          // ------------------------------------------------------------
          function dpX1InstallStockCard(){
            const screen=$('bins');
            if(!screen||$('dpX1StockCard'))return;
            const card=document.createElement('div');
            card.id='dpX1StockCard';
            card.className='card';
            card.innerHTML=
              '<h3>Lagerbestand / Verfügbarkeit</h3>'+
              '<div class="small" style="margin-bottom:8px">Frei, reserviert und mit Inhalt werden bewusst getrennt angezeigt.</div>'+
              '<div class="miniGrid">'+
                '<div><label>Lager</label><select id="dpX1StockWarehouse" onchange="dpX1RenderStockRows()"></select></div>'+
                '<div><label>Muldentyp</label><select id="dpX1StockType" onchange="dpX1RenderStockRows()"></select></div>'+
              '</div>'+
              '<div id="dpX1StockRows" style="margin-top:10px"></div>';
            screen.prepend(card);
          }

          function dpX1RenderStockRows(){
            const host=$('dpX1StockRows');
            if(!host)return;
            dpX1EnsureAllBins();
            const wid=String($('dpX1StockWarehouse')?.value||'');
            const typ=String($('dpX1StockType')?.value||'');
            const date=new Date().toISOString().slice(0,10);
            let list=(state.bins||[]).filter(b=>String(b.status||'')==='Auf Lager');
            if(wid)list=list.filter(b=>String(b.warehouseId||'')===wid);
            if(typ)list=list.filter(b=>String(b.type||'')===typ);
            list=list.slice().sort((a,b)=>dpX1BinNumber(a).localeCompare(dpX1BinNumber(b),'de',{numeric:true}));
            if(!list.length){host.innerHTML='<div class="small">Keine Mulden für diesen Filter.</div>';return;}
            host.innerHTML=list.map(b=>{
              const no=dpX1BinNumber(b)||'ohne Nummer';
              const material=dpX1BinMaterial(b);
              let stateText='Frei verfügbar';
              if(material)stateText='Mit Inhalt: '+material+' – nicht direkt verfügbar';
              else if(dpX1ReservationActive(b,date))stateText='Reserviert für '+dpX1ReservationLabel(b);
              const uvv=b.uvvNextMonth?' · nächste UVV '+b.uvvNextMonth:'';
              return '<div onclick="openBin('+JSON.stringify(b.id)+')" title="Mulde öffnen" style="padding:8px 0;border-bottom:1px solid #e5e7eb;cursor:pointer">'+
                '<strong>Mulde '+esc(no)+'</strong> · '+esc(b.type||'Typ offen')+' · '+esc(locationText(b))+
                '<div class="small">'+esc(stateText)+esc(uvv)+'</div></div>';
            }).join('');
          }

          function dpX1RenderStock(){
            dpX1EnsureAllBins();
            dpX1InstallStockCard();
            const wh=$('dpX1StockWarehouse'),ty=$('dpX1StockType');
            if(!wh||!ty)return;
            const oldWh=wh.value,oldTy=ty.value;
            wh.innerHTML='<option value="">Alle Lager</option>'+dpWLActive().map(w=>'<option value="'+esc(w.id)+'">'+esc(w.name)+'</option>').join('');
            const types=[...new Set((state.bins||[]).map(b=>String(b.type||'')).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'de'));
            ty.innerHTML='<option value="">Alle Muldentypen</option>'+types.map(x=>'<option>'+esc(x)+'</option>').join('');
            if(Array.from(wh.options).some(o=>o.value===oldWh))wh.value=oldWh;
            if(Array.from(ty.options).some(o=>o.value===oldTy))ty.value=oldTy;
            dpX1RenderStockRows();
          }

          const dpX1BaseRenderBins=renderBins;
          renderBins=function(){
            const r=dpX1BaseRenderBins.apply(this,arguments);
            dpX1RenderStock();
            return r;
          };

          // ------------------------------------------------------------
          // Verfügbare Lager-Mulden direkt im Auftrag "Stellen"
          // ------------------------------------------------------------
          function dpX1InstallPlanningStock(){
            const anchor=$('dpABBinNumberFields');
            if(!anchor||$('dpX1PlanningStock'))return;
            const box=document.createElement('div');
            box.id='dpX1PlanningStock';
            box.className='hidden';
            box.style.gridColumn='1/-1';
            anchor.after(box);
          }

          function dpX1RequiredTypes(){
            const n=Math.max(1,Math.min(10,Number($('oCount')?.value||1)));
            const out=[];
            for(let i=1;i<=n;i++){
              const el=$('oBinType'+i)||(i===1?$('oBin1'):i===2?$('oBin2'):i===3?$('oBin3'):null);
              const val=String(el?.value||'').trim();
              if(val)out.push(val);
            }
            return [...new Set(out)];
          }

          function dpX1SelectedNumbers(){
            const n=Math.max(1,Math.min(10,Number($('oCount')?.value||1)));
            const out=[];
            for(let i=1;i<=n;i++){
              const v=String($('oBinNumber'+i)?.value||'').trim();
              if(v)out.push(v);
            }
            return out;
          }

          function dpX1PlanningContext(){
            return {
              date:dpX1OrderDate(),
              customerId:$('oCustomer')?.value||'',
              siteId:$('oSite')?.value||'',
              material:$('oMaterial')?.value||$('oContent')?.value||'',
              excludeOrderId:editingOrderId||null
            };
          }

          function dpX1TakeBin(number,type){
            const no=String(number||'');
            const n=Math.max(1,Math.min(10,Number($('oCount')?.value||1)));
            let target=null;
            for(let i=1;i<=n;i++){
              const input=$('oBinNumber'+i);
              if(!input||String(input.value||'').trim())continue;
              const typEl=$('oBinType'+i)||(i===1?$('oBin1'):i===2?$('oBin2'):i===3?$('oBin3'):null);
              if(!typEl?.value||String(typEl.value)===String(type)){target={input,typEl};break;}
              if(!target)target={input,typEl};
            }
            if(!target)return alert('Alle vorgesehenen Muldennummern sind bereits belegt.');
            target.input.value=no;
            if(target.typEl&&!target.typEl.value&&type)target.typEl.value=type;
            target.input.dispatchEvent(new Event('input',{bubbles:true}));
            dpX1RenderPlanningStock();
          }

          function dpX1PlanningRow(b,a,selected){
            const no=dpX1BinNumber(b);
            const chosen=selected.includes(no);
            const info=esc(b.type||'Typ offen')+' · '+esc(locationText(b));
            const button=a.kind!=='unavailable'&&!chosen
              ?'<button class="btn secondary" type="button" onclick=\'dpX1TakeBin('+JSON.stringify(no)+','+JSON.stringify(String(b.type||''))+')\'>Übernehmen</button>'
              :chosen?'<span class="badge">ausgewählt</span>':'';
            return '<div class="row" style="padding:7px 0;border-bottom:1px solid #e5e7eb">'+
              '<div class="grow"><strong>Mulde '+esc(no)+'</strong><div class="small">'+info+'<br>'+esc(a.reason)+'</div></div>'+button+'</div>';
          }

          function dpX1RenderPlanningStock(){
            dpX1InstallPlanningStock();
            const host=$('dpX1PlanningStock');
            if(!host)return;
            const show=$('oTask')?.value==='Stellen';
            host.classList.toggle('hidden',!show);
            if(!show)return;
            dpX1EnsureAllBins();
            const ctx=dpX1PlanningContext();
            const types=dpX1RequiredTypes();
            const selected=dpX1SelectedNumbers();
            let bins=(state.bins||[]).filter(b=>String(b.status||'')==='Auf Lager'&&dpX1BinNumber(b));
            if(types.length)bins=bins.filter(b=>types.includes(String(b.type||'')));
            const rows=bins.map(b=>({b,a:dpX1Availability(b,ctx)}));
            const pref=rows.filter(x=>x.a.kind==='preferred');
            const free=rows.filter(x=>x.a.kind==='free');
            const unavailable=rows.filter(x=>x.a.kind==='unavailable');
            const sort=(a,b)=>dpX1BinNumber(a.b).localeCompare(dpX1BinNumber(b.b),'de',{numeric:true});
            pref.sort(sort);free.sort(sort);unavailable.sort(sort);
            let html='<div class="card" style="margin-top:10px"><h3>Mulden auf Lager</h3>'+
              '<div class="small" style="margin-bottom:8px">Passend reservierte Mulden werden bevorzugt. Mulden mit Inhalt oder fremder Reservierung bleiben sichtbar, sind aber nicht direkt auswählbar.</div>';
            if(pref.length)html+='<div class="section">Passend reserviert</div>'+pref.map(x=>dpX1PlanningRow(x.b,x.a,selected)).join('');
            if(free.length)html+='<div class="section" style="margin-top:8px">Frei verfügbar</div>'+free.map(x=>dpX1PlanningRow(x.b,x.a,selected)).join('');
            if(unavailable.length)html+='<details style="margin-top:10px"><summary>Nicht direkt verfügbar ('+unavailable.length+')</summary>'+unavailable.map(x=>dpX1PlanningRow(x.b,x.a,selected)).join('')+'</details>';
            if(!rows.length)html+='<div class="small">Keine passende Mulde auf Lager gefunden.</div>';
            html+='</div>';
            host.innerHTML=html;
          }

          // Änderung an Kunde/Baustelle/Tätigkeit/Typ/Anzahl aktualisiert die Liste sofort.
          document.addEventListener('change',function(e){
            const id=String(e?.target?.id||'');
            if(['oCustomer','oSite','oTask','oCount','oDate','oMaterial','oContent','oBin1','oBin2','oBin3'].includes(id)||/^oBinType\d+$/.test(id)){
              setTimeout(dpX1RenderPlanningStock,0);
            }
          });
          document.addEventListener('input',function(e){
            const id=String(e?.target?.id||'');
            if(/^oBinNumber\d+$/.test(id))setTimeout(dpX1RenderPlanningStock,0);
          });

          const dpX1BaseOpenM=openM;
          openM=function(id){
            const r=dpX1BaseOpenM.apply(this,arguments);
            if(id==='orderModal')setTimeout(dpX1RenderPlanningStock,0);
            return r;
          };

          // Schutz auch bei manueller Nummerneingabe: Inhalt/fremde Reservierung/
          // Doppelplanung dürfen bei "Stellen" nicht stillschweigend verwendet werden.
          const dpX1BaseSaveOrder=saveOrder;
          saveOrder=async function(){
            if($('oTask')?.value==='Stellen'){
              const ctx=dpX1PlanningContext();
              for(const no of dpX1SelectedNumbers()){
                const b=binByNumber(no);
                if(!b)continue;
                const a=dpX1Availability(b,ctx);
                if(a.kind==='unavailable'){
                  return alert('Mulde '+no+' ist nicht direkt verfügbar: '+a.reason+'.');
                }
              }
            }
            return await dpX1BaseSaveOrder.apply(this,arguments);
          };

          // Nach dem Laden alte Muldenfelder einmal sanft normalisieren, ohne
          // den Produktivbestand ungefragt zu verändern. Persistiert wird erst
          // bei einer echten Benutzeränderung.
          try{dpX1EnsureAllBins()}catch(e){console.warn('X1 Muldeninitialisierung:',e)}
          try{dpX1InstallBinFields()}catch(e){}
          try{dpX1InstallPlanningStock()}catch(e){}
          try{dpX1RenderStock()}catch(e){}

          /* DP_X1_MULDEN_UVV_RESERVIERUNG_END */
          """

          t=t.replace(marker,patch+"\n"+marker,1)
          p.write_text(t,encoding="utf-8",newline="\n")
          print("X1: UVV, Reservierung, Lager-Verfügbarkeit und Stellen-Auswahl eingefügt.")
          PY

          grep -q "DP_X1_MULDEN_UVV_RESERVIERUNG_BEGIN" dispopilot-online-efd.html
          grep -q "Letzte UVV (MM/JJJJ)" dispopilot-online-efd.html
          grep -q "Nächste UVV" dispopilot-online-efd.html
          grep -q "Mulde reserviert" dispopilot-online-efd.html
          grep -q "Mulden auf Lager" dispopilot-online-efd.html
          grep -q "X2: Die bestehende Mulden-Detailansicht hat Vorrang" dispopilot-online-efd.html
          grep -q "title=\"Mulde öffnen\"" dispopilot-online-efd.html
          grep -q "Passend reserviert" dispopilot-online-efd.html
          grep -q "Inhalt vorhanden:" dispopilot-online-efd.html

      - name: Apply X3 Mulden details and compact dropdown repair
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path("dispopilot-online-efd.html")
          t=p.read_text(encoding="utf-8")
          marker="/* DP13_PATCH_END */"
          if t.count(marker)!=1:
              raise SystemExit(f"X3 abgebrochen: DP13-Endmarker {t.count(marker)}x gefunden statt 1x.")
          if "DP_X3_MULDEN_DETAILS_DROPDOWN_BEGIN" in t:
              raise SystemExit("X3 abgebrochen: Patch bereits vorhanden.")

          patch=r"""
          /* DP_X3_MULDEN_DETAILS_DROPDOWN_BEGIN */
          // X3 repariert zuerst die Testbarkeit des gesamten Muldenbereichs:
          // 1) Mulden-Details müssen wieder überall zuverlässig öffnen.
          // 2) Die Stellen-Auswahl wird bei großen Beständen als kompakte,
          //    durchsuchbare Dropdown-Liste dargestellt statt als lange Liste.
          // 3) Eigene X1-Handler laufen über echte EventListener und nicht mehr
          //    über vom SPFx-srcdoc-Schutz blockierte Inline-Handler.

          let dpX3PlanningBinId=null;
          let dpX3DropdownOpen=false;

          function dpX3BinById(id){
            return (state.bins||[]).find(x=>String(x.id)===String(id))||null;
          }

          function dpX3FixX1InlineHandlers(){
            const ids=['dpX1UvvLast','dpX1Reserved','dpX1ResCustomer','dpX1StockWarehouse','dpX1StockType'];
            ids.forEach(id=>{
              const el=$(id);
              if(!el)return;
              el.removeAttribute('oninput');
              el.removeAttribute('onchange');
              el.removeAttribute('onclick');
            });
          }

          // Den stabilen Öffnen-Stand VOR dem X1-Wrapper verwenden. Dadurch kann
          // ein Fehler in Zusatzfeldern nie mehr das eigentliche Detailfenster blockieren.
          const dpX3StableOpenBin=(typeof dpX1BaseOpenBin==='function')?dpX1BaseOpenBin:openBin;
          function dpX3OpenBinSafe(id=null,fromPlanning=false){
            if(fromPlanning)dpX3PlanningBinId=id;
            let result;
            try{
              result=dpX3StableOpenBin.call(this,id);
            }catch(e){
              console.error('X3 Mulde öffnen:',e);
              alert('Mulden-Details konnten nicht geöffnet werden: '+String(e?.message||e||''));
              return;
            }
            setTimeout(()=>{
              try{
                dpX1EnsureAllBins();
                const b=id!=null?dpX3BinById(id):null;
                dpX1LoadBinFields(b);
                dpX3FixX1InlineHandlers();
                dpX3InstallPlanningActions(b);
              }catch(e){
                console.warn('X3 Zusatzfelder nach Muldenöffnung:',e);
              }
            },20);
            return result;
          }
          openBin=function(id=null){return dpX3OpenBinSafe.call(this,id,false)};

          function dpX3StatusInfo(b,ctx){
            const no=dpX1BinNumber(b);
            const material=dpX1BinMaterial(b);
            const planned=dpX1PlannedElsewhere(no,ctx.excludeOrderId);
            if(material)return {key:'content',dot:'🟡',label:'Inhalt: '+material,direct:false};
            if(planned){
              const c=customer(planned.customerId),s=site(planned.siteId);
              return {key:'planned',dot:'🔴',label:'bereits geplant'+(c?.name?' für '+c.name:'')+(s?.name?' / '+s.name:''),direct:false};
            }
            if(dpX1ReservationActive(b,ctx.date)){
              const match=dpX1ReservationMatches(b,ctx.customerId,ctx.siteId,ctx.date,ctx.material);
              return {key:'reserved',dot:'🟠',label:(match?'passend reserviert: ':'reserviert für ')+dpX1ReservationLabel(b),direct:false,match};
            }
            return {key:'free',dot:'🟢',label:'frei verfügbar',direct:true};
          }

          function dpX3PlanningBins(){
            dpX1EnsureAllBins();
            const types=dpX1RequiredTypes();
            return (state.bins||[])
              .filter(b=>String(b.status||'')==='Auf Lager'&&dpX1BinNumber(b))
              .filter(b=>!types.length||types.includes(String(b.type||'')))
              .slice()
              .sort((a,b)=>dpX1BinNumber(a).localeCompare(dpX1BinNumber(b),'de',{numeric:true}));
          }

          function dpX3InstallPlanningStock(){
            dpX1InstallPlanningStock();
            const host=$('dpX1PlanningStock');
            if(!host)return;
            host.removeAttribute('onclick');
            host.removeAttribute('onchange');
          }

          function dpX3RenderDropdownRows(){
            const listHost=$('dpX3BinList');
            if(!listHost)return;
            const q=String($('dpX3BinSearch')?.value||'').trim().toLocaleLowerCase('de');
            const ctx=dpX1PlanningContext();
            const selected=dpX1SelectedNumbers();
            let bins=dpX3PlanningBins();
            if(q)bins=bins.filter(b=>{
              const info=dpX3StatusInfo(b,ctx);
              return [dpX1BinNumber(b),b.type,locationText(b),info.label].join(' ').toLocaleLowerCase('de').includes(q);
            });
            if(!bins.length){listHost.innerHTML='<div class="small" style="padding:10px">Keine passende Mulde gefunden.</div>';return;}
            listHost.innerHTML=bins.map(b=>{
              const no=dpX1BinNumber(b);
              const st=dpX3StatusInfo(b,ctx);
              const chosen=selected.includes(no);
              const bg=st.key==='free'?'#ecfdf3':st.key==='content'?'#fff8db':st.key==='reserved'?'#fff2df':'#feecec';
              const border=st.key==='free'?'#2e8b57':st.key==='content'?'#d2a100':st.key==='reserved'?'#df7b16':'#c33';
              return '<button type="button" data-x3-bin-id="'+esc(b.id)+'" data-x3-action="'+(st.direct&&!chosen?'take':'details')+'" '
                +'style="width:100%;text-align:left;border:0;border-left:5px solid '+border+';border-bottom:1px solid #ddd;background:'+bg+';padding:10px;cursor:pointer">'
                +'<strong>'+st.dot+' Mulde '+esc(no)+'</strong> · '+esc(b.type||'Typ offen')
                +'<div class="small">'+esc(locationText(b))+' · '+esc(st.label)+(chosen?' · bereits ausgewählt':'')+'</div></button>';
            }).join('');
          }

          function dpX3RenderPlanningStock(){
            dpX3InstallPlanningStock();
            const host=$('dpX1PlanningStock');
            if(!host)return;
            const show=$('oTask')?.value==='Stellen';
            host.classList.toggle('hidden',!show);
            if(!show)return;
            const types=dpX1RequiredTypes();
            const typeLabel=types.length?types.join(', '):'Muldentyp wählen';
            host.innerHTML='<div class="card" style="margin-top:10px">'
              +'<h3>Mulde auswählen</h3>'
              +'<div class="small" style="margin-bottom:8px">Typ: <strong>'+esc(typeLabel)+'</strong>. Lagerstandort wird nur als Hinweis angezeigt.</div>'
              +'<button id="dpX3BinDropButton" class="btn secondary full" type="button">Mulden-Dropdown öffnen ▾</button>'
              +'<div id="dpX3BinPanel" class="hidden" style="margin-top:8px;border:1px solid #d1d5db;border-radius:10px;overflow:hidden;background:white">'
                +'<div style="padding:8px"><input id="dpX3BinSearch" placeholder="Muldennummer suchen …" autocomplete="off"></div>'
                +'<div id="dpX3BinList" style="max-height:48vh;overflow:auto"></div>'
              +'</div>'
              +'<div class="small" style="margin-top:7px">🟢 frei · 🟡 Inhalt vorhanden · 🟠 reserviert · 🔴 bereits anderweitig geplant</div>'
              +'</div>';
            dpX3DropdownOpen=false;
            dpX3RenderDropdownRows();
          }

          // X1-Langliste vollständig durch X3-Dropdown ersetzen.
          dpX1RenderPlanningStock=dpX3RenderPlanningStock;

          function dpX3TakeBinById(id){
            const b=dpX3BinById(id);
            if(!b)return alert('Mulde wurde nicht gefunden.');
            const ctx=dpX1PlanningContext();
            const st=dpX3StatusInfo(b,ctx);
            if(st.key!=='free')return dpX3OpenBinSafe(b.id,true);
            dpX1TakeBin(dpX1BinNumber(b),String(b.type||''));
            dpX3DropdownOpen=false;
            $('dpX3BinPanel')?.classList.add('hidden');
            dpX3RenderPlanningStock();
          }

          function dpX3InstallPlanningActions(b){
            const old=$('dpX3PlanningActions');
            if(old)old.remove();
            if(!b||dpX3PlanningBinId==null||String(b.id)!==String(dpX3PlanningBinId))return;
            const anchor=$('dpX1BinExtra')||$('bWarehouseWrap')||$('bStatus')?.parentElement;
            if(!anchor)return;
            const ctx=dpX1PlanningContext();
            const st=dpX3StatusInfo(b,ctx);
            const box=document.createElement('div');
            box.id='dpX3PlanningActions';
            box.style.cssText='grid-column:1/-1;margin-top:12px;padding:10px;border:2px solid #d1d5db;border-radius:10px;background:#f8fafc';
            let html='<strong>Aus Auswahl „Stellen“</strong><div class="small" style="margin:4px 0 8px">'+esc(st.dot+' '+st.label)+'</div>';
            if(st.key==='content'){
              html+='<div class="notice">Diese Mulde ist nicht direkt verfügbar. Vor der Verwendung muss ein eigener Auftrag zum Leeren/Entsorgen angelegt und ausgeführt werden.</div>';
            }else if(st.key==='planned'){
              html+='<div class="notice">Die Mulde ist bereits in einem offenen Auftrag verplant und kann hier nicht übernommen werden.</div>';
            }else{
              html+='<button class="btn primary" type="button" data-x3-action="take-current" data-x3-bin-id="'+esc(b.id)+'">Mulde bewusst übernehmen</button>';
              if(st.key==='reserved')html+='<div class="small" style="margin-top:6px">Die Reservierung bleibt dokumentiert und wird durch die bewusste Auswahl nicht gelöscht.</div>';
            }
            box.innerHTML=html;
            anchor.after(box);
          }

          // Echte EventListener statt eigener Inline-onclick/onchange-Handler.
          document.addEventListener('click',function(e){
            const target=e.target?.closest?.('[data-x3-action]');
            if(!target)return;
            const action=String(target.getAttribute('data-x3-action')||'');
            const id=target.getAttribute('data-x3-bin-id');
            if(action==='take'){
              e.preventDefault();e.stopPropagation();dpX3TakeBinById(id);return;
            }
            if(action==='details'){
              e.preventDefault();e.stopPropagation();dpX3OpenBinSafe(id,true);return;
            }
            if(action==='take-current'){
              e.preventDefault();e.stopPropagation();
              const b=dpX3BinById(id);
              if(!b)return;
              if(dpX1BinMaterial(b))return alert('Mulde mit Inhalt kann nicht direkt übernommen werden. Zuerst Leeren-Auftrag anlegen und ausführen.');
              dpX1TakeBin(dpX1BinNumber(b),String(b.type||''));
              dpX3PlanningBinId=null;
              try{closeM('binModal')}catch(_){}
              try{closeM('detailModal')}catch(_){}
              setTimeout(dpX3RenderPlanningStock,20);
              return;
            }
          });

          document.addEventListener('click',function(e){
            if(e.target?.id!=='dpX3BinDropButton')return;
            dpX3DropdownOpen=!dpX3DropdownOpen;
            $('dpX3BinPanel')?.classList.toggle('hidden',!dpX3DropdownOpen);
            if(dpX3DropdownOpen)setTimeout(()=>$('dpX3BinSearch')?.focus(),20);
          });
          document.addEventListener('input',function(e){
            const id=String(e?.target?.id||'');
            if(id==='dpX3BinSearch')dpX3RenderDropdownRows();
            if(id==='dpX1UvvLast')dpX1UvvChanged();
          });
          document.addEventListener('change',function(e){
            const id=String(e?.target?.id||'');
            if(id==='dpX1Reserved')dpX1ReservationUiChanged();
            if(id==='dpX1ResCustomer')dpX1ReservationCustomerChanged();
            if(id==='dpX1StockWarehouse'||id==='dpX1StockType')dpX1RenderStockRows();
          });

          // Nach jeder Mulden-/Auftragsdarstellung X3 wieder sauber anbinden.
          const dpX3BaseRenderBins=renderBins;
          renderBins=function(){
            const r=dpX3BaseRenderBins.apply(this,arguments);
            setTimeout(dpX3FixX1InlineHandlers,0);
            return r;
          };
          const dpX3BaseOpenM=openM;
          openM=function(id){
            const r=dpX3BaseOpenM.apply(this,arguments);
            if(id==='orderModal')setTimeout(dpX3RenderPlanningStock,20);
            return r;
          };

          try{dpX3FixX1InlineHandlers()}catch(_){}
          try{dpX3RenderPlanningStock()}catch(_){}
          /* DP_X3_MULDEN_DETAILS_DROPDOWN_END */
          """

          t=t.replace(marker,patch+"\n"+marker,1)
          p.write_text(t,encoding="utf-8",newline="\n")
          print("X3: Mulden-Details stabilisiert und kompakte suchbare Stellen-Auswahl eingefügt.")
          PY

          grep -q "DP_X3_MULDEN_DETAILS_DROPDOWN_BEGIN" dispopilot-online-efd.html
          grep -q "Mulden-Dropdown öffnen" dispopilot-online-efd.html
          grep -q "dpX3OpenBinSafe" dispopilot-online-efd.html
          grep -q "dpX1RenderPlanningStock=dpX3RenderPlanningStock" dispopilot-online-efd.html
          grep -q "data-x3-action" dispopilot-online-efd.html
          grep -q "Mulde bewusst übernehmen" dispopilot-online-efd.html

      - name: Apply X4A canonical Mulden detail ID fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path("dispopilot-online-efd.html")
          t=p.read_text(encoding="utf-8")

          end_marker="/* DP_X3_MULDEN_DETAILS_DROPDOWN_END */"
          if t.count(end_marker)!=1:
              raise SystemExit(f"X4A abgebrochen: X3-Endmarker {t.count(end_marker)}x gefunden statt 1x.")
          if "DP_X4A_MULDEN_DETAIL_ID_FIX_BEGIN" in t:
              raise SystemExit("X4A abgebrochen: Patch bereits vorhanden.")

          # X3 selbst bleibt unangetastet. Statt die komplette Funktion per exaktem
          # Textvergleich zu ersetzen, wird direkt nach X3 ein robuster Wrapper gesetzt.
          # So ist X4A unempfindlich gegen Einrückungen/kleine Änderungen im X3-Quelltext.
          patch=r"""
          /* DP_X4A_MULDEN_DETAIL_ID_FIX_BEGIN */
          const dpX4ABaseOpenBinSafe=dpX3OpenBinSafe;
          dpX3OpenBinSafe=function(id=null,fromPlanning=false){
            // IDs aus data-* Attributen kommen als String. Vor dem bestehenden X3-Aufruf
            // immer die echte Mulde aus state.bins suchen und deren originale ID verwenden.
            try{dpX1EnsureAllBins()}catch(_){}
            const resolved=id!=null?dpX3BinById(id):null;
            const canonicalId=resolved?resolved.id:id;
            if(fromPlanning)dpX3PlanningBinId=canonicalId;
            return dpX4ABaseOpenBinSafe.call(this,canonicalId,fromPlanning);
          };
          /* DP_X4A_MULDEN_DETAIL_ID_FIX_END */
          """

          t=t.replace(end_marker,end_marker+"\n"+patch,1)
          p.write_text(t,encoding="utf-8",newline="\n")
          print("X4A: robuster Wrapper für kanonische Mulden-ID eingefügt.")
          PY

          grep -q "DP_X4A_MULDEN_DETAIL_ID_FIX_BEGIN" dispopilot-online-efd.html
          grep -q "const dpX4ABaseOpenBinSafe=dpX3OpenBinSafe" dispopilot-online-efd.html
          grep -q "return dpX4ABaseOpenBinSafe.call(this,canonicalId,fromPlanning)" dispopilot-online-efd.html

      - name: Apply X5 pre-empty order and matching reservation logic
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path("dispopilot-online-efd.html")
          s=p.read_text(encoding="utf-8")
          end_marker="/* DP_X4A_MULDEN_DETAIL_ID_FIX_END */"
          if s.count(end_marker)!=1:
              raise SystemExit(f"X5 abgebrochen: X4A-Endmarker {s.count(end_marker)}x gefunden statt 1x.")
          if "DP_X5_LEEREN_PASSENDE_RESERVIERUNG_BEGIN" in s:
              raise SystemExit("X5 abgebrochen: Patch bereits vorhanden.")

          patch=r"""
          /* DP_X5_LEEREN_PASSENDE_RESERVIERUNG_BEGIN */
          // X5:
          // 1) Passend reserviert = für diesen Kunden/diese Baustelle verwendbar und grün.
          // 2) Volle Lager-Mulde = Detailentscheidung: andere Mulde oder Leeren + danach verwenden.
          // 3) Der vorgeschaltete Leeren-Auftrag wird erst gemeinsam mit dem Stellen-Auftrag persistiert,
          //    damit beim Abbrechen der Auftragsanlage kein verwaister Test-/Leerenauftrag übrig bleibt.

          let dpX5PendingPreEmpty=null;

          function dpX5Norm(v){
            return String(v??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLocaleLowerCase('de');
          }

          function dpX5EntityEqual(kind,a,b){
            const sa=String(a??''),sb=String(b??'');
            if(sa&&sb&&sa===sb)return true;
            if(!sa||!sb)return false;
            try{
              const ea=kind==='site'?site(a):customer(a);
              const eb=kind==='site'?site(b):customer(b);
              return !!(ea&&eb&&dpX5Norm(ea.name)===dpX5Norm(eb.name));
            }catch(_){return false;}
          }

          function dpX5ReservationMatchesStrong(b,ctx={}){
            if(!dpX1ReservationActive(b,ctx.date))return false;
            const rc=b?.reservationCustomerId;
            const rs=b?.reservationSiteId;
            if(rc&&!dpX5EntityEqual('customer',rc,ctx.customerId))return false;
            if(rs&&!dpX5EntityEqual('site',rs,ctx.siteId))return false;
            if(rc||rs)return true;
            try{return dpX1ReservationMatches(b,ctx.customerId,ctx.siteId,ctx.date,ctx.material)}catch(_){return false;}
          }

          function dpX5OrderHasBin(o,no){
            const wanted=String(no||'').trim();
            if(!wanted||!o)return false;
            const vals=[];
            try{vals.push(...parsedBinNumbers(o.binNumbers||''));}catch(_){}
            [o.existingBinNumber,o.newBinNumber].forEach(x=>{if(x)vals.push(x)});
            ['existingBinNumbers','newBinNumbers','actualBinNumbers','actualExistingBinNumbers'].forEach(k=>{
              if(Array.isArray(o[k]))vals.push(...o[k]);
            });
            return vals.map(String).includes(wanted);
          }

          function dpX5ContentOrigin(b){
            const no=dpX1BinNumber(b);
            if(!no)return null;
            const directCustomer=b?.contentCustomerId??b?.lastContentCustomerId??null;
            const directSite=b?.contentSiteId??b?.lastContentSiteId??null;
            if(directCustomer||directSite){
              return {customerId:directCustomer,siteId:directSite,drop:b?.contentDrop||'',order:null};
            }

            // Bevorzugt die letzte dokumentierte Muldenbewegung und deren Auftrag.
            const moves=(state.binMovements||[])
              .filter(m=>String(m?.binNumber||'')===String(no)&&m?.orderId!=null)
              .slice()
              .sort((a,b)=>String(b?.at||b?.createdAt||b?.timestamp||'').localeCompare(String(a?.at||a?.createdAt||a?.timestamp||'')));
            for(const m of moves){
              const o=orderById(m.orderId);
              if(o?.customerId){
                return {customerId:o.customerId,siteId:o.siteId||null,drop:o.drop||'',order:o};
              }
            }

            // Rückfallebene für ältere Bestände ohne auswertbare Bewegungshistorie.
            const orders=(state.orders||[])
              .filter(o=>o?.customerId&&dpX5OrderHasBin(o,no))
              .slice()
              .sort((a,b)=>String(b?.updatedAt||b?.createdAt||b?.date||'').localeCompare(String(a?.updatedAt||a?.createdAt||a?.date||'')));
            if(orders.length){
              const o=orders[0];
              return {customerId:o.customerId,siteId:o.siteId||null,drop:o.drop||'',order:o};
            }
            if(b?.customerId||b?.siteId)return {customerId:b.customerId||null,siteId:b.siteId||null,drop:'',order:null};
            return null;
          }

          // Passend reservierte Mulden sind im aktuellen Auftrag regulär verwendbar.
          const dpX5BaseAvailability=dpX1Availability;
          dpX1Availability=function(b,ctx={}){
            const no=dpX1BinNumber(b);
            const task=String($('oTask')?.value||'');
            const edited=editingOrderId?orderById(editingOrderId):null;
            const pending=!!(dpX5PendingPreEmpty&&String(dpX5PendingPreEmpty.number)===String(no)&&task==='Stellen');
            const linked=!!(edited&&edited.x5PreEmptyOrderId&&String(edited.x5PreparedBinNumber||'')===String(no)&&task==='Stellen');
            if(pending||linked){
              return {kind:'preferred',reason:'Leeren-Auftrag wird/wurde unmittelbar vorgeschaltet'};
            }
            if(String(b?.status||'')==='Auf Lager'&&!dpX1BinMaterial(b)&&!dpX1PlannedElsewhere(no,ctx.excludeOrderId)
              &&dpX1ReservationActive(b,ctx.date)&&dpX5ReservationMatchesStrong(b,ctx)){
              return {kind:'preferred',reason:'passend reserviert: '+dpX1ReservationLabel(b)};
            }
            return dpX5BaseAvailability.call(this,b,ctx);
          };

          const dpX5BaseStatusInfo=dpX3StatusInfo;
          dpX3StatusInfo=function(b,ctx){
            const base=dpX5BaseStatusInfo.call(this,b,ctx);
            if(base?.key==='reserved'&&dpX5ReservationMatchesStrong(b,ctx)){
              return {key:'free',dot:'🟢',label:'passend reserviert: '+dpX1ReservationLabel(b),direct:true,match:true};
            }
            return base;
          };

          function dpX5CloseBinDetails(){
            dpX3PlanningBinId=null;
            try{closeM('binModal')}catch(_){}
            try{closeM('detailModal')}catch(_){}
            setTimeout(dpX3RenderPlanningStock,20);
          }

          function dpX5StagePreEmpty(id){
            const b=dpX3BinById(id);
            if(!b)return alert('Mulde wurde nicht gefunden.');
            const no=dpX1BinNumber(b);
            const material=dpX1BinMaterial(b);
            if(!material)return alert('Diese Mulde hat keinen dokumentierten Inhalt und muss nicht vorgeschaltet geleert werden.');
            if(String($('oTask')?.value||'')!=='Stellen')return alert('„Leeren und danach verwenden“ ist hier nur für einen Stellen-Auftrag vorgesehen.');
            const origin=dpX5ContentOrigin(b);
            if(!origin?.customerId){
              return alert('Der Kunde, zu dem der dokumentierte Inhalt gehört, konnte nicht sicher ermittelt werden. Bitte die Muldenhistorie prüfen oder den Leeren-Auftrag manuell anlegen.');
            }

            dpX5PendingPreEmpty={
              binId:b.id,
              number:no,
              type:String(b.type||''),
              material,
              sourceWarehouseId:String(b.warehouseId||''),
              originCustomerId:origin.customerId,
              originSiteId:origin.siteId||null,
              drop:origin.drop||'',
              stagedAt:nowIso()
            };
            dpX1TakeBin(no,String(b.type||''));
            dpX5CloseBinDetails();
            setTimeout(()=>alert('Mulde '+no+' ist für diesen Stellen-Auftrag vorgemerkt. Beim Speichern wird automatisch ein Leeren-Auftrag unmittelbar davor erzeugt.'),20);
          }

          // Die Detailentscheidung aus der Stellen-Auswahl eindeutig machen.
          dpX3InstallPlanningActions=function(b){
            const old=$('dpX3PlanningActions');
            if(old)old.remove();
            if(!b||dpX3PlanningBinId==null||String(b.id)!==String(dpX3PlanningBinId))return;
            const anchor=$('dpX1BinExtra')||$('bWarehouseWrap')||$('bStatus')?.parentElement;
            if(!anchor)return;
            const ctx=dpX1PlanningContext();
            const st=dpX3StatusInfo(b,ctx);
            const box=document.createElement('div');
            box.id='dpX3PlanningActions';
            box.style.cssText='grid-column:1/-1;margin-top:12px;padding:10px;border:2px solid #d1d5db;border-radius:10px;background:#f8fafc';
            let html='<strong>Aus Auswahl „Stellen“</strong><div class="small" style="margin:4px 0 8px">'+esc(st.dot+' '+st.label)+'</div>';
            if(st.key==='content'){
              html+='<div class="notice">Diese Mulde ist gefüllt und nicht direkt verfügbar.</div>'
                +'<div class="row" style="gap:8px;flex-wrap:wrap;margin-top:8px">'
                +'<button class="btn secondary" type="button" data-x5-action="close-select">Schließen / andere Mulde</button>'
                +'<button class="btn primary" type="button" data-x5-action="empty-use" data-x5-bin-id="'+esc(b.id)+'">Leeren und danach verwenden</button>'
                +'</div>';
            }else if(st.key==='planned'){
              html+='<div class="notice">Die Mulde ist bereits in einem offenen Auftrag verplant und kann hier nicht übernommen werden.</div>'
                +'<button class="btn secondary" type="button" data-x5-action="close-select" style="margin-top:8px">Schließen / andere Mulde</button>';
            }else if(st.key==='reserved'){
              html+='<div class="notice">Diese Mulde ist für einen anderen Kunden/Zweck reserviert und wird hier nicht regulär freigegeben.</div>'
                +'<button class="btn secondary" type="button" data-x5-action="close-select" style="margin-top:8px">Schließen / andere Mulde</button>';
            }else{
              html+='<button class="btn primary" type="button" data-x3-action="take-current" data-x3-bin-id="'+esc(b.id)+'">Mulde übernehmen</button>';
              if(st.match)html+='<div class="small" style="margin-top:6px">Passende Reservierung für diesen Auftrag.</div>';
            }
            box.innerHTML=html;
            anchor.after(box);
          };

          document.addEventListener('click',function(e){
            const target=e.target?.closest?.('[data-x5-action]');
            if(!target)return;
            const action=String(target.getAttribute('data-x5-action')||'');
            e.preventDefault();e.stopPropagation();
            if(action==='close-select'){dpX5CloseBinDetails();return;}
            if(action==='empty-use'){dpX5StagePreEmpty(target.getAttribute('data-x5-bin-id'));return;}
          });

          function dpX5BuildEmptyOrder(target,p){
            const now=nowIso();
            return {
              id:uid(),
              date:target.date,
              driver:target.driver||'',
              vehicle:target.vehicle||'',
              seq:'',
              customerId:p.originCustomerId,
              siteId:p.originSiteId||null,
              task:'Leeren',
              count:1,
              bin1:p.type||'',bin2:'',bin3:'',binTypes:[p.type||''],
              material:p.material||'',
              drop:p.drop||'',
              billing:target.billing||'Pauschale',
              note:'Automatisch vorgeschaltet: Mulde '+p.number+' leeren, anschließend Verwendung im Folgeauftrag '+String(target.id)+'.',
              binNumbers:p.number,
              existingBinNumber:p.number,
              existingBinNumbers:[p.number],
              newBinNumber:'',newBinNumbers:[],
              actualBinNumbers:[],actualExistingBinNumbers:[],actualConfirmedAt:'',actualConfirmedBy:'',
              status:'Geplant',reason:'',reasonExtra:'',start:'',end:'',pause:'',lsNo:'',nonExecutionHistory:[],
              x5PreEmpty:true,
              x5TargetOrderId:target.id,
              x5SourceWarehouseId:p.sourceWarehouseId||'',
              x5PreparedBinNumber:p.number,
              createdAt:now,updatedAt:now
            };
          }

          function dpX5PlaceImmediatelyBefore(emptyOrder,target){
            if(!target?.date||!target?.driver||!target?.seq){
              emptyOrder.seq='';
              return;
            }
            const group=(state.orders||[])
              .filter(o=>o.id!==emptyOrder.id&&o.date===target.date&&o.driver===target.driver&&o.seq)
              .slice()
              .sort((a,b)=>(Number(a.seq)||999)-(Number(b.seq)||999)||Number(a.id||0)-Number(b.id||0));
            let idx=group.findIndex(o=>String(o.id)===String(target.id));
            if(idx<0)idx=group.length;
            group.splice(idx,0,emptyOrder);
            if(typeof dpDApplySequence==='function')dpDApplySequence(group);
            else group.forEach((o,i)=>o.seq=i+1);
          }

          // Erst beim erfolgreichen Speichern des Stellen-Auftrags wird der Leeren-Auftrag erzeugt.
          const dpX5BaseSaveOrder=saveOrder;
          saveOrder=async function(){
            const pending=dpX5PendingPreEmpty?{...dpX5PendingPreEmpty}:null;
            const editId=editingOrderId;
            const before=new Set((state.orders||[]).map(o=>String(o.id)));
            const r=await dpX5BaseSaveOrder.apply(this,arguments);
            if(!pending)return r;

            const target=editId?orderById(editId):(state.orders||[]).find(o=>!before.has(String(o.id)));
            if(!target)return r;
            const stillSelected=dpX5OrderHasBin(target,pending.number);
            if(target.task!=='Stellen'||!stillSelected){
              dpX5PendingPreEmpty=null;
              return r;
            }

            const existing=(state.orders||[]).find(o=>o.x5PreEmpty&&String(o.x5TargetOrderId)===String(target.id)&&String(o.x5PreparedBinNumber)===String(pending.number)&&!['Ausgeführt','Nicht ausgeführt','Storniert'].includes(o.status));
            if(!existing){
              const emptyOrder=dpX5BuildEmptyOrder(target,pending);
              state.orders.push(emptyOrder);
              dpX5PlaceImmediatelyBefore(emptyOrder,target);
              target.x5PreEmptyOrderId=emptyOrder.id;
              target.x5PreparedBinNumber=pending.number;
              target.updatedAt=nowIso();

              if(emptyOrder.driver&&typeof dp13IsDisposition==='function'&&dp13IsDisposition()&&typeof dpF3BaseAddNotice==='function'){
                dpF3BaseAddNotice(emptyOrder.driver,emptyOrder.id,'Neuer Auftrag','Automatisch vorgeschalteter Leeren-Auftrag für Mulde '+pending.number+'.');
              }
              await persist();
              try{renderPlanning()}catch(_){}
              try{renderOrders()}catch(_){}
              setTimeout(()=>alert('Leeren-Auftrag für Mulde '+pending.number+' wurde unmittelbar vor dem Stellen-Auftrag eingeplant.'),20);
            }else{
              target.x5PreEmptyOrderId=existing.id;
              target.x5PreparedBinNumber=pending.number;
              await persist();
            }
            dpX5PendingPreEmpty=null;
            return r;
          };

          // Bei der tatsächlichen Ausführung des automatisch vorgeschalteten Leeren-Auftrags
          // muss die Entleerung vom Fahrer ausdrücklich bestätigt sein.
          const dpX5BaseConfirmStatus=confirmStatus;
          confirmStatus=async function(){
            const o=orderById(currentOrderId);
            if(o?.x5PreEmpty&&pendingStatus==='Ausgeführt'&&!$('statusDisposed')?.checked){
              return alert('Bitte bestätigen: Inhalt tatsächlich entleert / entsorgt. Erst dann kann die Mulde für den Folgeauftrag freigegeben werden.');
            }
            return await dpX5BaseConfirmStatus.apply(this,arguments);
          };

          function dpX5MovementNumbers(o){
            if(Array.isArray(o?.actualBinNumbers)&&o.actualBinNumbers.length)return o.actualBinNumbers.map(String).filter(Boolean);
            const p=parsedBinNumbers(o?.binNumbers||'');
            if(p.length)return p.map(String);
            return [o?.existingBinNumber].map(String).filter(Boolean);
          }

          // Herkunft des Inhalts künftig am Bestand mitführen und den X5-Leeren-Auftrag
          // nach Ausführung als „leer / Auf Lager“ fortschreiben.
          const dpX5BaseApplyBinMovement=applyBinMovement;
          applyBinMovement=function(o){
            if(o?.x5PreEmpty){
              dpX5MovementNumbers(o).forEach((n,i)=>{
                const b=ensureBin(n,orderBinType(o,i));
                const from=locationText(b);
                const wid=String(b.warehouseId||o.x5SourceWarehouseId||'');
                Object.assign(b,{status:'Auf Lager',customerId:null,siteId:null,material:'',warehouseId:wid,contentCustomerId:null,contentSiteId:null,contentDrop:''});
                try{addMovement(b,o,'Leeren – vorgeschaltet',from,from||'Auf Lager')}catch(_){}
              });
              return;
            }

            const keepOrigin=!o?.disposed&&['Abholen','Tauschen'].includes(o?.task);
            const oldNums=o?.task==='Tauschen'
              ?(Array.isArray(o.actualExistingBinNumbers)&&o.actualExistingBinNumbers.length?o.actualExistingBinNumbers:[o.existingBinNumber])
              :dpX5MovementNumbers(o);
            dpX5BaseApplyBinMovement.apply(this,arguments);

            (oldNums||[]).map(String).filter(Boolean).forEach(n=>{
              const b=binByNumber(n);
              if(!b)return;
              if(keepOrigin&&dpX1BinMaterial(b)){
                b.contentCustomerId=o.customerId||b.contentCustomerId||null;
                b.contentSiteId=o.siteId||b.contentSiteId||null;
                b.contentDrop=o.drop||b.contentDrop||'';
              }else if(!dpX1BinMaterial(b)){
                b.contentCustomerId=null;b.contentSiteId=null;b.contentDrop='';
              }
            });
          };

          /* DP_X5_LEEREN_PASSENDE_RESERVIERUNG_END */
          """

          s=s.replace(end_marker,end_marker+"\n"+patch,1)
          p.write_text(s,encoding="utf-8",newline="\n")
          print("X5: passende Reservierung + vorgeschalteter Leeren-Auftrag eingefügt.")
          PY

          grep -q "DP_X5_LEEREN_PASSENDE_RESERVIERUNG_BEGIN" dispopilot-online-efd.html
          grep -q "Leeren und danach verwenden" dispopilot-online-efd.html
          grep -q "x5PreEmptyOrderId" dispopilot-online-efd.html
          grep -q "passend reserviert:" dispopilot-online-efd.html
          grep -q "Leeren – vorgeschaltet" dispopilot-online-efd.html

      - name: Apply X6 reservation and pre-empty draft repair
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path("dispopilot-online-efd.html")
          s=p.read_text(encoding="utf-8")
          end_marker="/* DP_X5_LEEREN_PASSENDE_RESERVIERUNG_END */"
          if s.count(end_marker)!=1:
              raise SystemExit(f"X6 abgebrochen: X5-Endmarker {s.count(end_marker)}x gefunden statt 1x.")
          if "DP_X6_RESERVIERUNG_LEEREN_ENTWURF_FIX_BEGIN" in s:
              raise SystemExit("X6 abgebrochen: Patch bereits vorhanden.")

          patch=r"""
          /* DP_X6_RESERVIERUNG_LEEREN_ENTWURF_FIX_BEGIN */
          // X6 repariert zwei Praxisfehler aus X5:
          // 1) Eine für den AKTUELLEN Kunden/die AKTUELLE Baustelle reservierte Mulde
          //    muss wie eine verwendbare Mulde behandelt und tatsächlich übernommen werden.
          // 2) Bei „Leeren und danach verwenden“ bleiben Datum/Fahrfolge/Fahrer/Fahrzeug
          //    und der gesamte laufende Stellen-Entwurf erhalten. Nach erfolgreichem Speichern
          //    landet der Benutzer wieder in der Planung statt in einer leeren Auftragsmaske.

          let dpX6ApprovedReservation=null;

          function dpX6SelectedCustomerId(){
            return String($('oCustomer')?.value||$('dpU2CustomerDropdownInput')?.dataset?.selectedValue||'');
          }
          function dpX6SelectedSiteId(){
            return String($('oSite')?.value||'');
          }
          function dpX6SameEntity(kind,a,b){
            const sa=String(a??''),sb=String(b??'');
            if(!sa||!sb)return false;
            if(sa===sb)return true;
            try{
              const ea=kind==='site'?site(a):customer(a);
              const eb=kind==='site'?site(b):customer(b);
              if(!ea||!eb)return false;
              const na=dpX5Norm(ea.name||''),nb=dpX5Norm(eb.name||'');
              if(na&&nb&&na===nb)return true;
              // Baustellen zusätzlich über Kunde + Namen absichern.
              if(kind==='site'){
                const ca=String(ea.customerId??ea.cid??''),cb=String(eb.customerId??eb.cid??'');
                return !!(na&&nb&&na===nb&&(!ca||!cb||ca===cb));
              }
            }catch(_){ }
            return false;
          }

          function dpX6ReservationMatches(b,ctx={}){
            if(!dpX1ReservationActive(b,ctx.date))return false;
            const rc=String(b?.reservationCustomerId||'');
            const rs=String(b?.reservationSiteId||'');
            const oc=String(ctx.customerId||dpX6SelectedCustomerId());
            const os=String(ctx.siteId||dpX6SelectedSiteId());

            if(rc&&!dpX6SameEntity('customer',rc,oc))return false;
            if(rs&&!dpX6SameEntity('site',rs,os))return false;
            if(rc||rs)return true;

            // Reservierungen ohne feste Kunden-/Baustellen-ID dürfen weiterhin
            // über den dokumentierten Zweck/Materialbezug passen.
            try{return dpX1ReservationMatches(b,oc,os,ctx.date,ctx.material||'')}catch(_){return false;}
          }

          // X6-Kontext liest immer die kanonische Kundenauswahl aus U2/oCustomer.
          dpX1PlanningContext=function(){
            return {
              date:dpX1OrderDate(),
              customerId:dpX6SelectedCustomerId(),
              siteId:dpX6SelectedSiteId(),
              material:$('oMaterial')?.value||$('oContent')?.value||'',
              excludeOrderId:editingOrderId||null
            };
          };
          dpX5ReservationMatchesStrong=dpX6ReservationMatches;

          // Zusätzliche Freigabe für den Speicherschutz: Wird eine passend reservierte
          // Mulde im Dropdown bewusst gewählt, darf dieselbe Reservierung beim Speichern
          // nicht anschließend wieder als „fremd reserviert“ blockiert werden.
          const dpX6BaseAvailability=dpX1Availability;
          dpX1Availability=function(b,ctx={}){
            const no=dpX1BinNumber(b);
            const clean=String(b?.status||'')==='Auf Lager'&&!dpX1BinMaterial(b)&&!dpX1PlannedElsewhere(no,ctx.excludeOrderId);
            if(clean&&dpX1ReservationActive(b,ctx.date)&&dpX6ReservationMatches(b,ctx)){
              return {kind:'preferred',reason:'passend reserviert: '+dpX1ReservationLabel(b)};
            }
            if(clean&&dpX6ApprovedReservation&&String(dpX6ApprovedReservation.number)===String(no)){
              const sameCustomer=!dpX6ApprovedReservation.customerId||dpX6SameEntity('customer',dpX6ApprovedReservation.customerId,ctx.customerId||dpX6SelectedCustomerId());
              const sameSite=!dpX6ApprovedReservation.siteId||dpX6SameEntity('site',dpX6ApprovedReservation.siteId,ctx.siteId||dpX6SelectedSiteId());
              if(sameCustomer&&sameSite)return {kind:'preferred',reason:'passend reserviert – bewusst ausgewählt'};
            }
            return dpX6BaseAvailability.call(this,b,ctx);
          };

          const dpX6BaseTakeBinById=dpX3TakeBinById;
          dpX3TakeBinById=function(id){
            const b=dpX3BinById(id);
            const ctx=dpX1PlanningContext();
            if(b&&dpX1ReservationActive(b,ctx.date)&&dpX6ReservationMatches(b,ctx)){
              dpX6ApprovedReservation={
                number:dpX1BinNumber(b),
                customerId:ctx.customerId||'',
                siteId:ctx.siteId||'',
                date:ctx.date||''
              };
            }
            return dpX6BaseTakeBinById.apply(this,arguments);
          };

          function dpX6CaptureOrderDraft(){
            const fields={};
            const root=$('orderModal')||document;
            root.querySelectorAll('input[id],select[id],textarea[id]').forEach(el=>{
              fields[el.id]={value:String(el.value??''),checked:!!el.checked,type:String(el.type||'')};
            });
            return {
              fields,
              editingOrderId:editingOrderId||null,
              customerId:dpX6SelectedCustomerId(),
              siteId:dpX6SelectedSiteId(),
              capturedAt:nowIso()
            };
          }

          function dpX6RestoreOrderDraft(draft){
            if(!draft?.fields)return;
            const count=draft.fields.oCount?.value;
            if(count&&$('oCount')){
              $('oCount').value=count;
              try{binCountChanged()}catch(_){ }
            }
            Object.entries(draft.fields).forEach(([id,v])=>{
              const el=$(id); if(!el)return;
              try{
                if(v.type==='checkbox'||v.type==='radio')el.checked=!!v.checked;
                else el.value=v.value;
              }catch(_){ }
            });
            if(draft.customerId&&$('oCustomer'))$('oCustomer').value=String(draft.customerId);
            if(draft.siteId&&$('oSite'))$('oSite').value=String(draft.siteId);
            try{dpU2SyncOrderCustomerCombo()}catch(_){ }
            try{dpX3RenderPlanningStock()}catch(_){ }
          }

          function dpX6DraftValue(draft,id,fallback=''){
            const v=draft?.fields?.[id]?.value;
            return v==null?fallback:String(v);
          }

          function dpX6ApplyCoreDraft(target,draft,pending){
            if(!target||!draft)return;
            const set=(key,id)=>{
              const v=dpX6DraftValue(draft,id,'');
              if(v!=='')target[key]=v;
            };
            set('date','oDate');
            set('driver','oDriver');
            set('vehicle','oVehicle');
            if(draft.customerId)target.customerId=draft.customerId;
            if(draft.siteId)target.siteId=draft.siteId;
            set('task','oTask');
            const seq=Number(dpX6DraftValue(draft,'oSeq','0'))||0;
            if(seq)target.seq=seq;
            if(pending?.number){
              const nums=parsedBinNumbers(target.binNumbers||'').map(String);
              if(!nums.includes(String(pending.number)))nums.push(String(pending.number));
              target.binNumbers=nums.join(', ');
            }
            target.updatedAt=nowIso();
          }

          function dpX6PlacePair(emptyOrder,target,desiredSeq){
            if(!emptyOrder||!target||!target.date||!target.driver)return;
            const others=(state.orders||[])
              .filter(o=>String(o.id)!==String(emptyOrder.id)&&String(o.id)!==String(target.id)&&o.date===target.date&&o.driver===target.driver&&o.seq)
              .slice()
              .sort((a,b)=>(Number(a.seq)||999)-(Number(b.seq)||999)||String(a.id).localeCompare(String(b.id)));
            let targetPos=Number(desiredSeq)||Number(target.seq)||others.length+2;
            if(targetPos<2)targetPos=2;
            targetPos=Math.min(targetPos,others.length+2);
            const emptyIndex=Math.max(0,targetPos-2);
            others.splice(emptyIndex,0,emptyOrder);
            others.splice(emptyIndex+1,0,target);
            if(typeof dpDApplySequence==='function')dpDApplySequence(others);
            else others.forEach((o,i)=>o.seq=i+1);
          }

          // Den Entwurf schon BEIM Klick auf „Leeren und danach verwenden“ sichern.
          const dpX6BaseStagePreEmpty=dpX5StagePreEmpty;
          dpX5StagePreEmpty=function(id){
            const draft=dpX6CaptureOrderDraft();
            const r=dpX6BaseStagePreEmpty.apply(this,arguments);
            if(dpX5PendingPreEmpty){
              dpX5PendingPreEmpty.draft=draft;
              setTimeout(()=>dpX6RestoreOrderDraft(draft),30);
            }
            return r;
          };

          // X5 erzeugt beide Aufträge. X6 erzwingt danach, dass der Stellen-Auftrag
          // wirklich die vorher gewählten Dispo-Daten behält und die Paar-Reihenfolge
          // unmittelbar Leeren -> Stellen lautet. Danach zurück in die Planung.
          const dpX6BaseSaveOrder=saveOrder;
          saveOrder=async function(){
            const pending=dpX5PendingPreEmpty?{...dpX5PendingPreEmpty}:null;
            const draft=pending?.draft||null;
            if(draft)dpX6RestoreOrderDraft(draft);
            const editId=editingOrderId;
            const before=new Set((state.orders||[]).map(o=>String(o.id)));
            const r=await dpX6BaseSaveOrder.apply(this,arguments);
            if(!pending)return r;

            const target=editId?orderById(editId):(state.orders||[]).find(o=>!before.has(String(o.id))&&!o.x5PreEmpty);
            if(!target)return r;
            dpX6ApplyCoreDraft(target,draft,pending);

            const empty=(state.orders||[]).find(o=>o.x5PreEmpty&&String(o.x5TargetOrderId)===String(target.id)&&String(o.x5PreparedBinNumber)===String(pending.number));
            if(empty){
              empty.date=target.date;
              empty.driver=target.driver||'';
              empty.vehicle=target.vehicle||'';
              empty.customerId=pending.originCustomerId;
              empty.siteId=pending.originSiteId||null;
              empty.material=pending.material||'';
              empty.binNumbers=String(pending.number||'');
              empty.existingBinNumber=String(pending.number||'');
              empty.updatedAt=nowIso();
              const desired=Number(dpX6DraftValue(draft,'oSeq',target.seq||0))||Number(target.seq)||0;
              dpX6PlacePair(empty,target,desired);
              target.x5PreEmptyOrderId=empty.id;
              target.x5PreparedBinNumber=pending.number;
            }
            await persist();
            try{closeM('orderModal')}catch(_){ }
            try{renderPlanning()}catch(_){ }
            try{renderOrders()}catch(_){ }
            setTimeout(()=>alert('Leeren-Auftrag und Stellen-Auftrag wurden mit den gewählten Fahrer-/Fahrzeug-/Fahrfolgedaten eingeplant.'),20);
            return r;
          };

          /* DP_X6_RESERVIERUNG_LEEREN_ENTWURF_FIX_END */
          """

          s=s.replace(end_marker,end_marker+"\n"+patch,1)
          p.write_text(s,encoding="utf-8",newline="\n")
          print("X6: passende Reservierung und Stellen-Entwurf beim vorgeschalteten Leeren repariert.")
          PY

          grep -q "DP_X6_RESERVIERUNG_LEEREN_ENTWURF_FIX_BEGIN" dispopilot-online-efd.html
          grep -q "passend reserviert – bewusst ausgewählt" dispopilot-online-efd.html
          grep -q "dpX6CaptureOrderDraft" dispopilot-online-efd.html
          grep -q "dpX6PlacePair" dispopilot-online-efd.html

      - name: Apply X7 stable reservation and pre-empty workflow repair
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path("dispopilot-online-efd.html")
          t=p.read_text(encoding="utf-8")
          end_marker="/* DP_X6_RESERVIERUNG_LEEREN_ENTWURF_FIX_END */"
          if t.count(end_marker)!=1:
              raise SystemExit(f"X7 abgebrochen: X6-Endmarker {t.count(end_marker)}x gefunden statt 1x.")
          if "DP_X7_RESERVIERUNG_LEEREN_STABIL_FIX_BEGIN" in t:
              raise SystemExit("X7 abgebrochen: Patch bereits vorhanden.")

          patch=r"""
          /* DP_X7_RESERVIERUNG_LEEREN_STABIL_FIX_BEGIN */
          // X7 ersetzt die zwei in X5/X6 noch instabilen Wege durch einen robusten
          // Planungs-Kontext, der VOR dem Öffnen einer Mulden-Detailansicht gesichert wird.
          // Damit bleiben Fahrer, Fahrzeug, Fahrfolge und alle anderen Eingaben erhalten.

          let dpX7PlanningDraft=null;
          let dpX7PreparedSave=null;

          function dpX7Text(v){return String(v??'').trim();}
          function dpX7Norm(v){return dpX5Norm?dpX5Norm(v):dpX7Text(v).toLocaleLowerCase('de');}

          function dpX7CustomerId(){
            return dpX7Text($('oCustomer')?.value||$('dpU2CustomerDropdownInput')?.dataset?.selectedValue||'');
          }
          function dpX7SiteId(){return dpX7Text($('oSite')?.value||'');}
          function dpX7CustomerNameById(id){
            try{return dpX7Text(customer(id)?.name||'')}catch(_){return ''}
          }
          function dpX7SiteNameById(id){
            try{return dpX7Text(site(id)?.name||'')}catch(_){return ''}
          }
          function dpX7CurrentCustomerName(){
            const id=dpX7CustomerId();
            const fromId=dpX7CustomerNameById(id);
            if(fromId)return fromId;
            const inp=$('dpU2CustomerDropdownInput');
            if(inp?.value)return dpX7Text(inp.value);
            const sel=$('oCustomer');
            return dpX7Text(sel?.options?.[sel.selectedIndex]?.textContent||'');
          }
          function dpX7CurrentSiteName(){
            const id=dpX7SiteId();
            const fromId=dpX7SiteNameById(id);
            if(fromId)return fromId;
            const sel=$('oSite');
            return dpX7Text(sel?.options?.[sel.selectedIndex]?.textContent||'');
          }

          function dpX7CaptureDraft(){
            const fields={};
            const root=$('orderModal')||document;
            root.querySelectorAll('input[id],select[id],textarea[id]').forEach(el=>{
              fields[el.id]={value:dpX7Text(el.value),checked:!!el.checked,type:dpX7Text(el.type)};
            });
            return {
              fields,
              editingOrderId:editingOrderId||null,
              customerId:dpX7CustomerId(),
              siteId:dpX7SiteId(),
              customerName:dpX7CurrentCustomerName(),
              siteName:dpX7CurrentSiteName(),
              capturedAt:nowIso()
            };
          }

          function dpX7DraftVal(d,id,fallback=''){
            const v=d?.fields?.[id]?.value;
            return v==null?fallback:String(v);
          }

          function dpX7RestoreDraft(d){
            if(!d?.fields)return;
            try{
              const count=dpX7DraftVal(d,'oCount','');
              if(count&&$('oCount')){
                $('oCount').value=count;
                try{binCountChanged()}catch(_){ }
              }
              Object.entries(d.fields).forEach(([id,v])=>{
                const el=$(id); if(!el)return;
                try{
                  if(v.type==='checkbox'||v.type==='radio')el.checked=!!v.checked;
                  else el.value=v.value;
                }catch(_){ }
              });
              if(d.customerId&&$('oCustomer'))$('oCustomer').value=String(d.customerId);
              if(d.siteId&&$('oSite'))$('oSite').value=String(d.siteId);
              try{dpU2SyncOrderCustomerCombo()}catch(_){ }
              try{dpX3RenderPlanningStock()}catch(_){ }
            }catch(e){console.warn('X7 Entwurf wiederherstellen:',e)}
          }

          function dpX7Ctx(){
            const liveCustomer=dpX7CustomerId();
            const liveSite=dpX7SiteId();
            const d=dpX7PlanningDraft;
            return {
              date:dpX7Text($('oDate')?.value||dpX7DraftVal(d,'oDate',dpX1OrderDate())),
              customerId:liveCustomer||dpX7Text(d?.customerId||''),
              siteId:liveSite||dpX7Text(d?.siteId||''),
              customerName:dpX7CurrentCustomerName()||dpX7Text(d?.customerName||''),
              siteName:dpX7CurrentSiteName()||dpX7Text(d?.siteName||''),
              material:dpX7Text($('oMaterial')?.value||$('oContent')?.value||dpX7DraftVal(d,'oMaterial',dpX7DraftVal(d,'oContent',''))),
              excludeOrderId:editingOrderId||d?.editingOrderId||null
            };
          }

          function dpX7EntityMatches(kind,reservedId,currentId,currentName){
            const ri=dpX7Text(reservedId),ci=dpX7Text(currentId);
            if(!ri)return true;
            if(ci&&ri===ci)return true;
            let rn='';
            try{rn=kind==='site'?dpX7SiteNameById(ri):dpX7CustomerNameById(ri)}catch(_){ }
            if(rn&&currentName&&dpX7Norm(rn)===dpX7Norm(currentName))return true;
            // Falls die Reservierung in älteren Beständen einmal als Klartext gespeichert wurde.
            if(currentName&&dpX7Norm(ri)===dpX7Norm(currentName))return true;
            return false;
          }

          function dpX7ReservationMatches(b,ctx=dpX7Ctx()){
            if(!b||!dpX1ReservationActive(b,ctx.date))return false;
            const rc=dpX7Text(b.reservationCustomerId||'');
            const rs=dpX7Text(b.reservationSiteId||'');
            if(rc&&!dpX7EntityMatches('customer',rc,ctx.customerId,ctx.customerName))return false;
            if(rs&&!dpX7EntityMatches('site',rs,ctx.siteId,ctx.siteName))return false;
            if(rc||rs)return true;
            try{return dpX1ReservationMatches(b,ctx.customerId,ctx.siteId,ctx.date,ctx.material||'')}catch(_){return false}
          }

          // Alle X1/X5/X6-Abfragen bekommen denselben stabilen Kontext.
          dpX1PlanningContext=function(){return dpX7Ctx();};
          dpX5ReservationMatchesStrong=function(b,ctx={}){return dpX7ReservationMatches(b,{...dpX7Ctx(),...ctx});};

          const dpX7BaseAvailability=dpX1Availability;
          dpX1Availability=function(b,ctx={}){
            const c={...dpX7Ctx(),...ctx};
            const no=dpX1BinNumber(b);
            // Beim X7-Speichern einer vollen, bewusst vorbereiteten Mulde darf der
            // X1-Schutz das Speichern nicht blockieren; die Leerung wird vorgeschaltet.
            if(dpX7PreparedSave&&String(dpX7PreparedSave.number)===String(no)&&String($('oTask')?.value||dpX7DraftVal(dpX7PreparedSave.draft,'oTask',''))==='Stellen'){
              return {kind:'preferred',reason:'Leeren-Auftrag wird unmittelbar vorgeschaltet'};
            }
            const clean=String(b?.status||'')==='Auf Lager'&&!dpX1BinMaterial(b)&&!dpX1PlannedElsewhere(no,c.excludeOrderId);
            if(clean&&dpX1ReservationActive(b,c.date)&&dpX7ReservationMatches(b,c)){
              return {kind:'preferred',reason:'passend reserviert: '+dpX1ReservationLabel(b)};
            }
            return dpX7BaseAvailability.call(this,b,c);
          };

          const dpX7BaseStatusInfo=dpX3StatusInfo;
          dpX3StatusInfo=function(b,ctx={}){
            const c={...dpX7Ctx(),...ctx};
            const no=dpX1BinNumber(b);
            const material=dpX1BinMaterial(b);
            const planned=dpX1PlannedElsewhere(no,c.excludeOrderId);
            if(material)return {key:'content',dot:'🟡',label:'Inhalt: '+material,direct:false};
            if(planned){
              const pc=customer(planned.customerId),ps=site(planned.siteId);
              return {key:'planned',dot:'🔴',label:'bereits geplant'+(pc?.name?' für '+pc.name:'')+(ps?.name?' / '+ps.name:''),direct:false};
            }
            if(dpX1ReservationActive(b,c.date)){
              if(dpX7ReservationMatches(b,c))return {key:'free',dot:'🟢',label:'passend reserviert: '+dpX1ReservationLabel(b),direct:true,match:true};
              return {key:'reserved',dot:'🟠',label:'reserviert für '+dpX1ReservationLabel(b),direct:false,match:false};
            }
            return dpX7BaseStatusInfo.call(this,b,c);
          };

          function dpX7SelectBin(b,draft=null){
            if(!b)return false;
            if(draft)dpX7RestoreDraft(draft);
            dpX1TakeBin(dpX1BinNumber(b),String(b.type||''));
            dpX3PlanningBinId=null;
            try{closeM('binModal')}catch(_){ }
            try{closeM('detailModal')}catch(_){ }
            setTimeout(()=>{if(draft)dpX7RestoreDraft(draft);try{dpX3RenderPlanningStock()}catch(_){ }},30);
            return true;
          }

          // Ganz wichtig: Entwurf schon sichern, BEVOR X3 die Detailansicht öffnet.
          document.addEventListener('click',function(e){
            const target=e.target?.closest?.('[data-x3-action]');
            if(!target)return;
            const action=String(target.getAttribute('data-x3-action')||'');
            const id=target.getAttribute('data-x3-bin-id');
            if(!id)return;
            const b=dpX3BinById(id);
            if(!b)return;
            if(String($('oTask')?.value||'')==='Stellen'&&(action==='details'||action==='take'||action==='take-current')){
              dpX7PlanningDraft=dpX7CaptureDraft();
              const st=dpX3StatusInfo(b,dpX7Ctx());
              // Passend reserviert wird unabhängig von einem evtl. noch alten X3-Button
              // direkt wie eine freie Mulde übernommen.
              if(!dpX1BinMaterial(b)&&st.match===true){
                e.preventDefault();e.stopImmediatePropagation();
                dpX7SelectBin(b,dpX7PlanningDraft);
              }
            }
          },true);

          // Eigene stabile Umsetzung: NICHT mehr X5/X6-Stage aufrufen, weil deren
          // Entwurf erst nach dem Öffnen der Detailansicht erfasst wurde.
          dpX5StagePreEmpty=function(id){
            const b=dpX3BinById(id);
            if(!b)return alert('Mulde wurde nicht gefunden.');
            const material=dpX1BinMaterial(b);
            if(!material)return alert('Diese Mulde hat keinen dokumentierten Inhalt und muss nicht geleert werden.');
            const draft=dpX7PlanningDraft||dpX7CaptureDraft();
            const task=dpX7DraftVal(draft,'oTask',$('oTask')?.value||'');
            if(task!=='Stellen')return alert('„Leeren und danach verwenden“ ist nur für einen Stellen-Auftrag vorgesehen.');
            const origin=dpX5ContentOrigin(b);
            if(!origin?.customerId){
              return alert('Der Kunde, zu dem der dokumentierte Inhalt gehört, konnte nicht sicher ermittelt werden. Bitte Muldenhistorie prüfen oder Leeren-Auftrag manuell anlegen.');
            }
            dpX5PendingPreEmpty={
              binId:b.id,
              number:dpX1BinNumber(b),
              type:String(b.type||''),
              material,
              sourceWarehouseId:String(b.warehouseId||''),
              originCustomerId:origin.customerId,
              originSiteId:origin.siteId||null,
              drop:origin.drop||'',
              stagedAt:nowIso(),
              draft
            };
            dpX7PreparedSave=dpX5PendingPreEmpty;
            dpX3PlanningBinId=null;
            try{closeM('binModal')}catch(_){ }
            try{closeM('detailModal')}catch(_){ }
            // Der vorhandene Auftrag bleibt vollständig erhalten. Mehrfaches Restore
            // fängt verzögerte Render-/Modal-Routinen der älteren Patches ab.
            setTimeout(()=>dpX7RestoreDraft(draft),0);
            setTimeout(()=>{
              dpX7RestoreDraft(draft);
              const bb=dpX3BinById(b.id);
              if(bb)dpX1TakeBin(dpX1BinNumber(bb),String(bb.type||''));
            },40);
            setTimeout(()=>dpX7RestoreDraft({...draft,fields:{...draft.fields,oBinNumber1:{value:String(dpX1BinNumber(b)),checked:false,type:'text'}}}),120);
            setTimeout(()=>alert('Mulde '+dpX1BinNumber(b)+' ist vorgemerkt. Beim Speichern wird automatisch ein Leeren-Auftrag unmittelbar davor erzeugt.'),140);
          };

          function dpX7ApplyDraftToOrder(o,d,p){
            if(!o||!d)return;
            const map=[['date','oDate'],['driver','oDriver'],['vehicle','oVehicle'],['task','oTask']];
            map.forEach(([key,id])=>{const v=dpX7DraftVal(d,id,'');if(v!=='')o[key]=v;});
            if(d.customerId)o.customerId=d.customerId;
            if(d.siteId)o.siteId=d.siteId;
            const seq=Number(dpX7DraftVal(d,'oSeq','0'))||0;if(seq)o.seq=seq;
            if(p?.number){
              const nums=parsedBinNumbers(o.binNumbers||'').map(String);
              if(!nums.includes(String(p.number)))nums.push(String(p.number));
              o.binNumbers=nums.join(', ');
            }
            o.updatedAt=nowIso();
          }

          // X7 übernimmt den vorbereiteten Leeren-Fall vollständig selbst. Während der
          // normale saveOrder läuft, wird pending vor X5/X6 verborgen, damit keine
          // doppelte oder alte Nachbearbeitung mehr eingreift.
          const dpX7BaseSaveOrder=saveOrder;
          saveOrder=async function(){
            const pending=dpX5PendingPreEmpty?{...dpX5PendingPreEmpty}:null;
            if(!pending)return await dpX7BaseSaveOrder.apply(this,arguments);
            const draft=pending.draft||dpX7PlanningDraft||dpX7CaptureDraft();
            dpX7RestoreDraft(draft);
            const b=binByNumber(String(pending.number||''));
            if(b)dpX1TakeBin(dpX1BinNumber(b),String(b.type||pending.type||''));
            const editId=editingOrderId;
            const before=new Set((state.orders||[]).map(o=>String(o.id)));
            dpX7PreparedSave={...pending,draft};
            // Alte X5/X6-Wrapper sehen keinen pending-Fall und können daher nichts leeren.
            dpX5PendingPreEmpty=null;
            let r;
            try{
              r=await dpX7BaseSaveOrder.apply(this,arguments);
            }finally{
              // X7 verarbeitet den Fall im Anschluss selbst.
            }
            const target=editId?orderById(editId):(state.orders||[]).find(o=>!before.has(String(o.id))&&!o.x5PreEmpty);
            if(!target){dpX7PreparedSave=null;return r;}
            dpX7ApplyDraftToOrder(target,draft,pending);

            let empty=(state.orders||[]).find(o=>o.x5PreEmpty&&String(o.x5TargetOrderId)===String(target.id)&&String(o.x5PreparedBinNumber)===String(pending.number));
            if(!empty){
              empty=dpX5BuildEmptyOrder(target,pending);
              state.orders.push(empty);
            }
            empty.date=target.date;
            empty.driver=target.driver||'';
            empty.vehicle=target.vehicle||'';
            empty.customerId=pending.originCustomerId;
            empty.siteId=pending.originSiteId||null;
            empty.material=pending.material||'';
            empty.binNumbers=String(pending.number||'');
            empty.existingBinNumber=String(pending.number||'');
            empty.updatedAt=nowIso();
            const desired=Number(dpX7DraftVal(draft,'oSeq',target.seq||0))||Number(target.seq)||0;
            dpX6PlacePair(empty,target,desired);
            target.x5PreEmptyOrderId=empty.id;
            target.x5PreparedBinNumber=pending.number;
            target.updatedAt=nowIso();
            if(empty.driver&&typeof dp13IsDisposition==='function'&&dp13IsDisposition()&&typeof dpF3BaseAddNotice==='function'){
              try{dpF3BaseAddNotice(empty.driver,empty.id,'Neuer Auftrag','Automatisch vorgeschalteter Leeren-Auftrag für Mulde '+pending.number+'.')}catch(_){ }
            }
            await persist();
            dpX5PendingPreEmpty=null;
            dpX7PreparedSave=null;
            dpX7PlanningDraft=null;
            try{closeM('orderModal')}catch(_){ }
            try{renderPlanning()}catch(_){ }
            try{renderOrders()}catch(_){ }
            setTimeout(()=>alert('Leeren-Auftrag und Stellen-Auftrag wurden vollständig eingeplant.'),20);
            return r;
          };

          /* DP_X7_RESERVIERUNG_LEEREN_STABIL_FIX_END */
          """

          t=t.replace(end_marker,end_marker+"\n"+patch,1)
          p.write_text(t,encoding="utf-8",newline="\n")
          print("X7: Reservierungsabgleich und Leeren-Workflow stabil neu verdrahtet.")
          PY

          grep -q "DP_X7_RESERVIERUNG_LEEREN_STABIL_FIX_BEGIN" dispopilot-online-efd.html
          grep -q "dpX7PlanningDraft" dispopilot-online-efd.html
          grep -q "dpX7ReservationMatches" dispopilot-online-efd.html
          grep -q "Alte X5/X6-Wrapper sehen keinen pending-Fall" dispopilot-online-efd.html

      - name: Apply X9B robust active Mulden workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path("dispopilot-online-efd.html")
          t=p.read_text(encoding="utf-8")
          if "DP_X9B_ACTIVE_MULDENAUSWAHL_BEGIN" in t:
              raise SystemExit("X9B abgebrochen: Patch bereits vorhanden.")
          marker="/* DP_X7_RESERVIERUNG_LEEREN_STABIL_FIX_END */"
          if t.count(marker)!=1:
              raise SystemExit(f"X9B abgebrochen: X7-Endmarker {t.count(marker)}x statt 1x vorhanden.")

          old_show="const show=$('oTask')?.value==='Stellen';"
          show_count=t.count(old_show)
          if show_count<1:
              raise SystemExit("X9B Sichtbarkeit: aktive Stellen-Sichtbarkeit nicht gefunden.")
          t=t.replace(old_show,"const show=['Stellen','Direktverladung'].includes(String($('oTask')?.value||''));")

          old_guard="if($('oTask')?.value==='Stellen'){"
          if old_guard in t:
              t=t.replace(old_guard,"if(['Stellen','Direktverladung'].includes(String($('oTask')?.value||''))){")

          old_empty="if(task!=='Stellen')return alert('„Leeren und danach verwenden“ ist nur für einen Stellen-Auftrag vorgesehen.');"
          if old_empty in t:
              t=t.replace(old_empty,"if(!['Stellen','Direktverladung'].includes(task))return alert('„Leeren und danach verwenden“ ist nur für Stellen oder Direktverladung vorgesehen.');")

          old_prepared="String($('oTask')?.value||dpX7DraftVal(dpX7PreparedSave.draft,'oTask',''))==='Stellen'"
          if old_prepared in t:
              t=t.replace(old_prepared,"['Stellen','Direktverladung'].includes(String($('oTask')?.value||dpX7DraftVal(dpX7PreparedSave.draft,'oTask','')))")

          x3_begin=t.find("/* DP_X3_MULDEN_DETAILS_DROPDOWN_BEGIN */")
          if x3_begin<0:
              raise SystemExit("X9B: X3-Basisblock nicht gefunden.")
          start=t.find("dpX3InstallPlanningActions=function(b){",x3_begin)
          end=t.find("\n          };",start)
          if end<0 and start>=0:
              end=t.find("\n};",start)
          if start<0 or end<0:
              raise SystemExit("X9B: aktive Mulden-Detailfunktion aus X3 nicht gefunden.")
          end=end+(len("\n          };") if t.startswith("\n          };",end) else len("\n};"))
          line_start=t.rfind("\n",0,start)+1
          indent=t[line_start:start]
          new_actions="""dpX3InstallPlanningActions=function(b){
            const old=$('dpX3PlanningActions');
            if(old)old.remove();
            if(!b||dpX3PlanningBinId==null||String(b.id)!==String(dpX3PlanningBinId))return;
            const anchor=$('dpX1BinExtra')||$('bWarehouseWrap')||$('bStatus')?.parentElement;
            if(!anchor)return;
            const ctx=dpX7Ctx();
            const st=dpX3StatusInfo(b,ctx);
            const no=dpX1BinNumber(b);
            const planned=dpX1PlannedElsewhere(no,ctx.excludeOrderId);
            const activeRes=dpX1ReservationActive(b,ctx.date);
            const matchingRes=activeRes&&dpX7ReservationMatches(b,ctx);
            const foreignRes=activeRes&&!matchingRes;
            const task=String($('oTask')?.value||dpX7DraftVal(dpX7PlanningDraft,'oTask','Stellen'));
            const box=document.createElement('div');
            box.id='dpX3PlanningActions';
            box.style.cssText='grid-column:1/-1;margin-top:12px;padding:10px;border:2px solid #d1d5db;border-radius:10px;background:#f8fafc';
            let html='<strong>Aus Auswahl „'+esc(task)+'“</strong><div class=\"small\" style=\"margin:4px 0 8px\">'+esc(st.dot+' '+st.label)+'</div>';
            if(st.key==='content'){
              html+='<div class=\"notice\">Diese Mulde ist gefüllt.</div>'
                +'<div class=\"row\" style=\"gap:8px;flex-wrap:wrap;margin-top:8px\">'
                +'<button class=\"btn secondary\" type=\"button\" data-x5-action=\"close-select\">Schließen / andere Mulde</button>'
                +'<button class=\"btn primary\" type=\"button\" data-x5-action=\"empty-use\" data-x5-bin-id=\"'+esc(b.id)+'\">Leeren und danach verwenden</button>'
                +'</div>';
            }else if(planned){
              const pc=customer(planned.customerId),ps=site(planned.siteId);
              const label=[planned.date,pc?.name,ps?.name,planned.seq?'Fahrfolge '+planned.seq:''].filter(Boolean).join(' · ');
              html+='<div class=\"notice\">Diese Mulde ist bereits für einen anderen offenen Auftrag vorgesehen'+(label?': '+esc(label):'')+'.</div>'
                +'<div class=\"row\" style=\"gap:8px;flex-wrap:wrap;margin-top:8px\">'
                +'<button class=\"btn secondary\" type=\"button\" data-x5-action=\"close-select\">Schließen / andere Mulde</button>'
                +'<button class=\"btn primary\" type=\"button\" data-x9b-action=\"override\" data-x9b-bin-id=\"'+esc(b.id)+'\">Trotzdem übernehmen</button>'
                +'</div><div class=\"small\" style=\"margin-top:6px\">Die bewusste Übersteuerung wird dokumentiert.</div>';
            }else if(foreignRes){
              html+='<div class=\"notice\">Diese Mulde ist für einen anderen Kunden/Zweck reserviert: '+esc(dpX1ReservationLabel(b))+'.</div>'
                +'<div class=\"row\" style=\"gap:8px;flex-wrap:wrap;margin-top:8px\">'
                +'<button class=\"btn secondary\" type=\"button\" data-x5-action=\"close-select\">Schließen / andere Mulde</button>'
                +'<button class=\"btn primary\" type=\"button\" data-x9b-action=\"override\" data-x9b-bin-id=\"'+esc(b.id)+'\">Trotzdem übernehmen</button>'
                +'</div><div class=\"small\" style=\"margin-top:6px\">Die bewusste Übersteuerung wird dokumentiert.</div>';
            }else{
              html+='<button class=\"btn primary\" type=\"button\" data-x3-action=\"take-current\" data-x3-bin-id=\"'+esc(b.id)+'\">Mulde übernehmen</button>';
              if(matchingRes)html+='<div class=\"small\" style=\"margin-top:6px\">Passende Reservierung für diesen Auftrag – regulär verwendbar.</div>';
            }
            box.innerHTML=html;
            anchor.after(box);
          };"""
          new_actions='\n'.join(indent+line if line else '' for line in new_actions.splitlines())
          t=t[:start]+new_actions+t[end:]

          x9b=r'''
          /* DP_X9B_ACTIVE_MULDENAUSWAHL_BEGIN */
          let dpX9aPendingOverrides={};
          function dpX9aUser(){return {name:String(state?.user?.name||state?.user?.displayName||state?.user?.email||'Unbekannt'),role:String(state?.user?.role||state?.role||'')};}
          function dpX9aConflict(b){const ctx=dpX7Ctx(),no=dpX1BinNumber(b);const planned=dpX1PlannedElsewhere(no,ctx.excludeOrderId);const active=dpX1ReservationActive(b,ctx.date);const match=active&&dpX7ReservationMatches(b,ctx);return {ctx,no,planned,foreignReservation:active&&!match};}

          document.addEventListener('click',function(e){
            const target=e.target?.closest?.('[data-x3-action]');
            if(!target)return;
            const task=String($('oTask')?.value||'');
            if(!['Stellen','Direktverladung'].includes(task))return;
            const action=String(target.getAttribute('data-x3-action')||'');
            if(!['details','take','take-current'].includes(action))return;
            dpX7PlanningDraft=dpX7CaptureDraft();
          },true);

          const dpX9aBaseSelectBin=dpX7SelectBin;
          dpX7SelectBin=function(b,draft=null){
            if(!b)return false;
            const base=draft||dpX7PlanningDraft||dpX7CaptureDraft();
            if(base)dpX7RestoreDraft(base);
            dpX1TakeBin(dpX1BinNumber(b),String(b.type||''));
            const kept=dpX7CaptureDraft();
            dpX7PlanningDraft=kept;
            dpX3PlanningBinId=null;
            try{closeM('binModal')}catch(_){ }
            try{closeM('detailModal')}catch(_){ }
            setTimeout(()=>{try{dpX7RestoreDraft(kept)}catch(_){ } try{dpX3RenderPlanningStock()}catch(_){ }},30);
            return true;
          };

          function dpX9aOverrideTake(id){
            const b=dpX3BinById(id);if(!b)return alert('Mulde wurde nicht gefunden.');
            if(dpX1BinMaterial(b))return alert('Diese Mulde ist gefüllt. Bitte „Leeren und danach verwenden“ wählen.');
            const c=dpX9aConflict(b),reasons=[];
            if(c.planned){const pc=customer(c.planned.customerId),ps=site(c.planned.siteId);reasons.push('bereits geplant'+(pc?.name?' für '+pc.name:'')+(ps?.name?' / '+ps.name:''));}
            if(c.foreignReservation)reasons.push('reserviert für '+dpX1ReservationLabel(b));
            if(!reasons.length)return dpX7SelectBin(b,dpX7PlanningDraft||dpX7CaptureDraft());
            if(!confirm('Mulde '+c.no+' ist '+reasons.join(' und ')+'.\n\nTrotzdem übernehmen? Diese Entscheidung wird dokumentiert.'))return;
            const u=dpX9aUser();
            dpX9aPendingOverrides[String(c.no)]={binId:b.id,binNumber:c.no,at:nowIso(),by:u.name,role:u.role,reason:reasons.join(' | '),previousOrderId:c.planned?.id??null,previousOrderDate:c.planned?.date||'',previousCustomerId:c.planned?.customerId??null,previousSiteId:c.planned?.siteId??null,reservationLabel:c.foreignReservation?dpX1ReservationLabel(b):'',customerId:c.ctx.customerId||null,siteId:c.ctx.siteId||null,task:String($('oTask')?.value||'')};
            dpX7SelectBin(b,dpX7PlanningDraft||dpX7CaptureDraft());
          }
          document.addEventListener('click',function(e){const el=e.target?.closest?.('[data-x9b-action="override"]');if(!el)return;e.preventDefault();e.stopImmediatePropagation();dpX9aOverrideTake(el.getAttribute('data-x9b-bin-id'));},true);

          const dpX9aBaseAvailability=dpX1Availability;
          dpX1Availability=function(b,ctx={}){const no=String(dpX1BinNumber(b)||'');if(dpX9aPendingOverrides[no]&&dpX1SelectedNumbers().map(String).includes(no))return {kind:'preferred',reason:'bewusst übernommen – Konflikt dokumentiert'};return dpX9aBaseAvailability.call(this,b,ctx);};

          const dpX9aBaseSaveOrder=saveOrder;
          saveOrder=async function(){
            const overrides=Object.values(dpX9aPendingOverrides||{}),editId=editingOrderId,before=new Set((state.orders||[]).map(o=>String(o.id)));
            const r=await dpX9aBaseSaveOrder.apply(this,arguments);if(!overrides.length)return r;
            const target=editId?orderById(editId):(state.orders||[]).find(o=>!before.has(String(o.id))&&!o.x5PreEmpty);
            if(target){const recs=overrides.map(x=>({...x,newOrderId:target.id,recordedAt:nowIso()}));target.binOverrideHistory=[...(Array.isArray(target.binOverrideHistory)?target.binOverrideHistory:[]),...recs];target.updatedAt=nowIso();recs.forEach(rec=>{const b=binByNumber(String(rec.binNumber||''));if(b)b.overrideHistory=[...(Array.isArray(b.overrideHistory)?b.overrideHistory:[]),rec];});await persist();}
            dpX9aPendingOverrides={};return r;
          };
          /* DP_X9B_ACTIVE_MULDENAUSWAHL_END */
          '''
          t=t.replace(marker,marker+"\n"+x9b,1)
          p.write_text(t,encoding="utf-8",newline="\n")
          print(f"X9B: aktive Muldenlogik robust angepasst; Sichtbarkeitsmuster {show_count}x erweitert.")
          PY

          grep -q "DP_X9B_ACTIVE_MULDENAUSWAHL_BEGIN" dispopilot-online-efd.html
          grep -q "Trotzdem übernehmen" dispopilot-online-efd.html
          grep -q "Passende Reservierung für diesen Auftrag – regulär verwendbar" dispopilot-online-efd.html
          grep -q "dpX9aBaseSelectBin" dispopilot-online-efd.html

      - name: Apply X9C Mulden type and duplicate guards
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path("dispopilot-online-efd.html")
          t=p.read_text(encoding="utf-8")
          if "DP_X9C_MULDENTYP_DOPPELTE_MULDE_BEGIN" in t:
              raise SystemExit("X9C abgebrochen: Patch bereits vorhanden.")
          marker="/* DP_X9B_ACTIVE_MULDENAUSWAHL_END */"
          if t.count(marker)!=1:
              raise SystemExit(f"X9C abgebrochen: X9B-Endmarker {t.count(marker)}x statt 1x vorhanden.")

          x9c=r'''
          /* DP_X9C_MULDENTYP_DOPPELTE_MULDE_BEGIN */
          // X9C setzt zwei Integritätsregeln zentral durch:
          // 1) dieselbe Mulde darf innerhalb eines Auftrags nur einmal vorkommen;
          // 2) die reale Muldenart aus dem Muldenstamm muss zur vorgesehenen
          //    Muldenart der jeweiligen Auftragsposition passen.
          // Die Prüfung gilt für freie/grüne, reservierte/gelbe bzw. orange,
          // gefüllte Mulden ("Leeren und danach verwenden"), Override und Handeingabe.

          function dpX9cText(v){return String(v??'').trim();}
          function dpX9cTypeKey(v){return dpX9cText(v).toLocaleLowerCase('de').replace(/\s+/g,' ');}
          function dpX9cCount(){return Math.max(1,Math.min(10,Number($('oCount')?.value||1)));}
          function dpX9cTask(){return dpX9cText($('oTask')?.value||'');}

          function dpX9cNumberAt(i){return dpX9cText($('oBinNumber'+i)?.value||'');}
          function dpX9cExpectedTypeAt(i){
            const direct=$('oBinType'+i);
            if(direct)return dpX9cText(direct.value||'');
            if(['Stellen','Liefern','Tauschen','Direktverladung'].includes(dpX9cTask())){
              const legacy=i===1?$('oBin1'):i===2?$('oBin2'):i===3?$('oBin3'):null;
              return dpX9cText(legacy?.value||'');
            }
            return '';
          }

          function dpX9cSelectedEntries(){
            const out=[];
            for(let i=1;i<=dpX9cCount();i++){
              const number=dpX9cNumberAt(i);
              if(number)out.push({index:i,number,expectedType:dpX9cExpectedTypeAt(i)});
            }
            return out;
          }

          function dpX9cDuplicateMessage(number,firstIndex,secondIndex){
            return 'Mulde '+number+' ist im selben Auftrag bereits bei Mulde '+firstIndex+' eingetragen. '+
              'Dieselbe Mulde darf nicht mehrfach zugeordnet werden.';
          }

          function dpX9cTypeMessage(number,actualType,expectedType,index){
            return 'Mulde '+number+' ist im Muldenstamm Typ '+(actualType||'unbekannt')+'. '+
              'Für Mulde '+index+' ist Typ '+(expectedType||'offen')+' vorgesehen. '+
              'Bitte eine passende Mulde wählen.';
          }

          function dpX9cFindFreeSlot(number,actualType){
            const no=dpX9cText(number),actual=dpX9cText(actualType);
            if(!no)return {ok:false,message:'Keine Muldennummer vorhanden.'};

            const selected=dpX9cSelectedEntries();
            const duplicate=selected.find(x=>x.number===no);
            if(duplicate)return {ok:false,message:'Mulde '+no+' ist in diesem Auftrag bereits als Mulde '+duplicate.index+' ausgewählt. Dieselbe Mulde darf nicht zweimal verwendet werden.'};

            if(!actual)return {ok:false,message:'Für Mulde '+no+' ist im Muldenstamm kein Muldentyp hinterlegt. Eine Typprüfung ist deshalb nicht möglich.'};

            const empty=[];
            for(let i=1;i<=dpX9cCount();i++){
              if(dpX9cNumberAt(i))continue;
              empty.push({index:i,expectedType:dpX9cExpectedTypeAt(i)});
            }
            if(!empty.length)return {ok:false,message:'Alle vorgesehenen Muldenpositionen sind bereits belegt.'};

            const match=empty.find(x=>!x.expectedType||dpX9cTypeKey(x.expectedType)===dpX9cTypeKey(actual));
            if(!match){
              const expected=[...new Set(empty.map(x=>x.expectedType).filter(Boolean))];
              return {ok:false,message:'Mulde '+no+' ist Typ '+actual+'. In den noch freien Positionen ist '+(expected.length?'Typ '+expected.join(' / '):'kein passender Muldentyp')+' vorgesehen.'};
            }
            return {ok:true,index:match.index,expectedType:match.expectedType,actualType:actual};
          }

          function dpX9cValidateIndex(index){
            const no=dpX9cNumberAt(index);
            if(!no)return {ok:true};

            for(let i=1;i<=dpX9cCount();i++){
              if(i===index)continue;
              if(dpX9cNumberAt(i)===no)return {ok:false,message:dpX9cDuplicateMessage(no,Math.min(i,index),Math.max(i,index))};
            }

            const b=binByNumber(no);
            if(!b)return {ok:false,message:'Mulde '+no+' ist im Muldenbestand nicht vorhanden. Der Muldentyp kann deshalb nicht geprüft werden. Bitte eine vorhandene Mulde wählen bzw. den Muldenstamm prüfen.'};
            const actual=dpX9cText(b.type||'');
            if(!actual)return {ok:false,message:'Für Mulde '+no+' ist im Muldenstamm kein Muldentyp hinterlegt. Bitte zuerst den Muldenstamm korrigieren.'};

            const expected=dpX9cExpectedTypeAt(index);
            if(expected&&dpX9cTypeKey(actual)!==dpX9cTypeKey(expected))return {ok:false,message:dpX9cTypeMessage(no,actual,expected,index)};
            return {ok:true,bin:b,actualType:actual,expectedType:expected};
          }

          function dpX9cValidateAll(){
            const seen=new Map();
            for(let i=1;i<=dpX9cCount();i++){
              const no=dpX9cNumberAt(i);
              if(!no)continue;
              if(seen.has(no))return {ok:false,message:dpX9cDuplicateMessage(no,seen.get(no),i)};
              seen.set(no,i);
              const r=dpX9cValidateIndex(i);
              if(!r.ok)return r;
            }
            return {ok:true};
          }

          dpX1TakeBin=function(number,type){
            const no=dpX9cText(number);
            const b=binByNumber(no);
            const actual=dpX9cText(b?.type||type||'');
            const check=dpX9cFindFreeSlot(no,actual);
            if(!check.ok){alert(check.message);return false;}

            const input=$('oBinNumber'+check.index);
            if(!input){alert('Muldenposition '+check.index+' konnte nicht gefunden werden.');return false;}
            const typEl=$('oBinType'+check.index)||(check.index===1?$('oBin1'):check.index===2?$('oBin2'):check.index===3?$('oBin3'):null);
            input.value=no;
            if(typEl&&!dpX9cText(typEl.value||'')&&actual)typEl.value=actual;
            input.dispatchEvent(new Event('input',{bubbles:true}));
            try{dpX1RenderPlanningStock()}catch(_){ }
            try{dpX3RenderPlanningStock()}catch(_){ }
            return true;
          };

          dpX7SelectBin=function(b,draft=null){
            if(!b)return false;
            const base=draft||dpX7PlanningDraft||dpX7CaptureDraft();
            if(base)dpX7RestoreDraft(base);
            const ok=dpX1TakeBin(dpX1BinNumber(b),dpX9cText(b.type||''));
            if(ok!==true){
              try{dpX7PlanningDraft=dpX7CaptureDraft()}catch(_){ }
              return false;
            }
            const kept=dpX7CaptureDraft();
            dpX7PlanningDraft=kept;
            dpX3PlanningBinId=null;
            try{closeM('binModal')}catch(_){ }
            try{closeM('detailModal')}catch(_){ }
            setTimeout(()=>{try{dpX7RestoreDraft(kept)}catch(_){ } try{dpX3RenderPlanningStock()}catch(_){ }},30);
            return true;
          };

          if(typeof dpX9aOverrideTake==='function'){
            const dpX9cBaseOverrideTake=dpX9aOverrideTake;
            dpX9aOverrideTake=function(id){
              const b=dpX3BinById(id);
              if(!b)return alert('Mulde wurde nicht gefunden.');
              const check=dpX9cFindFreeSlot(dpX1BinNumber(b),dpX9cText(b.type||''));
              if(!check.ok)return alert(check.message);
              return dpX9cBaseOverrideTake.apply(this,arguments);
            };
          }

          if(typeof dpX5StagePreEmpty==='function'){
            const dpX9cBaseStagePreEmpty=dpX5StagePreEmpty;
            dpX5StagePreEmpty=function(id){
              const b=dpX3BinById(id);
              if(!b)return alert('Mulde wurde nicht gefunden.');
              const check=dpX9cFindFreeSlot(dpX1BinNumber(b),dpX9cText(b.type||''));
              if(!check.ok)return alert(check.message);
              return dpX9cBaseStagePreEmpty.apply(this,arguments);
            };
          }

          document.addEventListener('change',function(e){
            const id=dpX9cText(e?.target?.id||'');
            let m=id.match(/^oBinNumber(\d+)$/);
            if(!m)m=id.match(/^oBinType(\d+)$/);
            if(!m)return;
            const index=Number(m[1]);
            if(index<1||index>dpX9cCount())return;
            const r=dpX9cValidateIndex(index);
            if(!r.ok){setTimeout(()=>alert(r.message),0);}
          });

          const dpX9cBaseSaveOrder=saveOrder;
          saveOrder=async function(){
            const check=dpX9cValidateAll();
            if(!check.ok){alert(check.message);return false;}
            return await dpX9cBaseSaveOrder.apply(this,arguments);
          };

          /* DP_X9C_MULDENTYP_DOPPELTE_MULDE_END */
          '''
          t=t.replace(marker,marker+"\n"+x9c,1)
          p.write_text(t,encoding="utf-8",newline="\n")
          print("X9C: Muldentyp- und Doppelprüfung für Auswahl, Override, Leeren und Handeingabe eingefügt.")
          PY

          grep -q "DP_X9C_MULDENTYP_DOPPELTE_MULDE_BEGIN" dispopilot-online-efd.html
          grep -q "dpX9cValidateAll" dispopilot-online-efd.html
          grep -q "Dieselbe Mulde darf nicht zweimal verwendet werden" dispopilot-online-efd.html
          grep -q "Der Muldentyp kann deshalb nicht geprüft werden" dispopilot-online-efd.html

      - name: Apply X9D new order button in Aufträge
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path("dispopilot-online-efd.html")
          t=p.read_text(encoding="utf-8")
          if "DP_X9D_NEUER_AUFTRAG_AUFTRAEGE_BEGIN" in t:
              raise SystemExit("X9D abgebrochen: Patch bereits vorhanden.")

          orders_start=t.find('<section id="orders" class="screen">')
