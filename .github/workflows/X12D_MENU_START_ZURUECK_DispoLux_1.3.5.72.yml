              selectedDate=planningDate;
            }
          }
          /* DP_X9D_NEUER_AUFTRAG_AUFTRAEGE_END */
          '''
          t=t.replace(marker,marker+"\n"+patch,1)
          p.write_text(t,encoding="utf-8",newline="\n")
          print("X9D: Neuer-Auftrag-Button im Modul Aufträge für Admin, Disponent und Fahrer wiederhergestellt.")
          PY

          grep -q "DP_X9D_NEUER_AUFTRAG_AUFTRAEGE_BEGIN" dispopilot-online-efd.html
          grep -q "function dpX9dNewOrderFromOrders" dispopilot-online-efd.html
          grep -q 'onclick="dpX9dNewOrderFromOrders()">＋ Neuer Auftrag</button>' dispopilot-online-efd.html
          grep -q 'title="Neuen Auftrag für den angezeigten Tag anlegen"' dispopilot-online-efd.html

      - name: Apply X10 remarks and rapport separation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('dispopilot-online-efd.html')
          if not p.exists():
              raise SystemExit('X10F2 abgebrochen: dispopilot-online-efd.html wurde von X9D nicht erzeugt.')

          t = p.read_text(encoding='utf-8')
          marker = '/* DP13_PATCH_END */'
          if t.count(marker) != 1:
              raise SystemExit(f'X10F2 abgebrochen: DP13-Endmarker {t.count(marker)}x gefunden statt 1x.')
          if 'DP_X10_BEMERKUNGEN_RAPPORT_BEGIN' in t:
              raise SystemExit('X10F2 abgebrochen: Patch bereits vorhanden.')

          patch = r'''
          /* DP_X10_BEMERKUNGEN_RAPPORT_BEGIN */
          // X10 trennt operative Hinweise, interne Kundeninformationen und
          // die Rapport-/Abschlussbemerkung konsequent voneinander.

          function dpX10Text(v){return String(v??'').trim();}
          function dpX10Own(obj,key){return !!obj&&Object.prototype.hasOwnProperty.call(obj,key);}
          function dpX10PlanningNote(o){
            if(!o)return '';
            if(dpX10Own(o,'planningNote'))return dpX10Text(o.planningNote||'');
            // Bei Altaufträgen, die bereits vor X10 ausgeführt wurden, ist o.note
            // nach der alten Logik die damalige Abschluss-/Rapportbemerkung. Die
            // ursprüngliche Planungsbemerkung lässt sich dort nicht sicher rekonstruieren.
            if(String(o.status||'')==='Ausgeführt')return '';
            return dpX10Text(o.note||'');
          }
          function dpX10CompletionNote(o){
            if(!o)return '';
            if(dpX10Own(o,'completionNote'))return dpX10Text(o.completionNote||'');
            // Historische, bereits vor X10 ausgeführte Aufträge behalten ihren
            // bisherigen Rapportinhalt. Für noch nicht ausgeführte Aufträge wird
            // dagegen niemals die Planungsbemerkung als Abschlussbemerkung benutzt.
            return String(o.status||'')==='Ausgeführt'?dpX10Text(o.note||''):'';
          }

          // ------------------------------------------------------------
          // 1) KUNDE: Allgemeine Bemerkung + Interne Bemerkung / nur Büro
          // ------------------------------------------------------------
          function dpX10InstallCustomerNotes(){
            const modal=$('customerModal');
            if(!modal||$('dpX10CustomerNotes'))return;
            const saveBtn=Array.from(modal.querySelectorAll('button')).find(
              b=>String(b.textContent||'').trim()==='Speichern'
            );
            if(!saveBtn)return;

            const wrap=document.createElement('div');
            wrap.id='dpX10CustomerNotes';
            wrap.style.marginTop='12px';
            wrap.innerHTML=
              '<div style="margin-bottom:10px">'
              +'<label>Allgemeine Bemerkung</label>'
              +'<textarea id="cGeneralNote" placeholder="z. B. Kunde vorher telefonisch avisieren"></textarea>'
              +'<div class="small" style="margin-top:4px">Operativer Hinweis – darf dem Fahrer beim Auftrag angezeigt werden.</div>'
              +'</div>'
              +'<div>'
              +'<label>Interne Bemerkung / nur Büro</label>'
              +'<textarea id="cOfficeNote" placeholder="z. B. nur gegen Vorkasse"></textarea>'
              +'<div class="small" style="margin-top:4px"><strong>Nur Büro/Disposition.</strong> Wird niemals in der Fahreransicht angezeigt.</div>'
              +'</div>';
            saveBtn.before(wrap);
          }

          const dpX10BaseOpenCustomer=openCustomer;
          openCustomer=function(id=null){
            dpX10InstallCustomerNotes();
            const r=dpX10BaseOpenCustomer.apply(this,arguments);
            const c=id?customer(id):null;
            if($('cGeneralNote'))$('cGeneralNote').value=c?.generalNote||'';
            if($('cOfficeNote')){
              // Datenschutzfreundliche Migration: Ein eventuell vorhandenes altes,
              // nicht klassifiziertes Kunden-note wird NIE automatisch Fahrerhinweis.
              // Es erscheint zunächst nur im internen Bürofeld.
              $('cOfficeNote').value=c
                ?(dpX10Own(c,'officeNote')?(c.officeNote||''):(c.note||''))
                :'';
            }
            return r;
          };

          const dpX10BaseSaveCustomer=saveCustomer;
          saveCustomer=async function(){
            dpX10InstallCustomerNotes();
            const editId=editingCustomerId;
            const before=new Set((state.customers||[]).map(c=>String(c.id)));
            const general=dpX10Text($('cGeneralNote')?.value||'');
            const office=dpX10Text($('cOfficeNote')?.value||'');
            const r=await dpX10BaseSaveCustomer.apply(this,arguments);
            const saved=editId?customer(editId):(state.customers||[]).find(c=>!before.has(String(c.id)));
            if(saved){
              saved.generalNote=general;
              saved.officeNote=office;
              saved.updatedAt=nowIso();
              await persist();
            }
            return r;
          };

          // ------------------------------------------------------------
          // 2) BAUSTELLE: eigener Fahrer-/Auftragshinweis
          // ------------------------------------------------------------
          function dpX10InstallSiteNote(){
            const modal=$('siteModal');
            if(!modal||$('dpX10SiteNote'))return;
            const saveBtn=Array.from(modal.querySelectorAll('button')).find(
              b=>String(b.textContent||'').trim()==='Speichern'
            );
            if(!saveBtn)return;
            const wrap=document.createElement('div');
            wrap.id='dpX10SiteNote';
            wrap.style.marginTop='12px';
            wrap.innerHTML=
              '<label>Bemerkung / Fahrerhinweis</label>'
              +'<textarea id="sNote" placeholder="z. B. Zufahrt über Tor 3"></textarea>'
              +'<div class="small" style="margin-top:4px">Wird bei Aufträgen dieser Baustelle im gemeinsamen Hinweisfeld angezeigt.</div>';
            saveBtn.before(wrap);
          }

          const dpX10BaseOpenSite=openSite;
          openSite=function(id=null){
            dpX10InstallSiteNote();
            const r=dpX10BaseOpenSite.apply(this,arguments);
            const s=id?site(id):null;
            if($('sNote'))$('sNote').value=s?.note||'';
            return r;
          };

          const dpX10BaseSaveSite=saveSite;
          saveSite=async function(){
            dpX10InstallSiteNote();
            const editId=editingSiteId;
            const before=new Set((state.sites||[]).map(s=>String(s.id)));
            const note=dpX10Text($('sNote')?.value||'');
            const r=await dpX10BaseSaveSite.apply(this,arguments);
            const saved=editId?site(editId):(state.sites||[]).find(s=>!before.has(String(s.id)));
            if(saved){
              saved.note=note;
              saved.updatedAt=nowIso();
              await persist();
            }
            return r;
          };

          // ------------------------------------------------------------
          // 3) FAHRER-/AUSFÜHRUNGSANSICHT: EIN gemeinsamer Hinweis-Kasten
          // ------------------------------------------------------------
          function dpX10OrderBinNumbers(o){
            const all=[];
            const add=v=>{
              if(Array.isArray(v)){v.forEach(add);return;}
              dpX10Text(v).split(/[;,/]+/).forEach(part=>{
                const raw=dpX10Text(part);
                if(!raw)return;
                const found=typeof parsedBinNumbers==='function'?parsedBinNumbers(raw):[];
                if(found.length)found.forEach(n=>all.push(String(n)));
                else if(/^\d+[A-Za-z]?$/.test(raw))all.push(raw);
              });
            };
            add(o?.actualBinNumbers);
            add(o?.actualExistingBinNumbers);
            add(o?.newBinNumbers);
            add(o?.existingBinNumbers);
            add(o?.binNumbers);
            add(o?.newBinNumber);
            add(o?.existingBinNumber);
            return [...new Set(all.map(String).filter(Boolean))];
          }

          function dpX10Entries(o){
            const out=[];
            const push=(label,value)=>{
              const text=dpX10Text(value);
              if(text)out.push({label,text});
            };
            const c=o?customer(o.customerId):null;
            const s=o?site(o.siteId):null;

            push('Auftrag',dpX10PlanningNote(o));
            push('Baustelle',s?.note||'');
            // Absichtlich ausschließlich generalNote. officeNote und ein altes
            // unspezifiziertes c.note sind für Fahrer tabu.
            push('Kunde',c?.generalNote||'');

            dpX10OrderBinNumbers(o).forEach(number=>{
              const b=typeof binByNumber==='function'?binByNumber(number):null;
              push('Mulde '+number,b?.note||'');
            });
            return out;
          }

          function dpX10RenderDriverNotes(orderId){
            const body=$('detailBody');
            const o=orderById(orderId);
            if(!body||!o)return;
            body.querySelector('.dpX10NotesCard')?.remove();

            const entries=dpX10Entries(o);
            if(!entries.length)return;

            const card=document.createElement('div');
            card.className='card dpX10NotesCard';
            card.style.marginBottom='10px';
            card.innerHTML=
              '<strong>Bemerkungen / Hinweise</strong>'
              +'<div style="margin-top:7px;display:grid;gap:6px">'
              +entries.map(x=>
                '<div><strong>'+esc(x.label)+':</strong> '+esc(x.text)+'</div>'
              ).join('')
              +'</div>';

            const address=body.querySelector('.dpK1BAddressButtonCard,.dpK1SiteAddressCard');
            if(address)address.after(card);else body.prepend(card);
          }

          const dpX10BaseOpenDetail=openDetail;
          openDetail=function(id){
            const r=dpX10BaseOpenDetail.apply(this,arguments);
            setTimeout(()=>dpX10RenderDriverNotes(id),0);
            return r;
          };

          // ------------------------------------------------------------
          // 4) ABSCHLUSSBEMERKUNG: eigenes Feld statt o.note zu überschreiben
          // ------------------------------------------------------------
          const dpX10BaseSetStatus=setStatus;
          setStatus=function(s){
            const r=dpX10BaseSetStatus.apply(this,arguments);
            const o=orderById(currentOrderId);
            if(s==='Ausgeführt'&&o&&$('statusNote')){
              // Erst beim Auftrag abschließen ist dies die Rapportbemerkung.
              $('statusNote').value=dpX10CompletionNote(o);
              const label=$('statusNote')?.previousElementSibling;
              if(label&&label.tagName==='LABEL')label.textContent='Bemerkung zum Abschluss / Rapport';
            }
            return r;
          };

          const dpX10BaseConfirmStatus=confirmStatus;
          confirmStatus=async function(){
            const o=orderById(currentOrderId);
            const isCompletion=String(pendingStatus||'')==='Ausgeführt';
            if(!o||!isCompletion)return await dpX10BaseConfirmStatus.apply(this,arguments);

            // Vor dem alten Abschlussweg sichern wir die Planungsbemerkung.
            // Altbestände ohne planningNote bekommen den bisherigen o.note-Inhalt.
            const planning=dpX10PlanningNote(o);
            const completion=dpX10Text($('statusNote')?.value||'');
            o.planningNote=planning;

            // Der alte Abschlussweg darf intern normal arbeiten. Danach wird die
            // inzwischen überschrieben gewesene o.note wieder zur Auftragsbemerkung.
            const r=await dpX10BaseConfirmStatus.apply(this,arguments);

            const live=orderById(currentOrderId)||o;
            // Falls eine bestehende Validierung (z. B. vorgeschaltetes Leeren ohne
            // Entleerungsbestätigung) den Abschluss abgebrochen hat, darf X10
            // daraus keinen scheinbaren erfolgreichen Abschluss machen.
            if(String(live.status||'')!=='Ausgeführt')return r;
            live.note=planning;
            live.planningNote=planning;
            live.completionNote=completion;
            live.updatedAt=nowIso();

            // Auch der Archiv-Snapshot hält beide Inhalte getrennt fest.
            const archived=(state.archiveOrders||[]).find(x=>String(x.id)===String(live.id));
            if(archived){
              archived.note=planning;
              archived.planningNote=planning;
              archived.completionNote=completion;
            }

            await persist();
            try{renderAll();}catch(_){ }
            return r;
          };

          // ------------------------------------------------------------
          // 5) RAPPORT: ausschließlich Abschlussbemerkung aus completionNote
          // ------------------------------------------------------------
          const dpX10BaseReportPaper=reportPaper;
          reportPaper=function(o,signer,sig){
            if(!o)return dpX10BaseReportPaper.apply(this,arguments);
            // Der bestehende Rapportdruck liest o.note. Für den Druck bekommt er
            // deshalb eine Kopie, deren note ausschließlich completionNote enthält.
            const rapportOrder={...o,note:dpX10CompletionNote(o)};
            return dpX10BaseReportPaper.call(this,rapportOrder,signer,sig);
          };

          // Falls ein Auftrag nach X10 erneut in der Auftragsmaske bearbeitet wird,
          // bleibt o.note weiterhin die Planungs-/Auftragsbemerkung. Neue Aufträge
          // erhalten beim normalen saveOrder ebenfalls genau diesen Inhalt.
          const dpX10BaseSaveOrder=saveOrder;
          saveOrder=async function(){
            const editId=editingOrderId;
            const before=new Set((state.orders||[]).map(o=>String(o.id)));
            const note=dpX10Text($('oNote')?.value||'');
            const r=await dpX10BaseSaveOrder.apply(this,arguments);
            const saved=editId?orderById(editId):(state.orders||[]).find(o=>!before.has(String(o.id))&&!o.x5PreEmpty);
            if(saved){
              saved.note=note;
              saved.planningNote=note;
              saved.updatedAt=nowIso();
              await persist();
            }
            return r;
          };

          // Felder bereits beim Laden installieren; die open*-Wrapper sichern sie
          // zusätzlich ab, falls ein Modal später dynamisch verändert wurde.
          dpX10InstallCustomerNotes();
          dpX10InstallSiteNote();
          /* DP_X10_BEMERKUNGEN_RAPPORT_END */
          '''

          t = t.replace(marker, patch + '\n' + marker, 1)
          p.write_text(t, encoding='utf-8', newline='\n')
          print('X10F2: Bemerkungen, Kundentrennung und Rapport-Abschlussbemerkung eingefügt.')
          PY

          grep -q "DP_X10_BEMERKUNGEN_RAPPORT_BEGIN" dispopilot-online-efd.html
          grep -q "Allgemeine Bemerkung" dispopilot-online-efd.html
          grep -q "Interne Bemerkung / nur Büro" dispopilot-online-efd.html
          grep -q "Bemerkungen / Hinweise" dispopilot-online-efd.html
          grep -q "completionNote" dispopilot-online-efd.html
          grep -q "planningNote" dispopilot-online-efd.html
          grep -Fq "const rapportOrder={...o,note:dpX10CompletionNote(o)};" dispopilot-online-efd.html
          grep -q "push('Kunde',c?.generalNote" dispopilot-online-efd.html

      - name: Apply X12 configurable roles, master data and administration
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('dispopilot-online-efd.html')
          if not p.exists():
              raise SystemExit('X12 abgebrochen: dispopilot-online-efd.html wurde nicht erzeugt.')

          t = p.read_text(encoding='utf-8')
          marker = '/* DP13_PATCH_END */'
          if t.count(marker) != 1:
              raise SystemExit(f'X12 abgebrochen: DP13-Endmarker {t.count(marker)}x gefunden statt 1x.')
          if 'DP_X12_ROLLEN_STAMMDATEN_ADMIN_BEGIN' in t:
              raise SystemExit('X12 abgebrochen: Rollen-/Administrationsblock bereits vorhanden.')

          patch = r'''
          /* DP_X12_ROLLEN_STAMMDATEN_ADMIN_BEGIN */
          (function(){
            const MODULES=[
              {key:'planning',label:'Planung'},
              {key:'orders',label:'Aufträge'},
              {key:'customers',label:'Kunden'},
              {key:'sites',label:'Baustellen'},
              {key:'time',label:'Arbeitszeit'},
              {key:'bins',label:'Mulden'},
              {key:'binSearch',label:'Mulden suchen'},
              {key:'history',label:'Archiv / Historie'},
              {key:'masterData',label:'Stammdaten'},
              {key:'administration',label:'Administration'}
            ];

            const DEFAULTS={
              disponent:{
                planning:true,orders:false,customers:true,sites:true,time:false,
                bins:true,binSearch:true,history:true,masterData:true,administration:false
              },
              fahrer:{
                planning:false,orders:true,customers:false,sites:false,time:true,
                bins:true,binSearch:true,history:false,masterData:false,administration:false
              }
            };

            const SCREEN_MODULE={
              planning:'planning',orders:'orders',customers:'customers',sites:'sites',
              time:'time',bins:'bins',history:'history'
            };

            let settingsMode='master';
            let lastRole='';
            let applying=false;

            function norm(v){
              return String(v??'').replace(/\s+/g,' ').trim().toLocaleLowerCase('de');
            }

            function roleKey(){
              const r=norm(window.DP_AUTH&&window.DP_AUTH.role);
              if(r==='admin'||r==='administrator')return 'admin';
              if(r==='disposition'||r==='disponent')return 'disponent';
              if(r==='fahrer')return 'fahrer';
              return '';
            }

            function roleLabel(r){
              return r==='admin'?'Administrator':r==='disponent'?'Disposition':r==='fahrer'?'Fahrer':String(window.DP_AUTH?.role||'');
            }

            function ensurePermissionState(){
              if(typeof state==='undefined'||!state)return null;
              if(!state.settings||typeof state.settings!=='object')state.settings={};
              if(!state.settings.rolePermissions||typeof state.settings.rolePermissions!=='object')state.settings.rolePermissions={};
              ['disponent','fahrer'].forEach(r=>{
                if(!state.settings.rolePermissions[r]||typeof state.settings.rolePermissions[r]!=='object')state.settings.rolePermissions[r]={};
                Object.keys(DEFAULTS[r]).forEach(k=>{
                  if(typeof state.settings.rolePermissions[r][k]!=='boolean')state.settings.rolePermissions[r][k]=DEFAULTS[r][k];
                });
              });
              return state.settings.rolePermissions;
            }

            function can(module,r=roleKey()){
              if(r==='admin')return true;
              const all=ensurePermissionState();
              if(!all||!r||!all[r])return false;
              return all[r][module]===true;
            }

            function homeRoot(){
              return document.getElementById('home')||document.querySelector('.home')||document;
            }

            function moduleFromText(text){
              const s=norm(text);
              if(!s)return '';
              if(s.includes('mulden suchen')||s.includes('standortsuche'))return 'binSearch';
              if(s.startsWith('stammdaten')||s.startsWith('einstellungen'))return 'masterData';
              if(s.startsWith('archiv / historie')||s.startsWith('archiv/historie')||s.startsWith('archiv'))return 'history';
              if(s.startsWith('arbeitszeit'))return 'time';
              if(s.startsWith('planung'))return 'planning';
              if(s.startsWith('aufträge')||s.startsWith('auftraege'))return 'orders';
              if(s.startsWith('kunden'))return 'customers';
              if(s.startsWith('baustellen'))return 'sites';
              if(s.startsWith('mulden'))return 'bins';
              return '';
            }

            function moduleOf(el){
              if(!el)return '';
              const forced=el.dataset&&el.dataset.dpModule;
              if(forced)return forced;
              if(el.classList&&el.classList.contains('homeSearch'))return 'binSearch';
              const oc=String(el.getAttribute?.('onclick')||'');
              const m=oc.match(/\bshow\s*\(\s*['\"]([^'\"]+)['\"]/i);
              if(m){
                const screen=norm(m[1]);
                if(screen==='settings')return 'masterData';
                if(SCREEN_MODULE[screen])return SCREEN_MODULE[screen];
              }
              const label=el.querySelector?.(':scope > strong,:scope > h2,:scope > h3')?.textContent||el.getAttribute?.('aria-label')||el.getAttribute?.('title')||el.textContent||'';
              return moduleFromText(label);
            }

            function setRoleHidden(el,hide){
              if(!el)return;
              if(hide){
                if(el.dataset.dpX12PrevDisplay===undefined)el.dataset.dpX12PrevDisplay=el.style.display||'';
                el.dataset.dpX12RoleHidden='1';
                el.style.setProperty('display','none','important');
                el.setAttribute('aria-hidden','true');
              }else if(el.dataset.dpX12RoleHidden==='1'){
                const prev=el.dataset.dpX12PrevDisplay||'';
                el.style.removeProperty('display');
                if(prev)el.style.display=prev;
                delete el.dataset.dpX12RoleHidden;
                delete el.dataset.dpX12PrevDisplay;
                el.removeAttribute('aria-hidden');
              }
            }

            function isSettingsTile(el){
              if(!el)return false;
              const m=moduleOf(el);
              if(m!=='masterData')return false;
              const txt=norm(el.textContent||'');
              return txt.includes('einstellungen')||txt.includes('stammdaten');
            }

            function prepareSettingsTile(){
              const root=homeRoot();
              const candidates=[...root.querySelectorAll('[onclick],.tile,[role="button"],button,a')];
              for(const el of candidates){
                if(!isSettingsTile(el))continue;
                el.dataset.dpModule='masterData';
                const heading=el.querySelector('strong,h2,h3')||el;
                if(heading&&norm(heading.textContent).includes('einstellungen'))heading.textContent='Stammdaten';
                const small=el.querySelector('.small,p');
                if(small&&norm(small.textContent).includes('einstellung'))small.textContent='Materialien, Orte, Lager und betriebliche Vorgaben';
                el.removeAttribute('onclick');
                el.onclick=null;
                el.dataset.dpX12Action='masterData';
              }
            }

            function gearCandidates(){
              const out=new Set();
              [...document.querySelectorAll('button,[role="button"],a')].forEach(el=>{
                const meta=norm([
                  el.id||'',el.className||'',el.getAttribute?.('title')||'',
                  el.getAttribute?.('aria-label')||'',el.getAttribute?.('onclick')||'',
                  el.textContent||'',el.innerHTML||''
                ].join(' '));
                if(meta.includes('setting')||meta.includes('einstellung')||meta.includes('administration')||meta.includes('gear')||meta.includes('cog')||meta.includes('⚙'))out.add(el);
              });
              const status=document.getElementById('storageStatus');
              if(status){
                let root=status.parentElement;
                for(let i=0;i<4&&root;i++,root=root.parentElement){
                  const buttons=[...root.querySelectorAll('button')];
                  const iconOnly=buttons.filter(b=>{
                    const txt=norm(b.textContent||'');
                    const r=b.getBoundingClientRect();
                    return txt.length<=2&&r.width>24&&r.width<100&&r.height>24&&r.height<100;
                  });
                  if(iconOnly.length===1)out.add(iconOnly[0]);
                }
              }
              return [...out].filter(el=>!isSettingsTile(el));
            }

            function prepareGear(){
              gearCandidates().forEach(el=>{
                el.dataset.dpX12Gear='1';
                setRoleHidden(el,!can('administration'));
                if(can('administration')){
                  el.setAttribute('title','Administration');
                  el.setAttribute('aria-label','Administration');
                  el.removeAttribute('onclick');
                  el.onclick=null;
                  el.dataset.dpX12Action='administration';
                }
              });
            }

            function ensureRoleHeadline(){
              if(!window.DP_AUTH)return;
              let badge=document.getElementById('dpX12RoleHeadline');
              const status=document.getElementById('storageStatus');
              if(!badge){
                badge=document.createElement('div');
                badge.id='dpX12RoleHeadline';
                badge.style.cssText='margin-top:3px;font-size:13px;font-weight:750;opacity:.96';
                if(status&&status.parentElement)status.after(badge);
                else document.body.prepend(badge);
              }
              const r=roleKey();
              const name=String(window.DP_AUTH.displayName||window.DP_AUTH.email||'').trim();
              badge.textContent=roleLabel(r)+(name?' · '+name:'');
            }

            function ensureRoleMenuBack(){
              const r=roleKey();
              const active=document.querySelector('.screen.active');
              const activeId=norm(active?.id||'home');
              let btn=document.getElementById('dpX12RoleMenuBack');
              const status=document.getElementById('storageStatus');
              const host=status?.parentElement;
              const needsOwnBack=(r==='fahrer'||r==='disponent')&&activeId!=='home';

              // Admin behält unverändert die vorhandene Zurück-Navigation.
              // Fahrer und Disposition erhalten an derselben Stelle nur den Pfeil,
              // keinen separaten "Menü"-Button.
              if(!needsOwnBack){
                if(btn)btn.style.display='none';
                if(host&&host.dataset.dpX12BackPad==='1'){
                  host.style.paddingLeft=host.dataset.dpX12BackPrevPadding||'';
                  delete host.dataset.dpX12BackPad;
                  delete host.dataset.dpX12BackPrevPadding;
                }
                return;
              }

              if(!btn){
                btn=document.createElement('button');
                btn.id='dpX12RoleMenuBack';
                btn.type='button';
                btn.dataset.dpX12Action='homeMenu';
                btn.textContent='←';
                btn.title='Zurück zum Hauptmenü';
                btn.setAttribute('aria-label','Zurück zum Hauptmenü');
                btn.style.cssText='border:1px solid rgba(255,255,255,.72);background:rgba(255,255,255,.10);color:#fff;border-radius:9px;width:30px;height:30px;padding:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;line-height:1;cursor:pointer';

                if(host){
                  if(getComputedStyle(host).position==='static')host.style.position='relative';
                  btn.style.position='absolute';
                  btn.style.left='12px';
                  btn.style.top='14px';
                  host.appendChild(btn);
                }else{
                  btn.style.position='fixed';
                  btn.style.left='12px';
                  btn.style.top='12px';
                  btn.style.zIndex='10000';
                  document.body.appendChild(btn);
                }
              }

              if(host){
                if(host.dataset.dpX12BackPad!=='1'){
                  host.dataset.dpX12BackPrevPadding=host.style.paddingLeft||'';
                  host.dataset.dpX12BackPad='1';
                }
                host.style.paddingLeft='54px';
              }
              btn.style.display='flex';
            }

            function classifySettingsCard(card){
              if(!card)return 'admin';
              if(card.id==='dpX12RoleMatrixCard')return 'admin';
              if(card.id==='dpX12CdminInfoCard')return 'admin';
              if(card.querySelector?.('#currentUser'))return 'hide';
              if(card.id==='dpWarehouseCard'||card.id==='dpR1TransportCard'||card.querySelector?.('#materialList'))return 'master';
              if(card.id==='dpV1TestCard')return 'admin';
              const txt=norm(card.textContent||'');
              if(/material|transportort|lagerstandort|lager\b|rapport.*mail|büro.*mail|buero.*mail|stundenzettel.*empf|empfänger.*stundenzettel|empfaenger.*stundenzettel/.test(txt))return 'master';
              if(/testbetrieb|sicherung|backup|import|export|daten.*zurück|daten.*zurueck|benutzer|rolle|administrator|system|sharepoint/.test(txt))return 'admin';
              return 'admin';
            }

            function ensureAdminInfo(){
              const screen=document.getElementById('settings');
              if(!screen||document.getElementById('dpX12CdminInfoCard'))return;
              const card=document.createElement('div');
              card.id='dpX12CdminInfoCard';
              card.className='card';
              card.dataset.dpSection='admin';
              card.innerHTML='<h3 style="margin-top:0">Anmeldung</h3><div id="dpX12CdminInfoText" class="small"></div>';
              screen.prepend(card);
            }

            function ensureRoleMatrix(){
              const screen=document.getElementById('settings');
              if(!screen||document.getElementById('dpX12RoleMatrixCard'))return;
              const card=document.createElement('div');
              card.id='dpX12RoleMatrixCard';
              card.className='card';
              card.dataset.dpSection='admin';
              card.innerHTML='<h3 style="margin-top:0">Rollen und sichtbare Bereiche</h3>'+
                '<div class="small" style="margin-bottom:10px">Der Administrator hat immer Vollzugriff. Für Fahrer und Disposition kann festgelegt werden, welche Bereiche sichtbar und direkt aufrufbar sind. Die Struktur ist für weitere Rollen vorbereitet.</div>'+
                '<div style="overflow-x:auto"><table id="dpX12RoleTable" style="width:100%;border-collapse:collapse;min-width:560px">'+
                '<thead><tr><th style="text-align:left;padding:7px;border-bottom:1px solid #ddd">Bereich</th><th style="padding:7px;border-bottom:1px solid #ddd">Fahrer</th><th style="padding:7px;border-bottom:1px solid #ddd">Disposition</th><th style="padding:7px;border-bottom:1px solid #ddd">Admin</th></tr></thead><tbody></tbody></table></div>';
              const anchor=document.getElementById('dpX12CdminInfoCard');
              if(anchor)anchor.after(card); else screen.prepend(card);
            }

            function renderRoleMatrix(){
              ensurePermissionState();
              ensureAdminInfo();
              ensureRoleMatrix();
              const info=document.getElementById('dpX12CdminInfoText');
              if(info&&window.DP_AUTH)info.textContent=String(window.DP_AUTH.displayName||'')+' · '+String(window.DP_AUTH.email||'')+' · Rolle: '+roleLabel(roleKey());
              const body=document.querySelector('#dpX12RoleTable tbody');
              if(!body)return;
              const perms=state.settings.rolePermissions;
              body.innerHTML=MODULES.map(m=>{
                const f=perms.fahrer[m.key]===true?'checked':'';
                const d=perms.disponent[m.key]===true?'checked':'';
                return '<tr>'+
                  '<td style="padding:7px;border-bottom:1px solid #eee">'+esc(m.label)+'</td>'+
                  '<td style="text-align:center;padding:7px;border-bottom:1px solid #eee"><input type="checkbox" '+f+' data-dpx12-role="fahrer" data-dpx12-module="'+esc(m.key)+'"></td>'+
                  '<td style="text-align:center;padding:7px;border-bottom:1px solid #eee"><input type="checkbox" '+d+' data-dpx12-role="disponent" data-dpx12-module="'+esc(m.key)+'"></td>'+
                  '<td style="text-align:center;padding:7px;border-bottom:1px solid #eee">✓ immer</td>'+
                  '</tr>';
              }).join('');
            }

            async function setPermission(r,module,on,input=null){
              ensurePermissionState();
              if(!state.settings.rolePermissions[r]||!(module in DEFAULTS[r])){
                renderRoleMatrix();
                return;
              }
              const old=state.settings.rolePermissions[r][module]===true;
              if(roleKey()!=='admin'){
                if(input)input.checked=old;
                return;
              }
              if(input)input.disabled=true;
              state.settings.rolePermissions[r][module]=!!on;
              try{
                if(typeof persist==='function')await persist();
                apply();
                renderRoleMatrix();
              }catch(e){
                state.settings.rolePermissions[r][module]=old;
                if(input){input.checked=old;input.disabled=false;}
                console.error('X12D Rollenrecht konnte nicht gespeichert werden',e);
                alert('Rollenrecht konnte nicht gespeichert werden. Die Änderung wurde zurückgenommen.');
                renderRoleMatrix();
              }
            }

            function applySettingsMode(){
              const screen=document.getElementById('settings');
              if(!screen)return;
              const r=roleKey();
              const adminView=settingsMode==='admin';
              if(adminView&&r==='admin')renderRoleMatrix();
              screen.dataset.dpSettingsMode=settingsMode;

              const heading=screen.querySelector('h1,h2');
              if(heading&&/einstellungen|stammdaten|administration/i.test(heading.textContent||''))heading.textContent=adminView?'Administration':'Stammdaten';

              [...screen.querySelectorAll('.card')].forEach(card=>{
                const sec=card.dataset.dpSection||classifySettingsCard(card);
                card.dataset.dpSection=sec;
                if(sec==='hide'){setRoleHidden(card,true);return;}
                if(sec==='admin')setRoleHidden(card,!adminView||!can('administration'));
                else if(sec==='master')setRoleHidden(card,adminView||!can('masterData'));
              });

              const matrix=document.getElementById('dpX12RoleMatrixCard');
              if(matrix)setRoleHidden(matrix,!(adminView&&r==='admin'));
            }

            function fallback(){
              // Einheitliche Bedienlogik für alle Rollen:
              // gesperrte/ungültige Direktaufrufe führen immer ins Hauptmenü.
              return ['home','Heute'];
            }

            const baseShow=typeof show==='function'?show:null;

            function guardedShow(id,title){
              if(!baseShow)return;
              const s=norm(id);
              if(s==='settings'){
                const needed=settingsMode==='admin'?'administration':'masterData';
                if(!can(needed)){
                  const [fid,ftitle]=fallback();
                  return baseShow.call(this,fid,ftitle);
                }
                const out=baseShow.call(this,'settings',settingsMode==='admin'?'Administration':'Stammdaten');
                setTimeout(()=>{applySettingsMode();apply();},0);
                return out;
              }
              const module=SCREEN_MODULE[s];
              if(module&&!can(module)){
                const [fid,ftitle]=fallback();
                return baseShow.call(this,fid,ftitle);
              }
              const out=baseShow.apply(this,arguments);
              setTimeout(apply,0);
              return out;
            }

            if(baseShow)show=guardedShow;

            function openMasterData(){
              settingsMode='master';
              return guardedShow('settings','Stammdaten');
            }

            function openAdministration(){
              settingsMode='admin';
              return guardedShow('settings','Administration');
            }

            function applyHomePermissions(){
              const root=homeRoot();
              const nodes=[...root.querySelectorAll('[data-dp-module],[onclick],.tile,[role="button"],.homeSearch')];
              nodes.forEach(el=>{
                const m=moduleOf(el);
                if(!m)return;
                setRoleHidden(el,!can(m));
              });
              // Arbeitszeit beim Disponenten ausdrücklich entfernen, selbst wenn die Kachel
              // im Alt-HTML keine technisch erkennbare Zielansicht besitzt.
              if(roleKey()==='disponent'){
                [...root.querySelectorAll('.tile,.card,[role="button"],[onclick]')].forEach(el=>{
                  if(moduleFromText(el.querySelector?.('strong,h2,h3')?.textContent||el.textContent||'')==='time')setRoleHidden(el,true);
                });
              }
            }

            function enforceCurrentScreen(){
              const active=[...document.querySelectorAll('.screen.active')][0];
              if(!active)return;
              const id=norm(active.id);
              if(id==='settings'){
                const needed=settingsMode==='admin'?'administration':'masterData';
                if(!can(needed)){
                  const [fid,ftitle]=fallback();
                  baseShow?.call(window,fid,ftitle);
                }
                return;
              }
              const module=SCREEN_MODULE[id];
              if(module&&!can(module)){
                const [fid,ftitle]=fallback();
                baseShow?.call(window,fid,ftitle);
              }
            }

            function apply(){
              if(applying)return;
              applying=true;
              try{
                const r=roleKey();
                if(!r)return;
                ensurePermissionState();
                document.body.dataset.dpRole=r;
                prepareSettingsTile();
                prepareGear();
                ensureRoleHeadline();
                ensureRoleMenuBack();
                applyHomePermissions();
                enforceCurrentScreen();
                if(document.getElementById('settings')?.classList.contains('active'))applySettingsMode();

                if(lastRole!==r){
                  lastRole=r;
                  // Einheitlicher Einstieg: Administrator, Disposition und Fahrer
                  // beginnen nach Anmeldung/Rollenwechsel im jeweiligen Hauptmenü.
                  if(baseShow)setTimeout(()=>guardedShow('home','Heute'),0);
                }
              }catch(e){
                console.error('X12D Rollenoberfläche konnte nicht angewendet werden',e);
              }finally{applying=false;}
            }

            document.addEventListener('click',function(e){
              const actionEl=e.target?.closest?.('[data-dp-x12-action],[data-dp-x12-gear]');
              const action=actionEl?.dataset?.dpX12Action||'';
              if(action==='homeMenu'){
                e.preventDefault();e.stopImmediatePropagation();
                guardedShow('home','Heute');
                return false;
              }
              if(action==='masterData'){
                e.preventDefault();e.stopImmediatePropagation();
                openMasterData();
                return false;
              }
              if(action==='administration'){
                e.preventDefault();e.stopImmediatePropagation();
                if(can('administration'))openAdministration();
                return false;
              }

              const el=e.target?.closest?.('button,[role="button"],a,[onclick],.tile,.card');
              if(!el)return;
              if(el.dataset.dpX12Gear==='1'&&!can('administration')){
                e.preventDefault();e.stopImmediatePropagation();return false;
              }
              if(el.classList?.contains('homeSearch')&&!can('binSearch')){
                e.preventDefault();e.stopImmediatePropagation();return false;
              }
            },true);

            document.addEventListener('change',function(e){
              const input=e.target?.closest?.('input[data-dpx12-role][data-dpx12-module]');
              if(!input)return;
              e.stopPropagation();
              void setPermission(
                String(input.dataset.dpx12Role||''),
                String(input.dataset.dpx12Module||''),
                !!input.checked,
                input
              );
            },true);

            window.dpX12SetPermission=setPermission;
            window.dpX12OpenMasterData=openMasterData;
            window.dpX12OpenAdministration=openAdministration;
            window.dpX12Can=can;
            window.dpX12CpplyRoleUi=apply;

            const start=()=>{
              setTimeout(apply,0);
            };
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start,{once:true});
            else start();
          })();
          /* DP_X12_ROLLEN_STAMMDATEN_ADMIN_END */
          '''

          t = t.replace(marker, patch + '\n' + marker, 1)

          auth_anchor = 'initUI();renderAll();dpAuthDecorateTop();dpAuthDecorateSettings();dpAuthDecorateOrders();'
          auth_replacement = auth_anchor + "setTimeout(()=>{try{if(window.dpX12CpplyRoleUi)window.dpX12CpplyRoleUi();}catch(e){console.error('X12D Rollen-UI',e);}},0);"
          if t.count(auth_anchor) != 1:
              raise SystemExit(f'X12 abgebrochen: Auth-Erfolgsanker {t.count(auth_anchor)}x gefunden statt 1x.')
          t = t.replace(auth_anchor, auth_replacement, 1)

          p.write_text(t, encoding='utf-8', newline='\n')
          print('X12: konfigurierbare Rollen, Stammdaten/Administration und Rollenanzeige eingefügt.')
          PY

          grep -q "DP_X12_ROLLEN_STAMMDATEN_ADMIN_BEGIN" dispopilot-online-efd.html
          grep -Fq "window.DP_AUTH&&window.DP_AUTH.role" dispopilot-online-efd.html
          grep -Fq "state.settings.rolePermissions" dispopilot-online-efd.html
          grep -Fq "Rollen und sichtbare Bereiche" dispopilot-online-efd.html
          grep -Fq "dpX12OpenMasterData" dispopilot-online-efd.html
          grep -Fq "dpX12OpenAdministration" dispopilot-online-efd.html
          ! grep -Fq "new MutationObserver(()=>apply())" dispopilot-online-efd.html
          grep -Fq "setTimeout(()=>{try{if(window.dpX12CpplyRoleUi)window.dpX12CpplyRoleUi();}" dispopilot-online-efd.html

      - name: Install SPFx CLI
        run: npm install -g @microsoft/spfx-cli@latest

      - name: Scaffold SPFx web part
        run: |
          rm -rf spfx-build
          spfx create \
            --template webpart-noframework \
            --library-name dispopilot-online-v13 \
