name: DLB-030AJ-1.16.0.1 STANDORTE NAVIGATION FULL BUILD PROD

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Rebuild exact DLB-030AH basis from repository workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY_RUN_030AH'
          from pathlib import Path
          import subprocess, yaml

          wf = Path(".github/workflows/DLB-030AH-1.12.1.27_BACKUP_30MIN_FILES_FULL_BUILD.yml")
          if not wf.exists():
              raise SystemExit("030AJ: Original-Workflow 030AH fehlt im Repository.")

          doc = yaml.safe_load(wf.read_text(encoding="utf-8"))
          steps = doc["jobs"]["build"]["steps"]
          runs = [(s.get("name", ""), s.get("run")) for s in steps if s.get("run")]
          if not runs:
              raise SystemExit("030AJ: Keine 030AH-Buildschritte gefunden.")

          for idx, (name, script) in enumerate(runs, 1):
              print(f"\n===== 030AJ führt 030AH-Schritt {idx}/{len(runs)} aus: {name} =====")
              runner = Path(f".030ai_030ah_step_{idx}.sh")
              runner.write_text(script, encoding="utf-8", newline="\n")
              try:
                  subprocess.run(["bash", "-euo", "pipefail", str(runner)], check=True)
              finally:
                  runner.unlink(missing_ok=True)
          print("030AJ: Originale 030AH-Basis vollständig rekonstruiert.")
          PY_RUN_030AH

