      - name: Install SPFx CLI 0.1.0-pre.3
        shell: bash
        run: |
          set -euo pipefail
          npm install -g @microsoft/spfx-cli@0.1.0-pre.3
          command -v spfx
          spfx --help >/dev/null

      - name: Scaffold SPFx 1.22 web part
        shell: bash
        run: |
          set -euo pipefail
          rm -rf spfx-build
          spfx create \
            --template webpart-noframework \
            --library-name dispopilot-online-v13 \
            --component-name "DispoPilot Online" \
            --component-alias DispoPilotOnline \
            --component-description "DispoPilot Online V1.3" \
            --solution-name dispopilot-online-v13 \
            --target-dir spfx-build \
            --spfx-version 1.22 \
            --package-manager npm
          test -f spfx-build/package.json
          test -d spfx-build/src/webparts
          grep -q '"@microsoft/sp-webpart-base"' spfx-build/package.json

