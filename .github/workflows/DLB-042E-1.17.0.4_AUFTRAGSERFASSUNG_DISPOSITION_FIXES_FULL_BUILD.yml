name: DLB-042E-1.17.0.4 AUFTRAGSERFASSUNG DISPOSITION FIXES FULL BUILD
'on':
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout exact successful DLB-041I workflow commit
      uses: actions/checkout@v4
      with:
        ref: 90ec53afe08c8cf55334d2fba736690ce863c6ee
    - name: Preserve exact successful DLB-041I workflow
      shell: bash
      run: |
        set -euo pipefail
        cp .github/workflows/DLB-041I-1.16.0.41_041C_BASIS_WIEGEDATEN_FINAL_VALIDATOR_FIX.yml /tmp/DLB-041I-source.yml
        test -s /tmp/DLB-041I-source.yml
    - name: Checkout exact DLB-041C workflow commit used by 041I
      uses: actions/checkout@v4
      with:
        ref: 303a57617abc7d59ee7b115a9a761808f05bf0df
        clean: true
    - name: Preserve exact DLB-041C workflow used by 041I
      shell: bash
      run: |
        set -euo pipefail
        cp .github/workflows/DLB-041C-1.16.0.35_AUFTRAGSDETAIL_KACHELN_PLAYER_ZUSATZDATEN_FULL_BUILD.yml /tmp/DLB-041C-source.yml
        test -s /tmp/DLB-041C-source.yml
    - name: Checkout exact DLB-040C base used by 041I
      uses: actions/checkout@v4
      with:
        ref: 339aae6dd0190e24a1534c6383d327de665dfccb
        clean: true
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22.16.0
    - name: Rebuild exact successful DLB-041I source
      shell: bash
      run: |
        set -euo pipefail
        python3 -m pip install --quiet pyyaml
        python3 - <<'PY_REBUILD_041I'
        from pathlib import Path
        import subprocess, yaml, json

        expected_base='339aae6dd0190e24a1534c6383d327de665dfccb'
        actual=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
        if actual!=expected_base:
            raise SystemExit(f'041J: falscher 040C-Basischeckout {actual}, erwartet {expected_base}.')

        wf=Path('/tmp/DLB-041I-source.yml')
        if not wf.exists(): raise SystemExit('041J: gesicherter 041I-Workflow fehlt.')
        if not Path('/tmp/DLB-041C-source.yml').exists(): raise SystemExit('041J: gesicherter 041C-Workflow fehlt.')
        doc=yaml.safe_load(wf.read_text(encoding='utf-8'))
        runs=[(s.get('name',''),s.get('run')) for s in doc['jobs']['build']['steps'] if s.get('run')]
        expected_names=[
            'Preserve exact DLB-041C workflow',
            'Rebuild and validate exact successful DLB-041C source',
            'Apply DLB-041I weight-only correction on 041C',
            'Validate DLB-041I source before build',
            'Build and package DLB-041I',
            'Validate emitted DLB-041I package'
        ]
        if [n for n,_ in runs]!=expected_names:
            raise SystemExit('041J: 041I-Workflowstruktur weicht vom erfolgreichen Stand ab: '+repr([n for n,_ in runs]))

        for idx,(name,script) in enumerate(runs[1:4],1):
            print(f'===== 041J nutzt erfolgreichen 041I-Quellschritt {idx}/3: {name} =====')
            runner=Path(f'.041j_041i_step_{idx}.sh')
            runner.write_text(script,encoding='utf-8',newline='\n')
            try: subprocess.run(['bash','-euo','pipefail',str(runner)],check=True)
            finally: runner.unlink(missing_ok=True)

        pkg=Path('spfx-build/config/package-solution.json')
        data=json.loads(pkg.read_text(encoding='utf-8'))
        if data.get('solution',{}).get('version')!='1.3.6.135':
            raise SystemExit('041J: rekonstruierte 041I-SPFx-Version ist nicht 1.3.6.135.')

        root=Path('spfx-build/src/webparts')
        files=[p for p in root.rglob('*') if p.is_file() and p.suffix in {'.js','.ts','.tsx'}]
        hits=[]
        for p in files:
            src=p.read_text(encoding='utf-8')
            if '__DISPOLUX_041I' in src and "version:'1.16.0.41'" in src and '__DISPOLUX_041C' in src:
                hits.append((p,src))
        if len(hits)!=1: raise SystemExit(f'041J: rekonstruierte 041I-Runtime {len(hits)}x statt genau 1x gefunden.')
        print('041J BASIS OK: exakter erfolgreicher DLB-041I-Quellstand rekonstruiert und validiert.')
        PY_REBUILD_041I
