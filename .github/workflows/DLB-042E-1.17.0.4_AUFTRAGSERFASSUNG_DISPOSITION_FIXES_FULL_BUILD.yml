        DLB-042E-1.17.0.4 · AUFTRAGSERFASSUNG + DISPOSITION FIXES · SPFx 1.3.6.141

        Verbindliche Basis:
        - direkt DLB-041J / Produkt 1.16.0.42 / SPFx 1.3.6.136
        - DLB-042A und DLB-042B sind ausdruecklich NICHT Bestandteil der Basis
        - alle vorhandenen 041J-Funktionen bleiben technisch bestehen

        Architektur 42C:
        1. Alte Planungsliste bleibt Ebene 1 des Moduls Auftragserfassung und Planung.
        2. Linke Navigation: Uebersicht, Auftragserfassung, Dispositionsliste, Dispositionsgrafik.
        3. Auftragserfassung startet mit Auftragsart-Auswahl; nicht lizenzierte Module sichtbar, aber gesperrt.
        4. Containerdienst erfasst nur wer/wo/was; Fahrer/LKW/Reihenfolge werden erst disponiert.
        5. Dispositionsliste und Dispositionsgrafik zeigen dieselben Auftraege.
        6. Grafik disponiert Fahrer, nicht LKW. Undisponierte Auftraege stehen oben.
        7. Drag & Drop ordnet Fahrer, Reihenfolge und geplanten Start zu.
        8. Auftragstyp wird zusaetzlich zum Status ueber ein Symbol kenntlich gemacht.
        9. In Arbeit blinkt; Unterbrochen bleibt als Dauerfarbe sichtbar.
        10. Vollbild-Detailansicht fuer die Disposition mit Fahrer, LKW, Reihenfolge, Dauer, Mulde, Material und Entsorger/Abladestelle.
        11. Stamm-LKW wird bei Fahrerwahl vorgeschlagen, bleibt aenderbar.
        12. Erfahrungswert fuer geplante Dauer: aus vergleichbaren Altauftraegen, sonst 60 Minuten.
        13. Bestehende Detailfunktionen bleiben erreichbar fuer Abschluss, Zeit, Wiegen, Material, Dokumente, GPS, Offline und Rapport.

        Pflicht-Praxistest:
        A. Hauptmenue -> Planung: bekannte Kopfzeile und alte Listenansicht muessen unveraendert erreichbar sein.
        B. Neuer Auftrag: zuerst Auftragsart-Auswahl; kein Fahrer/LKW/Reihenfolge-Feld in der Auftragserfassung.
        C. Containerdienst Auftrag anlegen und speichern; danach als undisponiert in Liste und Grafik sichtbar.
        D. Grafik: Auftrag per Drag & Drop einem Fahrer zuordnen; Stamm-LKW-Vorschlag, Reihenfolge und geplanter Start pruefen.
        E. Klick auf Auftrag -> Detailansicht; speichern -> zur vorherigen Liste/Grafik zurueck.
        F. Status In Arbeit muss blinken; Unterbrochen darf nicht blinken.
        G. Alte Funktionen regressionspruefen: Datum vor/zurueck, Bearbeiten, Start/Pause/Weiter/Ausgefuehrt, Nicht ausgefuehrt, Mulden, Material, Wiegen, Dokumente, GPS, Rapport, Offline-Outbox, Archiv.
        TXT
