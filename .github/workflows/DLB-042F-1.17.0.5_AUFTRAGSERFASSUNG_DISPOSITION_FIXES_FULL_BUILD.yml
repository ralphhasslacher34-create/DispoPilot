        from pathlib import Path
        import base64, json, subprocess
        root=Path('spfx-build/src/webparts')
        files=[p for p in root.rglob('*') if p.is_file() and p.suffix in {'.js','.ts','.tsx'}]
        hits=[]
        for p in files:
            s=p.read_text(encoding='utf-8')
            if '__DISPOLUX_041J' in s and "version:'1.16.0.42'" in s and '__DISPOLUX_041I' in s:
                hits.append((p,s))
        if len(hits)!=1: raise SystemExit(f'042D: 041J-Runtime {len(hits)}x statt genau 1x gefunden.')
        runtime,s=hits[0]
        if '__DISPOLUX_042A' in s or '__DISPOLUX_042B' in s:
            raise SystemExit('042F: 42A/42B duerfen nicht Bestandteil der Basis sein.')
        patch=base64.b64decode(Path('/tmp/dlb042f_patch.b64').read_text()).decode('utf-8')
        Path('/tmp/dlb042f_patch.js').write_text(patch,encoding='utf-8',newline='\n')
        subprocess.run(['node','--check','/tmp/dlb042f_patch.js'],check=True)
        marker='/* DP13_PATCH_END */'
        if s.count(marker)!=1: raise SystemExit(f'042F: DP13-Endmarker {s.count(marker)}x statt 1x.')
        s=s.replace(marker,patch+'\n\n'+marker,1)
        runtime.write_text(s,encoding='utf-8',newline='\n')
        if runtime.suffix=='.js': subprocess.run(['node','--check',str(runtime)],check=True)
        pkg=Path('spfx-build/config/package-solution.json')
        data=json.loads(pkg.read_text(encoding='utf-8'))
        old=data.get('solution',{}).get('version')
        if old!='1.3.6.136': raise SystemExit(f'042F: erwartete 041J-SPFx-Version 1.3.6.136, gefunden {old!r}.')
        data['solution']['version']='1.3.6.142'
        pkg.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
        print('042F PATCH OK:',runtime)
