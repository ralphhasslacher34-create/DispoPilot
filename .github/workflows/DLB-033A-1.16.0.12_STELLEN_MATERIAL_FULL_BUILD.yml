              raise SystemExit("033A: finale Paketprüfung fehlt.")

          final_run = final_step["run"]
          final_run = final_run.replace("DLB-032E-1.16.0.11","DLB-033A-1.16.0.12")
          final_run = final_run.replace("SPFx 1.3.6.105","SPFx 1.3.6.106")
          marker = "          grep -R -Fq 'dp32BDriverButton' artifact/UPLOAD_TO_SITEASSETS\n"
          if marker not in final_run:
              raise SystemExit("033A: Einfügepunkt für finale Materialprüfung fehlt.")
          final_run = final_run.replace(
              marker,
              marker
              + "          grep -R -Fq 'Geplantes Material' artifact/UPLOAD_TO_SITEASSETS\n"
              + "          grep -R -Fq 'dp33StellenMaterialDetail' artifact/UPLOAD_TO_SITEASSETS\n",
              1,
          )
          final_step["run"] = final_run

          names=[s.get("name","") for s in steps]
          required_order=[
              "Apply DLB-031G Standorte Navigation",
              "Validate 031G source before build",
              "Apply DLB-032B Fahrerauswahl TD-005",
              "Validate 032E Fahrerauswahl before build",
              "Apply DLB-033A Stellen Material",
              "Set 033A SPFx version",
              "Validate 033A Stellen Material before build",
              "Build and package 033A",
              "Validate emitted 033A package",
          ]
          positions=[]
          for name in required_order:
              if name not in names:
                  raise SystemExit("033A: erwarteter Schritt fehlt: "+name)
              positions.append(names.index(name))
          if positions != sorted(positions):
              raise SystemExit("033A: Build-Reihenfolge ist nicht korrekt.")

          run_steps=[(s.get("name",""),s.get("run")) for s in steps if s.get("run")]
          if len(run_steps)!=12:
              raise SystemExit(f"033A: erwartet 12 ausführbare Buildschritte, gefunden {len(run_steps)}.")

          print("033A Vorprüfung OK")
          for idx,(name,script) in enumerate(run_steps,1):
              print(f"===== 033A Schritt {idx}/{len(run_steps)}: {name} =====")
              runner=Path(f".033a_step_{idx}.sh")
              runner.write_text(script,encoding="utf-8",newline="\\n")
              try:
                  subprocess.run(["bash","-euo","pipefail",str(runner)],check=True)
              finally:
                  runner.unlink(missing_ok=True)
          print("033A: kompletter Build und alle Validierungen erfolgreich abgeschlossen.")

