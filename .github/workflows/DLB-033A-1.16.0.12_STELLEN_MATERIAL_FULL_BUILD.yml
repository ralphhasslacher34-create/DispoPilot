name: DLB-033A-1.16.0.12 STELLEN MATERIAL FULL BUILD

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Prepare and run DLB-033A
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY_RUN_033A'
          from pathlib import Path
          import base64
          import re
          import subprocess
          import textwrap
          import yaml

          source = Path(".github/workflows/DLB-032B-1.16.0.8_FAHRERAUSWAHL_STABIL_FULL_BUILD.yml")
          if not source.exists():
              raise SystemExit("033A: 032B-Quellworkflow für die bestätigte 032E-Basis fehlt.")

          text = source.read_text(encoding="utf-8")

          wrong = "DP_DLB_032B_1_16_0_7_TD005_FAHRERAUSWAHL"
          base_marker = "DP_DLB_032B_1_16_0_8_TD005_FAHRERAUSWAHL"
          e_marker = "DP_DLB_032E_1_16_0_11_TD005_FAHRERAUSWAHL"

          count = text.count(wrong)
          if count != 4:
              raise SystemExit(f"033A: erwartet genau 4 alte 032B-Prüfmarker, gefunden {count}.")
          text = text.replace(wrong, base_marker)

          block_re = re.compile(
              r"(cat > /tmp/dlb032b_patch\.b64 <<'DLB032B_PATCH'\n)"
              r"(?P<b64>.*?)"
              r"(\n\s*DLB032B_PATCH)",
              re.S,
          )
          m = block_re.search(text)
          if not m:
              raise SystemExit("033A: eingebetteter 032B-Fahrerauswahl-Patch nicht gefunden.")

          raw_b64 = re.sub(r"\s+", "", m.group("b64"))
          driver_patch = base64.b64decode(raw_b64).decode("utf-8")
          old_begin = base_marker + "_BEGIN"
          old_end = base_marker + "_END"
          e_begin = e_marker + "_BEGIN"
          e_end = e_marker + "_END"

          if driver_patch.count(old_begin) != 1 or driver_patch.count(old_end) != 1:
              raise SystemExit("033A: 032B-Patchmarker nicht eindeutig.")

          driver_patch = driver_patch.replace(old_begin, e_begin)
          driver_patch = driver_patch.replace(old_end, e_end)
          driver_patch = driver_patch.replace("version:'1.16.0.8'", "version:'1.16.0.11'")
          driver_patch = driver_patch.replace("__DISPOLUX_032B", "__DISPOLUX_032E")

          driver_functions = [
              "dp32BInstallDriverPicker",
              "dp32BDriverButton",
              "dp32BDriverMenu",
              "dp32BSelectDriver",
              "dp32BBaseFillSelects",
              "dp32BBaseOpenM",
          ]
          missing = [x for x in driver_functions if x not in driver_patch]
          if missing:
              raise SystemExit("033A: 032E-Fahrerauswahl unvollständig: " + ", ".join(missing))

          new_b64 = base64.b64encode(driver_patch.encode("utf-8")).decode("ascii")
          wrapped = "\n".join("          " + line for line in textwrap.wrap(new_b64, 76))
          text = text[:m.start("b64")] + wrapped + text[m.end("b64"):]

          text = text.replace(base_marker, e_marker)
          text = text.replace(
              "name: DLB-032B-1.16.0.8 FAHRERAUSWAHL STABIL FULL BUILD PROD",
              "name: DLB-033A-1.16.0.12 STELLEN MATERIAL FULL BUILD",
          )
          text = text.replace("- name: Set 032B SPFx version", "- name: Set 032E SPFx version")
          text = text.replace(
              "- name: Validate 032B Fahrerauswahl before build",
              "- name: Validate 032E Fahrerauswahl before build",
          )
          text = text.replace("- name: Build and package 032B", "- name: Build and package 033A")
          text = text.replace(
              "- name: Validate emitted 032B package",
              "- name: Validate emitted 033A package",
          )
          text = text.replace("DLB-032B-1.16.0.8", "DLB-032E-1.16.0.11")
          text = text.replace("1.16.0.8", "1.16.0.11")
          text = text.replace("1.3.6.102", "1.3.6.105")
          text = text.replace("__DISPOLUX_032B", "__DISPOLUX_032E")
          text = text.replace("032B VALIDIERUNG", "032E VALIDIERUNG")
          text = text.replace("OK 1/10: 032B-Patch", "OK 1/10: 032E-Patch")
          text = text.replace("OK 10/10: 032B eindeutig", "OK 10/10: 032E eindeutig")
          text = text.replace("032B Fahrerauswahl gepatcht:", "032E Fahrerauswahl gepatcht:")

          fragile_line = (
              "          grep -R -Fq "
              f"'{e_marker}_BEGIN' "
              "artifact/UPLOAD_TO_SITEASSETS\n"
          )
          if fragile_line not in text:
              raise SystemExit("033A: erwartete alte Markerprüfung nicht gefunden.")
          text = text.replace(fragile_line, "", 1)

          final_driver_anchor = "          grep -R -Fq 'dp32BDriverButton' artifact/UPLOAD_TO_SITEASSETS\n"
          if final_driver_anchor not in text:
              raise SystemExit("033A: robuste 032E-Fahrerprüfung fehlt.")

          doc = yaml.safe_load(text)
          steps = doc["jobs"]["build"]["steps"]
          build_index = next((i for i,s in enumerate(steps) if s.get("name")=="Build and package 033A"), None)
          if build_index is None:
              raise SystemExit("033A: Build-Schritt konnte nicht gefunden werden.")

          apply_033 = """set -euo pipefail

          cat > /tmp/dlb033a_patch.b64 <<'DLB033A_PATCH'
          __PATCH_B64__
          DLB033A_PATCH

          python3 - <<'PY_PATCH_033A'
          from pathlib import Path
          import base64

          files = (
              list(Path("spfx-build/src/webparts").rglob("*.js")) +
              list(Path("spfx-build/src/webparts").rglob("*.ts")) +
              list(Path("spfx-build/src/webparts").rglob("*.tsx"))
          )
          end_marker = "/* DP13_PATCH_END */"
          base_marker = "DP_DLB_032E_1_16_0_11_TD005_FAHRERAUSWAHL_BEGIN"
          new_marker = "DP_DLB_033A_1_16_0_12_STELLEN_MATERIAL_BEGIN"

          candidates=[]
          for p in files:
              src=p.read_text(encoding="utf-8")
              if (
                  base_marker in src
                  and end_marker in src
                  and "function dpR1MaterialOptions" in src
                  and "function editOrder" in src
                  and "function saveOrder" in src
                  and "function orderCard" in src
                  and "function openDetail" in src
              ):
                  candidates.append(p)

          if len(candidates)!=1:
              raise SystemExit(
                  "033A: erwartete genau eine 032E-Runtime mit Stellen/Material-Logik, gefunden: "
                  + str([str(x) for x in candidates])
              )

          p=candidates[0]
          src=p.read_text(encoding="utf-8")
          if new_marker in src:
              raise SystemExit("033A: Patch bereits vorhanden.")
          if src.count(end_marker)!=1:
              raise SystemExit(f"033A: DP13-Endmarker {src.count(end_marker)}x statt 1x.")

          patch=base64.b64decode(Path("/tmp/dlb033a_patch.b64").read_text().encode()).decode("utf-8")
          src=src.replace(end_marker,patch+"\\n\\n"+end_marker,1)
          p.write_text(src,encoding="utf-8",newline="\\n")
          print("033A Stellen/Material gepatcht:",p)
          PY_PATCH_033A
          """.replace("__PATCH_B64__", """__PATCH_B64_RUNTIME__""")

          set_ver_033 = """set -euo pipefail
          python3 - <<'PY_VER_033A'
          from pathlib import Path
          p=Path("spfx-build/config/package-solution.json")
          src=p.read_text(encoding="utf-8")
          if "1.3.6.105" not in src:
              raise SystemExit("033A: erwartete 032E-SPFx-Version 1.3.6.105 fehlt.")
          p.write_text(src.replace("1.3.6.105","1.3.6.106",1),encoding="utf-8",newline="\\n")
          PY_VER_033A
          """

          validate_033 = """set -euo pipefail
          python3 - <<'PY_VALIDATE_033A'
          from pathlib import Path
          import json
          import subprocess

          root=Path("spfx-build/src/webparts")
          files=[p for p in root.rglob("*") if p.is_file() and p.suffix in {".js",".ts",".tsx"}]
          begin="DP_DLB_033A_1_16_0_12_STELLEN_MATERIAL_BEGIN"
          end="DP_DLB_033A_1_16_0_12_STELLEN_MATERIAL_END"
          hits=[]
          for p in files:
              src=p.read_text(encoding="utf-8")
              if begin in src:
                  hits.append((p,src))
          if len(hits)!=1:
              raise SystemExit(f"033A VALIDIERUNG: Patch in {len(hits)} Dateien statt genau 1 gefunden: {[str(p) for p,_ in hits]}")

          runtime,src=hits[0]
          if end not in src:
              raise SystemExit("033A VALIDIERUNG: Endmarker fehlt.")
          frag=src.split(begin,1)[1].split(end,1)[0]

          required=[
              "dp33StellenMaterialOptions",
              "dp33SetStellenMaterial",
              "dp33BaseTaskChanged",
              "dp33BaseEditOrder",
              "dp33BaseSaveOrder",
              "dp33BaseOrderCard",
              "dp33BaseOpenDetail",
              "Geplantes Material",
              '<option value="">Leer</option>',
              "state?.materials",
              "targetTask==='Stellen'",
              "dp33SetStellenMaterial('')",
              "dp33DisplayMaterial",
              "dp33StellenMaterialDetail",
              "__DISPOLUX_033A",
          ]
          missing=[x for x in required if x not in frag]
          if missing:
              raise SystemExit("033A VALIDIERUNG: Pflichtbestandteile fehlen: "+", ".join(missing))

          forbidden=[
              "$('oMaterial').value='Leer'",
              'o.material="Leer"',
              "o.material='Leer'",
              "state.materials.push('Leer')",
              'state.materials.push("Leer")',
          ]
          bad=[x for x in forbidden if x in frag]
          if bad:
              raise SystemExit("033A VALIDIERUNG: Leer darf nicht als echter Muldeninhalt gespeichert werden: "+", ".join(bad))

          if "DP_DLB_032E_1_16_0_11_TD005_FAHRERAUSWAHL_BEGIN" not in src:
              raise SystemExit("033A VALIDIERUNG: bestätigte 032E-Fahrerauswahl fehlt.")
          if "DP_DLB_031G_1_16_0_6_STANDORTE_NAVIGATION_BEGIN" not in src:
              raise SystemExit("033A VALIDIERUNG: 031G Standort-/Navigationsbasis fehlt.")
          for marker in ["dp32BDriverButton","dp31GRenderBinMap","Standort setzen","Navigation zur Baustelle"]:
              if marker not in src:
                  raise SystemExit("033A VALIDIERUNG: bestehende Funktion fehlt: "+marker)

          pkg=Path("spfx-build/config/package-solution.json")
          data=json.loads(pkg.read_text(encoding="utf-8"))
          version=data.get("solution",{}).get("version","")
          if version!="1.3.6.106":
              raise SystemExit(f"033A VALIDIERUNG: SPFx-Version {version!r} statt 1.3.6.106")
          if runtime.suffix==".js":
              subprocess.run(["node","--check",str(runtime)],check=True)
          if src.count(begin)!=1 or src.count(end)!=1:
              raise SystemExit("033A VALIDIERUNG: Patchmarker nicht eindeutig.")
          print("033A VALIDIERUNG OK")
          PY_VALIDATE_033A
          """

