name: DLB-040C-1.16.0.32 MATERIAL STAMM FELDER REGRESSION FIX FULL BUILD

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Rebuild exact DLB-039B source basis
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY_RUN_039B_BASE'
          from pathlib import Path
          import subprocess, yaml

          wf=Path('.github/workflows/DLB-039B-1.16.0.29_RECOVERY_DIRECT_SAFETY_BACKUP_FULL_BUILD.yml')
          if not wf.exists():
              raise SystemExit('040C: DLB-039B-Workflow fehlt im Repository.')
          doc=yaml.safe_load(wf.read_text(encoding='utf-8'))
          runs=[(s.get('name',''),s.get('run')) for s in doc['jobs']['build']['steps'] if s.get('run')]
          if len(runs)!=5:
              raise SystemExit(f'040C: 039B erwartet 5 ausführbare Buildschritte, gefunden {len(runs)}.')
          for idx,(name,script) in enumerate(runs[:2],1):
              print(f'===== 040C Basis 039B Schritt {idx}/2: {name} =====')
              runner=Path(f'.040c_039b_step_{idx}.sh')
              runner.write_text(script,encoding='utf-8',newline='\n')
              try:
                  subprocess.run(['bash','-euo','pipefail',str(runner)],check=True)
              finally:
                  runner.unlink(missing_ok=True)
          print('040C: DLB-039B-Quellstand rekonstruiert.')
          PY_RUN_039B_BASE

      - name: Repair material master source and restore fields
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_PATCH_040C'
          from pathlib import Path
          import json, re, subprocess

          root=Path('spfx-build/src/webparts')
          files=[p for p in root.rglob('*') if p.is_file() and p.suffix in {'.js','.ts','.tsx'}]
          base039b='DP_DLB_039B_1_16_0_28_RECOVERY_PRE_CLEAN_BEGIN'
          base035b='DP_DLB_035B_1_16_0_16_AUFTRAG_KONTAKT_MEHRMULDEN_MATERIAL_BEGIN'
          begin='DP_DLB_040C_1_16_0_31_MATERIAL_STAMM_FELDER_FIX_BEGIN'
          end='DP_DLB_040C_1_16_0_31_MATERIAL_STAMM_FELDER_FIX_END'
          end_marker='/* DP13_PATCH_END */'

          hits=[]
          for p in files:
              source=p.read_text(encoding='utf-8')
              if base039b in source and base035b in source and end_marker in source:
                  hits.append((p,source))
          if len(hits)!=1:
              raise SystemExit(f'040C: App-Runtime {len(hits)}x statt genau 1x gefunden.')
          runtime,src=hits[0]
          if begin in src:
              raise SystemExit('040C: Patch bereits vorhanden.')
          if 'function dpR1MaterialOptions' not in src:
              raise SystemExit('040C: zentrale Materialoptions-Funktion fehlt.')
          if 'avvMaterialCatalog' not in src:
              raise SystemExit('040C: gemeinsamer Material-/AVV-Stamm fehlt in der Basis.')

          # 1) Alle 035B-Material-Dropdowns an dieselbe zentrale Materialquelle binden,
          #    die der normale Auftrag bereits nutzt. Für Stellen wird nur während
          #    des Optionsabrufs die 033C-Sonderumleitung umgangen.
          mstart=src.find('function dp35MaterialRows(){')
          mend=src.find('function dp35PlannedFromOrder(',mstart)
          if mstart<0 or mend<0 or mend<=mstart:
              raise SystemExit('040C: 035B-Materialoptionsblock nicht gefunden.')
          oldblock=src[mstart:mend]
          if oldblock.count('(state?.materials||[])')!=1 or oldblock.count('function dp35MaterialOptions')!=1:
              raise SystemExit('040C: 035B-Materialoptionsblock entspricht nicht der erwarteten Basis.')

          replacement=r"""function dp40cMasterMaterialRows(selected=''){
            const value=dp35Text(selected);
            let html='';
            if(typeof dpR1MaterialOptions!=='function')return value?[{value,label:value}]:[];
            const taskEl=$('oTask');
            const beforeTask=taskEl?taskEl.value:null;
            try{
              if(taskEl&&dp35Text(taskEl.value)==='Stellen')taskEl.value='Abholen';
              html=String(dpR1MaterialOptions(value)||'');
            }finally{
              if(taskEl&&beforeTask!==null)taskEl.value=beforeTask;
            }
            const probe=document.createElement('select');
            probe.innerHTML=html;
            const seen=new Set();
            const rows=[];
            Array.from(probe.options||[]).forEach(opt=>{
              const v=dp35Text(opt.value);
              const label=dp35Text(opt.textContent||opt.label||v);
              if(!v||v.toLocaleLowerCase('de')==='leer')return;
              const key=v.toLocaleLowerCase('de');
              if(seen.has(key))return;
              seen.add(key);
              rows.push({value:v,label:label||v});
            });
            if(value&&!seen.has(value.toLocaleLowerCase('de')))rows.push({value,label:value});
            return rows;
          }

          function dp35MaterialRows(){
            return dp40cMasterMaterialRows().map(x=>x.value);
          }

          function dp35MaterialOptions(selected='',emptyLabel='Leer'){
            const value=dp35Text(selected);
            const rows=dp40cMasterMaterialRows(value);
            let html='<option value="">'+esc(emptyLabel)+'</option>';
            html+=rows.map(x=>'<option value="'+esc(x.value)+'" '+(x.value===value?'selected':'')+'>'+esc(x.label)+'</option>').join('');
            return html;
          }

          """
          src=src[:mstart]+replacement+src[mend:]

          # 2) Materialfeld bei Abholen/Leeren/Tauschen wieder sichtbar machen.
          old_hide="if(['Stellen','Liefern','Tauschen','Abholen','Leeren'].includes(task))globalMaterial?.classList.add('hidden');"
          new_hide="""if(['Stellen','Liefern'].includes(task))globalMaterial?.classList.add('hidden');
            else if(['Tauschen','Abholen','Leeren'].includes(task))globalMaterial?.classList.remove('hidden');"""
          if src.count(old_hide)!=1:
              raise SystemExit(f'040C: alte Ausblendelogik {src.count(old_hide)}x statt 1x.')
          src=src.replace(old_hide,new_hide,1)

          # 3) Tauschen: Planmaterial der neu gestellten Mulde darf das Material
          #    der abgeholten Mulde an KEINER Stelle überschreiben.
          #    Die Trefferprüfung ist absichtlich einrückungsunabhängig.
          plan_start=src.find('function dp35PlanMaterialChanged(i){')
          plan_end=src.find('function dp35RenderPlannedMaterials(',plan_start)
          if plan_start<0 or plan_end<=plan_start:
              raise SystemExit('040C: dp35PlanMaterialChanged nicht eindeutig gefunden.')
          plan_block=src[plan_start:plan_end]
          plan_re=re.compile(
              r"if\s*\(\s*\$\('oMaterial'\)\s*\)\s*\$\('oMaterial'\)\.value\s*=\s*value\s*;\s*"
              r"if\s*\(\s*\$\('dpR1MaterialSelect'\)\s*\)\s*\$\('dpR1MaterialSelect'\)\.value\s*=\s*value\s*;"
          )
          plan_hits=list(plan_re.finditer(plan_block))
          if len(plan_hits)!=1:
              raise SystemExit(f'040C: Planänderung->Material {len(plan_hits)}x statt 1x.')
          plan_block=plan_re.sub(
              """if(dp35Task()!=='Tauschen'){
                if($('oMaterial'))$('oMaterial').value=value;
                if($('dpR1MaterialSelect'))$('dpR1MaterialSelect').value=value;
              }""",
              plan_block,
              count=1
          )
          src=src[:plan_start]+plan_block+src[plan_end:]

          render_start=src.find('function dp35RenderPlannedMaterials(')
          render_end=src.find('function dp35CollectPlannedMaterials(',render_start)
          if render_start<0 or render_end<=render_start:
              raise SystemExit('040C: dp35RenderPlannedMaterials nicht eindeutig gefunden.')
          render_block=src[render_start:render_end]
          render_re=re.compile(
              r"if\s*\(\s*\$\('oMaterial'\)\s*\)\s*\$\('oMaterial'\)\.value\s*=\s*values\[0\]\s*\|\|\s*''\s*;\s*"
              r"if\s*\(\s*\$\('dpR1MaterialSelect'\)\s*\)\s*\$\('dpR1MaterialSelect'\)\.value\s*=\s*values\[0\]\s*\|\|\s*''\s*;"
          )
          render_hits=list(render_re.finditer(render_block))
          if len(render_hits)!=1:
              raise SystemExit(f'040C: Render->Material {len(render_hits)}x statt 1x.')
          render_block=render_re.sub(
              """if(task!=='Tauschen'){
                if($('oMaterial'))$('oMaterial').value=values[0]||'';
                if($('dpR1MaterialSelect'))$('dpR1MaterialSelect').value=values[0]||'';
              }""",
              render_block,
              count=1
          )
          src=src[:render_start]+render_block+src[render_end:]

          save_start=src.find("const dp35BaseSaveOrder=(typeof saveOrder==='function')?saveOrder:null;")
          save_end=src.find('function dp35ActualArray(',save_start)
          if save_start<0 or save_end<=save_start:
              raise SystemExit('040C: 035B-Saveblock nicht eindeutig gefunden.')
          save_block=src[save_start:save_end]
          pre_re=re.compile(
              r"if\s*\(\s*planned\.length\s*\)\s*\{\s*"
              r"if\s*\(\s*\$\('oMaterial'\)\s*\)\s*\$\('oMaterial'\)\.value\s*=\s*planned\[0\]\s*\|\|\s*''\s*;\s*"
              r"if\s*\(\s*\$\('dpR1MaterialSelect'\)\s*\)\s*\$\('dpR1MaterialSelect'\)\.value\s*=\s*planned\[0\]\s*\|\|\s*''\s*;\s*"
              r"\}"
          )
          pre_hits=list(pre_re.finditer(save_block))
          if len(pre_hits)!=1:
              raise SystemExit(f'040C: Save Plan->Material {len(pre_hits)}x statt 1x.')
          save_block=pre_re.sub(
              """if(planned.length&&task!=='Tauschen'){
                if($('oMaterial'))$('oMaterial').value=planned[0]||'';
                if($('dpR1MaterialSelect'))$('dpR1MaterialSelect').value=planned[0]||'';
              }""",
              save_block,
              count=1
          )
          old_saved="saved.material=dp35Text(saved.plannedBinMaterials[0]);"
          new_saved="if(saved.task!=='Tauschen')saved.material=dp35Text(saved.plannedBinMaterials[0]);"
          if save_block.count(old_saved)!=1:
              raise SystemExit(f'040C: saved.material {save_block.count(old_saved)}x statt 1x.')
          save_block=save_block.replace(old_saved,new_saved,1)
          src=src[:save_start]+save_block+src[save_end:]

          # 4) Laufzeitmarker.
          marker=r"""
          /* DP_DLB_040C_1_16_0_31_MATERIAL_STAMM_FELDER_FIX_BEGIN */
          try{
            Object.defineProperty(window,'__DISPOLUX_040C',{
              value:{
                version:'1.16.0.32',
                materialMaster:'avvMaterialCatalog-via-dpR1MaterialOptions',
                restoredFields:['Tauschen','Abholen','Leeren'],
                tauschMaterialSeparated:true
              },
              configurable:true
            });
          }catch(_){}
          /* DP_DLB_040C_1_16_0_31_MATERIAL_STAMM_FELDER_FIX_END */
          """
          if src.count(end_marker)!=1:
              raise SystemExit(f'040C: DP13-Endmarker {src.count(end_marker)}x statt 1x.')
          src=src.replace(end_marker,marker+'\n\n'+end_marker,1)

          runtime.write_text(src,encoding='utf-8',newline='\n')
          if runtime.suffix=='.js':
              subprocess.run(['node','--check',str(runtime)],check=True)

          pkg=Path('spfx-build/config/package-solution.json')
          data=json.loads(pkg.read_text(encoding='utf-8'))
          if data.get('solution',{}).get('version')!='1.3.6.123':
              raise SystemExit('040C: erwartete 039B-SPFx-Version 1.3.6.123 fehlt.')
          data['solution']['version']='1.3.6.126'
          pkg.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('040C PATCH OK')
          PY_PATCH_040C

      - name: Validate 040C source before build
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_VALIDATE_040C'
          from pathlib import Path
          import json, re, subprocess

          root=Path('spfx-build/src/webparts')
          files=[p for p in root.rglob('*') if p.is_file() and p.suffix in {'.js','.ts','.tsx'}]
          begin='DP_DLB_040C_1_16_0_31_MATERIAL_STAMM_FELDER_FIX_BEGIN'
          hits=[]; combined=[]
          for p in files:
              source=p.read_text(encoding='utf-8'); combined.append(source)
              if begin in source: hits.append((p,source))
          if len(hits)!=1:
              raise SystemExit(f'040C VALIDIERUNG: Patch {len(hits)}x statt 1x.')
          runtime,src=hits[0]
          all_text='\n'.join(combined)

          required_basis=[
              'DP_DLB_039B_1_16_0_28_RECOVERY_PRE_CLEAN_BEGIN',
              'DP_DLB_036D_1_16_0_20_OFFLINE_OUTBOX_SYNC_BEGIN',
              'DP_DLB_035B_1_16_0_16_AUFTRAG_KONTAKT_MEHRMULDEN_MATERIAL_BEGIN',
              'plannedBinMaterials','actualBinMaterials','actualExistingBinMaterials',
              'DispoLux:036D:offlineOutbox:v1','avvMaterialCatalog',
              'function dpR1MaterialOptions'
          ]
          missing=[x for x in required_basis if x not in all_text]
          if missing:
              raise SystemExit('040C VALIDIERUNG Basis fehlt: '+', '.join(missing))

          required_fix=[
              'function dp40cMasterMaterialRows',
              'dpR1MaterialOptions(value)',
              "taskEl.value='Abholen'",
              "else if(['Tauschen','Abholen','Leeren'].includes(task))globalMaterial?.classList.remove('hidden');",
              "if(dp35Task()!=='Tauschen'){",
              "if(task!=='Tauschen'){",
              "if(planned.length&&task!=='Tauschen'){",
              "if(saved.task!=='Tauschen')saved.material=dp35Text(saved.plannedBinMaterials[0]);",
              "materialMaster:'avvMaterialCatalog-via-dpR1MaterialOptions'",
              "tauschMaterialSeparated:true",
              "version:'1.16.0.32'"
          ]
          missing=[x for x in required_fix if x not in src]
          if missing:
              raise SystemExit('040C VALIDIERUNG Fix fehlt: '+', '.join(missing))

          start=src.find('function dp40cMasterMaterialRows(')
          stop=src.find('function dp35PlannedFromOrder(',start)
          frag=src[start:stop] if start>=0 and stop>start else ''
          if not frag:
              raise SystemExit('040C VALIDIERUNG: neuer Materialoptionsblock fehlt.')
          if '(state?.materials||[])' in frag:
              raise SystemExit('040C VALIDIERUNG: alte direkte Materialliste ist im 035B-Dropdown noch aktiv.')
          if "if(['Stellen','Liefern','Tauschen','Abholen','Leeren'].includes(task))globalMaterial?.classList.add('hidden');" in src:
              raise SystemExit('040C VALIDIERUNG: alte Ausblendelogik noch aktiv.')

          # Alle drei unbeabsichtigten Tauschen-Synchronisationen müssen geschützt sein.
          if src.count("if(dp35Task()!=='Tauschen'){")!=1:
              raise SystemExit('040C VALIDIERUNG: Tauschen-Schutz Planänderung nicht eindeutig.')
          if src.count("if(task!=='Tauschen'){")!=1:
              raise SystemExit('040C VALIDIERUNG: Tauschen-Schutz Render nicht eindeutig.')
          if src.count("if(planned.length&&task!=='Tauschen'){")!=1:
              raise SystemExit('040C VALIDIERUNG: Tauschen-Schutz Save nicht eindeutig.')
          if src.count("if(saved.task!=='Tauschen')saved.material=dp35Text(saved.plannedBinMaterials[0]);")!=1:
              raise SystemExit('040C VALIDIERUNG: Tauschen-Schutz saved.material nicht eindeutig.')

          pkg=json.loads(Path('spfx-build/config/package-solution.json').read_text(encoding='utf-8'))
          if pkg.get('solution',{}).get('version')!='1.3.6.126':
              raise SystemExit('040C VALIDIERUNG: SPFx-Version falsch.')
          if runtime.suffix=='.js':
              subprocess.run(['node','--check',str(runtime)],check=True)

          print('040C QUELLVALIDIERUNG OK')
          PY_VALIDATE_040C

      - name: Build and package 040C
        shell: bash
        run: |
          set -euo pipefail
          rm -rf spfx-build/release spfx-build/temp/deploy spfx-build/sharepoint/solution
          (cd spfx-build && npx heft build --production)
          (cd spfx-build && npx heft package-solution --production)
          rm -rf artifact/UPLOAD_TO_SITEASSETS artifact/UPLOAD_TO_APP_CATALOG
          mkdir -p artifact/UPLOAD_TO_SITEASSETS artifact/UPLOAD_TO_APP_CATALOG
          PKG=$(find spfx-build/sharepoint/solution -maxdepth 1 -type f -name '*.sppkg' | head -n1)
          test -n "$PKG"
          cp "$PKG" artifact/UPLOAD_TO_APP_CATALOG/DispoPilot_Online_V1.3_SPFX_FINAL.sppkg
          if [ -d spfx-build/release/assets ]; then
            cp -a spfx-build/release/assets/. artifact/UPLOAD_TO_SITEASSETS/
          elif [ -d spfx-build/temp/deploy ]; then
            cp -a spfx-build/temp/deploy/. artifact/UPLOAD_TO_SITEASSETS/
          else
            echo '040C: Keine SPFx Asset-Ausgabe gefunden.' >&2
            exit 1
          fi

      - name: Validate emitted 040C package
        shell: bash
        run: |
          set -euo pipefail
          COUNT=0
          while IFS= read -r -d '' JS; do
            test -s "$JS"
            node --check "$JS"
            COUNT=$((COUNT+1))
          done < <(find artifact/UPLOAD_TO_SITEASSETS -maxdepth 1 -type f -name '*.js' -print0)
          test "$COUNT" -gt 0
          test -s artifact/UPLOAD_TO_APP_CATALOG/DispoPilot_Online_V1.3_SPFX_FINAL.sppkg

          python3 - <<'PY_FINAL_040C'
          from pathlib import Path
          js=list(Path('artifact/UPLOAD_TO_SITEASSETS').glob('*.js'))
          current=[]
          for p in js:
              source=p.read_text(encoding='utf-8')
              if '__DISPOLUX_040C' in source and '1.16.0.32' in source:
                  current.append((p,source))
          if len(current)!=1:
              raise SystemExit(f'040C FINAL: Produktionsbundle {len(current)}x statt 1x.')
          _,source=current[0]
          required=[
              '__DISPOLUX_039B','__DISPOLUX_036D','__DISPOLUX_035B','__DISPOLUX_040C',
              'plannedBinMaterials','actualBinMaterials','actualExistingBinMaterials',
              'DispoLux:036D:offlineOutbox:v1','avvMaterialCatalog',
              'Geplanter Inhalt je gestellter Mulde','Tatsächlicher Inhalt',
              'avvMaterialCatalog-via-dpR1MaterialOptions','tauschMaterialSeparated'
          ]
          missing=[x for x in required if x not in source]
          if missing:
              raise SystemExit('040C FINAL fehlt: '+', '.join(missing))
          print('040C PAKETVALIDIERUNG OK')
          PY_FINAL_040C

          cat > artifact/REIHENFOLGE.txt <<'TXT'
          DLB-040C-1.16.0.32 · MATERIAL-STAMM + FELDER REGRESSION FIX · SPFx 1.3.6.126
          Basis: erfolgreicher DLB-039B / 1.16.0.29
          Materialquelle: zentraler Material-/AVV-Stamm über die bestehende dpR1MaterialOptions-Kette
          Stellen/Liefern: geplantes Material je gestellter Mulde
          Tauschen: Material der abgeholten Mulde + getrenntes Planmaterial der neu gestellten Mulde
          Abholen/Leeren: Materialfeld wieder sichtbar und änderbar
          Tauschen-Schutz: Planänderung, Rendern und Speichern überschreiben das Abholmaterial nicht
          039B Recovery und 036D Offline-Outbox bleiben erhalten
          TXT

      - name: Upload DLB-040C artifact
        uses: actions/upload-artifact@v4
        with:
          name: DLB-040C-1.16.0.32-MATERIAL-STAMM-FELDER-FIX-SPFX-1.3.6.126
          path: artifact/
          if-no-files-found: error
