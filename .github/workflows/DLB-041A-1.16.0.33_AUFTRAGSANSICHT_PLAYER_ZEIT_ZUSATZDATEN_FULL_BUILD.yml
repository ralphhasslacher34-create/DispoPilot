          from pathlib import Path
          import json, subprocess

          root=Path('spfx-build/src/webparts')
          files=[p for p in root.rglob('*') if p.is_file() and p.suffix in {'.js','.ts','.tsx'}]
          begin='DP_DLB_041A_1_16_0_33_AUFTRAGSANSICHT_PLAYER_ZEIT_BEGIN'
          end='DP_DLB_041A_1_16_0_33_AUFTRAGSANSICHT_PLAYER_ZEIT_END'
          hits=[]; all_text=[]
          for p in files:
              src=p.read_text(encoding='utf-8'); all_text.append(src)
              if begin in src:hits.append((p,src))
          if len(hits)!=1:
              raise SystemExit(f'041A VALIDIERUNG: Patch {len(hits)}x statt genau 1x gefunden.')
          runtime,src=hits[0]
          if src.count(begin)!=1 or src.count(end)!=1:
              raise SystemExit('041A VALIDIERUNG: Patchmarker nicht eindeutig.')
          frag=src.split(begin,1)[1].split(end,1)[0]
          combined='\n'.join(all_text)

          basis_required=[
              '__DISPOLUX_040C','__DISPOLUX_039B','__DISPOLUX_036D','__DISPOLUX_035B','__DISPOLUX_031G',
              'plannedBinMaterials','actualBinMaterials','actualExistingBinMaterials',
              'DispoLux:036D:offlineOutbox:v1','avvMaterialCatalog-via-dpR1MaterialOptions',
              'Standort setzen','Navigation zur Baustelle','Tatsächlicher Inhalt'
          ]
          missing=[x for x in basis_required if x not in combined]
          if missing:
              raise SystemExit('041A VALIDIERUNG Basis fehlt: '+', '.join(missing))

          fix_required=[
              'workSegments','workEvents','dp41QuickStart','dp41QuickPause','dp41StoreTimes',
              'Unterbrechen','▶ Weiter','✓ Ausgeführt','••• Zusatzdaten',
              'Zusatzinformation · bereits vor Ort','Muldenstandort · aktueller Auftrag',
              'Weitere Aktionen','dp41AssignedNumbers','dp41TimeEditAllowed','orderTimeEdit',
              "timeModel:'segments+events+legacy-compatible'","version:'1.16.0.33'",
              "o.status='Unterbrochen'","o.status='In Arbeit'",
              "dp41Event(o,'pause',at)","resumed?'resume':'start'"
          ]
          missing=[x for x in fix_required if x not in frag]
          if missing:
              raise SystemExit('041A VALIDIERUNG Fix fehlt: '+', '.join(missing))

          # Sicherheitsregeln: bestehender Ausgeführt-Workflow bleibt die Instanz für Abschluss,
          # damit Mehrmulden-/Ist-Material-/Bestandslogik aus 035B nicht umgangen wird.
          safety=[
              "setStatus('Ausgeführt')",
              'const dp41BaseConfirmStatus',
              'await dp41BaseConfirmStatus.apply(this,arguments)',
              'const dp41BaseOpenDetail',
              'dp41BaseOpenDetail.apply(this,arguments)'
          ]
          missing=[x for x in safety if x not in frag]
          if missing:
              raise SystemExit('041A VALIDIERUNG Sicherheitsverkettung fehlt: '+', '.join(missing))

          # GPS-Zusatzinfo muss am Ende der Detailansicht einsortiert werden.
          if "body.appendChild(gps)" not in frag or "gps.before(label)" not in frag:
              raise SystemExit('041A VALIDIERUNG: Standort-Reihenfolge nicht vollständig verdrahtet.')

          pkg=json.loads(Path('spfx-build/config/package-solution.json').read_text(encoding='utf-8'))
          if pkg.get('solution',{}).get('version')!='1.3.6.127':
              raise SystemExit('041A VALIDIERUNG: SPFx-Version ist nicht 1.3.6.127.')
          if runtime.suffix=='.js':subprocess.run(['node','--check',str(runtime)],check=True)
          print('041A QUELLVALIDIERUNG OK')
          PY_VALIDATE_041A

      - name: Build and package DLB-041A
        shell: bash
        run: |
          set -euo pipefail
          rm -rf spfx-build/release spfx-build/temp/deploy spfx-build/sharepoint/solution
          (cd spfx-build && npx heft build --production)
          (cd spfx-build && npx heft package-solution --production)
          rm -rf artifact/UPLOAD_TO_SITEASSETS artifact/UPLOAD_TO_APP_CATALOG
          mkdir -p artifact/UPLOAD_TO_SITEASSETS artifact/UPLOAD_TO_APP_CATALOG
          PKG=$(find spfx-build/sharepoint/solution -maxdepth 1 -type f -name '*.sppkg' | head -n1)
          test -n "$PKG"
          cp "$PKG" artifact/UPLOAD_TO_APP_CATALOG/DispoPilot_Online_V1.3_SPFX_FINAL.sppkg
          if [ -d spfx-build/release/assets ]; then
            cp -a spfx-build/release/assets/. artifact/UPLOAD_TO_SITEASSETS/
          elif [ -d spfx-build/temp/deploy ]; then
            cp -a spfx-build/temp/deploy/. artifact/UPLOAD_TO_SITEASSETS/
          else
            echo '041A: Keine SPFx Asset-Ausgabe gefunden.' >&2
            exit 1
          fi

      - name: Validate emitted DLB-041A package
        shell: bash
        run: |
          set -euo pipefail
          COUNT=0
          while IFS= read -r -d '' JS; do
            test -s "$JS"
            node --check "$JS"
            COUNT=$((COUNT+1))
          done < <(find artifact/UPLOAD_TO_SITEASSETS -maxdepth 1 -type f -name '*.js' -print0)
          test "$COUNT" -gt 0
          test -s artifact/UPLOAD_TO_APP_CATALOG/DispoPilot_Online_V1.3_SPFX_FINAL.sppkg

          python3 - <<'PY_FINAL_041A'
          from pathlib import Path
          js=list(Path('artifact/UPLOAD_TO_SITEASSETS').glob('*.js'))
          current=[]
          for p in js:
              s=p.read_text(encoding='utf-8')
              if '__DISPOLUX_041A' in s and '1.16.0.33' in s:current.append((p,s))
          if len(current)!=1:
              raise SystemExit(f'041A FINAL: Produktionsbundle {len(current)}x statt 1x.')
          p,s=current[0]
          required=[
              '__DISPOLUX_041A','__DISPOLUX_040C','__DISPOLUX_039B','__DISPOLUX_036D','__DISPOLUX_035B','__DISPOLUX_031G',
              'workSegments','workEvents','Unterbrechen','Zusatzdaten','Zusatzinformation · bereits vor Ort',
              'Muldenstandort · aktueller Auftrag','Weitere Aktionen','orderTimeEdit','segments+events+legacy-compatible',
              'plannedBinMaterials','actualBinMaterials','actualExistingBinMaterials','Tatsächlicher Inhalt',
              'DispoLux:036D:offlineOutbox:v1','avvMaterialCatalog-via-dpR1MaterialOptions','Standort setzen','Navigation'
          ]
          missing=[x for x in required if x not in s]
          if missing:raise SystemExit('041A FINAL fehlt: '+', '.join(missing))
          print('041A PAKETVALIDIERUNG OK:',p.name)
          PY_FINAL_041A

          cat > artifact/REIHENFOLGE.txt <<'TXT'
          DLB-041A-1.16.0.33 · AUFTRAGSANSICHT / PLAYER / ZEIT / ZUSATZDATEN · SPFx 1.3.6.127
          Basis: exakt erfolgreicher DLB-040C-Run 37645048463, Commit 339aae6dd0190e24a1534c6383d327de665dfccb.

          Fahrer-Auftragsansicht:
          - professionelle, ruhige Auftragskarte im neuen DispoLux-Stil
          - Auftrag, Kunde/Baustelle, Termin, Fahrer/Fahrzeug und Navigation stehen oben
          - direkte Bedienung: Start / Unterbrechen / Weiter / Ausgeführt
          - Zusatzdaten als separates Pop-up: Muldennummer(n), LS-Nr., Bemerkung; Material öffnet die bestehende 040C-Auftragsbearbeitung
          - bisherige Aktionen bleiben unten als „Weitere Aktionen“ erhalten
          - Muldenstandort steht nicht mehr ganz oben
          - zugeordnete Mulde: „Muldenstandort · aktueller Auftrag“
          - nur an der Baustelle vorhandene Mulden: „Zusatzinformation · bereits vor Ort“ ganz unten

          Zeitmodell:
          - workSegments speichert jeden Arbeitsabschnitt Start bis Pause/Ende
          - workEvents protokolliert Start, Pause, Weiter und Abschluss
          - Netto-Auftragszeit = Summe der aktiven Arbeitsabschnitte; Pausen werden getrennt summiert
          - Legacy-Felder Start/Ende/Pause bleiben kompatibel
          - state.settings.orderTimeEdit ist als flexible spätere Berechtigungs-/Systemeinstellung vorbereitet
          - bestehender 035B-Ausgeführt-Workflow bleibt aktiv; Ist-Material und Muldenbewegungen werden nicht umgangen

          Praxistest 041A:
          1. Geplanten Auftrag öffnen: neue Kopfansicht und Start weit oben prüfen.
          2. Start: ein Tipp -> Status In Arbeit und Startzeit gespeichert.
          3. Unterbrechen -> Status Unterbrochen; Weiter -> Status In Arbeit; Zeiten/Pausen prüfen.
          4. Mehrere Pause/Weiter-Zyklen testen; Nettozeit muss die Pausen abziehen.
          5. Zusatzdaten öffnen, Muldennummer/LS/Bemerkung speichern, Auftrag neu öffnen und Werte prüfen.
          6. Ausgeführt oben starten: bestehende Abschluss-/Ist-Materiallogik muss erscheinen und vollständig funktionieren.
          7. Auftrag mit konkret zugeordneter Mulde: Standortbereich unten als aktueller Auftrag.
          8. Auftrag ohne konkrete Mulde an Baustelle mit vorhandenen Mulden: Standortbereich unten als Zusatzinformation/bereits vor Ort.
          9. Navigation sowie 040C-Materialfelder Stellen/Tauschen/Abholen/Leeren gegenprüfen.
          10. Schlechtnetz-/Offline-Basis 036D und 039B-Recovery bleiben im Bundle enthalten.
          TXT

