          python3 - <<'PY_PATCH_041A'
          from pathlib import Path
          import base64, json, subprocess

          patch=base64.b64decode(Path('/tmp/dlb041a_patch.b64').read_text()).decode('utf-8')
          patch_file=Path('/tmp/dlb041a_patch.js')
          patch_file.write_text(patch,encoding='utf-8',newline='\n')
          subprocess.run(['node','--check',str(patch_file)],check=True)

          root=Path('spfx-build/src/webparts')
          files=[p for p in root.rglob('*') if p.is_file() and p.suffix in {'.js','.ts','.tsx'}]
          end_marker='/* DP13_PATCH_END */'
          marker='DP_DLB_041A_1_16_0_33_AUFTRAGSANSICHT_PLAYER_ZEIT_BEGIN'
          required_base=[
              '__DISPOLUX_040C',
              'DP_DLB_035B_1_16_0_16_AUFTRAG_KONTAKT_MEHRMULDEN_MATERIAL_BEGIN',
              'DP_DLB_031G_1_16_0_6_STANDORTE_NAVIGATION_BEGIN',
              'DP_DLB_036D_1_16_0_20_OFFLINE_OUTBOX_SYNC_BEGIN',
              'plannedBinMaterials','actualBinMaterials','actualExistingBinMaterials',
              'DispoLux:036D:offlineOutbox:v1',
              'function openDetail','function setStatus','function confirmStatus'
          ]
          hits=[]
          for p in files:
              src=p.read_text(encoding='utf-8')
              if end_marker in src and all(x in src for x in required_base):
                  hits.append((p,src))
          if len(hits)!=1:
              raise SystemExit('041A: vollständige 040C-App-Runtime '+str(len(hits))+'x statt genau 1x gefunden: '+repr([str(p) for p,_ in hits]))
          runtime,src=hits[0]
          if marker in src:
              raise SystemExit('041A: Patch bereits vorhanden.')
          if src.count(end_marker)!=1:
              raise SystemExit(f'041A: DP13-Endmarker {src.count(end_marker)}x statt 1x.')
          src=src.replace(end_marker,patch+'\n\n'+end_marker,1)
          runtime.write_text(src,encoding='utf-8',newline='\n')
          if runtime.suffix=='.js':
              subprocess.run(['node','--check',str(runtime)],check=True)

          pkg=Path('spfx-build/config/package-solution.json')
          data=json.loads(pkg.read_text(encoding='utf-8'))
          old=data.get('solution',{}).get('version')
          if old!='1.3.6.126':
              raise SystemExit(f'041A: erwartete 040C-SPFx-Version 1.3.6.126, gefunden {old!r}.')
          data['solution']['version']='1.3.6.127'
          pkg.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('041A PATCH OK:',runtime)
