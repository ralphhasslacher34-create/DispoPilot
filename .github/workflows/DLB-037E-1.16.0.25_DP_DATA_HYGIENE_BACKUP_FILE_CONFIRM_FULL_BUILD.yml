name: DLB-037E-1.16.0.25 DP DATA HYGIENE BACKUP FILE CONFIRM FULL BUILD

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/DLB-037E-1.16.0.25_DP_DATA_HYGIENE_BACKUP_FILE_CONFIRM_FULL_BUILD.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Rebuild exact DLB-037D source
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY_RUN_037D_BASE'
          from pathlib import Path
          import subprocess
          import yaml

          wf=Path('.github/workflows/DLB-037D-1.16.0.24_DP_DATA_HYGIENE_BACKUP_READY_FIX_FULL_BUILD.yml')
          if not wf.exists():
              raise SystemExit('037E: 037D-Workflow fehlt im Repository.')

          doc=yaml.safe_load(wf.read_text(encoding='utf-8'))
          runs=[(s.get('name',''),s.get('run')) for s in doc['jobs']['build']['steps'] if s.get('run')]
          if len(runs)!=5:
              raise SystemExit(f'037E: 037D erwartet 5 ausführbare Schritte, gefunden {len(runs)}.')

          # Source-Rekonstruktion + 037D-Patch + 037D-Quellvalidierung.
          for idx,(name,script) in enumerate(runs[:3],1):
              print(f'===== 037E Basis 037D Schritt {idx}/3: {name} =====')
              runner=Path(f'.037e_037d_step_{idx}.sh')
              runner.write_text(script,encoding='utf-8',newline='\n')
              try:
                  subprocess.run(['bash','-euo','pipefail',str(runner)],check=True)
              finally:
                  runner.unlink(missing_ok=True)

          print('037E: DLB-037D-Quellstand vollständig rekonstruiert.')
          PY_RUN_037D_BASE

      - name: Confirm backup by real SharePoint file and promote to DLB-037E
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_PATCH_037E'
          from pathlib import Path
          import json
          import subprocess

          root=Path('spfx-build/src/webparts')
          files=[p for p in root.rglob('*') if p.is_file() and p.suffix in {'.js','.ts','.tsx'}]
          old_marker='DP_DLB_037D_1_16_0_24_DP_DATA_HYGIENE_BACKUP_READY_BEGIN'
          new_marker='DP_DLB_037E_1_16_0_25_DP_DATA_HYGIENE_BACKUP_FILE_CONFIRM_BEGIN'

          hits=[]
          for p in files:
              s=p.read_text(encoding='utf-8')
              if old_marker in s:
                  hits.append((p,s))
          if len(hits)!=1:
              raise SystemExit(f'037E: 037D-Runtime {len(hits)}x statt genau 1x gefunden.')

          runtime,src=hits[0]

          anchor='async function dp37aEnsureFreshBackup(){'
          start=src.find(anchor)
          end=src.find('function dp37aSchedule(',start)
          if start<0 or end<0 or end<=start:
              raise SystemExit('037E: 037D Backup-Bestätigungsblock nicht eindeutig gefunden.')

          replacement=r"""function dp37eWebUrl(){
              if(typeof SPStore==='undefined'||!SPStore||typeof SPStore.listApi!=='function')return '';
              const listApi=String(SPStore.listApi()||'');
              const marker='/_api/web/lists/getbytitle(';
              const pos=listApi.indexOf(marker);
              return pos>0?listApi.slice(0,pos):'';
            }
            async function dp37eLatestBackupFile(){
              if(typeof SPStore==='undefined'||!SPStore||typeof SPStore.request!=='function')return null;
              const web=dp37eWebUrl();
              if(!web)return null;
              const url=web+"/_api/web/lists/getbytitle('DispoLux_Backup')/RootFolder/Files?$select=Name,TimeCreated,TimeLastModified,Length&$top=5000";
              const headers={
                'Accept':'application/json;odata=nometadata',
                'Cache-Control':'no-cache, no-store, max-age=0',
                'Pragma':'no-cache',
                'Expires':'0'
              };
              const j=await SPStore.request(url,{headers,cache:'no-store'});
              const rows=Array.isArray(j&&j.value)?j.value:(Array.isArray(j&&j.d&&j.d.results)?j.d.results:[]);
              const files=rows
                .filter(x=>String(x&&x.Name||'').startsWith('DP_Data_')&&String(x&&x.Name||'').endsWith('.json'))
                .map(x=>({
                  name:String(x.Name||''),
                  when:Date.parse(String(x.TimeLastModified||x.TimeCreated||''))||0,
                  length:Number(x.Length||0)
                }))
                .filter(x=>x.when>0)
                .sort((a,b)=>b.when-a.when);
              return files[0]||null;
            }
            async function dp37eBackupFileFresh(maxAgeMs){
              try{
                const f=await dp37eLatestBackupFile();
                if(!f)return false;
                const age=dp37aNow()-f.when;
                const fresh=age>=0&&age<maxAgeMs&&f.length>0;
                if(fresh){
                  try{window.__DISPOLUX_037E_LAST_BACKUP_FILE=f;}catch(_){}
                }
                return fresh;
              }catch(e){
                console.warn('DLB-037E: direkte Backup-Dateiprüfung fehlgeschlagen',e);
                return false;
              }
            }
            async function dp37aEnsureFreshBackup(){
              if(dp37aBackupStatusFresh(35*60*1000))return true;
              if(await dp37eBackupFileFresh(35*60*1000))return true;

              const ready=await dp37aWaitBackupApi(30000);
              if(!ready){
                // Auch ohne Window-Status ist eine tatsächlich vorhandene frische
                // JSON-Datei ein gültiger Sicherungsnachweis.
                return await dp37eBackupFileFresh(35*60*1000);
              }

              if(dp37aBackupStatusFresh(35*60*1000))return true;
              if(await dp37eBackupFileFresh(35*60*1000))return true;

              try{
                await window.dpDispoLuxBackupNow();
              }catch(e){
                console.warn('DLB-037E: manuelle Sicherung meldete Fehler; tatsächliche Backup-Datei wird trotzdem geprüft',e);
              }

              for(let i=0;i<30;i++){
                if(dp37aBackupStatusFresh(10*60*1000))return true;
                if(await dp37eBackupFileFresh(10*60*1000))return true;
                await dp37aSleep(500);
              }
              return false;
            }
            """

          src=src[:start]+replacement+src[end:]

          old_wait="dp37aBanner('DP_Data noch nicht bereinigt: Dateisicherung ist noch nicht bestätigt. Neuer Versuch erfolgt automatisch.',true);"
          new_wait="dp37aBanner('DP_Data noch nicht bereinigt: Sicherungsdatei konnte noch nicht bestätigt werden. Neuer Versuch erfolgt automatisch.',true);"
          if src.count(old_wait)!=1:
              raise SystemExit(f'037E: erwarteter 037D-Wartehinweis {src.count(old_wait)}x statt 1x gefunden.')
          src=src.replace(old_wait,new_wait,1)

          replacements={
              'DP_DLB_037D_1_16_0_24_DP_DATA_HYGIENE_BACKUP_READY_BEGIN':'DP_DLB_037E_1_16_0_25_DP_DATA_HYGIENE_BACKUP_FILE_CONFIRM_BEGIN',
              'DP_DLB_037D_1_16_0_24_DP_DATA_HYGIENE_BACKUP_READY_END':'DP_DLB_037E_1_16_0_25_DP_DATA_HYGIENE_BACKUP_FILE_CONFIRM_END',
              '__DISPOLUX_037D':'__DISPOLUX_037E',
              "version:'1.16.0.24'":"version:'1.16.0.25'",
              'DLB-037D':'DLB-037E',
          }
          for old,new in replacements.items():
              src=src.replace(old,new)

          if old_marker in src or '__DISPOLUX_037D' in src or "version:'1.16.0.24'" in src:
              raise SystemExit('037E: alte 037D-Laufzeitkennung blieb nach Promotion erhalten.')
          if new_marker not in src or '__DISPOLUX_037E' not in src or "version:'1.16.0.25'" not in src:
              raise SystemExit('037E: neue Laufzeitkennung unvollständig.')

          runtime.write_text(src,encoding='utf-8',newline='\n')
          if runtime.suffix=='.js':
              subprocess.run(['node','--check',str(runtime)],check=True)

          pkg=Path('spfx-build/config/package-solution.json')
          data=json.loads(pkg.read_text(encoding='utf-8'))
          if data.get('solution',{}).get('version')!='1.3.6.118':
              raise SystemExit('037E: erwartete 037D-SPFx-Version 1.3.6.118 fehlt.')
          data['solution']['version']='1.3.6.119'
          pkg.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          print('037E: tatsächliche JSON-Backup-Datei wird jetzt als Sicherungsnachweis geprüft.')
          PY_PATCH_037E

      - name: Validate 037E source before build
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_VALIDATE_037E'
          from pathlib import Path
          import json,re,subprocess

          root=Path('spfx-build/src/webparts')
          files=[p for p in root.rglob('*') if p.is_file() and p.suffix in {'.js','.ts','.tsx'}]
          begin='DP_DLB_037E_1_16_0_25_DP_DATA_HYGIENE_BACKUP_FILE_CONFIRM_BEGIN'
          end='DP_DLB_037E_1_16_0_25_DP_DATA_HYGIENE_BACKUP_FILE_CONFIRM_END'
          hits=[]; combined=[]
          for p in files:
              s=p.read_text(encoding='utf-8')
              combined.append(s)
              if begin in s:
                  hits.append((p,s))
          if len(hits)!=1:
              raise SystemExit(f'037E VALIDIERUNG: Patch {len(hits)}x statt genau 1x gefunden.')

          runtime,src=hits[0]
          if src.count(begin)!=1 or src.count(end)!=1:
              raise SystemExit('037E VALIDIERUNG: Patchmarker nicht eindeutig.')
          frag=src.split(begin,1)[1].split(end,1)[0]
          all_text='\n'.join(combined)

          required=[
              "version:'1.16.0.25'",
              'dp37eWebUrl',
              'dp37eLatestBackupFile',
              'dp37eBackupFileFresh',
              "getbytitle('DispoLux_Backup')/RootFolder/Files",
              "startsWith('DP_Data_')",
              "endsWith('.json')",
              'TimeLastModified',
              'f.length>0',
              'await dp37eBackupFileFresh(35*60*1000)',
              'await dp37eBackupFileFresh(10*60*1000)',
              'dp37aEnsureFreshBackup',
              "dp37aQueryPrefix('DPB|')",
              "dp37aQueryPrefix('DP|dispoNotices|')",
              "dp37aQueryPrefix('DP|orders|')",
              'dp37aNoticeRetentionMs=72*60*60*1000',
              'dp37aArchiveKey',
              'exactArchive',
              'dp37aOutboxPending',
              'Sicherungsdatei konnte noch nicht bestätigt werden',
          ]
          missing=[x for x in required if x not in frag and x not in all_text]
          if missing:
              raise SystemExit('037E VALIDIERUNG: Pflichtbestandteile fehlen: '+', '.join(missing))

          safety=[
              'o.archivedAt',
              'dp37aFinalStatus(o.status)',
              'exactArchive.has(dp37aArchiveKey(o))',
              'backupOk=await dp37aEnsureFreshBackup()',
          ]
          missing=[x for x in safety if x not in frag]
          if missing:
              raise SystemExit('037E VALIDIERUNG: Sicherheitsregel fehlt: '+', '.join(missing))

          basis=[
              'DP_DLB_036D_1_16_0_20_OFFLINE_OUTBOX_SYNC_BEGIN',
              'DP_DLB_035B_1_16_0_16_AUFTRAG_KONTAKT_MEHRMULDEN_MATERIAL_BEGIN',
              'DP_DLB_034D_1_16_0_15_DP_DATA_STAMMDATEN_PERSISTENZ_BEGIN',
              'DP_DLB_030AH_1_12_1_27_BACKUP_30MIN_FILES_BEGIN',
              'DispoLux:036D:offlineOutbox:v1',
              'DispoLux_Backup',
              'warehouses','transportLocations','plannedBinMaterials','actualBinMaterials',
          ]
          missing=[x for x in basis if x not in all_text]
          if missing:
              raise SystemExit('037E VALIDIERUNG: bewährte Basis unvollständig: '+', '.join(missing))

          if any(x in all_text for x in ['__DISPOLUX_037A','__DISPOLUX_037B','__DISPOLUX_037C','__DISPOLUX_037D']):
              raise SystemExit('037E VALIDIERUNG: alte 037A-037D-Laufzeitkennung noch aktiv.')
          if 'await dp28dBackup(fields, rows, force);' in all_text:
              raise SystemExit('037E VALIDIERUNG: alter DPB-Schreibaufruf wieder aktiv.')

          sections=list(re.finditer(r"sectionKeys\s*:\s*\[([^\]]*)\]",src))
          if not sections:
              raise SystemExit('037E VALIDIERUNG: keine sectionKeys gefunden.')
          for idx,m in enumerate(sections,1):
              keys=set(re.findall(r"['\"]([^'\"]+)['\"]",m.group(1)))
              miss=[k for k in ('warehouses','transportLocations') if k not in keys]
              if miss:
                  raise SystemExit(f'037E VALIDIERUNG: sectionKeys #{idx} unvollständig: {miss}')

          pkg=json.loads(Path('spfx-build/config/package-solution.json').read_text(encoding='utf-8'))
          if pkg.get('solution',{}).get('version')!='1.3.6.119':
              raise SystemExit('037E VALIDIERUNG: SPFx-Version ist nicht 1.3.6.119.')
          if runtime.suffix=='.js':
              subprocess.run(['node','--check',str(runtime)],check=True)

          print('037E VALIDIERUNG OK')
          print('- Backup-Bestätigung zusätzlich über reale Datei in DispoLux_Backup')
          print('- nur frische, nichtleere DP_Data_*.json-Datei gilt als bestätigt')
          print('- Archiv-/Offline-/72h-Sicherheitsregeln erhalten')
          PY_VALIDATE_037E

      - name: Build and package 037E
        shell: bash
        run: |
          set -euo pipefail
          rm -rf spfx-build/release spfx-build/temp/deploy spfx-build/sharepoint/solution
          (cd spfx-build && npx heft build --production)
          (cd spfx-build && npx heft package-solution --production)

          rm -rf artifact/UPLOAD_TO_SITEASSETS artifact/UPLOAD_TO_APP_CATALOG
          mkdir -p artifact/UPLOAD_TO_SITEASSETS artifact/UPLOAD_TO_APP_CATALOG

          PKG=$(find spfx-build/sharepoint/solution -maxdepth 1 -type f -name '*.sppkg' | head -n1)
          test -n "$PKG"
          cp "$PKG" artifact/UPLOAD_TO_APP_CATALOG/DispoPilot_Online_V1.3_SPFX_FINAL.sppkg

          if [ -d spfx-build/release/assets ]; then
            cp -a spfx-build/release/assets/. artifact/UPLOAD_TO_SITEASSETS/
          elif [ -d spfx-build/temp/deploy ]; then
            cp -a spfx-build/temp/deploy/. artifact/UPLOAD_TO_SITEASSETS/
          else
            echo '037E: Keine SPFx Asset-Ausgabe gefunden.' >&2
            exit 1
          fi

          if [ -f .dpx14_icon_b64 ]; then
            python3 - <<'PY_ICON_037E'
          from pathlib import Path
          import base64
          Path('artifact/UPLOAD_TO_SITEASSETS/DispoLux_DL_Icon_48.png').write_bytes(
              base64.b64decode(Path('.dpx14_icon_b64').read_text().strip())
          )
          PY_ICON_037E
          fi

      - name: Validate emitted 037E package
        shell: bash
        run: |
          set -euo pipefail

          COUNT=0
          while IFS= read -r -d '' JS; do
            test -s "$JS"
            node --check "$JS"
            COUNT=$((COUNT+1))
          done < <(find artifact/UPLOAD_TO_SITEASSETS -maxdepth 1 -type f -name '*.js' -print0)
          test "$COUNT" -gt 0
          test -s artifact/UPLOAD_TO_APP_CATALOG/DispoPilot_Online_V1.3_SPFX_FINAL.sppkg

          python3 - <<'PY_FINAL_037E'
          from pathlib import Path
          import re

          assets=Path('artifact/UPLOAD_TO_SITEASSETS')
          js=list(assets.glob('*.js'))
          current=[]
          for p in js:
              s=p.read_text(encoding='utf-8')
              if '__DISPOLUX_037E' in s:
                  current.append((p,s))
          if len(current)!=1:
              raise SystemExit(f'037E FINAL: aktueller Produktionsbundle {len(current)}x statt 1x gefunden: {[p.name for p,_ in current]}')

          p,s=current[0]
          required=[
              '__DISPOLUX_036D',
              '__DISPOLUX_037E',
              'DispoLux:036D:offlineOutbox:v1',
              'DispoLux_Backup',
              'RootFolder/Files',
              'DP_Data_',
              '.json',
              'Sicherungsdatei konnte noch nicht bestätigt werden',
              'DP_Data bereinigt',
              'DP|dispoNotices|',
              'DP|orders|',
              'DPB|',
              'warehouses',
              'transportLocations',
              'plannedBinMaterials',
              'actualBinMaterials',
              'Telefon Baustelle',
              'Standort setzen',
          ]
          missing=[x for x in required if x not in s]
          if missing:
              raise SystemExit('037E FINAL: Pflichtbestandteile fehlen: '+', '.join(missing))

          if any(x in s for x in ['__DISPOLUX_037A','__DISPOLUX_037B','__DISPOLUX_037C','__DISPOLUX_037D']):
              raise SystemExit('037E FINAL: alte 037A-037D-Laufzeitkennung im Produktionsbundle gefunden.')

          sections=list(re.finditer(r"sectionKeys\s*:\s*\[([^\]]*)\]",s))
          if not sections:
              raise SystemExit('037E FINAL: keine sectionKeys gefunden.')
          for idx,m in enumerate(sections,1):
              keys=set(re.findall(r"['\"]([^'\"]+)['\"]",m.group(1)))
              miss=[k for k in ('warehouses','transportLocations') if k not in keys]
              if miss:
                  raise SystemExit(f'037E FINAL: sectionKeys #{idx} unvollständig: {miss}')

          stale=[]
          for q in js:
              if q==p:
                  continue
              x=q.read_text(encoding='utf-8')
              if 'sectionKeys' in x and 'DP_Data' in x:
                  stale.append(q.name)
          if stale:
              raise SystemExit('037E FINAL: alte DP_Data-WebPart-Bundles im Auslieferungsordner: '+repr(stale))

          print('037E FINAL OK')
          print('- 036D Offline-Outbox erhalten')
          print('- sichere DP_Data-Bereinigung erhalten')
          print('- Backup wird durch reale frische JSON-Datei bestätigt')
          PY_FINAL_037E

          cat > artifact/REIHENFOLGE.txt <<'TXT'
          DLB-037E-1.16.0.25 · DP_DATA HYGIENE / BACKUP-DATEI DIREKT BESTÄTIGEN · SPFx 1.3.6.119

          Basis:
          - grüner/installierter DLB-037D-1.16.0.24
          - 036D Offline-Outbox und sichere Bereinigungsregeln bleiben erhalten

          Reparatur:
          - Die Backup-Bibliothek wird nicht mehr nur über den flüchtigen window-Status beurteilt.
          - 037E prüft DispoLux_Backup direkt in SharePoint.
          - Nur eine frische, nichtleere DP_Data_*.json-Datei gilt als Sicherungsnachweis.
          - Nach manueller Sicherung wird sowohl Status als auch reale Datei geprüft.
          - Ohne reale/anderweitig bestätigte Sicherung wird weiterhin nichts gelöscht.

          Praxistest:
          1. 037E installieren und DispoLux online öffnen.
          2. Nach frischer Sicherung muss der rote Wartehinweis verschwinden.
          3. Danach muss die DP_Data-Bereinigung starten.
          4. DP_Data-Anzahl prüfen und anschließend aktuelle Aufträge/Stammdaten/Archiv kontrollieren.
          TXT

          cat > artifact/DISPOLUX_THEMENREGISTER_ERGAENZUNG_037E.csv <<'CSV'
          Bereich;Änderung;Build;Status
          DP_Data / Sicherheit;Backup zusätzlich direkt über reale JSON-Datei in DispoLux_Backup bestätigen;DLB-037E;Umgesetzt
          DP_Data / Sicherheit;Nur frische nichtleere DP_Data_*.json-Datei als Sicherungsnachweis akzeptieren;DLB-037E;Umgesetzt
          DP_Data / Sicherheit;Ohne bestätigte Sicherungsdatei weiterhin keine Löschung;DLB-037E;Umgesetzt
          CSV

          echo '037E: Produktions-JS syntaktisch gültig; SPPKG vorhanden; reale Backup-Dateiprüfung und sichere DP_Data-Hygiene geprüft.'

      - name: Upload DLB-037E artifact
        uses: actions/upload-artifact@v4
        with:
          name: DLB-037E-1.16.0.25-DP-DATA-HYGIENE-BACKUP-FILE-CONFIRM-SPFX-1.3.6.119
          path: artifact/
          if-no-files-found: error
