          grep -q "DP_K1F_SELECTED_CUSTOMER_BEGIN" dispopilot-online-efd-base.html
          grep -q "dpK1FOrderOpen" dispopilot-online-efd-base.html
          grep -q "dpK1BBaseOpenSite.apply(this,dpK1FArgs)" dispopilot-online-efd-base.html

      - name: Apply DP Users authentication patch
