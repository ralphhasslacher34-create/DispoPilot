          DLB031C_PATCH

          python3 - <<'PY_PATCH_031C'
          from pathlib import Path
          import base64

          files = (
              list(Path("spfx-build/src/webparts").rglob("*.js")) +
              list(Path("spfx-build/src/webparts").rglob("*.ts")) +
              list(Path("spfx-build/src/webparts").rglob("*.tsx"))
          )
          end_marker = "/* DP13_PATCH_END */"
          runtime_required = [
              "DP_K1B_BAUSTELLENADRESSE_BEGIN",
              "DP_X10_BEMERKUNGEN_RAPPORT_BEGIN"
          ]
          ah_marker = "DP_DLB_030AH_1_12_1_27_BACKUP_30MIN_FILES_BEGIN"

          # 030AH-Backup sitzt im SPFx-Hostcode, die eigentliche DispoLux-Runtime in app-runtime.js.
          # Deshalb 030AH global prüfen, aber NICHT fälschlich im Runtime-File verlangen.
          if not any(ah_marker in p.read_text(encoding="utf-8") for p in files):
              raise SystemExit("031C: 030AH-Basis global nicht gefunden: " + ah_marker)

          candidates = []
          for p in files:
              s = p.read_text(encoding="utf-8")
              if end_marker in s and all(x in s for x in runtime_required):
                  candidates.append(p)
          if len(candidates) != 1:
              raise SystemExit(f"031C: erwartete genau eine Runtime-Datei, gefunden: {[str(x) for x in candidates]}")

          p = candidates[0]
          s = p.read_text(encoding="utf-8")
          if "DP_DLB_031C_1_16_0_2_STANDORTE_NAVIGATION_BEGIN" in s:
              raise SystemExit("031C: Patch bereits vorhanden.")
          if s.count(end_marker) != 1:
              raise SystemExit(f"031C: DP13-Endmarker {s.count(end_marker)}x statt 1x.")
          for item in runtime_required:
              if item not in s:
                  raise SystemExit("031C: Runtime-Basis fehlt: " + item)

          patch = base64.b64decode(Path('/tmp/dlb031c_patch.b64').read_text().encode()).decode('utf-8')
          s = s.replace(end_marker, patch + "\n\n" + end_marker, 1)
          p.write_text(s, encoding="utf-8", newline="\n")
          print("031C gepatcht:", p)
          PY_PATCH_031C

      - name: Set 031C SPFx version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_VER_031C'
          from pathlib import Path
          p = Path("spfx-build/config/package-solution.json")
          s = p.read_text(encoding="utf-8")
          if "1.3.6.92" not in s:
              raise SystemExit("031C: erwartete 030AH-SPFx-Version 1.3.6.92 fehlt.")
          p.write_text(s.replace("1.3.6.92", "1.3.6.96", 1), encoding="utf-8", newline="\n")
          PY_VER_031C

      - name: Validate 031C source before build
        shell: bash
        run: |
          set -euo pipefail
          grep -R -Fq 'DP_DLB_030AH_1_12_1_27_BACKUP_30MIN_FILES_BEGIN' spfx-build/src/webparts
          grep -R -Fq 'DP_DLB_031C_1_16_0_2_STANDORTE_NAVIGATION_BEGIN' spfx-build/src/webparts
          grep -R -Fq "id='cMapsUrlWrap'" spfx-build/src/webparts || grep -R -Fq "cMapsUrlWrap" spfx-build/src/webparts
          grep -R -Fq 'dp31CSiteQrButton' spfx-build/src/webparts
          grep -R -Fq 'BarcodeDetector' spfx-build/src/webparts
          grep -R -Fq 'navigator.geolocation.getCurrentPosition' spfx-build/src/webparts
          grep -R -Fq 'GPS-Punkt setzen' spfx-build/src/webparts
          grep -R -Fq 'Navigation zur Baustelle' spfx-build/src/webparts
          grep -R -Fq '__DISPOLUX_031C' spfx-build/src/webparts
          grep -Fq '1.3.6.96' spfx-build/config/package-solution.json
          ! grep -R -Fq 'DP_DLB_030AI_1_16_0_0_STANDORTE_NAVIGATION_BEGIN' spfx-build/src/webparts
          ! grep -R -Fq 'DP_DLB_030AJ_1_16_0_1_STANDORTE_NAVIGATION_BEGIN' spfx-build/src/webparts
          ! grep -R -Fq 'DP_DLB_030AK_1_16_0_2_STANDORTE_NAVIGATION_BEGIN' spfx-build/src/webparts
          ! grep -R -Fq 'DP_DLB_030AL_1_16_0_3_STANDORTE_NAVIGATION_BEGIN' spfx-build/src/webparts
          python3 - <<'PY_VALIDATE_031C_NO_OBSERVER'
          from pathlib import Path
          begin='DP_DLB_031C_1_16_0_2_STANDORTE_NAVIGATION_BEGIN'
          end='DP_DLB_031C_1_16_0_2_STANDORTE_NAVIGATION_END'
          hits=[]
          for p in Path('spfx-build/src/webparts').rglob('*'):
              if not p.is_file() or p.suffix not in {'.js','.ts','.tsx'}: continue
              s=p.read_text(encoding='utf-8')
              if begin in s:
                  frag=s.split(begin,1)[1].split(end,1)[0]
                  if 'new MutationObserver' in frag or 'dp31CRefreshUi' in frag:
                      hits.append(str(p))
          if hits:
              raise SystemExit('031C: eigener Start-/DOM-Observer gefunden: '+', '.join(hits))
          print('031C: kein eigener MutationObserver im Standort-Patch.')
          PY_VALIDATE_031C_NO_OBSERVER

      - name: Build and package 031C
        shell: bash
        run: |
          set -euo pipefail
          (cd spfx-build && npx heft build --production)
          (cd spfx-build && npx heft package-solution --production)

          rm -rf artifact/UPLOAD_TO_SITEASSETS artifact/UPLOAD_TO_APP_CATALOG
          mkdir -p artifact/UPLOAD_TO_SITEASSETS artifact/UPLOAD_TO_APP_CATALOG
          PKG=$(find spfx-build/sharepoint/solution -maxdepth 1 -type f -name '*.sppkg' | head -n1)
          test -n "$PKG"
          cp "$PKG" artifact/UPLOAD_TO_APP_CATALOG/DispoPilot_Online_V1.3_SPFX_FINAL.sppkg

          if [ -d spfx-build/release/assets ]; then
            cp -a spfx-build/release/assets/. artifact/UPLOAD_TO_SITEASSETS/
          elif [ -d spfx-build/temp/deploy ]; then
            cp -a spfx-build/temp/deploy/. artifact/UPLOAD_TO_SITEASSETS/
          else
            echo "031C: Keine SPFx Asset-Ausgabe gefunden." >&2
            exit 1
          fi

          if [ -f .dpx14_icon_b64 ]; then
            python3 - <<'PY_ICON_031C'
          from pathlib import Path
          import base64
          Path("artifact/UPLOAD_TO_SITEASSETS/DispoLux_DL_Icon_48.png").write_bytes(base64.b64decode(Path(".dpx14_icon_b64").read_text().strip()))
          PY_ICON_031C
          fi

      - name: Validate emitted 031C package
        shell: bash
        run: |
          set -euo pipefail
          COUNT=0
          while IFS= read -r -d '' JS; do
            test -s "$JS"
            node --check "$JS"
            COUNT=$((COUNT+1))
          done < <(find artifact/UPLOAD_TO_SITEASSETS -maxdepth 1 -type f -name '*.js' -print0)
          test "$COUNT" -gt 0

          PKG=artifact/UPLOAD_TO_APP_CATALOG/DispoPilot_Online_V1.3_SPFX_FINAL.sppkg
          test -s "$PKG"
          grep -R -Fq 'GPS-Punkt setzen' artifact/UPLOAD_TO_SITEASSETS
          grep -R -Fq 'Navigation zur Baustelle' artifact/UPLOAD_TO_SITEASSETS

          echo "031C: Produktions-JS syntaktisch gültig, Standortfunktionen enthalten und SPPKG vorhanden."

          cat > artifact/REIHENFOLGE.txt <<'TXT'
          DLB-031C-1.16.0.2 · STANDORTE / NAVIGATION · SPFx 1.3.6.96

          Basis: DIREKT DLB-030AH-1.12.1.27 (AK wird NICHT als Basis verwendet).

          HT 16 – Standorte / Navigation:
          - AL enthält keinen eigenen MutationObserver und greift nicht in den Start-/DP_Data-Ladevorgang ein.
          - Kunden-/Rechnungsadresse: Handeingabe oder Maps-Link.
          - Baustellenadresse: Handeingabe, Maps-Link oder QR-Code.
          - QR-Code wird clientseitig gelesen; Maps-/Standort-Link oder erkennbare Adresse wird in die vorhandenen Baustellenfelder übernommen.
          - Navigation zur Baustelle: vorhandene Baustellen-Schaltfläche öffnet den gespeicherten Maps-Link; falls keiner vorhanden ist, wird aus der postalischen Baustellenadresse ein Google-Maps-Navigationsziel erzeugt.
          - Muldenstandort: ausschließlich über „GPS-Punkt setzen“ in DispoLux. Gespeichert werden Breite/Länge, Genauigkeit, Zeitpunkt und Benutzer an der Mulde.
          - GPS-Schaltfläche steht im Muldenstamm und direkt am Auftrag für die dort zugeordneten Mulden zur Verfügung.
          - Keine manuelle GPS-Koordinateneingabe und kein QR-/Maps-Eingabeweg für den Muldenstandort.
          - Die bisher gesperrte Mulden-GPS-Erweiterung im Baustellenadressfenster wird ausgeblendet, damit keine doppelte Bedienlogik entsteht.

          Unverändert übernommen:
          - DLB-030AH Dateisicherung in DispoLux_Backup alle 30 Minuten, 54 h Aufbewahrung.
          - DP_Data bleibt frei von DPB|-Backupdatensätzen.
          - Bestehende Auftrags-, Arbeitszeit-, Mulden-, Dokument- und Benutzerlogik bleibt Basis.

          Test 031C:
          0. Starttest: DispoLux muss bis zum Hauptmenü laden; DP_Data-Ladehinweis muss verschwinden.
          1. Kundenadresse: manuell speichern; Maps-Link speichern; nach erneutem Öffnen prüfen.
          2. Baustelle: manuelle Adresse speichern; Maps-Link speichern; QR-Bild mit Maps-Link einlesen; QR-Bild mit Adresse einlesen.
          3. Auftrag öffnen: „Navigation zur Baustelle“ muss direkt Maps öffnen; ohne Maps-Link muss die postalische Baustellenadresse verwendet werden.
          4. Mulde im Muldenstamm öffnen: „GPS-Punkt setzen“ drücken, Standortfreigabe erteilen, Punkt speichern und „Anzeigen“ prüfen.
          5. Auftrag mit zugeordneter Mulde öffnen: GPS-Punkt für die richtige Mulde setzen und danach erneut öffnen.
          6. Aufträge, Arbeitszeiten, Muldenbewegungen und 30-Minuten-Backup gegenprüfen.

          Installation wie bisher:
          1. UPLOAD_TO_SITEASSETS
          2. UPLOAD_TO_APP_CATALOG/DispoPilot_Online_V1.3_SPFX_FINAL.sppkg
          3. DispoLux auf allen Geräten/Tabs vollständig schließen und frisch öffnen.
          TXT

