name: Build DispoPilot SPFx USERS V2

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'dispopilot-online-app.html'
      - 'prepare-spfx-final.py'
      - 'patch-dp-users-v2.py'
      - '.github/workflows/build-spfx-users-v2.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Check helpers
        run: |
          python3 -m py_compile prepare-spfx-final.py
          python3 -m py_compile patch-dp-users-v2.py
          grep -q "DispoPilot SPFx FINAL JSONC v1" prepare-spfx-final.py
          grep -q "DISPOPILOT_DP_USERS_AUTH_V2" patch-dp-users-v2.py

      - name: Create authenticated app source
        run: |
          python3 patch-dp-users-v2.py \
            --input dispopilot-online-app.html \
            --output dispopilot-online-users.html
          grep -q "DISPOPILOT_DP_USERS_AUTH_V2" dispopilot-online-users.html
          grep -q "DP_Users" dispopilot-online-users.html

      - name: Install SPFx CLI
        run: npm install -g @microsoft/spfx-cli@latest

      - name: Scaffold SPFx web part
        run: |
          rm -rf spfx-build
          spfx create \
            --template webpart-noframework \
            --library-name dispopilot-online-v13 \
            --component-name "DispoPilot Online" \
            --component-alias DispoPilotOnline \
            --component-description "DispoPilot Online V1.3.5" \
            --solution-name dispopilot-online-v13 \
            --target-dir spfx-build \
            --package-manager npm

      - name: Insert DispoPilot runtime
        run: |
          python3 prepare-spfx-final.py \
            --app dispopilot-online-users.html \
            --project spfx-build

      - name: Enable FullPage and set version
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifests=list(Path("spfx-build/src/webparts").rglob("*.manifest.json"))
          if not manifests:
              raise SystemExit("Kein Webpart-Manifest gefunden.")
          for manifest in manifests:
              data=json.loads(manifest.read_text(encoding="utf-8"))
              hosts=data.setdefault("supportedHosts",[])
              for host in ("SharePointWebPart","SharePointFullPage"):
                  if host not in hosts: hosts.append(host)
              manifest.write_text(json.dumps(data,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          package=Path("spfx-build/config/package-solution.json")
          pdata=json.loads(package.read_text(encoding="utf-8"))
          pdata["solution"]["version"]="1.3.5.0"
          package.write_text(json.dumps(pdata,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print("Paketversion: 1.3.5.0")
          PY

      - name: Verify build inputs
        run: |
          grep -R '"SharePointFullPage"' spfx-build/src/webparts
          grep -n '"version": "1.3.5.0"' spfx-build/config/package-solution.json
          grep -R "DP_Users" spfx-build/src/webparts

      - name: Build production bundle
        working-directory: spfx-build
        run: npx heft build --production

      - name: Package SharePoint solution
        working-directory: spfx-build
        run: npx heft package-solution --production

      - name: Collect package with existing catalog filename
        run: |
          mkdir -p artifact
          PKG=$(find spfx-build/sharepoint/solution -maxdepth 1 -type f -name '*.sppkg' | head -n 1)
          test -n "$PKG"
          cp "$PKG" artifact/DispoPilot_Online_V1.3_SPFX_FINAL.sppkg
          ls -lh artifact/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DispoPilot-Online-V1.3.5-USERS-V2
          path: artifact/DispoPilot_Online_V1.3_SPFX_FINAL.sppkg
          if-no-files-found: error
