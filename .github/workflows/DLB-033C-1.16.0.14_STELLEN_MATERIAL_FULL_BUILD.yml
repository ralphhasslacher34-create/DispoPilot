name: DLB-033C-1.16.0.14 STELLEN MATERIAL FULL BUILD

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Rebuild exact DLB-032E basis
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY_RUN_032E_BASE'
          from pathlib import Path
          import subprocess
          import yaml

          wf=Path(".github/workflows/DLB-032E-1.16.0.11_FAHRERAUSWAHL_STABIL_FULL_BUILD.yml")
          if not wf.exists():
              raise SystemExit("033C: erfolgreicher 032E-Workflow fehlt im Repository.")

          doc=yaml.safe_load(wf.read_text(encoding="utf-8"))
          runs=[(s.get("name",""),s.get("run")) for s in doc["jobs"]["build"]["steps"] if s.get("run")]
          if not runs:
              raise SystemExit("033C: keine ausführbaren 032E-Buildschritte gefunden.")

          for idx,(name,script) in enumerate(runs,1):
              print(f"===== 033C Basis 032E Schritt {idx}/{len(runs)}: {name} =====")
              runner=Path(f".033c_032e_step_{idx}.sh")
              runner.write_text(script,encoding="utf-8",newline="\n")
              try:
                  subprocess.run(["bash","-euo","pipefail",str(runner)],check=True)
              finally:
                  runner.unlink(missing_ok=True)

          print("033C: erfolgreicher 032E-Stand vollständig rekonstruiert.")
          PY_RUN_032E_BASE

