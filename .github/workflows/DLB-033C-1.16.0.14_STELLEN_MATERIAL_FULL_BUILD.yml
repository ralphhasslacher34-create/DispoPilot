          DLB033C_PATCH

          python3 - <<'PY_PATCH_033C'
          from pathlib import Path
          import base64

          files=(
              list(Path("spfx-build/src/webparts").rglob("*.js")) +
              list(Path("spfx-build/src/webparts").rglob("*.ts")) +
              list(Path("spfx-build/src/webparts").rglob("*.tsx"))
          )
          base_marker="DP_DLB_032E_1_16_0_11_TD005_FAHRERAUSWAHL_BEGIN"
          new_marker="DP_DLB_033C_1_16_0_14_STELLEN_MATERIAL_BEGIN"
          end_marker="/* DP13_PATCH_END */"

          candidates=[]
          for p in files:
              src=p.read_text(encoding="utf-8")
              if (
                  base_marker in src
                  and end_marker in src
                  and "function dpR1MaterialOptions" in src
                  and "function editOrder" in src
                  and "function saveOrder" in src
                  and "function orderCard" in src
                  and "function openDetail" in src
              ):
                  candidates.append(p)

          if len(candidates)!=1:
              raise SystemExit(
                  "033C: erwartete genau eine 032E-Runtime mit Stellen/Material-Logik, gefunden: "
                  + str([str(x) for x in candidates])
              )

          p=candidates[0]
          src=p.read_text(encoding="utf-8")
          if new_marker in src:
              raise SystemExit("033C: Patch bereits vorhanden.")
          if src.count(end_marker)!=1:
              raise SystemExit(f"033C: DP13-Endmarker {src.count(end_marker)}x statt 1x.")

          patch=base64.b64decode(Path("/tmp/dlb033c_patch.b64").read_text().encode()).decode("utf-8")
          if "DP_DLB_033C_1_16_0_14_STELLEN_MATERIAL_BEGIN" not in patch:
              raise SystemExit("033C: Patch-Beginmarker fehlt im dekodierten Patch.")
          if "DP_DLB_033C_1_16_0_14_STELLEN_MATERIAL_END" not in patch:
              raise SystemExit("033C: Patch-Endmarker fehlt im dekodierten Patch.")

          src=src.replace(end_marker,patch+"\n\n"+end_marker,1)
          p.write_text(src,encoding="utf-8",newline="\n")
          print("033C Stellen/Material gepatcht:",p)
          PY_PATCH_033C

      - name: Set 033C SPFx version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_VER_033C'
          from pathlib import Path
          p=Path("spfx-build/config/package-solution.json")
          src=p.read_text(encoding="utf-8")
          if "1.3.6.105" not in src:
              raise SystemExit("033C: erwartete 032E-SPFx-Version 1.3.6.105 fehlt.")
          p.write_text(src.replace("1.3.6.105","1.3.6.108",1),encoding="utf-8",newline="\n")
          PY_VER_033C

      - name: Validate 033C source before build
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_VALIDATE_033C'
          from pathlib import Path
          import json
          import subprocess

          root=Path("spfx-build/src/webparts")
          files=[p for p in root.rglob("*") if p.is_file() and p.suffix in {".js",".ts",".tsx"}]
          begin="DP_DLB_033C_1_16_0_14_STELLEN_MATERIAL_BEGIN"
          end="DP_DLB_033C_1_16_0_14_STELLEN_MATERIAL_END"
          hits=[]
          for p in files:
              src=p.read_text(encoding="utf-8")
              if begin in src:
                  hits.append((p,src))

          if len(hits)!=1:
              raise SystemExit(f"033C VALIDIERUNG: Patch in {len(hits)} Dateien statt genau 1 gefunden: {[str(p) for p,_ in hits]}")

          runtime,src=hits[0]
          if end not in src:
              raise SystemExit("033C VALIDIERUNG: Endmarker fehlt.")
          frag=src.split(begin,1)[1].split(end,1)[0]

          required=[
              "dp33StellenMaterialOptions",
              "dp33SetStellenMaterial",
              "dp33BaseTaskChanged",
              "dp33BaseEditOrder",
              "dp33BaseSaveOrder",
              "dp33BaseOrderCard",
              "dp33BaseOpenDetail",
              "Geplantes Material",
              '<option value="">Leer</option>',
              "state?.materials",
              "targetTask==='Stellen'",
              "dp33SetStellenMaterial('')",
              "dp33DisplayMaterial",
              "dp33StellenMaterialDetail",
              "__DISPOLUX_033C",
          ]
          missing=[x for x in required if x not in frag]
          if missing:
              raise SystemExit("033C VALIDIERUNG: Pflichtbestandteile fehlen: "+", ".join(missing))

          forbidden=[
              "$('oMaterial').value='Leer'",
              'o.material="Leer"',
              "o.material='Leer'",
              "state.materials.push('Leer')",
              'state.materials.push("Leer")',
          ]
          bad=[x for x in forbidden if x in frag]
          if bad:
              raise SystemExit("033C VALIDIERUNG: Leer darf nicht als echter Muldeninhalt gespeichert werden: "+", ".join(bad))

          for marker in [
              "DP_DLB_032E_1_16_0_11_TD005_FAHRERAUSWAHL_BEGIN",
              "DP_DLB_031G_1_16_0_6_STANDORTE_NAVIGATION_BEGIN",
              "dp32BDriverButton",
              "dp31GRenderBinMap",
              "Standort setzen",
              "Navigation zur Baustelle",
          ]:
              if marker not in src:
                  raise SystemExit("033C VALIDIERUNG: bestehende Funktion/Basis fehlt: "+marker)

          pkg=Path("spfx-build/config/package-solution.json")
          data=json.loads(pkg.read_text(encoding="utf-8"))
          version=data.get("solution",{}).get("version","")
          if version!="1.3.6.108":
              raise SystemExit(f"033C VALIDIERUNG: SPFx-Version {version!r} statt 1.3.6.108")

          if runtime.suffix==".js":
              subprocess.run(["node","--check",str(runtime)],check=True)

          if src.count(begin)!=1 or src.count(end)!=1:
              raise SystemExit("033C VALIDIERUNG: Patchmarker nicht eindeutig.")

          print("033C VALIDIERUNG OK")
          PY_VALIDATE_033C

      - name: Build and package 033C
        shell: bash
        run: |
          set -euo pipefail
          (cd spfx-build && npx heft build --production)
          (cd spfx-build && npx heft package-solution --production)

          rm -rf artifact/UPLOAD_TO_SITEASSETS artifact/UPLOAD_TO_APP_CATALOG
          mkdir -p artifact/UPLOAD_TO_SITEASSETS artifact/UPLOAD_TO_APP_CATALOG

          PKG=$(find spfx-build/sharepoint/solution -maxdepth 1 -type f -name '*.sppkg' | head -n1)
          test -n "$PKG"
          cp "$PKG" artifact/UPLOAD_TO_APP_CATALOG/DispoPilot_Online_V1.3_SPFX_FINAL.sppkg

          if [ -d spfx-build/release/assets ]; then
            cp -a spfx-build/release/assets/. artifact/UPLOAD_TO_SITEASSETS/
          elif [ -d spfx-build/temp/deploy ]; then
            cp -a spfx-build/temp/deploy/. artifact/UPLOAD_TO_SITEASSETS/
          else
            echo "033C: Keine SPFx Asset-Ausgabe gefunden." >&2
            exit 1
          fi

          if [ -f .dpx14_icon_b64 ]; then
            python3 - <<'PY_ICON_033C'
          from pathlib import Path
          import base64
          Path("artifact/UPLOAD_TO_SITEASSETS/DispoLux_DL_Icon_48.png").write_bytes(
              base64.b64decode(Path(".dpx14_icon_b64").read_text().strip())
          )
          PY_ICON_033C
          fi

      - name: Validate emitted 033C package
        shell: bash
        run: |
          set -euo pipefail

          COUNT=0
          while IFS= read -r -d '' JS; do
            test -s "$JS"
            node --check "$JS"
            COUNT=$((COUNT+1))
          done < <(find artifact/UPLOAD_TO_SITEASSETS -maxdepth 1 -type f -name '*.js' -print0)
          test "$COUNT" -gt 0

          PKG=artifact/UPLOAD_TO_APP_CATALOG/DispoPilot_Online_V1.3_SPFX_FINAL.sppkg
          test -s "$PKG"

          grep -R -Fq 'Standort setzen' artifact/UPLOAD_TO_SITEASSETS
          grep -R -Fq 'Standort abrufen' artifact/UPLOAD_TO_SITEASSETS
