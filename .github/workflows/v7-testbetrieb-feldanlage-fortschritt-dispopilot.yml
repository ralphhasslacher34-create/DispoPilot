      - name: Install SPFx SharePoint mail queue bridge
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files=list(Path("spfx-build/src/webparts").rglob("*.ts"))
          candidates=[]
          for f in files:
              s=f.read_text(encoding="utf-8")
              if "BaseClientSideWebPart" in s and re.search(r"public\s+render\s*\(\s*\)\s*:\s*void\s*\{",s):
                  candidates.append(f)
          if len(candidates)!=1:
              raise SystemExit(f"L2 Queue-Bridge abgebrochen: {len(candidates)} passende WebPart-TS-Dateien gefunden statt 1.")

          p=candidates[0]
          t=p.read_text(encoding="utf-8")
          if "@microsoft/sp-http" not in t:
              lines=t.splitlines()
              insert_at=0
              for i,line in enumerate(lines):
                  if line.startswith('import '):insert_at=i+1
              lines.insert(insert_at,"import { SPHttpClient } from '@microsoft/sp-http';")
              t='\n'.join(lines)+'\n'

          pattern=re.compile(r"(public\s+render\s*\(\s*\)\s*:\s*void\s*\{\s*)")
          if len(pattern.findall(t))!=1:
              raise SystemExit("L2 Queue-Bridge: render()-Einstieg nicht eindeutig.")

          bridge=r"""
            // DP_L2_MAILQUEUE_BRIDGE_BEGIN
            const dpQueueWindow: any = window as any;
            if (!dpQueueWindow.__DISPOPILOT_MAILQUEUE_BRIDGE_V2) {
              dpQueueWindow.__DISPOPILOT_MAILQUEUE_BRIDGE_V2 = true;
              const dpQueueContext: any = this.context as any;
              const dpQueueDom: HTMLElement = this.domElement;

              window.addEventListener('message', async (event: MessageEvent) => {
                const data: any = event.data;
                if (!data || data.type !== 'DISPOPILOT_MAILQUEUE_CREATE') return;

                const frame = dpQueueDom.querySelector('iframe') as HTMLIFrameElement | null;
                if (!frame || event.source !== frame.contentWindow) return;

                const source: any = event.source;
                const reply = (ok: boolean, itemId?: number, error?: string): void => {
                  try {
                    if (source && source.postMessage) {
                      source.postMessage({
                        type: 'DISPOPILOT_MAILQUEUE_RESULT',
                        requestId: String(data.requestId || ''),
                        ok,
                        itemId: itemId || null,
                        error: error || ''
                      }, '*');
                    }
                  } catch (_) {}
                };

                try {
                  const payload: any = data.payload || {};
                  const to: string[] = (Array.isArray(payload.to) ? payload.to : [])
                    .map((x: any) => String(x || '').trim())
                    .filter((x: string) => /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(x))
                    .slice(0, 10);
                  const pdf64 = String(payload.attachmentBase64 || '');
                  if (!to.length) throw new Error('Kein gültiger E-Mail-Empfänger.');
                  if (!pdf64 || pdf64.length > 900000) throw new Error('PDF-Anhang fehlt oder ist zu groß.');

                  payload.to = to;
                  payload.status = 'Pending';
                  const id = `mail-${Date.now()}-${Math.floor(Math.random()*1000000)}`;
                  const body = JSON.stringify({
                    Title: `DP|mailQueue|${id}`,
                    DP_Typ: 'mailQueue',
                    DP_Daten: JSON.stringify(payload)
                  });
                  const webUrl = String(dpQueueContext.pageContext.web.absoluteUrl || '').replace(/\/$/, '');
                  const url = `${webUrl}/_api/web/lists/getbytitle('DP_Data')/items`;
                  const response = await dpQueueContext.spHttpClient.post(
                    url,
                    SPHttpClient.configurations.v1,
                    {
                      headers: {
                        'Accept': 'application/json;odata=nometadata',
                        'Content-Type': 'application/json;odata=nometadata'
                      },
                      body
                    }
                  );
                  if (!response.ok) {
                    const detail = await response.text();
                    throw new Error(`SharePoint DP_Data ${response.status}: ${detail.slice(0,400)}`);
                  }
                  const json: any = await response.json();
                  reply(true, Number(json && (json.Id || json.ID) || 0));
                } catch (err: any) {
                  const msg=String((err && err.message) || err || 'MailQueue konnte nicht angelegt werden.').slice(0,900);
                  reply(false, undefined, msg);
                }
              });
            }
            // DP_L2_MAILQUEUE_BRIDGE_END

          """
          t,n=pattern.subn(lambda m:m.group(1)+bridge,t,count=1)
          if n!=1:raise SystemExit("L2 Queue-Bridge konnte nicht in render() eingefügt werden.")
          p.write_text(t,encoding="utf-8",newline="\n")
          print("L2 SharePoint-MailQueue-Bridge eingefügt in",p)
          PY

          grep -R -q "DP_L2_MAILQUEUE_BRIDGE_BEGIN" spfx-build/src/webparts
          grep -R -q "DISPOPILOT_MAILQUEUE_CREATE" spfx-build/src/webparts
          grep -R -q "getbytitle('DP_Data')/items" spfx-build/src/webparts
          grep -R -q "SPHttpClient.configurations.v1" spfx-build/src/webparts

      - name: Install V1 SharePoint test-data bridge
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files=list(Path("spfx-build/src/webparts").rglob("*.ts"))
          candidates=[]
          for f in files:
              s=f.read_text(encoding="utf-8")
              if "BaseClientSideWebPart" in s and re.search(r"public\s+render\s*\(\s*\)\s*:\s*void\s*\{",s):
                  candidates.append(f)
          if len(candidates)!=1:
              raise SystemExit(f"V7 Test-Bridge: {len(candidates)} WebPart-Dateien gefunden statt 1.")
          p=candidates[0]
          t=p.read_text(encoding="utf-8")

          # Bestehende MailQueue im Testbetrieb sicher in DP_Data_TEST umleiten
          # und Empfänger zwingend auf die Testadresse beschränken.
          old="""const payload: any = data.payload || {};
                  const to: string[] = (Array.isArray(payload.to) ? payload.to : [])
                    .map((x: any) => String(x || '').trim())
                    .filter((x: string) => /^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$/.test(x))
                    .slice(0, 10);"""
          new="""const payload: any = data.payload || {};
                  const isTestMode: boolean = payload.testMode === true;
                  const forcedTestEmail: string = String(payload.testEmail || '').trim();
                  const requestedTo: string[] = (Array.isArray(payload.to) ? payload.to : [])
                    .map((x: any) => String(x || '').trim())
                    .filter((x: string) => /^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$/.test(x))
                    .slice(0, 10);
                  const to: string[] = isTestMode
                    ? (/^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$/.test(forcedTestEmail) ? [forcedTestEmail] : [])
                    : requestedTo;"""
          if old not in t:
              raise SystemExit("V7 MailQueue-Sicherung: Empfängerblock nicht gefunden.")
          t=t.replace(old,new,1)
          old_url="const url = `${webUrl}/_api/web/lists/getbytitle('DP_Data')/items`;"
          new_url="const queueList = isTestMode ? 'DP_Data_TEST' : 'DP_Data';\n                  const url = `${webUrl}/_api/web/lists/getbytitle('${queueList}')/items`;"
          if old_url not in t:
              raise SystemExit("V7 MailQueue-Sicherung: DP_Data-URL nicht gefunden.")
          t=t.replace(old_url,new_url,1)
          t=t.replace("throw new Error(`SharePoint DP_Data ${response.status}: ${detail.slice(0,400)}`);",
                      "throw new Error(`SharePoint ${queueList} ${response.status}: ${detail.slice(0,400)}`);",1)

          pattern=re.compile(r"(public\s+render\s*\(\s*\)\s*:\s*void\s*\{\s*)")
          if len(pattern.findall(t))!=1:
              raise SystemExit("V7 Test-Bridge: render() nicht eindeutig.")

          bridge=r"""
            /* eslint-disable */
            // DP_V1_TESTDATA_BRIDGE_BEGIN
            const dpTestWindow: any = window as any;
            if (!dpTestWindow.__DISPOPILOT_TESTDATA_BRIDGE_V1) {
              dpTestWindow.__DISPOPILOT_TESTDATA_BRIDGE_V1 = true;
              const dpTestContext: any = this.context as any;
              const dpTestDom: HTMLElement = this.domElement;
              const dpEsc = (s: string): string => String(s || '').replace(/'/g, "''");
              const dpWebUrl = (): string => String(dpTestContext.pageContext.web.absoluteUrl || '').replace(/\/$/, '');
              const dpJsonHeaders: any = { 'Accept':'application/json;odata=nometadata', 'Content-Type':'application/json;odata=nometadata' };

              const dpWithTimeout = async (promise: Promise<any>, label: string, ms: number = 45000): Promise<any> => {
                let timer: any;
                try{
                  return await Promise.race([
                    promise,
                    new Promise<any>((resolve,reject)=>{void resolve;timer=setTimeout(()=>reject(new Error(label+' – Zeitüberschreitung')),ms);})
                  ]);
                } finally { if(timer)clearTimeout(timer); }
              };
              const dpGet = async (url: string): Promise<any> => {
                const r: any = await dpWithTimeout(
                  dpTestContext.spHttpClient.get(url, SPHttpClient.configurations.v1, { headers:{'Accept':'application/json;odata=nometadata','Cache-Control':'no-cache'} }),
                  'GET',45000
                );
                if (!r.ok) throw new Error(`GET ${r.status}: ${(await r.text()).slice(0,500)}`);
                return r.json();
              };
              const dpPost = async (url: string, body: any, headers?: any): Promise<any> => {
                const r: any = await dpWithTimeout(
                  dpTestContext.spHttpClient.post(url, SPHttpClient.configurations.v1, {
                    headers:{...dpJsonHeaders,...(headers||{})},
                    body: typeof body==='string'?body:JSON.stringify(body)
                  }),
                  'POST',45000
                );
                if (!r.ok) throw new Error(`POST ${r.status}: ${(await r.text()).slice(0,700)}`);
                const txt=await r.text();
                return txt?JSON.parse(txt):{};
              };
              const dpDelete = async (url: string): Promise<void> => {
                const r: any = await dpWithTimeout(
                  dpTestContext.spHttpClient.post(url, SPHttpClient.configurations.v1, {
                    headers:{'Accept':'application/json;odata=nometadata','IF-MATCH':'*','X-HTTP-Method':'DELETE'}
                  }),
                  'DELETE',45000
                );
                if(!r.ok && r.status!==404)throw new Error(`DELETE ${r.status}: ${(await r.text()).slice(0,500)}`);
              };
              const dpSleep = (ms: number): Promise<void> => new Promise<void>((resolve)=>setTimeout(resolve,ms));

              const dpListExists = async (title: string): Promise<boolean> => {
                const url=`${dpWebUrl()}/_api/web/lists/getbytitle('${dpEsc(title)}')?$select=Id`;
                const r: any=await dpWithTimeout(
                  dpTestContext.spHttpClient.get(url,SPHttpClient.configurations.v1,{headers:{'Accept':'application/json;odata=nometadata'}}),
                  'Liste '+title,45000
                );
                if(r.status===404)return false;
                if(!r.ok)throw new Error(`Liste ${title}: ${r.status} ${(await r.text()).slice(0,350)}`);
                return true;
              };
              const dpWaitList = async (title: string): Promise<void> => {
                for(let i=0;i<40;i++){
                  if(await dpListExists(title))return;
                  await dpSleep(500);
                }
                throw new Error('Liste '+title+' wurde nach dem Anlegen nicht rechtzeitig verfügbar.');
              };
              const dpWaitListGone = async (title: string): Promise<void> => {
                for(let i=0;i<40;i++){
                  if(!(await dpListExists(title)))return;
                  await dpSleep(500);
                }
                throw new Error('Alte Liste '+title+' wurde nicht rechtzeitig entfernt.');
              };

              // WICHTIG:
              // Die produktive Liste kann in SharePoint für Unterstriche intern z.B.
              // DP_x005f_Typ heißen, obwohl im UI DP_Typ angezeigt wird.
              // Deshalb werden die echten internen Feldnamen aus DP_Data ermittelt
              // und für Snapshot/Test 1:1 nachgebaut.
              const dpFieldKey = (s: string): string => String(s||'')
                .replace(/_x005f_/gi,'_')
                .replace(/\s+/g,'_')
                .toLowerCase();

              const dpFields = async (list: string): Promise<any[]> => {
                const j=await dpGet(`${dpWebUrl()}/_api/web/lists/getbytitle('${dpEsc(list)}')/fields?$select=Title,InternalName,TypeAsString,Hidden&$top=5000`);
                return Array.isArray(j.value)?j.value:[];
              };

              const dpDiscoverSchema = async (list: string): Promise<any> => {
                const fields=await dpFields(list);
                const findField=(wanted:string):any=>{
                  const key=dpFieldKey(wanted);
                  return fields.find((f:any)=>dpFieldKey(f.Title)===key)
                    || fields.find((f:any)=>dpFieldKey(f.InternalName)===key);
                };
                const typ=findField('DP_Typ');
                const daten=findField('DP_Daten');
                if(!typ||!daten){
                  const diag=fields
                    .filter((f:any)=>!f.Hidden)
                    .map((f:any)=>`${String(f.Title||'')} [${String(f.InternalName||'')}]`)
                    .slice(0,40).join(', ');
                  throw new Error(`Datenfelder in ${list} nicht gefunden. Vorhanden: ${diag}`);
                }
                return {
                  typTitle:String(typ.Title||'DP_Typ'),
                  typInternal:String(typ.InternalName||''),
                  typType:String(typ.TypeAsString||'Text'),
                  dataTitle:String(daten.Title||'DP_Daten'),
                  dataInternal:String(daten.InternalName||''),
                  dataType:String(daten.TypeAsString||'Note')
                };
              };

              // SharePoint behält den internen Feldnamen beim späteren Umbenennen bei.
              // Deshalb wird ein Feld zunächst mit dem gewünschten INTERNEN Namen erzeugt
              // und danach nur seine sichtbare Bezeichnung auf DP_Typ / DP_Daten gesetzt.
              const dpEnsureFieldExact = async (
                list:string, displayTitle:string, internalName:string, typeAsString:string
              ):Promise<void> => {
                let fields=await dpFields(list);
                if(fields.some((f:any)=>String(f.InternalName||'')===internalName)){
                  const f=fields.find((x:any)=>String(x.InternalName||'')===internalName);
                  if(f && String(f.Title||'')!==displayTitle){
                    await dpPost(
                      `${dpWebUrl()}/_api/web/lists/getbytitle('${dpEsc(list)}')/fields/getbyinternalnameortitle('${dpEsc(internalName)}')`,
                      {Title:displayTitle},
                      {'IF-MATCH':'*','X-HTTP-Method':'MERGE'}
                    );
                  }
                  return;
                }

                const isNote=String(typeAsString||'').toLowerCase()==='note';
                await dpPost(
                  `${dpWebUrl()}/_api/web/lists/getbytitle('${dpEsc(list)}')/fields`,
                  {Title:internalName,FieldTypeKind:isNote?3:2}
                );

                for(let i=0;i<40;i++){
                  fields=await dpFields(list);
                  if(fields.some((f:any)=>String(f.InternalName||'')===internalName))break;
                  await dpSleep(350);
                }
                fields=await dpFields(list);
                if(!fields.some((f:any)=>String(f.InternalName||'')===internalName)){
                  const diag=fields.map((f:any)=>`${String(f.Title||'')} [${String(f.InternalName||'')}]`).slice(-30).join(', ');
                  throw new Error(`Feld ${displayTitle} konnte in ${list} nicht mit internem Namen ${internalName} erzeugt werden. Vorhanden: ${diag}`);
                }

                if(displayTitle!==internalName){
                  await dpPost(
                    `${dpWebUrl()}/_api/web/lists/getbytitle('${dpEsc(list)}')/fields/getbyinternalnameortitle('${dpEsc(internalName)}')`,
                    {Title:displayTitle},
                    {'IF-MATCH':'*','X-HTTP-Method':'MERGE'}
                  );
                }

                for(let i=0;i<20;i++){
                  fields=await dpFields(list);
                  const f=fields.find((x:any)=>String(x.InternalName||'')===internalName);
                  if(f && dpFieldKey(String(f.Title||''))===dpFieldKey(displayTitle))return;
                  await dpSleep(300);
                }
                throw new Error(`Feld ${internalName} wurde erzeugt, aber die sichtbare Bezeichnung ${displayTitle} konnte nicht gesetzt werden.`);
              };

              const dpEnsureList = async (title: string, schema:any): Promise<any> => {
                if(!(await dpListExists(title))){
                  await dpPost(`${dpWebUrl()}/_api/web/lists`,{
                    Title:title,BaseTemplate:100,Description:'DispoPilot isolierter Test-/Snapshot-Datenbestand'
                  });
                  await dpWaitList(title);
                }
                await dpEnsureFieldExact(title,schema.typTitle,schema.typInternal,schema.typType);
                await dpEnsureFieldExact(title,schema.dataTitle,schema.dataInternal,schema.dataType);
                const actual=await dpDiscoverSchema(title);
                if(actual.typInternal!==schema.typInternal || actual.dataInternal!==schema.dataInternal){
                  throw new Error(`Feldschema in ${title} stimmt nicht: Typ ${actual.typInternal}, Daten ${actual.dataInternal}; erwartet ${schema.typInternal}, ${schema.dataInternal}`);
                }
                return actual;
              };

              const dpRecreateList = async (title: string, schema:any): Promise<any> => {
                if(await dpListExists(title)){
                  await dpDelete(`${dpWebUrl()}/_api/web/lists/getbytitle('${dpEsc(title)}')`);
                  await dpWaitListGone(title);
                }
                return dpEnsureList(title,schema);
              };

              const dpItems = async (title: string, schema:any): Promise<any[]> => {
                const select=`Id,Title,${schema.typInternal},${schema.dataInternal}`;
                const j=await dpGet(`${dpWebUrl()}/_api/web/lists/getbytitle('${dpEsc(title)}')/items?$select=${select}&$top=5000`);
                const rows=Array.isArray(j.value)?j.value:[];
                return rows.map((r:any)=>({
                  Id:r.Id,
                  Title:String(r.Title||''),
                  DP_Typ:String(r[schema.typInternal]||''),
                  DP_Daten:String(r[schema.dataInternal]||'')
                }));
              };

              const dpPostRow = async (title:string,schema:any,row:any):Promise<void> => {
                const body:any={Title:String(row.Title||'')};
                body[schema.typInternal]=String(row.DP_Typ||'');
                body[schema.dataInternal]=String(row.DP_Daten||'');
                await dpPost(`${dpWebUrl()}/_api/web/lists/getbytitle('${dpEsc(title)}')/items`,body);
              };

              const dpPool = async <T>(rows: T[], concurrency: number, fn: (row:T,index:number)=>Promise<void>): Promise<void> => {
                let cursor=0;
                const worker=async():Promise<void>=>{
                  while(true){
                    const i=cursor++;
                    if(i>=rows.length)return;
                    await fn(rows[i],i);
                  }
                };
                const count=Math.max(1,Math.min(Number(concurrency)||1,rows.length||1));
                await Promise.all(Array.from({length:count},()=>worker()));
              };

              const dpCopyRows = async (rows:any[],dst:string,schema:any,onDone?:()=>void):Promise<number> => {
                await dpPool(rows,4,async(row:any)=>{
                  await dpPostRow(dst,schema,row);
                  try{if(onDone)onDone()}catch(_){}
                });
                return rows.length;
              };

              const dpWriteReady = async (schema:any,snapshotCount:number,testCount:number):Promise<void> => {
                await dpPostRow('DP_Data_SNAPSHOT',schema,{
                  Title:'DP|testReady',
                  DP_Typ:'testReady',
                  DP_Daten:JSON.stringify({
                    ready:true,snapshotCount,testCount,preparedAt:new Date().toISOString(),
                    typInternal:schema.typInternal,dataInternal:schema.dataInternal
                  })
                });
              };

              const dpReadyInfo = async (schema:any):Promise<any|null> => {
                if(!(await dpListExists('DP_Data_SNAPSHOT')))return null;
                const rows=await dpItems('DP_Data_SNAPSHOT',schema);
                const marker=rows.find((r:any)=>String(r.DP_Typ||'')==='testReady');
                if(!marker)return null;
                try{return JSON.parse(String(marker.DP_Daten||'{}'))}catch(_){return null}
              };


              const dpBridgeProgressBox = (): HTMLElement => {
                let el=document.getElementById('dpV7BridgeProgress') as HTMLElement|null;
                if(!el){
                  el=document.createElement('div');
                  el.id='dpV7BridgeProgress';
                  el.style.cssText='position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:2147483000;background:#fff;border:2px solid #176b3a;border-radius:12px;padding:10px 16px;font:600 14px Arial,sans-serif;box-shadow:0 4px 18px rgba(0,0,0,.25);display:none;max-width:80vw;text-align:center';
                  document.body.appendChild(el);
                }
                return el;
              };
              const dpBridgeProgressShow = (text:string):void => {
                try{const el=dpBridgeProgressBox();el.textContent=text;el.style.display='block';}catch(_){}
              };
              const dpBridgeProgressHide = ():void => {
                try{const el=document.getElementById('dpV7BridgeProgress') as HTMLElement|null;if(el)el.style.display='none';}catch(_){}
              };

              window.addEventListener('message', async (event: MessageEvent) => {
                const data: any = event.data;
                if(!data || data.type!=='DISPOPILOT_TEST_CONTROL')return;
                const frame=dpTestDom.querySelector('iframe') as HTMLIFrameElement|null;
                if(!frame || !frame.contentWindow)return;

                const source:any=frame.contentWindow;
                const reply=(ok:boolean,extra?:any,error?:string):void=>{
                  try{source.postMessage({
                    type:'DISPOPILOT_TEST_CONTROL_RESULT',
                    requestId:String(data.requestId||''),ok,...(extra||{}),error:error||''
                  },'*')}catch(_){}
                  setTimeout(dpBridgeProgressHide,1200);
                };
                let currentStage='Start';
                const progress=(stage:string,current:number=0,total:number=0):void=>{
                  currentStage=stage;
                  const label=total>0?`${stage} ${current}/${total}`:`${stage} …`;
                  dpBridgeProgressShow(label);
                  try{source.postMessage({
                    type:'DISPOPILOT_TEST_CONTROL_PROGRESS',
                    requestId:String(data.requestId||''),stage,current,total
                  },'*')}catch(_){}
                };

                try{
                  const action=String(data.action||'');
                  const prod='DP_Data', test='DP_Data_TEST', snap='DP_Data_SNAPSHOT';

                  progress('Datenstruktur prüfen');
                  const schema=await dpDiscoverSchema(prod);

                  if(action==='prepare'){
                    progress(`Echtbestand lesen (${schema.typInternal} / ${schema.dataInternal})`);
                    const all=await dpItems(prod,schema);
                    const snapshotRows=all.filter((r:any)=>String(r.DP_Typ||'')!=='testReady');
                    const testRows=snapshotRows.filter((r:any)=>String(r.DP_Typ||'')!=='mailQueue');

                    progress('Snapshot neu anlegen');
                    await dpRecreateList(snap,schema);
                    progress('Testbestand neu anlegen');
                    await dpRecreateList(test,schema);

                    let snapDone=0;
                    progress('Snapshot kopieren',0,snapshotRows.length);
                    await dpCopyRows(snapshotRows,snap,schema,()=>{
                      snapDone++;
                      if(snapDone===snapshotRows.length||snapDone%5===0)progress('Snapshot kopieren',snapDone,snapshotRows.length);
                    });

                    let testDone=0;
                    progress('Testbestand kopieren',0,testRows.length);
                    await dpCopyRows(testRows,test,schema,()=>{
                      testDone++;
                      if(testDone===testRows.length||testDone%5===0)progress('Testbestand kopieren',testDone,testRows.length);
                    });

                    progress('Abschluss speichern');
                    await dpWriteReady(schema,snapshotRows.length,testRows.length);
                    reply(true,{
                      ready:true,snapshotCount:snapshotRows.length,testCount:testRows.length,
                      typInternal:schema.typInternal,dataInternal:schema.dataInternal
                    });
                    return;
                  }

                  if(action==='reset'){
                    await dpEnsureList(snap,schema);
                    const ready=await dpReadyInfo(schema);
                    if(!ready?.ready)throw new Error('Kein vollständig vorbereiteter Snapshot vorhanden. Bitte zuerst vorbereiten.');
                    progress('Snapshot lesen');
                    const rows=(await dpItems(snap,schema))
                      .filter((r:any)=>String(r.DP_Typ||'')!=='testReady'&&String(r.DP_Typ||'')!=='mailQueue');

                    progress('Testbestand neu anlegen');
                    await dpRecreateList(test,schema);
                    let done=0;
                    progress('Testdaten zurücksetzen',0,rows.length);
                    await dpCopyRows(rows,test,schema,()=>{
                      done++;
                      if(done===rows.length||done%5===0)progress('Testdaten zurücksetzen',done,rows.length);
                    });
                    reply(true,{ready:true,snapshotCount:Number(ready.snapshotCount||0),testCount:rows.length});
                    return;
                  }

                  if(action==='status'){
                    if(!(await dpListExists(test)) || !(await dpListExists(snap))){
                      reply(true,{ready:false,snapshotCount:0,testCount:0,preparedAt:''});
                      return;
                    }
                    const ready=await dpReadyInfo(schema);
                    const snapshotCount=ready?.ready?Number(ready.snapshotCount||0):0;
                    const testCount=(await dpItems(test,schema)).filter((r:any)=>String(r.DP_Typ||'')!=='testReady').length;
                    reply(true,{ready:!!ready?.ready,snapshotCount,testCount,preparedAt:String(ready?.preparedAt||'')});
                    return;
                  }

                  throw new Error('Unbekannte Testbetrieb-Aktion.');
                }catch(err:any){
                  const msg=String((err&&err.message)||err||'Testdaten-Fehler').slice(0,1100);
                  reply(false,undefined,currentStage+': '+msg);
                }
              });
            }
            // DP_V1_TESTDATA_BRIDGE_END
          /* eslint-enable */

          """
          t,n=pattern.subn(lambda m:m.group(1)+bridge,t,count=1)
          if n!=1:
              raise SystemExit("V7 Test-Bridge konnte nicht eingefügt werden.")
          p.write_text(t,encoding="utf-8",newline="\n")
          print("V7 SharePoint-Testdaten-Bridge mit exakter Feldanlage und sichtbarem Fortschritt eingefügt in",p)
          PY

          grep -R -q "DP_V1_TESTDATA_BRIDGE_BEGIN" spfx-build/src/webparts
          grep -R -q "DP_Data_TEST" spfx-build/src/webparts
          grep -R -q "DP_Data_SNAPSHOT" spfx-build/src/webparts
          grep -R -q "DISPOPILOT_TEST_CONTROL_PROGRESS" spfx-build/src/webparts
          grep -R -q "dpDiscoverSchema" spfx-build/src/webparts
          grep -R -q "dpFieldKey" spfx-build/src/webparts
          grep -R -q "dpEnsureFieldExact" spfx-build/src/webparts
          grep -R -q "FieldTypeKind:isNote?3:2" spfx-build/src/webparts
          grep -R -q "dpV7BridgeProgress" spfx-build/src/webparts
          grep -R -q "typInternal" spfx-build/src/webparts
          grep -R -q "dataInternal" spfx-build/src/webparts
          grep -R -q "dpWaitListGone" spfx-build/src/webparts
          grep -R -q "/\* eslint-disable \*/" spfx-build/src/webparts
          grep -R -q "/\* eslint-enable \*/" spfx-build/src/webparts

      - name: Configure SiteAssets hosting
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          package = Path('spfx-build/config/package-solution.json')
          pdata = json.loads(package.read_text(encoding='utf-8'))
          solution = pdata['solution']
          solution['version'] = '1.3.5.49'
          solution['includeClientSideAssets'] = False
          solution['skipFeatureDeployment'] = True

          # L2 benötigt keine delegierte Mail.Send-Berechtigung mehr.
          # Versand übernimmt zentral Power Automate / das lizenzierte Büropostfach.
          requests = solution.get('webApiPermissionRequests', [])
          solution['webApiPermissionRequests'] = [
              x for x in requests
              if not (isinstance(x, dict) and str(x.get('resource','')).lower() == 'microsoft graph'
                      and str(x.get('scope','')).lower() == 'mail.send')
          ]

          package.write_text(json.dumps(pdata, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          wm_path = Path('spfx-build/config/write-manifests.json')
          wm = {
            '$schema': 'https://developer.microsoft.com/json-schemas/spfx-build/write-manifests.schema.json',
            'cdnBasePath': 'https://ralphyourway.sharepoint.com/sites/DispoPilot/SiteAssets/DispoPilotAssets'
          }
          wm_path.write_text(json.dumps(wm, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          manifests = list(Path('spfx-build/src/webparts').rglob('*.manifest.json'))
          if not manifests:
              raise SystemExit('Kein Webpart-Manifest gefunden.')

          for manifest in manifests:
              data = json.loads(manifest.read_text(encoding='utf-8'))
              hosts = data.setdefault('supportedHosts', [])
              for host in ('SharePointWebPart', 'SharePointFullPage'):
                  if host not in hosts:
                      hosts.append(host)
              manifest.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

