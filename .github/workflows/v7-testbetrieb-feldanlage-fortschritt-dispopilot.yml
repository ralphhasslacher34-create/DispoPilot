          grep -R 'dpStatusColorLogic' spfx-build/src/webparts

      - name: Build production bundle
        working-directory: spfx-build
        run: npx heft build --production

      - name: Package SharePoint solution
        working-directory: spfx-build
        run: npx heft package-solution --production

      - name: Collect SiteAssets and package
        run: |
          set -e
          rm -rf artifact
          mkdir -p artifact/UPLOAD_TO_SITEASSETS
          mkdir -p artifact/UPLOAD_TO_APP_CATALOG

          PKG=$(find spfx-build/sharepoint/solution -maxdepth 1 -type f -name '*.sppkg' | head -n 1)
          test -n "$PKG"
          cp "$PKG" artifact/UPLOAD_TO_APP_CATALOG/DispoPilot_Online_V1.3_SPFX_FINAL.sppkg

          if [ -d "spfx-build/release/assets" ]; then
            cp -a spfx-build/release/assets/. artifact/UPLOAD_TO_SITEASSETS/
          elif [ -d "spfx-build/temp/deploy" ]; then
            cp -a spfx-build/temp/deploy/. artifact/UPLOAD_TO_SITEASSETS/
          else
            echo "Keine SPFx Asset-Ausgabe gefunden."
            exit 1
          fi

          test "$(find artifact/UPLOAD_TO_SITEASSETS -type f | wc -l)" -gt 0

          cat > artifact/REIHENFOLGE.txt <<'TXT'
          DispoPilot V1.3 - V7 Testbetrieb Feldanlage + Fortschritt - Paketrevision 1.3.5.49

          V1 - ISOLIERTER TESTBETRIEB + ABWESEND 8H:
          - V2: Snapshot/Testkopie wird parallelisiert und erst nach vollständigem Abschluss als bereit markiert.
          - Abgebrochene/teilweise V1-Kopien werden beim erneuten Vorbereiten vollständig verworfen.
          - Admin kann einen Snapshot des aktuellen Echtbestands erstellen.
          - Snapshot liegt getrennt in DP_Data_SNAPSHOT.
          - Fantasiedaten/Testbetrieb laufen ausschließlich in DP_Data_TEST.
          - Produktivliste DP_Data wird im Testbetrieb nicht verändert.
          - Auf jedem Testgerät kann der Testbetrieb separat gestartet/beendet werden.
          - Deutlicher roter Hinweis: TESTBETRIEB – KEINE ECHTDATEN.
          - Testdaten können jederzeit wieder auf den gespeicherten Snapshot zurückgesetzt werden.
          - Test-E-Mail-Adresse kann im Testbestand hinterlegt werden; Testmails werden zwingend dorthin umgeleitet.
          - DP_Users bleibt zunächst gemeinsam, damit bestehende Fahrer-/Rollen-Anmeldungen weiter funktionieren.
          - Arbeitszeit: Urlaub und Abwesend ergeben jeweils automatisch 8:00 Stunden.

          U2 - KUNDENKONTEXT + SUCH-DROPDOWN:
          - "Neue Baustelle" merkt den aktuell gewählten Kunden VOR dem internen Neuaufbau der Kundenlisten.
          - Der Auftragskunde darf beim Öffnen/Abbrechen einer neuen Baustelle nicht mehr auf den ersten Kunden springen.
          - Aus Auftrag: ausgewählter Kunde -> Neue Baustelle -> exakt dieser Kunde bleibt vorbelegt.
          - Aus Kundenansicht: geöffneter Kunde -> Neue Baustelle -> exakt dieser Kunde bleibt vorbelegt.
          - Schließen/Abbrechen der Baustellenmaske verändert den Kunden im Auftrag nicht.
          - Die Kundensuche ist kein separates Feld mehr, sondern ersetzt sichtbar die bisherige Kunden-Dropdownbox im Auftrag.
          - Tippen in die Kundenbox öffnet die weiterhin alphabetisch sortierte Liste.
          - Eingabe filtert live, z. B. S -> SC -> SCH; zuerst Anfangstreffer, danach enthaltene Treffer.
          - Auswahl übernimmt den Kunden in das originale oCustomer-Feld, sodass alle bestehende Auftragslogik unverändert weiterarbeitet.

          S1 - RAPPORT / KUNDE NICHT VOR ORT:
          - Im Rapport gibt es die klare Option „Kunde nicht vor Ort“.
          - Wird sie aktiviert, sind Name des Auftraggebers und Kundenunterschrift nicht erforderlich.
          - Es wird ausdrücklich KEINE Kundenunterschrift simuliert oder ersetzt.
          - Beim Rapportabschluss speichert DispoPilot automatisch Datum/Uhrzeit sowie den angemeldeten Fahrer.
          - Vorschau/PDF dokumentieren deutlich: „Kunde nicht vor Ort“, keine Kundenunterschrift, Fahrer und Abschlusszeit.
          - Ist der Kunde vor Ort, bleibt der bisherige normale Weg mit Name + echter Unterschrift bestehen.
          - Rapportabschluss wird am Auftrag als rapportCompletion protokolliert und verhindert danach Q2-Löschen.
          - Der Rapportversand bleibt in S1 bewusst simuliert; echter zentraler Versand folgt gemeinsam für Rapport und Stundenzettel.

          R1 - DIREKTVERLADUNG / MATERIAL / TRANSPORTORTE:
          - Neue Auftragsart „Direktverladung“.
          - Direktverladung zeigt ausdrücklich Ladeort, Material und Abladeort.
          - Bei Ladeort und Abladeort gibt es jeweils die Checkbox „Baustelle als …“.
          - Alternativ wird ein Transportort aus einer gemeinsamen Liste gewählt.
          - Material ist eine echte, mobil zuverlässige Auswahlliste statt Browser-Datalist.
          - Transportorte sind ebenfalls eine echte Auswahl und funktionieren als Lade- ODER Abladeort.
          - Material und Transportort können direkt im Auftrag über „+ Neu“ ergänzt werden.
          - Materialien bleiben zusätzlich zentral in Einstellungen pflegbar.
          - Neue Stammdatenkarte „Transportorte“: hinzufügen, umbenennen, aktiv/inaktiv.
          - Bestehende alte Abladeorte und bereits verwendete Auftragsorte werden automatisch übernommen.
          - Transportorte sind für spätere Adresse/Telefon/Maps/GPS-Felder im Datenmodell vorbereitet.
          - Direktverladung verlangt Material sowie einen eindeutigen Lade- und Abladeort.
          - Fahrer bestätigt bei „Ausgeführt“ die tatsächlich verwendeten Mulden.
          - Direktverladung verändert den Muldenstandort nicht automatisch, da die Mulde nach dem
            direkten Laden und Abladen nicht als beim Kunden stehend behandelt wird.
          - Q1-Kopieren übernimmt auch die Direktverladungs-Planungsdaten, aber keine Ausführung.

          Q2 - AUFTRAG LÖSCHEN NUR IN DER PLANUNG:
          - Planung/Disposition erhält zusätzlich „Löschen“.
          - Löschbar sind nur unberührte Aufträge mit Status „Geplant“.
          - Sobald Ausführungs-, Rapport- oder Nicht-ausgeführt-Historiedaten vorhanden sind,
            ist Löschen gesperrt.
          - Vor dem Löschen erscheint eine Sicherheitsabfrage.
          - Die Fahrreihenfolge des betroffenen Fahrers wird danach automatisch geschlossen.
          - Intern bleibt ein Audit-Snapshot mit gelöscht am / gelöscht von erhalten,
            wird aber nicht in der normalen Historienansicht angezeigt.
          - War bereits ein Fahrer zugeordnet, erhält er „Auftrag gelöscht“; diese Meldung
            wird direkt quittiert und versucht nicht, den gelöschten Auftrag zu öffnen.
          - Fahreransicht erhält keinen Löschbutton.
          - Damit können kopierte Testaufträge nach Q1 sofort wieder sauber entfernt werden.

          Q1 - AUFTRAG KOPIEREN NUR IN DER PLANUNG:
          - Jeder Auftrag in der Planungsansicht erhält den Button „Kopieren“.
          - Fahrer-/Auftragsansicht erhält ausdrücklich KEINEN Kopierbutton.
          - Kopieren erzeugt sofort einen neuen eigenständigen Auftrag mit neuer ID.
          - Übernommen werden: Datum, Fahrer, Fahrzeug, Kunde, Baustelle, Tätigkeit,
            Anzahl/Muldentyp, Material, Abladeort, Abrechnung und Planungsbemerkung.
          - Nicht übernommen werden: konkrete Muldennummern, tatsächliche Ausführung,
            Zeiten, Statushistorie, Nicht-ausgeführt-Historie, LS-/Rapportdaten.
          - Neuer Status ist immer „Geplant“.
          - Bei festem Fahrer wird die Kopie ans Ende seiner Tagesfahrfolge gesetzt.
          - Danach kann sie mit ↑/↓ wie gewohnt verschoben werden.
          - Ein fest zugeordneter kopierter Auftrag erzeugt beim Fahrer eine Meldung
            „Neuer Auftrag“ über die bestehende F3-Popup-Logik.
          - Kein Bestätigungsdialog: mehrfaches Kopieren bleibt schnell; eine kurze
            grüne Rückmeldung zeigt die neu vergebene Fahrfolge.

          F4 - AUFTRAG BEARBEITEN AUS DETAILANSICHT:
          - Klick auf „Auftrag bearbeiten“ öffnet die Bearbeitungsmaske sofort sichtbar.
          - Die Auftragsdetailansicht wird dabei automatisch geschlossen.
          - Kein zusätzlicher manueller Klick auf „Schließen“ mehr erforderlich.
          - Kommt der Auftrag aus einem Fahrer-Popup, gilt die Meldung beim Wechsel
            in die Bearbeitung als angesehen/quittiert.
          - Weitere offene Fahrer-Meldungen warten, bis die Bearbeitungsmaske wieder
            geschlossen bzw. gespeichert wurde; sie legen sich nicht über die Bearbeitung.

          F3 - POPUP / FAHRERMELDUNGEN:
          - Popup zeigt die Art der Änderung deutlich an, z. B. „Neuer Auftrag“,
            „Reihenfolge geändert“, „Termin geändert“, „Fahrzeug geändert“,
            „Auftrag neu zugeordnet“, „Auftrag geändert“ oder „Status geändert“.
          - Datum/Uhrzeit bleiben in der Meldung sichtbar.
          - Nur noch EIN Button: „Auftrag ansehen“.
          - Beim Antippen schließt das Popup und der betroffene Auftrag öffnet sich.
          - Beim Schließen des Auftrags wird genau diese Meldung automatisch quittiert.
          - Kein zweiter Schritt „Änderung bestätigen“ mehr.
          - Bei mehreren offenen Meldungen erscheint danach die nächste Meldung.
          - Bereits geöffnete, aber wegen App-/Browserabbruch nicht abgeschlossene Meldungen
            werden als „Bereits geöffnet“ kenntlich gemacht.

          L5 - VORSCHAU UND PDF IDENTISCH / KEINE SICHTBAREN KÜRZEL:
          - Letzte Stundenzettelspalte nutzt eine gemeinsame Datenquelle für Vorschau und PDF.
          - Es erscheinen ausschließlich Aufträge mit Status "Ausgeführt" des jeweiligen Fahrers.
          - Pro Auftrag steht nur: Kunde / Baustelle / Tätigkeit.
          - Muldentyp, Inhalt, Muldennummer und alte Excel-Kürzel werden dort nicht ausgegeben.
          - Auch Kunden- und Baustellenlisten zeigen keine Kürzel mehr.
          - Die Kürzelfelder in Kunden-/Baustellen-Stammdaten sind ausgeblendet.
          - Bestehende interne code-Werte bleiben aus Kompatibilitätsgründen erhalten.

          L4 - PDF-LAYOUT NACH ORIGINAL LORACON.XLSX:
          - A4 quer mit festen Spaltenproportionen der Excelvorlage.
          - Die breite letzte Spalte enthält Kunde / Tätigkeit / Baustelle bzw. Projektnummer.
          - Zusätzliche HTML-Detailzeilen werden nicht mehr fälschlich als Kalendertag ausgegeben.
          - Montag bis Sonntag bleiben als feste Wochenzeilen auf einer Seite, soweit der Inhalt passt.
          - Deutsche Umlaute bleiben in der PDF erhalten.
          - Bei Wochen über Monatsgrenzen wird Monat/Jahr z.B. als "August / September 2026" dargestellt.
          - Download und E-Mail-Anhang verwenden exakt dieselbe L4-PDF.

          L2 - ZENTRALER VERSAND, AUCH FÜR GASTFAHRER:
          - Der Fahrer braucht KEIN eigenes Exchange-Postfach.
          - "Stundenzettel senden" erzeugt zuerst eine echte PDF-Datei.
          - Danach wird ein neuer Datensatz in der vorhandenen SharePoint-Liste
            DP_Data angelegt:
              DP_Typ = mailQueue
              DP_Daten = Empfänger, Betreff, Mailtext und PDF-Anhang als Base64.
          - Ein zentraler Power-Automate-Flow muss einmalig eingerichtet werden.
          - Dieser Flow sendet aus dem lizenzierten Microsoft-365-Büropostfach.
          - Gastfahrer wie jatara@gmx.de können dadurch den Versand auslösen,
            ohne selbst ein Microsoft-365-Mailpostfach zu besitzen.
          - Die App meldet korrekt "zum Versand übergeben" und nicht fälschlich
            "versendet", bevor Power Automate die Mail tatsächlich verarbeitet hat.

          PDF:
          - "Drucken / als PDF speichern" wird zu "PDF herunterladen".
          - Die PDF wird direkt durch DispoPilot erzeugt; kein Android-/Browser-
            Druckdialog ist mehr erforderlich.
          - Ausgabe A4 Querformat, mit LoraCon-Struktur und Wochen-Tabelle.
          - Dieselbe PDF wird als E-Mail-Anhang in die Versandwarteschlange gelegt.

          MICROSOFT GRAPH:
          - L2 verwendet NICHT mehr /me/sendMail.
          - Das Paket fordert deshalb Mail.Send nicht mehr an.
          - Die bereits zuvor genehmigte Mail.Send-Berechtigung kann zunächst
            bestehen bleiben; sie wird von L2 nicht verwendet.

          POWER-AUTOMATE-EINRICHTUNG (einmalig, nach Deployment):
          1. Automatisierten Cloud-Flow erstellen.
          2. Trigger SharePoint: "Wenn ein Element erstellt wird" auf Site DispoPilot,
             Liste DP_Data.
          3. Nur weiter, wenn DP_Typ gleich "mailQueue" ist.
          4. DP_Daten als JSON auswerten.
          5. Outlook "E-Mail senden (V2)" mit to, subject, bodyHtml verwenden.
             Anhangname = attachmentName,
             Anhanginhalt = attachmentBase64.
          - Diesen Flow richten wir nach erfolgreicher Installation gemeinsam ein.

          STUNDENZETTEL-VORLAGE:
          - Der aktuelle LoraCon-Aufbau bleibt maßgeblich:
            Arbeitgeber, Arbeitnehmer, Monat/Jahr, Kalendertag, Beginn, Ende,
            Ruhepause, Dauer minus Pause und Baustelle/Projektnummer.
          - Keine neue Fantasievorlage.

          Dieser Build enthält weiterhin vollständig den Stand 1.3.5.28
          mit Status-/Neuplanungs- und Lagerlogik.

          Dieser Build ersetzt den noch nicht benötigten Einzelstand 1.3.5.27
          und enthält dessen neue "Nicht ausgeführt / Neuplanung"-Logik vollständig.

          VERBINDLICHE AUFTRAGSSTATUS-LOGIK:
          - Geplant
          - In Arbeit
          - Ausgeführt
          - Nicht ausgeführt
          - "Teilweise ausgeführt" ist als Fahrerbutton vollständig entfernt.
          - Alte historische Datensätze mit diesem Status bleiben lesbar.
          - Keine zusätzlichen Zwischenstände während einer Fahrt.
          - Muldenbestand ändert sich erst bei erfolgreichem Abschluss "Ausgeführt".

          PRAXIS MEHRERE MULDEN:
          - Mehrere einzeln gefahrene Mulden = mehrere Aufträge.
          - Mehrere gemeinsam in einem Zug bewegte Mulden können ein Auftrag sein.
          - Deshalb braucht der Auftrag keinen Status "Teilweise ausgeführt".

          NICHT AUSGEFÜHRT:
          - Grund aus vorhandener Liste.
          - Freies Feld "Ergänzung / weiterer Grund".
          - Danach immer "Auftrag verschieben?" Ja / Nein.
          - Nein: endgültig Nicht ausgeführt.
          - Ja: Datum heute oder Zukunft, Status wieder Geplant.
          - Vergangenheit gesperrt.
          - Separater VERSCHIEBEN-Button bleibt entfernt.

          LAGER:
          - "Auf Lager" bleibt die Statusart einer Mulde.
          - Zusätzlich wird das konkrete Lager gespeichert.
          - Start-Stammdaten:
            Lager Vaihingen
            Lager Horrheim
          - In Einstellungen können Lager:
            ergänzt,
            umbenannt,
            aktiv/inaktiv gesetzt werden.
          - Keine Lagerbezeichnungen sind dauerhaft in der Bewegungslogik fest verdrahtet.

          LAGER BEI AUFTRAGSABSCHLUSS:
          - Abholen + Ausgeführt -> Ziel-Lager muss gewählt werden.
          - Tauschen + Ausgeführt -> Ziel-Lager für die abgeholte Mulde muss gewählt werden.
          - Erst beim Abschluss wird dieses Lager im Muldenbestand gespeichert.
          - Bewegungsverlauf enthält anschließend den konkreten Lagerstandort.
          - Bestehende alte Mulden mit "Auf Lager" ohne Lagerzuordnung bleiben erhalten
            und werden als "Lager nicht zugeordnet" kenntlich gemacht.

          MANUELLE MULDENSTAMMDATEN:
          - Bei Status "Auf Lager" wird ebenfalls ein konkreter Lagerstandort verlangt.

          TEST:
          1. Fahrer-Auftragsdetail:
             TEILWEISE und VERSCHIEBEN dürfen nicht mehr vorhanden sein.
          2. Nicht ausgeführt -> Grund + Freitext -> Nein testen.
          3. Nicht ausgeführt -> Ja -> heute/morgen testen.
          4. Abholen starten und Ausgeführt:
             Ziel-Lager muss gewählt werden.
          5. Mulde danach suchen:
             z. B. "Lager Vaihingen" statt nur "Auf Lager".
          6. Tauschen:
             abgeholte Mulde muss im gewählten Lager landen,
             gestellte Mulde beim Kunden.
          7. Einstellungen:
             neues Testlager anlegen, umbenennen, inaktiv setzen.
          8. Mulde manuell bearbeiten:
             bei "Auf Lager" Lagerauswahl prüfen.
          9. F3 Popup: Disposition Reihenfolge ändern -> Fahrer muss „Reihenfolge geändert“ sehen.
          10. „Auftrag ansehen“ -> Popup schließt -> Auftrag schließen -> Meldung darf nicht erneut erscheinen.
          11. Zwei Änderungen erzeugen -> nach Schließen des ersten Auftrags muss die nächste Meldung erscheinen.
          12. Planung: Auftrag mit Fahrer/Fahrzeug sichtbar lassen -> „Kopieren“.
              Neue Kopie muss am Ende desselben Fahrers mit Status Geplant erscheinen.
          13. Kopie öffnen: Kunde/Baustelle/Tätigkeit/Fahrer/Fahrzeug müssen übernommen sein;
              konkrete Muldennummer/Ausführungsdaten dürfen NICHT übernommen sein.
          14. Kopierten Auftrag in Planung -> „Löschen“ -> Sicherheitsabfrage bestätigen.
              Auftrag muss verschwinden und Fahrfolge muss wieder lückenlos sein.
          15. Einen Auftrag auf „In Arbeit“ oder mit Historie prüfen: Löschbutton darf dort nicht angeboten werden.
          16. Fahreransicht prüfen: Dort darf weder Kopier- noch Löschbutton vorhanden sein.
          17. Bei zugeordnetem Fahrer: Kopie erzeugt „Neuer Auftrag“; Löschen erzeugt „Auftrag gelöscht“.
              Bei „Auftrag gelöscht“ muss „Meldung schließen“ erscheinen, ohne Auftragsöffnung.
          18. Auftrag öffnen -> „Auftrag bearbeiten“ -> Bearbeitungsmaske muss sofort sichtbar sein;
              Detailfenster darf nicht mehr davor liegen.
          19. Auftrag aus F3-Popup öffnen -> Bearbeiten -> schließen/speichern:
              keine alte Meldung erneut; nächste offene Meldung erst danach.
          20. Aktualisieren, Fahrfolge und Baustellenadresse kurz gegenprüfen.

          S1 TEST:
          21. Ausgeführten Auftrag öffnen -> Rapport / Lieferschein.
          22. Normalfall: Name + Kundenunterschrift -> Vorschau muss weiterhin funktionieren.
          23. Rapport erneut öffnen -> „Kunde nicht vor Ort“ aktivieren.
              Name/Unterschrift müssen deaktiviert werden; Vorschau muss ohne Signatur möglich sein.
          24. Vorschau/PDF prüfen: deutlich „Kunde nicht vor Ort“, Fahrer sowie automatisches Datum/Uhrzeit.
          25. Kein Unterschriftsbild darf im „Kunde nicht vor Ort“-Fall erscheinen.

          U2 TEST:
          26. Neuer Auftrag -> Kunde z. B. Zacharias wählen -> Kundenbox erneut öffnen:
              Suche ist direkt in der Dropdownbox; Eingabe Z / ZA / ZAC filtert live.
          27. Im Auftrag Zacharias wählen -> Neue Baustelle -> Baustellenmaske muss Zacharias zeigen.
              Baustellenmaske nur schließen/abbrechen -> Auftrag muss weiterhin Zacharias zeigen.
          28. Kunde Zacharias in Kundenansicht öffnen -> Neue Baustelle -> ebenfalls Zacharias vorbelegt.
          29. Neue Baustelle speichern -> zurück zum Auftrag: Kunde bleibt Zacharias, neue Baustelle ist auswählbar/gewählt.
          30. Gegenprobe mit einem weiteren Kunden weit hinten in der alphabetischen Liste; niemals Rückfall auf ersten Kunden.

          HINWEIS:
          H3-Scrollkomfort bleibt vorläufig auf dem aktuellen Stand.
          Größere Bildschirm-/Scrolloptimierung wird sinnvollerweise mit der PWA fortgeführt.
          TXT

