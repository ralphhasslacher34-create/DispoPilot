      - name: Apply final F2 notification flow and H3 mobile scrolling fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path("dispopilot-online-efd.html")
          t=p.read_text(encoding="utf-8")

          # ------------------------------------------------------------
          # F2: Meldungsablauf wieder sauber zweistufig.
          #
          # Soll:
          # 1. Auftrag ansehen
          # 2. Auftrag schließen
          # 3. Meldung ausdrücklich bestätigen
          # 4. Meldung verschwindet, Auftrag öffnet NICHT erneut.
          #
          # Der frühere F-Patch quittierte die Meldung bereits beim
          # Schließen des Auftrags. Das kollidiert mit dem eigentlichen
          # Zwei-Stufen-Dialog.
          # ------------------------------------------------------------
          old_f="""const baseCloseM=closeM;
          closeM=function(id){
            baseCloseM(id);
            if(id==='detailModal'&&dp13ReturnNoticeId){
              const noticeId=dp13ReturnNoticeId;
              dp13ReturnNoticeId=null;
              const n=dp13NoticeList().find(x=>x.id===noticeId);
              if(n&&!n.acknowledgedAt){
                n.acknowledgedAt=nowIso();
                persist().then(()=>setTimeout(dp13CheckNotices,40));
              }else{
                setTimeout(dp13CheckNotices,40);
              }
            }
          };"""

          new_f="""const baseCloseM=closeM;
          closeM=function(id){
            baseCloseM(id);
            if(id==='detailModal'&&dp13ReturnNoticeId){
              // Stufe 1 ist beendet: Auftrag wurde angesehen.
              // NICHT hier quittieren. Der Fahrer bestätigt die Meldung
              // anschließend bewusst im Meldungsfenster.
              dp13ReturnNoticeId=null;
              setTimeout(dp13CheckNotices,40);
            }
          };"""

          if t.count(old_f)!=1:
              raise SystemExit(
                  f"F2 abgebrochen: bisheriger F-Block {t.count(old_f)}x gefunden statt 1x."
              )
          t=t.replace(old_f,new_f,1)

          marker="/* DP13_PATCH_BEGIN */"
          if t.count(marker)!=1:
              raise SystemExit(
                  f"H2 abgebrochen: DP13-Marker {t.count(marker)}x gefunden statt 1x."
              )

          patch=r"""
          /* DP_F2_H3_BUGFIX_BEGIN */

          // ------------------------------------------------------------
          // H3: Auf kleinen Bildschirmen darf es nur EINEN vertikalen
          // Scrollbereich geben. Bisher scrollten Modal UND innere Box
          // teilweise gegeneinander. In SharePoint/Browser konnte dadurch
          // oben oder unten ein Teil unerreichbar bleiben.
          // ------------------------------------------------------------
          if(!document.getElementById('dpH3ScrollFixStyle')){
            const st=document.createElement('style');
            st.id='dpH3ScrollFixStyle';
            st.textContent=`
              @media(max-width:760px){
                .modal.show{
                  position:fixed !important;
                  inset:0 !important;
                  width:auto !important;
                  height:auto !important;
                  max-height:none !important;
                  overflow-x:hidden !important;
                  overflow-y:auto !important;
                  -webkit-overflow-scrolling:touch;
                  overscroll-behavior:contain;
                  align-items:flex-start !important;
                  justify-content:center !important;
                  padding:
                    max(10px,env(safe-area-inset-top))
                    8px
                    max(28px,env(safe-area-inset-bottom)) !important;
                  box-sizing:border-box !important;
                }

                .modal.show > .box{
                  width:100% !important;
                  height:auto !important;
                  min-height:0 !important;
                  max-height:none !important;
                  overflow:visible !important;
                  margin:0 auto !important;
                  border-radius:10px !important;
                  box-sizing:border-box !important;
                  padding:12px !important;
                }

                /* H hatte bei Auftrag/Detail/Status 100dvh gesetzt.
                   H2 hebt diese feste Höhe bewusst wieder auf. */
                #orderModal .box,
                #detailModal .box,
                #statusModal .box,
                #siteModal .box,
                #customerModal .box,
                #dpKAddressModal .box{
                  height:auto !important;
                  min-height:0 !important;
                  max-height:none !important;
                  overflow:visible !important;
                }

                /* Kopfzeilen bleiben erreichbar, ohne aus dem sichtbaren
                   Bereich hinaus zu rutschen. */
                #orderModal .box > .row:first-child,
                #detailModal .box > .row:first-child,
                #statusModal .box > .row:first-child,
                #siteModal .box > .row:first-child,
                #customerModal .box > .row:first-child,
                #dpKAddressModal .box > .row:first-child{
                  position:sticky !important;
                  top:-1px !important;
                  z-index:20 !important;
                  background:#fff !important;
                  margin:0 -4px 10px !important;
                  padding:8px 4px 10px !important;
                }

                /* Sicherer unterer Abstand für letzte Buttons/Felder. */
                .modal.show{
                  scroll-padding-bottom:140px !important;
                }

                .modal.show > .box::after{
                  content:"";
                  display:block;
                  height:140px;
                  min-height:140px;
                  flex:0 0 140px;
                  pointer-events:none;
                }
              }
            `;
            document.head.appendChild(st);
          }

          /* DP_F2_H3_BUGFIX_END */
          """

          t=t.replace(marker,patch+"\n"+marker,1)

          p.write_text(t,encoding="utf-8",newline="\n")
          print("F2 Meldungsablauf und H3 Scroll-Fix eingefügt.")
          PY

          grep -q "DP_F2_H3_BUGFIX_BEGIN" dispopilot-online-efd.html
          grep -q "dpH3ScrollFixStyle" dispopilot-online-efd.html
          grep -q "height:140px" dispopilot-online-efd.html
          grep -q "scroll-padding-bottom:140px" dispopilot-online-efd.html
          grep -q "Stufe 1 ist beendet" dispopilot-online-efd.html

          # Beim Schließen des Auftrags darf F2 nicht mehr automatisch quittieren.
          if grep -A14 -B2 "Stufe 1 ist beendet" dispopilot-online-efd.html | grep -q "acknowledgedAt=nowIso"; then
            echo "Fehler: Meldung wird beim Schließen des Auftrags weiterhin automatisch quittiert."
            exit 1
          fi


      - name: Apply L2 central mail queue and native PDF
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path("dispopilot-online-efd.html")
          t=p.read_text(encoding="utf-8")
          marker="/* DP13_PATCH_BEGIN */"
          if t.count(marker)!=1:
              raise SystemExit(f"L2 abgebrochen: DP13-Marker {t.count(marker)}x gefunden statt 1x.")

          patch=r"""
          /* DP_L2_ZENTRALER_STUNDENZETTELVERSAND_BEGIN */
          // L2 / Praxispunkt P:
          // Gastfahrer senden NICHT aus einem eigenen Exchange-Postfach.
          // DispoPilot erzeugt selbst eine echte PDF-Datei im A4-Querformat
          // und legt einen Versandauftrag in DP_Data (DP_Typ=mailQueue) an.
          // Ein zentraler Power-Automate-Flow versendet diese Warteschlange
          // anschließend über das lizenzierte Microsoft-365-Büropostfach.

          let dpL2QueueCounter=0;

          function dpL2QueueRequest(payload){
            return new Promise((resolve,reject)=>{
              const requestId='dp-queue-'+Date.now()+'-'+(++dpL2QueueCounter);
              let done=false;
              const finish=(ok,value)=>{
                if(done)return;
                done=true;
                clearTimeout(timer);
                window.removeEventListener('message',onMessage);
                ok?resolve(value):reject(value instanceof Error?value:new Error(String(value||'Unbekannter Warteschlangenfehler')));
              };
              const onMessage=(event)=>{
                const d=event.data;
                if(!d||d.type!=='DISPOPILOT_MAILQUEUE_RESULT'||d.requestId!==requestId)return;
                if(d.ok)finish(true,d);
                else finish(false,new Error(d.error||'Versandauftrag konnte nicht gespeichert werden.'));
              };
              window.addEventListener('message',onMessage);
              const timer=setTimeout(()=>finish(false,new Error('Zeitüberschreitung beim Speichern des Versandauftrags.')),30000);
              try{
                window.parent.postMessage({
                  type:'DISPOPILOT_MAILQUEUE_CREATE',
                  requestId,
                  payload
                },'*');
              }catch(e){finish(false,e);}
            });
          }

          function dpL2Ascii(s){
            return String(s==null?'':s)
              .replace(/Ä/g,'Ae').replace(/Ö/g,'Oe').replace(/Ü/g,'Ue')
              .replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue')
              .replace(/ß/g,'ss').replace(/€/g,'EUR')
              .replace(/[–—]/g,'-').replace(/[„“”]/g,'"').replace(/[’‘]/g,"'")
              .replace(/[^\x20-\x7E]/g,' ')
              .replace(/\s+/g,' ').trim();
          }

          function dpL2PdfEsc(s){
            return dpL2Ascii(s).replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)');
          }

          function dpL2Wrap(text,width,fontSize){
            const clean=dpL2Ascii(text);
            if(!clean)return [''];
            const max=Math.max(4,Math.floor(width/(fontSize*0.52)));
            const words=clean.split(/\s+/);
            const lines=[];
            let line='';
            for(const word0 of words){
              let word=word0;
              if(word.length>max){
                if(line){lines.push(line);line='';}
                while(word.length>max){lines.push(word.slice(0,max));word=word.slice(max);}
                if(word)line=word;
                continue;
              }
              const next=line?line+' '+word:word;
              if(next.length>max){if(line)lines.push(line);line=word;}else line=next;
            }
            if(line)lines.push(line);
            return lines.length?lines:[''];
          }

          function dpL2ExtractTimesheet(){
            const root=$('previewPaper');
            if(!root)throw new Error('Stundenzettel-Vorschau wurde nicht gefunden.');
            const table=root.querySelector('table');
            if(!table)throw new Error('Stundenzettel-Tabelle wurde nicht gefunden.');
            const rows=[...table.rows].map(r=>[...r.cells].map(c=>String(c.innerText||c.textContent||'').trim()));
            const text=String(root.innerText||root.textContent||'');
            const employer=(text.match(/Arbeitgeber:\s*([^\n\r]+)/i)||[])[1]||'LoraCon GmbH';
            const employee=(text.match(/Arbeitnehmer:\s*([^\n\r]+)/i)||[])[1]||state.user.name||'';
            const month=(text.match(/Monat\s*\/\s*Jahr\s*:?\s*([^\n\r]+)/i)||[])[1]||'';
            return {rows,employer:employer.trim(),employee:employee.trim(),month:month.trim()};
          }

          function dpL2PdfBytes(parts){
            let total=0;
            const arrays=parts.map(s=>{
              const a=new Uint8Array(s.length);
              for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i)&255;
              total+=a.length;return a;
            });
            const out=new Uint8Array(total);let pos=0;
            arrays.forEach(a=>{out.set(a,pos);pos+=a.length;});
            return out;
          }

          function dpL2BuildTimesheetPdf(){
            const data=dpL2ExtractTimesheet();
            const W=842,H=595,margin=34;
            const colW=[92,74,74,102,126,306];
            const fontBody=7.1,fontHead=6.8,fontProject=6.2;
            const pages=[];
            let cmds=[], y=36;
            const py=t=>H-t;
            const line=(x1,y1,x2,y2)=>cmds.push(`0.45 w ${x1.toFixed(1)} ${py(y1).toFixed(1)} m ${x2.toFixed(1)} ${py(y2).toFixed(1)} l S`);
            const text=(x,yt,s,fs=8,bold=false)=>cmds.push(`BT /F${bold?2:1} ${fs.toFixed(1)} Tf ${x.toFixed(1)} ${py(yt).toFixed(1)} Td (${dpL2PdfEsc(s)}) Tj ET`);
            const textLines=(x,yt,lines,fs,leading,bold=false,maxLines=99)=>{
              lines.slice(0,maxLines).forEach((s,i)=>text(x,yt+i*leading,s,fs,bold));
            };
            const drawTableHeader=()=>{
              const headers=(data.rows[0]||['Kalender Tag','Beginn Arbeitszeit','Ende Arbeitszeit','Summe Ruhepause Stunden, Minuten','Dauer abzueglich Pausen Arbeitzzeit nach Tarif','Baustelle / Projektnummer']).slice(0,6);
              const h=42;let x=margin;
              line(margin,y,W-margin,y);line(margin,y+h,W-margin,y+h);
              headers.forEach((htext,i)=>{
                line(x,y,x,y+h);
                const ls=dpL2Wrap(htext,colW[i]-8,fontHead);
                textLines(x+4,y+12,ls,fontHead,7.2,true,4);
                x+=colW[i];
              });
              line(W-margin,y,W-margin,y+h);y+=h;
            };
            const newPage=(first)=>{
              if(cmds.length)pages.push(cmds.join('\n'));
              cmds=[];y=34;
              if(first){
                text(margin,y+7,'LoraCon GmbH',9,true);
                text(margin,y+19,'Lothar Rapp Container + Transporte',7,false);
                text(margin,y+29,'Hinter der Ziegelhuette 7',7,false);
                text(margin,y+39,'71665 Vaihingen/Enz - Horrheim',7,false);
                text(W-margin-116,y+12,'LoraCon',22,true);
                text(W-margin-116,y+25,'Container + Transporte',7,false);
                line(margin,y+48,W-margin,y+48);
                y+=68;
                text(margin,y,'Arbeitnehmerbezogene Erfassung der taeglichen Arbeitszeit',13,true);
                y+=20;
                text(margin,y,'Arbeitgeber:',8,true); text(margin+95,y,data.employer,8,false);
                text(margin+390,y,'Monat/Jahr:',8,true); text(margin+465,y,data.month,8,false);
                y+=14;
                text(margin,y,'Arbeitnehmer:',8,true); text(margin+95,y,data.employee,8,false);
                y+=18;
              }else{
                text(margin,y,'Stundenzettel - Fortsetzung',11,true); y+=18;
              }
              drawTableHeader();
            };
            newPage(true);

            const bodyRows=(data.rows||[]).slice(1);
            for(const row0 of bodyRows){
              const row=row0.slice(0,6); while(row.length<6)row.push('');
              const wrapped=row.map((v,i)=>dpL2Wrap(v,colW[i]-8,i===5?fontProject:fontBody));
              const lineCounts=wrapped.map((ls,i)=>Math.min(ls.length,i===5?9:5));
              let rh=Math.max(24,8+Math.max(...lineCounts)*7.3);
              rh=Math.min(rh,78);
              if(y+rh>H-46){newPage(false);}
              let x=margin;
              line(margin,y,W-margin,y);line(margin,y+rh,W-margin,y+rh);
              for(let i=0;i<6;i++){
                line(x,y,x,y+rh);
                const fs=i===5?fontProject:fontBody;
                const max=i===5?9:5;
                textLines(x+4,y+11,wrapped[i],fs,7.3,i===0,max);
                x+=colW[i];
              }
              line(W-margin,y,W-margin,y+rh);y+=rh;
            }
            text(margin,H-24,'Elektronisch aus DispoPilot erstellt: '+new Date().toLocaleString('de-DE'),6.5,false);
            pages.push(cmds.join('\n'));

            const objects=[];
            const add=o=>{objects.push(o);return objects.length;};
            const catalog=add('');
            const pagesObj=add('');
            const font1=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>');
            const font2=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold >>');
            const pageRefs=[];
            pages.forEach(stream=>{
              const pageRef=add('');
              const contentRef=add(`<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`);
              pageRefs.push(pageRef);
              objects[pageRef-1]=`<< /Type /Page /Parent ${pagesObj} 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /Font << /F1 ${font1} 0 R /F2 ${font2} 0 R >> >> /Contents ${contentRef} 0 R >>`;
            });
            objects[catalog-1]=`<< /Type /Catalog /Pages ${pagesObj} 0 R >>`;
            objects[pagesObj-1]=`<< /Type /Pages /Count ${pageRefs.length} /Kids [${pageRefs.map(r=>r+' 0 R').join(' ')}] >>`;

            let pdf='%PDF-1.4\n%\xE2\xE3\xCF\xD3\n';
            const offsets=[0];
            objects.forEach((obj,i)=>{offsets.push(pdf.length);pdf+=`${i+1} 0 obj\n${obj}\nendobj\n`;});
            const xref=pdf.length;
            pdf+=`xref\n0 ${objects.length+1}\n0000000000 65535 f \n`;
            for(let i=1;i<offsets.length;i++)pdf+=String(offsets[i]).padStart(10,'0')+' 00000 n \n';
            pdf+=`trailer\n<< /Size ${objects.length+1} /Root ${catalog} 0 R >>\nstartxref\n${xref}\n%%EOF\n`;
            return new Blob([dpL2PdfBytes([pdf])],{type:'application/pdf'});
          }

          function dpL2Filename(){
            const kw=isoWeekNumber(selectedWeekMonday);
            const who=dpL2Ascii(state.user.name||'Fahrer').replace(/[^A-Za-z0-9_-]+/g,'_');
            return `Stundenzettel_${who}_KW${kw}.pdf`;
          }

          function dpL2DownloadPdf(){
            try{
              const blob=dpL2BuildTimesheetPdf();
              const url=URL.createObjectURL(blob);
              const a=document.createElement('a');
              a.href=url;a.download=dpL2Filename();
              document.body.appendChild(a);a.click();a.remove();
              setTimeout(()=>URL.revokeObjectURL(url),5000);
            }catch(e){
              console.error('DispoPilot PDF',e);
              alert('PDF konnte nicht erstellt werden.\n\n'+String(e&&e.message?e.message:e));
            }
          }

          async function dpL2BlobBase64(blob){
            const bytes=new Uint8Array(await blob.arrayBuffer());
            let binary='';
            const chunk=0x8000;
            for(let i=0;i<bytes.length;i+=chunk){binary+=String.fromCharCode(...bytes.subarray(i,i+chunk));}
            return btoa(binary);
          }

          function dpL2Recipient(){
            const idx=+$('tsRecipient').value;
            return (state.settings.timesheetRecipients||[])[idx]||{};
          }

          async function dpL2SendTimesheet(){
            const r=dpL2Recipient();
            if(!r.mail||!String(r.mail).includes('@')){
              alert('Für den ausgewählten Stundenzettel-Empfänger ist keine gültige E-Mail-Adresse hinterlegt.');return;
            }
            const btn=$('previewSendBtn');const oldText=btn?btn.textContent:'';
            if(btn){btn.disabled=true;btn.textContent='Wird übergeben …';}
            try{
              const kw=isoWeekNumber(selectedWeekMonday);
              const blob=dpL2BuildTimesheetPdf();
              const attachmentBase64=await dpL2BlobBase64(blob);
              const recipient=String(r.mail).trim();
              const subject=`Stundenzettel ${state.user.name} – KW ${kw}`;
              const payload={
                schema:2,
                status:'Pending',
                kind:'Stundenzettel',
                createdAt:nowIso(),
                createdBy:state.user.name,
                week:selectedWeekMonday,
                period:`KW ${kw}`,
                to:[recipient],
                subject,
                bodyHtml:`<p>Guten Tag,</p><p>anbei der Stundenzettel von <strong>${String(state.user.name||'')}</strong> für KW ${kw}.</p><p>Diese E-Mail wurde automatisch durch DispoPilot zum Versand bereitgestellt.</p>`,
                attachmentName:dpL2Filename(),
                attachmentContentType:'application/pdf',
                attachmentBase64
              };
              const result=await dpL2QueueRequest(payload);
              if(!Array.isArray(state.documents))state.documents=[];
              state.documents.unshift({
                id:uid(),type:'Stundenzettel',date:nowIso(),week:selectedWeekMonday,period:`KW ${kw}`,
                driver:state.user.name,recipient,recipients:[recipient],recipientName:r.name||'',
                status:'Versand beauftragt',transport:'Microsoft 365 / Power Automate',queueItemId:result&&result.itemId||null
              });
              await persist();
              closeM('previewModal');renderHistory();
              alert('Stundenzettel wurde als PDF zum zentralen Microsoft-365-Versand übergeben.');
            }catch(e){
              console.error('DispoPilot L2 Versand',e);
              alert('Stundenzettel konnte nicht zum Versand übergeben werden.\n\n'+String(e&&e.message?e.message:e));
            }finally{if(btn){btn.disabled=false;btn.textContent=oldText||'Stundenzettel senden';}}
          }

          const dpL2BasePreviewTimesheet=previewTimesheet;
          previewTimesheet=function(){
            closeM('timesheetModal');
            $('previewTitle').textContent='Stundenzettel – Vorschau';
            $('previewPaper').innerHTML=timesheetPaper();
            $('previewSendBtn').textContent='Stundenzettel senden';
            $('previewSendBtn').onclick=dpL2SendTimesheet;
            const printBtn=document.querySelector('#previewModal .btn.secondary');
            if(printBtn){
              printBtn.textContent='PDF herunterladen';
              printBtn.onclick=dpL2DownloadPdf;
            }
            openM('previewModal');
          };

          /* DP_L2_ZENTRALER_STUNDENZETTELVERSAND_END */
          """

          t=t.replace(marker,patch+"\n"+marker,1)
          p.write_text(t,encoding="utf-8",newline="\n")
          print("L2: zentrale Versandwarteschlange und native PDF-Erzeugung eingefügt.")
          PY

          grep -q "DP_L2_ZENTRALER_STUNDENZETTELVERSAND_BEGIN" dispopilot-online-efd.html
          grep -q "DISPOPILOT_MAILQUEUE_CREATE" dispopilot-online-efd.html
          grep -q "DP_Typ=mailQueue" dispopilot-online-efd.html
          grep -q "PDF herunterladen" dispopilot-online-efd.html
          grep -q "Versand beauftragt" dispopilot-online-efd.html

      - name: Apply L4 LoraCon PDF layout fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path("dispopilot-online-efd.html")
          t=p.read_text(encoding="utf-8")
          marker="/* DP13_PATCH_BEGIN */"
          if t.count(marker)!=1:
              raise SystemExit(f"L4 abgebrochen: DP13-Marker {t.count(marker)}x gefunden statt 1x.")

          patch=r"""
          /* DP_L4_LORACON_PDF_LAYOUT_BEGIN */
          // L4: eigener, fester Druckaufbau nach der LoraCon-Excelvorlage.
          // Wichtig: NICHT mehr jede HTML-Tabellenzeile blind in die PDF übernehmen.
          // Zusätzliche Auftrags-/Detailzeilen der Bildschirmansicht werden ignoriert;
          // Kunde/Tätigkeit/Baustelle bleiben ausschließlich in der breiten letzten Spalte.

          function dpL4CleanText(value,preserveBreaks=false){
            let s=String(value==null?'':value)
              .replace(/\r/g,'')
              .replace(/[–—]/g,'-')
              .replace(/[„“”]/g,'"')
              .replace(/[’‘]/g,"'")
              .replace(/€/g,'EUR')
              .replace(/[^\x09\x0A\x20-\x7E\xA0-\xFF]/g,' ');
            if(preserveBreaks){
              s=s.split('\n').map(x=>x.replace(/[ \t]+/g,' ').trim()).filter(Boolean).join('\n');
            }else{
              s=s.replace(/\s+/g,' ').trim();
            }
            return s;
          }

          function dpL4PdfEsc(s){
            return dpL4CleanText(s,true).replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)');
          }

          function dpL4WrapParagraph(text,width,fontSize){
            const clean=dpL4CleanText(text,false);
            if(!clean)return [''];
            const max=Math.max(4,Math.floor(width/(fontSize*0.50)));
            const words=clean.split(/\s+/);
            const lines=[];
            let line='';
            for(const word0 of words){
              let word=word0;
              if(word.length>max){
                if(line){lines.push(line);line='';}
                while(word.length>max){lines.push(word.slice(0,max));word=word.slice(max);}
                if(word)line=word;
                continue;
              }
              const next=line?line+' '+word:word;
              if(next.length>max){if(line)lines.push(line);line=word;}else line=next;
            }
            if(line)lines.push(line);
            return lines.length?lines:[''];
          }

          function dpL4WrapText(text,width,fontSize){
            const src=dpL4CleanText(text,true);
            if(!src)return [''];
            const out=[];
            src.split('\n').forEach(part=>{
              const ls=dpL4WrapParagraph(part,width,fontSize);
              ls.forEach(x=>out.push(x));
            });
            return out.length?out:[''];
          }

          function dpL4GermanMonth(d){
            return ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'][d.getMonth()];
          }

          function dpL4WeekMonthLabel(){
            try{
              const start=new Date(String(selectedWeekMonday)+'T12:00:00');
              if(Number.isNaN(start.getTime()))return '';
              const end=new Date(start); end.setDate(end.getDate()+6);
              if(start.getFullYear()===end.getFullYear()&&start.getMonth()===end.getMonth()){
                return dpL4GermanMonth(start)+' '+start.getFullYear();
              }
              if(start.getFullYear()===end.getFullYear()){
                return dpL4GermanMonth(start)+' / '+dpL4GermanMonth(end)+' '+start.getFullYear();
              }
              return dpL4GermanMonth(start)+' '+start.getFullYear()+' / '+dpL4GermanMonth(end)+' '+end.getFullYear();
            }catch(_){return '';}
          }

          function dpL4DateKey(d){
            const dd=String(d.getDate()).padStart(2,'0');
            const mm=String(d.getMonth()+1).padStart(2,'0');
            return dd+'.'+mm+'.'+d.getFullYear();
          }

          function dpL4Weekday(d){
            return ['So','Mo','Di','Mi','Do','Fr','Sa'][d.getDay()];
          }

          function dpL4ExtractTimesheet(){
            const root=$('previewPaper');
            if(!root)throw new Error('Stundenzettel-Vorschau wurde nicht gefunden.');
            const table=root.querySelector('table');
            if(!table)throw new Error('Stundenzettel-Tabelle wurde nicht gefunden.');

            const rawRows=[];
            let example=null;
            for(const tr of [...table.rows]){
              const cells=[...tr.cells];
              // L2-Fehlerquelle: Detailzeilen haben weniger als 6 Zellen.
              // Diese dürfen niemals in Spalte "Kalendertag" landen.
              if(cells.length<6)continue;
              const vals=cells.map(c=>dpL4CleanText(c.innerText||c.textContent||'',true));
              const first=vals[0]||'';
              if(/Kalender\s*Tag/i.test(first))continue;
              const row=[vals[0]||'',vals[1]||'',vals[2]||'',vals[3]||'',vals[4]||'',vals.slice(5).join('\n')||''];
              if(/^Beispiel/i.test(first)){example=row;continue;}
              if(/Wochensumme/i.test(first))continue;
              if(/\b(?:Mo|Di|Mi|Do|Fr|Sa|So)\b/i.test(first)||/\d{2}\.\d{2}\.\d{4}/.test(first))rawRows.push(row);
            }

            const start=new Date(String(selectedWeekMonday)+'T12:00:00');
            const days=[];
            if(!Number.isNaN(start.getTime())){
              for(let i=0;i<7;i++){
                const d=new Date(start);d.setDate(d.getDate()+i);
                const key=dpL4DateKey(d);
                let found=rawRows.find(r=>(r[0]||'').includes(key));
                if(!found)found=rawRows[i];
                if(found){
                  const copy=found.slice(0,6);
                  // Datum vereinheitlichen, damit leere Tage ebenfalls sauber aussehen.
                  copy[0]=dpL4Weekday(d)+'\n'+key;
                  days.push(copy);
                }else{
                  days.push([dpL4Weekday(d)+'\n'+key,'','','','','']);
                }
              }
            }else{
              rawRows.slice(0,7).forEach(r=>days.push(r));
            }

            const text=String(root.innerText||root.textContent||'');
            const employer=(text.match(/Arbeitgeber:\s*([^\n\r]+)/i)||[])[1]||'LoraCon GmbH';
            const employee=(text.match(/Arbeitnehmer:\s*([^\n\r]+)/i)||[])[1]||state.user.name||'';
            return {
              employer:dpL4CleanText(employer,false),
              employee:dpL4CleanText(employee,false),
              month:dpL4WeekMonthLabel(),
              example:example||['Beispiel:','','','','','Stuttgart'],
              days
            };
          }

          function dpL4BuildTimesheetPdf(){
            const data=dpL4ExtractTimesheet();
            const W=842,H=595;
            const left=36,right=36;
            const tableW=W-left-right;
            // Proportionen aus der hochgeladenen LoraCon.xlsx:
            // A+B | C | D | E | F | G+H
            const colW=[54,75,75,91,136,339];
            const headerH=43,exampleH=24;
            const bodyTop=153;
            const footerTop=550;
            const maxBodyH=footerTop-bodyTop-headerH-exampleH;

            function chooseProjectFont(rows){
              for(const fs of [6.6,6.4,6.2,6.0,5.8,5.6,5.4]){
                const leading=fs+1.0;
                let total=0;
                for(const r of rows){
                  const n=Math.max(1,dpL4WrapText(r[5],colW[5]-8,fs).length);
                  total+=Math.max(43,8+n*leading);
                }
                if(total<=maxBodyH)return fs;
              }
              return 5.2;
            }

            const projectFs=chooseProjectFont(data.days);
            const projectLeading=projectFs+1.0;
            const rowHeights=data.days.map(r=>{
              const n=Math.max(1,dpL4WrapText(r[5],colW[5]-8,projectFs).length);
              return Math.max(43,8+n*projectLeading);
            });
            const bodyTotal=rowHeights.reduce((a,b)=>a+b,0);
            const scale=bodyTotal>maxBodyH?maxBodyH/bodyTotal:1;
            const finalHeights=rowHeights.map(h=>Math.max(39,h*scale));

            const pages=[];
            let cmds=[];
            const py=y=>H-y;
            const setBlack=()=>cmds.push('0 0 0 rg 0 0 0 RG');
            const setGreen=()=>cmds.push('0.10 0.42 0.24 rg 0.10 0.42 0.24 RG');
            const line=(x1,y1,x2,y2,w=0.45)=>cmds.push(`${w.toFixed(2)} w ${x1.toFixed(1)} ${py(y1).toFixed(1)} m ${x2.toFixed(1)} ${py(y2).toFixed(1)} l S`);
            const text=(x,y,s,fs=8,bold=false)=>cmds.push(`BT /F${bold?2:1} ${fs.toFixed(1)} Tf ${x.toFixed(1)} ${py(y).toFixed(1)} Td (${dpL4PdfEsc(s)}) Tj ET`);
            const textLines=(x,y,lines,fs,leading,bold=false,maxLines=99)=>{
              const use=lines.slice(0,maxLines);
              if(lines.length>maxLines&&use.length){use[use.length-1]=use[use.length-1].replace(/\s+$/,'')+' ...';}
              use.forEach((s,i)=>text(x,y+i*leading,s,fs,bold));
            };
            const centerLines=(x,y,w,lines,fs,leading,bold=false)=>{
              lines.forEach((s,i)=>{
                const est=dpL4CleanText(s,false).length*fs*0.48;
                text(x+Math.max(3,(w-est)/2),y+i*leading,s,fs,bold);
              });
            };

            // Kopf analog zur Firmenvorlage
            setBlack();
            text(left,38,'LoraCon GmbH',7.5,true);
            text(left,49,'Lothar Rapp Container + Transporte',6.3,false);
            text(left,59,'Hinter der Ziegelhütte 7',6.3,false);
            text(left,69,'71665 Vaihingen/Enz - Horrheim',6.3,false);
            text(W-right-135,42,'Lora',20,true);
            setGreen();text(W-right-88,42,'Con',20,true);
            setBlack();text(W-right-135,55,'Container + Transporte',5.8,false);
            setGreen();line(left,78,W-right,78,2.0);setBlack();

            text(left,99,'Arbeitnehmerbezogene Erfassung der täglichen Arbeitszeit',11.5,true);
            text(left,118,'Arbeitgeber:',7.5,true);text(left+92,118,data.employer,7.5,false);
            text(left+410,118,'Monat/Jahr:',7.5,true);text(left+480,118,data.month,7.5,false);
            text(left,135,'Arbeitnehmer:',7.5,true);text(left+92,135,data.employee,7.5,false);
            line(left+88,121,left+400,121,0.35);line(left+88,138,left+400,138,0.35);

            let y=bodyTop;
            const headers=[
              ['Kalender','Tag'],
              ['Beginn','Arbeitszeit'],
              ['Ende','Arbeitszeit'],
              ['Summe Ruhepause','Stunden, Minuten'],
              ['Dauer (minus Pausenzeiten)','Stunden, Minuten','Arbeitszeit nach Tarif'],
              ['Baustelle / Projektnummer']
            ];
            setBlack();line(left,y,left+tableW,y,0.55);line(left,y+headerH,left+tableW,y+headerH,0.55);
            let x=left;
            headers.forEach((h,i)=>{
              line(x,y,x,y+headerH,0.45);
              const fs=i===4?5.4:6.0;
              const lead=6.5;
              centerLines(x,y+13,colW[i],h,fs,lead,true);
              x+=colW[i];
            });
            line(left+tableW,y,left+tableW,y+headerH,0.45);
            y+=headerH;

            // Beispielzeile gehört zur Originalvorlage
            line(left,y,left+tableW,y,0.45);line(left,y+exampleH,left+tableW,y+exampleH,0.45);
            x=left;
            for(let i=0;i<6;i++){
              line(x,y,x,y+exampleH,0.45);
              const val=i===0?'Beispiel:':(i===5?(data.example[5]||'Stuttgart'):'');
              if(val)text(x+4,y+15,val,6.3,i===0);
              x+=colW[i];
            }
            line(left+tableW,y,left+tableW,y+exampleH,0.45);
            y+=exampleH;

            data.days.forEach((r,idx)=>{
              const rh=finalHeights[idx];
              line(left,y,left+tableW,y,0.45);line(left,y+rh,left+tableW,y+rh,0.45);
              x=left;
              for(let i=0;i<6;i++){
                line(x,y,x,y+rh,0.45);
                const raw=r[i]||'';
                if(i===0){
                  const ls=dpL4WrapText(raw,colW[i]-6,7.0);
                  const lead=8.2;
                  centerLines(x,y+15,colW[i],ls.slice(0,3),7.0,lead,true);
                }else if(i===5){
                  const ls=dpL4WrapText(raw,colW[i]-8,projectFs);
                  const max=Math.max(1,Math.floor((rh-8)/projectLeading));
                  textLines(x+4,y+10,ls,projectFs,projectLeading,false,max);
                }else{
                  const fs=7.0;
                  const ls=dpL4WrapText(raw,colW[i]-7,fs);
                  const lead=8.0;
                  centerLines(x,y+Math.max(14,(rh-(Math.min(ls.length,3)-1)*lead)/2),colW[i],ls.slice(0,3),fs,lead,false);
                }
                x+=colW[i];
              }
              line(left+tableW,y,left+tableW,y+rh,0.45);
              y+=rh;
            });

            // Hinweise der Excelvorlage + Erstellvermerk
            const note1='Bei einer Arbeitszeit bis 6 Stunden ist eine Ruhepause von 30 Minuten und bis 9 Stunden ist eine Ruhepause von 45 Minuten einzuhalten!';
            const note2='Die Pausen können in mehreren Teilen zu je mind. 15 Minuten genommen werden!';
            text(left,565,note1,5.5,false);
            text(left,574,note2,5.5,false);
            text(W-right-235,586,'Elektronisch aus DispoPilot erstellt: '+new Date().toLocaleString('de-DE'),5.3,false);
            pages.push(cmds.join('\n'));

            const objects=[];
            const add=o=>{objects.push(o);return objects.length;};
            const catalog=add('');
            const pagesObj=add('');
            const font1=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
            const font2=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
            const pageRefs=[];
            pages.forEach(stream=>{
              const pageRef=add('');
              const contentRef=add(`<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`);
              pageRefs.push(pageRef);
              objects[pageRef-1]=`<< /Type /Page /Parent ${pagesObj} 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /Font << /F1 ${font1} 0 R /F2 ${font2} 0 R >> >> /Contents ${contentRef} 0 R >>`;
            });
            objects[catalog-1]=`<< /Type /Catalog /Pages ${pagesObj} 0 R >>`;
            objects[pagesObj-1]=`<< /Type /Pages /Count ${pageRefs.length} /Kids [${pageRefs.map(r=>r+' 0 R').join(' ')}] >>`;

            let pdf='%PDF-1.4\n%\xE2\xE3\xCF\xD3\n';
            const offsets=[0];
            objects.forEach((obj,i)=>{offsets.push(pdf.length);pdf+=`${i+1} 0 obj\n${obj}\nendobj\n`;});
            const xref=pdf.length;
            pdf+=`xref\n0 ${objects.length+1}\n0000000000 65535 f \n`;
            for(let i=1;i<offsets.length;i++)pdf+=String(offsets[i]).padStart(10,'0')+' 00000 n \n';
            pdf+=`trailer\n<< /Size ${objects.length+1} /Root ${catalog} 0 R >>\nstartxref\n${xref}\n%%EOF\n`;
            return new Blob([dpL2PdfBytes([pdf])],{type:'application/pdf'});
          }

          // L2 Download und L2 Versand verwenden beide denselben Funktionsnamen.
          // Durch diese Überschreibung erhalten daher Download UND Mailanhang das L4-Layout.
          dpL2BuildTimesheetPdf=dpL4BuildTimesheetPdf;

          /* DP_L4_LORACON_PDF_LAYOUT_END */
          """

          t=t.replace(marker,patch+"\n"+marker,1)
          p.write_text(t,encoding="utf-8",newline="\n")
          print("L4: LoraCon-PDF-Layout eingefügt.")
          PY

          grep -q "DP_L4_LORACON_PDF_LAYOUT_BEGIN" dispopilot-online-efd.html
          grep -q "cells.length<6" dispopilot-online-efd.html
          grep -q "Ziegelhütte" dispopilot-online-efd.html
          grep -q "Baustelle / Projektnummer" dispopilot-online-efd.html
          grep -q "dpL2BuildTimesheetPdf=dpL4BuildTimesheetPdf" dispopilot-online-efd.html

      - name: Apply L5 unified completed-order data and hide legacy abbreviations
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path("dispopilot-online-efd.html")
          t=p.read_text(encoding="utf-8")
          marker="/* DP13_PATCH_BEGIN */"
          if t.count(marker)!=1:
              raise SystemExit(f"L5 abgebrochen: DP13-Marker {t.count(marker)}x gefunden statt 1x.")

          patch=r"""
          /* DP_L5_EINHEITLICHE_AUFTRAEGE_OHNE_KUERZEL_BEGIN */
          // L5: Vorschau und PDF beziehen die letzte Spalte aus EINER gemeinsamen Quelle.
          // Sichtbar sind nur tatsächlich ausgeführte Aufträge des Fahrers.
          // Pro Auftrag: Kunde / Baustelle / Tätigkeit. Keine Excel-Kürzel, keine Mulden-/Materialdetails.

          function dpL5OrderKey(o){
            return String(o?.id||[o?.date,o?.customerId,o?.siteId,o?.task,o?.seq].join('|'));
          }

          function dpL5CompletedOrdersForDate(date){
            const seen=new Set();
            const all=[...(state.orders||[]),...(state.archiveOrders||[])];
            return all
              .filter(o=>o&&o.date===date&&(!o.driver||o.driver===state.user.name)&&o.status==='Ausgeführt')
              .filter(o=>{
                const k=dpL5OrderKey(o);
                if(seen.has(k))return false;
                seen.add(k);
                return true;
              })
              .sort((a,b)=>(Number(a.seq)||999)-(Number(b.seq)||999)||Number(a.id||0)-Number(b.id||0));
          }

          function dpL5OrderText(o){
            const c=customer(o?.customerId),s=site(o?.siteId);
            return [c?.name||'',s?.name||'',o?.task||'']
              .map(v=>String(v||'').replace(/\s+/g,' ').trim())
              .filter(Boolean)
              .join(' / ');
          }

          // Die bestehende Vorschau benutzt timesheetOrderText / timesheetOrderGroups.
          // Beide werden auf dieselbe neue Datenquelle gelegt.
          timesheetOrderText=function(o){return dpL5OrderText(o)};
          timesheetOrderGroups=function(date){
            const texts=dpL5CompletedOrdersForDate(date).map(dpL5OrderText).filter(Boolean);
            if(!texts.length)return ['','',''];
            const per=Math.max(1,Math.ceil(texts.length/3));
            return [0,1,2].map(i=>texts.slice(i*per,(i+1)*per).join('\n'));
          };

          // Zeilenumbrüche der einzelnen Aufträge in der Vorschau sichtbar machen.
          (function(){
            const st=document.createElement('style');
            st.id='dpL5TimesheetStyle';
            st.textContent='.tsProject{white-space:pre-line!important}';
            document.head.appendChild(st);
          })();

          // PDF: Zeiten + Aufträge werden direkt aus state gelesen.
          // Damit kann die PDF nicht mehr andere Auftragszeilen als die Vorschau erwischen.
          function dpL5ExtractTimesheet(){
            ensureWeekEntries();
            const start=new Date(String(selectedWeekMonday)+'T12:00:00');
            if(Number.isNaN(start.getTime()))throw new Error('Ungültige Kalenderwoche.');
            const days=[];
            for(let i=0;i<7;i++){
              const d=new Date(start);d.setDate(d.getDate()+i);
              const iso=plusDays(selectedWeekMonday,i);
              const e=(state.timeEntries||[]).find(x=>x.date===iso&&x.driver===state.user.name)||{};
              const mins=calcMinutes(e.start||'',e.end||'',e.pause||'');
              const orders=dpL5CompletedOrdersForDate(iso).map(dpL5OrderText).filter(Boolean).join('\n');
              days.push([
                dpL4Weekday(d)+'\n'+dpL4DateKey(d),
                e.start||'',
                e.end||'',
                e.pause||'',
                mins?fmtMinutes(mins):'',
                orders
              ]);
            }
            return {
              employer:'LoraCon GmbH',
              employee:dpL4CleanText(state.user.name||'',false),
              month:dpL4WeekMonthLabel(),
              example:['Beispiel:','','','','','Stuttgart'],
              days
            };
          }
          dpL4ExtractTimesheet=dpL5ExtractTimesheet;

          // Excel-Kürzel bleiben für alte Datensätze intern erhalten, werden aber nicht mehr angezeigt.
          function dpL5HideLegacyCodeFields(){
            ['cCode','sCode'].forEach(id=>{
              const el=$(id);
              const wrap=el&&el.closest?el.closest('div'):null;
              if(wrap)wrap.classList.add('hidden');
            });
          }

          renderCustomers=function(){
            const q=($('customerSearch').value||'').toLocaleLowerCase('de');
            const list=(state.customers||[]).slice()
              .sort((a,b)=>a.name.localeCompare(b.name,'de'))
              .filter(c=>String(c.name||'').toLocaleLowerCase('de').includes(q));
            $('customerList').innerHTML=list.map(c=>
              `<div class="card" onclick="openCustomer(${c.id})" style="cursor:pointer"><div class="row"><div class="grow"><strong>${esc(c.name)}</strong><div class="small">${c.mail?esc(c.mail):'keine Rapport-E-Mail'}</div></div><span class="badge">${(state.sites||[]).filter(s=>(s.customerId??s.cid)===c.id).length} Baustellen</span></div></div>`
            ).join('');
          };

          renderSites=function(){
            const cid=+$('siteFilter').value||0;
            const list=(state.sites||[]).slice()
              .sort((a,b)=>a.name.localeCompare(b.name,'de'))
              .filter(s=>!cid||(s.customerId??s.cid)===cid);
            $('siteList').innerHTML=list.map(s=>{
              const addr=[s.street,s.zip,s.city].filter(Boolean).join(', ');
              return `<div class="card" onclick="openSite(${s.id})" style="cursor:pointer"><strong>${esc(s.name)}</strong><div class="small">${esc(customer(s.customerId??s.cid)?.name||'')}</div>${addr?`<div class="small">${esc(addr)}</div>`:''}</div>`;
            }).join('');
          };

          dpL5HideLegacyCodeFields();
          /* DP_L5_EINHEITLICHE_AUFTRAEGE_OHNE_KUERZEL_END */
          """

          t=t.replace(marker,patch+"\n"+marker,1)
          p.write_text(t,encoding="utf-8",newline="\n")
          print("L5: einheitliche ausgeführte Aufträge und sichtbare Kürzel entfernt.")
          PY

          grep -q "DP_L5_EINHEITLICHE_AUFTRAEGE_OHNE_KUERZEL_BEGIN" dispopilot-online-efd.html
          grep -q "o.status==='Ausgeführt'" dispopilot-online-efd.html
          grep -q "return \[c?.name||'',s?.name||'',o?.task||''\]" dispopilot-online-efd.html
          grep -q "dpL4ExtractTimesheet=dpL5ExtractTimesheet" dispopilot-online-efd.html
          grep -q "dpL5HideLegacyCodeFields" dispopilot-online-efd.html

      - name: Apply F3 simplified popup acknowledgement and change type
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path("dispopilot-online-efd.html")
          t=p.read_text(encoding="utf-8")
          marker="/* DP13_PATCH_END */"
          if t.count(marker)!=1:
              raise SystemExit(f"F3 abgebrochen: DP13-Endmarker {t.count(marker)}x gefunden statt 1x.")

          patch=r"""
          /* DP_F3_POPUP_LOGIK_BEGIN */
          // F3: Ein Klick zum Ansehen, Quittierung automatisch beim Schließen.
          // Zusätzlich erhält jede Meldung eine verständliche Änderungsart.

          let dpF3LastChangeInfo=null;
          let dpF3HooksInstalled=false;

          function dpF3ChangedKeys(a,b){
            const keys=['date','driver','vehicle','seq','customerId','siteId','task','count','bin1','bin2','bin3','material','drop','billing','note','existingBinNumber','newBinNumber'];
            return keys.filter(k=>JSON.stringify(a?.[k]??'')!==JSON.stringify(b?.[k]??''));
          }

          function dpF3ClassifyOrderChange(a,b){
            const keys=dpF3ChangedKeys(a,b);
            if(keys.length===1&&keys[0]==='seq'){
              return {kind:'Reihenfolge geändert',message:'Die Disposition hat die Fahrreihenfolge dieses Auftrags geändert.'};
            }
            if(keys.length===1&&keys[0]==='date'){
              return {kind:'Termin geändert',message:'Die Disposition hat den Ausführungstag dieses Auftrags geändert.'};
            }
            if(keys.length===1&&keys[0]==='vehicle'){
              return {kind:'Fahrzeug geändert',message:'Die Disposition hat das Fahrzeug dieses Auftrags geändert.'};
            }
            return {kind:'Auftrag geändert',message:'Die Disposition hat Angaben in diesem Auftrag geändert.'};
          }

          // Die vorhandene DP13-Änderungserkennung bleibt maßgeblich. F3 merkt
          // sich nur, welche Art von Änderung unmittelbar vor der Meldung vorlag.
          const dpF3BaseChanged=dp13Changed;
          dp13Changed=function(a,b){
            const changed=dpF3BaseChanged(a,b);
            dpF3LastChangeInfo=changed?dpF3ClassifyOrderChange(a,b):null;
            return changed;
          };

          const dpF3BaseAddNotice=dp13AddNotice;
          dp13AddNotice=function(driver,orderId,kind,message){
            if(kind==='Auftrag geändert'&&dpF3LastChangeInfo){
              kind=dpF3LastChangeInfo.kind;
              message=dpF3LastChangeInfo.message;
            }
            const r=dpF3BaseAddNotice(driver,orderId,kind,message);
            dpF3LastChangeInfo=null;
            return r;
          };

          function dpF3SimplifyNoticeUi(){
            dp13EnsureUi();
            const ack=document.getElementById('dp13AckBtn');
            if(ack)ack.remove();
            const buttons=document.querySelector('#dp13Notice .dp13Buttons');
            if(buttons)buttons.style.gridTemplateColumns='1fr';
            const open=document.getElementById('dp13OpenBtn');
            if(open)open.textContent='Auftrag ansehen';
          }

          // F3 ersetzt die zweistufige Anzeige vollständig. Es gibt keinen
          // zweiten Bestätigen-Button mehr. Art, Auftrag und Zeitpunkt bleiben sichtbar.
          dp13CheckNotices=function(){
            if(!state)return;
            dpF3SimplifyNoticeUi();
            const list=dp13PendingNotices(),modal=document.getElementById('dp13Notice');
            if(!list.length){
              dp13ActiveNoticeId=null;
              modal.classList.remove('show');
              return;
            }
            const n=list[0],o=orderById(n.orderId);
            dp13ActiveNoticeId=n.id;
            document.getElementById('dp13Counter').textContent=list.length>1?'Offene Dispo-Meldungen: '+list.length:'Neue Dispo-Meldung';
            document.getElementById('dp13NoticeKind').textContent=n.kind||'Auftrag geändert';
            document.getElementById('dp13NoticeMeta').textContent=dp13OrderLabel(o)+(n.createdAt?' · '+new Date(n.createdAt).toLocaleString('de-DE'):'');
            const message=n.message||'Die Disposition hat diesen Auftrag geändert.';
            document.getElementById('dp13NoticeText').textContent=(n.openedAt?'Bereits geöffnet – noch nicht abgeschlossen. ':'')+message+' Auftrag ansehen; beim Schließen gilt diese Meldung automatisch als gelesen.';
            modal.classList.add('show');
          };

          // Auftrag ansehen schließt das Popup sofort. Falls der Auftrag inzwischen
          // nicht mehr im laufenden Bestand ist, darf die Meldung nicht festhängen.
          dp13OpenNoticeOrder=async function(){
            const n=dp13NoticeList().find(x=>x.id===dp13ActiveNoticeId);
            if(!n)return;
            if(!n.openedAt){n.openedAt=nowIso();await persist()}
            document.getElementById('dp13Notice').classList.remove('show');
            dp13ReturnNoticeId=n.id;
            const o=orderById(n.orderId);
            if(o){
              openDetail(o.id);
              return;
            }
            n.acknowledgedAt=nowIso();
            dp13ReturnNoticeId=null;
            await persist();
            alert('Der betroffene Auftrag ist nicht mehr im laufenden Bestand. Die Meldung wurde als gelesen markiert.');
            dp13ActiveNoticeId=null;
            setTimeout(dp13CheckNotices,40);
          };

          function dpF3InstallHooks(){
            if(dpF3HooksInstalled)return;
            dpF3HooksInstalled=true;

            // F2 zeigte nach dem Schließen des angesehenen Auftrags das Popup erneut.
            // F3 quittiert genau diese Meldung stattdessen automatisch.
            const dpF3BaseCloseM=closeM;
            closeM=function(id){
              if(id==='detailModal'&&dp13ReturnNoticeId){
                const noticeId=dp13ReturnNoticeId;
                dp13ReturnNoticeId=null;
                const r=dpF3BaseCloseM(id);
                const n=dp13NoticeList().find(x=>x.id===noticeId);
                if(n&&!n.acknowledgedAt)n.acknowledgedAt=nowIso();
                dp13ActiveNoticeId=null;
                Promise.resolve(persist()).finally(()=>setTimeout(dp13CheckNotices,40));
                return r;
              }
              return dpF3BaseCloseM(id);
            };

            // Direkte Reihenfolgeänderung über die ↑/↓-Funktion der Planung.
            // Nur der aktiv verschobene Auftrag erzeugt eine Meldung; dadurch
            // entstehen bei einem einfachen Tausch nicht unnötig zwei Popups.
            const dpF3BaseMoveOrder=moveOrder;
            moveOrder=async function(id,dir){
              const isDispo=typeof dp13IsDisposition==='function'&&dp13IsDisposition();
              const before=orderById(id)?JSON.parse(JSON.stringify(orderById(id))):null;
              const result=await dpF3BaseMoveOrder.apply(this,arguments);
              const after=orderById(id);
              if(isDispo&&before&&after&&Number(before.seq)!==Number(after.seq)&&after.driver){
                dpF3BaseAddNotice(
                  after.driver,
                  after.id,
                  'Reihenfolge geändert',
                  'Die Disposition hat die Fahrreihenfolge dieses Auftrags von '+String(before.seq||'?')+' auf '+String(after.seq||'?')+' geändert.'
                );
                await persist();
                if(typeof dp13CheckNotices==='function')setTimeout(dp13CheckNotices,40);
              }
              return result;
            };

            // Statusänderung durch Disposition als eigene Meldungsart kennzeichnen.
            const dpF3BaseConfirmStatus=confirmStatus;
            confirmStatus=async function(){
              const isDispo=typeof dp13IsDisposition==='function'&&dp13IsDisposition();
              const id=currentOrderId;
              const before=orderById(id)?JSON.parse(JSON.stringify(orderById(id))):null;
              const known=new Set(dp13NoticeList().map(n=>n.id));
              const result=await dpF3BaseConfirmStatus.apply(this,arguments);
              const after=orderById(id)||((state.archiveOrders||[]).find(o=>o.id===id));
              if(isDispo&&before&&after&&before.status!==after.status&&after.driver){
                const msg='Die Disposition hat den Status von „'+String(before.status||'')+'“ auf „'+String(after.status||'')+'“ geändert.';
                const added=dp13NoticeList().filter(n=>!known.has(n.id)&&n.orderId===id&&n.driver===after.driver);
                if(added.length){
                  const n=added[added.length-1];
                  n.kind='Status geändert';
                  n.message=msg;
                }else{
                  dpF3BaseAddNotice(after.driver,id,'Status geändert',msg);
                }
                await persist();
              }
              return result;
            };
          }

          const dpF3BaseInit=dp13Init;
          dp13Init=async function(){
            await dpF3BaseInit.apply(this,arguments);
            dpF3SimplifyNoticeUi();
            dpF3InstallHooks();
          };

          /* DP_F3_POPUP_LOGIK_END */
          """

          t=t.replace(marker,patch+"\n"+marker,1)
          p.write_text(t,encoding="utf-8",newline="\n")
          print("F3: vereinfachte Popup-Quittierung und Änderungsarten eingefügt.")
          PY

          grep -q "DP_F3_POPUP_LOGIK_BEGIN" dispopilot-online-efd.html
          grep -q "Reihenfolge geändert" dispopilot-online-efd.html
          grep -q "Neuer Auftrag" dispopilot-online-efd.html
          grep -q "Status geändert" dispopilot-online-efd.html
          grep -q "const dpF3BaseMoveOrder=moveOrder" dispopilot-online-efd.html
          grep -q "beim Schließen gilt diese Meldung automatisch als gelesen" dispopilot-online-efd.html
          grep -q "if(ack)ack.remove()" dispopilot-online-efd.html
          grep -q "n.acknowledgedAt=nowIso()" dispopilot-online-efd.html

      - name: Apply F4 immediate edit modal flow
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path("dispopilot-online-efd.html")
          t=p.read_text(encoding="utf-8")
          marker="/* DP13_PATCH_END */"
          if t.count(marker)!=1:
              raise SystemExit(f"F4 abgebrochen: DP13-Endmarker {t.count(marker)}x gefunden statt 1x.")

          patch=r"""
          /* DP_F4_EDIT_MODAL_FLOW_BEGIN */
          // F4: "Auftrag bearbeiten" aus der Detailansicht muss sofort sichtbar sein.
          // Die Detailansicht wird automatisch geschlossen, sobald die Bearbeitungsmaske geöffnet ist.

          let dpF4DeferNoticesUntilEditorCloses=false;

          // Falls der Auftrag aus einem F3-Popup geöffnet wurde, wird die zugehörige
          // Meldung beim Wechsel in Bearbeiten quittiert. Eine eventuell nächste
          // Meldung wartet jedoch, bis die Bearbeitungsmaske wieder geschlossen ist.
          const dpF4BaseCheckNotices=dp13CheckNotices;
          dp13CheckNotices=function(){
            const editor=document.getElementById('orderModal');
            if(dpF4DeferNoticesUntilEditorCloses&&editor?.classList.contains('show'))return;
            dpF4DeferNoticesUntilEditorCloses=false;
            return dpF4BaseCheckNotices.apply(this,arguments);
          };

          const dpF4BaseEditOrder=editOrder;
          editOrder=function(id=null){
            const detail=document.getElementById('detailModal');
            const detailWasOpen=!!detail?.classList.contains('show');
            const openedFromNotice=detailWasOpen&&!!dp13ReturnNoticeId;

            // Erst die vorhandene Bearbeitungslogik ausführen, damit alle Daten
            // wie bisher vollständig geladen werden.
            const result=dpF4BaseEditOrder.apply(this,arguments);

            // Danach das Detailfenster automatisch wegnehmen. Damit liegt die
            // Bearbeitungsmaske nicht mehr unsichtbar dahinter.
            if(detailWasOpen){
              if(openedFromNotice)dpF4DeferNoticesUntilEditorCloses=true;
              closeM('detailModal');
            }
            return result;
          };

          // Wurde während der Bearbeitung eine weitere Fahrer-Meldung zurückgestellt,
          // darf sie unmittelbar nach dem Schließen/Speichern des Editors erscheinen.
          const dpF4BaseCloseM=closeM;
          closeM=function(id){
            const result=dpF4BaseCloseM.apply(this,arguments);
            if(id==='orderModal'&&dpF4DeferNoticesUntilEditorCloses){
              dpF4DeferNoticesUntilEditorCloses=false;
              setTimeout(()=>dp13CheckNotices(),40);
            }
            return result;
          };
          /* DP_F4_EDIT_MODAL_FLOW_END */
          """

          t=t.replace(marker,patch+"\n"+marker,1)
          p.write_text(t,encoding="utf-8",newline="\n")
          print("F4: Auftragsdetail wird beim Bearbeiten automatisch geschlossen.")
          PY

          grep -q "DP_F4_EDIT_MODAL_FLOW_BEGIN" dispopilot-online-efd.html
          grep -q "const dpF4BaseEditOrder=editOrder" dispopilot-online-efd.html
          grep -q "if(detailWasOpen)" dispopilot-online-efd.html
          grep -q "closeM('detailModal')" dispopilot-online-efd.html
          grep -q "dpF4DeferNoticesUntilEditorCloses" dispopilot-online-efd.html

      - name: Apply Q1 copy order in planning only
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path("dispopilot-online-efd.html")
          t=p.read_text(encoding="utf-8")
          marker="/* DP13_PATCH_END */"
          if t.count(marker)!=1:
              raise SystemExit(f"Q1 abgebrochen: DP13-Endmarker {t.count(marker)}x gefunden statt 1x.")

          patch=r"""
          /* DP_Q1_AUFTRAG_KOPIEREN_PLANUNG_BEGIN */
          // Q1: Kopierfunktion ausschließlich in der Planungs-/Dispositionsansicht.
          // Der kopierte Datensatz ist ein neuer, eigenständiger Auftrag.

          let dpQ1CopyBusy=false;

          function dpQ1PlanningCopy(o){
            const now=nowIso();
            const driver=String(o?.driver||'');
            const date=String(o?.date||selectedDate||'');

            // Die Kopie kommt beim gleichen Fahrer zunächst ans Ende des Tages.
            let seq='';
            if(driver&&date){
              const seqs=(state.orders||[])
                .filter(x=>x.date===date&&x.driver===driver&&x.seq)
                .map(x=>Number(x.seq)||0)
                .filter(Boolean);
              seq=seqs.length?Math.max(...seqs)+1:1;
            }

            const count=Math.max(1,Math.min(10,Number(o?.count||1)));
            const binTypes=Array.isArray(o?.binTypes)
              ?o.binTypes.slice(0,count)
              :[o?.bin1||'',o?.bin2||'',o?.bin3||''].slice(0,count);

            return {
              id:uid(),
              date,
              driver,
              vehicle:o?.vehicle||'',
              seq,
              customerId:o?.customerId,
              siteId:o?.siteId,
              task:o?.task||'Stellen',
              count,
              bin1:binTypes[0]||o?.bin1||'',
              bin2:count>1?(binTypes[1]||o?.bin2||''):'',
              bin3:count>2?(binTypes[2]||o?.bin3||''):'',
              binTypes,
              material:o?.material||'',
              drop:o?.drop||'',
              billing:o?.billing||'Pauschale',
              note:o?.note||'',

              // Neue Fahrt = keine alte Muldennummer/Ausführung übernehmen.
              // Die tatsächliche Mulde wird wie besprochen bei der Ausführung bestätigt.
              binNumbers:'',
              existingBinNumber:'',
              existingBinNumbers:[],
              newBinNumber:'',
              newBinNumbers:[],
              actualBinNumbers:[],
              actualExistingBinNumbers:[],
              actualConfirmedAt:'',
              actualConfirmedBy:'',

              // Keine Status-, Rapport- oder Fehlversuchsdaten der Vorlage übernehmen.
              status:'Geplant',
              reason:'',
              reasonExtra:'',
              start:'',
              end:'',
              pause:'',
              lsNo:'',
              nonExecutionHistory:[],
              createdAt:now,
              updatedAt:now
            };
          }

          function dpQ1Toast(text){
            let el=document.getElementById('dpQ1Toast');
            if(!el){
              el=document.createElement('div');
              el.id='dpQ1Toast';
              el.style.cssText='position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:120;background:#166534;color:white;padding:10px 14px;border-radius:10px;font-weight:750;box-shadow:0 3px 14px #0004;max-width:90vw;text-align:center';
              document.body.appendChild(el);
            }
            el.textContent=text;
            el.style.display='block';
            clearTimeout(dpQ1Toast.timer);
            dpQ1Toast.timer=setTimeout(()=>{el.style.display='none'},1500);
          }

          async function dpQ1CopyOrder(id){
            if(dpQ1CopyBusy)return;
            const source=orderById(id);
            if(!source)return alert('Der zu kopierende Auftrag wurde nicht gefunden.');

            dpQ1CopyBusy=true;
            try{
              const copy=dpQ1PlanningCopy(source);
              state.orders.push(copy);

              // Bestehende D-Fahrfolgelogik bleibt maßgeblich.
              if(copy.driver&&copy.date&&typeof dpDNormalizeGroup==='function'){
                dpDNormalizeGroup(copy.date,copy.driver);
              }

              // Ein kopierter, fest zugeordneter Auftrag ist für den Fahrer ein neuer Auftrag.
              if(copy.driver&&typeof dp13IsDisposition==='function'&&dp13IsDisposition()&&typeof dpF3BaseAddNotice==='function'){
                dpF3BaseAddNotice(
                  copy.driver,
                  copy.id,
                  'Neuer Auftrag',
                  'Die Disposition hat einen neuen Auftrag durch Kopieren eingeplant.'
                );
              }

              await persist();
              renderPlanning();
              if(typeof renderOrders==='function')renderOrders();
              dpQ1Toast('Auftrag kopiert · Fahrfolge '+String(copy.seq||'offen'));
            }catch(e){
              console.error('DispoPilot Q1 Auftrag kopieren:',e);
              alert('Der Auftrag konnte nicht kopiert werden.');
            }finally{
              dpQ1CopyBusy=false;
            }
          }

          // Nur die Planung erhält den Kopierbutton. Fahrer-/Auftragsansicht bleibt unverändert.
          renderPlanning=function(){
            updatePlanningWeekHeader();
            weekToolbar('weekToolbar','selectPlanningDate');
            driverToolbar();
            let list=state.orders
              .filter(o=>o.date===selectedDate&&(selectedDriver==='all'||(selectedDriver==='__open__'?(!o.driver||!o.vehicle||!o.seq):o.driver===selectedDriver)))
              .sort((a,b)=>(a.driver||'ZZZ').localeCompare(b.driver||'ZZZ','de')||((a.seq||999)-(b.seq||999)));

            if(!list.length){
              $('planList').innerHTML='<div class="card small">Für diesen Tag sind keine Aufträge vorhanden.</div>';
              return;
            }

            const groups={};
            list.forEach(o=>{
              const key=o.driver||'Noch nicht disponiert';
              (groups[key]??=[]).push(o);
            });

            $('planList').innerHTML=Object.entries(groups).map(([d,os])=>
              `<div class="section">${esc(d)}</div>`+
              os.map(o=>`<div class="row">
                <div class="grow">${orderCard(o)}</div>
                <div class="row" style="gap:5px;justify-content:flex-end">
                  ${o.driver&&o.seq?`<button class="btn secondary" type="button" title="eine Position nach oben" onclick="event.stopPropagation();moveOrder(${o.id},-1)">↑</button>
                  <button class="btn secondary" type="button" title="eine Position nach unten" onclick="event.stopPropagation();moveOrder(${o.id},1)">↓</button>`:''}
                  <button class="btn secondary" type="button" title="Auftrag als neuen geplanten Auftrag kopieren" onclick="event.stopPropagation();dpQ1CopyOrder(${o.id})">⧉ Kopieren</button>
                </div>
              </div>`).join('')
            ).join('');
          };
          /* DP_Q1_AUFTRAG_KOPIEREN_PLANUNG_END */
          """

          t=t.replace(marker,patch+"\n"+marker,1)
          p.write_text(t,encoding="utf-8",newline="\n")
          print("Q1: Auftrag kopieren nur in der Planung eingefügt.")
          PY

          grep -q "DP_Q1_AUFTRAG_KOPIEREN_PLANUNG_BEGIN" dispopilot-online-efd.html
          grep -q "async function dpQ1CopyOrder" dispopilot-online-efd.html
          grep -q "⧉ Kopieren" dispopilot-online-efd.html
          grep -q "status:'Geplant'" dispopilot-online-efd.html
          grep -q "actualBinNumbers:\[\]" dispopilot-online-efd.html
          grep -q "Die Disposition hat einen neuen Auftrag durch Kopieren eingeplant" dispopilot-online-efd.html

      - name: Apply Q2 delete planned orders in planning only
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path("dispopilot-online-efd.html")
          t=p.read_text(encoding="utf-8")
          marker="/* DP13_PATCH_END */"
          if t.count(marker)!=1:
              raise SystemExit(f"Q2 abgebrochen: DP13-Endmarker {t.count(marker)}x gefunden statt 1x.")

          patch=r"""
          /* DP_Q2_AUFTRAG_LOESCHEN_PLANUNG_BEGIN */
          // Q2: Löschen ausschließlich in Planung/Disposition und nur für
          // unberührte Aufträge mit Status Geplant. Intern bleibt ein Audit-Snapshot.

          let dpQ2DeleteBusy=false;

          function dpQ2CanDeleteOrder(o){
            if(!o||String(o.status||'Geplant')!=='Geplant')return false;
            if(o.actualConfirmedAt||o.actualConfirmedBy)return false;
            if((o.actualBinNumbers||[]).length||(o.actualExistingBinNumbers||[]).length)return false;
            if(String(o.start||'')||String(o.end||'')||String(o.lsNo||''))return false;
            if(Array.isArray(o.nonExecutionHistory)&&o.nonExecutionHistory.length)return false;
            return true;
          }

          function dpQ2DeleteLabel(o){
            const c=typeof customer==='function'?customer(o.customerId):null;
            const s=typeof site==='function'?site(o.siteId):null;
            return [c?.name||'',s?.name||'',o?.task||''].filter(Boolean).join(' / ')||'Auftrag';
          }

          async function dpQ2DeleteOrder(id){
            if(dpQ2DeleteBusy)return;
            const o=orderById(id);
            if(!o)return alert('Der Auftrag wurde nicht gefunden.');
            if(!dpQ2CanDeleteOrder(o)){
              return alert('Dieser Auftrag kann nicht mehr gelöscht werden. Löschen ist nur bei einem noch nicht ausgeführten Auftrag mit Status „Geplant“ ohne Ausführungs- oder Historiedaten möglich.');
            }

            const label=dpQ2DeleteLabel(o);
            if(!confirm('Auftrag wirklich löschen?\n\n'+label+'\n\nDer Auftrag verschwindet aus der Planung.'))return;

            dpQ2DeleteBusy=true;
            try{
              const oldDate=o.date;
              const oldDriver=o.driver;
              const deletedAt=nowIso();
              const deletedBy=state?.user?.name||state?.user?.email||'';

              // Audit-Snapshot: nicht in der normalen Historie sichtbar, aber technisch erhalten.
              state.archiveOrders=state.archiveOrders||[];
              const audit=clone(o);
              audit.deletedInPlanning=true;
              audit.deletedAt=deletedAt;
              audit.deletedBy=deletedBy;
              audit.archiveSource='In Planung gelöscht';
              audit.statusAtDeletion=o.status||'Geplant';
              state.archiveOrders.push(audit);

              // Ein bereits zugeordneter Fahrer soll wissen, dass der geplante Auftrag entfällt.
              if(o.driver&&typeof dp13AddNotice==='function'){
                dp13AddNotice(
                  o.driver,
                  o.id,
                  'Auftrag gelöscht',
                  'Die Disposition hat den geplanten Auftrag „'+label+'“ gelöscht.'
                );
              }

              state.orders=state.orders.filter(x=>x.id!==id);

              if(oldDate&&oldDriver&&typeof dpDNormalizeGroup==='function'){
                dpDNormalizeGroup(oldDate,oldDriver);
              }

              await persist();
              renderPlanning();
              if(typeof renderOrders==='function')renderOrders();
              if(typeof dpQ1Toast==='function')dpQ1Toast('Auftrag gelöscht');
            }catch(e){
              console.error('DispoPilot Q2 Auftrag löschen:',e);
              alert('Der Auftrag konnte nicht gelöscht werden.');
            }finally{
              dpQ2DeleteBusy=false;
            }
          }

          // Gelöschte Planungsaufträge bleiben als Audit-Datensatz erhalten,
          // werden aber in der normalen Historienansicht nicht angezeigt.
          if(typeof renderHistory==='function'){
            const dpQ2BaseRenderHistory=renderHistory;
            renderHistory=function(){
              const all=state.archiveOrders||[];
              state.archiveOrders=all.filter(o=>!o.deletedInPlanning);
              try{
                return dpQ2BaseRenderHistory.apply(this,arguments);
              }finally{
                state.archiveOrders=all;
              }
            };
          }

          // Für „Auftrag gelöscht“ gibt es nichts mehr zu öffnen: eine einfache
          // Quittierung reicht und verhindert einen irreführenden Öffnen-Dialog.
          if(typeof dp13CheckNotices==='function'){
            const dpQ2BaseCheckNotices=dp13CheckNotices;
            dp13CheckNotices=function(){
              const r=dpQ2BaseCheckNotices.apply(this,arguments);
              const n=dp13NoticeList().find(x=>x.id===dp13ActiveNoticeId);
              if(n&&n.kind==='Auftrag gelöscht'){
                const open=document.getElementById('dp13OpenBtn');
                if(open)open.textContent='Meldung schließen';
                const txt=document.getElementById('dp13NoticeText');
                if(txt)txt.textContent=(n.message||'Die Disposition hat einen geplanten Auftrag gelöscht.')+' Diese Meldung kann direkt geschlossen werden.';
              }
              return r;
            };
          }

          if(typeof dp13OpenNoticeOrder==='function'){
            const dpQ2BaseOpenNoticeOrder=dp13OpenNoticeOrder;
            dp13OpenNoticeOrder=async function(){
              const n=dp13NoticeList().find(x=>x.id===dp13ActiveNoticeId);
              if(n&&n.kind==='Auftrag gelöscht'){
                if(!n.openedAt)n.openedAt=nowIso();
                n.acknowledgedAt=nowIso();
                dp13ActiveNoticeId=null;
                dp13ReturnNoticeId=null;
                const modal=document.getElementById('dp13Notice');
                if(modal)modal.classList.remove('show');
                await persist();
                setTimeout(dp13CheckNotices,40);
                return;
              }
              return dpQ2BaseOpenNoticeOrder.apply(this,arguments);
            };
          }

          // Q1 hatte renderPlanning bereits für Kopieren erweitert. Q2 ergänzt
          // dort den Löschbutton ausschließlich für zulässige geplante Aufträge.
          renderPlanning=function(){
            updatePlanningWeekHeader();
            weekToolbar('weekToolbar','selectPlanningDate');
            driverToolbar();
            let list=state.orders
              .filter(o=>o.date===selectedDate&&(selectedDriver==='all'||(selectedDriver==='__open__'?(!o.driver||!o.vehicle||!o.seq):o.driver===selectedDriver)))
              .sort((a,b)=>(a.driver||'ZZZ').localeCompare(b.driver||'ZZZ','de')||((a.seq||999)-(b.seq||999)));

            if(!list.length){
              $('planList').innerHTML='<div class="card small">Für diesen Tag sind keine Aufträge vorhanden.</div>';
              return;
            }

            const groups={};
            list.forEach(o=>{
              const key=o.driver||'Noch nicht disponiert';
              (groups[key]??=[]).push(o);
            });

            $('planList').innerHTML=Object.entries(groups).map(([d,os])=>
              `<div class="section">${esc(d)}</div>`+
              os.map(o=>`<div class="row">
                <div class="grow">${orderCard(o)}</div>
                <div class="row" style="gap:5px;justify-content:flex-end;flex-wrap:wrap">
                  ${o.driver&&o.seq?`<button class="btn secondary" type="button" title="eine Position nach oben" onclick="event.stopPropagation();moveOrder(${o.id},-1)">↑</button>
                  <button class="btn secondary" type="button" title="eine Position nach unten" onclick="event.stopPropagation();moveOrder(${o.id},1)">↓</button>`:''}
                  <button class="btn secondary" type="button" title="Auftrag als neuen geplanten Auftrag kopieren" onclick="event.stopPropagation();dpQ1CopyOrder(${o.id})">⧉ Kopieren</button>
                  ${dpQ2CanDeleteOrder(o)?`<button class="btn secondary" style="border-color:#b91c1c;color:#b91c1c" type="button" title="geplanten Auftrag löschen" onclick="event.stopPropagation();dpQ2DeleteOrder(${o.id})">Löschen</button>`:''}
                </div>
              </div>`).join('')
            ).join('');
          };
          /* DP_Q2_AUFTRAG_LOESCHEN_PLANUNG_END */
          """

          t=t.replace(marker,patch+"\n"+marker,1)
          p.write_text(t,encoding="utf-8",newline="\n")
          print("Q2: Löschen geplanter Aufträge nur in der Planung eingefügt.")
          PY

          grep -q "DP_Q2_AUFTRAG_LOESCHEN_PLANUNG_BEGIN" dispopilot-online-efd.html
          grep -q "async function dpQ2DeleteOrder" dispopilot-online-efd.html
          grep -q "deletedInPlanning=true" dispopilot-online-efd.html
          grep -q "Auftrag gelöscht" dispopilot-online-efd.html
          grep -q "Meldung schließen" dispopilot-online-efd.html
          grep -q "dpQ2CanDeleteOrder(o)" dispopilot-online-efd.html
          grep -q "geplanten Auftrag löschen" dispopilot-online-efd.html

      - name: Apply R1 Direktverladung Material and Transportorte
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path("dispopilot-online-efd.html")
          t=p.read_text(encoding="utf-8")
          marker="/* DP13_PATCH_END */"
          if t.count(marker)!=1:
              raise SystemExit(f"R1 abgebrochen: DP13-Endmarker {t.count(marker)}x gefunden statt 1x.")

          patch=r"""
          /* DP_R1_DIREKTVERLADUNG_MATERIAL_TRANSPORTORTE_BEGIN */
          // R1: eine neue Auftragsart "Direktverladung" sowie robuste,
          // touch-taugliche Auswahllisten für Material und Transportorte.
          // Transportorte sind bewusst neutral: derselbe Ort kann im Auftrag
          // Ladeort oder Abladeort sein. Adress-/GPS-Felder sind im Datenmodell
          // bereits vorbereitet, werden in R1 aber noch nicht zwingend gepflegt.

          function dpR1EnsureState(){
            if(!state)return;
            if(!Array.isArray(state.materials))state.materials=[];
            if(!Array.isArray(state.transportLocations))state.transportLocations=[];

            const normalized=[];
            const seen=new Set();
            const add=(raw)=>{
              if(!raw)return;
              const o=(typeof raw==='string')?{name:raw}:raw;
              const name=String(o.name||'').trim();
              if(!name)return;
              const key=name.toLocaleLowerCase('de');
              if(seen.has(key))return;
              seen.add(key);
              normalized.push({
                id:String(o.id||('loc-'+uid())),
                name,
                active:o.active!==false,
                street:String(o.street||''),
                zip:String(o.zip||''),
                city:String(o.city||''),
                phone:String(o.phone||''),
                mapsUrl:String(o.mapsUrl||''),
                lat:o.lat==null?'':o.lat,
                lon:o.lon==null?'':o.lon
              });
            };
            state.transportLocations.forEach(add);

            // Bestehende alte Abladeorte und bereits gespeicherte Aufträge
            // automatisch in die neue gemeinsame Ortsliste übernehmen.
            const oldOptions=document.querySelectorAll('#dropOptions option');
            oldOptions.forEach(x=>add(x.value||x.textContent||''));
            (state.orders||[]).forEach(o=>{
              if(o.drop&&!o.unloadAtSite)add(o.drop);
              if(o.loadLocationName&&!o.loadAtSite)add(o.loadLocationName);
              if(o.unloadLocationName&&!o.unloadAtSite)add(o.unloadLocationName);
            });
            state.transportLocations=normalized;
          }

          function dpR1ActiveLocations(){
            dpR1EnsureState();
            return (state.transportLocations||[])
              .filter(x=>x.active!==false)
              .slice()
              .sort((a,b)=>a.name.localeCompare(b.name,'de'));
          }

          function dpR1FindLocation(id){
            dpR1EnsureState();
            return (state.transportLocations||[]).find(x=>String(x.id)===String(id));
          }

          function dpR1FindLocationByName(name){
            const key=String(name||'').trim().toLocaleLowerCase('de');
            if(!key)return null;
            dpR1EnsureState();
            return (state.transportLocations||[]).find(x=>x.name.toLocaleLowerCase('de')===key)||null;
          }

          function dpR1SiteLabel(){
            const s=site(+$('oSite')?.value);
            return s?.name||'Baustelle';
          }

          function dpR1LocationOptions(selected=''){
            const cur=String(selected||'');
            return '<option value="">— Ort wählen —</option>'
              +dpR1ActiveLocations().map(x=>
                '<option value="'+esc(x.id)+'" '+(String(x.id)===cur?'selected':'')+'>'+esc(x.name)+'</option>'
              ).join('');
          }

          function dpR1MaterialOptions(selected=''){
            dpR1EnsureState();
            const list=(state.materials||[]).slice().sort((a,b)=>String(a).localeCompare(String(b),'de'));
            const cur=String(selected||'');
            let html='<option value="">— Material wählen —</option>';
            html+=list.map(x=>'<option value="'+esc(x)+'" '+(String(x)===cur?'selected':'')+'>'+esc(x)+'</option>').join('');
            if(cur&&!list.some(x=>String(x)===cur))html+='<option value="'+esc(cur)+'" selected>'+esc(cur)+'</option>';
            return html;
          }

          async function dpR1AddMaterial(targetId='dpR1MaterialSelect'){
            const name=String(prompt('Neues Material / neuer Inhalt:')||'').trim();
            if(!name)return;
            dpR1EnsureState();
            if(!state.materials.some(x=>String(x).toLocaleLowerCase('de')===name.toLocaleLowerCase('de'))){
              state.materials.push(name);
              await persist();
            }
            dpR1RefreshSelectors();
            const sel=$(targetId);
            if(sel)sel.value=name;
            if($('oMaterial'))$('oMaterial').value=name;
            if(typeof renderSettings==='function')renderSettings();
          }

          async function dpR1AddLocation(targetId){
            const name=String(prompt('Neuer Transportort:')||'').trim();
            if(!name)return;
            dpR1EnsureState();
            let loc=dpR1FindLocationByName(name);
            if(!loc){
              loc={id:'loc-'+uid(),name,active:true,street:'',zip:'',city:'',phone:'',mapsUrl:'',lat:'',lon:''};
              state.transportLocations.push(loc);
              await persist();
            }else if(loc.active===false){
              loc.active=true;
              await persist();
            }
            dpR1RefreshSelectors();
            const sel=$(targetId);
            if(sel)sel.value=loc.id;
            dpR1SyncLegacyFields();
            if(typeof renderSettings==='function')renderSettings();
          }

          function dpR1InstallTaskOption(){
            const el=$('oTask');
            if(!el)return;
            if(!Array.from(el.options).some(o=>o.value==='Direktverladung')){
              const opt=document.createElement('option');
              opt.value='Direktverladung';
              opt.textContent='Direktverladung';
              // vor den administrativen Tätigkeiten einordnen
              const before=Array.from(el.options).find(o=>['Werkstatt','Aufräumen','Sonstiges'].includes(o.value));
              before?el.insertBefore(opt,before):el.appendChild(opt);
            }
          }

          function dpR1InstallOrderUi(){
            dpR1InstallTaskOption();
            const materialField=$('materialField');
            const dropField=$('dropField');
            if(!materialField||!dropField)return;

            if(!$('dpR1MaterialRow')){
              const old=$('oMaterial');
              if(old)old.style.display='none';
              const remember=$('rememberMaterial')?.closest('.switchline');
              if(remember)remember.style.display='none';
              const row=document.createElement('div');
              row.id='dpR1MaterialRow';
              row.className='row';
              row.innerHTML='<select class="grow" id="dpR1MaterialSelect" onchange="dpR1SyncLegacyFields()"></select>'
                +'<button class="btn secondary" type="button" onclick="dpR1AddMaterial()">＋ Neu</button>';
              materialField.appendChild(row);
            }

            if(!$('dpR1DropRow')){
              const old=$('oDrop');
              if(old)old.style.display='none';
              const row=document.createElement('div');
              row.id='dpR1DropRow';
              row.className='row';
              row.innerHTML='<select class="grow" id="dpR1DropSelect" onchange="dpR1SyncLegacyFields()"></select>'
                +'<button class="btn secondary" type="button" onclick="dpR1AddLocation(\'dpR1DropSelect\')">＋ Neu</button>';
              dropField.appendChild(row);
              const label=dropField.querySelector('label');
              if(label)label.textContent='Abladeort';
            }

            if(!$('dpR1DirectFields')){
              const wrap=document.createElement('div');
              wrap.id='dpR1DirectFields';
              wrap.className='hidden';
              wrap.style.gridColumn='1/-1';
              wrap.innerHTML=
                '<div class="section" style="margin:2px 0 8px">Direktverladung</div>'
                +'<div class="form">'
                +'<div><label>Ladeort</label>'
                +'<label class="switchline" style="margin:0 0 7px"><input id="dpR1LoadAtSite" type="checkbox" onchange="dpR1DirectToggle()"><span>Baustelle als Ladeort</span></label>'
                +'<div class="row" id="dpR1LoadLocationRow"><select class="grow" id="dpR1LoadLocation"></select><button class="btn secondary" type="button" onclick="dpR1AddLocation(\'dpR1LoadLocation\')">＋ Neu</button></div>'
                +'<div class="small" id="dpR1LoadSiteHint"></div></div>'
                +'<div><label>Abladeort</label>'
                +'<label class="switchline" style="margin:0 0 7px"><input id="dpR1UnloadAtSite" type="checkbox" onchange="dpR1DirectToggle()"><span>Baustelle als Abladeort</span></label>'
                +'<div class="row" id="dpR1UnloadLocationRow"><select class="grow" id="dpR1UnloadLocation"></select><button class="btn secondary" type="button" onclick="dpR1AddLocation(\'dpR1UnloadLocation\')">＋ Neu</button></div>'
                +'<div class="small" id="dpR1UnloadSiteHint"></div></div>'
                +'</div>';
              dropField.after(wrap);
            }
          }

          function dpR1RefreshSelectors(){
            dpR1EnsureState();
            dpR1InstallOrderUi();

            const m=$('dpR1MaterialSelect');
            if(m){
              const cur=m.value||$('oMaterial')?.value||'';
              m.innerHTML=dpR1MaterialOptions(cur);
              m.value=cur;
            }
            ['dpR1DropSelect','dpR1LoadLocation','dpR1UnloadLocation'].forEach(id=>{
              const el=$(id);
              if(!el)return;
              const cur=el.value||'';
              el.innerHTML=dpR1LocationOptions(cur);
              if(cur&&Array.from(el.options).some(o=>o.value===cur))el.value=cur;
            });
          }

          function dpR1DirectToggle(){
            const siteName=dpR1SiteLabel();
            const loadAt=!!$('dpR1LoadAtSite')?.checked;
            const unloadAt=!!$('dpR1UnloadAtSite')?.checked;
            $('dpR1LoadLocationRow')?.classList.toggle('hidden',loadAt);
            $('dpR1UnloadLocationRow')?.classList.toggle('hidden',unloadAt);
            if($('dpR1LoadSiteHint'))$('dpR1LoadSiteHint').textContent=loadAt?'Ladeort: '+siteName:'';
            if($('dpR1UnloadSiteHint'))$('dpR1UnloadSiteHint').textContent=unloadAt?'Abladeort: '+siteName:'';
            dpR1SyncLegacyFields();
          }

          function dpR1SyncLegacyFields(){
            const mat=$('dpR1MaterialSelect')?.value||'';
            if($('oMaterial'))$('oMaterial').value=mat;

            if($('oTask')?.value==='Direktverladung'){
              const unloadAt=!!$('dpR1UnloadAtSite')?.checked;
              const unload=dpR1FindLocation($('dpR1UnloadLocation')?.value||'');
              if($('oDrop'))$('oDrop').value=unloadAt?dpR1SiteLabel():(unload?.name||'');
            }else{
              const loc=dpR1FindLocation($('dpR1DropSelect')?.value||'');
              if($('oDrop'))$('oDrop').value=loc?.name||'';
            }
          }

          function dpR1ApplyTaskUi(){
            dpR1InstallOrderUi();
            dpR1RefreshSelectors();
            const direct=$('oTask')?.value==='Direktverladung';
            $('dpR1DirectFields')?.classList.toggle('hidden',!direct);
            // Bei Direktverladung wird die Materialauswahl gezeigt, der normale
            // Abladeort-Block durch die zwei expliziten Ortsfelder ersetzt.
            if(direct){
              $('materialField')?.classList.remove('hidden');
              $('dropField')?.classList.add('hidden');
              $('standingBinField')?.classList.add('hidden');
              $('newBinField')?.classList.add('hidden');
            }
            dpR1DirectToggle();
          }

          function dpR1LoadOrderIntoUi(o){
            dpR1InstallOrderUi();
            dpR1RefreshSelectors();
            if($('dpR1MaterialSelect')){
              $('dpR1MaterialSelect').innerHTML=dpR1MaterialOptions(o?.material||'');
              $('dpR1MaterialSelect').value=o?.material||'';
            }

            const legacyDrop=String(o?.drop||'');
            const legacyLoc=dpR1FindLocation(o?.dropLocationId)||dpR1FindLocationByName(legacyDrop);
            if($('dpR1DropSelect')){
              $('dpR1DropSelect').innerHTML=dpR1LocationOptions(legacyLoc?.id||'');
              $('dpR1DropSelect').value=legacyLoc?.id||'';
            }

            if(o?.task==='Direktverladung'){
              const loadAt=o.loadAtSite===true;
              const unloadAt=o.unloadAtSite===true;
              if($('dpR1LoadAtSite'))$('dpR1LoadAtSite').checked=loadAt;
              if($('dpR1UnloadAtSite'))$('dpR1UnloadAtSite').checked=unloadAt;
              const loadLoc=dpR1FindLocation(o.loadLocationId)||dpR1FindLocationByName(o.loadLocationName||'');
              const unloadLoc=dpR1FindLocation(o.unloadLocationId)||dpR1FindLocationByName(o.unloadLocationName||legacyDrop);
              if($('dpR1LoadLocation')){
                $('dpR1LoadLocation').innerHTML=dpR1LocationOptions(loadLoc?.id||'');
                $('dpR1LoadLocation').value=loadLoc?.id||'';
              }
              if($('dpR1UnloadLocation')){
                $('dpR1UnloadLocation').innerHTML=dpR1LocationOptions(unloadLoc?.id||'');
                $('dpR1UnloadLocation').value=unloadLoc?.id||'';
              }
            }else{
              if($('dpR1LoadAtSite'))$('dpR1LoadAtSite').checked=false;
              if($('dpR1UnloadAtSite'))$('dpR1UnloadAtSite').checked=false;
              if($('dpR1LoadLocation'))$('dpR1LoadLocation').value='';
              if($('dpR1UnloadLocation'))$('dpR1UnloadLocation').value='';
            }
            dpR1ApplyTaskUi();
            dpR1SyncLegacyFields();
          }

          // Die vorhandene taskChanged-Logik bleibt für alle bisherigen
          // Auftragsarten maßgeblich; R1 ergänzt nur Direktverladung und neue Listen.
          const dpR1BaseTaskChanged=taskChanged;
          taskChanged=function(){
            const r=dpR1BaseTaskChanged.apply(this,arguments);
            dpR1ApplyTaskUi();
            return r;
          };

          const dpR1BaseEditOrder=editOrder;
          editOrder=function(id=null){
            dpR1InstallOrderUi();
            dpR1InstallTaskOption();
            const r=dpR1BaseEditOrder.apply(this,arguments);
            const o=id?orderById(id):null;
            dpR1LoadOrderIntoUi(o||{task:'Stellen',material:'',drop:''});
            return r;
          };

          const dpR1BaseSaveOrder=saveOrder;
          saveOrder=async function(){
            dpR1EnsureState();
            dpR1SyncLegacyFields();
            const direct=$('oTask')?.value==='Direktverladung';
            const editId=editingOrderId;
            const beforeIds=new Set((state.orders||[]).map(o=>o.id));

            let rdata=null;
            if(direct){
              const material=String($('dpR1MaterialSelect')?.value||'').trim();
              const loadAt=!!$('dpR1LoadAtSite')?.checked;
              const unloadAt=!!$('dpR1UnloadAtSite')?.checked;
              const loadLoc=loadAt?null:dpR1FindLocation($('dpR1LoadLocation')?.value||'');
              const unloadLoc=unloadAt?null:dpR1FindLocation($('dpR1UnloadLocation')?.value||'');
              if(!material)return alert('Bitte Material auswählen oder neu anlegen.');
              if(!loadAt&&!loadLoc)return alert('Bitte Ladeort auswählen oder „Baustelle als Ladeort“ aktivieren.');
              if(!unloadAt&&!unloadLoc)return alert('Bitte Abladeort auswählen oder „Baustelle als Abladeort“ aktivieren.');
              if(loadAt&&unloadAt)return alert('Bei Direktverladung können Ladeort und Abladeort nicht beide dieselbe Baustelle sein.');
              rdata={
                loadAtSite:loadAt,
                unloadAtSite:unloadAt,
                loadLocationId:loadLoc?.id||'',
                loadLocationName:loadAt?dpR1SiteLabel():(loadLoc?.name||''),
                unloadLocationId:unloadLoc?.id||'',
                unloadLocationName:unloadAt?dpR1SiteLabel():(unloadLoc?.name||''),
                dropLocationId:unloadLoc?.id||''
              };
            }else{
              const dropLoc=dpR1FindLocation($('dpR1DropSelect')?.value||'');
              rdata={
                loadAtSite:false,unloadAtSite:false,
                loadLocationId:'',loadLocationName:'',
                unloadLocationId:'',unloadLocationName:'',
                dropLocationId:dropLoc?.id||''
              };
            }

            const result=await dpR1BaseSaveOrder.apply(this,arguments);
            const saved=editId?orderById(editId):(state.orders||[]).find(o=>!beforeIds.has(o.id));
            if(saved&&rdata){
              Object.assign(saved,rdata,{updatedAt:nowIso()});
              await persist();
              renderAll();
            }
            return result;
          };

          // Fahrer muss bei Direktverladung die tatsächlich verwendeten Mulden
          // ebenso bestätigen können. Der Bestand wird dadurch nicht automatisch
          // an Kunde/Entsorger verschoben: nach Direktverladung bleibt die Mulde
          // technisch beim Fahrzeug / bisherigen Bestand, bis ein eigener
          // Standortsvorgang das ändert.
          if(typeof dpA3BinTask==='function'){
            const dpR1BaseA3BinTask=dpA3BinTask;
            dpA3BinTask=function(o){return !!o&&(o.task==='Direktverladung'||dpR1BaseA3BinTask(o));};
          }

          // Kopierte Direktverladungen übernehmen ihre Planungsdaten ebenfalls,
          // bleiben aber neue eigenständige Aufträge ohne Ausführungsdaten.
          if(typeof dpQ1PlanningCopy==='function'){
            const dpR1BaseQ1PlanningCopy=dpQ1PlanningCopy;
            dpQ1PlanningCopy=function(o){
              const c=dpR1BaseQ1PlanningCopy(o);
              c.loadAtSite=!!o?.loadAtSite;
              c.unloadAtSite=!!o?.unloadAtSite;
              c.loadLocationId=o?.loadLocationId||'';
              c.loadLocationName=o?.loadLocationName||'';
              c.unloadLocationId=o?.unloadLocationId||'';
              c.unloadLocationName=o?.unloadLocationName||'';
              c.dropLocationId=o?.dropLocationId||'';
              return c;
            };
          }

          // Direktverladung in der Detailansicht eindeutig mit Richtung zeigen.
          const dpR1BaseOpenDetail=openDetail;
          openDetail=function(id){
            const r=dpR1BaseOpenDetail.apply(this,arguments);
            const o=orderById(id);
            if(o?.task==='Direktverladung'){
              const body=$('detailBody');
              if(body&&!$('dpR1DetailRoute')){
                const card=document.createElement('div');
                card.id='dpR1DetailRoute';
                card.className='card';
                const load=o.loadAtSite?(site(o.siteId)?.name||'Baustelle'):(o.loadLocationName||dpR1FindLocation(o.loadLocationId)?.name||'Ladeort offen');
                const unload=o.unloadAtSite?(site(o.siteId)?.name||'Baustelle'):(o.unloadLocationName||dpR1FindLocation(o.unloadLocationId)?.name||o.drop||'Abladeort offen');
                card.innerHTML='<strong>Direktverladung</strong>'
                  +'<div style="margin-top:6px"><strong>Ladeort:</strong> '+esc(load)+'</div>'
                  +'<div><strong>Material:</strong> '+esc(o.material||'')+'</div>'
                  +'<div><strong>Abladeort:</strong> '+esc(unload)+'</div>';
                body.prepend(card);
              }
            }
            return r;
          };

          // ------------------------------------------------------------
          // Stammdaten: Transportorte. Materialien bleiben in der bereits
          // vorhandenen Materialliste und werden zusätzlich direkt im Auftrag
          // über „+ Neu“ ergänzt.
          // ------------------------------------------------------------
          function dpR1InstallSettings(){
            const screen=$('settings');
            if(!screen)return;
            const materialCard=$('materialList')?.closest('.card');
            if(materialCard){
              const h=materialCard.querySelector('h3');
              if(h)h.textContent='Materialien';
              const small=materialCard.querySelector('.small');
              if(small)small.textContent='Zentrale Materialliste für Aufträge. Neue Materialien können auch direkt im Auftrag ergänzt werden.';
            }
            if($('dpR1TransportCard'))return;
            const card=document.createElement('div');
            card.id='dpR1TransportCard';
            card.className='card';
            card.innerHTML='<h3>Transportorte</h3>'
              +'<div class="small" style="margin-bottom:8px">Gemeinsame Liste für Lade- und Abladeorte. Ein Ort kann je nach Auftrag beide Rollen haben. Adresse/GPS sind für eine spätere Erweiterung vorbereitet.</div>'
              +'<div id="dpR1TransportList"></div>'
              +'<div class="row" style="margin-top:10px"><input class="grow" id="dpR1NewLocation" placeholder="Neuen Transportort hinzufügen"><button class="btn secondary" type="button" onclick="dpR1AddLocationFromSettings()">Hinzufügen</button></div>';
            if(materialCard)materialCard.after(card); else screen.appendChild(card);
          }

          function dpR1RenderSettings(){
            dpR1EnsureState();
            dpR1InstallSettings();
            const host=$('dpR1TransportList');
            if(!host)return;
            host.innerHTML=(state.transportLocations||[])
              .slice().sort((a,b)=>a.name.localeCompare(b.name,'de'))
              .map(x=>'<div class="row" style="margin:7px 0">'
                +'<div class="grow"><input value="'+esc(x.name)+'" onchange="dpR1RenameLocation(\''+esc(x.id)+'\',this.value)"></div>'
                +'<label class="switchline" style="margin:0"><input type="checkbox" '+(x.active!==false?'checked':'')+' onchange="dpR1ToggleLocation(\''+esc(x.id)+'\',this.checked)"><span>aktiv</span></label>'
                +'</div>').join('');
          }

          async function dpR1AddLocationFromSettings(){
            const el=$('dpR1NewLocation');
            const name=String(el?.value||'').trim();
            if(!name)return;
            let loc=dpR1FindLocationByName(name);
            if(!loc){
              loc={id:'loc-'+uid(),name,active:true,street:'',zip:'',city:'',phone:'',mapsUrl:'',lat:'',lon:''};
              state.transportLocations.push(loc);
            }else loc.active=true;
            if(el)el.value='';
            await persist();
            dpR1RenderSettings();
            dpR1RefreshSelectors();
          }

          async function dpR1RenameLocation(id,value){
            const loc=dpR1FindLocation(id);
            const name=String(value||'').trim();
            if(!loc||!name)return dpR1RenderSettings();
            loc.name=name;
            // Anzeigenamen in alten Aufträgen aktualisieren, IDs bleiben maßgeblich.
            (state.orders||[]).forEach(o=>{
              if(String(o.loadLocationId||'')===String(id))o.loadLocationName=name;
              if(String(o.unloadLocationId||'')===String(id))o.unloadLocationName=name;
              if(String(o.dropLocationId||'')===String(id))o.drop=name;
            });
            await persist();
            dpR1RenderSettings();
            dpR1RefreshSelectors();
          }

          async function dpR1ToggleLocation(id,on){
            const loc=dpR1FindLocation(id);
            if(!loc)return;
            loc.active=!!on;
            await persist();
            dpR1RenderSettings();
            dpR1RefreshSelectors();
          }

          const dpR1BaseRenderSettings=renderSettings;
          renderSettings=function(){
            dpR1EnsureState();
            const r=dpR1BaseRenderSettings.apply(this,arguments);
            dpR1RenderSettings();
            return r;
          };

          // Initiale Installation. State wird nach loadState erneut über die
          // Wrapper normalisiert und vollständig gerendert.
          dpR1InstallTaskOption();
          dpR1InstallOrderUi();
          dpR1InstallSettings();

          /* DP_R1_DIREKTVERLADUNG_MATERIAL_TRANSPORTORTE_END */
          """

          t=t.replace(marker,patch+"\n"+marker,1)
          p.write_text(t,encoding="utf-8",newline="\n")
          print("R1: Direktverladung, Materialauswahl und gemeinsame Transportorte eingefügt.")
          PY

          grep -q "DP_R1_DIREKTVERLADUNG_MATERIAL_TRANSPORTORTE_BEGIN" dispopilot-online-efd.html
          grep -q "Direktverladung" dispopilot-online-efd.html
          grep -q "Baustelle als Ladeort" dispopilot-online-efd.html
          grep -q "Baustelle als Abladeort" dispopilot-online-efd.html
          grep -q "Transportorte" dispopilot-online-efd.html
          grep -q "dpR1AddMaterial" dispopilot-online-efd.html
          grep -q "dpR1AddLocation" dispopilot-online-efd.html
          grep -q "transportLocations" dispopilot-online-efd.html
          grep -q "loadLocationId" dispopilot-online-efd.html
          grep -q "unloadLocationId" dispopilot-online-efd.html

      - name: Apply S2 Rapport Kunde nicht vor Ort
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path("dispopilot-online-efd.html")
          t=p.read_text(encoding="utf-8")
          marker="/* DP13_PATCH_END */"
          if t.count(marker)!=1:
              raise SystemExit(f"S2 abgebrochen: DP13-Endmarker {t.count(marker)}x gefunden statt 1x.")

          patch=r"""
          /* DP_S1_RAPPORT_KUNDE_NICHT_VOR_ORT_BEGIN */
          // S1: Kundenname und Kundenunterschrift sind nicht mehr zwingend,
          // wenn der Fahrer ausdrücklich "Kunde nicht vor Ort" wählt.
          // In diesem Fall wird KEINE Unterschrift vorgetäuscht. Stattdessen
          // dokumentiert der Rapport eindeutig Fahrer, Datum und Uhrzeit.

          function dpS1EnsureReportUi(){
            const modal=$('reportModal');
            const summary=$('reportSummary');
            if(!modal||!summary)return;
            if(!$('dpS1CustomerAbsentWrap')){
              const wrap=document.createElement('div');
              wrap.id='dpS1CustomerAbsentWrap';
              wrap.className='card';
              wrap.style.marginTop='10px';
              wrap.style.marginBottom='12px';
              wrap.innerHTML='<label class="switchline" style="margin:0">'
                +'<input id="dpS1CustomerAbsent" type="checkbox" onchange="dpS1SetCustomerAbsent()">'
                +'<span><strong>Kunde nicht vor Ort</strong></span>'
                +'</label>'
                +'<div class="small" style="margin-top:6px">Wenn aktiviert, sind Kundenname und Unterschrift nicht erforderlich. Der Rapport wird durch den Fahrer mit automatischem Datum und Uhrzeit abgeschlossen.</div>';
              summary.after(wrap);
            }
          }

          function dpS1SetCustomerAbsent(on){
            dpS1EnsureReportUi();
            // SharePoint/SPFx-Handler akzeptiert keine Ausdrücke wie this.checked
            // als Inline-Argument. Ohne Argument lesen wir den Zustand direkt aus
            // der Checkbox. Dadurch funktioniert der Klick auch im Gast-/Fahrerfenster.
            if(typeof on==='undefined'){
              const source=$('dpS1CustomerAbsent');
              on=!!source?.checked;
            }
            const absent=!!on;
            const cb=$('dpS1CustomerAbsent');
            if(cb&&cb.checked!==absent)cb.checked=absent;
            const name=$('signName');
            const sig=$('signature');
            if(absent){
              if(name)name.value='';
              if(typeof clearSignature==='function'){
                try{clearSignature();}catch(_){ }
              }
            }
            if(name){
              name.disabled=absent;
              name.placeholder=absent?'Nicht erforderlich – Kunde nicht vor Ort':'';
              name.style.opacity=absent?'.55':'';
            }
            if(sig){
              sig.style.pointerEvents=absent?'none':'';
              sig.style.opacity=absent?'.35':'';
            }
            const modal=$('reportModal');
            if(modal){
              const clearBtn=Array.from(modal.querySelectorAll('button')).find(b=>String(b.textContent||'').trim()==='Unterschrift löschen');
              if(clearBtn){clearBtn.disabled=absent;clearBtn.style.opacity=absent?'.45':'';}
            }
          }

          function dpS1FormatStamp(iso){
            try{
              return new Date(iso).toLocaleString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
            }catch(_){return String(iso||'');}
          }

          const dpS1BaseOpenReport=openReport;
          openReport=function(){
            const r=dpS1BaseOpenReport.apply(this,arguments);
            setTimeout(()=>{
              dpS1EnsureReportUi();
              const o=orderById(currentOrderId);
              const prev=o?.rapportCompletion||{};
              // Bei einem bereits als "Kunde nicht vor Ort" abgeschlossenen Rapport
              // wird dieser Zustand wieder angezeigt. Normale Signaturen werden aus
              // Datenschutz-/Größengründen nicht dauerhaft im Auftrag gespeichert.
              dpS1SetCustomerAbsent(!!prev.customerNotPresent);
              if(!prev.customerNotPresent&&$('signName'))$('signName').value=prev.signer||'';
            },120);
            return r;
          };

          const dpS1BaseReportPaper=reportPaper;
          reportPaper=function(o,signer,sig){
            const info=o?.rapportCompletion||{};
            const absent=!!info.customerNotPresent;
            const finalSigner=absent?'Kunde nicht vor Ort':signer;
            const finalSig=absent?'':sig;
            let html=dpS1BaseReportPaper(o,finalSigner,finalSig);
            const at=info.completedAt||'';
            const by=info.completedBy||o?.driver||'';
            const stamp=dpS1FormatStamp(at);
            const note=absent
              ?'<div style="margin:14px 0 4px;padding:9px 11px;border:2px solid #991b1b;border-radius:7px;font-size:9.5pt"><strong>Kunde nicht vor Ort.</strong> Keine Kundenunterschrift erfasst. Rapport durch Fahrer <strong>'+esc(by)+'</strong> am <strong>'+esc(stamp)+'</strong> abgeschlossen.</div>'
              :'<div style="margin:10px 0 4px;font-size:8.5pt"><strong>Rapport abgeschlossen:</strong> '+esc(stamp)+' · '+esc(by)+'</div>';
            if(html.includes('<div class="signatureRow">'))html=html.replace('<div class="signatureRow">',note+'<div class="signatureRow">');
            else html+=note;
            if(absent){
              html=html.replace('<div>Auftraggeber / Unterschrift</div>','<div>Kunde nicht vor Ort</div>');
            }
            return html;
          };

          previewReport=async function(){
            dpS1EnsureReportUi();
            const absent=!!$('dpS1CustomerAbsent')?.checked;
            const signer=String($('signName')?.value||'').trim();

            if(!absent){
              if(!signer)return alert('Bitte Name des Auftraggebers eingeben oder „Kunde nicht vor Ort“ auswählen.');
              if(!hasSignature)return alert('Bitte Kundenunterschrift erfassen oder „Kunde nicht vor Ort“ auswählen.');
              if(!signatureData)signatureData=$('signature').toDataURL('image/png');
            }else{
              signatureData='';
              hasSignature=false;
            }

            const o=orderById(currentOrderId);
            if(!o)return alert('Auftrag wurde nicht gefunden.');
            const completedAt=nowIso();
            const completedBy=state?.user?.name||o.driver||'';
            o.rapportCompletion={
              customerNotPresent:absent,
              signer:absent?'':signer,
              signed:!absent,
              completedAt,
              completedBy
            };
            o.rapportCompletedAt=completedAt;
            o.rapportCompletedBy=completedBy;
            o.updatedAt=completedAt;
            await persist();

            closeM('reportModal');
            $('previewTitle').textContent='Rapport / Lieferschein – Vorschau';
            $('previewPaper').innerHTML=reportPaper(o,signer,absent?'':signatureData);
            $('previewSendBtn').textContent='Versand simulieren';
            $('previewSendBtn').onclick=()=>sendReportSim(o,signer);
            openM('previewModal');
          };

          // Versand bleibt bis zum gemeinsamen zentralen E-Mail-Punkt simuliert,
          // protokolliert S2 aber bereits eindeutig für den späteren Mailweg.
          sendReportSim=async function(o,signer){
            const c=customer(o.customerId);
            const info=o.rapportCompletion||{};
            if(!Array.isArray(state.documents))state.documents=[];
            state.documents.unshift({
              id:uid(),
              type:'Rapport',
              date:nowIso(),
              orderId:o.id,
              recipient:[c?.mail,state.settings.officeMail].filter(Boolean).join(' + '),
              signer:info.customerNotPresent?'':(signer||info.signer||''),
              customerNotPresent:!!info.customerNotPresent,
              completedAt:info.completedAt||'',
              completedBy:info.completedBy||o.driver||'',
              status:'Versand simuliert'
            });
            await persist();
            const who=info.customerNotPresent?'Kunde nicht vor Ort':'Kundenunterschrift erfasst';
            alert('Simulation: Rapport ('+who+') an '+([c?.mail||'keine Kundenadresse',state.settings.officeMail||'keine Büroadresse'].join(' + '))+'.');
            closeM('previewModal');
            renderHistory();
          };

          // Ein bereits abgeschlossener Rapport macht einen Auftrag fachlich "berührt"
          // und damit nicht mehr über Q2 aus der Planung löschbar.
          if(typeof dpQ2CanDeleteOrder==='function'){
            const dpS1BaseCanDelete=dpQ2CanDeleteOrder;
            dpQ2CanDeleteOrder=function(o){
              if(o&&(o.rapportCompletion||o.rapportCompletedAt))return false;
              return dpS1BaseCanDelete(o);
            };
          }

          dpS1EnsureReportUi();
          /* DP_S1_RAPPORT_KUNDE_NICHT_VOR_ORT_END */
          """

          t=t.replace(marker,patch+"\n"+marker,1)
          p.write_text(t,encoding="utf-8",newline="\n")
          print("S1: Rapportabschluss ohne zwingende Kundenunterschrift eingefügt.")
          PY

          grep -q "DP_S1_RAPPORT_KUNDE_NICHT_VOR_ORT_BEGIN" dispopilot-online-efd.html
          grep -q "Kunde nicht vor Ort" dispopilot-online-efd.html
          grep -q 'onchange="dpS1SetCustomerAbsent()"' dispopilot-online-efd.html
          ! grep -q 'dpS1SetCustomerAbsent(this.checked)' dispopilot-online-efd.html
          grep -q "rapportCompletion" dispopilot-online-efd.html
          grep -q "rapportCompletedAt" dispopilot-online-efd.html
          grep -q "Keine Kundenunterschrift erfasst" dispopilot-online-efd.html
          grep -q "dpS1SetCustomerAbsent" dispopilot-online-efd.html

      - name: Apply U2 robust customer context and searchable dropdown
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path("dispopilot-online-efd.html")
          t=p.read_text(encoding="utf-8")
          marker="/* DP13_PATCH_BEGIN */"
          if t.count(marker)!=1:
              raise SystemExit(f"U2 abgebrochen: DP13-Marker {t.count(marker)}x gefunden statt 1x.")

          patch=r"""
          /* DP_U2_KUNDENKONTEXT_SUCHDROPDOWN_BEGIN */
          // U2a – Kundenkontext bei „Neue Baustelle“ robust erhalten.
          // Ursache des alten Fehlers: openSite() ruft refreshCustomerSelects() auf.
          // Dadurch konnte oCustomer auf den ersten Listeneintrag zurückspringen,
          // bevor sCustomer gesetzt wurde. U2 merkt deshalb den Kunden VOR diesem
          // Refresh und stellt ihn danach explizit wieder her.
          let dpU2ActiveCustomerId=null;

          function dpU2HasOption(selectEl,value){
            if(!selectEl||value===null||value===undefined||String(value)==='')return false;
            const wanted=String(value);
            return Array.from(selectEl.options||[]).some(o=>String(o.value)===wanted);
          }

          function dpU2ModalIsOpen(id){
            const el=$(id);
            if(!el)return false;
            if(el.classList?.contains('show'))return true;
            if(el.getAttribute('aria-hidden')==='false')return true;
            try{
              const cs=getComputedStyle(el);
              return cs.display!=='none'&&cs.visibility!=='hidden'&&(el.offsetWidth>0||el.offsetHeight>0);
            }catch(_){return false;}
          }

          function dpU2ActiveInside(id){
            const a=document.activeElement;
            return !!(a&&typeof a.closest==='function'&&a.closest('#'+id));
          }

          if(typeof openCustomer==='function'){
            const dpU2BaseOpenCustomer=openCustomer;
            openCustomer=function(id){
              if(id!==null&&id!==undefined&&String(id)!=='')dpU2ActiveCustomerId=Number(id)||id;
              return dpU2BaseOpenCustomer.apply(this,arguments);
            };
          }

          const dpU2BaseOpenSite=openSite;
          openSite=function(id=null,fromOrder=false){
            const oSel=$('oCustomer');
            const orderCustomerBefore=oSel?String(oSel.value||''):'';

            const orderContext=!id&&(
              !!fromOrder ||
              dpU2ModalIsOpen('orderModal') ||
              dpU2ActiveInside('orderModal')
            );
            const customerContext=!id&&(
              dpU2ModalIsOpen('customerModal') ||
              dpU2ActiveInside('customerModal')
            );

            let wantedCustomer='';
            if(orderContext&&orderCustomerBefore){
              wantedCustomer=orderCustomerBefore;
              // Wichtig für saveSite(): Nach Speichern muss in den Auftrag zurückgekehrt werden.
              fromOrder=true;
            }else if(customerContext&&dpU2ActiveCustomerId!==null){
              wantedCustomer=String(dpU2ActiveCustomerId);
            }else if(!id&&fromOrder&&orderCustomerBefore){
              wantedCustomer=orderCustomerBefore;
            }

            // Base-Logik darf weiterhin alle bisherigen Felder/Adressen vorbereiten.
            const result=dpU2BaseOpenSite.call(this,id,fromOrder);

            // refreshCustomerSelects() innerhalb der Base-Logik darf die Auswahl im
            // Auftrag NICHT als Seiteneffekt verändern – auch nicht bei Abbrechen.
            if(oSel&&orderCustomerBefore&&dpU2HasOption(oSel,orderCustomerBefore)){
              oSel.value=orderCustomerBefore;
            }

            if(!id&&wantedCustomer&&$('sCustomer')&&dpU2HasOption($('sCustomer'),wantedCustomer)){
              $('sCustomer').value=wantedCustomer;
              if(typeof dpK1SiteCustomerChanged==='function')dpK1SiteCustomerChanged();
              if(typeof dpK1SameBillingChanged==='function')dpK1SameBillingChanged();
            }

            // Sichtbare Kundenauswahl im Auftrag nach dem Restaurieren synchronisieren.
            if(typeof dpU2SyncOrderCustomerCombo==='function')setTimeout(dpU2SyncOrderCustomerCombo,0);
            return result;
          };

          // Beim Schließen des Kundenfensters darf kein alter Kundenkontext später
          // versehentlich für eine neue Baustelle verwendet werden.
          const dpU2BaseCloseM=closeM;
          closeM=function(id){
            const result=dpU2BaseCloseM.apply(this,arguments);
            if(id==='customerModal')dpU2ActiveCustomerId=null;
            if(id==='siteModal'&&typeof dpU2SyncOrderCustomerCombo==='function')setTimeout(dpU2SyncOrderCustomerCombo,0);
            return result;
          };

          // U2b – echte suchbare Kundenauswahl statt separates Suchfeld.
          // Das originale Select bleibt als technische Datenquelle erhalten, ist aber
          // unsichtbar. Das sichtbare Feld ist gleichzeitig Auswahl UND Suche.
          function dpU2Norm(value){
            return String(value||'')
              .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
              .toLocaleLowerCase('de')
              .trim();
          }

          function dpU2OrderCustomerName(){
            const sel=$('oCustomer');
            if(!sel)return '';
            const opt=sel.options?.[sel.selectedIndex];
            return String(opt?.textContent||'').trim();
          }

          function dpU2CloseOrderCustomerDropdown(){
            const list=$('dpU2CustomerDropdownList');
            if(list)list.classList.add('hidden');
          }

          function dpU2SyncOrderCustomerCombo(){
            const input=$('dpU2CustomerDropdownInput');
            if(!input)return;
            input.value=dpU2OrderCustomerName();
            input.dataset.selectedValue=String($('oCustomer')?.value||'');
          }

          function dpU2RenderOrderCustomerDropdown(showAll=false){
            const input=$('dpU2CustomerDropdownInput');
            const list=$('dpU2CustomerDropdownList');
            if(!input||!list)return;

            let q=dpU2Norm(input.value);
            const selectedName=dpU2Norm(dpU2OrderCustomerName());
            // Beim normalen Öffnen soll trotz angezeigtem Kundennamen die gesamte
            // alphabetische Liste sichtbar sein. Erst beim Tippen wird gefiltert.
            if(showAll||q===selectedName)q='';

            const all=(state.customers||[]).slice()
              .sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'de'));
            let filtered=all;
            if(q){
              filtered=all.filter(c=>dpU2Norm(c.name).startsWith(q));
              if(!filtered.length)filtered=all.filter(c=>dpU2Norm(c.name).includes(q));
            }

            list.innerHTML='';
            if(!filtered.length){
              const empty=document.createElement('div');
              empty.className='small';
              empty.style.padding='10px';
              empty.textContent='Kein passender Kunde gefunden.';
              list.appendChild(empty);
            }else{
              filtered.slice(0,60).forEach(c=>{
                const row=document.createElement('button');
                row.type='button';
                row.className='dpU2CustomerOption';
                row.textContent=c.name||'';
                row.addEventListener('pointerdown',ev=>ev.preventDefault());
                row.addEventListener('click',()=>{
                  const sel=$('oCustomer');
                  if(!sel)return;
                  sel.value=String(c.id);
                  sel.dispatchEvent(new Event('change',{bubbles:true}));
                  input.value=String(c.name||'');
                  input.dataset.selectedValue=String(c.id);
                  dpU2CloseOrderCustomerDropdown();
                });
                list.appendChild(row);
              });
            }
            list.classList.remove('hidden');
          }

          function dpU2InstallOrderCustomerDropdown(){
            const sel=$('oCustomer');
            if(!sel)return;

            let wrap=$('dpU2CustomerDropdown');
            if(!wrap){
              wrap=document.createElement('div');
              wrap.id='dpU2CustomerDropdown';
              wrap.className='dpU2CustomerDropdown';

              const input=document.createElement('input');
              input.id='dpU2CustomerDropdownInput';
              input.type='search';
              input.autocomplete='off';
              input.placeholder='Kunde suchen oder auswählen';
              input.setAttribute('aria-label','Kunde suchen oder auswählen');

              const toggle=document.createElement('button');
              toggle.id='dpU2CustomerDropdownToggle';
              toggle.type='button';
              toggle.className='dpU2CustomerDropdownToggle';
              toggle.textContent='▾';
              toggle.setAttribute('aria-label','Kundenliste öffnen');

              const list=document.createElement('div');
              list.id='dpU2CustomerDropdownList';
              list.className='dpU2CustomerDropdownList hidden';

              const field=document.createElement('div');
              field.className='dpU2CustomerDropdownField';
              field.appendChild(input);
              field.appendChild(toggle);
              wrap.appendChild(field);
              wrap.appendChild(list);
              sel.parentElement.insertBefore(wrap,sel);

              input.addEventListener('focus',()=>{
                dpU2SyncOrderCustomerCombo();
                input.select();
                dpU2RenderOrderCustomerDropdown(true);
              });
              input.addEventListener('input',()=>dpU2RenderOrderCustomerDropdown(false));
              input.addEventListener('keydown',ev=>{
                if(ev.key==='Escape'){
                  dpU2SyncOrderCustomerCombo();
                  dpU2CloseOrderCustomerDropdown();
                  input.blur();
                }else if(ev.key==='Enter'){
                  const first=$('dpU2CustomerDropdownList')?.querySelector('.dpU2CustomerOption');
                  if(first){ev.preventDefault();first.click();}
                }
              });
              toggle.addEventListener('click',()=>{
                dpU2SyncOrderCustomerCombo();
                input.focus();
                dpU2RenderOrderCustomerDropdown(true);
              });

              sel.addEventListener('change',()=>setTimeout(dpU2SyncOrderCustomerCombo,0));
            }

            sel.style.display='none';
            dpU2SyncOrderCustomerCombo();
          }

          if(!$('dpU2CustomerDropdownStyle')){
            const style=document.createElement('style');
            style.id='dpU2CustomerDropdownStyle';
            style.textContent=`
              .dpU2CustomerDropdown{position:relative;width:100%;}
              .dpU2CustomerDropdownField{display:grid;grid-template-columns:minmax(0,1fr) 44px;width:100%;}
              .dpU2CustomerDropdownField input{width:100%;min-width:0;margin:0;border-top-right-radius:0;border-bottom-right-radius:0;}
              .dpU2CustomerDropdownToggle{border:1px solid #c9d0d8;border-left:0;background:#f7f8fa;border-radius:0 8px 8px 0;font-size:20px;line-height:1;min-height:42px;}
              .dpU2CustomerDropdownList{position:absolute;left:0;right:0;top:calc(100% + 3px);z-index:10020;max-height:min(52vh,360px);overflow:auto;background:#fff;border:1px solid #c9d0d8;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.18);padding:5px;}
              .dpU2CustomerOption{display:block;width:100%;text-align:left;border:0;background:#fff;border-radius:6px;padding:10px 9px;font:inherit;}
              .dpU2CustomerOption:active,.dpU2CustomerOption:hover{background:#eef3f8;}
              @media(max-width:700px){.dpU2CustomerDropdownList{max-height:48vh}.dpU2CustomerOption{padding:12px 10px;}}
            `;
            document.head.appendChild(style);
          }

          dpU2InstallOrderCustomerDropdown();

          // refreshCustomerSelects baut die native Kundenliste neu auf. Danach wird
          // nur die sichtbare Such-Dropdown-Anzeige synchronisiert – die alphabetische
          // Sortierung der bestehenden Liste bleibt vollständig erhalten.
          if(typeof refreshCustomerSelects==='function'){
            const dpU2BaseRefreshCustomerSelects=refreshCustomerSelects;
            refreshCustomerSelects=function(){
              const selected=String($('oCustomer')?.value||'');
              const result=dpU2BaseRefreshCustomerSelects.apply(this,arguments);
              if(selected&&$('oCustomer')&&dpU2HasOption($('oCustomer'),selected))$('oCustomer').value=selected;
              setTimeout(()=>{dpU2InstallOrderCustomerDropdown();dpU2SyncOrderCustomerCombo();},0);
              return result;
            };
          }

          // Beim Öffnen/Bearbeiten eines Auftrags wird der vom Bestand geladene Kunde
          // unmittelbar im sichtbaren Such-Dropdown angezeigt.
          if(typeof editOrder==='function'){
            const dpU2BaseEditOrder=editOrder;
            editOrder=function(){
              const result=dpU2BaseEditOrder.apply(this,arguments);
              setTimeout(dpU2SyncOrderCustomerCombo,0);
              return result;
            };
          }

          const dpU2OrderModal=$('orderModal');
          if(dpU2OrderModal&&!window.dpU2OrderModalObserver){
            const obs=new MutationObserver(()=>{
              if(dpU2ModalIsOpen('orderModal'))setTimeout(()=>{dpU2InstallOrderCustomerDropdown();dpU2SyncOrderCustomerCombo();},0);
            });
            obs.observe(dpU2OrderModal,{attributes:true,attributeFilter:['class','style','aria-hidden']});
            window.dpU2OrderModalObserver=obs;
          }

          document.addEventListener('pointerdown',ev=>{
            const wrap=$('dpU2CustomerDropdown');
            if(!wrap||wrap.contains(ev.target))return;
            const input=$('dpU2CustomerDropdownInput');
            if(input&&document.activeElement===input)dpU2SyncOrderCustomerCombo();
            dpU2CloseOrderCustomerDropdown();
          },true);
          /* DP_U2_KUNDENKONTEXT_SUCHDROPDOWN_END */
          """

          t=t.replace(marker,patch+"\n"+marker,1)
          p.write_text(t,encoding="utf-8",newline="\n")
          print("U2: Kundenkontext robust gesichert und Such-Dropdown eingebaut.")
          PY

          grep -q "DP_U2_KUNDENKONTEXT_SUCHDROPDOWN_BEGIN" dispopilot-online-efd.html
          grep -q "orderCustomerBefore" dispopilot-online-efd.html
          grep -q "Kunde suchen oder auswählen" dispopilot-online-efd.html
          grep -q "dpU2CustomerDropdownList" dispopilot-online-efd.html
          grep -q "startsWith(q)" dispopilot-online-efd.html
          grep -q "if(selected&&\$('oCustomer')" dispopilot-online-efd.html

      - name: Apply V1 isolated test mode and Abwesend 8h
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path("dispopilot-online-efd.html")
          t=p.read_text(encoding="utf-8")
          marker="/* DP13_PATCH_BEGIN */"
          if t.count(marker)!=1:
              raise SystemExit(f"V1 abgebrochen: DP13-Marker {t.count(marker)}x gefunden statt 1x.")

          # Arbeitszeit: Die vorhandene Urlaub-Sonderlogik wird auf Abwesend erweitert,
          # ohne den sichtbaren Begriff Urlaub umzubenennen. Mehrere typische
          # Vergleichsformen werden robust erweitert; zusätzlich gibt es einen
          # zentralen Entry-Minuten-Helfer für Stundenzettel/PDF.
          replacements=0
          patterns=[
            (re.compile(r"(?P<x>[A-Za-z_$][A-Za-z0-9_.$\[\]()?]*)\s*===\s*(['\"])Urlaub\2"),
             lambda m:f"({m.group('x')}==='Urlaub'||{m.group('x')}==='Abwesend')"),
            (re.compile(r"(['\"])Urlaub\1\s*===\s*(?P<x>[A-Za-z_$][A-Za-z0-9_.$\[\]()?]*)"),
             lambda m:f"({m.group('x')}==='Urlaub'||{m.group('x')}==='Abwesend')"),
          ]
          for rx, repl in patterns:
              t,n=rx.subn(repl,t)
              replacements+=n

          patch=r"""
          /* DP_V1_TESTBETRIEB_ABWESEND_BEGIN */
          const DP_V1_TEST_FLAG='dpDispoTestModeV1';
          const DP_V1_PROD_LIST='DP_Data';
          const DP_V1_TEST_LIST='DP_Data_TEST';
          const DP_V1_SNAPSHOT_LIST='DP_Data_SNAPSHOT';
          let dpV1TestBridgeCounter=0;

          function dpV1StorageGet(key){
            try{return window.localStorage?window.localStorage.getItem(key):null}catch(_){return null}
          }
          function dpV1StorageSet(key,value){
            try{if(window.localStorage)window.localStorage.setItem(key,value)}catch(_){}
          }
          function dpV1StorageRemove(key){
            try{if(window.localStorage)window.localStorage.removeItem(key)}catch(_){}
          }
          function dpV1TestActive(){return dpV1StorageGet(DP_V1_TEST_FLAG)==='1'}

          function dpV1EntryKind(e){
            if(!e||typeof e!=='object')return '';
            const preferred=['type','kind','activity','taetigkeit','tätigkeit','status','absence','reason','category'];
            for(const k of preferred){
              if(typeof e[k]==='string'&&e[k].trim())return e[k].trim();
            }
            for(const v of Object.values(e)){
              if(typeof v==='string'&&(v.trim()==='Urlaub'||v.trim()==='Abwesend'))return v.trim();
            }
            return '';
          }
          function dpV1IsEightHourDay(e){
            const k=dpV1EntryKind(e).toLocaleLowerCase('de');
            return k==='urlaub'||k==='abwesend';
          }
          function dpV1CalcEntryMinutes(e){
            if(dpV1IsEightHourDay(e))return 480;
            return calcMinutes(e?.start||'',e?.end||'',e?.pause||'');
          }

          // L5-PDF/Stundenzettel: Urlaub UND Abwesend ergeben fest 8:00 h.
          if(typeof dpL4ExtractTimesheet==='function'){
            const dpV1BaseExtractTimesheet=dpL4ExtractTimesheet;
            dpL4ExtractTimesheet=function(){
              const data=dpV1BaseExtractTimesheet();
              try{
                ensureWeekEntries();
                (data.days||[]).forEach((row,i)=>{
                  const iso=plusDays(selectedWeekMonday,i);
                  const e=(state.timeEntries||[]).find(x=>x.date===iso&&x.driver===state.user.name)||{};
                  if(dpV1IsEightHourDay(e))row[4]='8:00';
                });
              }catch(_){}
              return data;
            };
          }

          // Zentraler Datenzugriff: Im Testbetrieb werden sämtliche normalen
          // DP_Data-REST-Aufrufe transparent auf DP_Data_TEST umgeleitet.
          if(typeof SPStore!=='undefined'&&SPStore.request&&!window.__DP_V1_STORE_ROUTED){
            window.__DP_V1_STORE_ROUTED=true;
            const dpV1RawRequest=SPStore.request.bind(SPStore);
            SPStore.request=async function(url,opts={}){
              let routed=String(url||'');
              if(dpV1TestActive()){
                routed=routed.replace(/DP_Data(?!_TEST|_SNAPSHOT)/g,DP_V1_TEST_LIST);
              }
              return dpV1RawRequest(routed,opts);
            };
          }

          function dpV1TestControl(action,onProgress){
            return new Promise((resolve,reject)=>{
              const requestId='dp-test-'+Date.now()+'-'+(++dpV1TestBridgeCounter);
              let done=false;
              const finish=(ok,val)=>{
                if(done)return;done=true;clearTimeout(timer);window.removeEventListener('message',onMsg);
                ok?resolve(val):reject(val instanceof Error?val:new Error(String(val||'Testbetrieb-Fehler')));
              };
              const onMsg=(event)=>{
                const d=event.data;
                if(!d||d.requestId!==requestId)return;
                if(d.type==='DISPOPILOT_TEST_CONTROL_PROGRESS'){
                  try{if(typeof onProgress==='function')onProgress(d)}catch(_){}
                  return;
                }
                if(d.type!=='DISPOPILOT_TEST_CONTROL_RESULT')return;
                d.ok?finish(true,d):finish(false,new Error(d.error||'Testbetrieb konnte nicht vorbereitet werden.'));
              };
              window.addEventListener('message',onMsg);
              const timer=setTimeout(()=>finish(false,new Error('Zeitüberschreitung beim Testbetrieb.')),900000);
              try{window.parent.postMessage({type:'DISPOPILOT_TEST_CONTROL',requestId,action},'*')}catch(e){finish(false,e)}
            });
          }

          async function dpV1ReloadCurrentMode(){
            const sessionUser=clone(state?.user||{});
            const loaded=await SPStore.load();
            const fresh=migrateState(loaded.state||clone(SEED));
            fresh.user=sessionUser;
            state=fresh;
            if(typeof dpDNormalizeAllGroups==='function')dpDNormalizeAllGroups();
            renderAll();
            dpV1InstallTestUi();
            if(typeof dp13CheckNotices==='function')setTimeout(dp13CheckNotices,60);
          }

          async function dpV1StartTest(){
            try{
              const status=await dpV1TestControl('status');
              if(!status?.ready)throw new Error('Der Testbestand ist noch nicht vollständig vorbereitet. Bitte als Admin zuerst „Snapshot + Testdaten vorbereiten“ ausführen.');
              dpV1StorageSet(DP_V1_TEST_FLAG,'1');
              await dpV1ReloadCurrentMode();
              dpV1Toast('Testbetrieb aktiv – Produktivdaten bleiben unverändert.');
            }catch(e){
              dpV1StorageRemove(DP_V1_TEST_FLAG);
              try{await dpV1ReloadCurrentMode()}catch(_){}
              alert('Testbetrieb konnte nicht gestartet werden.\n\n'+(e?.message||e));
            }
          }
          async function dpV1StopTest(){
            dpV1StorageRemove(DP_V1_TEST_FLAG);
            await dpV1ReloadCurrentMode();
            dpV1Toast('Echtbetrieb aktiv – ursprünglicher Produktivbestand geladen.');
          }
          async function dpV1PrepareTest(){
            if(!confirm('Snapshot des AKTUELLEN Echtbestands erstellen und Testdaten daraus neu aufbauen?\n\nProduktivdaten werden dabei nicht verändert.'))return;
            const b=$('dpV1PrepareBtn');const oldLabel=b?.textContent||'';const prog=$('dpV1ProgressText');
            if(b){b.disabled=true;b.textContent='Vorbereitung läuft …';}
            if(prog)prog.textContent='Verbindung zur Testdatenverwaltung …';
            try{
              const r=await dpV1TestControl('prepare',(p)=>{
                const stage=String(p.stage||'Vorbereitung');
                const cur=Number(p.current||0), total=Number(p.total||0);
                const msg=total>0?stage+' '+cur+'/'+total:stage+' …';
                if(b)b.textContent=msg;
                if(prog)prog.textContent=msg;
              });
              dpV1StorageSet(DP_V1_TEST_FLAG,'1');
              await dpV1ReloadCurrentMode();
              if(prog)prog.textContent='Vorbereitung abgeschlossen: Snapshot '+(r.snapshotCount||0)+' / Testbestand '+(r.testCount||0)+' Datensätze.';
              alert('Testbetrieb vorbereitet.\n\nSnapshot: '+(r.snapshotCount||0)+' Datensätze\nTestbestand: '+(r.testCount||0)+' Datensätze\n\nTESTBETRIEB ist jetzt aktiv.');
            }catch(e){if(prog)prog.textContent='Vorbereitung fehlgeschlagen.';alert('Vorbereitung fehlgeschlagen:\n'+(e?.message||e))}
            finally{if(b){b.disabled=false;b.textContent=oldLabel||'Snapshot + Testdaten vorbereiten';}}
          }
          async function dpV1ResetTest(){
            if(!confirm('Alle bisherigen Fantasiedaten im Testbestand verwerfen und den gespeicherten Snapshot erneut einspielen?'))return;
            try{
              const r=await dpV1TestControl('reset');
              dpV1StorageSet(DP_V1_TEST_FLAG,'1');
              await dpV1ReloadCurrentMode();
              alert('Testdaten wurden auf den Snapshot zurückgesetzt ('+(r.testCount||0)+' Datensätze).');
            }catch(e){alert('Zurücksetzen fehlgeschlagen:\n'+(e?.message||e))}
          }

          function dpV1Toast(text){
            let el=$('dpV1Toast');
            if(!el){el=document.createElement('div');el.id='dpV1Toast';document.body.appendChild(el)}
            el.textContent=text;el.style.display='block';clearTimeout(dpV1Toast.timer);
            dpV1Toast.timer=setTimeout(()=>el.style.display='none',2600);
          }

          function dpV1CurrentTestEmail(){
            return String(state?.dpTestConfig?.testEmail||'').trim();
          }
          async function dpV1SaveTestEmail(){
            if(!dpV1TestActive())return alert('Test-E-Mail-Adresse wird nur im Testbetrieb gespeichert.');
            const v=String($('dpV1TestEmail')?.value||'').trim();
            if(v&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v))return alert('Bitte eine gültige Test-E-Mail-Adresse eingeben.');
            state.dpTestConfig=state.dpTestConfig||{};
            state.dpTestConfig.testEmail=v;
            await persist();
            dpV1Toast(v?'Test-E-Mail gespeichert.':'Test-E-Mail gelöscht.');
          }

          // Im Testbetrieb darf niemals versehentlich an echte Kundenadressen
          // gesendet werden. Die Queue erhält ausschließlich die Testadresse.
          if(typeof dpL2QueueRequest==='function'){
            const dpV1BaseQueueRequest=dpL2QueueRequest;
            dpL2QueueRequest=function(payload){
              if(!dpV1TestActive())return dpV1BaseQueueRequest(payload);
              const testEmail=dpV1CurrentTestEmail();
              if(!testEmail||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(testEmail)){
                return Promise.reject(new Error('TESTBETRIEB: Bitte zuerst in Einstellungen eine Test-E-Mail-Adresse speichern.'));
              }
              const originalTo=Array.isArray(payload?.to)?payload.to.slice():[];
              const safePayload={...(payload||{}),to:[testEmail],testMode:true,testEmail,originalTo};
              return dpV1BaseQueueRequest(safePayload);
            };
          }

          function dpV1InstallTestUi(){
            // Deutlicher globaler Modus-Hinweis.
            let banner=$('dpV1TestBanner');
            if(dpV1TestActive()){
              if(!banner){
                banner=document.createElement('div');banner.id='dpV1TestBanner';
                banner.innerHTML='<strong>🧪 TESTBETRIEB – KEINE ECHTDATEN</strong><button type="button" onclick="dpV1StopTest()">Echtbetrieb</button>';
                document.body.prepend(banner);
              }
              banner.style.display='flex';
            }else if(banner){banner.style.display='none'}

            // Kleiner Startknopf ist bewusst auf jedem Gerät sichtbar, damit
            // auch Fahrer-Gastkonten in die vorbereitete Testumgebung wechseln können.
            let quick=$('dpV1QuickTest');
            if(!quick){
              quick=document.createElement('button');quick.id='dpV1QuickTest';quick.type='button';
              quick.textContent='🧪 Testbetrieb starten';quick.title='Aktion: auf diesem Gerät in den Testbetrieb wechseln';quick.onclick=dpV1StartTest;document.body.appendChild(quick);
            }
            quick.style.display=dpV1TestActive()?'none':'block';

            const settings=$('settings');
            if(settings&&!$('dpV1TestCard')){
              const card=document.createElement('div');card.id='dpV1TestCard';card.className='card';
              card.innerHTML=`<h3 style="margin-top:0">Testbetrieb</h3>
                <div class="small">Snapshot des Echtbestands → getrennte Fantasiedaten. Beim Beenden wird sofort wieder der unveränderte Echtbestand geladen.</div>
                <div style="margin-top:10px"><strong>Aktueller Modus:</strong> <span id="dpV1ModeText"></span></div>
                <div class="row" style="margin-top:10px;gap:8px;flex-wrap:wrap">
                  <button id="dpV1PrepareBtn" class="btn secondary" type="button" onclick="dpV1PrepareTest()">Snapshot + Testdaten vorbereiten</button>
                  <button class="btn secondary" type="button" onclick="dpV1StartTest()">Testbetrieb starten</button>
                  <button class="btn secondary" type="button" onclick="dpV1ResetTest()">Testdaten zurücksetzen</button>
                  <button class="btn secondary" type="button" onclick="dpV1StopTest()">Echtbetrieb laden</button>
                </div>
                <div id="dpV1ProgressText" class="small" style="margin-top:8px;font-weight:700">Bereit.</div>
                <div style="margin-top:12px"><label>Test-E-Mail (alle Testmails nur hierhin)</label>
                  <div class="row" style="gap:8px"><input id="dpV1TestEmail" type="email" placeholder="z. B. eigene Testadresse"><button class="btn secondary" type="button" onclick="dpV1SaveTestEmail()">Speichern</button></div>
                </div>
                <div class="small" style="margin-top:8px">Hinweis: Benutzer-/Rollen-Zuordnungen in DP_Users bleiben unverändert; operative Daten laufen im Testbetrieb ausschließlich über DP_Data_TEST.</div>`;
              settings.appendChild(card);
            }
            if($('dpV1ModeText'))$('dpV1ModeText').textContent=dpV1TestActive()?'TESTBETRIEB':'Echtbetrieb';
            if($('dpV1TestEmail'))$('dpV1TestEmail').value=dpV1CurrentTestEmail();
          }

          if(!$('dpV1TestStyle')){
            const st=document.createElement('style');st.id='dpV1TestStyle';st.textContent=`
              #dpV1TestBanner{position:sticky;top:0;z-index:20000;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 12px;background:#8b1e1e;color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.25)}
              #dpV1TestBanner button{border:0;border-radius:7px;padding:7px 10px;font-weight:700}
              #dpV1QuickTest{position:fixed;right:12px;bottom:12px;z-index:16000;border:1px solid #8b1e1e;border-radius:18px;padding:8px 12px;background:#fff;font-weight:700;box-shadow:0 2px 9px rgba(0,0,0,.16)}
              #dpV1Toast{display:none;position:fixed;left:50%;bottom:64px;transform:translateX(-50%);z-index:21000;background:#222;color:#fff;border-radius:8px;padding:10px 14px;max-width:88vw;text-align:center}\n              #dpV1ProgressText{padding:7px 9px;border-radius:7px;background:#f3f4f6}
              #dpV1TestCard input{min-width:220px;flex:1}
            `;document.head.appendChild(st);
          }

          if(typeof renderSettings==='function'){
            const dpV1BaseRenderSettings=renderSettings;
            renderSettings=function(){const r=dpV1BaseRenderSettings.apply(this,arguments);setTimeout(dpV1InstallTestUi,0);return r};
          }
          setTimeout(dpV1InstallTestUi,0);
          /* DP_V1_TESTBETRIEB_ABWESEND_END */
          """

          t=t.replace(marker,patch+"\n"+marker,1)

          # Direkte Minutenberechnungen mit Entry e auf die 8h-Sonderlogik umstellen.
          # Diese Ersetzungen treffen die bekannten Zeit-/Summen-/PDF-Pfade.
          minute_patterns=[
            (r"calcMinutes\(\s*e\.start\s*\|\|\s*''\s*,\s*e\.end\s*\|\|\s*''\s*,\s*e\.pause\s*\|\|\s*''\s*\)","dpV1CalcEntryMinutes(e)"),
            (r"calcMinutes\(\s*e\.start\s*,\s*e\.end\s*,\s*e\.pause\s*\)","dpV1CalcEntryMinutes(e)"),
          ]
          minute_replacements=0
          for rx,repl in minute_patterns:
              t,n=re.subn(rx,repl,t)
              minute_replacements+=n

          p.write_text(t,encoding="utf-8",newline="\n")
          print(f"V1 Testbetrieb eingefügt. Urlaub-Vergleiche erweitert: {replacements}; Minutenpfade: {minute_replacements}")
          PY

          grep -q "DP_V1_TESTBETRIEB_ABWESEND_BEGIN" dispopilot-online-efd.html
          grep -q "DP_Data_TEST" dispopilot-online-efd.html
          grep -q "DP_Data_SNAPSHOT" dispopilot-online-efd.html
          grep -q "TESTBETRIEB – KEINE ECHTDATEN" dispopilot-online-efd.html
          grep -q "dpV1CalcEntryMinutes" dispopilot-online-efd.html
          grep -q "Abwesend" dispopilot-online-efd.html
          grep -q "Test-E-Mail" dispopilot-online-efd.html

      - name: Install SPFx CLI
        run: npm install -g @microsoft/spfx-cli@latest

      - name: Scaffold SPFx web part
        run: |
          rm -rf spfx-build
          spfx create \
            --template webpart-noframework \
