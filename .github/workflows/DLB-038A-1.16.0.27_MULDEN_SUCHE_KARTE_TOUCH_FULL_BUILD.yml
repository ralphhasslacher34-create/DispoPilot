name: DLB-038A-1.16.0.27 MULDEN SUCHE KARTE TOUCH FULL BUILD

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/DLB-038A-1.16.0.27_MULDEN_SUCHE_KARTE_TOUCH_FULL_BUILD.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Rebuild exact successful DLB-037E basis
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY_RUN_037E_BASE'
          from pathlib import Path
          import subprocess
          import yaml

          wf=Path('.github/workflows/DLB-037E-1.16.0.25_DP_DATA_HYGIENE_BACKUP_FILE_CONFIRM_FULL_BUILD.yml')
          if not wf.exists():
              raise SystemExit('038A: erfolgreicher 037E-Workflow fehlt im Repository.')

          doc=yaml.safe_load(wf.read_text(encoding='utf-8'))
          runs=[(s.get('name',''),s.get('run')) for s in doc['jobs']['build']['steps'] if s.get('run')]
          if len(runs)!=5:
              raise SystemExit(f'038A: 037E erwartet 5 ausführbare Schritte, gefunden {len(runs)}.')

          # Nur den geprüften 037E-Quellstand rekonstruieren.
          for idx,(name,script) in enumerate(runs[:3],1):
              print(f'===== 038A Basis 037E Schritt {idx}/3: {name} =====')
              runner=Path(f'.038a_037e_step_{idx}.sh')
              runner.write_text(script,encoding='utf-8',newline='\n')
              try:
                  subprocess.run(['bash','-euo','pipefail',str(runner)],check=True)
              finally:
                  runner.unlink(missing_ok=True)

          print('038A: erfolgreicher DLB-037E-Quellstand vollständig rekonstruiert.')
          PY_RUN_037E_BASE

      - name: Apply DLB-038A integrated touch map
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_PATCH_038A'
          from pathlib import Path
          import base64,json,subprocess

          root=Path('spfx-build/src/webparts')
          files=[p for p in root.rglob('*') if p.is_file() and p.suffix in {'.js','.ts','.tsx'}]

          required_markers=[
              'DP_DLB_037E_1_16_0_25_DP_DATA_HYGIENE_BACKUP_FILE_CONFIRM_BEGIN',
              'DP_DLB_036D_1_16_0_20_OFFLINE_OUTBOX_SYNC_BEGIN',
              'DP_DLB_031G_1_16_0_6_STANDORTE_NAVIGATION_BEGIN',
              '/* DP13_PATCH_END */',
          ]

          candidates=[]
          for p in files:
              s=p.read_text(encoding='utf-8')
              if all(x in s for x in required_markers):
                  candidates.append((p,s))
          if len(candidates)!=1:
              raise SystemExit('038A: erwartete genau eine vollständige 037E-App-Runtime, gefunden: '+repr([str(p) for p,_ in candidates]))

          runtime,src=candidates[0]
          if 'DP_DLB_038A_1_16_0_27_MULDEN_SUCHE_KARTE_BEGIN' in src:
              raise SystemExit('038A: Patch bereits vorhanden.')

          render_block=base64.b64decode('').decode('utf-8')
          set_view_block=base64.b64decode('').decode('utf-8')
          install_block=base64.b64decode('').decode('utf-8')

          def replace_region(text,start_token,end_token,replacement,label):
              if text.count(start_token)!=1:
                  raise SystemExit(f'038A: {label} Starttoken {text.count(start_token)}x statt 1x.')
              start=text.index(start_token)
              end=text.find(end_token,start+len(start_token))
              if end<0:
                  raise SystemExit(f'038A: {label} Endtoken fehlt.')
              return text[:start]+replacement+text[end:]

          src=replace_region(
              src,
              'function dp31GRenderBinMap(){',
              'function dp31GRefreshBinMapFilters(){',
              render_block,
              'Kartenrenderer'
          )
          src=replace_region(
              src,
              'function dp31GSetBinView(mode){',
              'function dp31GInstallBinMapUi(){',
              set_view_block,
              'Ansichtsumschalter'
          )
          src=replace_region(
              src,
              'function dp31GInstallBinMapUi(){',
              'function dp31GContextBins(siteId){',
              install_block,
              'Karten-UI'
          )

          end_marker='/* DP13_PATCH_END */'
          marker=r"""
          /* DP_DLB_038A_1_16_0_27_MULDEN_SUCHE_KARTE_BEGIN */
          (function(){
            'use strict';
            window.__DISPOLUX_038A={
              version:'1.16.0.27',
              feature:'Mulden-Suche/Karte integriert · Touch-Pan/Pinch-Zoom · kompakte Marker'
            };
          })();
          /* DP_DLB_038A_1_16_0_27_MULDEN_SUCHE_KARTE_END */
          """
          if src.count(end_marker)!=1:
              raise SystemExit(f'038A: DP13-Endmarker {src.count(end_marker)}x statt 1x.')
          src=src.replace(end_marker,marker+'\n\n'+end_marker,1)

          runtime.write_text(src,encoding='utf-8',newline='\n')
          if runtime.suffix=='.js':
              subprocess.run(['node','--check',str(runtime)],check=True)

          pkg=Path('spfx-build/config/package-solution.json')
          data=json.loads(pkg.read_text(encoding='utf-8'))
          if data.get('solution',{}).get('version')!='1.3.6.119':
              raise SystemExit('038A: erwartete 037E-SPFx-Version 1.3.6.119 fehlt.')
          data['solution']['version']='1.3.6.121'
          pkg.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          print('038A: Mulden-Suche/Karte integriert, Touch-Karte eingebaut, Marker verkleinert.')
          PY_PATCH_038A

      - name: Validate 038A source before build
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_VALIDATE_038A'
          from pathlib import Path
          import json,re,subprocess

          root=Path('spfx-build/src/webparts')
          files=[p for p in root.rglob('*') if p.is_file() and p.suffix in {'.js','.ts','.tsx'}]
          combined='\n'.join(p.read_text(encoding='utf-8') for p in files)

          begin='DP_DLB_038A_1_16_0_27_MULDEN_SUCHE_KARTE_BEGIN'
          hits=[p for p in files if begin in p.read_text(encoding='utf-8')]
          if len(hits)!=1:
              raise SystemExit(f'038A VALIDIERUNG: Patch {len(hits)}x statt 1x gefunden.')

          runtime=hits[0]
          src=runtime.read_text(encoding='utf-8')

          required=[
              "__DISPOLUX_038A",
              "version:'1.16.0.27'",
              "Muldennummer, Kunde oder Baustelle",
              "dp38AMapState",
              "dp38AResetView",
              "dp38AFit",
              "dp38AChangeZoom",
              "dp38ABindInteraction",
              "pointerdown",
              "pointermove",
              "pointerup",
              "wheel",
              "touchAction='none'",
              "dp38AMarker",
              "height:27px",
              "Alle Typen",
              "OpenStreetMap contributors",
              "dp31GMapInfo(b)",
              "dp31GFilteredPlacedBins",
              "dp31GIsGpsCurrent",
              "dp31GViewList",
              "dp31GViewMap",
          ]
          missing=[x for x in required if x not in src]
          if missing:
              raise SystemExit('038A VALIDIERUNG: Pflichtbestandteile fehlen: '+', '.join(missing))

          # Die alte zweite Überschrift/zweite Suchkarte darf nicht mehr vorhanden sein.
          if '<strong class="grow">Mulden suchen</strong>' in src:
              raise SystemExit('038A VALIDIERUNG: alte doppelte Überschrift "Mulden suchen" ist noch vorhanden.')

          # Bestehende Kernfunktionen müssen erhalten bleiben.
          basis=[
              'DP_DLB_037E_1_16_0_25_DP_DATA_HYGIENE_BACKUP_FILE_CONFIRM_BEGIN',
              'DP_DLB_036D_1_16_0_20_OFFLINE_OUTBOX_SYNC_BEGIN',
              'DP_DLB_035B_1_16_0_16_AUFTRAG_KONTAKT_MEHRMULDEN_MATERIAL_BEGIN',
              'DP_DLB_034D_1_16_0_15_DP_DATA_STAMMDATEN_PERSISTENZ_BEGIN',
              'DP_DLB_031G_1_16_0_6_STANDORTE_NAVIGATION_BEGIN',
              'DispoLux:036D:offlineOutbox:v1',
              'DispoLux_Backup',
              'DP_Data bereinigt',
              'warehouses','transportLocations','plannedBinMaterials','actualBinMaterials',
              'Standort setzen','Navigation zur Baustelle',
          ]
          missing=[x for x in basis if x not in combined]
          if missing:
              raise SystemExit('038A VALIDIERUNG: bewährte Basis unvollständig: '+', '.join(missing))

          if 'await dp28dBackup(fields, rows, force);' in combined:
              raise SystemExit('038A VALIDIERUNG: alter DPB-Schreibaufruf wieder aktiv.')

          pkg=json.loads(Path('spfx-build/config/package-solution.json').read_text(encoding='utf-8'))
          if pkg.get('solution',{}).get('version')!='1.3.6.121':
              raise SystemExit('038A VALIDIERUNG: SPFx-Version ist nicht 1.3.6.121.')

          if runtime.suffix=='.js':
              subprocess.run(['node','--check',str(runtime)],check=True)

          print('038A VALIDIERUNG OK')
          print('- Basis exakt 037E erhalten')
          print('- nur eine Mulden-Suche; Kartensteuerung darin integriert')
          print('- Touch-Pan, Pinch-Zoom, Mausrad und +/- Zoom vorhanden')
          print('- Marker kompakt und Details erst nach Antippen')
          print('- Suche + Typfilter wirken gemeinsam auf Karte')
          PY_VALIDATE_038A

      - name: Build and package 038A
        shell: bash
        run: |
          set -euo pipefail
          rm -rf spfx-build/release spfx-build/temp/deploy spfx-build/sharepoint/solution
          (cd spfx-build && npx heft build --production)
          (cd spfx-build && npx heft package-solution --production)

          rm -rf artifact/UPLOAD_TO_SITEASSETS artifact/UPLOAD_TO_APP_CATALOG
          mkdir -p artifact/UPLOAD_TO_SITEASSETS artifact/UPLOAD_TO_APP_CATALOG

          PKG=$(find spfx-build/sharepoint/solution -maxdepth 1 -type f -name '*.sppkg' | head -n1)
          test -n "$PKG"
          cp "$PKG" artifact/UPLOAD_TO_APP_CATALOG/DispoPilot_Online_V1.3_SPFX_FINAL.sppkg

          if [ -d spfx-build/release/assets ]; then
            cp -a spfx-build/release/assets/. artifact/UPLOAD_TO_SITEASSETS/
          elif [ -d spfx-build/temp/deploy ]; then
            cp -a spfx-build/temp/deploy/. artifact/UPLOAD_TO_SITEASSETS/
          else
            echo '038A: Keine SPFx Asset-Ausgabe gefunden.' >&2
            exit 1
          fi

          if [ -f .dpx14_icon_b64 ]; then
            python3 - <<'PY_ICON_038A'
          from pathlib import Path
          import base64
          Path('artifact/UPLOAD_TO_SITEASSETS/DispoLux_DL_Icon_48.png').write_bytes(
              base64.b64decode(Path('.dpx14_icon_b64').read_text().strip())
          )
          PY_ICON_038A
          fi

      - name: Validate emitted 038A package
        shell: bash
        run: |
          set -euo pipefail

          COUNT=0
          while IFS= read -r -d '' JS; do
            test -s "$JS"
            node --check "$JS"
            COUNT=$((COUNT+1))
          done < <(find artifact/UPLOAD_TO_SITEASSETS -maxdepth 1 -type f -name '*.js' -print0)
          test "$COUNT" -gt 0
          test -s artifact/UPLOAD_TO_APP_CATALOG/DispoPilot_Online_V1.3_SPFX_FINAL.sppkg

          python3 - <<'PY_FINAL_038A'
          from pathlib import Path

          assets=Path('artifact/UPLOAD_TO_SITEASSETS')
          js=list(assets.glob('*.js'))
          current=[]
          for p in js:
              s=p.read_text(encoding='utf-8')
              if '__DISPOLUX_038A' in s:
                  current.append((p,s))
          if len(current)!=1:
              raise SystemExit(f'038A FINAL: aktueller Produktionsbundle {len(current)}x statt 1x gefunden: {[p.name for p,_ in current]}')

          p,s=current[0]
          required=[
              '__DISPOLUX_037E',
              '__DISPOLUX_038A',
              'DispoLux:036D:offlineOutbox:v1',
              'DispoLux_Backup',
              'DP_Data bereinigt',
              'Muldennummer, Kunde oder Baustelle',
              'OpenStreetMap contributors',
              'dp38AMarker',
              'pointerdown',
              'pointermove',
              'Alle Typen',
              'warehouses',
              'transportLocations',
              'plannedBinMaterials',
              'actualBinMaterials',
              'Standort setzen',
          ]
          missing=[x for x in required if x not in s]
          if missing:
              raise SystemExit('038A FINAL: Pflichtbestandteile fehlen: '+', '.join(missing))

          if '<strong class="grow">Mulden suchen</strong>' in s:
              raise SystemExit('038A FINAL: doppelte alte Mulden-suchen-Überschrift im Produktionsbundle gefunden.')

          stale=[]
          for q in js:
              if q==p:continue
              x=q.read_text(encoding='utf-8')
              if 'sectionKeys' in x and 'DP_Data' in x:stale.append(q.name)
          if stale:
              raise SystemExit('038A FINAL: alte DP_Data-WebPart-Bundles im Auslieferungsordner: '+repr(stale))

          print('038A FINAL OK')
          print('- 037E Datenhaltung/Backup/Offline erhalten')
          print('- Mulden-Suche und Karte als ein Bereich')
          print('- Touch-Karte mit kompakten Markern enthalten')
          PY_FINAL_038A

          cat > artifact/REIHENFOLGE.txt <<'TXT'
          DLB-038A-1.16.0.27 · MULDEN SUCHEN / KARTE MOBIL BEDIENBAR · SPFx 1.3.6.121

          Basis:
          - erfolgreicher DLB-037E-1.16.0.25
          - 037F ausdrücklich NICHT als Basis
          - Offline-Outbox, DP_Data-Bereinigung und Backup-Schutz bleiben erhalten

          038A:
          - bestehende zentrale Suche "Muldennummer, Kunde oder Baustelle" bleibt erhalten
          - Liste/Karte und Typfilter werden direkt in diese Suche integriert
          - keine zweite Überschrift/zweiter Bereich "Mulden suchen"
          - Karte per Touch verschiebbar
          - Pinch-to-Zoom auf Tablet/Smartphone
          - zusätzlich +/- und Zentrieren sowie Mausrad-Zoom
          - kompakte Marker zeigen im Normalzustand nur die Muldennummer
          - Detailinformationen erst nach Antippen des Markers
          - Suche filtert weiterhin Muldennummer, Kunde und Baustelle
          - Typfilter: Alle Typen oder einzelner Muldentyp
          - nur aktuell gestellte Mulden mit aktuellem GPS-Punkt auf der Karte
          - fehlende/nicht aktuelle GPS-Punkte separat kompakt angezeigt
          - OpenStreetMap-Kacheln und Attribution bleiben erhalten

          Praxistest:
          1. Mulden -> Mulden suchen öffnen: nur ein Suchbereich.
          2. Suche nach Muldennummer, Kunde und Baustelle prüfen.
          3. Liste/Karte umschalten.
          4. Auf Smartphone/Tablet Karte mit einem Finger verschieben.
          5. Mit zwei Fingern hinein-/herauszoomen.
          6. Marker müssen deutlich kleiner sein und nur die Muldennummer zeigen.
          7. Marker antippen: erst dann Details + Navigation anzeigen.
          8. "Alle Typen" und einzelnen Muldentyp prüfen.
          9. Einzelne Mulde über Suchfeld auswählen/eingrenzen.
          10. Offline-/Reconnect-Test aus 036D stichprobenartig gegenprüfen.
          TXT

          cat > artifact/DISPOLUX_THEMENREGISTER_ERGAENZUNG_038A.csv <<'CSV'
          Bereich;Änderung;Build;Status
          Mulden suchen;Bestehende Suche und Kartenansicht zu einem Bereich zusammengeführt;DLB-038A;Umgesetzt
          Mulden suchen;Doppelte Mulden-suchen-Überschrift entfernt;DLB-038A;Umgesetzt
          Muldenkarte;Touch-Pan und Pinch-to-Zoom ergänzt;DLB-038A;Umgesetzt
          Muldenkarte;Kompakte Marker nur mit Muldennummer;DLB-038A;Umgesetzt
          Muldenkarte;Details erst nach Marker-Antippen;DLB-038A;Umgesetzt
          Muldenkarte;Suche und Typfilter gemeinsam wirksam;DLB-038A;Umgesetzt
          CSV

          echo '038A: Produktions-JS syntaktisch gültig; integrierte mobile Muldenkarte und 037E-Basis geprüft.'

      - name: Upload DLB-038A artifact
        uses: actions/upload-artifact@v4
        with:
          name: DLB-038A-1.16.0.27-MULDEN-SUCHE-KARTE-TOUCH-SPFX-1.3.6.121
          path: artifact/
          if-no-files-found: error
