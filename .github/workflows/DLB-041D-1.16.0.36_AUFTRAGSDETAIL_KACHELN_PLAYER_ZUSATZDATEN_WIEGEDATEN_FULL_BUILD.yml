          print('041D PATCH OK:',runtime)
          PY_PATCH_041D

      - name: Validate DLB-041D source before build
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_VALIDATE_041D'
          from pathlib import Path
          import json, subprocess

          root=Path('spfx-build/src/webparts')
          files=[p for p in root.rglob('*') if p.is_file() and p.suffix in {'.js','.ts','.tsx'}]
          begin='DP_DLB_041D_1_16_0_35_AUFTRAGSDETAIL_KACHELN_PLAYER_ZUSATZDATEN_BEGIN'
          end='DP_DLB_041D_1_16_0_35_AUFTRAGSDETAIL_KACHELN_PLAYER_ZUSATZDATEN_END'
          hits=[];all_text=[]
          for p in files:
              src=p.read_text(encoding='utf-8');all_text.append(src)
              if begin in src:hits.append((p,src))
          if len(hits)!=1:raise SystemExit(f'041D VALIDIERUNG: Patch {len(hits)}x statt genau 1x gefunden.')
          runtime,src=hits[0]
          if src.count(begin)!=1 or src.count(end)!=1:raise SystemExit('041D VALIDIERUNG: Patchmarker nicht eindeutig.')
          frag=src.split(begin,1)[1].split(end,1)[0]
          combined='\n'.join(all_text)

          basis_required=[
              '__DISPOLUX_040C','__DISPOLUX_039B','__DISPOLUX_036D','__DISPOLUX_035B','__DISPOLUX_031G',
              'DispoLux:036D:offlineOutbox:v1','avvMaterialCatalog-via-dpR1MaterialOptions',
              'plannedBinMaterials','actualBinMaterials','actualExistingBinMaterials','Tatsächlicher Inhalt',
              'dpA3ConfirmBins','statusDisposed','dpStatusWarehouseWrap','dpNUModal','Navigation zur Baustelle',
              'dpBTCompletionFields','dpBTActualMaterial','dpBTWeight','dpBTWeightUnit','dpBTActualDest','Nettogewicht','netWeightKg','btRecord','actualDropLocationId'
          ]
          missing=[x for x in basis_required if x not in combined]
          if missing:raise SystemExit('041D VALIDIERUNG Basis fehlt: '+', '.join(missing))

          fix_required=[
              "version:'1.16.0.36'","design:'tile-detail-v3'","locationModel:'system-location+gps-separated'",
              "timeModel:'segments+events+corrections+legacy-compatible'",'workSegments','workEvents','workTimeCorrections',
              'dp41QuickStart','dp41QuickPause','dp41Finish','dp41OpenExtra','dp41MountStatusFields','dp41ScheduleStatusMount','dp41SaveExtra',
              'dp41StatusFieldGrid','dp41ParseWeightKg','dp41SaveBtFields','dp41AuditBtChange','dp41BtSnapshot',
              'Start','Pause','Weiter','Ausgeführt','Zusatzdaten','Nicht ausgeführt','Auftrag bearbeiten','Auftrag übernehmen',
              'Rapport','Unterschrift → PDF','Systemstandort','GPS-Standort','Mulde im Auftrag',
              'Zusatzinformation · bereits an der Baustelle','GPS-Standort speichern','GPS aktualisieren',
              'orderTimeEdit','dp41TimeEditAllowed','dp41PlannedMaterials','dp41PlanMat',
              'statusStart','statusEnd','statusPause','statusBins','statusLs','statusNote','statusDisposed','dpStatusWarehouse',
              'dpA3Collect','dp35ActualMat','dpBTActualMaterial','dpBTWeight','dpBTWeightUnit','dpBTActualDest','netWeightKg','actualDropLocationId','btChanges','Nettogewicht',
              "body.querySelectorAll(':scope>.card:not(.dp41Card)')"
          ]
          missing=[x for x in fix_required if x not in frag]
          if missing:raise SystemExit('041D VALIDIERUNG Fix fehlt: '+', '.join(missing))

          safety=[
              'const dp41BaseSetStatus','const dp41BaseConfirmStatus',"dp41BaseSetStatus('Ausgeführt')",
              'await dp41BaseConfirmStatus.apply(this,arguments)','await persist()','const dp41BaseOpenDetail',
              'dp41BaseOpenDetail.apply(this,arguments)','window.__DISPOLUX_031G?.setBinGps',
              "if(o.task!=='Tauschen')o.material=dp41Text(vals[0])"
          ]
          missing=[x for x in safety if x not in frag]
          if missing:raise SystemExit('041D VALIDIERUNG Sicherheitsverkettung fehlt: '+', '.join(missing))

          # Der originale Status-Form-Container MUSS im statusModal bleiben, damit zeitversetzte
          # Abschlussmodule (Betriebstagebuch/eANV, Lager, Ist-Mulden) ihre Originalfelder weiter erzeugen können.
          mount_required=[
              "const source=document.querySelector('#statusModal .form')",
              'Array.from(source.children).forEach',
              'grid.appendChild(child)',
              "['dpA3ConfirmBins','dpStatusWarehouseWrap','dpBTCompletionFields']",
              'await dp41Wait(280)',
              "dp41BaseSetStatus('Ausgeführt')",
              "root.querySelector('#dp41Extra')?.addEventListener('click',()=>void dp41OpenExtra())"
          ]
          missing=[x for x in mount_required if x not in frag]
          if missing:raise SystemExit('041D VALIDIERUNG dynamische Zusatzdaten fehlen: '+', '.join(missing))
          if 'target.appendChild(form)' in frag:
              raise SystemExit('041D VALIDIERUNG: statusModal .form darf nicht mehr aus dem Statusdialog verschoben werden.')
          if "oldBtn.style.display='none'" not in frag or "sec.style.display='none'" not in frag:
              raise SystemExit('041D VALIDIERUNG: alte Status-/Bearbeitungsbedienung wird nicht sauber ausgeblendet.')

          pkg=json.loads(Path('spfx-build/config/package-solution.json').read_text(encoding='utf-8'))
          if pkg.get('solution',{}).get('version')!='1.3.6.130':raise SystemExit('041D VALIDIERUNG: SPFx-Version ist nicht 1.3.6.130.')
          if runtime.suffix=='.js':subprocess.run(['node','--check',str(runtime)],check=True)
          print('041D QUELLVALIDIERUNG OK')
          PY_VALIDATE_041D

      - name: Build and package DLB-041D
        shell: bash
        run: |
          set -euo pipefail
          rm -rf spfx-build/release spfx-build/temp/deploy spfx-build/sharepoint/solution
          (cd spfx-build && npx heft build --production)
          (cd spfx-build && npx heft package-solution --production)
          rm -rf artifact/UPLOAD_TO_SITEASSETS artifact/UPLOAD_TO_APP_CATALOG
          mkdir -p artifact/UPLOAD_TO_SITEASSETS artifact/UPLOAD_TO_APP_CATALOG
          PKG=$(find spfx-build/sharepoint/solution -maxdepth 1 -type f -name '*.sppkg' | head -n1)
          test -n "$PKG"
          cp "$PKG" artifact/UPLOAD_TO_APP_CATALOG/DispoPilot_Online_V1.3_SPFX_FINAL.sppkg
          if [ -d spfx-build/release/assets ]; then cp -a spfx-build/release/assets/. artifact/UPLOAD_TO_SITEASSETS/
          elif [ -d spfx-build/temp/deploy ]; then cp -a spfx-build/temp/deploy/. artifact/UPLOAD_TO_SITEASSETS/
          else echo '041D: Keine SPFx Asset-Ausgabe gefunden.' >&2; exit 1; fi

      - name: Validate emitted DLB-041D package
        shell: bash
        run: |
          set -euo pipefail
          COUNT=0
          while IFS= read -r -d '' JS; do test -s "$JS"; node --check "$JS"; COUNT=$((COUNT+1)); done < <(find artifact/UPLOAD_TO_SITEASSETS -maxdepth 1 -type f -name '*.js' -print0)
          test "$COUNT" -gt 0
          test -s artifact/UPLOAD_TO_APP_CATALOG/DispoPilot_Online_V1.3_SPFX_FINAL.sppkg

          python3 - <<'PY_FINAL_041D'
          from pathlib import Path
          js=list(Path('artifact/UPLOAD_TO_SITEASSETS').glob('*.js'));current=[]
          for p in js:
              s=p.read_text(encoding='utf-8')
              if '__DISPOLUX_041D' in s and '1.16.0.36' in s:current.append((p,s))
          if len(current)!=1:raise SystemExit(f'041D FINAL: Produktionsbundle {len(current)}x statt 1x.')
          p,s=current[0]
          required=[
              '__DISPOLUX_041D','__DISPOLUX_040C','__DISPOLUX_039B','__DISPOLUX_036D','__DISPOLUX_035B','__DISPOLUX_031G',
              'tile-detail-v2','segments+events+corrections+legacy-compatible','system-location+gps-separated',
              'Systemstandort','GPS-Standort','Mulde im Auftrag','Zusatzinformation · bereits an der Baustelle',
              'Zusatzdaten','Nicht ausgeführt','Auftrag bearbeiten','Auftrag übernehmen','Rapport','Unterschrift',
              'workSegments','workEvents','workTimeCorrections','orderTimeEdit','dpA3ConfirmBins','statusDisposed','dpStatusWarehouseWrap',
              'dpBTCompletionFields','dpBTActualMaterial','dpBTWeight','dpBTWeightUnit','dpBTActualDest','Nettogewicht','netWeightKg','btRecord','actualDropLocationId','btChanges',
              'plannedBinMaterials','actualBinMaterials','actualExistingBinMaterials','Tatsächlicher Inhalt',
              'DispoLux:036D:offlineOutbox:v1','avvMaterialCatalog-via-dpR1MaterialOptions','Standort setzen','Navigation'
          ]
          missing=[x for x in required if x not in s]
          if missing:raise SystemExit('041D FINAL fehlt: '+', '.join(missing))
          print('041D PAKETVALIDIERUNG OK:',p.name)
          PY_FINAL_041D

          cat > artifact/REIHENFOLGE.txt <<'TXT'
          DLB-041D-1.16.0.36 · AUFTRAGSDETAIL KACHELN / PLAYER / ZUSATZDATEN / WIEGEDATEN · SPFx 1.3.6.130

          Basis:
          - exakt erfolgreicher DLB-040C / 1.16.0.32 / SPFx 1.3.6.126
          - 040C Materialkorrektur bleibt vollständig erhalten
          - 036D Offline-Outbox/Retry bleibt unverändert Basis
          - 039B Recovery bleibt erhalten

          Fahrer-Auftragsdetail:
          - Listenansicht aller Aufträge bleibt unverändert.
          - Detailansicht erhält die neue kachelbasierte Designsprache.
          - oben: Auftrag, Status, Kunde/Baustelle, Termin, Fahrer/Fahrzeug, Navigation/Telefon.
          - große Aktionskacheln: Start/Pause/Weiter, Zusatzdaten, Ausgeführt.
          - Zeitkacheln: Start, Nettozeit, Pause.
          - Auftragsdaten als eigene Kacheln.
          - Weitere Aktionen: Nicht ausgeführt, Auftrag bearbeiten, Auftrag übernehmen, Rapport.
          - Rapport öffnet direkt den vorhandenen Rapport zur Unterschrift; danach bestehende PDF-/Vorschau-Funktion.

          Zusatzdaten:
          - ersetzt den bisherigen Start-/Ausgeführt-Eingabedialog als Bedienoberfläche.
          - übernimmt die bestehenden Felder Start, Ende, Pause, Muldennummer/Zusatz, LS, Bemerkung.
          - übernimmt außerdem tatsächliche Muldenbestätigung, Ist-Material, Ziel-Lager und „Inhalt tatsächlich entleert/entsorgt“.
          - übernimmt jetzt auch den bereits vorhandenen Originalblock „Abfall / Wiegedaten“ vollständig: tatsächlicher Inhalt, Nettogewicht, Einheit kg/t und tatsächliche Abladestelle/Verbleib.
          - Nettogewicht bleibt das vorhandene Feld netWeightKg; keine zweite Gewichtsvariable und keine neue Datenstruktur.
          - vorhandene btRecord-/Betriebstagebuch-/eANV-Zuordnung bleibt unverändert erhalten.
          - Stellen/Liefern/Tauschen: geplanter Inhalt je neuer Mulde ist ebenfalls im Zusatzdaten-Popup änderbar.
          - Materialquelle bleibt die in 040C reparierte zentrale Material-/AVV-Quelle.
          - Zeitänderungen werden zusätzlich mit vorher/nachher, Benutzer und Zeitpunkt protokolliert.
          - Systemeinstellung orderTimeEdit bleibt flexibel für spätere Rollen-/Berechtigungslogik.

          Abschluss:
          - Ausgeführt läuft direkt über den vorhandenen geprüften Abschluss-Workflow.
          - Fehlen Pflichtdaten (z. B. tatsächliche Mulde oder Ziel-Lager), bleibt der Auftrag offen und Zusatzdaten werden geöffnet.
          - Bestandsbewegung, Mehrmuldenlogik und Ist-Material aus 035B werden nicht umgangen.

          Muldenstandort:
          - eigener unterer Bereich „Muldenstandort“.
          - je Mulde getrennte Anzeige: Systemstandort und GPS-Standort.
          - Systemstandort zeigt z. B. konkretes Lager oder Kunde/Baustelle.
          - GPS speichern/aktualisieren ändert ausschließlich den GPS-Punkt, nicht den fachlichen Systemstandort.
          - nicht zum aktuellen Auftrag gehörende Mulden derselben Baustelle stehen separat als Zusatzinformation „bereits an der Baustelle“.

          Pflicht-Praxistest:
          1. Auftragsliste öffnen: Darstellung/Funktion wie 040C.
          2. Auftrag öffnen: neue Kachelansicht ohne alte Bearbeitungsleiste.
          3. Start -> Status In Arbeit + Startzeit; Pause -> Unterbrochen; Weiter -> In Arbeit.
          4. Zusatzdaten öffnen: Zeiten, Mulde, Inhalt, LS, Bemerkung sowie ALLE auftragsabhängigen Abschlussfelder prüfen und speichern.
          4a. Abfall/Wiegedaten: tatsächlicher Inhalt, Nettogewicht, kg/t und tatsächliche Abladestelle/Verbleib müssen sichtbar sein. Nettogewicht eingeben, Zusatzdaten speichern, schließen, erneut öffnen: Wert muss erhalten bleiben.
          4b. Gewicht in t testen (z. B. 3,42 t): gespeichert werden müssen 3420 kg in netWeightKg.
          5. Abholen/Tauschen: Ziel-Lager im Zusatzdaten-Popup prüfen.
          6. Abholen/Leeren/Tauschen: tatsächlichen Inhalt je Mulde prüfen.
          7. Ausgeführt: direkter Abschluss; bei fehlender Pflichtangabe muss Zusatzdaten geöffnet werden und Auftrag offen bleiben.
          8. Nicht ausgeführt: bisheriges Popup mit Grund, Ergänzung, Bemerkung und Neuplanung.
          9. Auftrag bearbeiten und Auftrag übernehmen gegenprüfen.
          10. Rapport: direkt zur Unterschrift; anschließend Vorschau/PDF.
          11. Mulde im Auftrag: Systemstandort (Lager oder Kunde/Baustelle) und GPS getrennt prüfen; GPS speichern/aktualisieren.
          12. Baustelle mit weiterer vorhandener Mulde: diese muss separat als Zusatzinformation erscheinen.
          13. Schlechtnetz/Offline: Start/Pause/Zusatzdaten speichern und nach Wiederverbindung Synchronisation prüfen.
          TXT

