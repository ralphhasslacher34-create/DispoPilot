      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Rebuild exact successful DLB-040C source basis
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY_RUN_040C_BASE'
          from pathlib import Path
          import subprocess, yaml

          expected_sha='339aae6dd0190e24a1534c6383d327de665dfccb'
          actual=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          if actual!=expected_sha:
              raise SystemExit(f'041D: falscher Checkout {actual}, erwartet {expected_sha}.')

          wf=Path('.github/workflows/DLB-040C-1.16.0.32_MATERIAL_STAMM_FELDER_REGRESSION_FIX_FULL_BUILD.yml')
          if not wf.exists():
              raise SystemExit('041D: DLB-040C-Workflow fehlt im geprüften Basis-Commit.')
          doc=yaml.safe_load(wf.read_text(encoding='utf-8'))
          runs=[(s.get('name',''),s.get('run')) for s in doc['jobs']['build']['steps'] if s.get('run')]
          if len(runs)!=5:
              raise SystemExit(f'041D: 040C erwartet 5 ausführbare Buildschritte, gefunden {len(runs)}.')
          for idx,(name,script) in enumerate(runs[:2],1):
              print(f'===== 041D Basis 040C Schritt {idx}/2: {name} =====')
              runner=Path(f'.041d_040c_step_{idx}.sh')
              runner.write_text(script,encoding='utf-8',newline='\n')
              try:
                  subprocess.run(['bash','-euo','pipefail',str(runner)],check=True)
              finally:
                  runner.unlink(missing_ok=True)
          print('041D: erfolgreicher DLB-040C-Quellstand exakt rekonstruiert.')
          PY_RUN_040C_BASE

