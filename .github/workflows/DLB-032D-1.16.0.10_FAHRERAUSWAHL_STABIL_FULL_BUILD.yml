name: DLB-032D-1.16.0.10 FAHRERAUSWAHL STABIL FULL BUILD

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Prepare and run DLB-032D
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml

          python3 - <<'PY_RUN_032D'
          from pathlib import Path
          import base64
          import re
          import subprocess
          import textwrap
          import yaml

          source = Path(".github/workflows/DLB-032B-1.16.0.8_FAHRERAUSWAHL_STABIL_FULL_BUILD.yml")
          if not source.exists():
              raise SystemExit("032D: geprüfte 032B-Quellbasis fehlt.")

          text = source.read_text(encoding="utf-8")

          # Der echte 032B-Fehler: Validator suchte 1.16.0.7,
          # während der eingebettete Patch bereits 1.16.0.8 trug.
          wrong = "DP_DLB_032B_1_16_0_7_TD005_FAHRERAUSWAHL"
          base_marker = "DP_DLB_032B_1_16_0_8_TD005_FAHRERAUSWAHL"
          d_marker = "DP_DLB_032D_1_16_0_10_TD005_FAHRERAUSWAHL"

          count = text.count(wrong)
          if count != 4:
              raise SystemExit(
                  f"032D: Sicherheitsabbruch. Erwartet 4 falsche 032B-Prüfmarker, gefunden {count}."
              )
          text = text.replace(wrong, base_marker)

          # Nur den eingebetteten Patch gezielt umkennzeichnen.
          # Funktionsnamen dp32B... bleiben absichtlich unverändert:
          # sie sind bereits getestet und der 032C-Fehler entstand genau dadurch,
          # dass Validator und Patch-Funktionsnamen auseinanderliefen.
          block_re = re.compile(
              r"(cat > /tmp/dlb032b_patch\.b64 <<'DLB032B_PATCH'\n)"
              r"(?P<b64>.*?)"
              r"(\n\s*DLB032B_PATCH)",
              re.S,
          )
          m = block_re.search(text)
          if not m:
              raise SystemExit("032D: eingebetteter Fahrerauswahl-Patch nicht gefunden.")

          raw_b64 = re.sub(r"\s+", "", m.group("b64"))
          patch = base64.b64decode(raw_b64).decode("utf-8")

          old_begin = base_marker + "_BEGIN"
          old_end = base_marker + "_END"
          new_begin = d_marker + "_BEGIN"
          new_end = d_marker + "_END"

          if patch.count(old_begin) != 1 or patch.count(old_end) != 1:
              raise SystemExit("032D: Patchmarker in der eingebetteten Laufzeit nicht eindeutig.")

          patch = patch.replace(old_begin, new_begin)
          patch = patch.replace(old_end, new_end)
          patch = patch.replace("version:'1.16.0.8'", "version:'1.16.0.10'")
          patch = patch.replace("__DISPOLUX_032B", "__DISPOLUX_032D")

          # Kritische Funktionsnamen müssen erhalten bleiben.
          required_functions = [
              "dp32BInstallDriverPicker",
              "dp32BDriverButton",
              "dp32BDriverMenu",
              "dp32BSelectDriver",
              "dp32BBaseFillSelects",
              "dp32BBaseOpenM",
          ]
          missing = [x for x in required_functions if x not in patch]
          if missing:
              raise SystemExit("032D: Fahrerauswahl-Funktionen fehlen im Patch: " + ", ".join(missing))

          new_b64 = base64.b64encode(patch.encode("utf-8")).decode("ascii")
          wrapped = "\n".join("          " + line for line in textwrap.wrap(new_b64, 76))
          text = text[:m.start("b64")] + wrapped + text[m.end("b64"):]

          # Validator und spätere Paketprüfung auf den neuen eindeutigen Marker stellen.
          text = text.replace(base_marker, d_marker)

          # Nur sichere Metadaten/Anzeigen anheben; KEIN globales 032B -> 032D.
          text = text.replace(
              "name: DLB-032B-1.16.0.8 FAHRERAUSWAHL STABIL FULL BUILD PROD",
              "name: DLB-032D-1.16.0.10 FAHRERAUSWAHL STABIL FULL BUILD",
          )
          text = text.replace(
              "- name: Set 032B SPFx version",
              "- name: Set 032D SPFx version",
          )
          text = text.replace(
              "- name: Validate 032B Fahrerauswahl before build",
              "- name: Validate 032D Fahrerauswahl before build",
          )
          text = text.replace(
              "- name: Build and package 032B",
              "- name: Build and package 032D",
          )
          text = text.replace(
              "- name: Validate emitted 032B package",
              "- name: Validate emitted 032D package",
          )
          text = text.replace(
              "name: DLB-032B-1.16.0.8-FAHRERAUSWAHL-STABIL-SPFX-1.3.6.102",
              "name: DLB-032D-1.16.0.10-FAHRERAUSWAHL-STABIL-SPFX-1.3.6.104",
          )
          text = text.replace("DLB-032B-1.16.0.8", "DLB-032D-1.16.0.10")
          text = text.replace("1.16.0.8", "1.16.0.10")
          text = text.replace("1.3.6.102", "1.3.6.104")
          text = text.replace("__DISPOLUX_032B", "__DISPOLUX_032D")
          text = text.replace("032B VALIDIERUNG", "032D VALIDIERUNG")
          text = text.replace("OK 1/10: 032B-Patch", "OK 1/10: 032D-Patch")
          text = text.replace("OK 10/10: 032B eindeutig", "OK 10/10: 032D eindeutig")
          text = text.replace("032B Fahrerauswahl gepatcht:", "032D Fahrerauswahl gepatcht:")

          # Endkontrolle des erzeugten Workflows vor Ausführung.
          if wrong in text:
              raise SystemExit("032D: alter 1.16.0.7-Prüfmarker ist noch vorhanden.")
          if d_marker + "_BEGIN" not in text or d_marker + "_END" not in text:
              raise SystemExit("032D: neue eindeutige 032D-Marker fehlen.")
          for fn in required_functions:
              if fn not in text:
                  raise SystemExit("032D: Validator erwartet nicht mehr die vorhandenen dp32B-Funktionen: " + fn)
          if "dp32CInstallDriverPicker" in text:
              raise SystemExit("032D: 032C-Fehler (falsch umbenannte Funktionsnamen) ist noch vorhanden.")

          doc = yaml.safe_load(text)
          steps = doc["jobs"]["build"]["steps"]
          run_steps = [(s.get("name", ""), s.get("run")) for s in steps if s.get("run")]
          if not run_steps:
              raise SystemExit("032D: keine Buildschritte gefunden.")

          print("032D Vorprüfung OK:")
          print("- 4 falsche 1.16.0.7-Marker beseitigt")
          print("- DLB-032D / Produkt 1.16.0.10 / SPFx 1.3.6.104")
          print("- getestete dp32B-Funktionsnamen bewusst erhalten")
          print("- 032C-Fehler mit dp32C-Validator ausgeschlossen")

          for idx, (name, script) in enumerate(run_steps, 1):
              print(f"\n===== 032D Schritt {idx}/{len(run_steps)}: {name} =====")
              runner = Path(f".032d_step_{idx}.sh")
              runner.write_text(script, encoding="utf-8", newline="\n")
              try:
                  subprocess.run(["bash", "-euo", "pipefail", str(runner)], check=True)
              finally:
                  runner.unlink(missing_ok=True)

          print("\n032D: Build und Validierung erfolgreich abgeschlossen.")
          PY_RUN_032D

      - name: Upload DLB-032D artifact
        uses: actions/upload-artifact@v4
        with:
          name: DLB-032D-1.16.0.10-FAHRERAUSWAHL-STABIL-SPFX-1.3.6.104
          path: artifact/
          if-no-files-found: error
