name: Build DispoPilot SPFx FULLPAGE

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'dispopilot-online-app.html'
      - 'prepare-spfx-final.py'
      - '.github/workflows/build-spfx-fullpage.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Check FINAL helper
        run: |
          python3 -m py_compile prepare-spfx-final.py
          grep -q "DispoPilot SPFx FINAL JSONC v1" prepare-spfx-final.py

      - name: Install SPFx CLI
        run: npm install -g @microsoft/spfx-cli@latest

      - name: Scaffold SPFx web part
        run: |
          rm -rf spfx-build
          spfx create \
            --template webpart-noframework \
            --library-name dispopilot-online-v13 \
            --component-name "DispoPilot Online" \
            --component-alias DispoPilotOnline \
            --component-description "DispoPilot Online Pilot V1.3" \
            --solution-name dispopilot-online-v13 \
            --target-dir spfx-build \
            --package-manager npm

      - name: Insert DispoPilot runtime FINAL
        run: python3 prepare-spfx-final.py --app dispopilot-online-app.html --project spfx-build

      - name: Enable SharePoint full page
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifests = list(Path("spfx-build/src/webparts").rglob("*.manifest.json"))
          if not manifests:
              raise SystemExit("Kein Webpart-Manifest gefunden.")

          changed = 0
          for manifest in manifests:
              data = json.loads(manifest.read_text(encoding="utf-8"))
              hosts = data.setdefault("supportedHosts", [])
              if "SharePointWebPart" not in hosts:
                  hosts.append("SharePointWebPart")
              if "SharePointFullPage" not in hosts:
                  hosts.append("SharePointFullPage")
              manifest.write_text(
                  json.dumps(data, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8"
              )
              print("FULLPAGE aktiviert:", manifest)
              changed += 1

          package = Path("spfx-build/config/package-solution.json")
          pdata = json.loads(package.read_text(encoding="utf-8"))
          pdata["solution"]["version"] = "1.3.3.0"
          package.write_text(
              json.dumps(pdata, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )
          print("Paketversion: 1.3.3.0")
          print("Geänderte Manifeste:", changed)
          PY

      - name: Verify full page setting
        run: |
          grep -R '"SharePointFullPage"' spfx-build/src/webparts
          grep -n '"version": "1.3.3.0"' spfx-build/config/package-solution.json

      - name: Build production bundle
        working-directory: spfx-build
        run: npx heft build --production

      - name: Package SharePoint solution
        working-directory: spfx-build
        run: npx heft package-solution --production

      - name: Collect package
        run: |
          mkdir -p artifact
          PKG=$(find spfx-build/sharepoint/solution -maxdepth 1 -type f -name '*.sppkg' | head -n 1)
          test -n "$PKG"
          cp "$PKG" artifact/DispoPilot_Online_V1.3.3_FULLPAGE.sppkg

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DispoPilot-Online-V1.3.3-FULLPAGE
          path: artifact/DispoPilot_Online_V1.3.3_FULLPAGE.sppkg
          if-no-files-found: error
