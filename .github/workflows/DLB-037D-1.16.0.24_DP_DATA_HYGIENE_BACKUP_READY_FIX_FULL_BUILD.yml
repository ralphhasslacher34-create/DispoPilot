name: DLB-037D-1.16.0.24 DP DATA HYGIENE BACKUP READY FIX FULL BUILD

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/DLB-037D-1.16.0.24_DP_DATA_HYGIENE_BACKUP_READY_FIX_FULL_BUILD.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Rebuild exact successful DLB-037C implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY_RUN_037C_BASE'
          from pathlib import Path
          import subprocess
          import yaml

          wf=Path('.github/workflows/DLB-037C-1.16.0.23_DP_DATA_HYGIENE_SAFE_CLEANUP_FULL_BUILD.yml')
          if not wf.exists():
              raise SystemExit('037D: erfolgreicher 037C-Workflow fehlt im Repository.')

          doc=yaml.safe_load(wf.read_text(encoding='utf-8'))
          runs=[(s.get('name',''),s.get('run')) for s in doc['jobs']['build']['steps'] if s.get('run')]
          if len(runs)!=5:
              raise SystemExit(f'037D: 037C erwartet 5 ausführbare Schritte, gefunden {len(runs)}.')

          for idx,(name,script) in enumerate(runs[:3],1):
              print(f'===== 037D Basis 037C Schritt {idx}/3: {name} =====')
              runner=Path(f'.037d_037c_step_{idx}.sh')
              runner.write_text(script,encoding='utf-8',newline='\n')
              try:
                  subprocess.run(['bash','-euo','pipefail',str(runner)],check=True)
              finally:
                  runner.unlink(missing_ok=True)

          print('037D: erfolgreicher DLB-037C-Quellstand rekonstruiert.')
          PY_RUN_037C_BASE

      - name: Apply backup readiness fix and promote to DLB-037D
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_PATCH_037D'
          from pathlib import Path
          import json
          import subprocess

          root=Path('spfx-build/src/webparts')
          files=[p for p in root.rglob('*') if p.is_file() and p.suffix in {'.js','.ts','.tsx'}]
          old_marker='DP_DLB_037C_1_16_0_23_DP_DATA_HYGIENE_BEGIN'
          new_marker='DP_DLB_037D_1_16_0_24_DP_DATA_HYGIENE_BACKUP_READY_BEGIN'

          hits=[]
          for p in files:
              s=p.read_text(encoding='utf-8')
              if old_marker in s:
                  hits.append((p,s))
          if len(hits)!=1:
              raise SystemExit(f'037D: 037C-Runtime {len(hits)}x statt genau 1x gefunden.')

          runtime,src=hits[0]

          start=src.find('async function dp37aEnsureFreshBackup(){')
          end=src.find('function dp37aSchedule(',start)
          if start<0 or end<0 or end<=start:
              raise SystemExit('037D: Backup-Bestätigungsfunktion nicht eindeutig gefunden.')

          replacement=r"""async function dp37aWaitBackupApi(timeoutMs=30000){
              const started=dp37aNow();
              while((dp37aNow()-started)<timeoutMs){
                if(typeof window.dpDispoLuxBackupNow==='function'&&typeof window.dpDispoLuxBackupStatus==='function')return true;
                await dp37aSleep(500);
              }
              return typeof window.dpDispoLuxBackupNow==='function'&&typeof window.dpDispoLuxBackupStatus==='function';
            }
            function dp37aBackupStatusFresh(maxAgeMs){
              if(typeof window.dpDispoLuxBackupStatus!=='function')return false;
              try{
                const s=window.dpDispoLuxBackupStatus();
                const when=Date.parse(dp37aText(s&&((s.lastSuccess)||(s.capturedAt))));
                return !!(s&&s.ok===true&&Number.isFinite(when)&&(dp37aNow()-when)>=0&&(dp37aNow()-when)<maxAgeMs);
              }catch(_){
                return false;
              }
            }
            async function dp37aEnsureFreshBackup(){
              if(dp37aBackupStatusFresh(35*60*1000))return true;

              const ready=await dp37aWaitBackupApi(30000);
              if(!ready){
                console.warn('DLB-037D: Backup-API nach 30 Sekunden noch nicht bereit.');
                return false;
              }

              if(dp37aBackupStatusFresh(35*60*1000))return true;

              try{
                await window.dpDispoLuxBackupNow();
              }catch(e){
                console.warn('DLB-037D: manuelle Sicherung vor Bereinigung fehlgeschlagen',e);
                return false;
              }

              for(let i=0;i<20;i++){
                if(dp37aBackupStatusFresh(10*60*1000))return true;
                await dp37aSleep(500);
              }
              return false;
            }
            """

          src=src[:start]+replacement+src[end:]

          old_block="""if(!backupOk){
                  dp37aBanner('DP_Data wurde NICHT bereinigt: vorherige Dateisicherung konnte nicht bestätigt werden.',true);
                  dp37aStatus('⚠ DP_Data-Bereinigung gestoppt · Backup nicht bestätigt');
                  return false;
                }"""
          new_block="""if(!backupOk){
                  dp37aBanner('DP_Data noch nicht bereinigt: Dateisicherung ist noch nicht bestätigt. Neuer Versuch erfolgt automatisch.',true);
                  dp37aStatus('⚠ DP_Data-Bereinigung wartet auf bestätigte Sicherung');
                  dp37aSchedule(2*60*1000);
                  return false;
                }"""
          if src.count(old_block)!=1:
              raise SystemExit(f'037D: Backup-Abbruchblock {src.count(old_block)}x statt 1x gefunden.')
          src=src.replace(old_block,new_block,1)

          replacements={
              'DP_DLB_037C_1_16_0_23_DP_DATA_HYGIENE_BEGIN':'DP_DLB_037D_1_16_0_24_DP_DATA_HYGIENE_BACKUP_READY_BEGIN',
              'DP_DLB_037C_1_16_0_23_DP_DATA_HYGIENE_END':'DP_DLB_037D_1_16_0_24_DP_DATA_HYGIENE_BACKUP_READY_END',
              '__DISPOLUX_037C':'__DISPOLUX_037D',
              "version:'1.16.0.23'":"version:'1.16.0.24'",
              'DLB-037C':'DLB-037D',
          }
          for old,new in replacements.items():
              src=src.replace(old,new)

          if old_marker in src or '__DISPOLUX_037C' in src or "version:'1.16.0.23'" in src:
              raise SystemExit('037D: alte 037C-Laufzeitkennung blieb nach Promotion erhalten.')
          if new_marker not in src or '__DISPOLUX_037D' not in src or "version:'1.16.0.24'" not in src:
              raise SystemExit('037D: neue Laufzeitkennung unvollständig.')

          runtime.write_text(src,encoding='utf-8',newline='\n')
          if runtime.suffix=='.js':
              subprocess.run(['node','--check',str(runtime)],check=True)

          pkg=Path('spfx-build/config/package-solution.json')
          data=json.loads(pkg.read_text(encoding='utf-8'))
          if data.get('solution',{}).get('version')!='1.3.6.117':
              raise SystemExit('037D: erwartete 037C-SPFx-Version 1.3.6.117 fehlt.')
          data['solution']['version']='1.3.6.118'
          pkg.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          print('037D: Backup-Bereitschafts-/Bestätigungslogik repariert und auf SPFx 1.3.6.118 angehoben.')
          PY_PATCH_037D

      - name: Validate 037D source before build
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_VALIDATE_037D'
          from pathlib import Path
          import json,re,subprocess

          root=Path('spfx-build/src/webparts')
          files=[p for p in root.rglob('*') if p.is_file() and p.suffix in {'.js','.ts','.tsx'}]
          begin='DP_DLB_037D_1_16_0_24_DP_DATA_HYGIENE_BACKUP_READY_BEGIN'
          end='DP_DLB_037D_1_16_0_24_DP_DATA_HYGIENE_BACKUP_READY_END'
          hits=[]; combined=[]
          for p in files:
              s=p.read_text(encoding='utf-8')
              combined.append(s)
              if begin in s:
                  hits.append((p,s))
          if len(hits)!=1:
              raise SystemExit(f'037D VALIDIERUNG: Patch {len(hits)}x statt genau 1x gefunden.')

          runtime,src=hits[0]
          if src.count(begin)!=1 or src.count(end)!=1:
              raise SystemExit('037D VALIDIERUNG: Patchmarker nicht eindeutig.')
          frag=src.split(begin,1)[1].split(end,1)[0]
          all_text='\n'.join(combined)

          required=[
              "version:'1.16.0.24'",
              'dp37aWaitBackupApi',
              'dp37aBackupStatusFresh',
              'dp37aEnsureFreshBackup',
              'dp37aWaitBackupApi(30000)',
              'dp37aBackupStatusFresh(35*60*1000)',
              'await window.dpDispoLuxBackupNow()',
              'dp37aBackupStatusFresh(10*60*1000)',
              'dp37aSchedule(2*60*1000)',
              'Neuer Versuch erfolgt automatisch',
              "dp37aQueryPrefix('DPB|')",
              "dp37aQueryPrefix('DP|dispoNotices|')",
              "dp37aQueryPrefix('DP|orders|')",
              'dp37aNoticeRetentionMs=72*60*60*1000',
              'dp37aArchiveKey',
              'exactArchive',
              'dp37aOutboxPending',
          ]
          missing=[x for x in required if x not in frag and x not in all_text]
          if missing:
              raise SystemExit('037D VALIDIERUNG: Pflichtbestandteile fehlen: '+', '.join(missing))

          safety=[
              'o.archivedAt',
              'dp37aFinalStatus(o.status)',
              'exactArchive.has(dp37aArchiveKey(o))',
              'backupOk=await dp37aEnsureFreshBackup()',
          ]
          missing=[x for x in safety if x not in frag]
          if missing:
              raise SystemExit('037D VALIDIERUNG: Sicherheitsregel fehlt: '+', '.join(missing))

          basis=[
              'DP_DLB_036D_1_16_0_20_OFFLINE_OUTBOX_SYNC_BEGIN',
              'DP_DLB_035B_1_16_0_16_AUFTRAG_KONTAKT_MEHRMULDEN_MATERIAL_BEGIN',
              'DP_DLB_034D_1_16_0_15_DP_DATA_STAMMDATEN_PERSISTENZ_BEGIN',
              'DP_DLB_030AH_1_12_1_27_BACKUP_30MIN_FILES_BEGIN',
              'DispoLux:036D:offlineOutbox:v1',
              'DispoLux_Backup',
              'warehouses','transportLocations','plannedBinMaterials','actualBinMaterials',
          ]
          missing=[x for x in basis if x not in all_text]
          if missing:
              raise SystemExit('037D VALIDIERUNG: bewährte Basis unvollständig: '+', '.join(missing))

          if '__DISPOLUX_037A' in all_text or '__DISPOLUX_037B' in all_text or '__DISPOLUX_037C' in all_text:
              raise SystemExit('037D VALIDIERUNG: alte 037A/037B/037C-Laufzeitkennung noch aktiv.')
          if 'await dp28dBackup(fields, rows, force);' in all_text:
              raise SystemExit('037D VALIDIERUNG: alter DPB-Schreibaufruf wieder aktiv.')

          sections=list(re.finditer(r"sectionKeys\s*:\s*\[([^\]]*)\]",src))
          if not sections:
              raise SystemExit('037D VALIDIERUNG: keine sectionKeys gefunden.')
          for idx,m in enumerate(sections,1):
              keys=set(re.findall(r"['\"]([^'\"]+)['\"]",m.group(1)))
              miss=[k for k in ('warehouses','transportLocations') if k not in keys]
              if miss:
                  raise SystemExit(f'037D VALIDIERUNG: sectionKeys #{idx} unvollständig: {miss}')

          pkg=json.loads(Path('spfx-build/config/package-solution.json').read_text(encoding='utf-8'))
          if pkg.get('solution',{}).get('version')!='1.3.6.118':
              raise SystemExit('037D VALIDIERUNG: SPFx-Version ist nicht 1.3.6.118.')
          if runtime.suffix=='.js':
              subprocess.run(['node','--check',str(runtime)],check=True)

          print('037D VALIDIERUNG OK')
          print('- Basis 037C/036D erhalten')
          print('- Backup-API wird bis zu 30 Sekunden abgewartet')
          print('- erfolgreicher Backup-Status wird nach manuellem Backup erneut geprüft')
          print('- bei noch fehlender Bestätigung wird nicht gelöscht und automatisch erneut versucht')
          print('- Archiv- und Offline-Sicherheitsregeln unverändert aktiv')
          PY_VALIDATE_037D

      - name: Build and package 037D
        shell: bash
        run: |
          set -euo pipefail
          rm -rf spfx-build/release spfx-build/temp/deploy spfx-build/sharepoint/solution
          (cd spfx-build && npx heft build --production)
          (cd spfx-build && npx heft package-solution --production)

          rm -rf artifact/UPLOAD_TO_SITEASSETS artifact/UPLOAD_TO_APP_CATALOG
          mkdir -p artifact/UPLOAD_TO_SITEASSETS artifact/UPLOAD_TO_APP_CATALOG

          PKG=$(find spfx-build/sharepoint/solution -maxdepth 1 -type f -name '*.sppkg' | head -n1)
          test -n "$PKG"
          cp "$PKG" artifact/UPLOAD_TO_APP_CATALOG/DispoPilot_Online_V1.3_SPFX_FINAL.sppkg

          if [ -d spfx-build/release/assets ]; then
            cp -a spfx-build/release/assets/. artifact/UPLOAD_TO_SITEASSETS/
          elif [ -d spfx-build/temp/deploy ]; then
            cp -a spfx-build/temp/deploy/. artifact/UPLOAD_TO_SITEASSETS/
          else
            echo '037D: Keine SPFx Asset-Ausgabe gefunden.' >&2
            exit 1
          fi

          if [ -f .dpx14_icon_b64 ]; then
            python3 - <<'PY_ICON_037D'
          from pathlib import Path
          import base64
          Path('artifact/UPLOAD_TO_SITEASSETS/DispoLux_DL_Icon_48.png').write_bytes(
              base64.b64decode(Path('.dpx14_icon_b64').read_text().strip())
          )
          PY_ICON_037D
          fi

      - name: Validate emitted 037D package
        shell: bash
        run: |
          set -euo pipefail

          COUNT=0
          while IFS= read -r -d '' JS; do
            test -s "$JS"
            node --check "$JS"
            COUNT=$((COUNT+1))
          done < <(find artifact/UPLOAD_TO_SITEASSETS -maxdepth 1 -type f -name '*.js' -print0)
          test "$COUNT" -gt 0
          test -s artifact/UPLOAD_TO_APP_CATALOG/DispoPilot_Online_V1.3_SPFX_FINAL.sppkg

          python3 - <<'PY_FINAL_037D'
          from pathlib import Path
          import re

          assets=Path('artifact/UPLOAD_TO_SITEASSETS')
          js=list(assets.glob('*.js'))
          current=[]
          for p in js:
              s=p.read_text(encoding='utf-8')
              if '__DISPOLUX_037D' in s:
                  current.append((p,s))
          if len(current)!=1:
              raise SystemExit(f'037D FINAL: aktueller Produktionsbundle {len(current)}x statt 1x gefunden: {[p.name for p,_ in current]}')

          p,s=current[0]
          required=[
              '__DISPOLUX_036D',
              '__DISPOLUX_037D',
              'DispoLux:036D:offlineOutbox:v1',
              'DispoLux_Backup',
              'DP_Data bereinigt',
              'Neuer Versuch erfolgt automatisch',
              'DP|dispoNotices|',
              'DP|orders|',
              'DPB|',
              'warehouses',
              'transportLocations',
              'plannedBinMaterials',
              'actualBinMaterials',
              'Telefon Baustelle',
              'Standort setzen',
          ]
          missing=[x for x in required if x not in s]
          if missing:
              raise SystemExit('037D FINAL: Pflichtbestandteile fehlen: '+', '.join(missing))

          if '__DISPOLUX_037A' in s or '__DISPOLUX_037B' in s or '__DISPOLUX_037C' in s:
              raise SystemExit('037D FINAL: alte 037A/037B/037C-Laufzeitkennung im Produktionsbundle gefunden.')

          sections=list(re.finditer(r"sectionKeys\s*:\s*\[([^\]]*)\]",s))
          if not sections:
              raise SystemExit('037D FINAL: keine sectionKeys gefunden.')
          for idx,m in enumerate(sections,1):
              keys=set(re.findall(r"['\"]([^'\"]+)['\"]",m.group(1)))
              miss=[k for k in ('warehouses','transportLocations') if k not in keys]
              if miss:
                  raise SystemExit(f'037D FINAL: sectionKeys #{idx} unvollständig: {miss}')

          stale=[]
          for q in js:
              if q==p:
                  continue
              x=q.read_text(encoding='utf-8')
              if 'sectionKeys' in x and 'DP_Data' in x:
                  stale.append(q.name)
          if stale:
              raise SystemExit('037D FINAL: alte DP_Data-WebPart-Bundles im Auslieferungsordner: '+repr(stale))

          print('037D FINAL OK')
          print('- 036D Offline-Outbox erhalten')
          print('- sichere DP_Data-Bereinigung erhalten')
          print('- Backup-Startreihenfolge/Bestätigung repariert')
          PY_FINAL_037D

          cat > artifact/REIHENFOLGE.txt <<'TXT'
          DLB-037D-1.16.0.24 · DP_DATA HYGIENE / BACKUP-BEREITSCHAFT REPARIERT · SPFx 1.3.6.118

          Basis:
          - erfolgreicher DLB-037C-1.16.0.23
          - getestete 036D Offline-Outbox / Reconnect-Merge vollständig erhalten
          - sichere 037C DP_Data-Bereinigungsregeln vollständig erhalten

          Reparatur 037D:
          - Housekeeping wartet bis zu 30 Sekunden auf die Initialisierung der 030AH-Backup-API.
          - Ein bereits bestätigtes Backup jünger als 35 Minuten wird akzeptiert.
          - Andernfalls wird eine manuelle JSON-Dateisicherung ausgelöst.
          - Nach dem Backup wird die Bestätigung nochmals bis zu 10 Sekunden geprüft.
          - Ohne bestätigte Sicherung wird weiterhin NICHT gelöscht.
          - Statt eines endgültigen Abbruchs wird nach 2 Minuten automatisch erneut geprüft.
          - Archiv-, Offline- und Löschsicherheitsregeln bleiben unverändert.

          Praxistest:
          1. 037D installieren und DispoLux online öffnen.
          2. Nach bestätigter Sicherung startet die Bereinigung automatisch.
          3. DP_Data-Anzahl beobachten; aktuelle/geplante Aufträge und Stammdaten anschließend prüfen.
          4. DispoLux_Backup prüfen: aktuelle JSON-Datei muss vorhanden sein.
          TXT

          cat > artifact/DISPOLUX_THEMENREGISTER_ERGAENZUNG_037D.csv <<'CSV'
          Bereich;Änderung;Build;Status
          DP_Data / Sicherheit;Backup-API vor Bereinigung bis zu 30 Sekunden abwarten;DLB-037D;Umgesetzt
          DP_Data / Sicherheit;Backup-Bestätigung nach manueller Sicherung erneut prüfen;DLB-037D;Umgesetzt
          DP_Data / Sicherheit;Ohne bestätigte Sicherung weiterhin keine Löschung;DLB-037D;Umgesetzt
          DP_Data / Betrieb;Bei noch nicht bestätigter Sicherung automatischer neuer Versuch nach 2 Minuten;DLB-037D;Umgesetzt
          CSV

          echo '037D: Produktions-JS syntaktisch gültig; SPPKG vorhanden; Backup-Bereitschaft und sichere DP_Data-Hygiene geprüft.'

      - name: Upload DLB-037D artifact
        uses: actions/upload-artifact@v4
        with:
          name: DLB-037D-1.16.0.24-DP-DATA-HYGIENE-BACKUP-READY-FIX-SPFX-1.3.6.118
          path: artifact/
          if-no-files-found: error
