      - name: Apply K1 billing and site address logic
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path("dispopilot-online-efd-base.html")
          t=p.read_text(encoding="utf-8")

          # 1) Separaten STORNIEREN-Button entfernen.
          storn_pattern=re.compile(
              r"<button\s+class=\"btn danger\"\s+type=\"button\"\s+onclick=\"setStatus\('Storniert'\)\">STORNIEREN</button>"
          )
          t,n=storn_pattern.subn("",t,count=1)
          if n!=1:
              raise SystemExit(f"K1 abgebrochen: STORNIEREN-Button {n}x gefunden statt 1x.")

          # 2) "Nicht ausgeführt" ist ein abschließender/stornierter Fall.
          old_archive="if(['Ausgeführt','Storniert'].includes(pendingStatus)&&!o.archivedAt)"
          new_archive="if(['Ausgeführt','Nicht ausgeführt','Storniert'].includes(pendingStatus)&&!o.archivedAt)"
          if t.count(old_archive)!=1:
              raise SystemExit(
                  f"K1 abgebrochen: Archiv-Bedingung {t.count(old_archive)}x gefunden statt 1x."
              )
          t=t.replace(old_archive,new_archive,1)

          marker="/* DP13_PATCH_BEGIN */"
          if t.count(marker)!=1:
              raise SystemExit(
                  f"K1 abgebrochen: DP13-Marker {t.count(marker)}x gefunden statt 1x."
              )

          patch=r"""
          /* DP_K1_ADRESSEN_BEGIN */

          function dpK1Norm(v){return String(v||'').trim()}
          function dpK1HasBilling(c){
            return !!c && [c.street,c.zip,c.city].some(v=>dpK1Norm(v));
          }
          function dpK1SameAddress(a,b){
            if(!a||!b)return false;
            return dpK1Norm(a.street)===dpK1Norm(b.street)
              && dpK1Norm(a.zip)===dpK1Norm(b.zip)
              && dpK1Norm(a.city)===dpK1Norm(b.city);
          }
          function dpK1AddressHtml(x){
            if(!x)return '';
            const line1=dpK1Norm(x.street);
            const line2=[dpK1Norm(x.zip),dpK1Norm(x.city)].filter(Boolean).join(' ');
            const line3=dpK1Norm(x.extra);
            return [line1,line2,line3].filter(Boolean).map(v=>esc(v)).join('<br>');
          }

          function dpK1SelectedSiteCustomer(){
            const cid=+$('sCustomer')?.value;
            return customer(cid);
          }

          function dpK1SiteCustomerChanged(){
            const cb=$('sSameBilling');
            if(cb?.checked && !dpK1HasBilling(dpK1SelectedSiteCustomer())){
              cb.checked=false;
            }
            dpK1SameBillingChanged();
          }

          function dpK1SameBillingChanged(){
            const cb=$('sSameBilling');
            if(!cb)return;

            const c=dpK1SelectedSiteCustomer();
            if(cb.checked && !dpK1HasBilling(c)){
              cb.checked=false;
            }

            const same=cb.checked;
            ['sStreetWrap','sZipWrap','sCityWrap'].forEach(id=>{
              const el=$(id);
              if(el)el.classList.toggle('hidden',same);
            });

            const preview=$('sBillingPreview');
            if(same){
              $('sStreet').value=dpK1Norm(c?.street);
              $('sZip').value=dpK1Norm(c?.zip);
              $('sCity').value=dpK1Norm(c?.city);
              if(preview){
                preview.classList.remove('hidden');
                preview.innerHTML='<strong>Übernommene Baustellenadresse</strong><br>'
                  +(dpK1AddressHtml(c)||'<span class="small">Keine Rechnungsadresse hinterlegt.</span>');
              }
            }else if(preview){
              preview.classList.add('hidden');
              preview.innerHTML='';
            }
          }

          function dpK1OrderAddress(){
            const out=$('dpK1OrderAddress');
            if(!out)return;
            const s=site($('oSite')?.value);
            const html=dpK1AddressHtml(s);
            if(!s||!html){
              out.classList.add('hidden');
              out.innerHTML='';
              return;
            }
            out.classList.remove('hidden');
            out.innerHTML='<strong>Baustellenadresse</strong><div style="margin-top:4px">'+html+'</div>';
          }

          function dpK1InstallAddressUi(){
            const cStreet=$('cStreet');
            if(cStreet){
              const lab=cStreet.parentElement?.querySelector('label');
              if(lab)lab.textContent='Straße / Hausnr. – Rechnungsadresse';
            }
            const cZip=$('cZip');
            if(cZip){
              const lab=cZip.parentElement?.querySelector('label');
              if(lab)lab.textContent='PLZ – Rechnungsadresse';
            }
            const cCity=$('cCity');
            if(cCity){
              const lab=cCity.parentElement?.querySelector('label');
              if(lab)lab.textContent='Ort – Rechnungsadresse';
            }

            const sStreet=$('sStreet'),sZip=$('sZip'),sCity=$('sCity');
            if(sStreet&&!$('sSameBilling')){
              sStreet.parentElement.id='sStreetWrap';
              sZip.parentElement.id='sZipWrap';
              sCity.parentElement.id='sCityWrap';

              const sameRow=document.createElement('div');
              sameRow.id='sSameBillingRow';
              sameRow.style.gridColumn='1 / -1';
              sameRow.innerHTML=
                '<label class="switchline" style="margin:0">'
                +'<input id="sSameBilling" type="checkbox"> '
                +'<span><strong>Baustellenadresse = Rechnungsadresse</strong>'
                +'<span class="small" style="display:block">Adresse des ausgewählten Kunden übernehmen</span></span>'
                +'</label>'
                +'<div id="sBillingPreview" class="oknotice hidden" style="margin-top:8px"></div>';

              sStreet.parentElement.before(sameRow);
              $('sSameBilling').addEventListener('change',dpK1SameBillingChanged);
              $('sCustomer')?.addEventListener('change',dpK1SiteCustomerChanged);
            }

            const oSite=$('oSite');
            if(oSite&&!$('dpK1OrderAddress')){
              const outer=oSite.closest('.row')?.parentElement;
              if(outer){
                const address=document.createElement('div');
                address.id='dpK1OrderAddress';
                address.className='oknotice hidden';
                address.style.gridColumn='1 / -1';
                outer.after(address);
              }
              oSite.addEventListener('change',dpK1OrderAddress);
              $('oCustomer')?.addEventListener('change',()=>setTimeout(dpK1OrderAddress,0));
            }
          }

          dpK1InstallAddressUi();

          openSite=function(id=null,fromOrder=false){
            // K1G: Wird eine neue Baustelle aus einem geöffneten Auftrag
            // angelegt, ist der dort gewählte Kunde maßgeblich.
            if(!id && $('orderModal')?.classList.contains('show')){
              fromOrder=true;
            }

            editingSiteId=id;
            returnToOrder=fromOrder;
            refreshCustomerSelects();

            if(id){
              const s=site(id);
              $('siteModalTitle').textContent='Baustelle bearbeiten';
              $('sCustomer').value=s.customerId??s.cid;
              $('sName').value=s.name;
              $('sCode').value=s.code||'';
              $('sStreet').value=s.street||'';
              $('sZip').value=s.zip||'';
              $('sCity').value=s.city||'';
              $('sExtra').value=s.extra||'';

              const c=customer(s.customerId??s.cid);
              $('sSameBilling').checked=dpK1HasBilling(c)&&dpK1SameAddress(s,c);
            }else{
              $('siteModalTitle').textContent='Neue Baustelle';
              $('sCustomer').value=fromOrder?$('oCustomer').value:(state.customers[0]?.id||'');
              ['sName','sCode','sStreet','sZip','sCity','sExtra'].forEach(x=>$(x).value='');

              const c=dpK1SelectedSiteCustomer();
              $('sSameBilling').checked=dpK1HasBilling(c);
            }

            dpK1SameBillingChanged();
            openM('siteModal');
          };

          saveSite=async function(){
            const name=$('sName').value.trim();
            if(!name)return alert('Bitte Baustelle eingeben.');

            const customerId=+$('sCustomer').value;
            const c=customer(customerId);
            const same=!!$('sSameBilling')?.checked;

            if(same&&!dpK1HasBilling(c)){
              return alert('Beim Kunden ist noch keine Rechnungsadresse hinterlegt.');
            }

            const code=($('sCode').value.trim()
              ||name.replace(/[^\p{L}\p{N}]/gu,'').slice(0,8)).toUpperCase();

            const street=same?dpK1Norm(c?.street):$('sStreet').value.trim();
            const zip=same?dpK1Norm(c?.zip):$('sZip').value.trim();
            const city=same?dpK1Norm(c?.city):$('sCity').value.trim();

            let id=editingSiteId;
            const data={
              customerId,name,code,street,zip,city,
              extra:$('sExtra').value.trim()
            };

            if(id)Object.assign(site(id),data);
            else{
              id=uid();
              state.sites.push({id,...data});
            }

            await persist();
            closeM('siteModal');
            renderSites();
            refreshOrderSites();

            if(returnToOrder){
              $('oCustomer').value=customerId;
              refreshOrderSites();
              $('oSite').value=id;
              dpK1OrderAddress();
              openM('orderModal');
            }
          };

          const dpK1BaseRefreshOrderSites=refreshOrderSites;
          refreshOrderSites=function(){
            const r=dpK1BaseRefreshOrderSites.apply(this,arguments);
            setTimeout(dpK1OrderAddress,0);
            return r;
          };

          const dpK1BaseOpenDetail=openDetail;
          openDetail=function(id){
            const r=dpK1BaseOpenDetail.apply(this,arguments);
            const o=orderById(id);
            const s=site(o?.siteId);
            const html=dpK1AddressHtml(s);
            const body=$('detailBody');

            if(body&&html&&!body.querySelector('.dpK1SiteAddressCard')){
              const card=document.createElement('div');
              card.className='card dpK1SiteAddressCard';
              card.innerHTML='<strong>Baustellenadresse</strong>'
                +'<div style="margin-top:5px">'+html+'</div>';
              body.prepend(card);
            }
            return r;
          };

          /* DP_K1G_SELECTED_CUSTOMER_BEGIN */
          // Neue Baustelle aus Auftrag übernimmt den ausgewählten Kunden.
          /* DP_K1G_SELECTED_CUSTOMER_END */

          /* DP_K1_ADRESSEN_END */
          """

          t=t.replace(marker,patch+"\n"+marker,1)
          p.write_text(t,encoding="utf-8",newline="\n")
          print("K1 Adressen + Entfernen STORNIEREN eingefügt.")
          PY

          grep -q "DP_K1_ADRESSEN_BEGIN" dispopilot-online-efd-base.html
          grep -q "DP_K1G_SELECTED_CUSTOMER_BEGIN" dispopilot-online-efd-base.html
          grep -Fq "if(!id && \$('orderModal')?.classList.contains('show')){" dispopilot-online-efd-base.html
          grep -Fq "fromOrder=true;" dispopilot-online-efd-base.html
          grep -q "Baustellenadresse = Rechnungsadresse" dispopilot-online-efd-base.html
          grep -q "dpK1OrderAddress" dispopilot-online-efd-base.html
          grep -q "Straße / Hausnr. – Rechnungsadresse" dispopilot-online-efd-base.html
          grep -q "Nicht ausgeführt','Storniert" dispopilot-online-efd-base.html
          if grep -q ">STORNIEREN</button>" dispopilot-online-efd-base.html; then
            echo "Fehler: STORNIEREN-Button ist noch vorhanden."
            exit 1
          fi

      - name: Apply K1B address button, phone, Maps link and locked GPS module
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path("dispopilot-online-efd-base.html")
          t=p.read_text(encoding="utf-8")

          # K1 muss vorher enthalten sein.
          if "DP_K1_ADRESSEN_BEGIN" not in t:
              raise SystemExit("K1B abgebrochen: K1-Adresslogik fehlt.")

          # ------------------------------------------------------------------
          # Baustellen-Stammdaten um Telefon + Google-Maps-Link erweitern.
          # Die vorhandene K1-saveSite-Funktion speichert die Felder direkt
          # am Baustellendatensatz. Alte Datensätze bleiben kompatibel.
          # ------------------------------------------------------------------
          old_data="""const data={
              customerId,name,code,street,zip,city,
              extra:$('sExtra').value.trim()
            };"""
          new_data="""const data={
              customerId,name,code,street,zip,city,
              extra:$('sExtra').value.trim(),
              phone:$('sPhone')?.value.trim()||'',
              mapsUrl:$('sMapsUrl')?.value.trim()||''
            };"""
          if t.count(old_data)!=1:
              raise SystemExit(
                  f"K1B abgebrochen: K1-Datenblock {t.count(old_data)}x gefunden statt 1x."
              )
          t=t.replace(old_data,new_data,1)

          old_edit="""$('sExtra').value=s.extra||'';

              const c=customer(s.customerId??s.cid);"""
          new_edit="""$('sExtra').value=s.extra||'';
              if($('sPhone'))$('sPhone').value=s.phone||'';
              if($('sMapsUrl'))$('sMapsUrl').value=s.mapsUrl||'';

              const c=customer(s.customerId??s.cid);"""
          if t.count(old_edit)!=1:
              raise SystemExit(
                  f"K1B abgebrochen: K1-Bearbeitenblock {t.count(old_edit)}x gefunden statt 1x."
              )
          t=t.replace(old_edit,new_edit,1)

          old_clear="""['sName','sCode','sStreet','sZip','sCity','sExtra'].forEach(x=>$(x).value='');"""
          new_clear="""['sName','sCode','sStreet','sZip','sCity','sExtra','sPhone','sMapsUrl']
                .forEach(x=>{if($(x))$(x).value=''});"""
          if t.count(old_clear)!=1:
              raise SystemExit(
                  f"K1B abgebrochen: K1-Neuanlageblock {t.count(old_clear)}x gefunden statt 1x."
              )
          t=t.replace(old_clear,new_clear,1)

          marker="/* DP13_PATCH_BEGIN */"
          if t.count(marker)!=1:
              raise SystemExit(
                  f"K1B abgebrochen: DP13-Marker {t.count(marker)}x gefunden statt 1x."
              )

          patch=r"""
          /* DP_K1B_BAUSTELLENADRESSE_BEGIN */

          // ------------------------------------------------------------------
          // Basis-/Modulfreigaben.
          // GPS-Muldenposition bleibt sichtbar, ist in der Basisversion
          // jedoch bewusst NICHT freigeschaltet.
          // ------------------------------------------------------------------
          window.DP_FEATURES=Object.assign(
            {binGpsPosition:false},
            window.DP_FEATURES||{}
          );

          function dpK1BLockedGps(){
            if(window.DP_FEATURES?.binGpsPosition===true){
              return true;
            }
            alert(
              'Nicht in dieser Version enthalten.\n\n'
              +'Zusatzmodul „Muldenposition / GPS“ erforderlich.'
            );
            return false;
          }

          function dpK1BValidMapsUrl(v){
            const s=String(v||'').trim();
            if(!s)return '';
            try{
              const u=new URL(s);
              if(!['http:','https:'].includes(u.protocol))return '';
              return u.href;
            }catch(e){
              return '';
            }
          }

          function dpK1BInstallSiteFields(){
            const extra=$('sExtra');
            if(!extra)return;

            const form=extra.closest('.form')||extra.parentElement?.parentElement;
            if(!form)return;

            if(!$('sPhone')){
              const wrap=document.createElement('div');
              wrap.id='sPhoneWrap';
              wrap.innerHTML=
                '<label>Telefon Baustelle / Ansprechpartner</label>'
                +'<input id="sPhone" type="tel" autocomplete="tel" '
                +'placeholder="z. B. 0171 1234567">';
              extra.parentElement.after(wrap);
            }

            if(!$('sMapsUrl')){
              const wrap=document.createElement('div');
              wrap.id='sMapsUrlWrap';
              wrap.style.gridColumn='1 / -1';
              wrap.innerHTML=
                '<label>Google-Maps-Link / exakter Baustellenpunkt</label>'
                +'<input id="sMapsUrl" type="url" inputmode="url" '
                +'placeholder="https://maps.app.goo.gl/...">'
                +'<div class="small" style="margin-top:4px">'
                +'Optional – z. B. für Waldwege, Feldzufahrten oder Baustellen ohne eindeutige Postadresse.'
                +'</div>';
              $('sPhone')?.parentElement.after(wrap);
            }
          }

          // ------------------------------------------------------------------
          // Eigenes Fenster "Baustellenadresse".
          // Dieses Fenster ist später der feste Erweiterungspunkt für GPS.
          // ------------------------------------------------------------------
          function dpK1BInstallAddressModal(){
            if($('dpKAddressModal'))return;

            const modal=document.createElement('div');
            modal.className='modal';
            modal.id='dpKAddressModal';
            modal.innerHTML=`
              <div class="box" style="width:min(680px,calc(100vw - 24px));max-height:calc(100dvh - 24px)">
                <div class="row" style="justify-content:space-between;align-items:center">
                  <h2 style="margin:0">Baustellenadresse</h2>
                  <button class="btn secondary" type="button"
                    onclick="closeM('dpKAddressModal')">Schließen</button>
                </div>

                <div id="dpKAddressContent" style="margin-top:14px"></div>

                <div id="dpKAddressActions" class="row" style="margin-top:16px;gap:8px"></div>

                <div style="margin-top:18px;padding-top:14px;border-top:1px solid #e5e7eb">
                  <div class="small" style="font-weight:700;margin-bottom:8px">
                    Optionale Erweiterung
                  </div>
                  <div class="row" style="gap:8px">
                    <button class="btn secondary" type="button"
                      onclick="dpK1BLockedGps()">
                      🔒 Muldenposition speichern (GPS)
                    </button>
                    <button class="btn secondary" type="button"
                      onclick="dpK1BLockedGps()">
                      🔒 Muldenposition anzeigen
                    </button>
                  </div>
                  <div class="small" style="margin-top:7px">
                    Exakte Muldenposition und GPS-Abstellort gehören zum Zusatzmodul
                    „Muldenposition / GPS“.
                  </div>
                </div>
              </div>`;
            document.body.appendChild(modal);
          }

          function dpK1BOpenAddress(siteId){
            const s=site(siteId);
            if(!s){
              alert('Bitte zuerst eine Baustelle auswählen.');
              return;
            }

            dpK1BInstallAddressModal();

            const c=customer(s.customerId??s.cid);
            const address=dpK1AddressHtml(s);
            const phone=String(s.phone||'').trim();
            const maps=dpK1BValidMapsUrl(s.mapsUrl);

            const content=$('dpKAddressContent');
            content.innerHTML=
              '<div class="card">'
              +'<div class="small">Kunde</div>'
              +'<strong>'+esc(c?.name||'–')+'</strong>'
              +'<div class="small" style="margin-top:10px">Baustelle</div>'
              +'<strong>'+esc(s.name||'–')+'</strong>'
              +'<div style="margin-top:14px">'
              +'<div class="small">Adresse</div>'
              +'<div style="font-size:18px;line-height:1.45;margin-top:3px">'
              +(address||'<span class="small">Keine postalische Adresse hinterlegt.</span>')
              +'</div></div>'
              +(phone
                ?'<div style="margin-top:14px"><div class="small">Telefon</div>'
                  +'<div style="font-size:18px">'+esc(phone)+'</div></div>'
                :'')
              +(maps
                ?'<div style="margin-top:14px"><div class="small">Google-Maps-Standort</div>'
                  +'<div class="small" style="overflow-wrap:anywhere">'+esc(maps)+'</div></div>'
                :'')
              +'</div>';

            const actions=$('dpKAddressActions');
            actions.innerHTML='';

            if(phone){
              const call=document.createElement('a');
              call.className='btn secondary';
              call.href='tel:'+phone.replace(/[^\d+]/g,'');
              call.textContent='Anrufen';
              actions.appendChild(call);
            }

            if(maps){
              const map=document.createElement('a');
              map.className='btn primary';
              map.href=maps;
              map.target='_blank';
              map.rel='noopener noreferrer';
              map.textContent='Google Maps öffnen';
              actions.appendChild(map);
            }

            if(!phone&&!maps){
              const note=document.createElement('div');
              note.className='small';
              note.textContent='Kein Telefon und kein Google-Maps-Link hinterlegt.';
              actions.appendChild(note);
            }

            openM('dpKAddressModal');
          }

          function dpK1BSelectedOrderSiteId(){
            return $('oSite')?.value||null;
          }

          function dpK1BInstallOrderButton(){
            const oSite=$('oSite');
            if(!oSite||$('dpKOrderAddressButton'))return;

            const btn=document.createElement('button');
            btn.id='dpKOrderAddressButton';
            btn.className='btn secondary';
            btn.type='button';
            btn.style.marginTop='8px';
            btn.textContent='Baustellenadresse';
            btn.onclick=()=>dpK1BOpenAddress(dpK1BSelectedOrderSiteId());
            oSite.parentElement.appendChild(btn);

            // Die alte K1-Daueranzeige wird durch den platzsparenden Button ersetzt.
            const old=$('dpK1OrderAddress');
            if(old)old.style.display='none';
          }

          function dpK1BInstallDetailButton(orderId){
            const body=$('detailBody');
            const o=orderById(orderId);
            if(!body||!o)return;

            body.querySelector('.dpK1SiteAddressCard')?.remove();
            body.querySelector('.dpK1BAddressButtonCard')?.remove();

            const card=document.createElement('div');
            card.className='card dpK1BAddressButtonCard';
            card.style.marginBottom='10px';
            card.innerHTML=
              '<button class="btn primary full" type="button">Baustellenadresse</button>';
            card.querySelector('button').onclick=()=>dpK1BOpenAddress(o.siteId);
            body.prepend(card);
          }

          dpK1BInstallSiteFields();
          dpK1BInstallAddressModal();
          dpK1BInstallOrderButton();

          // Felder auch nach späteren Render-/Modalvorgängen sicherstellen.
          const dpK1BBaseOpenSite=openSite;
          openSite=function(){
            dpK1BInstallSiteFields();
            const r=dpK1BBaseOpenSite.apply(this,arguments);
            const id=arguments[0];
            const s=id?site(id):null;
            if($('sPhone'))$('sPhone').value=s?.phone||'';
            if($('sMapsUrl'))$('sMapsUrl').value=s?.mapsUrl||'';
            return r;
          };

          // Kein hartes Hooking auf "openOrder":
          // In diesem DispoPilot-Stand existiert diese Funktion nicht als
          // globale Funktion. Der direkte Zugriff würde die gesamte App
          // bereits beim Start mit "openOrder is not defined" stoppen.
          // Das Auftragsmodal ist statisch im DOM vorhanden; deshalb genügt
          // die Installation des Buttons direkt und nach DOM-Änderungen.
          const dpK1BEnsureOrderButton=()=>{
            dpK1BInstallOrderButton();
            const old=$('dpK1OrderAddress');
            if(old)old.style.display='none';
          };
          dpK1BEnsureOrderButton();

          if(!window.dpK1BOrderButtonObserver){
            const obs=new MutationObserver(()=>dpK1BEnsureOrderButton());
            obs.observe(document.body,{childList:true,subtree:true});
            window.dpK1BOrderButtonObserver=obs;
          }

          const dpK1BBaseOpenDetail=openDetail;
          openDetail=function(id){
            const r=dpK1BBaseOpenDetail.apply(this,arguments);
            setTimeout(()=>dpK1BInstallDetailButton(id),0);
            return r;
          };

          // Eingabevalidierung des Maps-Links vor dem Speichern.
          const dpK1BBaseSaveSite=saveSite;
          saveSite=async function(){
            const raw=String($('sMapsUrl')?.value||'').trim();
            if(raw&&!dpK1BValidMapsUrl(raw)){
              return alert(
                'Bitte einen vollständigen Google-Maps-Link mit https:// eingeben '
                +'oder das Feld leer lassen.'
              );
            }
            return await dpK1BBaseSaveSite.apply(this,arguments);
          };

          /* DP_K1B_BAUSTELLENADRESSE_END */
          """

          t=t.replace(marker,patch+"\n"+marker,1)
          p.write_text(t,encoding="utf-8",newline="\n")
          print("K1B Baustellenadresse / Telefon / Maps / gesperrtes GPS-Modul eingefügt.")
          PY

          grep -q "DP_K1B_BAUSTELLENADRESSE_BEGIN" dispopilot-online-efd-base.html
          grep -q "Baustellenadresse" dispopilot-online-efd-base.html
          grep -q "sPhone" dispopilot-online-efd-base.html
          grep -q "sMapsUrl" dispopilot-online-efd-base.html
          grep -q "binGpsPosition:false" dispopilot-online-efd-base.html
          grep -q "Nicht in dieser Version enthalten" dispopilot-online-efd-base.html
          if grep -q "const dpK1BBaseOpenOrder=openOrder" dispopilot-online-efd-base.html; then
            echo "Fehler: unsicherer openOrder-Hook ist noch vorhanden."
            exit 1
          fi
          grep -q "dpK1BOrderButtonObserver" dispopilot-online-efd-base.html

      - name: Apply non-executed replanning workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path("dispopilot-online-efd-base.html")
          t=p.read_text(encoding="utf-8")

          # ------------------------------------------------------------
          # 1) Separaten VERSCHIEBEN-Button vollständig entfernen.
          # ------------------------------------------------------------
          pat=re.compile(
              r"<button\s+class=\"btn secondary\"\s+type=\"button\"\s+onclick=\"setStatus\('Verschoben'\)\">VERSCHIEBEN</button>"
          )
          t,n=pat.subn("",t,count=1)
          if n!=1:
              raise SystemExit(
                  f"Nicht-ausgeführt-Patch abgebrochen: VERSCHIEBEN-Button {n}x gefunden statt 1x."
              )

          marker="/* DP13_PATCH_BEGIN */"
          if t.count(marker)!=1:
              raise SystemExit(
                  f"Nicht-ausgeführt-Patch abgebrochen: DP13-Marker {t.count(marker)}x gefunden statt 1x."
              )

          patch=r"""
          /* DP_NICHT_AUSGEFUEHRT_NEUPLANUNG_BEGIN */

          function dpNUDateToday(){
            return isoDate(new Date());
          }

          function dpNUReasonOptions(){
            const src=$('statusReason');
            if(src && src.options && src.options.length){
              return Array.from(src.options)
                .map(o=>'<option>'+esc(o.textContent||o.value||'')+'</option>')
                .join('');
            }
            return [
              'Zeit nicht gereicht',
              'Technischer Defekt',
              'Kunde nicht angetroffen',
              'Zufahrt nicht möglich',
              'Container nicht zugänglich',
              'Vom Kunden abgesagt',
              'Von Disposition geändert',
              'Container/Material nicht verfügbar',
              'Witterung',
              'Sonstiges'
            ].map(x=>'<option>'+esc(x)+'</option>').join('');
          }

          function dpNUInstallModal(){
            if($('dpNUModal'))return;

            const m=document.createElement('div');
            m.id='dpNUModal';
            m.className='modal';
            m.innerHTML=`
              <div class="box" style="width:min(680px,100%)">
                <div class="row">
                  <h2 class="grow">Nicht ausgeführt</h2>
                  <button class="btn secondary" type="button"
                    onclick="closeM('dpNUModal')">Schließen</button>
                </div>

                <div class="form">
                  <div>
                    <label>Grund</label>
                    <select id="dpNUReason"></select>
                  </div>

                  <div>
                    <label>Ergänzung / weiterer Grund</label>
                    <input id="dpNUReasonExtra"
                      placeholder="frei ergänzen, z. B. Annahme verweigert">
                    <div class="small" style="margin-top:4px">
                      Freie Ergänzung – auch zusätzlich zu einem ausgewählten Standardgrund.
                    </div>
                  </div>
                </div>

                <div style="margin-top:14px">
                  <label>Bemerkung</label>
                  <textarea id="dpNUNote" placeholder="optional"></textarea>
                </div>

                <div class="section">Auftrag verschieben?</div>
                <div class="row" id="dpNUDecision">
                  <button class="btn danger grow" type="button"
                    onclick="dpNUFinish(false)">
                    Nein – nicht weiter planen
                  </button>
                  <button class="btn primary grow" type="button"
                    onclick="dpNUShowDate()">
                    Ja – Termin wählen
                  </button>
                </div>

                <div id="dpNUDateWrap" class="hidden" style="margin-top:14px">
                  <label>Neues Datum</label>
                  <input id="dpNUDate" type="date">
                  <div class="small" style="margin-top:5px">
                    Heute oder ein zukünftiges Datum. Vergangenheit ist nicht zulässig.
                  </div>
                  <button class="btn primary full" type="button"
                    style="margin-top:12px" onclick="dpNUFinish(true)">
                    Neu planen
                  </button>
                </div>
              </div>`;
            document.body.appendChild(m);
          }

          function dpNUOpen(){
            const o=orderById(currentOrderId);
            if(!o)return;

            dpNUInstallModal();

            $('dpNUReason').innerHTML=dpNUReasonOptions();

            // Bestehenden Grund nur dann vorauswählen, wenn er in der Liste vorkommt.
            const oldReason=String(o.reason||'').trim();
            const opts=Array.from($('dpNUReason').options);
            const known=opts.some(x=>x.value===oldReason);
            if(known)$('dpNUReason').value=oldReason;

            $('dpNUReasonExtra').value=String(o.reasonExtra||'');
            $('dpNUNote').value=String(o.note||'');
            $('dpNUDate').min=dpNUDateToday();
            $('dpNUDate').value=o.date && o.date>=dpNUDateToday() ? o.date : dpNUDateToday();
            $('dpNUDateWrap').classList.add('hidden');

            closeM('detailModal');
            openM('dpNUModal');
          }

          function dpNUShowDate(){
            const w=$('dpNUDateWrap');
            if(!w)return;
            w.classList.remove('hidden');
            $('dpNUDate').min=dpNUDateToday();
            if(!$('dpNUDate').value || $('dpNUDate').value<dpNUDateToday()){
              $('dpNUDate').value=dpNUDateToday();
            }
            setTimeout(()=>$('dpNUDate')?.focus(),50);
          }

          function dpNUNextSeq(date,driver,excludeId){
            if(!date||!driver)return '';
            const vals=(state.orders||[])
              .filter(x=>x.id!=excludeId && x.date===date && x.driver===driver)
              .map(x=>Number(x.seq)||0)
              .filter(x=>x>0);
            return (vals.length?Math.max(...vals):0)+1;
          }

          async function dpNUFinish(replan){
            const o=orderById(currentOrderId);
            if(!o)return;

            const reason=String($('dpNUReason')?.value||'').trim();
            const extra=String($('dpNUReasonExtra')?.value||'').trim();
            const note=String($('dpNUNote')?.value||'').trim();
            const oldDate=o.date;
            const at=nowIso();

            if(!Array.isArray(o.nonExecutionHistory))o.nonExecutionHistory=[];

            if(replan){
              const newDate=String($('dpNUDate')?.value||'').trim();
              const today=dpNUDateToday();

              if(!newDate)return alert('Bitte ein neues Datum wählen.');
              if(newDate<today){
                return alert('Eine Neuplanung in die Vergangenheit ist nicht möglich.');
              }

              o.nonExecutionHistory.push({
                at,
                by:state.user?.name||'',
                oldDate,
                reason,
                reasonExtra:extra,
                note,
                replanned:true,
                newDate
              });

              o.date=newDate;
              o.status='Geplant';
              o.reason='';
              o.reasonExtra='';
              o.note=note;
              o.archivedAt='';

              // Neu geplante Aufträge kommen am Zieltag ans Ende der
              // vorhandenen Fahrer-Reihenfolge. Das gilt auch für heute.
              if(o.driver){
                o.seq=dpNUNextSeq(newDate,o.driver,o.id);
              }else{
                o.seq='';
              }

              o.updatedAt=at;

              // D sorgt anschließend für eine lückenlose 1..n-Reihenfolge.
              if(typeof dpDNormalizeGroup==='function' && o.driver){
                dpDNormalizeGroup(newDate,o.driver);
              }

              await persist();
              closeM('dpNUModal');
              renderAll();

              // In der Fahrer-/Auftragsansicht nicht automatisch erneut öffnen.
              return;
            }

            // Nein: endgültig nicht ausgeführt.
            o.nonExecutionHistory.push({
              at,
              by:state.user?.name||'',
              oldDate,
              reason,
              reasonExtra:extra,
              note,
              replanned:false,
              newDate:''
            });

            o.status='Nicht ausgeführt';
            o.reason=reason;
            o.reasonExtra=extra;
            o.note=note;
            o.updatedAt=at;

            if(!o.archivedAt){
              o.archivedAt=at;
              const copy=clone(o);
              copy.archiveSource='Nicht ausgeführt';
              state.archiveOrders.push(copy);
            }

            await persist();
            closeM('dpNUModal');
            renderAll();
          }

          // Finaler Status-Hook:
          // Nur "Nicht ausgeführt" bekommt den neuen Praxisablauf.
          // Alle anderen Status laufen weiterhin über die vorhandene Logik.
          const dpNUBaseSetStatus=setStatus;
          setStatus=function(s){
            if(s==='Nicht ausgeführt'){
              dpNUOpen();
              return;
            }
            return dpNUBaseSetStatus.apply(this,arguments);
          };

          dpNUInstallModal();

          /* DP_NICHT_AUSGEFUEHRT_NEUPLANUNG_END */
          """

          t=t.replace(marker,patch+"\n"+marker,1)
          p.write_text(t,encoding="utf-8",newline="\n")
          print("Nicht ausgeführt / Neuplanung wurde eingefügt; VERSCHIEBEN-Button entfernt.")
          PY

          grep -q "DP_NICHT_AUSGEFUEHRT_NEUPLANUNG_BEGIN" dispopilot-online-efd-base.html
          grep -q "Ergänzung / weiterer Grund" dispopilot-online-efd-base.html
          grep -q "Auftrag verschieben?" dispopilot-online-efd-base.html
          grep -q "nonExecutionHistory" dispopilot-online-efd-base.html
          grep -q "Eine Neuplanung in die Vergangenheit ist nicht möglich" dispopilot-online-efd-base.html

          if grep -q ">VERSCHIEBEN</button>" dispopilot-online-efd-base.html; then
            echo "Fehler: separater VERSCHIEBEN-Button ist noch vorhanden."
            exit 1
          fi

      - name: Apply status simplification and warehouse master data
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path("dispopilot-online-efd-base.html")
          t=p.read_text(encoding="utf-8")

          # ------------------------------------------------------------
          # 1) "TEILWEISE" vollständig aus der Fahrerbedienung entfernen.
          # Alte historische Datensätze bleiben lesbar.
          # ------------------------------------------------------------
          partial='<button class="btn secondary" type="button" onclick="setStatus(\'Teilweise ausgeführt\')">TEILWEISE</button>'
          if t.count(partial)!=1:
              raise SystemExit(
                  f"Status/Lager abgebrochen: TEILWEISE-Button {t.count(partial)}x gefunden statt 1x."
              )
          t=t.replace(partial,'',1)

          # ------------------------------------------------------------
          # 2) Beim manuellen Mulden-Stammdatensatz konkretes Lager mitspeichern.
          # ------------------------------------------------------------
          old_save="""customerId:status==='Beim Kunden'?+$('bCustomer').value:null,siteId:status==='Beim Kunden'?+$('bSite').value:null,material:"""
          new_save="""warehouseId:status==='Auf Lager'?String($('bWarehouse')?.value||''):'',customerId:status==='Beim Kunden'?+$('bCustomer').value:null,siteId:status==='Beim Kunden'?+$('bSite').value:null,material:"""
          if t.count(old_save)!=1:
              raise SystemExit(
                  f"Status/Lager abgebrochen: saveBin-Standortblock {t.count(old_save)}x gefunden statt 1x."
              )
          t=t.replace(old_save,new_save,1)

          marker="/* DP13_PATCH_BEGIN */"
          if t.count(marker)!=1:
              raise SystemExit(
                  f"Status/Lager abgebrochen: DP13-Marker {t.count(marker)}x gefunden statt 1x."
              )

          patch=r"""
          /* DP_STATUS_LAGER_BEGIN */

          function dpWLEnsureState(){
            if(!state)return;
            if(!Array.isArray(state.warehouses)){
              state.warehouses=[
                {id:'wh-vaihingen',name:'Lager Vaihingen',active:true},
                {id:'wh-horrheim',name:'Lager Horrheim',active:true}
              ];
            }
            state.warehouses=state.warehouses.map((w,i)=>{
              if(typeof w==='string')return {id:'wh-'+i+'-'+Date.now(),name:w,active:true};
              return {
                id:String(w.id||('wh-'+i+'-'+Date.now())),
                name:String(w.name||'Lager').trim()||'Lager',
                active:w.active!==false
              };
            });
            (state.bins||[]).forEach(b=>{
              if(b.warehouseId==null)b.warehouseId='';
            });
          }

          function dpWLWarehouse(id){
            dpWLEnsureState();
            return (state.warehouses||[]).find(w=>String(w.id)===String(id));
          }

          function dpWLWarehouseName(id){
            return dpWLWarehouse(id)?.name||'';
          }

          function dpWLActive(){
            dpWLEnsureState();
            return (state.warehouses||[]).filter(w=>w.active!==false);
          }

          function dpWLFillSelect(el,selected=''){
            if(!el)return;
            dpWLEnsureState();
            const cur=String(selected||'');
            el.innerHTML='<option value="">— Lager wählen —</option>'
              +dpWLActive().map(w=>
                '<option value="'+esc(w.id)+'" '
                +(String(w.id)===cur?'selected':'')+'>'
                +esc(w.name)+'</option>'
              ).join('');
            if(cur && Array.from(el.options).some(o=>o.value===cur))el.value=cur;
          }

          // Konkreten Lagerort in Muldenkarten / Suche anzeigen.
          const dpWLBaseLocationText=locationText;
          locationText=function(b){
            if(b?.status==='Auf Lager'){
              const name=dpWLWarehouseName(b.warehouseId);
              return name||'Auf Lager · Lager nicht zugeordnet';
            }
            return dpWLBaseLocationText.apply(this,arguments);
          };

          // ------------------------------------------------------------
          // Lager-Stammdaten in Einstellungen
          // ------------------------------------------------------------
          function dpWLInstallSettings(){
            const screen=$('settings');
            if(!screen||$('dpWarehouseCard'))return;

            const card=document.createElement('div');
            card.id='dpWarehouseCard';
            card.className='card';
            card.innerHTML=
              '<h3>Lagerstandorte</h3>'
              +'<div class="small" style="margin-bottom:8px">'
              +'Lager können ergänzt, umbenannt oder für neue Vorgänge inaktiv gesetzt werden.'
              +'</div>'
              +'<div id="dpWarehouseList"></div>'
              +'<div class="row" style="margin-top:10px">'
              +'<input id="dpNewWarehouse" class="grow" placeholder="Neues Lager">'
              +'<button class="btn secondary" type="button" onclick="dpWLAddWarehouse()">Hinzufügen</button>'
              +'</div>';

            const last=screen.lastElementChild;
            if(last)screen.insertBefore(card,last);
            else screen.appendChild(card);
          }

          function dpWLRenderSettings(){
            dpWLEnsureState();
            dpWLInstallSettings();
            const host=$('dpWarehouseList');
            if(!host)return;

            host.innerHTML=(state.warehouses||[]).map(w=>
              '<div class="row" style="margin:8px 0">'
              +'<div class="grow">'
              +'<input value="'+esc(w.name)+'" '
              +'onchange="dpWLRenameWarehouse(\''+esc(w.id)+'\',this.value)">'
              +'</div>'
              +'<label class="switchline" style="margin:0">'
              +'<input type="checkbox" '+(w.active!==false?'checked':'')+' '
              +'onchange="dpWLToggleWarehouse(\''+esc(w.id)+'\',this.checked)">'
              +'<span>aktiv</span></label>'
              +'</div>'
            ).join('');
          }

          async function dpWLAddWarehouse(){
            dpWLEnsureState();
            const el=$('dpNewWarehouse');
            const name=String(el?.value||'').trim();
            if(!name)return;
            if(state.warehouses.some(w=>w.name.toLocaleLowerCase('de')===name.toLocaleLowerCase('de'))){
              return alert('Dieses Lager ist bereits vorhanden.');
            }
            state.warehouses.push({id:'wh-'+uid(),name,active:true});
            el.value='';
            await persist();
            dpWLRenderSettings();
          }

          async function dpWLRenameWarehouse(id,value){
            dpWLEnsureState();
            const w=dpWLWarehouse(id);
            const name=String(value||'').trim();
            if(!w||!name)return dpWLRenderSettings();
            w.name=name;
            await persist();
            renderBins();
            dpWLRenderSettings();
          }

          async function dpWLToggleWarehouse(id,on){
            dpWLEnsureState();
            const w=dpWLWarehouse(id);
            if(!w)return;
            w.active=!!on;
            await persist();
            dpWLRenderSettings();
          }

          const dpWLBaseRenderSettings=renderSettings;
          renderSettings=function(){
            dpWLEnsureState();
            const r=dpWLBaseRenderSettings.apply(this,arguments);
            dpWLRenderSettings();
            return r;
          };

          // ------------------------------------------------------------
          // Konkretes Lager im Mulden-Stammdatenfenster
          // ------------------------------------------------------------
          function dpWLInstallBinField(){
            const bStatus=$('bStatus');
            if(!bStatus||$('bWarehouseWrap'))return;

            const wrap=document.createElement('div');
            wrap.id='bWarehouseWrap';
            wrap.innerHTML=
              '<label>Lagerstandort</label>'
              +'<select id="bWarehouse"></select>';
            bStatus.parentElement.after(wrap);
          }

          function dpWLUpdateBinWarehouse(){
            dpWLEnsureState();
            dpWLInstallBinField();
            const on=$('bStatus')?.value==='Auf Lager';
            $('bWarehouseWrap')?.classList.toggle('hidden',!on);
            if(on && $('bWarehouse')){
              const b=editingBinId?(state.bins||[]).find(x=>x.id===editingBinId):null;
              dpWLFillSelect($('bWarehouse'),b?.warehouseId||$('bWarehouse').value||'');
            }
          }

          const dpWLBaseBinStatusChanged=binStatusChanged;
          binStatusChanged=function(){
            const r=dpWLBaseBinStatusChanged.apply(this,arguments);
            dpWLUpdateBinWarehouse();
            return r;
          };

          const dpWLBaseOpenBin=openBin;
          openBin=function(id=null){
            dpWLEnsureState();
            dpWLInstallBinField();
            const r=dpWLBaseOpenBin.apply(this,arguments);
            const b=id?(state.bins||[]).find(x=>x.id===id):null;
            dpWLFillSelect($('bWarehouse'),b?.warehouseId||'');
            dpWLUpdateBinWarehouse();
            return r;
          };

          const dpWLBaseSaveBin=saveBin;
          saveBin=async function(){
            dpWLEnsureState();
            if($('bStatus')?.value==='Auf Lager' && !$('bWarehouse')?.value){
              return alert('Bitte das konkrete Lager auswählen.');
            }
            return await dpWLBaseSaveBin.apply(this,arguments);
          };

          // ------------------------------------------------------------
          // Lagerauswahl beim Abschluss eines Auftrags.
          // Nur Tätigkeiten, die nach aktueller Bestandslogik eine Mulde
          // auf Lager setzen, benötigen diese Auswahl.
          // ------------------------------------------------------------
          function dpWLNeedsWarehouse(o){
            return !!o && ['Abholen','Tauschen'].includes(o.task);
          }

          function dpWLInstallStatusField(){
            const form=$('statusModal')?.querySelector('.form');
            if(!form||$('dpStatusWarehouseWrap'))return;

            const wrap=document.createElement('div');
            wrap.id='dpStatusWarehouseWrap';
            wrap.className='hidden';
            wrap.innerHTML=
              '<label>Ziel-Lager</label>'
              +'<select id="dpStatusWarehouse"></select>'
              +'<div class="small" style="margin-top:4px">'
              +'Wird erst beim Abschluss „Ausgeführt“ als Muldenstandort gespeichert.'
              +'</div>';
            form.appendChild(wrap);
          }

          function dpWLUpdateStatusField(s){
            dpWLEnsureState();
            dpWLInstallStatusField();
            const o=orderById(currentOrderId);
            const show=s==='Ausgeführt'&&dpWLNeedsWarehouse(o);
            $('dpStatusWarehouseWrap')?.classList.toggle('hidden',!show);
            if(show){
              dpWLFillSelect($('dpStatusWarehouse'),o?.warehouseId||'');
            }
          }

          const dpWLBaseSetStatus=setStatus;
          setStatus=function(s){
            if(s==='Teilweise ausgeführt'){
              alert('Der Status „Teilweise ausgeführt“ wird nicht mehr verwendet.');
              return;
            }
            const r=dpWLBaseSetStatus.apply(this,arguments);
            dpWLUpdateStatusField(s);
            return r;
          };

          const dpWLBaseConfirmStatus=confirmStatus;
          confirmStatus=async function(){
            dpWLEnsureState();
            const o=orderById(currentOrderId);

            if(pendingStatus==='Ausgeführt'&&dpWLNeedsWarehouse(o)){
              const wid=String($('dpStatusWarehouse')?.value||'');
              if(!wid)return alert('Bitte das Ziel-Lager auswählen.');
              o.warehouseId=wid;
              o.warehouseName=dpWLWarehouseName(wid);
            }

            return await dpWLBaseConfirmStatus.apply(this,arguments);
          };

          // ------------------------------------------------------------
          // Erst bei "Ausgeführt" wird der Muldenbestand fortgeschrieben.
          // Das bestehende applyBinMovement erledigt die Bewegung; danach
          // ergänzen wir den konkreten Lagerstandort.
          // ------------------------------------------------------------
          function dpWLMainNumbers(o){
            if(Array.isArray(o.actualBinNumbers)&&o.actualBinNumbers.length)
              return o.actualBinNumbers.map(String).filter(Boolean);
            if(Array.isArray(o.existingBinNumbers)&&o.existingBinNumbers.length&&o.task==='Abholen')
              return o.existingBinNumbers.map(String).filter(Boolean);
            const p=parsedBinNumbers(o.binNumbers||'');
            if(p.length)return p;
            return [o.existingBinNumber||o.newBinNumber].map(String).filter(Boolean);
          }

          function dpWLOldNumbers(o){
            if(Array.isArray(o.actualExistingBinNumbers)&&o.actualExistingBinNumbers.length)
              return o.actualExistingBinNumbers.map(String).filter(Boolean);
            if(Array.isArray(o.existingBinNumbers)&&o.existingBinNumbers.length)
              return o.existingBinNumbers.map(String).filter(Boolean);
            return [o.existingBinNumber].map(String).filter(Boolean);
          }

          function dpWLSetMovementTarget(o,number,warehouseName){
            const m=(state.binMovements||[]).find(x=>
              x.orderId==o.id
              && String(x.binNumber)===String(number)
              && ['Abholen','Tauschen – abgeholt'].includes(x.action)
            );
            if(m){
              m.to=warehouseName;
              m.warehouseId=o.warehouseId||'';
            }
          }

          const dpWLBaseApplyBinMovement=applyBinMovement;
          applyBinMovement=function(o){
            dpWLEnsureState();
            dpWLBaseApplyBinMovement.apply(this,arguments);

            if(o.task==='Abholen'){
              const name=dpWLWarehouseName(o.warehouseId);
              dpWLMainNumbers(o).forEach(n=>{
                const b=binByNumber(n);
                if(!b)return;
                b.warehouseId=o.warehouseId||'';
                dpWLSetMovementTarget(o,n,name||'Auf Lager');
              });
            }else if(o.task==='Tauschen'){
              const name=dpWLWarehouseName(o.warehouseId);
              dpWLOldNumbers(o).forEach(n=>{
                const b=binByNumber(n);
                if(!b)return;
                b.warehouseId=o.warehouseId||'';
                dpWLSetMovementTarget(o,n,name||'Auf Lager');
              });
              dpWLMainNumbers(o).forEach(n=>{
                const b=binByNumber(n);
                if(b&&b.status==='Beim Kunden')b.warehouseId='';
              });
            }else if(['Stellen','Liefern','Leeren','Umstellen'].includes(o.task)){
              dpWLMainNumbers(o).forEach(n=>{
                const b=binByNumber(n);
                if(b&&b.status==='Beim Kunden')b.warehouseId='';
              });
            }
          };

          // UI jetzt installieren; State selbst wird erst nach loadState verfügbar.
          dpWLInstallSettings();
          dpWLInstallBinField();
          dpWLInstallStatusField();

          /* DP_STATUS_LAGER_END */
          """

          t=t.replace(marker,patch+"\n"+marker,1)
          p.write_text(t,encoding="utf-8",newline="\n")
          print("Status vereinfacht und Lager-Stammdaten / Lagerzuordnung eingefügt.")
          PY

          grep -q "DP_STATUS_LAGER_BEGIN" dispopilot-online-efd-base.html
          grep -q "Lager Vaihingen" dispopilot-online-efd-base.html
          grep -q "Lager Horrheim" dispopilot-online-efd-base.html
          grep -q "dpStatusWarehouse" dispopilot-online-efd-base.html
          grep -q "warehouseId:status==='Auf Lager'" dispopilot-online-efd-base.html

          if grep -q ">TEILWEISE</button>" dispopilot-online-efd-base.html; then
            echo "Fehler: TEILWEISE-Button ist noch vorhanden."
            exit 1
          fi

