      - name: Apply final F2 notification flow and H3 mobile scrolling fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path("dispopilot-online-efd.html")
          t=p.read_text(encoding="utf-8")

          # ------------------------------------------------------------
          # F2: Meldungsablauf wieder sauber zweistufig.
          #
          # Soll:
          # 1. Auftrag ansehen
          # 2. Auftrag schließen
          # 3. Meldung ausdrücklich bestätigen
          # 4. Meldung verschwindet, Auftrag öffnet NICHT erneut.
          #
          # Der frühere F-Patch quittierte die Meldung bereits beim
          # Schließen des Auftrags. Das kollidiert mit dem eigentlichen
          # Zwei-Stufen-Dialog.
          # ------------------------------------------------------------
          old_f="""const baseCloseM=closeM;
          closeM=function(id){
            baseCloseM(id);
            if(id==='detailModal'&&dp13ReturnNoticeId){
              const noticeId=dp13ReturnNoticeId;
              dp13ReturnNoticeId=null;
              const n=dp13NoticeList().find(x=>x.id===noticeId);
              if(n&&!n.acknowledgedAt){
                n.acknowledgedAt=nowIso();
                persist().then(()=>setTimeout(dp13CheckNotices,40));
              }else{
                setTimeout(dp13CheckNotices,40);
              }
            }
          };"""

          new_f="""const baseCloseM=closeM;
          closeM=function(id){
            baseCloseM(id);
            if(id==='detailModal'&&dp13ReturnNoticeId){
              // Stufe 1 ist beendet: Auftrag wurde angesehen.
              // NICHT hier quittieren. Der Fahrer bestätigt die Meldung
              // anschließend bewusst im Meldungsfenster.
              dp13ReturnNoticeId=null;
              setTimeout(dp13CheckNotices,40);
            }
          };"""

          if t.count(old_f)!=1:
              raise SystemExit(
                  f"F2 abgebrochen: bisheriger F-Block {t.count(old_f)}x gefunden statt 1x."
              )
          t=t.replace(old_f,new_f,1)

          marker="/* DP13_PATCH_BEGIN */"
          if t.count(marker)!=1:
              raise SystemExit(
                  f"H2 abgebrochen: DP13-Marker {t.count(marker)}x gefunden statt 1x."
              )

          patch=r"""
          /* DP_F2_H3_BUGFIX_BEGIN */

          // ------------------------------------------------------------
          // H3: Auf kleinen Bildschirmen darf es nur EINEN vertikalen
          // Scrollbereich geben. Bisher scrollten Modal UND innere Box
          // teilweise gegeneinander. In SharePoint/Browser konnte dadurch
          // oben oder unten ein Teil unerreichbar bleiben.
          // ------------------------------------------------------------
          if(!document.getElementById('dpH3ScrollFixStyle')){
            const st=document.createElement('style');
            st.id='dpH3ScrollFixStyle';
            st.textContent=`
              @media(max-width:760px){
                .modal.show{
                  position:fixed !important;
                  inset:0 !important;
                  width:auto !important;
                  height:auto !important;
                  max-height:none !important;
                  overflow-x:hidden !important;
                  overflow-y:auto !important;
                  -webkit-overflow-scrolling:touch;
                  overscroll-behavior:contain;
                  align-items:flex-start !important;
                  justify-content:center !important;
                  padding:
                    max(10px,env(safe-area-inset-top))
                    8px
                    max(28px,env(safe-area-inset-bottom)) !important;
                  box-sizing:border-box !important;
                }

                .modal.show > .box{
                  width:100% !important;
                  height:auto !important;
                  min-height:0 !important;
                  max-height:none !important;
                  overflow:visible !important;
                  margin:0 auto !important;
                  border-radius:10px !important;
                  box-sizing:border-box !important;
                  padding:12px !important;
                }

                /* H hatte bei Auftrag/Detail/Status 100dvh gesetzt.
                   H2 hebt diese feste Höhe bewusst wieder auf. */
                #orderModal .box,
                #detailModal .box,
                #statusModal .box,
                #siteModal .box,
                #customerModal .box,
                #dpKAddressModal .box{
                  height:auto !important;
                  min-height:0 !important;
                  max-height:none !important;
                  overflow:visible !important;
                }

                /* Kopfzeilen bleiben erreichbar, ohne aus dem sichtbaren
                   Bereich hinaus zu rutschen. */
                #orderModal .box > .row:first-child,
                #detailModal .box > .row:first-child,
                #statusModal .box > .row:first-child,
                #siteModal .box > .row:first-child,
                #customerModal .box > .row:first-child,
                #dpKAddressModal .box > .row:first-child{
                  position:sticky !important;
                  top:-1px !important;
                  z-index:20 !important;
                  background:#fff !important;
                  margin:0 -4px 10px !important;
                  padding:8px 4px 10px !important;
                }

                /* Sicherer unterer Abstand für letzte Buttons/Felder. */
                .modal.show{
                  scroll-padding-bottom:140px !important;
                }

                .modal.show > .box::after{
                  content:"";
                  display:block;
                  height:140px;
                  min-height:140px;
                  flex:0 0 140px;
                  pointer-events:none;
                }
              }
            `;
            document.head.appendChild(st);
          }

          /* DP_F2_H3_BUGFIX_END */
          """

          t=t.replace(marker,patch+"\n"+marker,1)

          p.write_text(t,encoding="utf-8",newline="\n")
          print("F2 Meldungsablauf und H3 Scroll-Fix eingefügt.")
          PY

          grep -q "DP_F2_H3_BUGFIX_BEGIN" dispopilot-online-efd.html
          grep -q "dpH3ScrollFixStyle" dispopilot-online-efd.html
          grep -q "height:140px" dispopilot-online-efd.html
          grep -q "scroll-padding-bottom:140px" dispopilot-online-efd.html
          grep -q "Stufe 1 ist beendet" dispopilot-online-efd.html

          # Beim Schließen des Auftrags darf F2 nicht mehr automatisch quittieren.
          if grep -A14 -B2 "Stufe 1 ist beendet" dispopilot-online-efd.html | grep -q "acknowledgedAt=nowIso"; then
            echo "Fehler: Meldung wird beim Schließen des Auftrags weiterhin automatisch quittiert."
            exit 1
          fi


      - name: Apply L2 central mail queue and native PDF
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path("dispopilot-online-efd.html")
          t=p.read_text(encoding="utf-8")
          marker="/* DP13_PATCH_BEGIN */"
          if t.count(marker)!=1:
              raise SystemExit(f"L2 abgebrochen: DP13-Marker {t.count(marker)}x gefunden statt 1x.")

          patch=r"""
          /* DP_L2_ZENTRALER_STUNDENZETTELVERSAND_BEGIN */
          // L2 / Praxispunkt P:
          // Gastfahrer senden NICHT aus einem eigenen Exchange-Postfach.
          // DispoPilot erzeugt selbst eine echte PDF-Datei im A4-Querformat
          // und legt einen Versandauftrag in DP_Data (DP_Typ=mailQueue) an.
          // Ein zentraler Power-Automate-Flow versendet diese Warteschlange
          // anschließend über das lizenzierte Microsoft-365-Büropostfach.

          let dpL2QueueCounter=0;

          function dpL2QueueRequest(payload){
            return new Promise((resolve,reject)=>{
              const requestId='dp-queue-'+Date.now()+'-'+(++dpL2QueueCounter);
              let done=false;
              const finish=(ok,value)=>{
                if(done)return;
                done=true;
                clearTimeout(timer);
                window.removeEventListener('message',onMessage);
                ok?resolve(value):reject(value instanceof Error?value:new Error(String(value||'Unbekannter Warteschlangenfehler')));
              };
              const onMessage=(event)=>{
                const d=event.data;
                if(!d||d.type!=='DISPOPILOT_MAILQUEUE_RESULT'||d.requestId!==requestId)return;
                if(d.ok)finish(true,d);
                else finish(false,new Error(d.error||'Versandauftrag konnte nicht gespeichert werden.'));
              };
              window.addEventListener('message',onMessage);
              const timer=setTimeout(()=>finish(false,new Error('Zeitüberschreitung beim Speichern des Versandauftrags.')),30000);
              try{
                window.parent.postMessage({
                  type:'DISPOPILOT_MAILQUEUE_CREATE',
                  requestId,
                  payload
                },'*');
              }catch(e){finish(false,e);}
            });
          }

          function dpL2Ascii(s){
            return String(s==null?'':s)
              .replace(/Ä/g,'Ae').replace(/Ö/g,'Oe').replace(/Ü/g,'Ue')
              .replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue')
              .replace(/ß/g,'ss').replace(/€/g,'EUR')
              .replace(/[–—]/g,'-').replace(/[„“”]/g,'"').replace(/[’‘]/g,"'")
              .replace(/[^\x20-\x7E]/g,' ')
              .replace(/\s+/g,' ').trim();
          }

          function dpL2PdfEsc(s){
            return dpL2Ascii(s).replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)');
          }

          function dpL2Wrap(text,width,fontSize){
            const clean=dpL2Ascii(text);
            if(!clean)return [''];
            const max=Math.max(4,Math.floor(width/(fontSize*0.52)));
            const words=clean.split(/\s+/);
            const lines=[];
            let line='';
            for(const word0 of words){
              let word=word0;
              if(word.length>max){
                if(line){lines.push(line);line='';}
                while(word.length>max){lines.push(word.slice(0,max));word=word.slice(max);}
                if(word)line=word;
                continue;
              }
              const next=line?line+' '+word:word;
              if(next.length>max){if(line)lines.push(line);line=word;}else line=next;
            }
            if(line)lines.push(line);
            return lines.length?lines:[''];
          }

          function dpL2ExtractTimesheet(){
            const root=$('previewPaper');
            if(!root)throw new Error('Stundenzettel-Vorschau wurde nicht gefunden.');
            const table=root.querySelector('table');
            if(!table)throw new Error('Stundenzettel-Tabelle wurde nicht gefunden.');
            const rows=[...table.rows].map(r=>[...r.cells].map(c=>String(c.innerText||c.textContent||'').trim()));
            const text=String(root.innerText||root.textContent||'');
            const employer=(text.match(/Arbeitgeber:\s*([^\n\r]+)/i)||[])[1]||'LoraCon GmbH';
            const employee=(text.match(/Arbeitnehmer:\s*([^\n\r]+)/i)||[])[1]||state.user.name||'';
            const month=(text.match(/Monat\s*\/\s*Jahr\s*:?\s*([^\n\r]+)/i)||[])[1]||'';
            return {rows,employer:employer.trim(),employee:employee.trim(),month:month.trim()};
          }

          function dpL2PdfBytes(parts){
            let total=0;
            const arrays=parts.map(s=>{
              const a=new Uint8Array(s.length);
              for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i)&255;
              total+=a.length;return a;
            });
            const out=new Uint8Array(total);let pos=0;
            arrays.forEach(a=>{out.set(a,pos);pos+=a.length;});
            return out;
          }

          function dpL2BuildTimesheetPdf(){
            const data=dpL2ExtractTimesheet();
            const W=842,H=595,margin=34;
            const colW=[92,74,74,102,126,306];
            const fontBody=7.1,fontHead=6.8,fontProject=6.2;
            const pages=[];
            let cmds=[], y=36;
            const py=t=>H-t;
            const line=(x1,y1,x2,y2)=>cmds.push(`0.45 w ${x1.toFixed(1)} ${py(y1).toFixed(1)} m ${x2.toFixed(1)} ${py(y2).toFixed(1)} l S`);
            const text=(x,yt,s,fs=8,bold=false)=>cmds.push(`BT /F${bold?2:1} ${fs.toFixed(1)} Tf ${x.toFixed(1)} ${py(yt).toFixed(1)} Td (${dpL2PdfEsc(s)}) Tj ET`);
            const textLines=(x,yt,lines,fs,leading,bold=false,maxLines=99)=>{
              lines.slice(0,maxLines).forEach((s,i)=>text(x,yt+i*leading,s,fs,bold));
            };
            const drawTableHeader=()=>{
              const headers=(data.rows[0]||['Kalender Tag','Beginn Arbeitszeit','Ende Arbeitszeit','Summe Ruhepause Stunden, Minuten','Dauer abzueglich Pausen Arbeitzzeit nach Tarif','Baustelle / Projektnummer']).slice(0,6);
              const h=42;let x=margin;
              line(margin,y,W-margin,y);line(margin,y+h,W-margin,y+h);
              headers.forEach((htext,i)=>{
                line(x,y,x,y+h);
                const ls=dpL2Wrap(htext,colW[i]-8,fontHead);
                textLines(x+4,y+12,ls,fontHead,7.2,true,4);
                x+=colW[i];
              });
              line(W-margin,y,W-margin,y+h);y+=h;
            };
            const newPage=(first)=>{
              if(cmds.length)pages.push(cmds.join('\n'));
              cmds=[];y=34;
              if(first){
                text(margin,y+7,'LoraCon GmbH',9,true);
                text(margin,y+19,'Lothar Rapp Container + Transporte',7,false);
                text(margin,y+29,'Hinter der Ziegelhuette 7',7,false);
                text(margin,y+39,'71665 Vaihingen/Enz - Horrheim',7,false);
                text(W-margin-116,y+12,'LoraCon',22,true);
                text(W-margin-116,y+25,'Container + Transporte',7,false);
                line(margin,y+48,W-margin,y+48);
                y+=68;
                text(margin,y,'Arbeitnehmerbezogene Erfassung der taeglichen Arbeitszeit',13,true);
                y+=20;
                text(margin,y,'Arbeitgeber:',8,true); text(margin+95,y,data.employer,8,false);
                text(margin+390,y,'Monat/Jahr:',8,true); text(margin+465,y,data.month,8,false);
                y+=14;
                text(margin,y,'Arbeitnehmer:',8,true); text(margin+95,y,data.employee,8,false);
                y+=18;
              }else{
                text(margin,y,'Stundenzettel - Fortsetzung',11,true); y+=18;
              }
              drawTableHeader();
            };
            newPage(true);

            const bodyRows=(data.rows||[]).slice(1);
            for(const row0 of bodyRows){
              const row=row0.slice(0,6); while(row.length<6)row.push('');
              const wrapped=row.map((v,i)=>dpL2Wrap(v,colW[i]-8,i===5?fontProject:fontBody));
              const lineCounts=wrapped.map((ls,i)=>Math.min(ls.length,i===5?9:5));
              let rh=Math.max(24,8+Math.max(...lineCounts)*7.3);
              rh=Math.min(rh,78);
              if(y+rh>H-46){newPage(false);}
              let x=margin;
              line(margin,y,W-margin,y);line(margin,y+rh,W-margin,y+rh);
              for(let i=0;i<6;i++){
                line(x,y,x,y+rh);
                const fs=i===5?fontProject:fontBody;
                const max=i===5?9:5;
                textLines(x+4,y+11,wrapped[i],fs,7.3,i===0,max);
                x+=colW[i];
              }
              line(W-margin,y,W-margin,y+rh);y+=rh;
            }
            text(margin,H-24,'Elektronisch aus DispoPilot erstellt: '+new Date().toLocaleString('de-DE'),6.5,false);
            pages.push(cmds.join('\n'));

            const objects=[];
            const add=o=>{objects.push(o);return objects.length;};
            const catalog=add('');
            const pagesObj=add('');
            const font1=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>');
            const font2=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold >>');
            const pageRefs=[];
            pages.forEach(stream=>{
              const pageRef=add('');
              const contentRef=add(`<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`);
              pageRefs.push(pageRef);
              objects[pageRef-1]=`<< /Type /Page /Parent ${pagesObj} 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /Font << /F1 ${font1} 0 R /F2 ${font2} 0 R >> >> /Contents ${contentRef} 0 R >>`;
            });
            objects[catalog-1]=`<< /Type /Catalog /Pages ${pagesObj} 0 R >>`;
            objects[pagesObj-1]=`<< /Type /Pages /Count ${pageRefs.length} /Kids [${pageRefs.map(r=>r+' 0 R').join(' ')}] >>`;

            let pdf='%PDF-1.4\n%\xE2\xE3\xCF\xD3\n';
            const offsets=[0];
            objects.forEach((obj,i)=>{offsets.push(pdf.length);pdf+=`${i+1} 0 obj\n${obj}\nendobj\n`;});
            const xref=pdf.length;
            pdf+=`xref\n0 ${objects.length+1}\n0000000000 65535 f \n`;
            for(let i=1;i<offsets.length;i++)pdf+=String(offsets[i]).padStart(10,'0')+' 00000 n \n';
            pdf+=`trailer\n<< /Size ${objects.length+1} /Root ${catalog} 0 R >>\nstartxref\n${xref}\n%%EOF\n`;
            return new Blob([dpL2PdfBytes([pdf])],{type:'application/pdf'});
          }

          function dpL2Filename(){
            const kw=isoWeekNumber(selectedWeekMonday);
            const who=dpL2Ascii(state.user.name||'Fahrer').replace(/[^A-Za-z0-9_-]+/g,'_');
            return `Stundenzettel_${who}_KW${kw}.pdf`;
          }

          function dpL2DownloadPdf(){
            try{
              const blob=dpL2BuildTimesheetPdf();
              const url=URL.createObjectURL(blob);
              const a=document.createElement('a');
              a.href=url;a.download=dpL2Filename();
              document.body.appendChild(a);a.click();a.remove();
              setTimeout(()=>URL.revokeObjectURL(url),5000);
            }catch(e){
              console.error('DispoPilot PDF',e);
              alert('PDF konnte nicht erstellt werden.\n\n'+String(e&&e.message?e.message:e));
            }
          }

          async function dpL2BlobBase64(blob){
            const bytes=new Uint8Array(await blob.arrayBuffer());
            let binary='';
            const chunk=0x8000;
            for(let i=0;i<bytes.length;i+=chunk){binary+=String.fromCharCode(...bytes.subarray(i,i+chunk));}
            return btoa(binary);
          }

          function dpL2Recipient(){
            const idx=+$('tsRecipient').value;
            return (state.settings.timesheetRecipients||[])[idx]||{};
          }

          async function dpL2SendTimesheet(){
            const r=dpL2Recipient();
            if(!r.mail||!String(r.mail).includes('@')){
              alert('Für den ausgewählten Stundenzettel-Empfänger ist keine gültige E-Mail-Adresse hinterlegt.');return;
            }
            const btn=$('previewSendBtn');const oldText=btn?btn.textContent:'';
            if(btn){btn.disabled=true;btn.textContent='Wird übergeben …';}
            try{
              const kw=isoWeekNumber(selectedWeekMonday);
              const blob=dpL2BuildTimesheetPdf();
              const attachmentBase64=await dpL2BlobBase64(blob);
              const recipient=String(r.mail).trim();
              const subject=`Stundenzettel ${state.user.name} – KW ${kw}`;
              const payload={
                schema:2,
                status:'Pending',
                kind:'Stundenzettel',
                createdAt:nowIso(),
                createdBy:state.user.name,
                week:selectedWeekMonday,
                period:`KW ${kw}`,
                to:[recipient],
                subject,
                bodyHtml:`<p>Guten Tag,</p><p>anbei der Stundenzettel von <strong>${String(state.user.name||'')}</strong> für KW ${kw}.</p><p>Diese E-Mail wurde automatisch durch DispoPilot zum Versand bereitgestellt.</p>`,
                attachmentName:dpL2Filename(),
                attachmentContentType:'application/pdf',
                attachmentBase64
              };
              const result=await dpL2QueueRequest(payload);
              if(!Array.isArray(state.documents))state.documents=[];
              state.documents.unshift({
                id:uid(),type:'Stundenzettel',date:nowIso(),week:selectedWeekMonday,period:`KW ${kw}`,
                driver:state.user.name,recipient,recipients:[recipient],recipientName:r.name||'',
                status:'Versand beauftragt',transport:'Microsoft 365 / Power Automate',queueItemId:result&&result.itemId||null
              });
              await persist();
              closeM('previewModal');renderHistory();
              alert('Stundenzettel wurde als PDF zum zentralen Microsoft-365-Versand übergeben.');
            }catch(e){
              console.error('DispoPilot L2 Versand',e);
              alert('Stundenzettel konnte nicht zum Versand übergeben werden.\n\n'+String(e&&e.message?e.message:e));
            }finally{if(btn){btn.disabled=false;btn.textContent=oldText||'Stundenzettel senden';}}
          }

          const dpL2BasePreviewTimesheet=previewTimesheet;
          previewTimesheet=function(){
            closeM('timesheetModal');
            $('previewTitle').textContent='Stundenzettel – Vorschau';
            $('previewPaper').innerHTML=timesheetPaper();
            $('previewSendBtn').textContent='Stundenzettel senden';
            $('previewSendBtn').onclick=dpL2SendTimesheet;
            const printBtn=document.querySelector('#previewModal .btn.secondary');
            if(printBtn){
              printBtn.textContent='PDF herunterladen';
              printBtn.onclick=dpL2DownloadPdf;
            }
            openM('previewModal');
          };

          /* DP_L2_ZENTRALER_STUNDENZETTELVERSAND_END */
          """

          t=t.replace(marker,patch+"\n"+marker,1)
          p.write_text(t,encoding="utf-8",newline="\n")
          print("L2: zentrale Versandwarteschlange und native PDF-Erzeugung eingefügt.")
          PY

          grep -q "DP_L2_ZENTRALER_STUNDENZETTELVERSAND_BEGIN" dispopilot-online-efd.html
          grep -q "DISPOPILOT_MAILQUEUE_CREATE" dispopilot-online-efd.html
          grep -q "DP_Typ=mailQueue" dispopilot-online-efd.html
          grep -q "PDF herunterladen" dispopilot-online-efd.html
          grep -q "Versand beauftragt" dispopilot-online-efd.html

      - name: Install SPFx CLI
        run: npm install -g @microsoft/spfx-cli@latest

      - name: Scaffold SPFx web part
        run: |
          rm -rf spfx-build
          spfx create \
            --template webpart-noframework \
            --library-name dispopilot-online-v13 \
            --component-name "DispoPilot Online" \
            --component-alias DispoPilotOnline \
            --component-description "DispoPilot Online V1.3" \
            --solution-name dispopilot-online-v13 \
            --target-dir spfx-build \
            --package-manager npm

      - name: Insert patched runtime
        run: |
          python3 prepare-spfx-final.py \
            --app dispopilot-online-efd.html \
            --project spfx-build


      - name: Install SPFx SharePoint mail queue bridge
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files=list(Path("spfx-build/src/webparts").rglob("*.ts"))
          candidates=[]
          for f in files:
              s=f.read_text(encoding="utf-8")
              if "BaseClientSideWebPart" in s and re.search(r"public\s+render\s*\(\s*\)\s*:\s*void\s*\{",s):
                  candidates.append(f)
          if len(candidates)!=1:
              raise SystemExit(f"L2 Queue-Bridge abgebrochen: {len(candidates)} passende WebPart-TS-Dateien gefunden statt 1.")

          p=candidates[0]
          t=p.read_text(encoding="utf-8")
          if "@microsoft/sp-http" not in t:
              lines=t.splitlines()
              insert_at=0
              for i,line in enumerate(lines):
                  if line.startswith('import '):insert_at=i+1
              lines.insert(insert_at,"import { SPHttpClient } from '@microsoft/sp-http';")
              t='\n'.join(lines)+'\n'

          pattern=re.compile(r"(public\s+render\s*\(\s*\)\s*:\s*void\s*\{\s*)")
          if len(pattern.findall(t))!=1:
              raise SystemExit("L2 Queue-Bridge: render()-Einstieg nicht eindeutig.")

          bridge=r"""
            // DP_L2_MAILQUEUE_BRIDGE_BEGIN
            const dpQueueWindow: any = window as any;
            if (!dpQueueWindow.__DISPOPILOT_MAILQUEUE_BRIDGE_V2) {
              dpQueueWindow.__DISPOPILOT_MAILQUEUE_BRIDGE_V2 = true;
              const dpQueueContext: any = this.context as any;
              const dpQueueDom: HTMLElement = this.domElement;

              window.addEventListener('message', async (event: MessageEvent) => {
                const data: any = event.data;
                if (!data || data.type !== 'DISPOPILOT_MAILQUEUE_CREATE') return;

                const frame = dpQueueDom.querySelector('iframe') as HTMLIFrameElement | null;
                if (!frame || event.source !== frame.contentWindow) return;

                const source: any = event.source;
                const reply = (ok: boolean, itemId?: number, error?: string): void => {
                  try {
                    if (source && source.postMessage) {
                      source.postMessage({
                        type: 'DISPOPILOT_MAILQUEUE_RESULT',
                        requestId: String(data.requestId || ''),
                        ok,
                        itemId: itemId || null,
                        error: error || ''
                      }, '*');
                    }
                  } catch (_) {}
                };

                try {
                  const payload: any = data.payload || {};
                  const to: string[] = (Array.isArray(payload.to) ? payload.to : [])
                    .map((x: any) => String(x || '').trim())
                    .filter((x: string) => /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(x))
                    .slice(0, 10);
                  const pdf64 = String(payload.attachmentBase64 || '');
                  if (!to.length) throw new Error('Kein gültiger E-Mail-Empfänger.');
                  if (!pdf64 || pdf64.length > 900000) throw new Error('PDF-Anhang fehlt oder ist zu groß.');

                  payload.to = to;
                  payload.status = 'Pending';
                  const id = `mail-${Date.now()}-${Math.floor(Math.random()*1000000)}`;
                  const body = JSON.stringify({
                    Title: `DP|mailQueue|${id}`,
                    DP_Typ: 'mailQueue',
                    DP_Daten: JSON.stringify(payload)
                  });
                  const webUrl = String(dpQueueContext.pageContext.web.absoluteUrl || '').replace(/\/$/, '');
                  const url = `${webUrl}/_api/web/lists/getbytitle('DP_Data')/items`;
                  const response = await dpQueueContext.spHttpClient.post(
                    url,
                    SPHttpClient.configurations.v1,
                    {
                      headers: {
                        'Accept': 'application/json;odata=nometadata',
                        'Content-Type': 'application/json;odata=nometadata'
                      },
                      body
                    }
                  );
                  if (!response.ok) {
                    const detail = await response.text();
                    throw new Error(`SharePoint DP_Data ${response.status}: ${detail.slice(0,400)}`);
                  }
                  const json: any = await response.json();
                  reply(true, Number(json && (json.Id || json.ID) || 0));
                } catch (err: any) {
                  const msg=String((err && err.message) || err || 'MailQueue konnte nicht angelegt werden.').slice(0,900);
                  reply(false, undefined, msg);
                }
              });
            }
            // DP_L2_MAILQUEUE_BRIDGE_END

          """
          t,n=pattern.subn(lambda m:m.group(1)+bridge,t,count=1)
          if n!=1:raise SystemExit("L2 Queue-Bridge konnte nicht in render() eingefügt werden.")
          p.write_text(t,encoding="utf-8",newline="\n")
          print("L2 SharePoint-MailQueue-Bridge eingefügt in",p)
          PY

          grep -R -q "DP_L2_MAILQUEUE_BRIDGE_BEGIN" spfx-build/src/webparts
          grep -R -q "DISPOPILOT_MAILQUEUE_CREATE" spfx-build/src/webparts
          grep -R -q "getbytitle('DP_Data')/items" spfx-build/src/webparts
          grep -R -q "SPHttpClient.configurations.v1" spfx-build/src/webparts

      - name: Configure SiteAssets hosting
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          package = Path('spfx-build/config/package-solution.json')
          pdata = json.loads(package.read_text(encoding='utf-8'))
          solution = pdata['solution']
          solution['version'] = '1.3.5.30'
          solution['includeClientSideAssets'] = False
          solution['skipFeatureDeployment'] = True

          # L2 benötigt keine delegierte Mail.Send-Berechtigung mehr.
          # Versand übernimmt zentral Power Automate / das lizenzierte Büropostfach.
          requests = solution.get('webApiPermissionRequests', [])
          solution['webApiPermissionRequests'] = [
              x for x in requests
              if not (isinstance(x, dict) and str(x.get('resource','')).lower() == 'microsoft graph'
                      and str(x.get('scope','')).lower() == 'mail.send')
          ]

          package.write_text(json.dumps(pdata, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          wm_path = Path('spfx-build/config/write-manifests.json')
          wm = {
            '$schema': 'https://developer.microsoft.com/json-schemas/spfx-build/write-manifests.schema.json',
            'cdnBasePath': 'https://ralphyourway.sharepoint.com/sites/DispoPilot/SiteAssets/DispoPilotAssets'
          }
          wm_path.write_text(json.dumps(wm, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          manifests = list(Path('spfx-build/src/webparts').rglob('*.manifest.json'))
          if not manifests:
              raise SystemExit('Kein Webpart-Manifest gefunden.')

          for manifest in manifests:
              data = json.loads(manifest.read_text(encoding='utf-8'))
              hosts = data.setdefault('supportedHosts', [])
              for host in ('SharePointWebPart', 'SharePointFullPage'):
                  if host not in hosts:
                      hosts.append(host)
              manifest.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Verify configuration
        run: |
          grep -q '"includeClientSideAssets": false' spfx-build/config/package-solution.json
          grep -q '"version": "1.3.5.30"' spfx-build/config/package-solution.json
          if grep -q '"scope": "Mail.Send"' spfx-build/config/package-solution.json; then echo 'Fehler: L2 darf Mail.Send nicht mehr anfordern.'; exit 1; fi
          grep -R 'DP_L2_ZENTRALER_STUNDENZETTELVERSAND_BEGIN' spfx-build/src/webparts
          grep -R 'DP_L2_MAILQUEUE_BRIDGE_BEGIN' spfx-build/src/webparts
          grep -R 'DISPOPILOT_MAILQUEUE_CREATE' spfx-build/src/webparts
          grep -q 'SiteAssets/DispoPilotAssets' spfx-build/config/write-manifests.json
          grep -R '"SharePointFullPage"' spfx-build/src/webparts
          grep -R 'DP_Users' spfx-build/src/webparts
          grep -R 'DP_D_FAHRFOLGE_BEGIN' spfx-build/src/webparts
          grep -R 'dpDNormalizeAllGroups' spfx-build/src/webparts
          grep -R 'dpSequenceRepaired' spfx-build/src/webparts
          grep -R 'n.acknowledgedAt=nowIso()' spfx-build/src/webparts
          grep -R 'DP_A2_MEHRMULDEN_BEGIN' spfx-build/src/webparts
          grep -R 'DP_A3_FAHRERBESTAETIGUNG_BEGIN' spfx-build/src/webparts
          grep -R 'DP_G3_AUTOREFRESH_BEGIN' spfx-build/src/webparts
          grep -R 'DP_A5_LEEREN_ABHOLEN_MULDENTYP_BEGIN' spfx-build/src/webparts
          grep -R 'DP_I_AKTUALISIEREN_BEGIN' spfx-build/src/webparts
          grep -R 'DP_H_MOBILE_AUFTRAGSANSICHT_BEGIN' spfx-build/src/webparts
          grep -R 'DP_K1_ADRESSEN_BEGIN' spfx-build/src/webparts
          grep -R 'DP_NICHT_AUSGEFUEHRT_NEUPLANUNG_BEGIN' spfx-build/src/webparts
          grep -R 'DP_STATUS_LAGER_BEGIN' spfx-build/src/webparts
          grep -R 'DP_K1G_SELECTED_CUSTOMER_BEGIN' spfx-build/src/webparts
          grep -R 'DP_K1B_BAUSTELLENADRESSE_BEGIN' spfx-build/src/webparts
          grep -R 'DP_F2_H3_BUGFIX_BEGIN' spfx-build/src/webparts
          grep -R 'dpH3ScrollFixStyle' spfx-build/src/webparts
          grep -R 'dpG3Poll' spfx-build/src/webparts
          grep -R 'Aktualisieren' spfx-build/src/webparts
          if grep -R 'onclick=\\"window.location.reload()\\"' spfx-build/src/webparts; then
            echo 'Fehler: reload-Handler im SPFx-Runtime gefunden.'
            exit 1
          fi
          grep -R 'dpStatusColorLogic' spfx-build/src/webparts

      - name: Build production bundle
        working-directory: spfx-build
        run: npx heft build --production

      - name: Package SharePoint solution
        working-directory: spfx-build
        run: npx heft package-solution --production

      - name: Collect SiteAssets and package
        run: |
          set -e
          rm -rf artifact
          mkdir -p artifact/UPLOAD_TO_SITEASSETS
          mkdir -p artifact/UPLOAD_TO_APP_CATALOG

          PKG=$(find spfx-build/sharepoint/solution -maxdepth 1 -type f -name '*.sppkg' | head -n 1)
          test -n "$PKG"
          cp "$PKG" artifact/UPLOAD_TO_APP_CATALOG/DispoPilot_Online_V1.3_SPFX_FINAL.sppkg

          if [ -d "spfx-build/release/assets" ]; then
            cp -a spfx-build/release/assets/. artifact/UPLOAD_TO_SITEASSETS/
          elif [ -d "spfx-build/temp/deploy" ]; then
            cp -a spfx-build/temp/deploy/. artifact/UPLOAD_TO_SITEASSETS/
          else
            echo "Keine SPFx Asset-Ausgabe gefunden."
            exit 1
          fi

          test "$(find artifact/UPLOAD_TO_SITEASSETS -type f | wc -l)" -gt 0

          cat > artifact/REIHENFOLGE.txt <<'TXT'
          DispoPilot V1.3 - L2 zentraler Stundenzettelversand + PDF - Paketrevision 1.3.5.30

          L2 - ZENTRALER VERSAND, AUCH FÜR GASTFAHRER:
          - Der Fahrer braucht KEIN eigenes Exchange-Postfach.
          - "Stundenzettel senden" erzeugt zuerst eine echte PDF-Datei.
          - Danach wird ein neuer Datensatz in der vorhandenen SharePoint-Liste
            DP_Data angelegt:
              DP_Typ = mailQueue
              DP_Daten = Empfänger, Betreff, Mailtext und PDF-Anhang als Base64.
          - Ein zentraler Power-Automate-Flow muss einmalig eingerichtet werden.
          - Dieser Flow sendet aus dem lizenzierten Microsoft-365-Büropostfach.
          - Gastfahrer wie jatara@gmx.de können dadurch den Versand auslösen,
            ohne selbst ein Microsoft-365-Mailpostfach zu besitzen.
          - Die App meldet korrekt "zum Versand übergeben" und nicht fälschlich
            "versendet", bevor Power Automate die Mail tatsächlich verarbeitet hat.

          PDF:
          - "Drucken / als PDF speichern" wird zu "PDF herunterladen".
          - Die PDF wird direkt durch DispoPilot erzeugt; kein Android-/Browser-
            Druckdialog ist mehr erforderlich.
          - Ausgabe A4 Querformat, mit LoraCon-Struktur und Wochen-Tabelle.
          - Dieselbe PDF wird als E-Mail-Anhang in die Versandwarteschlange gelegt.

          MICROSOFT GRAPH:
          - L2 verwendet NICHT mehr /me/sendMail.
          - Das Paket fordert deshalb Mail.Send nicht mehr an.
          - Die bereits zuvor genehmigte Mail.Send-Berechtigung kann zunächst
            bestehen bleiben; sie wird von L2 nicht verwendet.

          POWER-AUTOMATE-EINRICHTUNG (einmalig, nach Deployment):
          1. Automatisierten Cloud-Flow erstellen.
          2. Trigger SharePoint: "Wenn ein Element erstellt wird" auf Site DispoPilot,
             Liste DP_Data.
          3. Nur weiter, wenn DP_Typ gleich "mailQueue" ist.
          4. DP_Daten als JSON auswerten.
          5. Outlook "E-Mail senden (V2)" mit to, subject, bodyHtml verwenden.
             Anhangname = attachmentName,
             Anhanginhalt = attachmentBase64.
          - Diesen Flow richten wir nach erfolgreicher Installation gemeinsam ein.

          STUNDENZETTEL-VORLAGE:
          - Der aktuelle LoraCon-Aufbau bleibt maßgeblich:
            Arbeitgeber, Arbeitnehmer, Monat/Jahr, Kalendertag, Beginn, Ende,
            Ruhepause, Dauer minus Pause und Baustelle/Projektnummer.
          - Keine neue Fantasievorlage.

          Dieser Build enthält weiterhin vollständig den Stand 1.3.5.28
          mit Status-/Neuplanungs- und Lagerlogik.

          Dieser Build ersetzt den noch nicht benötigten Einzelstand 1.3.5.27
          und enthält dessen neue "Nicht ausgeführt / Neuplanung"-Logik vollständig.

          VERBINDLICHE AUFTRAGSSTATUS-LOGIK:
          - Geplant
          - In Arbeit
          - Ausgeführt
          - Nicht ausgeführt
          - "Teilweise ausgeführt" ist als Fahrerbutton vollständig entfernt.
          - Alte historische Datensätze mit diesem Status bleiben lesbar.
          - Keine zusätzlichen Zwischenstände während einer Fahrt.
          - Muldenbestand ändert sich erst bei erfolgreichem Abschluss "Ausgeführt".

          PRAXIS MEHRERE MULDEN:
          - Mehrere einzeln gefahrene Mulden = mehrere Aufträge.
          - Mehrere gemeinsam in einem Zug bewegte Mulden können ein Auftrag sein.
          - Deshalb braucht der Auftrag keinen Status "Teilweise ausgeführt".

          NICHT AUSGEFÜHRT:
          - Grund aus vorhandener Liste.
          - Freies Feld "Ergänzung / weiterer Grund".
          - Danach immer "Auftrag verschieben?" Ja / Nein.
          - Nein: endgültig Nicht ausgeführt.
          - Ja: Datum heute oder Zukunft, Status wieder Geplant.
          - Vergangenheit gesperrt.
          - Separater VERSCHIEBEN-Button bleibt entfernt.

          LAGER:
          - "Auf Lager" bleibt die Statusart einer Mulde.
          - Zusätzlich wird das konkrete Lager gespeichert.
          - Start-Stammdaten:
            Lager Vaihingen
            Lager Horrheim
          - In Einstellungen können Lager:
            ergänzt,
            umbenannt,
            aktiv/inaktiv gesetzt werden.
          - Keine Lagerbezeichnungen sind dauerhaft in der Bewegungslogik fest verdrahtet.

          LAGER BEI AUFTRAGSABSCHLUSS:
          - Abholen + Ausgeführt -> Ziel-Lager muss gewählt werden.
          - Tauschen + Ausgeführt -> Ziel-Lager für die abgeholte Mulde muss gewählt werden.
          - Erst beim Abschluss wird dieses Lager im Muldenbestand gespeichert.
          - Bewegungsverlauf enthält anschließend den konkreten Lagerstandort.
          - Bestehende alte Mulden mit "Auf Lager" ohne Lagerzuordnung bleiben erhalten
            und werden als "Lager nicht zugeordnet" kenntlich gemacht.

          MANUELLE MULDENSTAMMDATEN:
          - Bei Status "Auf Lager" wird ebenfalls ein konkreter Lagerstandort verlangt.

          TEST:
          1. Fahrer-Auftragsdetail:
             TEILWEISE und VERSCHIEBEN dürfen nicht mehr vorhanden sein.
          2. Nicht ausgeführt -> Grund + Freitext -> Nein testen.
          3. Nicht ausgeführt -> Ja -> heute/morgen testen.
          4. Abholen starten und Ausgeführt:
             Ziel-Lager muss gewählt werden.
          5. Mulde danach suchen:
             z. B. "Lager Vaihingen" statt nur "Auf Lager".
          6. Tauschen:
             abgeholte Mulde muss im gewählten Lager landen,
             gestellte Mulde beim Kunden.
          7. Einstellungen:
             neues Testlager anlegen, umbenennen, inaktiv setzen.
          8. Mulde manuell bearbeiten:
             bei "Auf Lager" Lagerauswahl prüfen.
          9. Aktualisieren, Fahrfolge, Popup und Baustellenadresse kurz gegenprüfen.

          HINWEIS:
          H3-Scrollkomfort bleibt vorläufig auf dem aktuellen Stand.
          Größere Bildschirm-/Scrolloptimierung wird sinnvollerweise mit der PWA fortgeführt.
          TXT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: L-ECHTER-STUNDENZETTELVERSAND-DISPOPILOT
          path: artifact/
          if-no-files-found: error
