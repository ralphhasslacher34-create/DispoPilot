      - name: Apply DLB-021B-1.8.0.1 Mulden Auftrag Typ Fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_DLB21'
          from pathlib import Path

          p=Path("dispopilot-online-efd.html")
          if not p.exists():
              raise SystemExit("DLB-021B: dispopilot-online-efd.html fehlt.")

          t=p.read_text(encoding="utf-8")
          marker="/* DP13_PATCH_END */"
          if t.count(marker)!=1:
              raise SystemExit(f"DLB-021B: DP13-Endmarker {t.count(marker)}x gefunden statt 1x.")

          required=[
              "DP_A3_FAHRERBESTAETIGUNG_BEGIN",
              "DP_A5_LEEREN_ABHOLEN_MULDENTYP_BEGIN",
              "DP_X13_1_MULDENNUMMER_TEXT_SCHUTZ_END"
          ]
          for item in required:
              if item not in t:
                  raise SystemExit("DLB-021B: erforderliche Mulden-Basis fehlt: "+item)

          if "DP_DLB_021B_1_8_0_1_MULDEN_AUFTRAG_TYP_FIX_BEGIN" in t:
              raise SystemExit("DLB-021B: Patch bereits vorhanden.")

          patch=r"""
          /* DP_DLB_021B_1_8_0_1_MULDEN_AUFTRAG_TYP_FIX_BEGIN */
          /*
            Bugfix Mulden-Auftrag:
            - Muldennummer und Muldentyp werden im Abschlussdialog strikt getrennt.
            - Ein irrtuemlich mit der Muldennummer belegtes type-Feld wird nicht mehr
              als Muldentyp angezeigt.
            - Bei bestehenden Mulden hat der Stammdatentyp Vorrang; ist dieser
              erkennbar unbrauchbar, wird der im Auftrag gespeicherte Typ verwendet.
            - Der Muldenstamm wird durch diesen Anzeige-/Auftragsfix nicht veraendert.
          */
          function dp21Txt(v){return String(v??'').trim();}
          function dp21BinNo(b){
            if(!b)return '';
            if(typeof dpX1BinNumber==='function'){
              const n=dp21Txt(dpX1BinNumber(b));
              if(n)return n;
            }
            return dp21Txt(b.number??b.binNumber??b.no??'');
          }
          function dp21UsefulType(value,number){
            const v=dp21Txt(value),n=dp21Txt(number);
            if(!v)return '';
            if(n&&v===n)return '';
            return v;
          }
          function dp21TypeFromBin(b,fallback=''){
            const no=dp21BinNo(b);
            const candidates=[b?.binType,b?.muldenType,b?.containerType,b?.type];
            for(const value of candidates){
              const typ=dp21UsefulType(value,no);
              if(typ)return typ;
            }
            return dp21UsefulType(fallback,no);
          }
          function dp21TypeForOrderPosition(o,index,number,role='main'){
            const no=dp21Txt(number);
            const b=no?binByNumber(no):null;
            const fallback=(role==='main'&&typeof orderBinType==='function')
              ?dp21Txt(orderBinType(o,index))
              :'';
            return dp21TypeFromBin(b,fallback)||'Typ unbekannt';
          }

          // Auswahl vorhandener Mulden: Anzeige immer Nummer + sauber aufgeloester Typ.
          dpA3LocationBins=function(o,selected=''){
            const rows=[];
            const seen=new Set();
            const add=(b,forcedNo='')=>{
              if(!b&&!forcedNo)return;
              const number=dp21Txt(forcedNo||dp21BinNo(b));
              if(!number||seen.has(number))return;
              const type=dp21TypeFromBin(b,'');
              rows.push({number,type});
              seen.add(number);
            };
            if(selected)add(binByNumber(selected),selected);
            (state.bins||[])
              .filter(b=>{
                if(b.status!=='Beim Kunden')return false;
                if(o?.siteId&&b.siteId==o.siteId)return true;
                return !o?.siteId&&o?.customerId&&b.customerId==o.customerId;
              })
              .slice()
              .sort((a,b)=>dp21BinNo(a).localeCompare(dp21BinNo(b),'de',{numeric:true}))
              .forEach(b=>add(b));
            return rows;
          };

          dpA3ExistingSelect=function(o,i,selected='',role='main'){
            const options=dpA3LocationBins(o,selected)
              .map(b=>'<option value="'+esc(b.number)+'" '+(dp21Txt(b.number)===dp21Txt(selected)?'selected':'')+'>'+esc(b.number)+(b.type?' · '+esc(b.type):'')+'</option>')
              .join('');
            return '<select id="dpA3_'+role+'_'+i+'" onchange="dpA3ExistingChanged('+i+',\''+role+'\')">'
              +'<option value="">— bitte wählen —</option>'
              +options
              +'<option value="__manual__">Nummer manuell eingeben …</option>'
              +'</select>'
              +'<input id="dpA3_'+role+'Manual_'+i+'" class="hidden" style="margin-top:6px" inputmode="text" placeholder="Muldennummer manuell" oninput="dpA3RefreshType('+i+',\''+role+'\')">';
          };

          dpA3RefreshType=function(i,role='main'){
            const target=$('dpA3_'+role+'Type_'+i);
            if(!target)return;
            const o=orderById(currentOrderId);
            const number=dpA3Value(i,role);
            target.textContent=dp21TypeForOrderPosition(o,i-1,number,role);
          };

          // Auch im Planungsdialog fuer Leeren/Abholen keine Nummer als Typ uebernehmen.
          function dp21PlanningType(i,number){
            const no=dp21Txt(number);
            const selected=dp21Txt($('oBinType'+i)?.value||'');
            const master=dp21TypeFromBin(no?binByNumber(no):null,selected);
            return master||selected;
          }
          const dp21BaseA5ExistingChanged=dpA5ExistingChanged;
          dpA5ExistingChanged=function(i){
            const r=dp21BaseA5ExistingChanged.apply(this,arguments);
            if(['Leeren','Abholen'].includes(dpA2Task())){
              const no=dp21Txt($('oBinNumber'+i)?.value||'');
              const typ=dp21PlanningType(i,no);
              const sel=$('oBinType'+i);
              if(sel&&typ&&Array.from(sel.options).some(o=>dp21Txt(o.value)===typ))sel.value=typ;
            }
            return r;
          };
          dpABCollectTypes=function(){
            const nums=dpABCollectNumbers();
            const out=[];
            for(let i=1;i<=nums.length;i++){
              const no=dp21Txt(nums[i-1]);
              if(['Leeren','Abholen'].includes(dpA2Task())){
                out.push(dp21PlanningType(i,no));
              }else if(dpA2ExistingOnly()){
                out.push(dp21TypeFromBin(no?binByNumber(no):null,''));
              }else{
                out.push(dp21Txt($('oBinType'+i)?.value||''));
              }
            }
            return out;
          };

          // Nach jedem Rendern den sichtbaren Typ aus der tatsaechlich gewaehlten
          // Mulde neu bestimmen. Damit greift der Fix auch bei vorbefuellten Auftraegen.
          const dp21BaseA3RenderConfirm=dpA3RenderConfirm;
          dpA3RenderConfirm=function(o,status){
            const r=dp21BaseA3RenderConfirm.apply(this,arguments);
            if(status==='Ausgeführt'&&dpA3BinTask(o)){
              const n=dpA3Count(o);
              for(let i=1;i<=n;i++){
                if(dpA3ExistingTask(o))dpA3RefreshType(i,'main');
                if(o?.task==='Tauschen')dpA3RefreshType(i,'old');
              }
            }
            return r;
          };
          /* DP_DLB_021B_1_8_0_1_MULDEN_AUFTRAG_TYP_FIX_END */
          """

          t=t.replace(marker,patch+"\n"+marker,1)
          p.write_text(t,encoding="utf-8",newline="\n")
          print("DLB-021B-1.8.0.1: Muldennummer/Muldentyp im Auftrag und Abschluss getrennt.")
          PY_DLB21

          grep -Fq "DP_DLB_021B_1_8_0_1_MULDEN_AUFTRAG_TYP_FIX_BEGIN" dispopilot-online-efd.html
          grep -Fq "function dp21TypeFromBin" dispopilot-online-efd.html
          grep -Fq "dpA3RefreshType=function" dispopilot-online-efd.html
          grep -Fq "dpABCollectTypes=function" dispopilot-online-efd.html

      # Buildweg unverändert aus der zuletzt funktionierenden Version übernommen.
      - name: Install SPFx CLI
        run: npm install -g @microsoft/spfx-cli@latest

      - name: Scaffold SPFx web part
        run: |
          rm -rf spfx-build
          spfx create \
            --template webpart-noframework \
            --library-name dispopilot-online-v13 \
            --component-name "DispoPilot Online" \
            --component-alias DispoPilotOnline \
            --component-description "DispoPilot Online V1.3" \
            --solution-name dispopilot-online-v13 \
            --target-dir spfx-build \
            --package-manager npm

