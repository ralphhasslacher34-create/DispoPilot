      - name: Apply DLB-030I-1.12.1.2 Multiuser Auftragssync + Cache Fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_030I'
          from pathlib import Path
          import re
          p=Path('dispopilot-online-efd.html'); t=p.read_text(encoding='utf-8')
          if 'DP_DLB_029A_1_11_2_0_PDF_UPLOAD_OPEN_FIX_BEGIN' not in t: raise SystemExit('030I: 029A-Basis fehlt.')
          m='DP_DLB_030I_1_12_1_2_MULTIUSER_SYNC_CACHE'
          if m in t: raise SystemExit('030I: Patch bereits vorhanden.')
          sp=re.compile(r'^(?P<i>[ \t]*)async\s+save\s*\(\s*(?P<s>[A-Za-z_$][A-Za-z0-9_$]*)\s*\)\s*\{',re.M)
          sm=sp.search(t)
          if not sm or sp.search(t,sm.end()): raise SystemExit('030I: save() nicht eindeutig.')
          i,s=sm.group('i'),sm.group('s')
          lm=re.compile(r'^'+re.escape(i)+r'async\s+load\s*\(\s*\)\s*\{',re.M).search(t,sm.end())
          if not lm: raise SystemExit('030I: load() nach save() fehlt.')
          body=f'''{i}async save({s}){{\n{i}  /* {m}_BEGIN */\n{i}  const d=this.desiredRecords({s}),r=new Map(this.remote);\n{i}  for(const [k,v] of d){{const x=r.get(k);if(x){{if(x.type!==v.type||x.raw!==v.raw)await this.update(x,v)}}else{{try{{await this.create(v)}}catch(e){{const q=String(e&&e.message||e||'');if(!(Number(e&&e.status||0)===409||/SPDuplicateValuesFoundException|duplicate|bereits vorhanden/i.test(q)))throw e;await this.loadItems();const y=this.remote.get(k);if(!y)throw e;if(y.type!==v.type||y.raw!==v.raw)await this.update(y,v)}}}}}}\n{i}  const z=new Set(({s}.archiveOrders||[]).filter(x=>x&&x.deletedInPlanning&&x.id!=null).map(x=>String(x.id)));\n{i}  for(const id of z){{const k='DP|orders|'+this.keySafe(id),x=this.remote.get(k)||r.get(k);if(x)await this.remove(x)}}\n{i}  /* {m}_END */\n{i}}},\n'''
          t=t[:sm.start()]+body+t[lm.start():]
          li=re.compile(r'^(?P<i>[ \t]*)async\s+loadItems\s*\(\s*\)\s*\{',re.M).search(t)
          if not li: raise SystemExit('030I: loadItems() fehlt.')
          ks=re.compile(r'^'+re.escape(li.group('i'))+r'keySafe\s*(?::|=|\()',re.M).search(t,li.end())
          if not ks: raise SystemExit('030I: Ende loadItems() fehlt.')
          chunk=t[li.start():ks.start()]
          rp=re.compile(r"this\.request\(\s*(?P<u>[A-Za-z_$][A-Za-z0-9_$]*)\s*,\s*\{\s*headers\s*:\s*\{\s*['\"]?Accept['\"]?\s*:\s*['\"]application/json;odata=nometadata['\"]\s*\}\s*\}\s*\)")
          hits=list(rp.finditer(chunk))
          if len(hits)!=1: raise SystemExit(f'030I: loadItems GET {len(hits)}x statt 1x.')
          chunk=rp.sub(lambda m:f"this.request({m.group('u')},{{headers:{{'Accept':'application/json;odata=nometadata','Cache-Control':'no-cache, no-store, max-age=0','Pragma':'no-cache','Expires':'0'}},cache:'no-store'}})",chunk,1)
          t=t[:li.start()]+chunk+t[ks.start():]
          p.write_text(t,encoding='utf-8',newline='\n')
          PY_030I
          grep -Fq 'DP_DLB_030I_1_12_1_2_MULTIUSER_SYNC_CACHE_BEGIN' dispopilot-online-efd.html
          grep -Fq "Cache-Control':'no-cache, no-store, max-age=0" dispopilot-online-efd.html

