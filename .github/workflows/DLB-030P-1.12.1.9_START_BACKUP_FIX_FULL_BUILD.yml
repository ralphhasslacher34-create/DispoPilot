      - name: Apply DLB-027F-1.11.1.5 ResourcePath Upload Fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_DLB27F'
          from pathlib import Path
          p=Path('dispopilot-online-efd.html')
          if not p.exists():
              raise SystemExit('DLB-027F: dispopilot-online-efd.html fehlt.')
          t=p.read_text(encoding='utf-8')
          required=[
              'DP_DLB_027E_1_11_1_4_AUFTRAGSDOKUMENTE_UPLOAD_FIX_BEGIN',
              "GetFolderByServerRelativePath(decodedUrl='",
              'DispoLux_Auftragsdokumente'
          ]
          for item in required:
              if item not in t:
                  raise SystemExit('DLB-027F: erforderliche Basis fehlt: '+item)
          if 'DP_DLB_027F_1_11_1_5_RESOURCEPATH_UPLOAD_FIX_BEGIN' in t:
              raise SystemExit('DLB-027F: Patch bereits vorhanden.')

          old_comment="// POST .../GetFolderByServerRelativeUrl(...)/Files/add(...), Binärdaten im Body."
          new_comment="// ResourcePath durchgängig: bestätigten Ordner auch beim Binär-Upload nicht mehr auf die alte URL-API zurückkonvertieren."
          old_url='const uploadUrl=w+"/_api/web/GetFolderByServerRelativeUrl(\'"+odata(confirmed)+"\')/Files/add(url=\'"+odata(name)+"\',overwrite=false)";'
          new_url='const uploadUrl=w+"/_api/web/GetFolderByServerRelativePath(decodedUrl=\'"+odata(confirmed)+"\')/Files/AddUsingPath(decodedUrl=\'"+odata(name)+"\',overwrite=false)";'
          old_error="Uploadstufe: Files/add"
          new_error="Uploadstufe: ResourcePath Files/AddUsingPath"

          if t.count(old_url)!=1:
              raise SystemExit(f'DLB-027F: alte Upload-URL {t.count(old_url)}x gefunden statt 1x.')
          t=t.replace(old_comment,new_comment,1)
          t=t.replace(old_url,new_url,1)
          t=t.replace(old_error,new_error,1)

          marker='/* DP13_PATCH_END */'
          if t.count(marker)!=1:
              raise SystemExit(f'DLB-027F: DP13-Endmarker {t.count(marker)}x gefunden statt 1x.')
          note=(
              '/* DP_DLB_027F_1_11_1_5_RESOURCEPATH_UPLOAD_FIX_BEGIN */\n'
              '/*\n'
              '  - 027D/027E konnten den Zielordner bereits erfolgreich per ResourcePath bestätigen.\n'
              '  - 027E wechselte beim Datei-POST fälschlich zurück auf GetFolderByServerRelativeUrl/Files.add.\n'
              '  - 027F verwendet für den Binär-Upload denselben bestätigten ResourcePath.\n'
              '  - GetFolderByServerRelativePath(...)/Files/AddUsingPath(...).\n'
