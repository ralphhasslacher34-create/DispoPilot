      - name: Apply DLB-022B-1.5.1.10 Mitarbeiter Einladung Fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_DLB22B'
          from pathlib import Path
          import re
          
          p=Path("dispopilot-online-efd.html")
          if not p.exists():
              raise SystemExit("DLB-022B: dispopilot-online-efd.html fehlt.")
          
          t=p.read_text(encoding="utf-8")
          marker="/* DP13_PATCH_END */"
          if t.count(marker)!=1:
              raise SystemExit(f"DLB-022B: DP13-Endmarker {t.count(marker)}x gefunden statt 1x.")
          
          for required in [
              "DP_DLB_020A_1_5_1_0_MITARBEITERVERWALTUNG_BEGIN",
              "DP_DLB_020D_1_5_1_3_MITARBEITERLISTE_DIREKTFIX_BEGIN",
              "DP_DLB_021B_1_8_0_1_MULDEN_AUFTRAG_TYP_FIX_BEGIN"
          ]:
              if required not in t:
                  raise SystemExit("DLB-022B: erforderliche Basis fehlt: "+required)
          
          pat=re.compile(
              r"  async function ensureOrInvite\(name,email\)\{.*?\n  \}\n\n  async function createListItem",
              re.S
          )
          if not pat.search(t):
              raise SystemExit("DLB-022B: ensureOrInvite-Funktion nicht gefunden.")
          
          replacement="""  async function ensureOrInvite(name,email){
              // Einladung immer auslösen; ensureUser allein verschickt keine E-Mail.
              await shareSite(name,email,true);
              let last=null;
              for(let i=0;i<7;i++){
                try{return await ensureUser(email);}catch(e){last=e;}
                await new Promise(r=>setTimeout(r,500+i*350));
              }
              throw last||new Error('Microsoft-Benutzer konnte nach der Einladung nicht aufgelöst werden.');
            }
          
            window.dp151SendEmployeeInvite=async function(name,email){
              return shareSite(name,email,true);
            };
          
            async function createListItem"""
          
          t=pat.sub(replacement,t,count=1)
          
          t=t.replace("status('Microsoft-Konto wird geprüft und bei Bedarf eingeladen …');","status('Einladung wird gesendet und Microsoft-Konto wird geprüft …');",1)
          t=t.replace("status(name+' wurde angelegt und für DispoLux freigeschaltet.');","status(name+' wurde angelegt; die Einladung wurde ausgelöst.');",1)
          
          toggle_html="""          <button class=\"btn ${active?'danger':'secondary'}\" type=\"button\" data-dp20d-toggle>${active?'Deaktivieren':'Aktivieren'}</button>"""
          if toggle_html not in t:
              raise SystemExit("DLB-022B: Aktivieren/Deaktivieren-Button nicht gefunden.")
          
          t=t.replace(toggle_html,toggle_html+"\n          <button class=\"btn secondary\" type=\"button\" data-dp22-invite style=\"margin-left:6px\">Einladung senden</button>",1)
          
          toggle_listener="""      tr.querySelector('[data-dp20d-toggle]')?.addEventListener('click',()=>dp20dToggle(row));"""
          if toggle_listener not in t:
              raise SystemExit("DLB-022B: Toggle-Listener nicht gefunden.")
          
          invite_listener="""      tr.querySelector('[data-dp20d-toggle]')?.addEventListener('click',()=>dp20dToggle(row));
                tr.querySelector('[data-dp22-invite]')?.addEventListener('click',async()=>{
                  if(dp20dBusy)return;
                  const person=row?.Benutzer||{};
                  const name=dp20dTxt(person.Title||row?.Title||row?.Fahrername||'Mitarbeiter');
                  const email=dp20dTxt(person.EMail||'');
                  if(!email)return dp20dStatus('Keine E-Mail-Adresse vorhanden.',true);
                  dp20dBusy=true;
                  dp20dStatus('Einladung an '+email+' wird gesendet …');
                  try{
                    if(typeof window.dp151SendEmployeeInvite!=='function')throw new Error('Einladungsfunktion ist nicht verfügbar.');
                    await window.dp151SendEmployeeInvite(name,email);
                    dp20dStatus('Einladung an '+email+' wurde ausgelöst.');
                  }catch(e){
                    console.error('DLB-022B Einladung',e);
                    dp20dStatus('Einladung fehlgeschlagen: '+e.message,true);
                  }finally{
                    dp20dBusy=false;
                  }
                });"""
          
          t=t.replace(toggle_listener,invite_listener,1)
          
          patch_marker="""/* DP_DLB_022B_1_5_1_10_MITARBEITER_EINLADUNG_FIX_BEGIN */
          /* Einladung beim Neuanlegen immer auslösen; erneuter Versand aus Mitarbeiterliste. */
          /* DP_DLB_022B_1_5_1_10_MITARBEITER_EINLADUNG_FIX_END */
          """
          t=t.replace(marker,patch_marker+"\n"+marker,1)
          
          p.write_text(t,encoding="utf-8",newline="\n")
          print("DLB-022B-1.5.1.10: Mitarbeiter-Einladung robust gepatcht.")
          PY_DLB22B

          grep -Fq "DP_DLB_022B_1_5_1_10_MITARBEITER_EINLADUNG_FIX_BEGIN" dispopilot-online-efd.html
          grep -Fq "await shareSite(name,email,true);" dispopilot-online-efd.html
          grep -Fq "data-dp22-invite" dispopilot-online-efd.html
          grep -Fq "dp151SendEmployeeInvite" dispopilot-online-efd.html

