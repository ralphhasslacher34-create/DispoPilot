      - name: Apply DLB-022M-1.5.1.21 Zugangslink + Anzeigename fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_DLB22M'
          from pathlib import Path

          p=Path("dispopilot-online-efd.html")
          if not p.exists():
              raise SystemExit("DLB-022M: dispopilot-online-efd.html fehlt.")

          t=p.read_text(encoding="utf-8")
          marker="/* DP13_PATCH_END */"
          if "DP_DLB_022L_1_5_1_20_SHAREPOINT_EXTERN_ROBUST_FIX_BEGIN" not in t:
              raise SystemExit("DLB-022M: 022L-Basis fehlt.")
          if "DP_DLB_022M_1_5_1_21_ZUGANGSLINK_NAME_FIX_BEGIN" in t:
              raise SystemExit("DLB-022M: Patch bereits vorhanden.")

          old_link="""const personalLink=String(result?.invitationLink||result?.sharePoint?.invitationLink||result?.inviteRedeemUrl||'').trim();
            const fallbackLink=String(window.location.href||'').split('#')[0];
            const link=personalLink||fallbackLink;"""
          new_link="""const personalLink=String(result?.invitationLink||result?.sharePoint?.invitationLink||result?.inviteRedeemUrl||'').trim();
            let fallbackLink='';
            try{
              const ref=String(document.referrer||'').trim();
              if(/^https?:\\/\\//i.test(ref))fallbackLink=ref.split('#')[0];
            }catch(_){ }
            if(!fallbackLink){
              try{
                if(typeof webUrl==='function')fallbackLink=String(webUrl()||'').trim();
              }catch(_){ }
            }
            const link=personalLink||fallbackLink;"""
          if old_link not in t:
              raise SystemExit("DLB-022M: 022L-Linkfallback nicht gefunden.")
          t=t.replace(old_link,new_link,1)

          old_name="const name=dp20dTxt(row?.Fahrername||row?.Title||person.Title||'Mitarbeiter');"
          new_name="const name=dp20dTxt(row?.Fahrername||person.Title||row?.Title||'Mitarbeiter');"
          if old_name not in t:
              raise SystemExit("DLB-022M: Namensauswahl fuer vorhandenen Mitarbeiter nicht gefunden.")
          t=t.replace(old_name,new_name,1)

          patch_marker="""/* DP_DLB_022M_1_5_1_21_ZUGANGSLINK_NAME_FIX_BEGIN */
          /*
            - about:srcdoc darf niemals als Zugangslink ausgegeben werden.
            - Fallback: zuerst echte SharePoint-Elternseite via document.referrer, danach webUrl().
            - Vorhandene Mitarbeiter: Fahrername, sonst Microsoft/SharePoint-Anzeigename, erst danach DP_Users-Titel.
          */
          /* DP_DLB_022M_1_5_1_21_ZUGANGSLINK_NAME_FIX_END */
          """
          if t.count(marker)!=1:
              raise SystemExit(f"DLB-022M: DP13-Endmarker {t.count(marker)}x gefunden statt 1x.")
          t=t.replace(marker,patch_marker+"\n"+marker,1)

          p.write_text(t,encoding="utf-8",newline="\n")
          print("DLB-022M-1.5.1.21: echter SharePoint-Zugangslink und korrekter Anzeigename eingebaut.")
          PY_DLB22M

          grep -Fq "DP_DLB_022M_1_5_1_21_ZUGANGSLINK_NAME_FIX_BEGIN" dispopilot-online-efd.html
          grep -Fq "document.referrer" dispopilot-online-efd.html
          grep -Fq "row?.Fahrername||person.Title||row?.Title" dispopilot-online-efd.html
          if grep -Fq "const fallbackLink=String(window.location.href||'').split('#')[0];" dispopilot-online-efd.html; then
            echo "Fehler: DLB-022M enthaelt noch den about:srcdoc-Fallback." >&2
            exit 1
          fi

      - name: Apply DLB-022N-1.5.1.22 Linkfallback + Status fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_DLB22N'
          from pathlib import Path

          p=Path("dispopilot-online-efd.html")
          if not p.exists():
              raise SystemExit("DLB-022N: dispopilot-online-efd.html fehlt.")

          t=p.read_text(encoding="utf-8")
          marker="/* DP13_PATCH_END */"
          if "DP_DLB_022M_1_5_1_21_ZUGANGSLINK_NAME_FIX_BEGIN" not in t:
              raise SystemExit("DLB-022N: 022M-Basis fehlt.")
          if "DP_DLB_022N_1_5_1_22_LINKFALLBACK_STATUS_FIX_BEGIN" in t:
              raise SystemExit("DLB-022N: Patch bereits vorhanden.")

          old_link="""const personalLink=String(result?.invitationLink||result?.sharePoint?.invitationLink||result?.inviteRedeemUrl||'').trim();
            let fallbackLink='';
            try{
              const ref=String(document.referrer||'').trim();
              if(/^https?:\\/\\//i.test(ref))fallbackLink=ref.split('#')[0];
            }catch(_){ }
            if(!fallbackLink){
              try{
                if(typeof webUrl==='function')fallbackLink=String(webUrl()||'').trim();
              }catch(_){ }
            }
            const link=personalLink||fallbackLink;"""
          new_link="""const personalLink=String(result?.invitationLink||result?.sharePoint?.invitationLink||result?.inviteRedeemUrl||'').trim();
            let fallbackLink='';
            const candidates=[];
            try{ candidates.push(String(document.baseURI||'')); }catch(_){ }
            try{ candidates.push(String(document.referrer||'')); }catch(_){ }
            try{
              if(window.parent&&window.parent!==window)candidates.push(String(window.parent.location.href||''));
            }catch(_){ }
            for(const candidate of candidates){
              const c=String(candidate||'').trim().split('#')[0];
              if(/^https:\\/\\/[^/]+\\.sharepoint\\.com\\//i.test(c)){
                fallbackLink=c;
                break;
              }
            }
            const link=personalLink||fallbackLink;"""
          if old_link not in t:
              raise SystemExit("DLB-022N: 022M-Linkblock nicht gefunden.")
          t=t.replace(old_link,new_link,1)

          old_missing="""if(!link){
              dp20dStatus?.('Zugang wurde vorbereitet, aber es konnte kein Zugangslink ermittelt werden.',true);
              return;
            }"""
          new_missing="""if(!link){
              console.warn('DLB-022N: Zugang wurde vorbereitet, aber es konnte kein echter SharePoint-Zugangslink ermittelt werden.');
              return;
            }"""
          if old_missing not in t:
              raise SystemExit("DLB-022N: unsicherer dp20dStatus-Fallback nicht gefunden.")
          t=t.replace(old_missing,new_missing,1)

          patch_marker="""/* DP_DLB_022N_1_5_1_22_LINKFALLBACK_STATUS_FIX_BEGIN */
          /*
            - Regression aus 022M behoben: kein Aufruf einer nicht sichtbaren dp20dStatus-Funktion.
            - Echter SharePoint-Seitenlink wird im srcdoc-Iframe zuerst aus document.baseURI ermittelt.
            - Danach document.referrer und, falls erlaubt, die Parent-URL.
            - about:srcdoc wird weiterhin niemals als Zugangslink ausgegeben.
          */
          /* DP_DLB_022N_1_5_1_22_LINKFALLBACK_STATUS_FIX_END */
          """
          if t.count(marker)!=1:
              raise SystemExit(f"DLB-022N: DP13-Endmarker {t.count(marker)}x gefunden statt 1x.")
          t=t.replace(marker,patch_marker+"\n"+marker,1)

          if "dp20dStatus?.('Zugang wurde vorbereitet, aber es konnte kein Zugangslink ermittelt werden.'" in t:
              raise SystemExit("DLB-022N: alter fehlerhafter dp20dStatus-Aufruf noch vorhanden.")
          if "document.baseURI" not in t:
              raise SystemExit("DLB-022N: document.baseURI-Fallback fehlt.")

          p.write_text(t,encoding="utf-8",newline="\n")
          print("DLB-022N-1.5.1.22: Linkfallback und Status-Regression behoben.")
          PY_DLB22N

          grep -Fq "DP_DLB_022N_1_5_1_22_LINKFALLBACK_STATUS_FIX_BEGIN" dispopilot-online-efd.html
          grep -Fq "document.baseURI" dispopilot-online-efd.html
          if grep -Fq "dp20dStatus?.('Zugang wurde vorbereitet, aber es konnte kein Zugangslink ermittelt werden.'" dispopilot-online-efd.html; then
            echo "Fehler: DLB-022N enthält noch den undefinierten dp20dStatus-Fallback." >&2
            exit 1
          fi

      - name: Apply DLB-022O-1.5.1.23 Mailformat + Codehinweis
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_DLB22O'
          from pathlib import Path

          p=Path("dispopilot-online-efd.html")
          if not p.exists():
              raise SystemExit("DLB-022O: dispopilot-online-efd.html fehlt.")

          t=p.read_text(encoding="utf-8")
          marker="/* DP13_PATCH_END */"
          if "DP_DLB_022N_1_5_1_22_LINKFALLBACK_STATUS_FIX_BEGIN" not in t:
              raise SystemExit("DLB-022O: 022N-Basis fehlt.")
          if "DP_DLB_022O_1_5_1_23_MAILFORMAT_CODEHINWEIS_BEGIN" in t:
              raise SystemExit("DLB-022O: Patch bereits vorhanden.")

          old_hint="'Bei der ersten Anmeldung führt Microsoft dich gegebenenfalls durch eine kurze Bestätigung. Anschließend kannst du DispoLux verwenden.',"
          new_hint="""'Bei der ersten Anmeldung kann Microsoft dir zur Bestätigung einen Sicherheitscode an diese E-Mail-Adresse senden.',
              'Öffne die Microsoft-Mail, gib den Code bei der Anmeldung ein und setze die Anmeldung fort. Anschließend kannst du DispoLux verwenden.',"""
          if old_hint not in t:
              raise SystemExit("DLB-022O: alter Anmeldehinweis nicht gefunden.")
          t=t.replace(old_hint,new_hint,1)

          old_mail="a.href='mailto:'+encodeURIComponent(String(email||''))+'?subject='+encodeURIComponent('Dein Zugang zu DispoLux')+'&body='+encodeURIComponent(text);"
          new_mail="""const mailBody=String(text||'').replace(/\\r?\\n/g,'\\r\\n');
              a.href='mailto:'+encodeURIComponent(String(email||''))+'?subject='+encodeURIComponent('Dein Zugang zu DispoLux')+'&body='+encodeURIComponent(mailBody);"""
          if old_mail not in t:
              raise SystemExit("DLB-022O: mailto-Aufbau nicht gefunden.")
          t=t.replace(old_mail,new_mail,1)

          patch_marker="""/* DP_DLB_022O_1_5_1_23_MAILFORMAT_CODEHINWEIS_BEGIN */
          /*
            - Vorbereitete E-Mail verwendet CRLF-Zeilenumbrüche für bessere Mail-App-Kompatibilität.
            - Einladung weist kurz auf einen möglichen Microsoft-Sicherheitscode per E-Mail hin.
            - SharePoint-Zugang, Linkermittlung und Berechtigungslogik aus 022N bleiben unverändert.
          */
          /* DP_DLB_022O_1_5_1_23_MAILFORMAT_CODEHINWEIS_END */
          """
          if t.count(marker)!=1:
              raise SystemExit(f"DLB-022O: DP13-Endmarker {t.count(marker)}x gefunden statt 1x.")
          t=t.replace(marker,patch_marker+"\n"+marker,1)

          p.write_text(t,encoding="utf-8",newline="\n")
          print("DLB-022O-1.5.1.23: Mailformat und Microsoft-Codehinweis eingebaut.")
          PY_DLB22O

          grep -Fq "DP_DLB_022O_1_5_1_23_MAILFORMAT_CODEHINWEIS_BEGIN" dispopilot-online-efd.html
          grep -Fq "Sicherheitscode an diese E-Mail-Adresse" dispopilot-online-efd.html
          grep -Fq "const mailBody=String(text||'').replace" dispopilot-online-efd.html

