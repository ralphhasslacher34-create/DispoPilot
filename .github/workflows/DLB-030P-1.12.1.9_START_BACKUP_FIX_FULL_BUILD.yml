          cfgs=list(Path('spfx-build/config').glob('package-solution.json'))
          if len(cfgs)!=1:
              raise SystemExit(f'DLB-029A: package-solution.json {len(cfgs)}x gefunden.')
          cfg=cfgs[0]
          c=cfg.read_text(encoding='utf-8')
          if '1.3.6.61' not in c:
              raise SystemExit('DLB-029A: 028D-Basisversion 1.3.6.61 nicht gefunden.')
          c=c.replace('1.3.6.61','1.3.6.62',1)
          cfg.write_text(c,encoding='utf-8',newline='\n')
          PY_DLB29A_VERSION

          grep -Fq '1.3.6.62' spfx-build/config/package-solution.json
          grep -R -q 'DP_DLB_028D_1_12_1_0_DATENSICHERUNG_DATENINTEGRITAET_BEGIN' spfx-build/src/webparts

          (cd spfx-build && npx heft build --production)
          (cd spfx-build && npx heft package-solution --production)

          rm -rf artifact/UPLOAD_TO_SITEASSETS artifact/UPLOAD_TO_APP_CATALOG
          mkdir -p artifact/UPLOAD_TO_SITEASSETS artifact/UPLOAD_TO_APP_CATALOG
          PKG=$(find spfx-build/sharepoint/solution -maxdepth 1 -type f -name '*.sppkg' | head -n 1)
          test -n "$PKG"
          cp "$PKG" artifact/UPLOAD_TO_APP_CATALOG/DispoPilot_Online_V1.3_SPFX_FINAL.sppkg
          if [ -d "spfx-build/release/assets" ]; then
            cp -a spfx-build/release/assets/. artifact/UPLOAD_TO_SITEASSETS/
          elif [ -d "spfx-build/temp/deploy" ]; then
            cp -a spfx-build/temp/deploy/. artifact/UPLOAD_TO_SITEASSETS/
          else
            echo "Keine SPFx Asset-Ausgabe gefunden." >&2
            exit 1
          fi
          if [ -f .dpx14_icon_b64 ]; then
            python3 - <<'PY_ICON_029A'
          from pathlib import Path
          import base64
          b64=Path('.dpx14_icon_b64').read_text(encoding='ascii').strip()
          Path('artifact/UPLOAD_TO_SITEASSETS/DispoLux_DL_Icon_48.png').write_bytes(base64.b64decode(b64))
          PY_ICON_029A
          fi

      - name: Finalize DLB-030P start + backup fix full SPFx build
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_VER'
          from pathlib import Path
          p=Path('spfx-build/config/package-solution.json'); s=p.read_text(encoding='utf-8')
          if '1.3.6.62' not in s: raise SystemExit('030P: SPFx-Basis 1.3.6.62 fehlt.')
          p.write_text(s.replace('1.3.6.62','1.3.6.74',1),encoding='utf-8',newline='\n')
          PY_VER
          grep -R -q 'DP_DLB_030I_1_12_1_2_MULTIUSER_SYNC_CACHE_BEGIN' spfx-build/src/webparts
          grep -R -q 'DP_DLB_030I_1_12_1_2_AUTOSYNC_MERGE_GUARD_BEGIN' spfx-build/src/webparts
          grep -R -q 'DP_DLB_030J_1_12_1_3_ORDERS_DIREKT_SYNC_BEGIN' spfx-build/src/webparts
          grep -R -q 'dp030jLoadOrdersDirect' spfx-build/src/webparts
          grep -R -q "Cache-Control':'no-cache, no-store, max-age=0" spfx-build/src/webparts
          grep -R -q 'DP_DLB_030N_1_12_1_7_BACKUP_RECOVERY_BEGIN' spfx-build/src/webparts
          grep -Fq '1.3.6.74' spfx-build/config/package-solution.json
          (cd spfx-build && npx heft build --production)
          (cd spfx-build && npx heft package-solution --production)

          # DLB-030P: patch and verify the ACTUAL emitted browser bundle.
          # 1) Startup/auth may only begin after central state load completed.
          #    The old 15s watchdog could hide a successfully rendered app again.
          # 2) Backup/integrity must never mutate SharePoint Title uniqueness.
          # 3) Automatic backup starts delayed so it does not compete with cold start.
          python3 - <<'PY_030P_BROWSER'
          from pathlib import Path

          roots=[Path('spfx-build/release/assets'),Path('spfx-build/temp/deploy')]
          files=[]
          for root in roots:
              if root.exists():
                  files += list(root.glob('dispo-pilot-online-web-part_*.js'))
          if not files:
              raise SystemExit('030P: kein erzeugtes Browser-JS gefunden.')

          start_prefix='i.body.classList.add("dp-auth-pending"),async function(){if(await async function(){const e=Date.now()+15e3;for(;Date.now()<e;){if(void 0!==D&&D&&"function"==typeof mt)return!0;await new Promise(e=>p(e,60))}return!1}())try{'
          start_repl='i.body.classList.add("dp-auth-pending"),await te(),await pi(),async function(){try{'
          start_suffix='}else Fs("DispoPilot konnte nicht gestartet werden","Die Anwendung wurde nicht vollständig geladen. Bitte die Seite neu laden.")}(),await te(),await pi();'
          start_suffix_repl='}}();'

          schema_old='X(""),a.label=1;case 1:return a.trys.push([1,3,,4]),[4,$("".concat(Q(),"/_api/web/lists/getbytitle(\'").concat(Y(W),"\')/fields/getbyinternalnameortitle(\'Title\')"),{EnforceUniqueValues:!1},{"IF-MATCH":"*","X-HTTP-Method":"MERGE"})];case 2:return a.sent(),[3,4];case 3:return l=a.sent(),console.warn("DispoLux Title-Eindeutigkeit konnte nicht deaktiviert werden.",l),[3,4];case 4:return[2]}})})}'
          schema_new='X("");return[2]}})})}'

          backup_old='z.dpDispoLuxBackupNow=function(){return ie(!0)},ie(!1).catch(function(e){return console.error("DispoLux Datensicherung Start",e)}),Object.defineProperty(z,"__DISPOLUX_DATA_GUARD_028D_TIMER"'
          backup_new='z.dpDispoLuxBackupNow=function(){return ie(!0)},window.setTimeout(function(){ie(!1).catch(function(e){return console.error("DispoLux Datensicherung Start",e)})},3e4),Object.defineProperty(z,"__DISPOLUX_DATA_GUARD_028D_TIMER"'

          patched_start=patched_schema=patched_backup=0
          for p in files:
              t=p.read_text(encoding='utf-8')
              changed=False
              if start_prefix in t:
                  if start_suffix not in t:
                      raise SystemExit('030P: Start-Suffix fehlt in '+str(p))
                  t=t.replace(start_prefix,start_repl,1).replace(start_suffix,start_suffix_repl,1)
                  patched_start+=1; changed=True
              if schema_old in t:
                  t=t.replace(schema_old,schema_new,1)
                  patched_schema+=1; changed=True
              if backup_old in t:
                  t=t.replace(backup_old,backup_new,1)
                  patched_backup+=1; changed=True
              if changed:
                  p.write_text(t,encoding='utf-8',newline='\n')

          # release/assets and temp/deploy may contain the same current bundle.
          if patched_start < 1:
              raise SystemExit('030P: Start-Watchdog im erzeugten Bundle nicht gefunden.')
          if patched_schema < 1:
              raise SystemExit('030P: Title-Schema-Mutation im erzeugten Bundle nicht gefunden.')
          if patched_backup < 1:
              raise SystemExit('030P: Backup-Start im erzeugten Bundle nicht gefunden.')

          current=[]
          for p in files:
              t=p.read_text(encoding='utf-8')
              if 'DP_DLB_030J_1_12_1_3_ORDERS_DIREKT_SYNC_BEGIN' in t:
                  current.append((p,t))
          if not current:
              raise SystemExit('030P: aktuelles 030J/030N Bundle nicht identifiziert.')

          for p,t in current:
              if 'Date.now()+15e3' in t:
                  raise SystemExit('030P: 15s-Start-Watchdog noch aktiv: '+str(p))
              if 'Die Anwendung wurde nicht vollständig geladen. Bitte die Seite neu laden.' in t:
                  raise SystemExit('030P: alte generische Startabbruch-Seite noch aktiv: '+str(p))
              if 'EnforceUniqueValues:!1' in t or 'EnforceUniqueValues:!0' in t:
                  raise SystemExit('030P: Title-Eindeutigkeit wird noch automatisch verändert: '+str(p))
              if 'window.setTimeout(function(){ie(!1)' not in t:
                  raise SystemExit('030P: verzögerter Backup-Start fehlt: '+str(p))
              if "dp030jRefreshOrders('Start',true)" not in t:
                  raise SystemExit('030P: 030J Start-Orders-Sync fehlt: '+str(p))
              if "dp030jRefreshOrders('Auto-Sync',true)" not in t:
                  raise SystemExit('030P: 030J Auto-Sync fehlt: '+str(p))
          print('030P Browser-Prüfung OK:',len(current),'aktuelles Bundle geprüft.')
          PY_030P_BROWSER

          rm -rf artifact/UPLOAD_TO_SITEASSETS artifact/UPLOAD_TO_APP_CATALOG
          mkdir -p artifact/UPLOAD_TO_SITEASSETS artifact/UPLOAD_TO_APP_CATALOG
          PKG=$(find spfx-build/sharepoint/solution -maxdepth 1 -type f -name '*.sppkg' | head -n1); test -n "$PKG"
          cp "$PKG" artifact/UPLOAD_TO_APP_CATALOG/DispoPilot_Online_V1.3_SPFX_FINAL.sppkg
          if [ -d spfx-build/release/assets ]; then cp -a spfx-build/release/assets/. artifact/UPLOAD_TO_SITEASSETS/; else cp -a spfx-build/temp/deploy/. artifact/UPLOAD_TO_SITEASSETS/; fi
          if [ -f .dpx14_icon_b64 ]; then python3 - <<'PY_ICON'
          from pathlib import Path
          import base64
          Path('artifact/UPLOAD_TO_SITEASSETS/DispoLux_DL_Icon_48.png').write_bytes(base64.b64decode(Path('.dpx14_icon_b64').read_text().strip()))
          PY_ICON
          fi
          cat > artifact/REIHENFOLGE.txt <<'TXT'
          DLB-030P-1.12.1.9 · START + BACKUP FIX FULL BUILD · SPFx 1.3.6.74
          Basis: DLB-030I / DLB-029A. Enthält 029A PDF-Fix, 028D Datensicherung und 030I Multiuser-Schutz.
          Installation: zuerst UPLOAD_TO_SITEASSETS, danach UPLOAD_TO_APP_CATALOG/SPPKG.
          Danach DispoLux auf ALLEN Geräten/Tabs vollständig schließen und frisch öffnen.
          Fix 030P: Startprüfung läuft erst nach vollständig geladenem Zentralzustand; der fehlerhafte 15-Sekunden-Startabbruch ist entfernt. Die Datensicherung verändert die SharePoint-Einstellung 'Title eindeutig' nicht mehr und startet beim Kaltstart erst nach 30 Sekunden. Orders-Direkt-Sync aus 030J bleibt vollständig aktiv.
          Diagnose im Status: Orders SP / App / Datum. Die bereits zentral vorhandenen Testaufträge 1790330238856 und 1790332055857 müssen nach dem Start wieder in den App-Bestand übernommen werden.
          TXT

