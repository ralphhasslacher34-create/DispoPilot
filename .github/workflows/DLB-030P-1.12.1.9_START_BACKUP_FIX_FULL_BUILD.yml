      - name: Apply DLB-030J-1.12.1.3 Orders Direkt-Sync + Start-Recovery
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_030J'
          from pathlib import Path
          p=Path('dispopilot-online-efd.html')
          t=p.read_text(encoding='utf-8')
          marker='/* DP13_PATCH_BEGIN */'
          if t.count(marker)!=1:
              raise SystemExit(f'030J: DP13-Marker {t.count(marker)}x statt 1x.')
          required=[
              'DP_DLB_030I_1_12_1_2_MULTIUSER_SYNC_CACHE_BEGIN',
              'DP_DLB_030I_1_12_1_2_AUTOSYNC_MERGE_GUARD_BEGIN',
              'async function loadState',
              'async function dpG3Poll'
          ]
          for x in required:
              if x not in t: raise SystemExit('030J: erforderliche Basis fehlt: '+x)
          m='DP_DLB_030J_1_12_1_3_ORDERS_DIREKT_SYNC'
          if m in t: raise SystemExit('030J: Patch bereits vorhanden.')
          patch=r'''
          /* DP_DLB_030J_1_12_1_3_ORDERS_DIREKT_SYNC_BEGIN */
          let dp030jCentralOrderCount=0;
          let dp030jBadOrderCount=0;
  
          function dp030jStamp(x){
            const n=Date.parse(String((x&&x.updatedAt)||(x&&x.createdAt)||''));
            return Number.isFinite(n)?n:0;
          }
  
          function dp030jDeletedIds(){
            return new Set((state&&Array.isArray(state.archiveOrders)?state.archiveOrders:[])
              .filter(x=>x&&x.deletedInPlanning&&x.id!=null)
              .map(x=>String(x.id)));
          }
  
          async function dp030jQueryOrdersDirect(){
            const f=await SPStore.ensureFields();
            const select='Id,Title,'+encodeURIComponent(f.type)+','+encodeURIComponent(f.data);
            const base=SPStore.listApi()+'/items?$select='+select;
            const filtered=base+'&$filter='+encodeURIComponent(f.type)+'%20eq%20%27orders%27&$top=5000';
            const headers={
              'Accept':'application/json;odata=nometadata',
              'Cache-Control':'no-cache, no-store, max-age=0',
              'Pragma':'no-cache',
              'Expires':'0'
            };
            const read=async(firstUrl,clientFilter)=>{
              let url=firstUrl;
              const rows=[];
              while(url){
                const j=await SPStore.request(url,{headers,cache:'no-store'});
                const part=Array.isArray(j&&j.value)?j.value:(Array.isArray(j&&j.d&&j.d.results)?j.d.results:[]);
                for(const r of part){
                  if(clientFilter&&String(r[f.type]||'')!=='orders')continue;
                  rows.push(r);
                }
                url=(j&&j['@odata.nextLink'])||(j&&j.d&&j.d.__next)||null;
              }
              return rows;
            };
            try{
              return {rows:await read(filtered,false),fields:f};
            }catch(e){
              console.warn('DLB-030J: gefilterter Orders-GET fehlgeschlagen, Fallback auf DP_Data.',e);
              return {rows:await read(base+'&$top=5000',true),fields:f};
            }
          }
  
          async function dp030jLoadOrdersDirect(){
            const q=await dp030jQueryOrdersDirect();
            const out=[];
            let bad=0;
            for(const r of q.rows){
              const title=String(r.Title||'');
              const raw=String(r[q.fields.data]||'');
              if(!title.startsWith('DP|orders|'))continue;
              try{
                const o=JSON.parse(raw||'null');
                if(!o||o.id==null){bad++;continue}
                out.push(o);
                if(SPStore.remote&&typeof SPStore.remote.set==='function'){
                  SPStore.remote.set(title,{id:r.Id||r.ID,title,type:'orders',raw});
                }
              }catch(e){
                bad++;
                console.error('DLB-030J: ungültiges orders-JSON',title,e);
              }
            }
            dp030jCentralOrderCount=out.length;
            dp030jBadOrderCount=bad;
            return out;
          }
  
          function dp030jMergeOrders(remoteOrders){
            const deleted=dp030jDeletedIds();
            const map=new Map();
            // Zentral vorhandene orders sind verbindlich: ein alter/staler Tombstone
            // darf einen physisch in DP_Data vorhandenen Auftrag nicht unsichtbar machen.
            for(const o of remoteOrders||[]){
              const id=String(o&&o.id!=null?o.id:'');
              if(id)map.set(id,o);
            }
            // Lokal neuere Daten bleiben erhalten. Lokal-only + expliziter Tombstone
            // wird nicht wiederbelebt; eine zentral vorhandene Zeile gewinnt dagegen.
            for(const o of (state&&Array.isArray(state.orders)?state.orders:[])){
              const id=String(o&&o.id!=null?o.id:'');
              if(!id)continue;
              const r=map.get(id);
              if(!r&&deleted.has(id))continue;
              if(!r||dp030jStamp(o)>dp030jStamp(r))map.set(id,o);
            }
            state.orders=[...map.values()];
            return state.orders.length;
          }
  
          function dp030jDiag(context){
            const appCount=state&&Array.isArray(state.orders)?state.orders.length:0;
            let dayCount=0;
            try{
              if(typeof selectedDate!=='undefined')dayCount=(state.orders||[]).filter(o=>o&&o.date===selectedDate).length;
            }catch(_){}
            const bad=dp030jBadOrderCount?' · JSON-Fehler '+dp030jBadOrderCount:'';
            const msg='Zentrale Datenbank · '+context+' · Orders SP '+dp030jCentralOrderCount+' · App '+appCount+' · Datum '+dayCount+bad;
            try{dpG3Status(msg)}catch(_){const el=document.getElementById('storageStatus');if(el)el.textContent=msg}
          }
  
          async function dp030jRefreshOrders(context,renderNow){
            const remote=await dp030jLoadOrdersDirect();
            dp030jMergeOrders(remote);
            if(typeof dpDNormalizeAllGroups==='function')dpDNormalizeAllGroups();
            if(renderNow){
              try{
                if(typeof dpG3RenderVisibleScreen==='function')dpG3RenderVisibleScreen();
                else if(typeof renderAll==='function')renderAll();
              }catch(e){console.error('DLB-030J render',e)}
            }
            dp030jDiag(context);
          }
  
          const dp030jBaseLoadState=loadState;
          loadState=async function(){
            await dp030jBaseLoadState();
            try{
              await dp030jRefreshOrders('Start',true);
            }catch(e){
              console.error('DLB-030J Start-Orders',e);
              try{dpG3Status('⚠ Orders-Direktladen beim Start fehlgeschlagen')}catch(_){}
            }
          };
  
          const dp030jBaseG3Poll=dpG3Poll;
          dpG3Poll=async function(){
            await dp030jBaseG3Poll();
            if(dpG3Running)return;
            try{
              await dp030jRefreshOrders('Auto-Sync',true);
              dpG3LastSuccess=Date.now();
            }catch(e){
              console.error('DLB-030J Auto-Sync Orders',e);
              try{dpG3Status('⚠ Orders-Direktladen im Auto-Sync fehlgeschlagen')}catch(_){}
            }
          };
          /* DP_DLB_030J_1_12_1_3_ORDERS_DIREKT_SYNC_END */
          '''
          t=t.replace(marker,patch+'\n'+marker,1)
          p.write_text(t,encoding='utf-8',newline='\n')
          print('DLB-030J: Orders Direkt-Sync und Start-Recovery eingebaut.')
          PY_030J
          grep -Fq 'DP_DLB_030J_1_12_1_3_ORDERS_DIREKT_SYNC_BEGIN' dispopilot-online-efd.html
          grep -Fq 'async function dp030jLoadOrdersDirect()' dispopilot-online-efd.html
          grep -Fq "Orders SP '+dp030jCentralOrderCount" dispopilot-online-efd.html
          grep -Fq 'const dp030jBaseLoadState=loadState;' dispopilot-online-efd.html
          grep -Fq 'const dp030jBaseG3Poll=dpG3Poll;' dispopilot-online-efd.html

