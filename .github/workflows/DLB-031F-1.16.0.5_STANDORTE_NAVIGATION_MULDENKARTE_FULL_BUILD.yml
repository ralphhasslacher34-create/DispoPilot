          DLB031F_PATCH

          python3 - <<'PY_PATCH_031F'
          from pathlib import Path
          import base64

          files = (
              list(Path("spfx-build/src/webparts").rglob("*.js")) +
              list(Path("spfx-build/src/webparts").rglob("*.ts")) +
              list(Path("spfx-build/src/webparts").rglob("*.tsx"))
          )
          end_marker = "/* DP13_PATCH_END */"
          runtime_required = [
              "DP_K1B_BAUSTELLENADRESSE_BEGIN",
              "DP_X10_BEMERKUNGEN_RAPPORT_BEGIN"
          ]
          ah_marker = "DP_DLB_030AH_1_12_1_27_BACKUP_30MIN_FILES_BEGIN"

          # 030AH-Backup sitzt im SPFx-Hostcode, die eigentliche DispoLux-Runtime in app-runtime.js.
          # Deshalb 030AH global prüfen, aber NICHT fälschlich im Runtime-File verlangen.
          if not any(ah_marker in p.read_text(encoding="utf-8") for p in files):
              raise SystemExit("031F: 030AH-Basis global nicht gefunden: " + ah_marker)

          candidates = []
          for p in files:
              s = p.read_text(encoding="utf-8")
              if end_marker in s and all(x in s for x in runtime_required):
                  candidates.append(p)
          if len(candidates) != 1:
              raise SystemExit(f"031F: erwartete genau eine Runtime-Datei, gefunden: {[str(x) for x in candidates]}")

          p = candidates[0]
          s = p.read_text(encoding="utf-8")
          if "DP_DLB_031F_1_16_0_5_STANDORTE_NAVIGATION_BEGIN" in s:
              raise SystemExit("031F: Patch bereits vorhanden.")
          if s.count(end_marker) != 1:
              raise SystemExit(f"031F: DP13-Endmarker {s.count(end_marker)}x statt 1x.")
          for item in runtime_required:
              if item not in s:
                  raise SystemExit("031F: Runtime-Basis fehlt: " + item)

          patch = base64.b64decode(Path('/tmp/dlb031f_patch.b64').read_text().encode()).decode('utf-8')
          s = s.replace(end_marker, patch + "\n\n" + end_marker, 1)
          p.write_text(s, encoding="utf-8", newline="\n")
          print("031F gepatcht:", p)
          PY_PATCH_031F

      - name: Set 031F SPFx version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_VER_031F'
          from pathlib import Path
          p = Path("spfx-build/config/package-solution.json")
          s = p.read_text(encoding="utf-8")
          if "1.3.6.92" not in s:
              raise SystemExit("031F: erwartete 030AH-SPFx-Version 1.3.6.92 fehlt.")
          p.write_text(s.replace("1.3.6.92", "1.3.6.99", 1), encoding="utf-8", newline="\n")
          PY_VER_031F

      - name: Validate 031F source before build
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_VALIDATE_031F'
          from pathlib import Path
          import json, subprocess

          root = Path("spfx-build/src/webparts")
          files = [p for p in root.rglob("*") if p.is_file() and p.suffix in {".js", ".ts", ".tsx"}]
          if not files:
              raise SystemExit("031F VALIDIERUNG: keine SPFx-Quelldateien gefunden.")

          def texts():
              for p in files:
                  yield p, p.read_text(encoding="utf-8")

          ah_marker = "DP_DLB_030AH_1_12_1_27_BACKUP_30MIN_FILES_BEGIN"
          if not any(ah_marker in t for _, t in texts()):
              raise SystemExit("031F VALIDIERUNG: 030AH-Basismarker fehlt global.")
          print("OK 1/12: 030AH-Basis vorhanden")

          begin = "DP_DLB_031F_1_16_0_5_STANDORTE_NAVIGATION_BEGIN"
          end = "DP_DLB_031F_1_16_0_5_STANDORTE_NAVIGATION_END"
          hits = [(p, t) for p, t in texts() if begin in t]
          if len(hits) != 1:
              raise SystemExit(f"031F VALIDIERUNG: Standort-Patch in {len(hits)} Dateien gefunden statt genau 1: {[str(p) for p,_ in hits]}")
          runtime, source = hits[0]
          if end not in source:
              raise SystemExit("031F VALIDIERUNG: Endmarker des Standort-Patches fehlt in " + str(runtime))
          frag = source.split(begin, 1)[1].split(end, 1)[0]
          print("OK 2/12: 031F-Patch genau einmal in", runtime)

          required = [
              "cMapsUrlWrap", "dp31FSiteQrButton", "BarcodeDetector",
              "navigator.geolocation.getCurrentPosition", "Standort setzen", "Standort abrufen",
              "dp31FRenderAddressGps", "Navigation zur Baustelle", "__DISPOLUX_031F", "dp31FNavigation",
              "gpsCurrent=true", "gpsInvalidatedAt", "dp31FBasePersist", "dp31FBaseLoadState",
              "dp31FBaseRenderBins", "tile.openstreetmap.org", "Alle Typen", "Standort fehlt / nicht aktuell"
          ]
          missing = [x for x in required if x not in frag]
          if missing:
              raise SystemExit("031F VALIDIERUNG: Funktionen fehlen im Patch: " + ", ".join(missing))
          print("OK 3/12: QR, Navigation, GPS-Lebenszyklus und Muldenkarte vollständig enthalten")

          forbidden = ["new MutationObserver", "dp31FRefreshUi", "setInterval("]
          bad = [x for x in forbidden if x in frag]
          if bad:
              raise SystemExit("031F VALIDIERUNG: unzulässige Start-/Polling-Logik im neuen Patch: " + ", ".join(bad))
          print("OK 4/12: kein eigener DOM-Observer und keine Polling-Schleife")

          old_markers = [
              "DP_DLB_030AI_1_16_0_0_STANDORTE_NAVIGATION_BEGIN",
              "DP_DLB_030AJ_1_16_0_1_STANDORTE_NAVIGATION_BEGIN",
              "DP_DLB_030AK_1_16_0_2_STANDORTE_NAVIGATION_BEGIN",
              "DP_DLB_030AL_1_16_0_3_STANDORTE_NAVIGATION_BEGIN",
              "DP_DLB_031C_1_16_0_2_STANDORTE_NAVIGATION_BEGIN",
              "DP_DLB_031D_1_16_0_3_STANDORTE_NAVIGATION_BEGIN",
              "DP_DLB_031E_1_16_0_4_STANDORTE_NAVIGATION_BEGIN"
          ]
          old_hits = []
          for p, t in texts():
              for marker in old_markers:
                  if marker in t:
                      old_hits.append(f"{marker} in {p}")
          if old_hits:
              raise SystemExit("031F VALIDIERUNG: alte Standort-Patches in der rekonstruierten 030AH-Basis gefunden: " + "; ".join(old_hits))
          print("OK 5/12: keine alten AI/AJ/AK/AL/031C/031D/031E-Standortpatches enthalten")

          pkg = Path("spfx-build/config/package-solution.json")
          if not pkg.exists():
              raise SystemExit("031F VALIDIERUNG: package-solution.json fehlt.")
          data = json.loads(pkg.read_text(encoding="utf-8"))
          version = data.get("solution", {}).get("version", "")
          if version != "1.3.6.99":
              raise SystemExit(f"031F VALIDIERUNG: SPFx-Version ist {version!r}, erwartet 1.3.6.99.")
          print("OK 6/12: SPFx-Version 1.3.6.99")

          if runtime.suffix == ".js":
              subprocess.run(["node", "--check", str(runtime)], check=True)
              print("OK 7/12: gepatchte Runtime besteht node --check")
          else:
              print("OK 7/12: Runtime ist TypeScript; Syntaxprüfung erfolgt im Heft-Build")

          tail = frag[frag.rfind("if(typeof openDetail"):] if "if(typeof openDetail" in frag else frag
          direct_bad = [x for x in ["dp31FSetBinGps();", "dp31FPosition();", "persist();"] if x in tail]
          if direct_bad:
              raise SystemExit("031F VALIDIERUNG: direkter GPS-/Persist-Aufruf beim Start gefunden: " + ", ".join(direct_bad))
          print("OK 8/12: kein direkter GPS-/Persist-/Datenaufruf beim Start")

          for required_ui in ["Standort setzen","Standort abrufen","dp31FRenderAddressGps","dp31FShowBinGps"]:
              if required_ui not in frag:
                  raise SystemExit("031F VALIDIERUNG: Muldenstandort-Bedienung fehlt: "+required_ui)
          print("OK 9/12: Muldenstandort setzen und abrufen sind aktiv verdrahtet")

          lifecycle = ["dp31FLogicalLocationKey","dp31FInvalidateMovedGps","gpsCurrent=false","gpsInvalidatedReason","dp31FMovementReason"]
          miss = [x for x in lifecycle if x not in frag]
          if miss:
              raise SystemExit("031F VALIDIERUNG: GPS-Ungültigkeitslogik fehlt: "+", ".join(miss))
          print("OK 10/12: alter GPS-Punkt wird nach Standortwechsel als nicht aktuell markiert")

          map_required = ["dp31FInstallBinMapUi","dp31FRenderBinMap","dp31FWorldPoint","tile.openstreetmap.org","Alle Typen","Standort fehlt / nicht aktuell"]
          miss = [x for x in map_required if x not in frag]
          if miss:
              raise SystemExit("031F VALIDIERUNG: Muldenkarten-Funktion fehlt: "+", ".join(miss))
          print("OK 11/12: Mulden suchen besitzt Liste/Karte, Typfilter und Fehlstand-Anzeige")

          if "dp31FPlacedBins" not in frag or "Beim Kunden" not in frag:
              raise SystemExit("031F VALIDIERUNG: Kartenfilter für aktuell gestellte Mulden fehlt.")
          print("OK 12/12: Karte beschränkt sich auf aktuell gestellte Mulden")
          PY_VALIDATE_031F

      - name: Build and package 031F
        shell: bash
        run: |
          set -euo pipefail
          (cd spfx-build && npx heft build --production)
          (cd spfx-build && npx heft package-solution --production)

          rm -rf artifact/UPLOAD_TO_SITEASSETS artifact/UPLOAD_TO_APP_CATALOG
          mkdir -p artifact/UPLOAD_TO_SITEASSETS artifact/UPLOAD_TO_APP_CATALOG
          PKG=$(find spfx-build/sharepoint/solution -maxdepth 1 -type f -name '*.sppkg' | head -n1)
          test -n "$PKG"
          cp "$PKG" artifact/UPLOAD_TO_APP_CATALOG/DispoPilot_Online_V1.3_SPFX_FINAL.sppkg

          if [ -d spfx-build/release/assets ]; then
            cp -a spfx-build/release/assets/. artifact/UPLOAD_TO_SITEASSETS/
          elif [ -d spfx-build/temp/deploy ]; then
            cp -a spfx-build/temp/deploy/. artifact/UPLOAD_TO_SITEASSETS/
          else
            echo "031F: Keine SPFx Asset-Ausgabe gefunden." >&2
            exit 1
          fi

          if [ -f .dpx14_icon_b64 ]; then
            python3 - <<'PY_ICON_031F'
          from pathlib import Path
          import base64
          Path("artifact/UPLOAD_TO_SITEASSETS/DispoLux_DL_Icon_48.png").write_bytes(base64.b64decode(Path(".dpx14_icon_b64").read_text().strip()))
          PY_ICON_031F
          fi

      - name: Validate emitted 031F package
        shell: bash
        run: |
          set -euo pipefail
          COUNT=0
          while IFS= read -r -d '' JS; do
            test -s "$JS"
            node --check "$JS"
            COUNT=$((COUNT+1))
          done < <(find artifact/UPLOAD_TO_SITEASSETS -maxdepth 1 -type f -name '*.js' -print0)
          test "$COUNT" -gt 0

          PKG=artifact/UPLOAD_TO_APP_CATALOG/DispoPilot_Online_V1.3_SPFX_FINAL.sppkg
          test -s "$PKG"
          grep -R -Fq 'Standort setzen' artifact/UPLOAD_TO_SITEASSETS
          grep -R -Fq 'Standort abrufen' artifact/UPLOAD_TO_SITEASSETS
          grep -R -Fq 'Navigation zur Baustelle' artifact/UPLOAD_TO_SITEASSETS
          grep -R -Fq 'Standort nicht aktuell' artifact/UPLOAD_TO_SITEASSETS
          grep -R -Fq 'tile.openstreetmap.org' artifact/UPLOAD_TO_SITEASSETS
          grep -R -Fq 'Alle Typen' artifact/UPLOAD_TO_SITEASSETS

          echo "031F: Produktions-JS syntaktisch gültig, GPS-Lebenszyklus und Muldenkarte enthalten; SPPKG vorhanden."

          cat > artifact/REIHENFOLGE.txt <<'TXT'
          DLB-031F-1.16.0.5 · STANDORTE / NAVIGATION / MULDENKARTE · SPFx 1.3.6.99

          Basis: DIREKT DLB-030AH-1.12.1.27. 031E und die vorherigen Standortversuche werden NICHT als Basis verwendet.

          Standorte / Navigation:
          - Kunden-/Rechnungsadresse: Handeingabe oder Maps-Link.
          - Baustellenadresse: Handeingabe, Maps-Link oder QR-Code.
          - Navigation zur Baustelle bleibt wie in 031E.
          - Muldenstandort: „Standort setzen“ und „Standort abrufen“ bleiben erhalten.
          - Standort setzen speichert GPS-Punkt plus logischen Standort (Status/Kunde/Baustelle).
          - Wird die Mulde danach zu anderem Kunden / anderer Baustelle oder ins Lager umgesetzt, bleibt der alte GPS-Punkt erhalten, wird aber automatisch als NICHT AKTUELL markiert.
          - Standort abrufen warnt bei einem alten Punkt und öffnet ihn nur nach Bestätigung als letzten bekannten Standort.

          Mulden suchen:
          - Umschalter Liste | Karte.
          - Karte zeigt aktuell gestellte Mulden mit gültigem GPS-Punkt.
          - Filter: Alle Typen oder ein Muldentyp; die bestehende Suche grenzt zusätzlich nach Muldennummer, Kunde oder Baustelle ein.
          - Gestellte Mulden ohne aktuellen GPS-Punkt erscheinen separat als „Standort fehlt / nicht aktuell“ und können direkt geöffnet werden.
          - Kartenmarker zeigen Muldennummer. Auswahl zeigt Typ, Kunde/Baustelle, GPS-Zeitpunkt und Navigation.
          - Kartenbasis: OpenStreetMap-Kacheln, ohne API-Schlüssel. Die Karte wird erst beim Umschalten auf „Karte“ aufgebaut.

          Unverändert übernommen:
          - DLB-030AH Dateisicherung in DispoLux_Backup alle 30 Minuten, 54 h Aufbewahrung.
          - DP_Data bleibt frei von DPB|-Backupdatensätzen.
          - Bestehende Auftrags-, Arbeitszeit-, Mulden-, Dokument- und Benutzerlogik bleibt Basis.

          Test 031F:
          0. Starttest: DispoLux muss bis zum Hauptmenü laden.
          1. QR-Code und Navigation zur Baustelle gegenprüfen.
          2. Mulde beim Kunden: Standort setzen und abrufen.
          3. Dieselbe Mulde an anderen Kunden / andere Baustelle oder ins Lager buchen OHNE neuen GPS-Punkt: alter Punkt muss „nicht aktuell“ werden.
          4. Danach neuen Standort setzen: Punkt muss wieder „Aktuell“ werden.
          5. Mulden suchen: Liste | Karte testen.
          6. Karte: Alle Typen, einen Typ und eine einzelne Muldennummer über die Suche prüfen.
          7. Marker öffnen, Kunde/Baustelle prüfen und Navigation starten.
