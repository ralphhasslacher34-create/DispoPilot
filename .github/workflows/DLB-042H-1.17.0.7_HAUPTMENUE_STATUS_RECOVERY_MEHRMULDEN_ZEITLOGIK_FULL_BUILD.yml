        req=['__DISPOLUX_042H',"version:'1.17.0.7'","base:'DLB-041J-1.16.0.42'",'dp42cSide','Auftragserfassung','Dispositionsliste','Dispositionsgrafik','Containerdienst','Transporte','Schüttgut','Fahrauftrag','Wer will wo was?','undisponiert','data-drop-driver','draggable="true"','Stamm-LKW','plannedMinutes','Bestehende Detailfunktionen','In Arbeit','Unterbrochen','dp42cOpenIntake','dp42dDraft','dp42dRestoreDraft','dp42dCandidateText','Muldenlogistik bearbeiten','Auftragserfassung und Disposition','dp42gFormSnapshot','dp42gCapacity','dp42gWindowStatus','Kunden-Zeitfenster','Keine sichere Zusage – Disposition prüfen','dp42hInstallMenuObserver','dp42hMountAdminRecovery','dp42hSplitMultiBinOrder','requestedBins','dp42hReflowFollowing','Tätigkeitsfelder / Kapazität']
