    - name: Build and package DLB-042H
      shell: bash
      run: |
        set -euo pipefail
        rm -rf spfx-build/release spfx-build/temp/deploy spfx-build/sharepoint/solution
        (cd spfx-build && npx heft build --production)
        (cd spfx-build && npx heft package-solution --production)
        rm -rf artifact/UPLOAD_TO_SITEASSETS artifact/UPLOAD_TO_APP_CATALOG
        mkdir -p artifact/UPLOAD_TO_SITEASSETS artifact/UPLOAD_TO_APP_CATALOG
        PKG=$(find spfx-build/sharepoint/solution -maxdepth 1 -type f -name '*.sppkg' | head -n1)
        test -n "$PKG"
        cp "$PKG" artifact/UPLOAD_TO_APP_CATALOG/DispoPilot_Online_V1.3_SPFX_FINAL.sppkg
        if [ -d spfx-build/release/assets ]; then cp -a spfx-build/release/assets/. artifact/UPLOAD_TO_SITEASSETS/
        elif [ -d spfx-build/temp/deploy ]; then cp -a spfx-build/temp/deploy/. artifact/UPLOAD_TO_SITEASSETS/
        else echo '042H: Keine SPFx Asset-Ausgabe gefunden.' >&2; exit 1; fi
    - name: Validate emitted DLB-042H package
      shell: bash
      run: |
        set -euo pipefail
        COUNT=0
        while IFS= read -r -d '' JS; do test -s "$JS"; node --check "$JS"; COUNT=$((COUNT+1)); done < <(find artifact/UPLOAD_TO_SITEASSETS -maxdepth 1 -type f -name '*.js' -print0)
        test "$COUNT" -gt 0
        test -s artifact/UPLOAD_TO_APP_CATALOG/DispoPilot_Online_V1.3_SPFX_FINAL.sppkg
        python3 - <<'PY_FINAL_042H'
        from pathlib import Path
        js=list(Path('artifact/UPLOAD_TO_SITEASSETS').glob('*.js'));hits=[]
        for p in js:
            s=p.read_text(encoding='utf-8')
            if '__DISPOLUX_042H' in s and '1.17.0.7' in s:hits.append((p,s))
        if len(hits)!=1: raise SystemExit(f'042H FINAL: Produktionsbundle {len(hits)}x statt genau 1x.')
        p,s=hits[0]
        required=['__DISPOLUX_041J','1.16.0.42','__DISPOLUX_042H','1.17.0.7','Auftragserfassung','Dispositionsliste','Dispositionsgrafik','data-drop-driver','Stamm-LKW','dp41NetLive','dp41PlanDocs','DispoLux_Auftragsdokumente','Muldenlogistik bearbeiten','Auftragserfassung und Disposition','Keine passende freie, leere Mulde im Lager gefunden.','Kunden-Zeitfenster','Keine sichere Zusage – Disposition prüfen','Datensicherung &amp; Wiederherstellung','Mehrmuldenbedarf aus Auftragserfassung','Unterbrochen','netWeightKg','btRecord','plannedBinMaterials','actualBinMaterials','actualExistingBinMaterials','DispoLux:036D:offlineOutbox:v1']
        missing=[x for x in required if x not in s]
