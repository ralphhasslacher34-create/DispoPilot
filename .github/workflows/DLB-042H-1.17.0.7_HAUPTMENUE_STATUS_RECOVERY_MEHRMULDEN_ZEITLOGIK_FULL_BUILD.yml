        doc_anchor='  window.dpDLB27AUploadFiles=uploadFiles;'
        if src.count(doc_anchor)!=1: raise SystemExit(f'041J: DLB-027H Upload-Anker {src.count(doc_anchor)}x statt 1x.')
        doc_extension="""  window.dpDLB27AUploadFiles=uploadFiles;
          async function dp41JUploadFilesForOrder(orderId,files,category='Sonstiges'){
            const oid=txt(orderId),items=Array.from(files||[]);
            if(!oid||!items.length)return 0;
            if(!navigator.onLine)throw new Error('Für das Hochladen von Bildern und Dokumenten wird eine Internetverbindung benötigt.');
            await ensureLibrary();let done=0;
            for(const file of items){
              if(Number(file?.size||0)>50*1024*1024)throw new Error('„'+txt(file?.name)+'“ ist größer als 50 MB.');
              const name=modeName()+'__Auftrag_'+oid+'__'+storedName(file,txt(category)||'Sonstiges');
              await uploadBinary(name,file);done++;
            }
            if(String(activeOrderId||'')===oid)await refresh(oid);
            return done;
          }
          window.dpDLB27AListFilesForOrder=listFiles;
          window.dpDLB27AUploadFilesForOrder=dp41JUploadFilesForOrder;
          window.dpDLB27AOriginalFileName=originalFromName;
          window.dpDLB27ACategoryFromName=categoryFromName;"""
        src=src.replace(doc_anchor,doc_extension,1)

        def replace_region(source,start_marker,end_marker,new_text,label):
            a=source.find(start_marker); b=source.find(end_marker,a+len(start_marker))
            if a<0 or b<=a or source.count(start_marker)!=1:
                raise SystemExit(f'041J: {label} nicht eindeutig gefunden.')
            return source[:a]+new_text+source[b:]

        new_auto=r"""function dp41AutoTimes(o,atIso=''){
            dp41BootstrapLegacy(o);const now=atIso||dp41NowIso(),segs=o.workSegments||[];
            if(!segs.length)return {net:0,pause:0,gross:0,netMs:0,pauseMs:0,grossMs:0,first:'',last:'',active:false};
            let netMs=0,first='',last='',active=false;
            for(const seg of segs){
              const a=new Date(seg.startAt).getTime();if(!Number.isFinite(a))continue;
              if(!first||a<new Date(first).getTime())first=seg.startAt;
              const endIso=seg.endAt||now,b=new Date(endIso).getTime();
              if(Number.isFinite(b)&&b>=a){netMs+=b-a;if(!last||b>new Date(last).getTime())last=endIso;}
              if(!seg.endAt)active=true;
            }
            const a=first?new Date(first).getTime():NaN,b=last?new Date(last).getTime():NaN;
            const grossMs=Number.isFinite(a)&&Number.isFinite(b)&&b>=a?b-a:netMs;
            const pauseMs=Math.max(0,grossMs-netMs);
            return {net:dp41Min(netMs),pause:dp41Min(pauseMs),gross:dp41Min(grossMs),netMs,pauseMs,grossMs,first,last,active};
          }
          function dp41PauseMinutes(value){
            const raw=dp41Text(value);if(!raw)return null;
            const m=raw.match(/^(\d{1,3}):([0-5]\d)$/);if(!m)return null;
            return Number(m[1])*60+Number(m[2]);
          }
          function dp41IsoForClock(o,time,referenceIso='',boundaryIso='',kind='start'){
            const raw=dp41Text(time);if(!/^\d{2}:\d{2}$/.test(raw))return '';
            const hm=raw.split(':').map(Number),ref=referenceIso?new Date(referenceIso):new Date((dp41Text(o?.date)||new Date().toISOString().slice(0,10))+'T12:00:00');
            if(!Number.isFinite(ref.getTime()))return '';
            const refMs=ref.getTime(),boundary=boundaryIso?new Date(boundaryIso).getTime():NaN,candidates=[];
            for(const delta of [-1,0,1]){const d=new Date(ref);d.setDate(d.getDate()+delta);d.setHours(hm[0],hm[1],0,0);const ms=d.getTime();if(!Number.isFinite(ms))continue;if(Number.isFinite(boundary)){if(kind==='start'&&ms>boundary)continue;if(kind==='end'&&ms<boundary)continue;}candidates.push({ms,iso:d.toISOString()});}
            if(!candidates.length)return '';
            candidates.sort((a,b)=>Math.abs(a.ms-refMs)-Math.abs(b.ms-refMs));return candidates[0].iso;
          }
          function dp41EffectiveTimes(o,atIso=''){
            const auto=dp41AutoTimes(o,atIso),adj=Number(o?.workPauseAdjustmentMinutes||0),adjMin=Number.isFinite(adj)?adj:0;
            const pauseMs=Math.max(0,auto.pauseMs+adjMin*60000),grossMs=auto.grossMs,netMs=Math.max(0,grossMs-pauseMs);
            return {...auto,net:dp41Min(netMs),pause:dp41Min(pauseMs),gross:dp41Min(grossMs),netMs,pauseMs,grossMs,autoNet:auto.net,autoPause:auto.pause,autoGross:auto.gross};
          }
          function dp41ApplyManualTimeEdits(o,before,after){
            if(!o||!dp41TimeEditAllowed())return;
            dp41BootstrapLegacy(o);const segs=(o.workSegments||[]).filter(x=>x&&x.startAt);
            if(after.start!==before.start&&after.start&&segs.length){
              let first=segs[0];for(const seg of segs)if(new Date(seg.startAt)<new Date(first.startAt))first=seg;
              const corrected=dp41IsoForClock(o,after.start,first.startAt,first.endAt||'','start');if(corrected)first.startAt=corrected;
            }
            if(after.end!==before.end&&!dp41Active(o)&&after.end&&segs.length){
              let last=segs[0];for(const seg of segs){const a=new Date(seg.endAt||seg.startAt).getTime(),b=new Date(last.endAt||last.startAt).getTime();if(a>b)last=seg;}
              const corrected=dp41IsoForClock(o,after.end,last.endAt||last.startAt,last.startAt,'end');if(corrected)last.endAt=corrected;
            }
            if(after.pause!==before.pause){const requested=dp41PauseMinutes(after.pause);if(requested!=null){const auto=dp41AutoTimes(o);o.workPauseAdjustmentMinutes=requested-auto.pause;}}
          }
          """
        src=replace_region(src,"function dp41AutoTimes(o,atIso=''){",'function dp41LegacyNet(o){',new_auto,'dp41AutoTimes')

        new_store=r"""function dp41StoreTimes(o,opt={}){
            const auto=dp41AutoTimes(o,opt.atIso||''),t=dp41EffectiveTimes(o,opt.atIso||'');
            o.workFirstStartAt=auto.first||o.workFirstStartAt||'';o.workLastEndAt=auto.active?'':(auto.last||o.workLastEndAt||'');
            o.workAutoNetMinutes=auto.net;o.workAutoPauseMinutes=auto.pause;o.workAutoGrossMinutes=auto.gross;
            o.workNetMinutes=t.net;o.workPauseMinutes=t.pause;o.workGrossMinutes=t.gross;
            if(opt.syncLegacy){
              if(auto.first)o.start=dp41Clock(auto.first);if(auto.active)o.end='';else if(auto.last)o.end=dp41Clock(auto.last);o.pause=dp41Hm(t.pause);
            }
            return t;
          }
          """
        src=replace_region(src,'function dp41StoreTimes(o,opt={}){','function dp41Event(o,type,at,extra={}){',new_store,'dp41StoreTimes')

        new_time_html=r"""function dp41TimeHtml(o){
            const t=dp41EffectiveTimes(o);
            return '<div class="dp41Metrics" data-dp41-order="'+dp41Esc(o.id)+'"><div class="dp41Metric"><span>Start</span><strong id="dp41StartLive">'+dp41Esc(o.start||dp41Clock(t.first)||'–')+'</strong></div><div class="dp41Metric"><span>Nettozeit</span><strong id="dp41NetLive">'+dp41Esc(t.active?dp41FmtLiveMs(t.netMs):dp41FmtMin(t.net))+'</strong></div><div class="dp41Metric"><span>Pause</span><strong id="dp41PauseLive">'+dp41Esc(dp41FmtMin(t.pause))+'</strong></div></div>';
          }
          function dp41FmtLiveMs(ms){let sec=Math.max(0,Math.floor((Number(ms)||0)/1000));const h=Math.floor(sec/3600);sec-=h*3600;const m=Math.floor(sec/60),s=sec-m*60;return h+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');}
          let dp41LiveTimer=0;
          function dp41UpdateLiveTime(id){
            const root=document.querySelector('.dp41BRoot'),o=orderById(id),modal=document.getElementById('detailModal');
            if(!root||!o||!modal?.classList.contains('show')||String(root.dataset.orderId)!==String(id)){if(dp41LiveTimer){clearInterval(dp41LiveTimer);dp41LiveTimer=0;}return;}
            const t=dp41EffectiveTimes(o),start=document.getElementById('dp41StartLive'),net=document.getElementById('dp41NetLive'),pause=document.getElementById('dp41PauseLive');
            if(start)start.textContent=o.start||dp41Clock(t.first)||'–';if(net)net.textContent=t.active?dp41FmtLiveMs(t.netMs):dp41FmtMin(t.net);if(pause)pause.textContent=dp41FmtMin(t.pause);
            if(o.status!=='In Arbeit'&&dp41LiveTimer){clearInterval(dp41LiveTimer);dp41LiveTimer=0;}
          }
          function dp41StartLiveTime(id){
            if(dp41LiveTimer){clearInterval(dp41LiveTimer);dp41LiveTimer=0;}dp41UpdateLiveTime(id);
            const o=orderById(id);if(o?.status==='In Arbeit')dp41LiveTimer=setInterval(()=>dp41UpdateLiveTime(id),1000);
          }
          """
        src=replace_region(src,'function dp41TimeHtml(o){','function dp41DataHtml(o){',new_time_html,'dp41TimeHtml/live timer')

        new_prepare=r"""async function dp41PrepareCompletion(o,mode='extra'){
            if(!o||!dp41BaseSetStatus)return false;const forFinish=mode==='finish';
