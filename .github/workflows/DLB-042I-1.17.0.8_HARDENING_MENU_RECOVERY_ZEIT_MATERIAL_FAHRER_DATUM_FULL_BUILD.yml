en.')\n\n# A) 039B-Festbutton DIREKT an seiner Quelle deaktivieren.\nold_ui=\"\"\"if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>setTimeout(dp39InstallUi,1000),{once:true});\n            else setTimeout(dp39InstallUi,1000);\n            setTimeout(dp39InstallUi,4000);\"\"\"\nnew_ui=\"\"\"/* DLB-042I: fester Notfall-Recovery-Button dauerhaft deaktiviert.\n               Recovery erfolgt ausschließlich über Administration -> Datensicherung & Wiederherstellung. */\n            try{document.getElementById('dp39RecoveryControl')?.remove();}catch(_){}\"\"\"\nif s.count(old_ui)!=1:\n    raise SystemExit(f'042I: 039B-UI-Startblock {s.count(old_ui)}x statt genau 1x gefunden.')\ns=s.replace(old_ui,new_ui,1)\n\n# B) Materialliste der 42-Erfassung DIREKT auf denselben 040C-Stamm setzen.\n#    Vorrang: dp40cMasterMaterialRows, also exakt die funktionierende 41/040C Quelle.\nstart=s.find('  function materialList(){', s.find('DP_DLB_042H_1_17_0_7'))\nend=s.find('\\n  function containerTypes()',start)\nif start<0 or end<=start:\n    raise SystemExit('042I: 42H-materialList nicht eindeutig gefunden.')\nold_material=s[start:end]\nif 'dpR1MaterialOptions' not in old_material:\n    raise SystemExit('042I: erwartete 42H-Materialfunktion weicht ab.')\nnew_material=r'''  function materialList(){\n    const out=[],seen=new Set(),add=(value,label)=>{\n      value=t(value);label=t(label||value);if(!value)return;\n      const key=value.toLocaleLowerCase('de');if(seen.has(key))return;seen.add(key);out.push({value,label})\n    };\n    try{\n      if(typeof dp40cMasterMaterialRows==='function'){\n        (dp40cMasterMaterialRows('')||[]).forEach(x=>add(x?.value,x?.label||x?.value));\n        return out;\n      }\n      if(typeof dpR1MaterialOptions==='function'){\n        const taskEl=typeof $==='function'?$('oTask'):document.getElementById('oTask');\n        const before=taskEl?taskEl.value:null;\n        let html='';\n        try{\n          if(taskEl&&t(taskEl.value)==='Stellen')taskEl.value='Abholen';\n          html=String(dpR1MaterialOptions('')||'');\n        }finally{if(taskEl&&before!==null)taskEl.value=before}\n        const probe=document.createElement('select');probe.innerHTML=html;\n        Array.from(probe.options||[]).forEach(opt=>{\n          const v=t(opt.value),lab=t(opt.textContent||opt.label||v);\n          if(v&&v.toLocaleLowerCase('de')!=='leer')add(v,lab)\n        });\n      }\n    }catch(e){console.warn('42I Materialstamm',e)}\n    return out;\n  }'''\ns=s[:start]+new_material+s[end:]\n\n# Weil 42H bisher Strings erwartet, werden seine beiden UI-Stellen auf value/label angepasst.\ns=s.replace(\n    \"materialList().map(x=>`<option ${t(x)===t(r.material)?'selected':''}>${eh(x)}</option>`).join('')\",\n    \"materialList().map(x=>`<option value=\\\"${eh(x.value)}\\\" ${t(x.value)===t(r.material)?'selected':''}>${eh(x.label)}</option>`).join('')\"\n)\ns=s.replace(\n    \"materialList().map(x=>`<option>${eh(x)}</option>`).join('')\",\n    \"materialList().map(x=>`<option value=\\\"${eh(x.value)}\\\">${eh(x.label)}</option>`).join('')\"\n)\n\n# C) 42I-Hardening an Runtime-Ende.\npatch=base64.b64decode(Path('/tmp/dlb042i_patch.b64').read_text()).decode('utf-8')\nPath('/tmp/dlb042i_patch.js').write_text(patch,encoding='utf-8',newline='\\n')\nsubprocess.run(['node','--check','/tmp/dlb042i_patch.js'],check=True)\nmarker='/* DP13_PATCH_END */'\nif s.count(marker)!=1:\n    raise SystemExit(f'042I: DP13-Endmarker {s.count(marker)}x statt genau 1x.')\ns=s.replace(marker,patch+'\\n\\n'+marker,1)\nruntime.write_text(s,encoding='utf-8',newline='\\n')\nif runtime.suffix=='.js':\n    subprocess.run(['node','--check',str(runtime)],check=True)\n\n# D) SPFx-Version\npkg=Path('spfx-build/config/package-solution.json')\ndata=json.loads(pkg.read_text(encoding='utf-8'))\nold=data.get('solution',{}).get('version')\nif old!='1.3.6.144':\n    raise SystemExit(f'042I: erwartete 42H-SPFx-Version 1.3.6.144, gefunden {old!r}.')\ndata['solution']['version']='1.3.6.145'\npkg.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\\n',encoding='utf-8')\nprint('042I HARDENING PATCH OK:',runtime)\nPY_PATCH_042I\n"
    - name: Validate DLB-042I source before build
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PY_VALIDATE_042I'\nfrom pathlib import Path\nimport json, re, subprocess\n\nroot=Path('spfx-build/src/webparts')\nfiles=[p for p in root.rglob('*') if p.is_file() and p.suffix in {'.js','.ts','.tsx'}]\nhits=[]; combined=[]\nfor p in files:\n    s=p.read_text(encoding='utf-8');combined.append(s)\n    if '__DISPOLUX_042I' in s and \"version:'1.17.0.8'\" in s:hits.append((p,s))\nif len(hits)!=1:\n    raise SystemExit(f'042I VALIDIERUNG: Runtime {len(hits)}x statt genau 1x gefunden.')\nruntime,s=hits[0]\nall_text='\\n'.join(combined)\n\nrequired_basis=[\n    '__DISPOLUX_041J',\"version:'1.16.0.42'\",\n    '__DISPOLUX_042H',\"version:'1.17.0.7'\",\n    '__DISPOLUX_040C','function dp40cMasterMaterialRows','function dpR1MaterialOptions',\n    'plannedBinMaterials','actualBinMaterials','actualExistingBinMaterials',\n    'DispoLux:036D:offlineOutbox:v1'\n]\nmissing=[x for x in required_basis if x not in all_text]\nif missing: raise SystemExit('042I VALIDIERUNG Basis fehlt: '+', '.join(missing))\n\nrequired_fix=[\n    'DP_DLB_042I_1_17_0_8_HARDENING_BEGIN',\n    'Auftragserfassung und Disposition','Fahrauftrag',\n    'dp42iRemoveFixedRecovery','dp42iMountRecovery',\n    \"const dp42iBaseSaveOrder=(typeof saveOrder==='function')?saveOrder:null\",\n    'dp42iResolveCollision','planningConflictReason',\n    'dp42iMountDriverActivities','Haupttätigkeit','Zusatzqualifikationen',\n    'dp42iApplySelectedDate',\n    \"typeof dp40cMasterMaterialRows==='function'\",\n    'dp42iListBackups','dp42iSafetyBackup','dp42iVerify',\n    'requestedBins','dp42hSplitMultiBinOrder'\n]\nmissing=[x for x in required_fix if x not in s]\nif missing: raise SystemExit('042I VALIDIERUNG Fix fehlt: '+', '.join(missing))\n\n# Der feste 039B-Autostart darf nicht mehr vorhanden sein.\nfor bad in [\n    \"setTimeout(dp39InstallUi,4000);\",\n    \"else setTimeout(dp39InstallUi,1000);\"\n]:\n    if bad in s: raise SystemExit('042I VALIDIERUNG: fester Recovery-UI-Autostart noch aktiv: '+bad)\n\n# Materialliste darf NICHT wieder auf state.materials zurückfallen.\nmaterial=s[s.find('  function materialList(){',s.find('DP_DLB_042H_1_17_0_7')):s.find('\\n  function containerTypes()',s.find('  function materialList(){',s.find('DP_DLB_042H_1_17_0_7')))]\nif 'state?.materials' in material:\n    raise SystemExit('042I VALIDIERUNG: 42-Materialliste greift noch auf state.materials zu.')\nif 'dp40cMasterMaterialRows' not in material:\n    raise SystemExit('042I VALIDIERUNG: zentraler 040C-Materialstamm fehlt.')\n\nif runtime.suffix=='.js': subprocess.run(['node','--check',str(runtime)],check=True)\n\npkg=Path('spfx-build/config/package-solution.json')\ndata=json.loads(pkg.read_text(encoding='utf-8'))\nif data.get('solution',{}).get('version')!='1.3.6.145':\n    raise SystemExit('042I VALIDIERUNG: SPFx-Version ist nicht 1.3.6.145.')\nprint('042I SOURCE VALIDATION OK')\nPY_VALIDATE_042I\n"
    - name: Build and package DLB-042I
      shell: bash
      run: 'set -euo pipefail

        rm -rf spfx-build/release spfx-build/temp/deploy spfx-build/sharepoint/solution

        (cd spfx-build && npx heft build --production)

        (cd spfx-build && npx heft package-solution --production)

        rm -rf artifact/UPLOAD_TO_SITEASSETS artifact/UPLOAD_TO_APP_CATALOG

        mkdir -p artifact/UPLOAD_TO_SITEASSETS artifact/UPLOAD_TO_APP_CATALOG

        PKG=$(find spfx-build/sharepoint/solution -maxdepth 1 -type f -name ''*.sppkg'' | head -n1)

        test -n "$PKG"

        cp "$PKG" artifact/UPLOAD_TO_APP_CATALOG/DispoPilot_Online_V1.3_SPFX_FINAL.sppkg

