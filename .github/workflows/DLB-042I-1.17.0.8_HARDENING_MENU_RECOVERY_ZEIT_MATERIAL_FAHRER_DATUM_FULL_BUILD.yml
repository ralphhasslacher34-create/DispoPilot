      run: "set -euo pipefail\npython3 - <<'PY_VALIDATE_042H'\nfrom pathlib import Path\nimport json, subprocess\nroot=Path('spfx-build/src/webparts')\nfiles=[p for p in root.rglob('*') if p.is_file() and p.suffix in {'.js','.ts','.tsx'}]\nhits=[];combined=[]\nfor p in files:\n    s=p.read_text(encoding='utf-8');combined.append(s)\n    if '__DISPOLUX_042H' in s:hits.append((p,s))\nif len(hits)!=1: raise SystemExit(f'042H VALIDIERUNG: Patch {len(hits)}x statt genau 1x gefunden.')\nruntime,s=hits[0];alltext='\\n'.join(combined)\nbase=['__DISPOLUX_041J',\"version:'1.16.0.42'\",'__DISPOLUX_041I','dp41NetLive','dp41PlanDocs','DispoLux_Auftragsdokumente','dp42dDraft','dp42dCandidateText','Muldenlogistik bearbeiten','netWeightKg','btRecord','plannedBinMaterials','actualBinMaterials','actualExistingBinMaterials','DispoLux:036D:offlineOutbox:v1','Systemstandort','GPS-Standort']\nmissing=[x for x in base if x not in alltext]\nif missing: raise SystemExit('042H VALIDIERUNG Basis fehlt: '+', '.join(missing))\nreq=['__DISPOLUX_042H',\"version:'1.17.0.7'\",\"base:'DLB-041J-1.16.0.42'\",'dp42cSide','Auftragserfassung','Dispositionsliste','Dispositionsgrafik','Containerdienst','Transporte','Schüttgut','Fahrauftrag','Wer will wo was?','undisponiert','data-drop-driver','draggable=\"true\"','Stamm-LKW','plannedMinutes','Bestehende Detailfunktionen','In Arbeit','Unterbrochen','dp42cOpenIntake','dp42dDraft','dp42dRestoreDraft','dp42dCandidateText','Muldenlogistik bearbeiten','Auftragserfassung und Disposition','dp42gFormSnapshot','dp42gCapacity','dp42gWindowStatus','Kunden-Zeitfenster','Keine sichere Zusage – Disposition prüfen','dp42hInstallMenuObserver','dp42hMountAdminRecovery','dp42hSplitMultiBinOrder','requestedBins','dp42hReflowFollowing','Tätigkeitsfelder / Kapazität']\nmissing=[x for x in req if x not in s]\nif missing: raise SystemExit('042H VALIDIERUNG Architektur fehlt: '+', '.join(missing))\nbad=[x for x in ['__DISPOLUX_042A','__DISPOLUX_042B'] if x in s]\nif bad: raise SystemExit('042H VALIDIERUNG enthaelt verbotene Zwischenbuilds: '+', '.join(bad))\npkg=json.loads(Path('spfx-build/config/package-solution.json').read_text(encoding='utf-8'))\nif pkg.get('solution',{}).get('version')!='1.3.6.144': raise SystemExit('042H VALIDIERUNG: SPFx-Version ist nicht 1.3.6.144.')\nif runtime.suffix=='.js': subprocess.run(['node','--check',str(runtime)],check=True)\nprint('042H QUELLVALIDIERUNG OK')\nPY_VALIDATE_042H\n"
