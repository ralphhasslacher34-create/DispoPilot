          python3 - <<'PY_PATCH_041B'
          from pathlib import Path
          import base64, json, subprocess

          patch=base64.b64decode(Path('/tmp/dlb041b_patch.b64').read_text()).decode('utf-8')
          patch_file=Path('/tmp/dlb041b_patch.js')
          patch_file.write_text(patch,encoding='utf-8',newline='\n')
          subprocess.run(['node','--check',str(patch_file)],check=True)

          root=Path('spfx-build/src/webparts')
          files=[p for p in root.rglob('*') if p.is_file() and p.suffix in {'.js','.ts','.tsx'}]
          end_marker='/* DP13_PATCH_END */'
          marker='DP_DLB_041B_1_16_0_34_AUFTRAGSDETAIL_KACHELN_PLAYER_ZUSATZDATEN_BEGIN'
          required_base=[
              '__DISPOLUX_040C','__DISPOLUX_039B','__DISPOLUX_036D','__DISPOLUX_035B','__DISPOLUX_031G',
              'DP_DLB_036D_1_16_0_20_OFFLINE_OUTBOX_SYNC_BEGIN','DispoLux:036D:offlineOutbox:v1',
              'plannedBinMaterials','actualBinMaterials','actualExistingBinMaterials',
              'function openDetail','function setStatus','function confirmStatus',
              'function dpA3RenderConfirm','function dpA3Collect','dpA3ConfirmBins',
              'statusDisposed','dpStatusWarehouseWrap','dpNUModal','function openReport'
          ]
          hits=[]
          for p in files:
              src=p.read_text(encoding='utf-8')
              if end_marker in src and all(x in src for x in required_base):hits.append((p,src))
          if len(hits)!=1:
              raise SystemExit('041B: vollständige 040C-App-Runtime '+str(len(hits))+'x statt genau 1x gefunden: '+repr([str(p) for p,_ in hits]))
          runtime,src=hits[0]
          if marker in src:raise SystemExit('041B: Patch bereits vorhanden.')
          if src.count(end_marker)!=1:raise SystemExit(f'041B: DP13-Endmarker {src.count(end_marker)}x statt 1x.')
          src=src.replace(end_marker,patch+'\n\n'+end_marker,1)
          runtime.write_text(src,encoding='utf-8',newline='\n')
          if runtime.suffix=='.js':subprocess.run(['node','--check',str(runtime)],check=True)

          pkg=Path('spfx-build/config/package-solution.json')
          data=json.loads(pkg.read_text(encoding='utf-8'))
          old=data.get('solution',{}).get('version')
          if old!='1.3.6.126':raise SystemExit(f'041B: erwartete 040C-SPFx-Version 1.3.6.126, gefunden {old!r}.')
          data['solution']['version']='1.3.6.128'
          pkg.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('041B PATCH OK:',runtime)
          PY_PATCH_041B

      - name: Validate DLB-041B source before build
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_VALIDATE_041B'
          from pathlib import Path
          import json, subprocess

          root=Path('spfx-build/src/webparts')
          files=[p for p in root.rglob('*') if p.is_file() and p.suffix in {'.js','.ts','.tsx'}]
          begin='DP_DLB_041B_1_16_0_34_AUFTRAGSDETAIL_KACHELN_PLAYER_ZUSATZDATEN_BEGIN'
          end='DP_DLB_041B_1_16_0_34_AUFTRAGSDETAIL_KACHELN_PLAYER_ZUSATZDATEN_END'
          hits=[];all_text=[]
          for p in files:
              src=p.read_text(encoding='utf-8');all_text.append(src)
              if begin in src:hits.append((p,src))
          if len(hits)!=1:raise SystemExit(f'041B VALIDIERUNG: Patch {len(hits)}x statt genau 1x gefunden.')
          runtime,src=hits[0]
          if src.count(begin)!=1 or src.count(end)!=1:raise SystemExit('041B VALIDIERUNG: Patchmarker nicht eindeutig.')
          frag=src.split(begin,1)[1].split(end,1)[0]
          combined='\n'.join(all_text)

          basis_required=[
              '__DISPOLUX_040C','__DISPOLUX_039B','__DISPOLUX_036D','__DISPOLUX_035B','__DISPOLUX_031G',
              'DispoLux:036D:offlineOutbox:v1','avvMaterialCatalog-via-dpR1MaterialOptions',
              'plannedBinMaterials','actualBinMaterials','actualExistingBinMaterials','Tatsächlicher Inhalt',
              'dpA3ConfirmBins','statusDisposed','dpStatusWarehouseWrap','dpNUModal','Navigation zur Baustelle'
          ]
          missing=[x for x in basis_required if x not in combined]
          if missing:raise SystemExit('041B VALIDIERUNG Basis fehlt: '+', '.join(missing))

          fix_required=[
              "version:'1.16.0.34'","design:'tile-detail-v2'","locationModel:'system-location+gps-separated'",
              "timeModel:'segments+events+corrections+legacy-compatible'",'workSegments','workEvents','workTimeCorrections',
              'dp41QuickStart','dp41QuickPause','dp41Finish','dp41OpenExtra','dp41MountStatusFields','dp41SaveExtra',
              'Start','Pause','Weiter','Ausgeführt','Zusatzdaten','Nicht ausgeführt','Auftrag bearbeiten','Auftrag übernehmen',
              'Rapport','Unterschrift → PDF','Systemstandort','GPS-Standort','Mulde im Auftrag',
              'Zusatzinformation · bereits an der Baustelle','GPS-Standort speichern','GPS aktualisieren',
              'orderTimeEdit','dp41TimeEditAllowed','dp41PlannedMaterials','dp41PlanMat',
              'statusStart','statusEnd','statusPause','statusBins','statusLs','statusNote','statusDisposed','dpStatusWarehouse',
              'dpA3Collect','dp35ActualMat','body.querySelectorAll(':scope>.card:not(.dp41Card)')'
          ]
          missing=[x for x in fix_required if x not in frag]
          if missing:raise SystemExit('041B VALIDIERUNG Fix fehlt: '+', '.join(missing))

          safety=[
              'const dp41BaseSetStatus','const dp41BaseConfirmStatus','dp41BaseSetStatus('Ausgeführt')',
              'await dp41BaseConfirmStatus.apply(this,arguments)','await persist()','const dp41BaseOpenDetail',
              'dp41BaseOpenDetail.apply(this,arguments)','window.__DISPOLUX_031G?.setBinGps',
              "if(o.task!=='Tauschen')o.material=dp41Text(vals[0])"
          ]
          missing=[x for x in safety if x not in frag]
          if missing:raise SystemExit('041B VALIDIERUNG Sicherheitsverkettung fehlt: '+', '.join(missing))

          # Alte Start/Ausgeführt-Eingabemaske wird nicht mehr als Bedienweg gezeigt:
          # ihre bewährten Controls werden in Zusatzdaten umgehängt, damit die Abschlusslogik unverändert weiterarbeitet.
          if "target.appendChild(form)" not in frag or "oldBtn.style.display='none'" not in frag:
              raise SystemExit('041B VALIDIERUNG: Statusfelder wurden nicht sauber in Zusatzdaten übernommen.')
          if "sec.style.display='none'" not in frag:
              raise SystemExit('041B VALIDIERUNG: alte Bearbeitungsleiste wird nicht ausgeblendet.')

          pkg=json.loads(Path('spfx-build/config/package-solution.json').read_text(encoding='utf-8'))
          if pkg.get('solution',{}).get('version')!='1.3.6.128':raise SystemExit('041B VALIDIERUNG: SPFx-Version ist nicht 1.3.6.128.')
          if runtime.suffix=='.js':subprocess.run(['node','--check',str(runtime)],check=True)
          print('041B QUELLVALIDIERUNG OK')
          PY_VALIDATE_041B

      - name: Build and package DLB-041B
        shell: bash
        run: |
          set -euo pipefail
          rm -rf spfx-build/release spfx-build/temp/deploy spfx-build/sharepoint/solution
          (cd spfx-build && npx heft build --production)
          (cd spfx-build && npx heft package-solution --production)
          rm -rf artifact/UPLOAD_TO_SITEASSETS artifact/UPLOAD_TO_APP_CATALOG
          mkdir -p artifact/UPLOAD_TO_SITEASSETS artifact/UPLOAD_TO_APP_CATALOG
          PKG=$(find spfx-build/sharepoint/solution -maxdepth 1 -type f -name '*.sppkg' | head -n1)
          test -n "$PKG"
          cp "$PKG" artifact/UPLOAD_TO_APP_CATALOG/DispoPilot_Online_V1.3_SPFX_FINAL.sppkg
          if [ -d spfx-build/release/assets ]; then cp -a spfx-build/release/assets/. artifact/UPLOAD_TO_SITEASSETS/
          elif [ -d spfx-build/temp/deploy ]; then cp -a spfx-build/temp/deploy/. artifact/UPLOAD_TO_SITEASSETS/
          else echo '041B: Keine SPFx Asset-Ausgabe gefunden.' >&2; exit 1; fi

      - name: Validate emitted DLB-041B package
        shell: bash
        run: |
          set -euo pipefail
          COUNT=0
          while IFS= read -r -d '' JS; do test -s "$JS"; node --check "$JS"; COUNT=$((COUNT+1)); done < <(find artifact/UPLOAD_TO_SITEASSETS -maxdepth 1 -type f -name '*.js' -print0)
          test "$COUNT" -gt 0
          test -s artifact/UPLOAD_TO_APP_CATALOG/DispoPilot_Online_V1.3_SPFX_FINAL.sppkg

          python3 - <<'PY_FINAL_041B'
          from pathlib import Path
          js=list(Path('artifact/UPLOAD_TO_SITEASSETS').glob('*.js'));current=[]
          for p in js:
