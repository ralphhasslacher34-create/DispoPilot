          DLB031E_PATCH

          python3 - <<'PY_PATCH_031E'
          from pathlib import Path
          import base64

          files = (
              list(Path("spfx-build/src/webparts").rglob("*.js")) +
              list(Path("spfx-build/src/webparts").rglob("*.ts")) +
              list(Path("spfx-build/src/webparts").rglob("*.tsx"))
          )
          end_marker = "/* DP13_PATCH_END */"
          runtime_required = [
              "DP_K1B_BAUSTELLENADRESSE_BEGIN",
              "DP_X10_BEMERKUNGEN_RAPPORT_BEGIN"
          ]
          ah_marker = "DP_DLB_030AH_1_12_1_27_BACKUP_30MIN_FILES_BEGIN"

          # 030AH-Backup sitzt im SPFx-Hostcode, die eigentliche DispoLux-Runtime in app-runtime.js.
          # Deshalb 030AH global prüfen, aber NICHT fälschlich im Runtime-File verlangen.
          if not any(ah_marker in p.read_text(encoding="utf-8") for p in files):
              raise SystemExit("031E: 030AH-Basis global nicht gefunden: " + ah_marker)

          candidates = []
          for p in files:
              s = p.read_text(encoding="utf-8")
              if end_marker in s and all(x in s for x in runtime_required):
                  candidates.append(p)
          if len(candidates) != 1:
              raise SystemExit(f"031E: erwartete genau eine Runtime-Datei, gefunden: {[str(x) for x in candidates]}")

          p = candidates[0]
          s = p.read_text(encoding="utf-8")
          if "DP_DLB_031E_1_16_0_4_STANDORTE_NAVIGATION_BEGIN" in s:
              raise SystemExit("031E: Patch bereits vorhanden.")
          if s.count(end_marker) != 1:
              raise SystemExit(f"031E: DP13-Endmarker {s.count(end_marker)}x statt 1x.")
          for item in runtime_required:
              if item not in s:
                  raise SystemExit("031E: Runtime-Basis fehlt: " + item)

          patch = base64.b64decode(Path('/tmp/dlb031e_patch.b64').read_text().encode()).decode('utf-8')
          s = s.replace(end_marker, patch + "\n\n" + end_marker, 1)
          p.write_text(s, encoding="utf-8", newline="\n")
          print("031E gepatcht:", p)
          PY_PATCH_031E

      - name: Set 031E SPFx version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_VER_031E'
          from pathlib import Path
          p = Path("spfx-build/config/package-solution.json")
          s = p.read_text(encoding="utf-8")
          if "1.3.6.92" not in s:
              raise SystemExit("031E: erwartete 030AH-SPFx-Version 1.3.6.92 fehlt.")
          p.write_text(s.replace("1.3.6.92", "1.3.6.98", 1), encoding="utf-8", newline="\n")
          PY_VER_031E

      - name: Validate 031E source before build
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_VALIDATE_031E'
          from pathlib import Path
          import json, subprocess

          root = Path("spfx-build/src/webparts")
          files = [p for p in root.rglob("*") if p.is_file() and p.suffix in {".js", ".ts", ".tsx"}]
          if not files:
              raise SystemExit("031E VALIDIERUNG: keine SPFx-Quelldateien gefunden.")

          def texts():
              for p in files:
                  yield p, p.read_text(encoding="utf-8")

          ah_marker = "DP_DLB_030AH_1_12_1_27_BACKUP_30MIN_FILES_BEGIN"
          if not any(ah_marker in t for _, t in texts()):
              raise SystemExit("031E VALIDIERUNG: 030AH-Basismarker fehlt global.")
          print("OK 1/9: 030AH-Basis vorhanden")

          begin = "DP_DLB_031E_1_16_0_4_STANDORTE_NAVIGATION_BEGIN"
          end = "DP_DLB_031E_1_16_0_4_STANDORTE_NAVIGATION_END"
          hits = [(p, t) for p, t in texts() if begin in t]
          if len(hits) != 1:
              raise SystemExit(f"031E VALIDIERUNG: Standort-Patch in {len(hits)} Dateien gefunden statt genau 1: {[str(p) for p,_ in hits]}")
          runtime, source = hits[0]
          if end not in source:
              raise SystemExit("031E VALIDIERUNG: Endmarker des Standort-Patches fehlt in " + str(runtime))
          frag = source.split(begin, 1)[1].split(end, 1)[0]
          print("OK 2/9: 031E-Patch genau einmal in", runtime)

          required = [
              "cMapsUrlWrap",
              "dp31ESiteQrButton",
              "BarcodeDetector",
              "navigator.geolocation.getCurrentPosition",
              "Standort setzen",
              "Standort abrufen",
              "dp31ERenderAddressGps",
              "Navigation zur Baustelle",
              "__DISPOLUX_031E",
              "dp31ENavigation"
          ]
          missing = [x for x in required if x not in frag]
          if missing:
              raise SystemExit("031E VALIDIERUNG: Standort-Funktionen fehlen im Patch: " + ", ".join(missing))
          print("OK 3/9: QR, Navigation und Mulden-GPS vollständig enthalten")

          forbidden = ["new MutationObserver", "dp31ERefreshUi", "setInterval("]
          bad = [x for x in forbidden if x in frag]
          if bad:
              raise SystemExit("031E VALIDIERUNG: unzulässige Start-/Polling-Logik im neuen Patch: " + ", ".join(bad))
          print("OK 4/9: kein eigener DOM-Observer und keine Polling-Schleife")

          old_markers = [
              "DP_DLB_030AI_1_16_0_0_STANDORTE_NAVIGATION_BEGIN",
              "DP_DLB_030AJ_1_16_0_1_STANDORTE_NAVIGATION_BEGIN",
              "DP_DLB_030AK_1_16_0_2_STANDORTE_NAVIGATION_BEGIN",
              "DP_DLB_030AL_1_16_0_3_STANDORTE_NAVIGATION_BEGIN",
              "DP_DLB_031C_1_16_0_2_STANDORTE_NAVIGATION_BEGIN",
              "DP_DLB_031D_1_16_0_3_STANDORTE_NAVIGATION_BEGIN"
          ]
          old_hits = []
          for p, t in texts():
              for marker in old_markers:
                  if marker in t:
                      old_hits.append(f"{marker} in {p}")
          if old_hits:
              raise SystemExit("031E VALIDIERUNG: alte Standort-Patches in der rekonstruierten 030AH-Basis gefunden: " + "; ".join(old_hits))
          print("OK 5/9: keine alten 030AI/AJ/AK/AL/031C/031D-Standortpatches enthalten")

          pkg = Path("spfx-build/config/package-solution.json")
          if not pkg.exists():
              raise SystemExit("031E VALIDIERUNG: package-solution.json fehlt.")
          data = json.loads(pkg.read_text(encoding="utf-8"))
          version = data.get("solution", {}).get("version", "")
          if version != "1.3.6.98":
              raise SystemExit(f"031E VALIDIERUNG: SPFx-Version ist {version!r}, erwartet 1.3.6.98.")
          print("OK 6/9: SPFx-Version 1.3.6.98")

          if runtime.suffix == ".js":
              subprocess.run(["node", "--check", str(runtime)], check=True)
              print("OK 7/9: gepatchte Runtime besteht node --check")
          else:
              print("OK 7/9: Runtime ist TypeScript; Syntaxprüfung erfolgt im Heft-Build")

          # Start-Sicherheitscheck: der neue Patch darf beim Laden nur einmalig verdrahten,
          # aber weder persistieren noch GPS abfragen oder Daten laden.
          startup_forbidden = [
              "dp31ESetBinGps(",
              "navigator.geolocation.getCurrentPosition(resolve",
              "await persist()"
          ]
          # Diese Aufrufe sind innerhalb von Funktionen erlaubt; deshalb nur sicherstellen,
          # dass nach der letzten Funktionsdefinition kein direkter Aufruf davon steht.
          tail = frag[frag.rfind("if(typeof openDetail"):] if "if(typeof openDetail" in frag else frag
          direct_bad = [x for x in ["dp31ESetBinGps();", "dp31EPosition();", "persist();"] if x in tail]
          if direct_bad:
              raise SystemExit("031E VALIDIERUNG: direkter Startaufruf gefunden: " + ", ".join(direct_bad))
          print("OK 8/9: kein direkter GPS-/Persist-/Datenaufruf beim Start")

          for required_ui in ["Standort setzen","Standort abrufen","dp31ERenderAddressGps","dp31EShowBinGps"]:
              if required_ui not in frag:
                  raise SystemExit("031E VALIDIERUNG: Muldenstandort-Bedienung fehlt: "+required_ui)
          print("OK 9/9: Muldenstandort setzen und abrufen sind aktiv verdrahtet")
          PY_VALIDATE_031E

      - name: Build and package 031E
        shell: bash
        run: |
          set -euo pipefail
          (cd spfx-build && npx heft build --production)
          (cd spfx-build && npx heft package-solution --production)

          rm -rf artifact/UPLOAD_TO_SITEASSETS artifact/UPLOAD_TO_APP_CATALOG
          mkdir -p artifact/UPLOAD_TO_SITEASSETS artifact/UPLOAD_TO_APP_CATALOG
          PKG=$(find spfx-build/sharepoint/solution -maxdepth 1 -type f -name '*.sppkg' | head -n1)
          test -n "$PKG"
          cp "$PKG" artifact/UPLOAD_TO_APP_CATALOG/DispoPilot_Online_V1.3_SPFX_FINAL.sppkg

          if [ -d spfx-build/release/assets ]; then
            cp -a spfx-build/release/assets/. artifact/UPLOAD_TO_SITEASSETS/
          elif [ -d spfx-build/temp/deploy ]; then
            cp -a spfx-build/temp/deploy/. artifact/UPLOAD_TO_SITEASSETS/
          else
            echo "031E: Keine SPFx Asset-Ausgabe gefunden." >&2
            exit 1
          fi

          if [ -f .dpx14_icon_b64 ]; then
            python3 - <<'PY_ICON_031E'
          from pathlib import Path
          import base64
          Path("artifact/UPLOAD_TO_SITEASSETS/DispoLux_DL_Icon_48.png").write_bytes(base64.b64decode(Path(".dpx14_icon_b64").read_text().strip()))
          PY_ICON_031E
          fi

      - name: Validate emitted 031E package
        shell: bash
        run: |
          set -euo pipefail
          COUNT=0
          while IFS= read -r -d '' JS; do
            test -s "$JS"
            node --check "$JS"
            COUNT=$((COUNT+1))
          done < <(find artifact/UPLOAD_TO_SITEASSETS -maxdepth 1 -type f -name '*.js' -print0)
          test "$COUNT" -gt 0

          PKG=artifact/UPLOAD_TO_APP_CATALOG/DispoPilot_Online_V1.3_SPFX_FINAL.sppkg
          test -s "$PKG"
          grep -R -Fq 'Standort setzen' artifact/UPLOAD_TO_SITEASSETS
          grep -R -Fq 'Standort abrufen' artifact/UPLOAD_TO_SITEASSETS
          grep -R -Fq 'Navigation zur Baustelle' artifact/UPLOAD_TO_SITEASSETS

          echo "031E: Produktions-JS syntaktisch gültig, Standortfunktionen enthalten und SPPKG vorhanden."

          cat > artifact/REIHENFOLGE.txt <<'TXT'
          DLB-031E-1.16.0.4 · STANDORTE / NAVIGATION · SPFx 1.3.6.98

          Basis: DIREKT DLB-030AH-1.12.1.27. Die Fehlversuche AI/AJ/AK/AL/031C werden NICHT als Basis verwendet.

          Standorte / Navigation:
          - 031E enthält keinen eigenen MutationObserver und greift nicht in den Start-/DP_Data-Ladevorgang ein.
          - Kunden-/Rechnungsadresse: Handeingabe oder Maps-Link.
          - Baustellenadresse: Handeingabe, Maps-Link oder QR-Code.
          - QR-Code wird clientseitig gelesen; Maps-/Standort-Link oder erkennbare Adresse wird in die vorhandenen Baustellenfelder übernommen.
          - Navigation zur Baustelle: vorhandene Baustellen-Schaltfläche öffnet den gespeicherten Maps-Link; falls keiner vorhanden ist, wird aus der postalischen Baustellenadresse ein Google-Maps-Navigationsziel erzeugt.
          - Muldenstandort: ausschließlich über „GPS-Punkt setzen“ in DispoLux. Gespeichert werden Breite/Länge, Genauigkeit, Zeitpunkt und Benutzer an der Mulde.
          - Muldenstandort ist wieder sichtbar bedienbar: „Standort setzen“ und „Standort abrufen“; zusätzlich im Muldenstamm und am Auftrag, wenn eine Mulde zugeordnet ist.
          - Keine manuelle GPS-Koordinateneingabe und kein QR-/Maps-Eingabeweg für den Muldenstandort.
          - Die bisher gesperrte Mulden-GPS-Erweiterung wird aktiv genutzt: Standort setzen speichert den Geräte-GPS-Punkt, Standort abrufen öffnet den gespeicherten Punkt.

          Unverändert übernommen:
          - DLB-030AH Dateisicherung in DispoLux_Backup alle 30 Minuten, 54 h Aufbewahrung.
          - DP_Data bleibt frei von DPB|-Backupdatensätzen.
          - Bestehende Auftrags-, Arbeitszeit-, Mulden-, Dokument- und Benutzerlogik bleibt Basis.

          Test 031E:
          0. Starttest: DispoLux muss bis zum Hauptmenü laden; DP_Data-Ladehinweis muss verschwinden.
          1. Kundenadresse: manuell speichern; Maps-Link speichern; nach erneutem Öffnen prüfen.
          2. Baustelle: manuelle Adresse speichern; Maps-Link speichern; QR-Bild mit Maps-Link einlesen; QR-Bild mit Adresse einlesen.
          3. Auftrag öffnen: „Navigation zur Baustelle“ muss direkt Maps öffnen; ohne Maps-Link muss die postalische Baustellenadresse verwendet werden.
          4. Mulde im Muldenstamm öffnen: „Standort setzen“ drücken, Standortfreigabe erteilen, Punkt speichern und „Standort abrufen“ prüfen.
          5. Auftrag mit zugeordneter Mulde öffnen: „Standort setzen“ und „Standort abrufen“ für die richtige Mulde prüfen.
          6. Aufträge, Arbeitszeiten, Muldenbewegungen und 30-Minuten-Backup gegenprüfen.

          Installation wie bisher:
          1. UPLOAD_TO_SITEASSETS
          2. UPLOAD_TO_APP_CATALOG/DispoPilot_Online_V1.3_SPFX_FINAL.sppkg
          3. DispoLux auf allen Geräten/Tabs vollständig schließen und frisch öffnen.
          TXT

