          DLB031G_PATCH

          python3 - <<'PY_PATCH_031G'
          from pathlib import Path
          import base64

          files = (
              list(Path("spfx-build/src/webparts").rglob("*.js")) +
              list(Path("spfx-build/src/webparts").rglob("*.ts")) +
              list(Path("spfx-build/src/webparts").rglob("*.tsx"))
          )
          end_marker = "/* DP13_PATCH_END */"
          runtime_required = [
              "DP_K1B_BAUSTELLENADRESSE_BEGIN",
              "DP_X10_BEMERKUNGEN_RAPPORT_BEGIN"
          ]
          ah_marker = "DP_DLB_030AH_1_12_1_27_BACKUP_30MIN_FILES_BEGIN"

          # 030AH-Backup sitzt im SPFx-Hostcode, die eigentliche DispoLux-Runtime in app-runtime.js.
          # Deshalb 030AH global prüfen, aber NICHT fälschlich im Runtime-File verlangen.
          if not any(ah_marker in p.read_text(encoding="utf-8") for p in files):
              raise SystemExit("031G: 030AH-Basis global nicht gefunden: " + ah_marker)

          candidates = []
          for p in files:
              s = p.read_text(encoding="utf-8")
              if end_marker in s and all(x in s for x in runtime_required):
                  candidates.append(p)
          if len(candidates) != 1:
              raise SystemExit(f"031G: erwartete genau eine Runtime-Datei, gefunden: {[str(x) for x in candidates]}")

          p = candidates[0]
          s = p.read_text(encoding="utf-8")
          if "DP_DLB_031G_1_16_0_6_STANDORTE_NAVIGATION_BEGIN" in s:
              raise SystemExit("031G: Patch bereits vorhanden.")
          if s.count(end_marker) != 1:
              raise SystemExit(f"031G: DP13-Endmarker {s.count(end_marker)}x statt 1x.")
          for item in runtime_required:
              if item not in s:
                  raise SystemExit("031G: Runtime-Basis fehlt: " + item)

          patch = base64.b64decode(Path('/tmp/dlb031g_patch.b64').read_text().encode()).decode('utf-8')
          s = s.replace(end_marker, patch + "\n\n" + end_marker, 1)
          p.write_text(s, encoding="utf-8", newline="\n")
          print("031G gepatcht:", p)
          PY_PATCH_031G

      - name: Set 031G SPFx version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_VER_031G'
          from pathlib import Path
          p = Path("spfx-build/config/package-solution.json")
          s = p.read_text(encoding="utf-8")
          if "1.3.6.92" not in s:
              raise SystemExit("031G: erwartete 030AH-SPFx-Version 1.3.6.92 fehlt.")
          p.write_text(s.replace("1.3.6.92", "1.3.6.100", 1), encoding="utf-8", newline="\n")
          PY_VER_031G

      - name: Validate 031G source before build
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_VALIDATE_031G'
          from pathlib import Path
          import json, subprocess

          root = Path("spfx-build/src/webparts")
          files = [p for p in root.rglob("*") if p.is_file() and p.suffix in {".js", ".ts", ".tsx"}]
          if not files:
              raise SystemExit("031G VALIDIERUNG: keine SPFx-Quelldateien gefunden.")

          def texts():
              for p in files:
                  yield p, p.read_text(encoding="utf-8")

          ah_marker = "DP_DLB_030AH_1_12_1_27_BACKUP_30MIN_FILES_BEGIN"
          if not any(ah_marker in t for _, t in texts()):
              raise SystemExit("031G VALIDIERUNG: 030AH-Basismarker fehlt global.")
          print("OK 1/13: 030AH-Basis vorhanden")

          begin = "DP_DLB_031G_1_16_0_6_STANDORTE_NAVIGATION_BEGIN"
          end = "DP_DLB_031G_1_16_0_6_STANDORTE_NAVIGATION_END"
          hits = [(p, t) for p, t in texts() if begin in t]
          if len(hits) != 1:
              raise SystemExit(f"031G VALIDIERUNG: Standort-Patch in {len(hits)} Dateien gefunden statt genau 1: {[str(p) for p,_ in hits]}")
          runtime, source = hits[0]
          if end not in source:
              raise SystemExit("031G VALIDIERUNG: Endmarker des Standort-Patches fehlt in " + str(runtime))
          frag = source.split(begin, 1)[1].split(end, 1)[0]
          print("OK 2/13: 031G-Patch genau einmal in", runtime)

          required = [
              "cMapsUrlWrap", "dp31GSiteQrButton", "BarcodeDetector",
              "navigator.geolocation.getCurrentPosition", "Standort setzen", "Standort abrufen",
              "dp31GRenderAddressGps", "Navigation zur Baustelle", "__DISPOLUX_031G", "dp31GNavigation",
              "gpsCurrent=true", "gpsInvalidatedAt", "dp31GBasePersist", "dp31GBaseLoadState",
              "dp31GBaseRenderBins", "tile.openstreetmap.org", "Alle Typen", "Standort fehlt / nicht aktuell"
          ]
          missing = [x for x in required if x not in frag]
          if missing:
              raise SystemExit("031G VALIDIERUNG: Funktionen fehlen im Patch: " + ", ".join(missing))
          print("OK 3/13: QR, Navigation, GPS-Lebenszyklus und Muldenkarte vollständig enthalten")

          forbidden = ["new MutationObserver", "dp31GRefreshUi", "setInterval("]
          bad = [x for x in forbidden if x in frag]
          if bad:
              raise SystemExit("031G VALIDIERUNG: unzulässige Start-/Polling-Logik im neuen Patch: " + ", ".join(bad))
          print("OK 4/13: kein eigener DOM-Observer und keine Polling-Schleife")

          old_markers = [
              "DP_DLB_030AI_1_16_0_0_STANDORTE_NAVIGATION_BEGIN",
              "DP_DLB_030AJ_1_16_0_1_STANDORTE_NAVIGATION_BEGIN",
              "DP_DLB_030AK_1_16_0_2_STANDORTE_NAVIGATION_BEGIN",
              "DP_DLB_030AL_1_16_0_3_STANDORTE_NAVIGATION_BEGIN",
              "DP_DLB_031C_1_16_0_2_STANDORTE_NAVIGATION_BEGIN",
              "DP_DLB_031D_1_16_0_3_STANDORTE_NAVIGATION_BEGIN",
              "DP_DLB_031E_1_16_0_4_STANDORTE_NAVIGATION_BEGIN",
              "DP_DLB_031F_1_16_0_5_STANDORTE_NAVIGATION_BEGIN"
          ]
          old_hits = []
          for p, t in texts():
              for marker in old_markers:
                  if marker in t:
                      old_hits.append(f"{marker} in {p}")
          if old_hits:
              raise SystemExit("031G VALIDIERUNG: alte Standort-Patches in der rekonstruierten 030AH-Basis gefunden: " + "; ".join(old_hits))
          print("OK 5/13: keine alten AI/AJ/AK/AL/031C/031D/031E/031F-Standortpatches enthalten")

          pkg = Path("spfx-build/config/package-solution.json")
          if not pkg.exists():
              raise SystemExit("031G VALIDIERUNG: package-solution.json fehlt.")
          data = json.loads(pkg.read_text(encoding="utf-8"))
          version = data.get("solution", {}).get("version", "")
          if version != "1.3.6.100":
              raise SystemExit(f"031G VALIDIERUNG: SPFx-Version ist {version!r}, erwartet 1.3.6.100.")
          print("OK 6/13: SPFx-Version 1.3.6.100")

          if runtime.suffix == ".js":
              subprocess.run(["node", "--check", str(runtime)], check=True)
              print("OK 7/13: gepatchte Runtime besteht node --check")
          else:
              print("OK 7/13: Runtime ist TypeScript; Syntaxprüfung erfolgt im Heft-Build")

          tail = frag[frag.rfind("if(typeof openDetail"):] if "if(typeof openDetail" in frag else frag
          direct_bad = [x for x in ["dp31GSetBinGps();", "dp31GPosition();", "persist();"] if x in tail]
          if direct_bad:
              raise SystemExit("031G VALIDIERUNG: direkter GPS-/Persist-Aufruf beim Start gefunden: " + ", ".join(direct_bad))
          print("OK 8/13: kein direkter GPS-/Persist-/Datenaufruf beim Start")

          for required_ui in ["Standort setzen","Standort abrufen","dp31GRenderAddressGps","dp31GShowBinGps"]:
              if required_ui not in frag:
                  raise SystemExit("031G VALIDIERUNG: Muldenstandort-Bedienung fehlt: "+required_ui)
          print("OK 9/13: Muldenstandort setzen und abrufen sind aktiv verdrahtet")

          lifecycle = ["dp31GLogicalLocationKey","dp31GInvalidateMovedGps","gpsCurrent=false","gpsInvalidatedReason","dp31GMovementReason"]
          miss = [x for x in lifecycle if x not in frag]
          if miss:
              raise SystemExit("031G VALIDIERUNG: GPS-Ungültigkeitslogik fehlt: "+", ".join(miss))
          print("OK 10/13: alter GPS-Punkt wird nach Standortwechsel als nicht aktuell markiert")

          map_required = ["dp31GInstallBinMapUi","dp31GRenderBinMap","dp31GWorldPoint","tile.openstreetmap.org","Alle Typen","Standort fehlt / nicht aktuell"]
          miss = [x for x in map_required if x not in frag]
          if miss:
              raise SystemExit("031G VALIDIERUNG: Muldenkarten-Funktion fehlt: "+", ".join(miss))
          print("OK 11/13: Mulden suchen besitzt Liste/Karte, Typfilter und Fehlstand-Anzeige")

          if "dp31GPlacedBins" not in frag or "Beim Kunden" not in frag:
              raise SystemExit("031G VALIDIERUNG: Kartenfilter für aktuell gestellte Mulden fehlt.")
          print("OK 12/13: Karte beschränkt sich auf aktuell gestellte Mulden")

          if "referrerPolicy='no-referrer'" in frag or 'referrerPolicy=\"no-referrer\"' in frag:
              raise SystemExit("031G VALIDIERUNG: OSM-Referer wird weiterhin unterdrückt.")
          if '© OpenStreetMap contributors' not in frag:
              raise SystemExit("031G VALIDIERUNG: OSM-Contributor-Attribution fehlt.")
          print("OK 13/13: OSM-Referer bleibt erhalten und Attribution ist vollständig")
          PY_VALIDATE_031G

