          elif [ -d spfx-build/temp/deploy ]; then
            cp -a spfx-build/temp/deploy/. artifact/UPLOAD_TO_SITEASSETS/
          else
            echo "031G: Keine SPFx Asset-Ausgabe gefunden." >&2
            exit 1
          fi

