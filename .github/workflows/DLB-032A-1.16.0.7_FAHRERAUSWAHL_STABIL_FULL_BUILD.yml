          DLB-032A-1.16.0.7 · TD-005 FAHRERAUSWAHL STABIL · SPFx 1.3.6.101

          Basisfunktionalität: vollständig aus dem erfolgreichen DLB-031G-1.16.0.6 rekonstruiert (dessen Basis bleibt 030AH).

          TD-005 Fahrerauswahl:
          - Native Fahrer-Select bleibt als internes Datenfeld oDriver erhalten.
