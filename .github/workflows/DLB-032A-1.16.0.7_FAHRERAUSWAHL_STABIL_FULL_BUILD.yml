          python3 - <<'PY_PATCH_032A'
          from pathlib import Path
          import base64

          files = (
              list(Path("spfx-build/src/webparts").rglob("*.js")) +
              list(Path("spfx-build/src/webparts").rglob("*.ts")) +
              list(Path("spfx-build/src/webparts").rglob("*.tsx"))
          )
          end_marker = "/* DP13_PATCH_END */"
          base_marker = "DP_DLB_031G_1_16_0_6_STANDORTE_NAVIGATION_BEGIN"
          new_marker = "DP_DLB_032A_1_16_0_7_TD005_FAHRERAUSWAHL_BEGIN"

          candidates=[]
          for p in files:
              src=p.read_text(encoding="utf-8")
              if base_marker in src and end_marker in src and "function fillSelects" in src and "oDriver" in src:
                  candidates.append(p)
          if len(candidates)!=1:
              raise SystemExit(f"032A: erwartete genau eine 031G-Runtime mit Fahrerauswahl, gefunden: {[str(x) for x in candidates]}")

          p=candidates[0]
          src=p.read_text(encoding="utf-8")
          if new_marker in src:
              raise SystemExit("032A: Patch bereits vorhanden.")
          if src.count(end_marker)!=1:
              raise SystemExit(f"032A: DP13-Endmarker {src.count(end_marker)}x statt 1x.")

          patch=base64.b64decode(Path('/tmp/dlb032a_patch.b64').read_text().encode()).decode('utf-8')
          src=src.replace(end_marker,patch+"\n\n"+end_marker,1)
          p.write_text(src,encoding="utf-8",newline="\n")
          print("032A Fahrerauswahl gepatcht:",p)
          PY_PATCH_032A

      - name: Set 032A SPFx version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_VER_032A'
          from pathlib import Path
          p=Path("spfx-build/config/package-solution.json")
          src=p.read_text(encoding="utf-8")
          if "1.3.6.100" not in src:
              raise SystemExit("032A: erwartete 031G-SPFx-Version 1.3.6.100 fehlt.")
          p.write_text(src.replace("1.3.6.100","1.3.6.101",1),encoding="utf-8",newline="\n")
          PY_VER_032A

      - name: Validate 032A Fahrerauswahl before build
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_VALIDATE_032A'
          from pathlib import Path
          import json, subprocess

          root=Path("spfx-build/src/webparts")
          files=[p for p in root.rglob("*") if p.is_file() and p.suffix in {".js",".ts",".tsx"}]
          begin="DP_DLB_032A_1_16_0_7_TD005_FAHRERAUSWAHL_BEGIN"
          end="DP_DLB_032A_1_16_0_7_TD005_FAHRERAUSWAHL_END"
          hits=[]
          for p in files:
              src=p.read_text(encoding="utf-8")
              if begin in src:hits.append((p,src))
          if len(hits)!=1:
              raise SystemExit(f"032A VALIDIERUNG: Patch in {len(hits)} Dateien statt genau 1 gefunden: {[str(p) for p,_ in hits]}")
          runtime,src=hits[0]
          if end not in src:
              raise SystemExit("032A VALIDIERUNG: Endmarker fehlt.")
          frag=src.split(begin,1)[1].split(end,1)[0]
          print("OK 1/10: 032A-Patch genau einmal in",runtime)

          required=[
              "dp32AInstallDriverPicker","dp32ADriverButton","dp32ADriverMenu",
              "dp32ASelectDriver","dp32ABaseFillSelects","dp32ABaseOpenM",
              "orderModal","touch-action:manipulation","min-height:48px",
              "sel.style.display='none'","dispatchEvent(new Event('change'",
              "__DISPOLUX_032A"
          ]
          missing=[x for x in required if x not in frag]
          if missing:raise SystemExit("032A VALIDIERUNG: Pflichtbestandteile fehlen: "+", ".join(missing))
          print("OK 2/10: eigener touch-tauglicher Fahrer-Picker vollständig enthalten")

          forbidden=["new MutationObserver","setInterval(","replaceWith(","sel.remove("]
          bad=[x for x in forbidden if x in frag]
          if bad:raise SystemExit("032A VALIDIERUNG: unzulässige Logik im Patch: "+", ".join(bad))
          print("OK 3/10: kein Observer/Polling und natives oDriver-Datenfeld wird nicht entfernt")

          if "orderOpen&&after" not in frag or "after.value=previous" not in frag:
              raise SystemExit("032A VALIDIERUNG: Schutz der aktuellen Fahrerauswahl bei fillSelects fehlt.")
          print("OK 4/10: geöffnete Fahrerauswahl bleibt bei Refresh erhalten")

          if "if(String(id)==='orderModal')dp32ARefreshDriverPicker()" not in frag:
              raise SystemExit("032A VALIDIERUNG: Synchronisierung beim Öffnen des Auftragsdialogs fehlt.")
          print("OK 5/10: sichtbarer Fahrerwert wird nach Öffnen des Auftragsdialogs synchronisiert")

          if "role="listbox"" not in frag or "role','option'" not in frag or "aria-selected" not in frag:
              raise SystemExit("032A VALIDIERUNG: Listbox-/Option-Semantik fehlt.")
          print("OK 6/10: Fahrer-Liste besitzt eindeutige Auswahlsemantik")

          pkg=Path("spfx-build/config/package-solution.json")
          data=json.loads(pkg.read_text(encoding="utf-8"))
          version=data.get("solution",{}).get("version","")
          if version!="1.3.6.101":raise SystemExit(f"032A VALIDIERUNG: SPFx-Version {version!r} statt 1.3.6.101")
          print("OK 7/10: SPFx-Version 1.3.6.101")

          if runtime.suffix==".js":
              subprocess.run(["node","--check",str(runtime)],check=True)
          print("OK 8/10: gepatchte Runtime besteht Syntaxprüfung")

          if "DP_DLB_031G_1_16_0_6_STANDORTE_NAVIGATION_BEGIN" not in src:
              raise SystemExit("032A VALIDIERUNG: 031G-Basis fehlt in Runtime.")
          for marker in ["dp31GRenderBinMap","Standort setzen","Standort abrufen","Navigation zur Baustelle"]:
              if marker not in src:raise SystemExit("032A VALIDIERUNG: 031G-Funktion fehlt: "+marker)
          print("OK 9/10: 031G Standort-/Kartenfunktionen bleiben enthalten")

          if src.count(begin)!=1 or src.count(end)!=1:
              raise SystemExit("032A VALIDIERUNG: Patchmarker nicht eindeutig.")
          print("OK 10/10: 032A eindeutig und ohne Doppelpatch")
          PY_VALIDATE_032A

      - name: Build and package 032A
        shell: bash
        run: |
          set -euo pipefail
          (cd spfx-build && npx heft build --production)
          (cd spfx-build && npx heft package-solution --production)

          rm -rf artifact/UPLOAD_TO_SITEASSETS artifact/UPLOAD_TO_APP_CATALOG
          mkdir -p artifact/UPLOAD_TO_SITEASSETS artifact/UPLOAD_TO_APP_CATALOG
          PKG=$(find spfx-build/sharepoint/solution -maxdepth 1 -type f -name '*.sppkg' | head -n1)
          test -n "$PKG"
          cp "$PKG" artifact/UPLOAD_TO_APP_CATALOG/DispoPilot_Online_V1.3_SPFX_FINAL.sppkg

          if [ -d spfx-build/release/assets ]; then
