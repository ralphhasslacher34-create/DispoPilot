          - Filter: Alle Typen oder ein Muldentyp; die bestehende Suche grenzt zusätzlich nach Muldennummer, Kunde oder Baustelle ein.
          - Gestellte Mulden ohne aktuellen GPS-Punkt erscheinen separat als „Standort fehlt / nicht aktuell“ und können direkt geöffnet werden.
          - Kartenmarker zeigen Muldennummer. Auswahl zeigt Typ, Kunde/Baustelle, GPS-Zeitpunkt und Navigation.
          - Kartenbasis: OpenStreetMap-Kacheln, ohne API-Schlüssel. Die Karte wird erst beim Umschalten auf „Karte“ aufgebaut.
