          old_head="const name=String(window.DP_AUTH.displayName||window.DP_AUTH.email||'').trim();"
          new_head="const appDriverName=(r==='fahrer')?String(state?.user?.name||state?.user?.displayName||'').trim():'';\n    const name=String(appDriverName||window.DP_AUTH.displayName||window.DP_AUTH.email||'').trim();"
          if t.count(old_head)<1:
              raise SystemExit("DLB-022H: X12-Kopfzeilen-Name nicht gefunden.")
          t=t.replace(old_head,new_head,1)

          # Auch beim erneuten Einladen soll bei Fahrern der DispoLux-Fahrername
          # Vorrang vor dem Microsoft-Anzeigenamen haben.
          t=t.replace(
              "row?.Benutzer?.Title||row?.Title||row?.Fahrername||'Mitarbeiter'",
              "row?.Fahrername||row?.Title||row?.Benutzer?.Title||'Mitarbeiter'"
          )
          t=t.replace(
              "person.Title||row?.Title||row?.Fahrername||'Mitarbeiter'",
              "row?.Fahrername||row?.Title||person.Title||'Mitarbeiter'"
          )

          patch_marker="""/* DP_DLB_022H_1_5_1_16_PEOPLEPICKER_FAHRERNAME_FIX_BEGIN */
          /*
            - PeoplePicker akzeptiert Objekt-, String-, Array- und doppelt serialisierte Antworten.
            - Graph-Einladung läuft vor der SharePoint-Auflösung.
            - Fahrer-Kopf bevorzugt den in DispoLux geführten Fahrernamen.
          */
          /* DP_DLB_022H_1_5_1_16_PEOPLEPICKER_FAHRERNAME_FIX_END */
          """

          if t.count(marker)!=1:
              raise SystemExit(f"DLB-022H: DP13-Endmarker {t.count(marker)}x gefunden statt 1x.")
          t=t.replace(marker,patch_marker+"\n"+marker,1)

          p.write_text(t,encoding="utf-8",newline="\n")
