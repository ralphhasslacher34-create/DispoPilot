          grep -Fq 'window.dpDLB27ARefreshOrderDocuments' dispopilot-online-efd.html

      - name: Apply DLB-027F-1.11.1.5 ResourcePath Upload Fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_DLB27F'
          from pathlib import Path
          p=Path('dispopilot-online-efd.html')
          if not p.exists():
              raise SystemExit('DLB-027F: dispopilot-online-efd.html fehlt.')
          t=p.read_text(encoding='utf-8')
          required=[
              'DP_DLB_027E_1_11_1_4_AUFTRAGSDOKUMENTE_UPLOAD_FIX_BEGIN',
              "GetFolderByServerRelativePath(decodedUrl='",
              'DispoLux_Auftragsdokumente'
          ]
          for item in required:
              if item not in t:
                  raise SystemExit('DLB-027F: erforderliche Basis fehlt: '+item)
          if 'DP_DLB_027F_1_11_1_5_RESOURCEPATH_UPLOAD_FIX_BEGIN' in t:
              raise SystemExit('DLB-027F: Patch bereits vorhanden.')

          old_comment="// POST .../GetFolderByServerRelativeUrl(...)/Files/add(...), Binärdaten im Body."
          new_comment="// ResourcePath durchgängig: bestätigten Ordner auch beim Binär-Upload nicht mehr auf die alte URL-API zurückkonvertieren."
          old_url='const uploadUrl=w+"/_api/web/GetFolderByServerRelativeUrl(\'"+odata(confirmed)+"\')/Files/add(url=\'"+odata(name)+"\',overwrite=false)";'
          new_url='const uploadUrl=w+"/_api/web/GetFolderByServerRelativePath(decodedUrl=\'"+odata(confirmed)+"\')/Files/AddUsingPath(decodedUrl=\'"+odata(name)+"\',overwrite=false)";'
          old_error="Uploadstufe: Files/add"
          new_error="Uploadstufe: ResourcePath Files/AddUsingPath"

          if t.count(old_url)!=1:
              raise SystemExit(f'DLB-027F: alte Upload-URL {t.count(old_url)}x gefunden statt 1x.')
          t=t.replace(old_comment,new_comment,1)
          t=t.replace(old_url,new_url,1)
          t=t.replace(old_error,new_error,1)

          marker='/* DP13_PATCH_END */'
          if t.count(marker)!=1:
              raise SystemExit(f'DLB-027F: DP13-Endmarker {t.count(marker)}x gefunden statt 1x.')
          note=(
              '/* DP_DLB_027F_1_11_1_5_RESOURCEPATH_UPLOAD_FIX_BEGIN */\n'
              '/*\n'
              '  - 027D/027E konnten den Zielordner bereits erfolgreich per ResourcePath bestätigen.\n'
              '  - 027E wechselte beim Datei-POST fälschlich zurück auf GetFolderByServerRelativeUrl/Files.add.\n'
              '  - 027F verwendet für den Binär-Upload denselben bestätigten ResourcePath.\n'
              '  - GetFolderByServerRelativePath(...)/Files/AddUsingPath(...).\n'
              '  - Keine Änderung an Dokumentbibliothek, TEST/ECHT-Trennung, Auftragszuordnung oder 11.1.\n'
              '*/\n'
              '/* DP_DLB_027F_1_11_1_5_RESOURCEPATH_UPLOAD_FIX_END */\n'
          )
          t=t.replace(marker,note+'\n'+marker,1)
          p.write_text(t,encoding='utf-8',newline='\n')
          print('DLB-027F-1.11.1.5: Datei-Upload vollständig auf ResourcePath Files/AddUsingPath umgestellt.')
          PY_DLB27F

          grep -Fq 'DP_DLB_027F_1_11_1_5_RESOURCEPATH_UPLOAD_FIX_BEGIN' dispopilot-online-efd.html
          grep -Fq "GetFolderByServerRelativePath(decodedUrl='" dispopilot-online-efd.html
          grep -Fq "/Files/AddUsingPath(decodedUrl='" dispopilot-online-efd.html
          grep -Fq 'Uploadstufe: ResourcePath Files/AddUsingPath' dispopilot-online-efd.html


      - name: Apply DLB-027G-1.11.1.6 Browser API Upload Fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_DLB27G'
          from pathlib import Path
          p=Path('dispopilot-online-efd.html')
          if not p.exists():
              raise SystemExit('DLB-027G: dispopilot-online-efd.html fehlt.')
          t=p.read_text(encoding='utf-8')
          required=[
              'DP_DLB_027F_1_11_1_5_RESOURCEPATH_UPLOAD_FIX_BEGIN',
              'DispoLux_Auftragsdokumente',
              "GetFolderByServerRelativePath(decodedUrl='"
          ]
          for item in required:
              if item not in t:
                  raise SystemExit('DLB-027G: erforderliche Basis fehlt: '+item)
          if 'DP_DLB_027G_1_11_1_6_BROWSER_API_UPLOAD_FIX_BEGIN' in t:
              raise SystemExit('DLB-027G: Patch bereits vorhanden.')

          old_url='const uploadUrl=w+"/_api/web/GetFolderByServerRelativePath(decodedUrl=\'"+odata(confirmed)+"\')/Files/AddUsingPath(decodedUrl=\'"+odata(name)+"\',overwrite=false)";'
          new_url='const uploadUrl=w+"/_api/web/GetFolderByServerRelativePath(DecodedUrl=@a1)/Files/AddUsingPath(DecodedUrl=@a2,overwrite=@a3,AutoCheckoutOnInvalidData=@a4)?@a1=\'"+odata(confirmed)+"\'&@a2=\'"+odata(name)+"\'&@a3=false&@a4=true";'
          old_error='Uploadstufe: ResourcePath Files/AddUsingPath'
          new_error='Uploadstufe: SharePoint Browser-API Files/AddUsingPath'

          if t.count(old_url)!=1:
              raise SystemExit(f'DLB-027G: alte 027F-Upload-URL {t.count(old_url)}x gefunden statt 1x.')
          t=t.replace(old_url,new_url,1)
          if t.count(old_error)!=1:
              raise SystemExit(f'DLB-027G: alte Fehlerkennung {t.count(old_error)}x gefunden statt 1x.')
          t=t.replace(old_error,new_error,1)

          marker='/* DP13_PATCH_END */'
          if t.count(marker)!=1:
              raise SystemExit(f'DLB-027G: DP13-Endmarker {t.count(marker)}x gefunden statt 1x.')
          note=(
              '/* DP_DLB_027G_1_11_1_6_BROWSER_API_UPLOAD_FIX_BEGIN */\n'
              '/*\n'
              '  - Zielordner bleibt der bereits von SharePoint bestätigte ResourcePath.\n'
              '  - Datei-POST verwendet die von SharePoint Online selbst verwendete REST-Signatur mit OData-Parameteraliasen.\n'
              '  - Exakte Form: GetFolderByServerRelativePath(DecodedUrl=@a1)/Files/AddUsingPath(DecodedUrl=@a2,overwrite=@a3,AutoCheckoutOnInvalidData=@a4).\n'
              '  - Keine Änderung an Ordnererzeugung, TEST/ECHT, Auftragszuordnung oder HT 11.1.\n'
              '*/\n'
              '/* DP_DLB_027G_1_11_1_6_BROWSER_API_UPLOAD_FIX_END */\n'
          )
          t=t.replace(marker,note+'\n'+marker,1)
          p.write_text(t,encoding='utf-8',newline='\n')
          print('DLB-027G-1.11.1.6: Datei-Upload auf exakte SharePoint-Online-Browser-REST-Signatur umgestellt.')
          PY_DLB27G

          grep -Fq 'DP_DLB_027G_1_11_1_6_BROWSER_API_UPLOAD_FIX_BEGIN' dispopilot-online-efd.html
          grep -Fq 'GetFolderByServerRelativePath(DecodedUrl=@a1)/Files/AddUsingPath(DecodedUrl=@a2,overwrite=@a3,AutoCheckoutOnInvalidData=@a4)' dispopilot-online-efd.html
          grep -Fq "?@a1='" dispopilot-online-efd.html
          grep -Fq "&@a2='" dispopilot-online-efd.html
          grep -Fq '&@a3=false&@a4=true' dispopilot-online-efd.html
          grep -Fq 'Uploadstufe: SharePoint Browser-API Files/AddUsingPath' dispopilot-online-efd.html
          if grep -Fq "/Files/AddUsingPath(decodedUrl='" dispopilot-online-efd.html; then echo 'Fehler: 027F Inline-Signatur noch aktiv.' >&2; exit 1; fi

      - name: Apply DLB-027H-1.11.1.7 RootFolder Upload Fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_DLB27H'
          from pathlib import Path
          import re,base64
          p=Path('dispopilot-online-efd.html')
          if not p.exists():
              raise SystemExit('DLB-027H: dispopilot-online-efd.html fehlt.')
          t=p.read_text(encoding='utf-8')
          required=['DP_DLB_027G_1_11_1_6_BROWSER_API_UPLOAD_FIX_BEGIN','DispoLux_Auftragsdokumente','SharePoint Browser-API Files/AddUsingPath']
          for item in required:
              if item not in t:
                  raise SystemExit('DLB-027H: erforderliche Basis fehlt: '+item)
          if 'DP_DLB_027H_1_11_1_7_ROOT_UPLOAD_FIX_BEGIN' in t:
              raise SystemExit('DLB-027H: Patch bereits vorhanden.')
          new_upload=base64.b64decode('').decode('utf-8')
          new_parse=base64.b64decode('').decode('utf-8')
          new_list=base64.b64decode('').decode('utf-8')
          t,n=re.subn(r"  async function uploadBinary\(folder,name,file\)\{.*?\n  \}\n\n  async function libraryInfo",new_upload+"\n\n  async function libraryInfo",t,count=1,flags=re.S)
          if n!=1:
              raise SystemExit(f'DLB-027H: uploadBinary-Block {n}x ersetzt statt 1x.')
          t,n=re.subn(r"  function categoryFromName\(name\)\{.*?\n  \}\n  function originalFromName\(name\)\{.*?\n  \}",new_parse,t,count=1,flags=re.S)
          if n!=1:
              raise SystemExit(f'DLB-027H: Dateinamensparser {n}x ersetzt statt 1x.')
          t,n=re.subn(r"  async function listFiles\(orderId\)\{.*?\n  \}\n\n  function setBusy",new_list+"\n\n  function setBusy",t,count=1,flags=re.S)
          if n!=1:
              raise SystemExit(f'DLB-027H: listFiles-Block {n}x ersetzt statt 1x.')
          old_folder="      const folder=await orderFolder(orderId);"
          if t.count(old_folder)!=1:
              raise SystemExit(f'DLB-027H: orderFolder-Aufruf {t.count(old_folder)}x gefunden statt 1x.')
          t=t.replace(old_folder,"      await ensureLibrary();",1)
          old_name="        const name=storedName(file,category);"
          new_name="        const name=modeName()+'__Auftrag_'+String(orderId)+'__'+storedName(file,category);"
          if t.count(old_name)!=1:
              raise SystemExit(f'DLB-027H: storedName-Aufruf {t.count(old_name)}x gefunden statt 1x.')
          t=t.replace(old_name,new_name,1)
          old_call="        await uploadBinary(folder,name,file);"
          if t.count(old_call)!=1:
              raise SystemExit(f'DLB-027H: alter uploadBinary-Aufruf {t.count(old_call)}x gefunden statt 1x.')
          t=t.replace(old_call,"        await uploadBinary(name,file);",1)
          marker='/* DP13_PATCH_END */'
          if t.count(marker)!=1:
              raise SystemExit(f'DLB-027H: DP13-Endmarker {t.count(marker)}x gefunden statt 1x.')
          note='/* DP_DLB_027H_1_11_1_7_ROOT_UPLOAD_FIX_BEGIN */\n/* RootFolder/Files/Add; TEST/ECHT + Auftrags-ID im Dateinamen; keine Unterordner-Schreiboperation. */\n/* DP_DLB_027H_1_11_1_7_ROOT_UPLOAD_FIX_END */\n'
          t=t.replace(marker,note+'\n'+marker,1)
          p.write_text(t,encoding='utf-8',newline='\n')
          print('DLB-027H-1.11.1.7: Dokument-Upload auf dokumentierten List.RootFolder/Files/Add-Weg umgestellt.')
          PY_DLB27H

          grep -Fq 'DP_DLB_027H_1_11_1_7_ROOT_UPLOAD_FIX_BEGIN' dispopilot-online-efd.html
          grep -Fq "/RootFolder/Files/Add(url='" dispopilot-online-efd.html
          grep -Fq "modeName()+'__Auftrag_'+String(orderId)+'__'+storedName" dispopilot-online-efd.html
          grep -Fq "startsWith(prefix)" dispopilot-online-efd.html
          grep -Fq 'Uploadstufe: List.RootFolder/Files/Add' dispopilot-online-efd.html
          if grep -Fq 'await uploadBinary(folder,name,file);' dispopilot-online-efd.html; then echo 'Fehler: alter Unterordner-Uploadaufruf noch aktiv.' >&2; exit 1; fi

      # Buildweg unverändert aus der zuletzt funktionierenden Version übernommen.
      - name: Install SPFx CLI
        run: npm install -g @microsoft/spfx-cli@latest

      - name: Scaffold SPFx web part
        run: |
          rm -rf spfx-build
          spfx create \
            --template webpart-noframework \
            --library-name dispopilot-online-v13 \
            --component-name "DispoPilot Online" \
            --component-alias DispoPilotOnline \
            --component-description "DispoPilot Online V1.3" \
            --solution-name dispopilot-online-v13 \
            --target-dir spfx-build \
            --package-manager npm

