          t=p.read_text(encoding='utf-8')
          marker='/* DP13_PATCH_END */'
          required=[
              'DP_DLB_026A_1_11_0_0_KOMMUNIKATIONSSTATUS_PLANUNG_BEGIN',
              'DP_V1_TESTBETRIEB_ABWESEND_BEGIN',
              'DP_F3_POPUP_LOGIK_BEGIN'
          ]
