          patch=base64.b64decode(Path('/tmp/dlb27a_patch.b64').read_text().encode()).decode('utf-8')
          t=t.replace(marker,patch+'\n'+marker,1)
          p.write_text(t,encoding='utf-8',newline='\n')
          print('DLB-027E-1.11.1.4: bestätigter SharePoint-Ordner wird direkt per Files/add mit Binärinhalt beschrieben.')
          PY_DLB27A

          grep -Fq 'DP_DLB_027E_1_11_1_4_AUFTRAGSDOKUMENTE_UPLOAD_FIX_BEGIN' dispopilot-online-efd.html
          grep -Fq 'DispoLux_Auftragsdokumente' dispopilot-online-efd.html
          grep -Fq "/Files/add(url='" dispopilot-online-efd.html
          grep -Fq 'Folders/AddUsingPath' dispopilot-online-efd.html
          grep -Fq 'GetFolderByServerRelativePath' dispopilot-online-efd.html
          grep -Fq 'SharePoint-Ordner wurde nach dem Anlegen nicht gefunden' dispopilot-online-efd.html
          grep -Fq 'Uploadstufe: Files/add' dispopilot-online-efd.html
          grep -Fq 'SharePoint-Datei konnte im bestätigten Ordner nicht gespeichert werden.' dispopilot-online-efd.html
