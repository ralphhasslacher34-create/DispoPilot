      - name: Apply DLB-028B-1.12.1.0 Datensicherung + Datenintegritaet PROD
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_DLB28A'
          from pathlib import Path
          import re

          files=list(Path('spfx-build/src/webparts').rglob('*.ts'))
          candidates=[]
          for f in files:
              s=f.read_text(encoding='utf-8')
              if 'BaseClientSideWebPart' in s and re.search(r'public\s+render\s*\(\s*\)\s*:\s*void\s*\{',s):
                  candidates.append(f)
          if len(candidates)!=1:
              raise SystemExit(f'DLB-028B: {len(candidates)} WebPart-Dateien gefunden statt 1.')
          p=candidates[0]
          s=p.read_text(encoding='utf-8')
          if 'DP_DLB_028B_1_12_1_0_DATENSICHERUNG_DATENINTEGRITAET_BEGIN' in s:
              raise SystemExit('DLB-028B: Patch bereits vorhanden.')
          if "SPHttpClient" not in s or "@microsoft/sp-http" not in s:
              base="import { BaseClientSideWebPart } from '@microsoft/sp-webpart-base';"
              if base not in s:
                  raise SystemExit('DLB-028B: Importanker nicht gefunden.')
              s=s.replace(base,base+"\nimport { SPHttpClient } from '@microsoft/sp-http';",1)
          anchor="    const host = this.domElement.querySelector('.dp-spfx-host') as HTMLDivElement;"
          if s.count(anchor)!=1:
              raise SystemExit(f'DLB-028B: Hostanker {s.count(anchor)}x gefunden statt 1x.')
          patch=r'''
            /* DP_DLB_028B_1_12_1_0_DATENSICHERUNG_DATENINTEGRITAET_BEGIN */
            const dp28bWindow: any = window as any;
            if (!dp28bWindow.__DISPOLUX_DATA_GUARD_028B) {
              Reflect.set(dp28bWindow, '__DISPOLUX_DATA_GUARD_028B', true);
              const dp28bContext: any = this.context as any;
              const dp28bList = 'DP_Data';
              const dp28bBackupPrefix = 'DPB|';
              const dp28bBackupIntervalMs = 2 * 60 * 60 * 1000;
              const dp28bRetentionMs = 54 * 60 * 60 * 1000;
              const dp28bCheckIntervalMs = 10 * 60 * 1000;
              const dp28bWebUrl = (): string => String(dp28bContext.pageContext.web.absoluteUrl || '').replace(/\/$/, '');
              const dp28bEsc = (v: string): string => String(v || '').replace(/'/g, "''");
              const dp28bHeaders: any = {
                'Accept': 'application/json;odata=nometadata',
                'Content-Type': 'application/json;odata=nometadata'
              };

              const dp28bWarn = (message: string): void => {
                try {
                  let box = host.querySelector('#dp28bDataWarning') as HTMLDivElement | null;
                  if (!box) {
                    box = document.createElement('div');
                    box.id = 'dp28bDataWarning';
                    box.style.cssText = 'display:none;margin:0 0 8px 0;padding:9px 12px;border:2px solid #b91c1c;border-radius:9px;background:#fef2f2;color:#7f1d1d;font:700 13px Arial,sans-serif';
                    host.insertBefore(box, host.firstChild);
                  }
                  box.textContent = message;
                  box.style.display = message ? 'block' : 'none';
                } catch (_) {}
              };

              const dp28bGet = async (url: string): Promise<any> => {
                const response: any = await dp28bContext.spHttpClient.get(
                  url,
                  SPHttpClient.configurations.v1,
                  { headers: { 'Accept': 'application/json;odata=nometadata', 'Cache-Control': 'no-cache' } }
                );
                if (!response.ok) {
                  const detail = await response.text();
                  throw new Error(`GET ${response.status}: ${detail.slice(0,500)}`);
                }
                return response.json();
              };

              const dp28bPost = async (url: string, body?: any, extra?: any): Promise<any> => {
                const headers: any = { ...dp28bHeaders, ...(extra || {}) };
                const options: any = { headers };
                if (body !== undefined) options.body = typeof body === 'string' ? body : JSON.stringify(body);
                const response: any = await dp28bContext.spHttpClient.post(
                  url,
                  SPHttpClient.configurations.v1,
                  options
                );
                if (!response.ok) {
                  const detail = await response.text();
                  throw new Error(`POST ${response.status}: ${detail.slice(0,700)}`);
                }
                const text = await response.text();
                if (!text) return {};
                try { return JSON.parse(text); } catch (_) { return {}; }
              };

              const dp28bDelete = async (id: number): Promise<void> => {
                await dp28bPost(
                  `${dp28bWebUrl()}/_api/web/lists/getbytitle('${dp28bEsc(dp28bList)}')/items(${id})`,
                  undefined,
                  { 'IF-MATCH': '*', 'X-HTTP-Method': 'DELETE' }
                );
              };

              const dp28bFields = async (): Promise<any> => {
                const data = await dp28bGet(`${dp28bWebUrl()}/_api/web/lists/getbytitle('${dp28bEsc(dp28bList)}')/fields?$select=Title,InternalName,TypeAsString&$top=5000`);
                const fields: any[] = Array.isArray(data.value) ? data.value : [];
                const norm = (v: any): string => String(v || '').replace(/_x005f_/gi,'_').replace(/\s+/g,'_').toLowerCase();
                const find = (name: string): any => fields.find(x => norm(x.Title) === norm(name)) || fields.find(x => norm(x.InternalName) === norm(name));
                const typ = find('DP_Typ') || find('Wert');
                const daten = find('DP_Daten');
                if (!typ || !daten) throw new Error('DP_Typ oder DP_Daten in DP_Data nicht gefunden.');
                return { typ: String(typ.InternalName), daten: String(daten.InternalName) };
              };

              const dp28bLoadRows = async (fields: any): Promise<any[]> => {
                let url = `${dp28bWebUrl()}/_api/web/lists/getbytitle('${dp28bEsc(dp28bList)}')/items?$select=Id,Title,${encodeURIComponent(fields.typ)},${encodeURIComponent(fields.daten)}&$top=5000`;
                const rows: any[] = [];
                while (url) {
                  const data = await dp28bGet(url);
                  const part: any[] = Array.isArray(data.value) ? data.value : [];
                  for (const x of part) rows.push({
                    Id: Number(x.Id || x.ID || 0),
                    Title: String(x.Title || ''),
                    DP_Typ: String(x[fields.typ] || ''),
                    DP_Daten: String(x[fields.daten] || '')
                  });
                  url = String(data['@odata.nextLink'] || data?.d?.__next || '');
                }
                return rows;
              };

              const dp28bCreateRow = async (fields: any, title: string, typ: string, daten: string): Promise<void> => {
                const body: any = { Title: title };
                body[fields.typ] = typ;
                body[fields.daten] = daten;
                await dp28bPost(`${dp28bWebUrl()}/_api/web/lists/getbytitle('${dp28bEsc(dp28bList)}')/items`, body);
              };

              const dp28bStamp = (d: Date): string => d.toISOString().replace(/[-:.]/g,'');

              const dp28bBackup = async (fields: any, rows: any[], force: boolean = false): Promise<void> => {
                const now = Date.now();
                const backupRows = rows.filter(x => String(x.Title || '').startsWith(dp28bBackupPrefix));
                const metas = backupRows.filter(x => String(x.DP_Typ || '') === 'backupMeta');
                let latest = 0;
                for (const meta of metas) {
                  try {
                    const parsed = JSON.parse(String(meta.DP_Daten || '{}'));
                    if (parsed && parsed.complete === true) latest = Math.max(latest, Date.parse(String(parsed.capturedAt || '')) || 0);
                  } catch (_) {}
                }
                if (!force && latest > 0 && now - latest < dp28bBackupIntervalMs) return;

                const live = rows.filter(x => String(x.Title || '').startsWith('DP|'));
                const stamp = dp28bStamp(new Date(now));
                let cursor = 0;
                let copied = 0;
                const worker = async (): Promise<void> => {
                  while (true) {
                    const i = cursor++;
                    if (i >= live.length) return;
                    const row = live[i];
                    const backupTitle = `${dp28bBackupPrefix}${stamp}|${row.Id}|${row.Title}`;
                    if (backupTitle.length > 255) throw new Error('Backup-Titel zu lang: ' + row.Title);
                    await dp28bCreateRow(fields, backupTitle, `backup|${row.DP_Typ}`, row.DP_Daten);
                    copied++;
                  }
                };
                await Promise.all([worker(), worker(), worker()]);
                await dp28bCreateRow(
                  fields,
                  `${dp28bBackupPrefix}${stamp}|__meta`,
                  'backupMeta',
                  JSON.stringify({
                    complete: true,
                    capturedAt: new Date(now).toISOString(),
                    sourceList: dp28bList,
                    recordCount: copied,
                    intervalHours: 2,
                    retentionHours: 54,
                    build: 'DLB-028B-1.12.1.0'
                  })
                );

                // Erst NACH erfolgreichem neuen Snapshot alte vollständige Sicherungen entfernen.
                const staleStamps = new Set<string>();
                for (const meta of metas) {
                  try {
                    const parsed = JSON.parse(String(meta.DP_Daten || '{}'));
                    const ts = Date.parse(String(parsed.capturedAt || '')) || 0;
                    if (parsed && parsed.complete === true && ts > 0 && now - ts >= dp28bRetentionMs) {
                      const parts = String(meta.Title || '').split('|');
                      if (parts.length >= 3) staleStamps.add(parts[1]);
                    }
                  } catch (_) {}
                }
                if (staleStamps.size) {
                  const stale = backupRows.filter(x => {
                    const parts = String(x.Title || '').split('|');
                    return parts.length >= 3 && staleStamps.has(parts[1]);
                  });
                  let di = 0;
                  const delWorker = async (): Promise<void> => {
                    while (true) {
                      const i = di++;
                      if (i >= stale.length) return;
                      await dp28bDelete(stale[i].Id);
                    }
                  };
                  await Promise.all([delWorker(), delWorker(), delWorker()]);
                }
                console.info(`DispoLux Backup ${stamp}: ${copied} Datensätze gesichert.`);
              };

              const dp28bIntegrity = async (fields: any, rows: any[]): Promise<void> => {
                const live = rows.filter(x => String(x.Title || '').startsWith('DP|'));
                const byTitle = new Map<string, number>();
                live.forEach(x => byTitle.set(x.Title, (byTitle.get(x.Title) || 0) + 1));
                const duplicateTitles = Array.from(byTitle.entries()).filter(x => x[1] > 1).map(x => x[0]);

                const singletonTypes = ['meta','drivers','vehicles','customers','sites','documents','archiveOrders','archiveTimeEntries','bins','binMovements','materials','settings'];
                const singletonProblems: string[] = [];
                for (const typ of singletonTypes) {
                  const typed = live.filter(x => String(x.DP_Typ || '') === typ);
                  const expected = `DP|${typ}`;
                  if (typed.length > 1 || typed.some(x => x.Title !== expected)) singletonProblems.push(`${typ}(${typed.length})`);
                }

                if (duplicateTitles.length || singletonProblems.length) {
                  const bits: string[] = [];
                  if (duplicateTitles.length) bits.push('doppelte Schlüssel: ' + duplicateTitles.slice(0,6).join(', '));
                  if (singletonProblems.length) bits.push('Singleton-Konflikte: ' + singletonProblems.join(', '));
                  dp28bWarn('DATENWARNUNG – ' + bits.join(' · ') + '. Bitte keine Datenbereinigung automatisch durchführen.');
                  return;
                }
                dp28bWarn('');

                // Datenbankseitiger Schutz: Title wird eindeutig. Läuft als Admin einmal erfolgreich
                // und schützt danach auch Schreibvorgänge anderer Benutzer vor neuen Dubletten.
                try {
                  await dp28bPost(
                    `${dp28bWebUrl()}/_api/web/lists/getbytitle('${dp28bEsc(dp28bList)}')/fields/getbyinternalnameortitle('Title')`,
                    { Indexed: true, EnforceUniqueValues: true },
                    { 'IF-MATCH': '*', 'X-HTTP-Method': 'MERGE' }
                  );
                } catch (e) {
                  // Fahrer/Gäste haben i.d.R. keine Listenverwaltungsrechte. Der einmalige Admin-Lauf genügt.
                  console.warn('DispoLux Titelschutz konnte in diesem Benutzerkontext nicht gesetzt werden.', e);
                }
              };

              const dp28bRun = async (force: boolean = false): Promise<void> => {
                if (dp28bWindow.__DISPOLUX_DATA_GUARD_028B_RUNNING) return;
                Reflect.set(dp28bWindow, '__DISPOLUX_DATA_GUARD_028B_RUNNING', true);
                try {
                  const fields = await dp28bFields();
                  const rows = await dp28bLoadRows(fields);
                  // Sicherung immer vor Integritäts-/Schemaänderungen.
                  await dp28bBackup(fields, rows, force);
                  await dp28bIntegrity(fields, rows);
                } catch (e) {
                  console.error('DispoLux Datensicherung/Datenintegrität', e);
                  dp28bWarn('DATENSICHERUNG FEHLGESCHLAGEN – ' + String((e as any)?.message || e || 'unbekannter Fehler'));
                } finally {
                  Reflect.set(dp28bWindow, '__DISPOLUX_DATA_GUARD_028B_RUNNING', false);
                }
              };

              dp28bWindow.dpDispoLuxBackupNow = (): Promise<void> => dp28bRun(true);
              dp28bRun(false).catch((e: unknown) => console.error('DispoLux Datensicherung Start', e));
              Reflect.set(dp28bWindow, '__DISPOLUX_DATA_GUARD_028B_TIMER', window.setInterval(() => { dp28bRun(false).catch((e: unknown) => console.error('DispoLux Datensicherung Intervall', e)); }, dp28bCheckIntervalMs));
            }
            /* DP_DLB_028B_1_12_1_0_DATENSICHERUNG_DATENINTEGRITAET_END */
          '''
          s=s.replace(anchor,anchor+'\n'+patch,1)
          p.write_text(s,encoding='utf-8',newline='\n')

          # Neue interne SPFx-Version fuer den Produktions-Hotfix.
          cfgs=list(Path('spfx-build/config').glob('package-solution.json'))
          if len(cfgs)!=1:
              raise SystemExit(f'DLB-028B: package-solution.json {len(cfgs)}x gefunden.')
          cfg=cfgs[0]
          c=cfg.read_text(encoding='utf-8')
          if '1.3.6.60' not in c:
              raise SystemExit('DLB-028B: Basisversion 1.3.6.60 nicht gefunden.')
          c=c.replace('1.3.6.60','1.3.6.61',1)
          cfg.write_text(c,encoding='utf-8',newline='\n')
          PY_DLB28A

          grep -R -q 'DP_DLB_028B_1_12_1_0_DATENSICHERUNG_DATENINTEGRITAET_BEGIN' spfx-build/src/webparts
          grep -R -q "const dp28bBackupIntervalMs = 2 \* 60 \* 60 \* 1000" spfx-build/src/webparts
          grep -R -q "const dp28bRetentionMs = 54 \* 60 \* 60 \* 1000" spfx-build/src/webparts
          grep -R -q "EnforceUniqueValues: true" spfx-build/src/webparts
          grep -R -q "dp28bBackupPrefix = 'DPB|'" spfx-build/src/webparts
          grep -R -q "dpDispoLuxBackupNow" spfx-build/src/webparts
          grep -Fq '1.3.6.61' spfx-build/config/package-solution.json

          # Nach dem 028B-Patch Produktionsbundle und SPPKG neu erzeugen.
          (cd spfx-build && npx heft build --production)
          (cd spfx-build && npx heft package-solution --production)

          rm -rf artifact/UPLOAD_TO_SITEASSETS artifact/UPLOAD_TO_APP_CATALOG
          mkdir -p artifact/UPLOAD_TO_SITEASSETS artifact/UPLOAD_TO_APP_CATALOG
          PKG=$(find spfx-build/sharepoint/solution -maxdepth 1 -type f -name '*.sppkg' | head -n 1)
          test -n "$PKG"
          cp "$PKG" artifact/UPLOAD_TO_APP_CATALOG/DispoPilot_Online_V1.3_SPFX_FINAL.sppkg
          if [ -d "spfx-build/release/assets" ]; then
            cp -a spfx-build/release/assets/. artifact/UPLOAD_TO_SITEASSETS/
          elif [ -d "spfx-build/temp/deploy" ]; then
            cp -a spfx-build/temp/deploy/. artifact/UPLOAD_TO_SITEASSETS/
          else
            echo "Keine SPFx Asset-Ausgabe gefunden." >&2
            exit 1
          fi
          if [ -f .dpx14_icon_b64 ]; then
            python3 - <<'PY_ICON'
          from pathlib import Path
          import base64
          b64=Path('.dpx14_icon_b64').read_text(encoding='ascii').strip()
          Path('artifact/UPLOAD_TO_SITEASSETS/DispoLux_DL_Icon_48.png').write_bytes(base64.b64decode(b64))
          PY_ICON
          fi

          cat > artifact/REIHENFOLGE.txt <<'TXT'
          DLB-028B-1.12.1.0 · BUILD-FIX · PROD Datensicherung + Datenintegrität · SPFx intern 1.3.6.61
          Basis: DLB-027H-1.11.1.7 / SPFx 1.3.6.60. SiteAssets + SPPKG ersetzen.

          PROD-SCHUTZ:
          - DP_Data wird beim ersten Öffnen und danach spätestens alle 2 Stunden gesichert.
          - Sicherungen liegen als DPB|-Datensätze in DP_Data und werden von DispoLux selbst ignoriert.
          - Jeder Snapshot wird erst nach vollständigem Kopieren durch backupMeta als vollständig markiert.
          - Alte vollständige Snapshots werden frühestens nach 54 Stunden entfernt.
          - Title wird bei einem konfliktfreien Admin-Lauf auf eindeutig/indexiert gesetzt; neue doppelte DP|-Schlüssel werden damit SharePoint-seitig verhindert.
          - Zusätzlich werden doppelte DP|-Titel und problematische Singleton-Typen sichtbar als DATENWARNUNG gemeldet.
          - Bei Fehlern wird niemals automatisch eine vermeintliche Dublette gelöscht.
          - Manuelle Sofortsicherung technisch verfügbar: window.dpDispoLuxBackupNow().

          TEST PROD:
          1. Als Admin DispoLux PROD öffnen und 10-30 Sekunden warten.
          2. DP_Data prüfen: neue Zeilen mit Prefix DPB| müssen vorhanden sein, inklusive genau einer backupMeta-Zeile für den Snapshot.
          3. DispoLux normal benutzen; Kunden, Baustellen, Planung, Archiv, Mulden und Arbeitszeiten kurz prüfen.
          4. Seite neu laden: innerhalb von 2 Stunden darf kein zweiter vollständiger Snapshot entstehen.
          5. Nach Ablauf von 2 Stunden bzw. späterem Öffnen muss ein neuer vollständiger Snapshot entstehen.
          6. Bestehende Dubletten NICHT automatisch bereinigen; bei Konflikten erscheint DATENWARNUNG.
          TXT

          cat > artifact/DATENSICHERUNG_028B_BUILD_FIX.txt <<'TXT'
          DispoLux 028B – Build-Fix Datensicherung / Datenintegrität (PROD)

          Intervall: 2 Stunden
          Prüfung: alle 10 Minuten solange DispoLux geöffnet ist, zusätzlich sofort beim Öffnen
          Mindestaufbewahrung: 54 Stunden
          Sicherungsquelle: DP_Data
          Sicherungspräfix: DPB|
          Schutz vor neuen Dubletten: SharePoint Title = Indexed + EnforceUniqueValues (einmaliger Admin-Lauf)
          Verhalten bei vorhandenen Dubletten: Warnung, keine automatische Löschung
          TXT

      - name: Write DispoLux Themenregister
        shell: bash
        run: |
          set -euo pipefail
          cat > artifact/DISPOLUX_THEMENREGISTER.csv <<'CSV'
          Hauptthema;Themenbereich;Produktversionsreihe;DLB-Bereich;Status;Bemerkung
          4;Arbeitszeitauswertung;1.4.x.x;DLB-018;Bestehend;Soll/Ist und Arbeitszeitauswertung
          5;Personen / Benutzer / Rollen;1.5.x.x;DLB-019/020/022/024;Aktiv;Benutzer Rollen Berechtigungen Mitarbeiterzugang und Fahrer-Synchronisation
          6;Personalplanung;1.6.x.x;;Bestehend;Einsatzplanung und Prüfhinweise
          7;E-Mail-Funktion;1.7.x.x;;Bestehend;PDF Übergabe und E-Mail-Funktionen
          8;Mulden-Auftrag-Bugfix;1.8.x.x;DLB-021;Bestehend;Muldennummer und Muldentyp im Auftrag
          9;Muldenlogik;1.9.x.x;DLB-023;Aktiv;Spontane Erfassung und Reservierungslogik inkl. Reservierungsabgleich
          10;Auftrag abschließen / Abschlusslogik;1.10.x.x;DLB-025;Aktiv;Automatische Vorbelegung tatsächlich geleert bei LS oder Gewicht mit manueller Übersteuerung
          11;Interaktion und Kommunikation innerhalb DispoLux;1.11.x.x;DLB-026/027;Aktiv;11.1 Änderungs-Popup und Quittierungsstatus; 11.2 auftragsbezogene Bilder, Scans und PDFs in SharePoint
          12;Datensicherung & Datenintegrität;1.12.x.x;DLB-028;Aktiv;12.1 automatische 2-Stunden-Snapshots, Mindestaufbewahrung 54 Stunden und Schutz vor neuen doppelten Titeln
          CSV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DLB-028B-1.12.1.0-DATENSICHERUNG-DATENINTEGRITAET-PROD-SPFX-1.3.6.61
          path: artifact/
          if-no-files-found: error
