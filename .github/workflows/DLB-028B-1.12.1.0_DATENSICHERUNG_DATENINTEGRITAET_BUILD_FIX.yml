      - name: Apply DLB-022D-1.5.1.12 Mitarbeiter Einladung Diagnose Fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_DLB22D'
          from pathlib import Path
          import re
          
          p=Path("dispopilot-online-efd.html")
          if not p.exists():
              raise SystemExit("DLB-022D: dispopilot-online-efd.html fehlt.")
          
          t=p.read_text(encoding="utf-8")
          marker="/* DP13_PATCH_END */"
          
          if t.count(marker)!=1:
              raise SystemExit(f"DLB-022D: DP13-Endmarker {t.count(marker)}x gefunden statt 1x.")
          
          for required in [
              "DP_DLB_020A_1_5_1_0_MITARBEITERVERWALTUNG_BEGIN",
              "DP_DLB_020D_1_5_1_3_MITARBEITERLISTE_DIREKTFIX_BEGIN",
              "DP_DLB_022B_1_5_1_10_MITARBEITER_EINLADUNG_FIX_BEGIN"
          ]:
              if required not in t:
                  raise SystemExit("DLB-022D: erforderliche Basis fehlt: "+required)
          
          if "DP_DLB_022D_1_5_1_12_MITARBEITER_EINLADUNG_DIAGNOSE_FIX_BEGIN" in t:
              raise SystemExit("DLB-022D: Patch bereits vorhanden.")
          
          # SharePoint-PeoplePicker benutzen statt ein bereits "aufgelöstes"
          # Benutzerobjekt selbst zu erfinden.
          share_pat=re.compile(
              r"  async function shareSite\(name,email,sendEmail=true\)\{.*?\n  \}\n\n  async function ensureOrInvite",
              re.S
          )
          if not share_pat.search(t):
              raise SystemExit("DLB-022D: shareSite-Funktion nicht gefunden.")
          
          share_replacement=r"""  async function resolvePeoplePicker(email){
              const w=webUrl();
              const data=await postJson(
                w+'/_api/SP.UI.ApplicationPages.ClientPeoplePickerWebServiceInterface.clientPeoplePickerResolveUser',
                {
                  queryParams:{
                    __metadata:{type:'SP.UI.ApplicationPages.ClientPeoplePickerQueryParameters'},
                    AllowEmailAddresses:true,
                    AllowMultipleEntities:false,
                    AllUrlZones:false,
                    MaximumEntitySuggestions:10,
                    PrincipalSource:15,
                    PrincipalType:1,
                    QueryString:email
                  }
                }
              );
          
              const raw=
                data?.ClientPeoplePickerResolveUser ??
                data?.d?.ClientPeoplePickerResolveUser ??
                '';
          
              let list=[];
              try{
                list=typeof raw==='string'?JSON.parse(raw):(Array.isArray(raw)?raw:[]);
              }catch(e){
                throw new Error('SharePoint PeoplePicker lieferte keine lesbare Antwort.');
              }
          
              if(!Array.isArray(list)||!list.length){
                throw new Error('SharePoint PeoplePicker konnte '+email+' nicht auflösen.');
              }
          
              const wanted=String(email||'').trim().toLowerCase();
              const entity=
                list.find(x=>String(x?.EntityData?.Email||x?.Description||'').trim().toLowerCase()===wanted) ||
                list[0];
          
              if(!entity){
                throw new Error('SharePoint PeoplePicker lieferte keinen Benutzer.');
              }
          
              return entity;
            }
          
            function sharingResult(data,email){
              const r=
                data?.ShareObject ??
                data?.d?.ShareObject ??
                data?.d ??
                data ??
                {};
          
              const invitedRaw=r?.InvitedUsers ?? r?.invitedUsers ?? [];
              const invited=Array.isArray(invitedRaw)
                ? invitedRaw.map(v=>String(v||'').trim()).filter(Boolean)
                : [];
          
              const errorMessage=String(
                r?.ErrorMessage ??
                r?.errorMessage ??
                ''
              ).trim();
          
              const statusRaw=r?.StatusCode ?? r?.statusCode;
              const statusCode=(statusRaw===undefined||statusRaw===null||statusRaw==='')
                ? null
                : Number(statusRaw);
          
              const requested=String(email||'').trim().toLowerCase();
              const listed=invited.some(v=>String(v||'').trim().toLowerCase()===requested);
          
              return {
                ok:!errorMessage && (statusCode===null || statusCode===0),
                statusCode,
                errorMessage,
                invitedUsers:invited,
                requestedEmail:email,
                emailConfirmed:listed
              };
            }
          
            async function shareSite(name,email,sendEmail=true){
              const w=webUrl();
              const group=await associatedMemberGroup();
              const resolved=await resolvePeoplePicker(email);
          
              const entityData={
                ...(resolved?.EntityData||{}),
                Email:resolved?.EntityData?.Email||email
              };
          
              const people=JSON.stringify([{
                Key:resolved?.Key||email,
                Description:resolved?.Description||email,
                DisplayText:resolved?.DisplayText||name||email,
                EntityType:resolved?.EntityType||'User',
                ProviderDisplayName:resolved?.ProviderDisplayName||'',
                ProviderName:resolved?.ProviderName||'',
                IsResolved:resolved?.IsResolved!==false,
                EntityData:entityData,
                MultipleMatches:Array.isArray(resolved?.MultipleMatches)?resolved.MultipleMatches:[]
              }]);
          
              const body={
                url:w,
                peoplePickerInput:people,
                roleValue:'group:'+group.Id,
                groupId:group.Id,
                propagateAcl:false,
                sendEmail:!!sendEmail,
                includeAnonymousLinkInEmail:false,
                emailSubject:'Einladung zu DispoLux',
                emailBody:'Sie wurden für DispoLux freigeschaltet.',
                useSimplifiedRoles:true
              };
          
              const raw=await postJson(w+'/_api/SP.Web.ShareObject',body);
              const result=sharingResult(raw,email);
              result.peoplePickerKey=resolved?.Key||'';
              result.peoplePickerResolved=resolved?.IsResolved!==false;
              window.dp151LastInviteResult=result;
          
              if(!result.ok){
                throw new Error(
                  result.errorMessage ||
                  ('SharePoint meldet Status '+String(result.statusCode))
                );
              }
          
              return result;
            }
          
            async function ensureOrInvite"""
          
          t=share_pat.sub(share_replacement,t,count=1)
          
          # Der 022B-Button soll das echte SharingResult anzeigen.
          button_pat=re.compile(
              r"(?P<indent>[ \t]*)await window\.dp151SendEmployeeInvite\(name,email\);"
              r"[ \t]*\n[ \t]*dp20dStatus\('Einladung an '\+email\+' wurde ausgelöst\.'\);"
          )
          
          button_match=button_pat.search(t)
          if not button_match:
              raise SystemExit("DLB-022D: Einladungs-Handler aus 022B nicht gefunden.")
          
          indent=button_match.group('indent')
          new_button=(
              indent+"const inviteResult=await window.dp151SendEmployeeInvite(name,email);\n"+
              indent+"if(inviteResult?.emailConfirmed){\n"+
              indent+"  dp20dStatus('SharePoint bestätigt die Einladung an '+email+'.');\n"+
              indent+"}else{\n"+
              indent+"  const code=inviteResult?.statusCode;\n"+
              indent+"  const users=Array.isArray(inviteResult?.invitedUsers)?inviteResult.invitedUsers.join(', '):'';\n"+
              indent+"  dp20dStatus(\n"+
              indent+"    'Zugriff wurde verarbeitet, aber SharePoint bestätigt keine Einladungs-E-Mail.'+\n"+
              indent+"    (code!==null&&code!==undefined?' Status '+code+'.':'')+\n"+
              indent+"    (users?' InvitedUsers: '+users:''),\n"+
              indent+"    true\n"+
              indent+"  );\n"+
              indent+"}"
          )
          
          t=button_pat.sub(lambda _:new_button,t,count=1)
          
          handler_pos=t.find("const inviteResult=await window.dp151SendEmployeeInvite(name,email);")
          if handler_pos<0:
              raise SystemExit("DLB-022F: erzeugter Einladungs-Handler nicht gefunden.")
          handler_probe=t[handler_pos:handler_pos+1600]
          if "\\n" in handler_probe:
              raise SystemExit("DLB-022F: sichtbare \\n-Zeichen im Einladungs-Handler gefunden.")
          
          
          # Auch beim Neuanlegen keine pauschale Erfolgsaussage mehr.
          old_create="status(name+' wurde angelegt; die Einladung wurde ausgelöst.');"
          new_create="""{
                const r=window.dp151LastInviteResult;
                if(r?.emailConfirmed){
                  status(name+' wurde angelegt. SharePoint bestätigt die Einladung an '+email+'.');
                }else{
                  status(
                    name+' wurde angelegt. Zugriff ist gesetzt, aber SharePoint bestätigt keine Einladungs-E-Mail.',
                    true
                  );
                }
              }"""
          
          if old_create in t:
              t=t.replace(old_create,new_create,1)
          
          patch_marker="""/* DP_DLB_022D_1_5_1_12_MITARBEITER_EINLADUNG_DIAGNOSE_FIX_BEGIN */
          /*
            Einladungspfad:
            1. E-Mail über SharePoint ClientPeoplePickerResolveUser auflösen.
            2. Aufgelöstes Entity an SP.Web.ShareObject übergeben.
            3. SharingResult/InvitedUsers auswerten und im UI sichtbar melden.
          */
          /* DP_DLB_022D_1_5_1_12_MITARBEITER_EINLADUNG_DIAGNOSE_FIX_END */
          """
          
          t=t.replace(marker,patch_marker+"\n"+marker,1)
          p.write_text(t,encoding="utf-8",newline="\n")
          print("DLB-022D-1.5.1.12: PeoplePicker + Einladungsdiagnose eingebaut; Syntax-Fix 022F aktiv.")
          PY_DLB22D

          grep -Fq "DP_DLB_022D_1_5_1_12_MITARBEITER_EINLADUNG_DIAGNOSE_FIX_BEGIN" dispopilot-online-efd.html
          grep -Fq "clientPeoplePickerResolveUser" dispopilot-online-efd.html
          grep -Fq "emailConfirmed" dispopilot-online-efd.html
          grep -Fq "SharePoint bestätigt keine Einladungs-E-Mail" dispopilot-online-efd.html

      - name: Apply DLB-022G-1.5.1.15 GRAPH EINLADUNG
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_DLB22G'
          from pathlib import Path
          import re

          p=Path("dispopilot-online-efd.html")
          if not p.exists():
              raise SystemExit("DLB-022G: dispopilot-online-efd.html fehlt.")

          t=p.read_text(encoding="utf-8")
          marker="/* DP13_PATCH_END */"

          for required in [
              "DP_DLB_020A_1_5_1_0_MITARBEITERVERWALTUNG_BEGIN",
              "DP_DLB_022B_1_5_1_10_MITARBEITER_EINLADUNG_FIX_BEGIN",
              "DP_DLB_022D_1_5_1_12_MITARBEITER_EINLADUNG_DIAGNOSE_FIX_BEGIN"
          ]:
              if required not in t:
                  raise SystemExit("DLB-022G: erforderliche Basis fehlt: "+required)

          if "DP_DLB_022G_1_5_1_15_GRAPH_EINLADUNG_BEGIN" in t:
              raise SystemExit("DLB-022G: Patch bereits vorhanden.")

          # Den bisherigen SharePoint-Mailversand ersetzen:
          # - SharePoint setzt nur noch den Zugriff (sendEmail=false)
          # - Microsoft Graph erzeugt und versendet die B2B-Einladung.
          pat=re.compile(
              r"  async function ensureOrInvite\(name,email\)\{.*?"
              r"\n\s*window\.dp151SendEmployeeInvite=async function\(name,email\)\{.*?"
              r"\n\s*\};"
              r"\n\s*async function createListItem",
              re.S
          )

          m=pat.search(t)
          if not m:
              raise SystemExit("DLB-022G: ensureOrInvite/dp151SendEmployeeInvite-Block nicht gefunden.")

          replacement=r"""  function dpGraphInvite(name,email){
              const requestId='invite-'+Date.now()+'-'+Math.floor(Math.random()*1000000);

              return new Promise((resolve,reject)=>{
                let finished=false;

                const done=(fn,value)=>{
                  if(finished)return;
                  finished=true;
                  clearTimeout(timer);
                  window.removeEventListener('message',handler);
                  fn(value);
                };

                const handler=(event)=>{
                  const data=event?.data;
                  if(!data || data.type!=='DISPOLUX_GRAPH_INVITE_RESULT')return;
                  if(String(data.requestId||'')!==requestId)return;

                  if(data.ok){
                    done(resolve,{
                      ok:true,
                      transport:'Microsoft Graph',
                      emailConfirmed:true,
                      status:data.status||'',
                      invitedUserEmailAddress:data.invitedUserEmailAddress||email,
                      inviteRedeemUrl:data.inviteRedeemUrl||''
                    });
                  }else{
                    done(reject,new Error(data.error||'Microsoft Graph konnte die Einladung nicht versenden.'));
                  }
                };

                const timer=setTimeout(
                  ()=>done(reject,new Error('Microsoft Graph Einladung: Zeitüberschreitung.')),
                  30000
                );

                window.addEventListener('message',handler);
                parent.postMessage({
                  type:'DISPOLUX_GRAPH_INVITE',
                  requestId,
                  name:String(name||'').trim(),
                  email:String(email||'').trim()
                },'*');
              });
            }

            async function ensureOrInvite(name,email){
              // Zugriff in SharePoint setzen, aber keine SharePoint-Mail mehr anfordern.
              await shareSite(name,email,false);

              // Die eigentliche Einladungs-E-Mail kommt über Microsoft Graph.
              const inviteResult=await dpGraphInvite(name,email);
              window.dp151LastInviteResult=inviteResult;

              let last=null;
              for(let i=0;i<7;i++){
                try{return await ensureUser(email);}catch(e){last=e;}
                await new Promise(r=>setTimeout(r,500+i*350));
              }
              throw last||new Error('Microsoft-Benutzer konnte nach der Einladung nicht aufgelöst werden.');
            }

            window.dp151SendEmployeeInvite=async function(name,email){
              const result=await dpGraphInvite(name,email);
              window.dp151LastInviteResult=result;
              return result;
            };

            async function createListItem"""

          t=pat.sub(replacement,t,count=1)

          # UI-Texte auf den tatsächlichen Versandweg umstellen.
          t=t.replace(
              "SharePoint bestätigt die Einladung an '+email+'.",
              "Microsoft Graph bestätigt die Einladung an '+email+'."
          )
          t=t.replace(
              "Zugriff wurde verarbeitet, aber SharePoint bestätigt keine Einladungs-E-Mail.",
              "Microsoft Graph hat keine Einladungs-E-Mail bestätigt."
          )
          t=t.replace(
              "SharePoint bestätigt die Einladung an '+email+'.');",
              "Microsoft Graph bestätigt die Einladung an '+email+'.');"
          )
          t=t.replace(
              "Zugriff ist gesetzt, aber SharePoint bestätigt keine Einladungs-E-Mail.",
              "Zugriff ist gesetzt, aber Microsoft Graph bestätigt keine Einladungs-E-Mail."
          )

          patch_marker="""/* DP_DLB_022G_1_5_1_15_GRAPH_EINLADUNG_BEGIN */
          /*
            SharePoint: Benutzerzugriff / Gruppenfreigabe.
            Microsoft Graph /invitations: B2B-Einladung + E-Mail.
            Die beiden Aufgaben sind damit bewusst getrennt.
          */
          /* DP_DLB_022G_1_5_1_15_GRAPH_EINLADUNG_END */
          """

          if t.count(marker)!=1:
              raise SystemExit(f"DLB-022G: DP13-Endmarker {t.count(marker)}x gefunden statt 1x.")
          t=t.replace(marker,patch_marker+"\n"+marker,1)

          p.write_text(t,encoding="utf-8",newline="\n")
          print("DLB-022G-1.5.1.15: Einladungs-E-Mail auf Microsoft Graph umgestellt.")
          PY_DLB22G

          grep -Fq "DP_DLB_022G_1_5_1_15_GRAPH_EINLADUNG_BEGIN" dispopilot-online-efd.html
          grep -Fq "DISPOLUX_GRAPH_INVITE" dispopilot-online-efd.html
          grep -Fq "await shareSite(name,email,false);" dispopilot-online-efd.html
          grep -Fq "Microsoft Graph bestätigt die Einladung" dispopilot-online-efd.html

      - name: Apply DLB-022H-1.5.1.16 PeoplePicker + Fahrername Fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_DLB22H'
          from pathlib import Path

          p=Path("dispopilot-online-efd.html")
          if not p.exists():
              raise SystemExit("DLB-022H: dispopilot-online-efd.html fehlt.")

          t=p.read_text(encoding="utf-8")
          marker="/* DP13_PATCH_END */"

          for required in [
              "DP_DLB_022D_1_5_1_12_MITARBEITER_EINLADUNG_DIAGNOSE_FIX_BEGIN",
              "DP_DLB_022G_1_5_1_15_GRAPH_EINLADUNG_BEGIN"
          ]:
              if required not in t:
                  raise SystemExit("DLB-022H: erforderliche Basis fehlt: "+required)

          if "DP_DLB_022H_1_5_1_16_PEOPLEPICKER_FAHRERNAME_FIX_BEGIN" in t:
              raise SystemExit("DLB-022H: Patch bereits vorhanden.")

          # 1) PeoplePicker-Antwort robust lesen.
          picker_start=t.find("    const raw=\n      data?.ClientPeoplePickerResolveUser ??")
          picker_end=t.find("\n\n    if(!Array.isArray(list)||!list.length){",picker_start)
          if picker_start<0 or picker_end<0:
              raise SystemExit("DLB-022H: PeoplePicker-Parser aus 022D nicht gefunden.")

          new_picker="""    const raw=
              data?.ClientPeoplePickerResolveUser ??
              data?.d?.ClientPeoplePickerResolveUser ??
              data?.raw ??
              data;

            let list=[];
            try{
              let parsed=raw;
              // SharePoint liefert diesen Endpunkt je nach OData-Antwortform als
              // Array, JSON-String oder sogar doppelt serialisierten JSON-String.
              for(let i=0;i<3 && typeof parsed==='string';i++){
                const s=parsed.trim();
                if(!s)break;
                parsed=JSON.parse(s);
                if(parsed && !Array.isArray(parsed) && typeof parsed==='object'){
                  parsed=
                    parsed?.ClientPeoplePickerResolveUser ??
                    parsed?.d?.ClientPeoplePickerResolveUser ??
                    parsed?.raw ??
                    parsed;
                }
              }
              list=Array.isArray(parsed)?parsed:[];
            }catch(e){
              const preview=String(data?.raw ?? raw ?? '').replace(/\\s+/g,' ').slice(0,220);
              throw new Error('SharePoint PeoplePicker-Antwort nicht lesbar'+(preview?': '+preview:''));
            }"""
          # Die Einrückung des JS-Blocks wieder auf das bestehende Niveau bringen.
          new_picker='\n'.join(('    '+line if i else line) for i,line in enumerate(new_picker.splitlines()))
          t=t[:picker_start]+new_picker+t[picker_end:]

          # 2) Reihenfolge korrigieren: zuerst Graph-B2B-Einladung, dann SharePoint.
          flow_start=t.find("  async function ensureOrInvite(name,email){")
          flow_end=t.find("\n\n  window.dp151SendEmployeeInvite=async function(name,email){",flow_start)
          if flow_start<0 or flow_end<0:
              raise SystemExit("DLB-022H: Graph/SharePoint-Ablauf aus 022G nicht gefunden.")

          new_flow="""  async function ensureOrInvite(name,email){
            // Zuerst B2B-Gast anlegen/einladen. Erst danach kann SharePoint ihn
            // zuverlässig auflösen und der Mitgliedergruppe zuordnen.
            const inviteResult=await dpGraphInvite(name,email);
            window.dp151LastInviteResult=inviteResult;

            let user=null;
            let last=null;
            for(let i=0;i<9;i++){
              try{
                user=await ensureUser(email);
                break;
              }catch(e){
                last=e;
                await new Promise(r=>setTimeout(r,650+i*400));
              }
            }
            if(!user){
              throw last||new Error('Microsoft-Benutzer konnte nach der Einladung nicht aufgelöst werden.');
            }

            // Danach nur den SharePoint-Zugriff setzen; keine zweite Mail versenden.
            await shareSite(name,email,false);
            return user;
          }"""
          new_flow='\n'.join(('  '+line if i else line) for i,line in enumerate(new_flow.splitlines()))
          t=t[:flow_start]+new_flow+t[flow_end:]

          # 3) Sichtbarer Fahrername: operative DispoLux-Bezeichnung vor dem
