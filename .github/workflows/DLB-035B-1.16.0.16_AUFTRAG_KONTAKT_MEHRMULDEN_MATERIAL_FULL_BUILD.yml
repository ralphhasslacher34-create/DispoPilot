          Auftrags-/Muldenlogik;Tauschen trennt Ist-Inhalt Alt-Mulde und Plan-Inhalt Neu-Mulde;DLB-035B;Umgesetzt
          CSV

          echo "035B: Produktions-JS syntaktisch gültig; SPPKG vorhanden; beide Themen und 034D-Basis geprüft."

