          python3 - <<'PY_PATCH_035B'
          from pathlib import Path
          import base64
          import re
          import subprocess

          patch=base64.b64decode(Path('/tmp/dlb035b_patch.b64').read_text()).decode('utf-8')
          patch_file=Path('/tmp/dlb035b_patch.js')
          patch_file.write_text(patch,encoding='utf-8',newline='\n')
          subprocess.run(['node','--check',str(patch_file)],check=True)

          root=Path('spfx-build/src/webparts')
          files=[p for p in root.rglob('*') if p.is_file() and p.suffix in {'.js','.ts','.tsx'}]
          base_marker='DP_DLB_034D_1_16_0_15_DP_DATA_STAMMDATEN_PERSISTENZ_BEGIN'
          new_marker='DP_DLB_035B_1_16_0_16_AUFTRAG_KONTAKT_MEHRMULDEN_MATERIAL_BEGIN'
          end_marker='/* DP13_PATCH_END */'

          required_existing=[
              base_marker,
              'DP_DLB_033C_1_16_0_14_STELLEN_MATERIAL_BEGIN',
              'DP_DLB_031G_1_16_0_6_STANDORTE_NAVIGATION_BEGIN',
              'function dpABRenderBinFields',
              'function dpA3RenderConfirm',
              'function dpA3Value',
              'function dpA3ExistingChanged',
              'function applyBinMovement',
              'function openCustomer',
              'function saveCustomer',
              'function openDetail',
              'function dp13AddNotice',
          ]

          candidates=[]
          for p in files:
              src=p.read_text(encoding='utf-8')
              if end_marker in src and all(x in src for x in required_existing):
                  candidates.append((p,src))

          if len(candidates)!=1:
              raise SystemExit(
                  '035B: erwartete genau eine vollständige 034D-App-Runtime, gefunden: '
                  +repr([str(p) for p,_ in candidates])
              )

          runtime,src=candidates[0]
          if new_marker in src:
              raise SystemExit('035B: Patch bereits vorhanden.')
          if src.count(end_marker)!=1:
              raise SystemExit(f'035B: DP13-Endmarker {src.count(end_marker)}x statt 1x.')

          # Der Patch darf die bestehende 034D-Persistenz weder ersetzen noch umgehen.
          if src.count(base_marker)!=1:
              raise SystemExit(f'035B: 034D-Basismarker {src.count(base_marker)}x statt 1x.')

          src=src.replace(end_marker,patch+'\n\n'+end_marker,1)
          runtime.write_text(src,encoding='utf-8',newline='\n')

          if runtime.suffix=='.js':
              subprocess.run(['node','--check',str(runtime)],check=True)

          print('035B: Patch in geprüfte 034D-Runtime eingefügt:',runtime)
          PY_PATCH_035B

      - name: Set 035B SPFx version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_VER_035B'
          from pathlib import Path
          p=Path('spfx-build/config/package-solution.json')
          src=p.read_text(encoding='utf-8')
          if src.count('1.3.6.109')!=1:
              raise SystemExit(
                  f"035B: erwartete 034D-SPFx-Version 1.3.6.109 genau einmal, gefunden {src.count('1.3.6.109')}x."
              )
          p.write_text(src.replace('1.3.6.109','1.3.6.110',1),encoding='utf-8',newline='\n')
          PY_VER_035B

      - name: Validate 035B source before build
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_VALIDATE_035B'
          from pathlib import Path
          import json
          import re
          import subprocess

          root=Path('spfx-build/src/webparts')
          files=[p for p in root.rglob('*') if p.is_file() and p.suffix in {'.js','.ts','.tsx'}]
          begin='DP_DLB_035B_1_16_0_16_AUFTRAG_KONTAKT_MEHRMULDEN_MATERIAL_BEGIN'
          end='DP_DLB_035B_1_16_0_16_AUFTRAG_KONTAKT_MEHRMULDEN_MATERIAL_END'
          hits=[]
          all_text=[]
          for p in files:
              src=p.read_text(encoding='utf-8')
              all_text.append(src)
              if begin in src:
                  hits.append((p,src))

          if len(hits)!=1:
              raise SystemExit(
                  f'035B VALIDIERUNG: Patch in {len(hits)} Dateien statt genau 1 gefunden: '
                  +repr([str(p) for p,_ in hits])
              )

          runtime,src=hits[0]
          if src.count(begin)!=1 or src.count(end)!=1:
              raise SystemExit('035B VALIDIERUNG: Patchmarker nicht eindeutig.')
          frag=src.split(begin,1)[1].split(end,1)[0]
          combined='\n'.join(all_text)

          # Thema 1: Baustellenkontakt im Auftrag + Kunden-Telefon als Fallback.
          contact_required=[
              'dp35InstallCustomerPhoneField',
              'id="cPhone"',
              'Telefon Kunde',
              'Telefon Baustelle',
              'dp35OrderContactCard',
              'dp35ContactCard',
              '📞 Anrufen',
              'dp35NavigateSite',
              '__DISPOLUX_031G?.navigateSite',
              'Keine postalische Adresse hinterlegt.',
              'Maps-Standort hinterlegt',
          ]
          missing=[x for x in contact_required if x not in frag]
          if missing:
              raise SystemExit('035B VALIDIERUNG Kontakt fehlt: '+', '.join(missing))

          # Thema 2: geplante und tatsächliche Inhalte sind eigene Felder je Mulde.
          material_required=[
              'plannedBinMaterials',
              'actualBinMaterials',
              'actualExistingBinMaterials',
              'Geplanter Inhalt je gestellter Mulde',
              'Tatsächlicher Inhalt',
              'dp35PlanMaterialChanged',
              "target.dataset.dp35Linked==='1'",
              "src.dataset.dp35Linked='0'",
              'dp35ApplyPerBinMaterials',
              'dp35BaseA3RefreshType',
              "o.task==='Tauschen'",
              "movement.material=material",
              "if(b)b.material=o.disposed?'':material",
              'actualMaterialConfirmedAt',
              'actualMaterialConfirmedBy',
          ]
          missing=[x for x in material_required if x not in frag]
          if missing:
              raise SystemExit('035B VALIDIERUNG Mehrmulden-Material fehlt: '+', '.join(missing))

          # Sicherheitslogik: keine stille Ausführung, falls Material-UI nicht geladen wurde.
          for safety in (
              'Die Erfassung des tatsächlichen Inhalts ist nicht geladen.',
              'Die Materialerfassung ist unvollständig.',
              "if(!panel)",
          ):
              if safety not in frag:
                  raise SystemExit('035B VALIDIERUNG Sicherheitsprüfung fehlt: '+safety)

          # Reine Änderung an Mulde 2 ff. muss weiterhin Fahrerkommunikation auslösen,
          # ohne bei anderen Änderungen eine zweite Meldung zu erzeugen.
          notice_required=[
              'noticesBefore',
              'noticesAfter===noticesBefore',
              "typeof dp13AddNotice==='function'",
              'geplanten Inhalt einer oder mehrerer Mulden geändert',
          ]
          missing=[x for x in notice_required if x not in frag]
          if missing:
              raise SystemExit('035B VALIDIERUNG Änderungsmeldung fehlt: '+', '.join(missing))
          if 'dp35BaseDp13Changed' in frag:
              raise SystemExit('035B VALIDIERUNG: alte wirkungslose dp13Changed-Übersteuerung ist noch enthalten.')

          # Bewährte Basis muss erhalten bleiben.
          basis_required=[
              'DP_DLB_034D_1_16_0_15_DP_DATA_STAMMDATEN_PERSISTENZ_BEGIN',
              'DP_DLB_033C_1_16_0_14_STELLEN_MATERIAL_BEGIN',
              'DP_DLB_031G_1_16_0_6_STANDORTE_NAVIGATION_BEGIN',
              'DP_DLB_032E_1_16_0_11_TD005_FAHRERAUSWAHL_BEGIN',
              'dp32BDriverButton',
              'DispoLux_Backup',
              'DP_DLB_030AE_1_12_1_24_DPB_AUS_DP_DATA_ENTFERNT_BEGIN',
              'DP_DLB_030AH_1_12_1_27_BACKUP_30MIN_FILES_BEGIN',
          ]
          missing=[x for x in basis_required if x not in combined]
          if missing:
              raise SystemExit('035B VALIDIERUNG Basis fehlt: '+', '.join(missing))
          if 'await dp28dBackup(fields, rows, force);' in combined:
              raise SystemExit('035B VALIDIERUNG: alter DPB-Schreibaufruf ist wieder aktiv.')

          # 034D-Stammdatenpersistenz muss weiterhin in allen sectionKeys-Definitionen stehen.
          sections=list(re.finditer(r"sectionKeys\s*:\s*\[([^\]]*)\]",src))
          if not sections:
              raise SystemExit('035B VALIDIERUNG: keine sectionKeys in aktueller Runtime gefunden.')
          for idx,sm in enumerate(sections,1):
              keys=set(re.findall(r"['\"]([^'\"]+)['\"]",sm.group(1)))
              miss=[k for k in ('warehouses','transportLocations') if k not in keys]
              if miss:
                  raise SystemExit(f'035B VALIDIERUNG: sectionKeys #{idx} unvollständig: {miss}')

          pkg=Path('spfx-build/config/package-solution.json')
          data=json.loads(pkg.read_text(encoding='utf-8'))
          version=data.get('solution',{}).get('version','')
          if version!='1.3.6.110':
              raise SystemExit(f'035B VALIDIERUNG: SPFx-Version {version!r} statt 1.3.6.110')

          if runtime.suffix=='.js':
              subprocess.run(['node','--check',str(runtime)],check=True)

          print('035B VALIDIERUNG OK')
          print('- Baustellenadresse + Telefon + Anruf + Navigation enthalten')
          print('- Kunden-Telefon als gekennzeichneter Fallback enthalten')
          print('- geplanter Inhalt je gestellter Mulde getrennt gespeichert')
          print('- tatsächlicher Inhalt je abgeholter/geleerter Mulde getrennt gespeichert')
          print('- Tauschen trennt abgeholten Ist-Inhalt und neuen Plan-Inhalt')
          print('- 034D Stammdaten-Persistenz und Backup-Basis unverändert erhalten')
          PY_VALIDATE_035B

      - name: Build and package 035B
        shell: bash
        run: |
          set -euo pipefail

          # Verschachtelte Vor-Builds hinterlassen gehashte Alt-Bundles. Nur erzeugte
          # Build-Ausgaben löschen; src/ und Repository-Daten bleiben unangetastet.
          rm -rf spfx-build/release spfx-build/temp/deploy spfx-build/sharepoint/solution

          (cd spfx-build && npx heft build --production)
          (cd spfx-build && npx heft package-solution --production)

          rm -rf artifact/UPLOAD_TO_SITEASSETS artifact/UPLOAD_TO_APP_CATALOG
          mkdir -p artifact/UPLOAD_TO_SITEASSETS artifact/UPLOAD_TO_APP_CATALOG

          PKG=$(find spfx-build/sharepoint/solution -maxdepth 1 -type f -name '*.sppkg' | head -n1)
          test -n "$PKG"
          cp "$PKG" artifact/UPLOAD_TO_APP_CATALOG/DispoPilot_Online_V1.3_SPFX_FINAL.sppkg

          if [ -d spfx-build/release/assets ]; then
            cp -a spfx-build/release/assets/. artifact/UPLOAD_TO_SITEASSETS/
          elif [ -d spfx-build/temp/deploy ]; then
            cp -a spfx-build/temp/deploy/. artifact/UPLOAD_TO_SITEASSETS/
          else
            echo "035B: Keine SPFx Asset-Ausgabe gefunden." >&2
            exit 1
          fi

          if [ -f .dpx14_icon_b64 ]; then
            python3 - <<'PY_ICON_035B'
          from pathlib import Path
          import base64
          Path('artifact/UPLOAD_TO_SITEASSETS/DispoLux_DL_Icon_48.png').write_bytes(
              base64.b64decode(Path('.dpx14_icon_b64').read_text().strip())
          )
          PY_ICON_035B
          fi

      - name: Validate emitted 035B package
        shell: bash
        run: |
          set -euo pipefail

          COUNT=0
          while IFS= read -r -d '' JS; do
            test -s "$JS"
            node --check "$JS"
            COUNT=$((COUNT+1))
          done < <(find artifact/UPLOAD_TO_SITEASSETS -maxdepth 1 -type f -name '*.js' -print0)
          test "$COUNT" -gt 0

          PKG=artifact/UPLOAD_TO_APP_CATALOG/DispoPilot_Online_V1.3_SPFX_FINAL.sppkg
          test -s "$PKG"

          python3 - <<'PY_FINAL_035B'
          from pathlib import Path
          import re

          assets=Path('artifact/UPLOAD_TO_SITEASSETS')
          js_files=list(assets.glob('*.js'))
          marker='__DISPOLUX_035B'
          current=[]
          for p in js_files:
              s=p.read_text(encoding='utf-8')
              if marker in s:
                  current.append((p,s))

          if len(current)!=1:
              raise SystemExit(
                  '035B FINAL: erwartet genau einen aktuellen Produktionsbundle mit '
                  f'{marker}; gefunden {len(current)}: {[p.name for p,_ in current]}'
              )

          current_path,current_src=current[0]
          # Nur stabile, im Produktionsbundle erwartbare Kennzeichen prüfen.
          # Lokale Funktionsnamen wie dp35ApplyPerBinMaterials dürfen durch
          # Webpack/Terser umbenannt werden und sind deshalb KEIN Bundle-Kriterium.
          required=[
              '__DISPOLUX_034D',
              '__DISPOLUX_035B',
              'plannedBinMaterials',
              'actualBinMaterials',
              'actualExistingBinMaterials',
              'Telefon Baustelle',
              'Telefon Kunde',
              'Anrufen',
              'Geplanter Inhalt je gestellter Mulde',
              'Tatsächlicher Inhalt',
              'applyPerBinMaterials',
              'Tauschen – gestellt',
              'Tauschen – abgeholt',
              'dp32BDriverButton',
              'DispoLux_Backup',
              'Standort setzen',
              'Navigation',
          ]
          missing=[x for x in required if x not in current_src]
          if missing:
              raise SystemExit('035B FINAL: Pflichtbestandteile fehlen im aktuellen Bundle: '+', '.join(missing))

          sections=list(re.finditer(r"sectionKeys\s*:\s*\[([^\]]*)\]",current_src))
          if not sections:
              raise SystemExit('035B FINAL: keine sectionKeys im aktuellen Produktionsbundle gefunden.')
          for idx,sm in enumerate(sections,1):
              keys=set(re.findall(r"['\"]([^'\"]+)['\"]",sm.group(1)))
              miss=[k for k in ('warehouses','transportLocations') if k not in keys]
              if miss:
                  raise SystemExit(
                      f'035B FINAL: {current_path.name}, sectionKeys #{idx} unvollständig: {miss}'
                  )

          stale=[]
          for p in js_files:
              if p==current_path:
                  continue
              s=p.read_text(encoding='utf-8')
              if 'sectionKeys' in s and 'DP_Data' in s:
                  stale.append(p.name)
          if stale:
              raise SystemExit('035B FINAL: alte DP_Data-WebPart-Bundles im Auslieferungsordner: '+repr(stale))

          print('035B FINAL OK')
          print('- aktueller Produktionsbundle:',current_path.name)
          print('- Kontakt-/Navigationsfunktionen enthalten')
          print('- Plan-/Ist-Materialfelder je Mulde enthalten')
          print('- warehouses + transportLocations weiterhin persistent')
          print('- keine alten DP_Data-WebPart-Bundles im Auslieferungsordner')
          PY_FINAL_035B

          cat > artifact/REIHENFOLGE.txt <<'TXT'
          DLB-035B-1.16.0.16 · AUFTRAG KONTAKT + MEHRMULDEN-MATERIAL · SPFx 1.3.6.110

          Basis:
          - erfolgreicher und praktisch getesteter DLB-034D-1.16.0.15
          - Lager-/Transportort-Persistenz aus 034D bleibt erhalten
          - Standort/Navigation aus 031G bleibt erhalten
          - stabile Fahrerauswahl aus 032E bleibt erhalten
          - Stellen / geplantes Material aus 033C wird auf Material je Muldenposition erweitert
          - 030AE DPB-Stop und 030AH 30-Minuten-Dateisicherung bleiben unverändert

          Thema 1 · Baustellenadresse / Telefon im Auftrag:
          - Baustellenadresse ist im Auftrag sichtbar; Navigation bleibt separate Aktion.
          - Baustellen-Telefon wird als "Telefon Baustelle" angezeigt.
          - Fehlt die Baustellen-Telefonnummer, wird die Kundennummer als "Telefon Kunde" angezeigt.
          - Kundenstamm erhält dazu ein eigenes Telefonfeld.
          - "Anrufen" verwendet genau die sichtbar gekennzeichnete Nummer.
          - Nur Maps-Link ohne postalische Adresse wird als "Maps-Standort hinterlegt" kenntlich gemacht.

          Thema 2 · Inhalt je Mulde:
          - Stellen/Liefern/Tauschen: geplanter Inhalt wird je neu gestellter Mulde gespeichert.
          - Bei neuer Mehrmuldenplanung übernimmt Mulde 2 ff. zunächst den Inhalt von Mulde 1.
          - Eine manuell geänderte Mulde wird bei späterer Änderung von Mulde 1 nicht überschrieben.
          - Abholen/Leeren: tatsächlicher Inhalt wird beim Abschluss je Mulde erfasst.
          - Tauschen: abgeholte Mulde hat tatsächlichen Inhalt; neu gestellte Mulde hat getrennten geplanten Inhalt.
          - "tatsächlich entleert/entsorgt": Muldenbestand wird danach inhaltlich leer, Bewegungshistorie behält den tatsächlichen Inhalt.
          - Bestehendes Einzelfeld "material" bleibt nur als Rückwärtskompatibilität erhalten.

          Pflicht-Praxistest nach Installation:
          1. Auftrag mit Baustelle + Baustellen-Telefon öffnen: Adresse sichtbar, "Telefon Baustelle", Anrufen und Navigation testen.
          2. Baustelle ohne Telefon, Kunde mit Telefonnummer: "Telefon Kunde" muss sichtbar sein und Anrufen muss diese Nummer verwenden.
          3. Stellen mit 3 Mulden: Mulde 1 = Bauschutt. Mulde 2 und 3 müssen zunächst Bauschutt übernehmen.
          4. Mulde 2 auf Holz ändern; danach Mulde 1 auf Siedlungsabfall ändern: Mulde 2 muss Holz bleiben, Mulde 3 muss Siedlungsabfall übernehmen.
          5. Auftrag speichern, Auto-Sync abwarten, neu laden: alle geplanten Inhalte müssen positionsrichtig erhalten bleiben.
          6. Tauschen mit 2 Positionen: abgeholte Mulden mit tatsächlichem Inhalt erfassen; neue Mulden mit davon abweichendem geplanten Inhalt prüfen.
          7. Leeren: tatsächlichen Inhalt abweichend von der Planung erfassen und "tatsächlich entleert" setzen. Danach Mulde inhaltlich leer, Bewegungshistorie mit dem tatsächlichen Inhalt.
          8. Abholen ohne "entleert": eingegebener tatsächlicher Inhalt muss an der Mulde erhalten bleiben.
          9. Bestehenden alten Auftrag ohne neue Materialfelder öffnen: Anzeige/Abschluss muss über Legacy-Fallback weiterhin funktionieren.
          10. Lagerplatz-Test aus 034D wiederholen: neuer Lagerplatz muss nach Reload erhalten bleiben.
          TXT

          cat > artifact/DISPOLUX_THEMENREGISTER_ERGAENZUNG_035B.csv <<'CSV'
