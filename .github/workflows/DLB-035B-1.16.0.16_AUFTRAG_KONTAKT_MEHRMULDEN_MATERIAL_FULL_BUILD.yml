name: DLB-035B-1.16.0.16 AUFTRAG KONTAKT MEHRMULDEN MATERIAL FULL BUILD

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Rebuild exact successful DLB-034D basis
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY_RUN_034D_BASE'
          from pathlib import Path
          import subprocess
          import yaml

          wf=Path(".github/workflows/DLB-034D-1.16.0.15_DP_DATA_STAMMDATEN_PERSISTENZ_FULL_BUILD.yml")
          if not wf.exists():
              raise SystemExit("035B: erfolgreicher 034D-Workflow fehlt im Repository.")

          doc=yaml.safe_load(wf.read_text(encoding="utf-8"))
          runs=[(s.get("name",""),s.get("run")) for s in doc["jobs"]["build"]["steps"] if s.get("run")]
          if len(runs)!=6:
              raise SystemExit(f"035B: 034D-Basis erwartet 6 ausführbare Buildschritte, gefunden {len(runs)}.")

          for idx,(name,script) in enumerate(runs,1):
              print(f"===== 035B Basis 034D Schritt {idx}/{len(runs)}: {name} =====")
              runner=Path(f".035b_034d_step_{idx}.sh")
              runner.write_text(script,encoding="utf-8",newline="\n")
              try:
                  subprocess.run(["bash","-euo","pipefail",str(runner)],check=True)
              finally:
                  runner.unlink(missing_ok=True)

          print("035B: erfolgreicher DLB-034D-Stand vollständig rekonstruiert.")
          PY_RUN_034D_BASE

