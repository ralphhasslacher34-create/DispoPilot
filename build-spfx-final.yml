name: Build DispoPilot SPFx FINAL

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'dispopilot-online-app.html'
      - 'prepare-spfx-final.py'
      - '.github/workflows/build-spfx-final.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Check FINAL helper
        run: |
          python3 -m py_compile prepare-spfx-final.py
          grep -q "DispoPilot SPFx FINAL JSONC v1" prepare-spfx-final.py

      - name: Install SPFx CLI
        run: npm install -g @microsoft/spfx-cli@latest

      - name: Scaffold SPFx web part
        run: |
          rm -rf spfx-build
          spfx create             --template webpart-noframework             --library-name dispopilot-online-v13             --component-name "DispoPilot Online"             --component-alias DispoPilotOnline             --component-description "DispoPilot Online Pilot V1.3"             --solution-name dispopilot-online-v13             --target-dir spfx-build             --package-manager npm

      - name: Insert DispoPilot runtime FINAL
        run: python3 prepare-spfx-final.py --app dispopilot-online-app.html --project spfx-build

      - name: Build production bundle
        working-directory: spfx-build
        run: npx heft build --production

      - name: Package SharePoint solution
        working-directory: spfx-build
        run: npx heft package-solution --production

      - name: Collect package
        run: |
          mkdir -p artifact
          PKG=$(find spfx-build/sharepoint/solution -maxdepth 1 -type f -name '*.sppkg' | head -n 1)
          test -n "$PKG"
          cp "$PKG" artifact/DispoPilot_Online_V1.3_SPFX_FINAL.sppkg

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DispoPilot-Online-V1.3-SPFX-FINAL
          path: artifact/DispoPilot_Online_V1.3_SPFX_FINAL.sppkg
          if-no-files-found: error
