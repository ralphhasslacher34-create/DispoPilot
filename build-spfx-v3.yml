name: Build DispoPilot SPFx V3

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'dispopilot-online-app.html'
      - 'prepare-spfx-v3.py'
      - '.github/workflows/build-spfx-v3.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Install SPFx CLI
        run: npm install -g @microsoft/spfx-cli@latest

      - name: Scaffold SPFx web part
        run: |
          rm -rf spfx-build
          spfx create \
            --template webpart-noframework \
            --library-name dispopilot-online-v13 \
            --component-name "DispoPilot Online" \
            --component-alias DispoPilotOnline \
            --component-description "DispoPilot Online Pilot V1.3" \
            --solution-name dispopilot-online-v13 \
            --target-dir spfx-build \
            --package-manager npm

      - name: Insert DispoPilot runtime
        run: python3 prepare-spfx-v3.py --app dispopilot-online-app.html --project spfx-build

      - name: Build production bundle
        working-directory: spfx-build
        run: npx heft build --production

      - name: Package SharePoint solution
        working-directory: spfx-build
        run: npx heft package-solution --production

      - name: Collect package
        run: |
          mkdir -p artifact
          PKG=$(find spfx-build/sharepoint/solution -maxdepth 1 -type f -name '*.sppkg' | head -n 1)
          test -n "$PKG"
          cp "$PKG" artifact/DispoPilot_Online_V1.3_SPFX.sppkg

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DispoPilot-Online-V1.3-SPFX
          path: artifact/DispoPilot_Online_V1.3_SPFX.sppkg
          if-no-files-found: error
